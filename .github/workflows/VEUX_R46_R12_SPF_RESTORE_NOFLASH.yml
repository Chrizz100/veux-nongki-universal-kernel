        \ \"$R44_OUT\" \"$R44_WORK\"\nprintf '%s  %s\\n' '745d80b8502a9beea513a2e7a58bb59272539b7508920d235ce2e79741bda528'\
        \ project/VEUX_R39_R2_MEMORY_ABI_MAIN.zip \\\n '15491bbb02140204a1e3e278d279668edb66ef7fe8052d0decd80f47b1e9a32f'\
        \ project/VEUX_R37_DEVICE_EVIDENCE.zip \\\n '1eb9edcf361e2c5ada4316768ddf3b70e9a4a853fec81b99c8d92d0f10f198eb'\
        \ project/VEUX_OEM_WALT_R26_R2_SYMVERS_SEMANTIC_PROOF_MAIN.zip | sha256sum -c -\ncat > \"$R44_DIR/r42_stock_capture.py\"\
        \ <<'R44_PAYLOAD_r42_stock_capture_py'\n#!/usr/bin/env python3\n\"\"\"R42-R2: read-only capture of Stock\
        \ VEUX GPU cooling node and references.\n\nAll input binaries remain untouched. The output is evidence,\
        \ NOT an applicable patch.\n\"\"\"\nimport argparse\nimport hashlib\nimport io\nimport json\nimport pathlib\n\
        import stat\nimport struct\nimport subprocess\nimport tempfile\nimport zipfile\n\nR39_SHA256 = '745d80b8502a9beea513a2e7a58bb59272539b7508920d235ce2e79741bda528'\n\
        R20_DTB_SHA256 = '42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37'\nSTOCK_GFX = '/soc/qcom,rpm-smd/rpm-regulator-smpa8/gfx-cdev'\n\
        R20_GFX = '/soc/devfreq-vdd-cdev'\n\n\ndef require(condition, label):\n    if not condition:\n        raise\
        \ ValueError(label)\n\n\ndef digest(data):\n    return hashlib.sha256(data).hexdigest()\n\n\ndef members(archive,\
        \ required):\n    \"\"\"Return selected members after checking archive integrity and safe boundaries.\"\"\
        \"\n    with zipfile.ZipFile(archive) as z:\n        infos = z.infolist()\n        names = [x.filename for\
        \ x in infos]\n        require(len(names) == len(set(names)), 'ZIP_DUPLICATE_MEMBERS')\n        require(z.testzip()\
        \ is None, 'ZIP_BAD_CRC')\n        require(len(infos) <= 35, 'ZIP_TOO_MANY_MEMBERS')\n        require(sum(x.file_size\
        \ for x in infos) < 20_000_000, 'ZIP_TOTAL_TOO_LARGE')\n        for info in infos:\n            path = pathlib.PurePosixPath(info.filename)\n\
        \            require(not path.is_absolute() and '..' not in path.parts, 'ZIP_UNSAFE_PATH')\n           \
        \ require(not stat.S_ISLNK(info.external_attr >> 16), 'ZIP_UNSAFE_SYMLINK')\n            require(info.file_size\
        \ < 8_000_000, 'ZIP_MEMBER_TOO_LARGE')\n        require(set(required) <= set(names), 'ZIP_REQUIRED_MISSING')\n\
        \        return {name: z.read(name) for name in required}\n\n\ndef merge(dtb, overlay):\n    with tempfile.TemporaryDirectory(prefix='veux-r42-dtbo-')\
        \ as tmp:\n        tmp = pathlib.Path(tmp)\n        base = tmp / 'base.dtb'\n        over = tmp / 'candidate.dtbo'\n\
        \        merged = tmp / 'merged.dtb'\n        base.write_bytes(dtb)\n        over.write_bytes(overlay)\n\
        \        p = subprocess.run(['fdtoverlay', '-i', str(base), '-o', str(merged), str(over)],\n           \
        \                capture_output=True, timeout=45, check=False)\n        require(p.returncode == 0, 'FDTOVERLAY_FAILED:'\
        \ + p.stderr[:100].decode(errors='replace'))\n        return merged.read_bytes()\n\n\ndef fdt_properties(data):\n\
        \    \"\"\"Parse FDT nodes and raw properties, with strict header and bounds checks.\"\"\"\n    require(len(data)\
        \ >= 40 and len(data) < 8_000_000, 'FDT_SIZE')\n    hdr = struct.unpack_from('>10I', data)\n    magic, total,\
        \ offset_struct, offset_strings, _off_mem, _ver, _last, _boot, size_strings, size_struct = hdr\n    require(magic\
        \ == 0xd00dfeed and 40 <= total <= len(data), 'FDT_HEADER')\n    require(offset_struct >= 40 and offset_struct\
        \ + size_struct <= total, 'FDT_STRUCT_BOUNDS')\n    require(offset_strings >= 40 and offset_strings + size_strings\
        \ <= total, 'FDT_STRING_BOUNDS')\n    nodes = {}\n    stack = []\n    pos = offset_struct\n    end = offset_struct\
        \ + size_struct\n    while pos + 4 <= end:\n        token = struct.unpack_from('>I', data, pos)[0]\n   \
        \     pos += 4\n        if token == 1:  # BEGIN_NODE\n            require(b'\\0' in data[pos:end], 'FDT_UNTERMINATED_NODE')\n\
        \            finish = data.index(b'\\0', pos, end)\n            name = data[pos:finish].decode('utf-8')\n\
        \            pos = (finish + 4) & ~3\n            path = stack[-1].rstrip('/') + '/' + name if stack else\
        \ '/'\n            require(path not in nodes, 'FDT_DUPLICATE_NODE')\n            nodes[path] = {}\n    \
        \        stack.append(path)\n        elif token == 2:  # END_NODE\n            require(bool(stack), 'FDT_UNBALANCED_END')\n\
        \            stack.pop()\n        elif token == 3:  # PROP\n            require(bool(stack) and pos + 8\
        \ <= end, 'FDT_INVALID_PROPERTY_HEADER')\n            length, off = struct.unpack_from('>II', data, pos)\n\
        \            pos += 8\n            require(length < 1_000_000 and pos + length <= end, 'FDT_PROPERTY_BOUNDS')\n\
        \            require(off < size_strings, 'FDT_PROPERTY_STRING_OFFSET')\n            name_start = offset_strings\
        \ + off\n            require(b'\\0' in data[name_start:offset_strings + size_strings], 'FDT_UNTERMINATED_KEY')\n\
        \            key_end = data.index(b'\\0', name_start, offset_strings + size_strings)\n            key =\
        \ data[name_start:key_end].decode('utf-8')\n            require(key not in nodes[stack[-1]], 'FDT_DUPLICATE_PROPERTY')\n\
        \            nodes[stack[-1]][key] = data[pos:pos + length]\n            pos = (pos + length + 3) & ~3\n\
        \        elif token == 4:  # NOP\n            continue\n        elif token == 9:  # END\n            require(not\
        \ stack, 'FDT_UNCLOSED_NODES')\n            return nodes\n        else:\n            raise ValueError('FDT_UNKNOWN_TOKEN')\n\
        \    raise ValueError('FDT_NO_END')\n\n\ndef status(props):\n    return props.get('status', b'okay\\0').rstrip(b'\\\
        0').decode('ascii')\n\n\ndef phandle(props):\n    val = props.get('phandle') or props.get('linux,phandle')\n\
        \    require(val is not None and len(val) == 4, 'INVALID_PROVIDER_PHANDLE')\n    ident = int.from_bytes(val,\
        \ 'big')\n    require(ident != 0, 'INVALID_PROVIDER_PHANDLE_ZERO')\n    return ident\n\n\ndef cooling_maps(tree,\
