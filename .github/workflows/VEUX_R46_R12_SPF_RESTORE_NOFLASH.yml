        \    or report.get('candidate_release_verified') != '5.4.274-qgki'\n    or report.get('config_release_fix',{}).get('expected_candidate_release')\
        \ != '5.4.274-qgki'\n    or len(report.get('config_release_fix',{}).get('changes',[])) != 2\n    or report.get('config_release_verification',{}).get('verified_release')\
        \ != '5.4.274-qgki'\n    or report.get('config_release_verification',{}).get('no_stock_git_id_spoof') is\
        \ not True\n    or len(report.get('config_release_verification',{}).get('artifacts',[])) != 6\n    or report.get('vendor_abi_diagnostic',{}).get('cohort')\
        \ != 'OEM_QGKI_ONLY'\n    or report.get('vendor_abi_diagnostic',{}).get('full_vendor_abi_proven') is not\
        \ False\n    or report.get('vendor_abi_diagnostic',{}).get('status') != 'STOCK_VENDOR_ABI_UNPROVEN_NOFLASH'\n\
        \    or report.get('vendor_abi_proven') is not False\n    or report.get('flash_allowed') is not False):\n\
        \    raise SystemExit('R47_R13_GENUINE_WALT_BUILTIN_FULL_LINK_NOT_PROVEN')\nprint('R46_R6_CONFIG_RELEASE_POSITRON_REMOVED_AND_BUILTIN_LINK_PASS_NOFLASH')\n\
        PY_R47_REBUILT_RESULT\ntest -z \"$(git -C project status --porcelain --untracked-files=all)\"\necho 'R46_R6_CONFIG_RELEASE_CANDIDATE_ONLY;\
        \ OEM_VENDOR_ABI_UNPROVEN; FLASH=NO'\n"
    - name: R47-R13 preserve separate text-only build evidence on failures
      if: ${{ always() && steps.package.outputs.present == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: VEUX-R47-R13-REAL-WALT-RMNET-BUILTIN-ONLY-EVIDENCE-${{ github.run_id }}
        path: ${{ env.R47_REPORT_DIR }}/
        if-no-files-found: warn
        retention-days: 30
    - name: R12 restore complete SPF MM source and perform ARM64 build and 37 module ABI comparison
      shell: bash
      run: 'set -euo pipefail

        python3 -B "$R12_SPF_DIR/Tools/restore_spf.py" build   --source "$R9_SNAPSHOT" --objout "$R13_OBJOUT"   --r6-report
        "$R47_REPORT_DIR/R47_RESULT.json"   --r6-tool "$R47_TOOLS_DIR/Tools/veux_r47_r13_on_r46.py"   --project
        "$GITHUB_WORKSPACE/project" --output "$R12_SPF_OUTPUT"

        '
    - name: R12 preserve actual SPF compiler diagnostics and OEM symbol comparisons
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: VEUX-R46-R12-SPF-MM-BUILD-ABI-NOFLASH-${{ github.run_id }}
        path: '${{ env.R12_SPF_OUTPUT }}/R12_RESULT.json

          ${{ env.R12_SPF_OUTPUT }}/*.log

          ${{ env.R12_SPF_OUTPUT }}/QGKI_*.csv

          ${{ env.R12_SPF_OUTPUT }}/candidate-out/Module.symvers

          ${{ env.R12_SPF_OUTPUT }}/candidate-out/.config

          ${{ env.R12_SPF_OUTPUT }}/candidate-out/System.map'
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 30
    - name: Assert repository unchanged; R20 full-build diagnostic only; NO FLASH
      if: ${{ always() }}
      shell: bash
      run: 'set -euo pipefail

        test "$(git -C project rev-parse HEAD)" = "$GITHUB_SHA"

        test -z "$(git -C project status --porcelain --untracked-files=all)"

        echo ''R20_REPO_UNCHANGED=YES; FULL_BUILD_DIAGNOSTIC=YES; DEVICE_FLASH=NO; VENDOR_ABI=UNPROVEN''

        '
    name: R6 control build then isolated IOMMU plus complete SPF MM restore and OEM ABI
