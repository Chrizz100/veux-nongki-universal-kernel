        python3 "$P4_WORK/checks/check_5_4_backend.py" \
          --p3-export "$VEUX_P4_P3_EXPORT" \
          --r4-audit "$VEUX_P4_R4_AUDIT" \
          --r4-main-zip "$VEUX_P4_R4_MAIN" \
          --output "$P4_WORK/reports/P4_SOURCE_GATE.json"
        python3 -m unittest discover -s "$P4_WORK/checks" -p test_p4_backend.py -v \
          > "$P4_WORK/reports/P4_TESTS.log" 2>&1 || {
            cat "$P4_WORK/reports/P4_TESTS.log"
            exit 1
          }
        cat "$P4_WORK/reports/P4_TESTS.log"
        python3 - <<'PY_P4_ASSERT'
        import json,os,re
        from pathlib import Path
        p=Path(os.environ['P4_WORK'])/'reports'
        r=json.loads((p/'P4_SOURCE_GATE.json').read_text())
        s=(p/'P4_TESTS.log').read_text()
        if not (re.search(r'Ran 17 tests in ',s) and '\nOK\n' in s and 'skipped=' not in s):
            raise SystemExit('P4_TEST_COUNT_OR_SKIPPED_CHECK_FAILED')
        if (r.get('decision')!='NOT_READY_FOR_FINAL_BUILD' or r.get('native_510_patch_safe_to_apply') is not False
            or r.get('flash_approved') is not False or r.get('device_tested') is not False
            or r.get('kernel_sources_mutated') is not False or r.get('brene_changed') is not False
            or r.get('final_composed_selinux_3_files_proven') is not True):
            raise SystemExit('P4_RELEASE_SAFETY_CONTRACT_FAILED')
        print('P4_17_HOST_TESTS_AND_NO_FINAL_BUILD=PASS')
        PY_P4_ASSERT

    - name: "Independently ShellCheck every bash run block"
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_P4_SHELLCHECK'
        from pathlib import Path
        import subprocess
        path=Path('.github/workflows/VEUX_SUSFS54_P4_R4_SOURCE_GATE_NO_BUILD.yml')
        lines=path.read_text().splitlines()
        blocks=[]
        i=0
        while i<len(lines):
            if lines[i]=='      run: |':
                i+=1
                block=[]
                while i<len(lines) and (lines[i].startswith('        ') or lines[i]==''):
                    block.append(lines[i][8:] if lines[i].startswith('        ') else '')
                    i+=1
                blocks.append('\n'.join(block)+'\n')
            else:
                i+=1
        if len(blocks)!=8:
            raise SystemExit('P4_SHELLCHECK_EXPECTED_8_RUN_BLOCKS:'+str(len(blocks)))
        for n,s in enumerate(blocks,1):
            p=subprocess.run(['shellcheck','--severity=warning','--shell=bash','-'],input=s,text=True,capture_output=True)
            if p.returncode:
                print(p.stdout,p.stderr)
                raise SystemExit('P4_SHELLCHECK_FAILED_BLOCK:'+str(n))
        print('P4_INDEPENDENT_SHELLCHECK=PASS; RUN_BLOCKS='+str(len(blocks)))
        PY_P4_SHELLCHECK

