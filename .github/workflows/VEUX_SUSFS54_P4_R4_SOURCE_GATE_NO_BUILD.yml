    - name: "P4 validate read-only R4 SELinux backend and run all 17 tests"
      shell: bash
      run: |
        set -euo pipefail
        export VEUX_P4_P3_EXPORT="$P4_WORK/p3"
        export VEUX_P4_R4_AUDIT="$P4_WORK/archives/r4.zip"
