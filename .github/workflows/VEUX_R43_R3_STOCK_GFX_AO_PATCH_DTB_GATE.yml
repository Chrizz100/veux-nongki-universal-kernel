    - name: Require real ShellCheck, PyYAML, GCC, DTC and fdtoverlay
      run: |
        set -euo pipefail
        missing=0
        for tool in shellcheck gcc dtc fdtoverlay; do
          if ! command -v "$tool" >/dev/null 2>&1; then missing=1; fi
        done
        if ! python3 -c "import yaml" >/dev/null 2>&1; then missing=1; fi
        if [ "$missing" -eq 1 ]; then
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends shellcheck gcc device-tree-compiler python3-yaml
        fi
        for tool in shellcheck gcc dtc fdtoverlay; do command -v "$tool"; done
        {
          shellcheck --version
          gcc --version
          dtc --version
          "$R43_STAGE/actionlint" -version
        } > "$R43_REPORT/R43_TOOL_VERSIONS.log"
        python3 -c "import yaml; print('PYYAML_AVAILABLE='+yaml.__version__)"
      timeout-minutes: 5
