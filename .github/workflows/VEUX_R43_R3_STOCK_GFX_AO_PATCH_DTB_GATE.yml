          --actionlint "$R43_STAGE/actionlint" --shellcheck "$(command -v shellcheck)" \
          --out "$R43_REPORT" --scratch "$R43_STAGE/lint-blocks" --expected-blocks 7 \
          2>&1 | tee "$R43_REPORT/R43_LINT_EXECUTION.log"
