        blocks=shell_blocks(raw)
        lint=json.loads((p/'R43_LINT_RESULT.json').read_text())
        if (lint.get('schema')!='VEUX_R43_R3_INDEPENDENT_LINT_V1' or lint.get('passed') is not True or
            lint.get('workflow_sha256')!=hashlib.sha256(raw).hexdigest() or
            lint.get('expected_blocks')!=7 or len(blocks)!=7 or len(lint.get('blocks',[]))!=7):
            raise SystemExit('INDEPENDENT_LINT_PROOF_MISSING')
        if lint['actionlint']['exit_code']!=0 or lint['actionlint']['timed_out']:
            raise SystemExit('ACTIONLINT_NOT_PASSED')
        for actual, expected in zip(lint['blocks'], blocks):
            if any(actual[k]!=expected[k] for k in ('job','step','sha256')):
                raise SystemExit('SHELLCHECK_COVERAGE_MISMATCH')
            for tool in ('bash','shellcheck'):
                if actual[tool]['exit_code']!=0 or actual[tool]['timed_out']:
                    raise SystemExit('SHELLCHECK_OR_BASH_NOT_PASSED')
        print('R43_SOURCE_PATCH_AND_DTB_GATES=PASS; BOOT_READY=NO; FLASH_ALLOWED=NO')
        R43_VERIFY
        test -z "$(git status --porcelain)"
      timeout-minutes: 2
    - name: Always preserve outcome, checksums and summary, including on failure
      if: ${{ always() }}
      working-directory: ${{ github.workspace }}
      env:
        R43_JOB_STATUS: ${{ job.status }}
      run: |
        set -euo pipefail
        mkdir -p "$R43_REPORT"
        python3 - <<'R43_FINALIZE'
        import hashlib,json,os,pathlib
        p=pathlib.Path(os.environ['R43_REPORT'])
        state=os.environ['R43_JOB_STATUS']
        (p/'R43_WORKFLOW_STATUS.json').write_text(json.dumps({'workflow_revision':'R43-R3','engine_revision':'R43-R2',
            'job_status_before_upload':state,
            'boot_ready':False,'flash_allowed':False},indent=2)+'\n')
        lines=[]
        for f in sorted(p.iterdir()):
            if f.is_file() and f.name!='SHA256SUMS.txt':
                lines.append(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name)
        (p/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as summary:
            summary.write('## R43-R3 lintfix / R43-R2 AO engine: '+state+'\n\n')
            report=p/'R43_BERICHT_DE.txt'
            if state=='success' and report.is_file():summary.write(report.read_text())
            else:
                summary.write('BLOCKIERT / NICHT FREIGEGEBEN. Original-Fehler und Logs im Artefakt.\n')
                failure=p/'R43_FAILURE.json'
                if failure.is_file():summary.write('\n'+json.loads(failure.read_text())['reason']+'\n')
            lint=p/'R43_LINT_RESULT.json'
            if lint.is_file():
                ld=json.loads(lint.read_text())
                summary.write('\nIndependent lint passed: '+str(ld.get('passed'))+'\n')
                if ld.get('error'):summary.write(ld['error']+'\n')
            summary.write('\nBOOT_READY=NO; FLASH_ALLOWED=NO; VENDOR_ABI_UNPROVEN.\n')
        R43_FINALIZE
        (cd "$R43_REPORT" && sha256sum -c SHA256SUMS.txt)
      timeout-minutes: 2
    - name: Upload source patch and evidence only, never flashable binaries
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: VEUX-R43-R3-LINTFIX-AO-PATCH-DTB-${{ github.run_id }}
        path: ${{ env.R43_REPORT }}/
        retention-days: 14
        if-no-files-found: error
      timeout-minutes: 3
