name: VEUX - Awinic getter R3 candidate - RPM24 R4 - 5.4.274 (manual)
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: veux-awinic-r3-manual-main
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  integrate:
    name: Audited RPM24-R4 base + Awinic C getter candidate, manual no-push
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    - name: Checkout current main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Mandatory actionlint before kernel operations
      shell: bash
      run: |
        set -euo pipefail
        # actionlint is installed only in the runner's temporary directory.
        # A lint error aborts BEFORE all kernel source operations or compilation.
        test -f .github/workflows/VEUX_AWINIC_R3_SINGLE_UPLOAD.yml
        mkdir -p "$RUNNER_TEMP/veux-actionlint-bin"
        GOBIN="$RUNNER_TEMP/veux-actionlint-bin"   go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
        "$RUNNER_TEMP/veux-actionlint-bin/actionlint" -oneline   .github/workflows/VEUX_AWINIC_R3_SINGLE_UPLOAD.yml
        printf 'ACTIONLINT_GITHUB_RUNNER=PASS
        '
    - name: Verify repository and bounded dependencies
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_REPOSITORY\" = Chrizz100/veux-nongki-universal-kernel\n\
        test \"$GITHUB_REF\" = refs/heads/main\ntest -z \"$(git status --porcelain
        --untracked-files=all)\"\ngit checkout -B main \"$(git rev-parse HEAD)\"\n\
        echo \"BASE_SHA=$(git rev-parse HEAD)\" >> \"$GITHUB_ENV\"\nmissing=()\nfor
        package in bc binutils bison build-essential ca-certificates curl dwarves
        file flex git jq libelf-dev libncurses-dev libssl-dev perl python3 python3-venv
        rsync unzip zip xz-utils zstd; do\n  if ! dpkg-query -W -f='${Status}' \"\
        $package\" 2>/dev/null | grep -qx 'install ok installed'; then\n    missing+=(\"\
        $package\")\n  fi\ndone\nif ((${#missing[@]})); then\n  timeout --kill-after=15s
        180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        update\n  timeout --kill-after=15s 240s sudo apt-get -o DPkg::Lock::Timeout=60
        install -y --no-install-recommends \"${missing[@]}\"\nfi\npython3 -m venv
        \"$RUNNER_TEMP/veux-python\"\nPY=\"$RUNNER_TEMP/veux-python/bin/python\"\n\
        timeout --kill-after=10s 180s \"$PY\" -m pip install --disable-pip-version-check
        --retries 2 --timeout 30 ruamel.yaml==0.19.1 PyYAML==6.0.3\n\"$PY\" -c 'import
        ruamel.yaml, yaml'\necho \"PY=$PY\" >> \"$GITHUB_ENV\"\necho \"TOOLS=$RUNNER_TEMP/veux-rpm24-implementation\"\
        \ >> \"$GITHUB_ENV\"\necho \"PAYLOAD=$RUNNER_TEMP/veux-rpm24-implementation\"\
        \ >> \"$GITHUB_ENV\"\nmkdir -p \"$RUNNER_TEMP/veux-rpm24-report\"\n\n# Refuse
        unreviewed changes to the kernel release worker/RPM24 gates.\nfor entry in\
        \   '6401eda65d26f047e8cb2ce836c12fbfeadbd80f common/scripts/veux_release_device.py'\
        \   'e08344b581c2aa6e7933552e3bb1a1811021c909 common/scripts/veux_rpm24.py'\
        \   'f8e5d6dfdfaf5892a4b6050411bcf8715f58b0b8 common/scripts/test_veux_rpm24.py'\
        \   '318d2d15a1928ab44f5b5b2b1c750a0e5316f83a common/scripts/veux_update_engine.py';
        do\n  expected=${entry%% *}\n  filename=${entry#* }\n  actual=$(git hash-object
        -- \"$filename\")\n  if [[ \"$actual\" != \"$expected\" ]]; then\n    echo
        \"::error::Verified RPM24-R4 source changed: $filename\"\n    exit 1\n  fi\n\
        done\necho 'AWINIC_R3_RPM24_R4_BASE_FILE_PINS=PASS'\n"
    - name: Unpack hash-authenticated RPM24 payload
      shell: bash
      run: "set -euo pipefail\n\"$PY\" - <<'PYCODE'\nimport base64,gzip,hashlib,json,os\n\
        from pathlib import Path,PurePosixPath\nblob=base64.b64decode(\"\"\
        ,validate=True)\nraw=gzip.decompress(blob)\nif len(raw)>200000:raise ValueError('payload
        too large')\nif hashlib.sha256(raw).hexdigest()!=\"9495697e304d60448b83372404dd47d54cc857e8c22d18135520bb880c70128f\"\
        :raise ValueError('payload SHA256 mismatch')\ndata=json.loads(raw)\nexpected={'common/scripts/veux_rpm24.py','common/scripts/test_veux_rpm24.py',\n\
        \          'install_rpm24.py','ci_rpm24.py','targets-reviewed-35217.json'}\n\
        if data.get('schema')!=1 or set(data.get('files',{}))!=expected:raise ValueError('payload
        file list drift')\nroot=Path(os.environ['RUNNER_TEMP'])/'veux-rpm24-implementation'\n\
        root.mkdir(exist_ok=False)\nfor name,content in data['files'].items():\n \
        \   rel=PurePosixPath(name)\n    if rel.is_absolute() or '..' in rel.parts
        or '\\\\' in name:raise ValueError('unsafe payload name')\n    p=root/name;p.parent.mkdir(parents=True,exist_ok=True)\n\
        \    p.write_bytes(base64.b64decode(content,validate=True))\nfor p in root.rglob('*.py'):\n\
        \    compile(p.read_bytes(),str(p),'exec')\nprint('RPM24_PAYLOAD=AUTHENTICATED;
        NO_REPOSITORY_MUTATION')\nPYCODE\n"
    - name: Require old release tests before any changes
      shell: bash
      run: "set -euo pipefail\n\"$PY\" \"$TOOLS/ci_rpm24.py\" pretests 2>&1 | tee
        \"$RUNNER_TEMP/veux-rpm24-report/pretests.log\"\ntest -z \"$(git status --porcelain
        --untracked-files=all)\"\n"
    - name: Apply RPM24 integration idempotently to current source
      shell: bash
      run: "set -euo pipefail\n\"$PY\" \"$TOOLS/install_rpm24.py\" \"$GITHUB_WORKSPACE\"\
        \ \"$TOOLS\" 2>&1 | tee \"$RUNNER_TEMP/veux-rpm24-report/install.log\"\n\"\
        $PY\" \"$TOOLS/install_rpm24.py\" \"$GITHUB_WORKSPACE\" \"$TOOLS\" | grep
        -q 'RPM24_INSTALL=PASS'\ntest -z \"$(git diff --check)\"\n"
    - name: Run all release and RPM24 C host tests twice
      shell: bash
      run: "set -euo pipefail\nfor pass in 1 2; do\n  \"$PY\" \"$TOOLS/ci_rpm24.py\"\
        \ tests 2>&1 | tee \"$RUNNER_TEMP/veux-rpm24-report/tests-$pass.log\"\ndone\n"
    - name: Reconstruct exact previously tested 35217 UAPI5 target
      shell: bash
      run: "set -euo pipefail\n\"$PY\" \"$TOOLS/ci_rpm24.py\" bundle 2>&1 | tee \"\
        $RUNNER_TEMP/veux-rpm24-report/bundle.log\"\ntest -z \"$(git status --porcelain
        --untracked-files=all)\"\n"
    - name: Unpack, validate and test Awinic candidate (no repo edits)
      shell: bash
      run: |
        set -euo pipefail
        "$PY" - <<'PYCODE'
        import base64,gzip,hashlib,json,os
        from pathlib import Path,PurePosixPath
        blob=base64.b64decode("",validate=True)
        raw=gzip.decompress(blob)
        if len(raw)>130000:raise ValueError('Awinic payload too large')
        if hashlib.sha256(raw).hexdigest()!="7f3351eb83a82f05c1ac3a516b60543044e301df6265f9fb94aff25d27c53e0d":raise ValueError('Awinic payload SHA256 mismatch')
        manifest=json.loads(raw)
        expected={'awinic_candidate.py','awinic_preflight.py','inject_worker.py',
                  'test_awinic_candidate.py','VEUX_AWINIC_R2_GETTER_CANDIDATE.patch'}
        if manifest.get('schema')!=1 or set(manifest.get('files',{}))!=expected:
            raise ValueError('Awinic payload shape drift')
        root=Path(os.environ['RUNNER_TEMP'])/'veux-awinic-r3'
        root.mkdir(exist_ok=False)
        for name,b64 in manifest['files'].items():
            p=PurePosixPath(name)
            if p.is_absolute() or len(p.parts)!=1 or '..' in p.parts or chr(92) in name:
                raise ValueError('unsafe payload path')
            data=base64.b64decode(b64,validate=True)
            (root/name).write_bytes(data)
            if name.endswith('.py'):compile(data,str(root/name),'exec')
        print('AWINIC_R3_EMBEDDED_PAYLOAD=PASS; REPO_FILES_UNCHANGED=YES')
        PYCODE
        "$PY" "$RUNNER_TEMP/veux-awinic-r3/inject_worker.py"   "$GITHUB_WORKSPACE/common/scripts/veux_release_device.py"   "$RUNNER_TEMP/veux-awinic-r3/veux_release_device.py"   2>&1 | tee "$RUNNER_TEMP/veux-rpm24-report/awinic-worker-preflight.log"
        PYTHONPATH="$RUNNER_TEMP/veux-awinic-r3" "$PY" -m unittest -v test_awinic_candidate   2>&1 | tee "$RUNNER_TEMP/veux-rpm24-report/awinic-host-tests.log"
        # Neither the checkout nor the updater's sources may be touched by the candidate.
        test -z "$(git status --porcelain --untracked-files=all)"
        echo 'AWINIC_R3_HOST_STATIC_PREFLIGHT=PASS; FULL_KERNEL_BUILD=NEXT; DEVICE_PASS=NO'
    - name: Compile 5.4.274 + all RPM24 R4 gates + pinned Awinic candidate
      id: kernel
      shell: bash
      run: "set -euo pipefail\nPYTHONPATH=\"$RUNNER_TEMP/veux-awinic-r3:$GITHUB_WORKSPACE/common/scripts\"\
        \ \\\n  \"$PY\" -u \"$RUNNER_TEMP/veux-awinic-r3/veux_release_device.py\"\
        \ worker \\\n  --kernel 5.4.274 --bundle \"$RUNNER_TEMP/veux-targets\" \\\n\
        \  --work \"$RUNNER_TEMP/veux-builds/5.4.274\" \\\n  --public \"$RUNNER_TEMP/veux-public/5.4.274\"\
        \ \\\n  --overlays \"$RUNNER_TEMP/veux-overlays\" --jobs 4 \\\n  2>&1 | tee
        \"$RUNNER_TEMP/veux-rpm24-report/build.log\"\n\"$PY\" \"$TOOLS/ci_rpm24.py\"\
        \ verify\nPYTHONPATH=\"$RUNNER_TEMP/veux-awinic-r3\" \"$PY\" -c 'import os;from
        awinic_candidate import verify_published;from pathlib import Path;verify_published(Path(os.environ[\"\
        RUNNER_TEMP\"])/\"veux-public/5.4.274\")'\ntest -s \"$RUNNER_TEMP/veux-builds/diagnostics/5.4.274/AWINIC-R3.json\"\
        \ntest -z \"$(git status --porcelain --untracked-files=all)\"\n"
    - name: Upload candidate AK3 and boot artifacts (not device-approved)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.kernel.outputs.artifact_name }}_AWINIC_R3_${{ 
          github.run_id }}
        path: ${{ runner.temp }}/veux-public/5.4.274/
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
    - name: Preserve RPM24 R4 and Awinic R3 tests, patches and diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: VEUX-RPM24-AWINIC-R3-Evidence-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/veux-rpm24-report/
          ${{ runner.temp }}/veux-builds/diagnostics/5.4.274/
          ${{ runner.temp }}/veux-awinic-r3/
        if-no-files-found: warn
        retention-days: 30
        compression-level: 6
