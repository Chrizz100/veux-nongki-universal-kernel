name: VEUX R6 NoMount v2.1.1 R2 - Experimental Build - NO FLASH

'on':
  workflow_dispatch:
    inputs:
      enable_build:
        description: 'Compile experimental VEUX 5.4.274 R6 with NoMount 2.1.1; NO FLASH approval'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: veux-r6-nm211-r2-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_TERMINAL_PROMPT: '0'
  VEUX_EXPECTED_REPOSITORY: Chrizz100/veux-nongki-universal-kernel
  VEUX_MAIN_ZIP: VEUX_R6_NM211_R2_MAIN.zip
  VEUX_MAIN_SHA256: ac70b8203ddc9978847b819413cc239cd2b3aab22ef60277fa8f0b2adb8ebda3

jobs:
  experimental_r2:
    name: R6 NoMount211 static gates and opt-in compile - NO FLASH
    if: ${{ github.repository == 'Chrizz100/veux-nongki-universal-kernel' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout exact main SHA read only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable ZIP, main SHA and repository identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$VEUX_EXPECTED_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -f "$GITHUB_WORKSPACE/$VEUX_MAIN_ZIP"
          printf '%s  %s\n' "$VEUX_MAIN_SHA256" "$GITHUB_WORKSPACE/$VEUX_MAIN_ZIP" | sha256sum --check --status
          echo 'R2_REPO_AND_ZIP_SHA256=PASS'

      - name: Offline verify exact actionlint binary and R2 YAML
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/veux-nm211-r2-actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/veux-nm211-r2-actionlint" actionlint
          "$RUNNER_TEMP/veux-nm211-r2-actionlint/actionlint" -oneline \
            .github/workflows/VEUX_R6_NM211_R2_EXPERIMENTAL_BUILD.yml
          echo 'R2_ACTIONLINT=PASS'

      - name: Validate all ZIP members and extract ONLY to runner temp
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,stat,zipfile
          from pathlib import Path,PurePosixPath
          archive=Path(os.environ['GITHUB_WORKSPACE'])/os.environ['VEUX_MAIN_ZIP']
          output=Path(os.environ['RUNNER_TEMP'])/'veux-nm211-r2-overlay'
          if output.exists() or output.is_symlink():
              raise SystemExit('R2_TEMP_OVERLAY_ALREADY_EXISTS')
          files={
            'README_START_HIER_DE.txt',
            'MANIFEST_SHA256.json',
            'common/r6_nm211/pinned_nomount_7046c7ad_source.tar.gz',
            'common/r6_nm211/SUSFS_R2_NACHPRUEFUNG.json',
            'common/scripts/veux_r6_nomount211_preflight_r1.py',
            'common/scripts/veux_r6_nomount211_build_r2.py',
            'Tests/test_veux_r6_nomount211_preflight_r1.py',
            'Tests/test_veux_r6_nomount211_build_r2.py',
          }
          with zipfile.ZipFile(archive) as z:
              members=z.infolist()
              if z.testzip() is not None or len(members)!=len(files) or set(z.namelist())!=files:
                  raise SystemExit('R2_ZIP_MEMBERS_DRIFT_OR_CRC_FAILURE')
              manifest=json.loads(z.read('MANIFEST_SHA256.json'))
              if (manifest.get('schema')!=2 or manifest.get('approved_for_flash') is not False
                  or manifest.get('reference_run')!=38530535344
                  or manifest.get('last_source_pass_run')!=38960694902
                  or manifest.get('nomount_candidate')!='7046c7ad3ee0bf4ae66e80f6b93b1e30db0cb4e3'
                  or manifest.get('susfs_pin_unchanged')!='5326e21a7eb232f9e21debdd5164e99bee3d1e2f'
                  or set(manifest.get('files',{}))!=files-{'MANIFEST_SHA256.json'}):
                  raise SystemExit('R2_MANIFEST_OR_PROVENANCE_CHANGED')
              output.mkdir(parents=True)
              for info in members:
                  name=PurePosixPath(info.filename)
                  mode=info.external_attr>>16
                  if (name.is_absolute() or '..' in name.parts or '\\' in info.filename
                      or not stat.S_ISREG(mode)):
                      raise SystemExit('R2_UNSAFE_ARCHIVE_MEMBER:'+info.filename)
                  data=z.read(info.filename)
                  if info.filename!='MANIFEST_SHA256.json':
                      if hashlib.sha256(data).hexdigest()!=manifest['files'][info.filename]:
                          raise SystemExit('R2_MEMBER_SHA256_MISMATCH:'+info.filename)
                  path=output.joinpath(*name.parts)
                  path.parent.mkdir(parents=True,exist_ok=True)
                  if path.exists() or path.is_symlink():
                      raise SystemExit('R2_ARCHIVE_DUPLICATE_MEMBER')
                  path.write_bytes(data)
          print('R2_SOURCE_ARCHIVE_SCOPE_SHA256_AND_EXTRACT=PASS')
          PY
          echo "NM211_R2_OVERLAY=$RUNNER_TEMP/veux-nm211-r2-overlay" >> "$GITHUB_ENV"

      - name: Offline R1 and R2 regression tests including negative fixtures
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$NM211_R2_OVERLAY/common/scripts${PYTHONPATH:+:$PYTHONPATH}"
          python3 - <<'PY'
          import ast,os
          from pathlib import Path
          root=Path(os.environ['NM211_R2_OVERLAY'])
          for rel in (
              'common/scripts/veux_r6_nomount211_preflight_r1.py',
              'common/scripts/veux_r6_nomount211_build_r2.py',
              'Tests/test_veux_r6_nomount211_preflight_r1.py',
              'Tests/test_veux_r6_nomount211_build_r2.py',
          ):
              ast.parse((root/rel).read_text(),filename=rel)
          print('R2_PYTHON_AST=PASS')
          PY
          python3 -m unittest discover -s "$NM211_R2_OVERLAY/Tests" -p 'test_veux_r6_nomount211_preflight_r1.py' -v
          python3 -m unittest discover -s "$NM211_R2_OVERLAY/Tests" -p 'test_veux_r6_nomount211_build_r2.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'R2_R1_AND_R2_HOST_GATES=PASS'

      - name: Install immutable R6 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          for p in common/scripts/veux_fleet_35222_selinux_r3.py \
            common/scripts/veux_bakasu_official_selinux_r6.py \
            common/scripts/veux_update_engine.py \
            common/scripts/veux_source_transport.py \
            common/scripts/veux_susfs_54_port_probe_r3.py \
            common/scripts/veux_release_device.py \
            common/contracts/CURRENT_BUILD.json; do test -f "$p"; done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc binutils bison build-essential ca-certificates curl dwarves file flex \
            git jq libelf-dev libncurses-dev libssl-dev perl python3 \
            python3-venv python3-yaml rsync unzip zip xz-utils zstd
          python3 -m venv "$RUNNER_TEMP/veux-nm211-r2-venv"
          "$RUNNER_TEMP/veux-nm211-r2-venv/bin/python" -m pip install \
            --disable-pip-version-check --retries 2 --timeout 30 \
            ruamel.yaml==0.19.1 PyYAML==6.0.3
          echo "NM211_R2_PY=$RUNNER_TEMP/veux-nm211-r2-venv/bin/python" >> "$GITHUB_ENV"

      - name: Prepare immutable R6 donors with NoMount 2.1.1 only
        shell: bash
        run: |
          set -euo pipefail
          "$NM211_R2_PY" -u "$NM211_R2_OVERLAY/common/scripts/veux_r6_nomount211_preflight_r1.py" \
            prepare --repo "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/veux-nm211-r2-work" --kernel 5.4.274

      - name: Full R6 source preflight, SUSFS review remains blocked
        shell: bash
        run: |
          set -euo pipefail
          "$NM211_R2_PY" -u "$NM211_R2_OVERLAY/common/scripts/veux_r6_nomount211_preflight_r1.py" \
            preflight --repo "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/veux-nm211-r2-work" --kernel 5.4.274
          "$NM211_R2_PY" - <<'PY'
          import json,os
          from pathlib import Path
          work=Path(os.environ['RUNNER_TEMP'])/'veux-nm211-r2-work'
          data=json.loads((work/'report/NOMOUNT211_R6_SOURCE_ONLY.json').read_text())
          if data.get('status')!='SOURCE_PREFLIGHT_ONLY_PASS' or data.get('source_preflight') is not True:
              raise SystemExit('R2_R1_PRECHECK_NOT_GREEN')
          if data.get('bakasu_or_susfs_upgraded') is not False:
              raise SystemExit('BAKASU_OR_SUSFS_UNEXPECTED_UPGRADE')
          if data.get('nomount_stack_protector_review_required') is not True:
              raise SystemExit('STACK_REVIEW_WAS_SUPPRESSED')
          print('R2_FULL_R6_SOURCE_AND_STABILITY_PRECHECK=PASS')
          PY

      - name: Compile full isolated kernel with NoMount hardening and retained R6 gates
        if: ${{ inputs.enable_build }}
        shell: bash
        run: |
          set -euo pipefail
          "$NM211_R2_PY" -u "$NM211_R2_OVERLAY/common/scripts/veux_r6_nomount211_build_r2.py" \
            build --repo "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/veux-nm211-r2-work" --jobs 4
          echo 'R2_FULL_R6_NOMOUNT_2_1_1_KERNEL_BUILD_GATE=PASS; DEVICE_PASS=NO'

      - name: Verify resulting AK3 and boot evidence but do not approve flashing
        if: ${{ inputs.enable_build && success() }}
        shell: bash
        run: |
          set -euo pipefail
          "$NM211_R2_PY" - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'veux-nm211-r2-work'
          pub=root/'public/5.4.274'
          summary=json.loads((root/'report/NOMOUNT211_R2_FINAL.json').read_text())
          row=json.loads((pub/'RESULT.json').read_text())
          if summary.get('status')!='EXPERIMENTAL_BUILD_GATES_PASS_DEVICE_NOT_TESTED':
              raise SystemExit('R2_FINAL_STATUS_NOT_EXPERIMENTAL_PASS')
          if row.get('nomount211_r2',{}).get('strong_stack_protector_on_nomount_object') is not True:
              raise SystemExit('R2_STACK_REPORT_MISSING')
          if row.get('targets',{}).get('nomount',{}).get('commit')!='7046c7ad3ee0bf4ae66e80f6b93b1e30db0cb4e3':
              raise SystemExit('R2_KERNEL_NOMOUNT_COMMIT_CHANGED')
          if summary.get('flash_release') is not False or summary.get('device_pass') is not False:
              raise SystemExit('R2_INVALID_FLASH_OR_DEVICE_STATUS')
          zips=list(pub.glob('*_AnyKernel_RMNET.zip'))
          if len(zips)!=1:raise SystemExit('R2_AK3_NOT_UNIQUE')
          with zipfile.ZipFile(zips[0]) as z:
              if z.testzip() is not None:raise SystemExit('R2_AK3_ZIP_CRC_FAILED')
              image=z.read('Image')
          if hashlib.sha256(image).hexdigest()!=row['image_sha256']:
              raise SystemExit('R2_BUILT_AK3_IMAGE_HASH_MISMATCH')
          print('R2_EXPERIMENTAL_BINARY_AUDIT=PASS; NO_FLASH_PERMISSION')
          PY

      - name: Save all source and build diagnostics even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: VEUX-R6-NoMount211-R2-AUDIT-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/veux-nm211-r2-work/prepare.json
            ${{ runner.temp }}/veux-nm211-r2-work/report/
            ${{ runner.temp }}/veux-nm211-r2-work/builds/diagnostics/5.4.274/
            ${{ runner.temp }}/veux-nm211-r2-work/source-audit/5.4.274/integration.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Publish experimental R2 kernel artifacts only after all gates
        if: ${{ inputs.enable_build && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: VEUX-R6-NoMount211-R2-EXPERIMENTAL-NO-FLASH-${{ github.run_id }}
          path: ${{ runner.temp }}/veux-nm211-r2-work/public/5.4.274/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Assert repository unchanged, source pins preserved, no promotion
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$VEUX_EXPECTED_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'R2_REPOSITORY_UNCHANGED=PASS'
          echo 'NO_MAIN_PROMOTION=YES'
          echo 'NO_DEVICE_PASS_INFERRED=YES'
          echo 'NO_FLASH_RELEASE=YES'
