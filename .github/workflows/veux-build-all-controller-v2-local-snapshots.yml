name: VEUX Build All Controller V2 - Local Snapshots

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veux-build-all-v2-local-snapshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Validate local sources and discover lineages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      baseline_id: ${{ steps.matrix.outputs.baseline_id }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install YAML parser
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' || python3 -m pip install --user PyYAML
          import yaml
          print(f"PyYAML={yaml.__version__}")
          PY

      - name: Validate local ReSukiSU SUSFS NoMount snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile common/scripts/verify_local_snapshots.py
          python3 common/scripts/verify_local_snapshots.py --repo-root "$GITHUB_WORKSPACE"

      - name: Validate existing central contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 common/scripts/upstream_controller.py validate --repo-root "$GITHUB_WORKSPACE"

      - name: Discover dynamic lineage matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 common/scripts/discover_build_matrix.py --repo-root "$GITHUB_WORKSPACE"

      - name: Require dynamic fleet baseline
        shell: bash
        env:
          COUNT: ${{ steps.matrix.outputs.count }}
          BASELINE_ID: ${{ steps.matrix.outputs.baseline_id }}
        run: |
          set -euo pipefail
          test "$COUNT" -ge 6
          test -n "$BASELINE_ID"
          echo "LINEAGE_COUNT=$COUNT"
          echo "BASELINE_ID=$BASELINE_ID"
          echo "LOCAL_SNAPSHOT_DISCOVERY=PASS"

  lineage-preflight:
    name: Local-source preflight ${{ matrix.kernel }}
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install YAML parser
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' || python3 -m pip install --user PyYAML
          import yaml
          print(f"PyYAML={yaml.__version__}")
          PY

      - name: Validate lineage against local component policy
        shell: bash
        env:
          KERNEL: ${{ matrix.kernel }}
        run: |
          set -euo pipefail
          test -n "$KERNEL"
          test -f "lineages/$KERNEL/build.yml"
          python3 common/scripts/verify_local_snapshots.py --repo-root "$GITHUB_WORKSPACE"
          python3 common/scripts/upstream_controller.py profiles \
            --repo-root "$GITHUB_WORKSPACE" \
            --kernel "$KERNEL"
          echo "LOCAL_SOURCE_PREFLIGHT_$KERNEL=PASS"

  final:
    name: V2 local snapshot controller gate
    needs:
      - discover
      - lineage-preflight
    if: ${{ needs.discover.result == 'success' && needs.lineage-preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Final V2 gate
        shell: bash
        env:
          COUNT: ${{ needs.discover.outputs.count }}
          BASELINE_ID: ${{ needs.discover.outputs.baseline_id }}
        run: |
          set -euo pipefail
          test "$COUNT" -ge 6
          test -n "$BASELINE_ID"
          echo "LINEAGE_COUNT=$COUNT"
          echo "BASELINE_ID=$BASELINE_ID"
          echo "VEUX_BUILD_ALL_V2_LOCAL_SNAPSHOTS=PASS"
