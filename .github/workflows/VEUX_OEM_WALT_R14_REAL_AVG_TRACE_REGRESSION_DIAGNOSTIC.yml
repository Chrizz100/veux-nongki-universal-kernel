        steps=doc['jobs']['p11-exact-source']['steps']
        bodies=[s['run'] for s in steps if isinstance(s.get('run'),str)]
        if len(bodies)<32:raise SystemExit('R14_MISSING_EXPECTED_BASH_BLOCKS')
        for i,body in enumerate(bodies,1):
            for args in (['bash','-n'],['shellcheck','--shell=bash','--severity=warning','-']):
                p=subprocess.run(args,input=body,text=True,capture_output=True)
                if p.returncode:raise SystemExit('R14_BASH_OR_SHELLCHECK_FAIL:'+str(i)+':'+p.stderr+p.stdout)
        pattern=re.compile(r'''(?m)^python(?:3)?\s+-\s+<<-?\s*['"]?([A-Za-z0-9_]+)['"]?\s*$''')
