name: VEUX OEM WALT R14 Xiaomi AVG + Trace 10-Object Compiler – NO FLASH
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: veux-oem-walt-r14-r1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  p11-exact-source:
    if: ${{ github.repository == 'Chrizz100/veux-nongki-universal-kernel' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PACKAGE_NAME: VEUX_STOCK274_P11_R4_MAIN.zip
      PACKAGE_SHA256: 46eef073d2418f0b64b66a0ff3ab33d788c485db3dcf8afa5cf56f89da27fb50
      P11_TOOL_DIR: ${{ github.workspace }}/p11-tools
      P10_TOOL_DIR: ${{ github.workspace }}/p11-tools/p10
      R4_TOOL_DIR: ${{ github.workspace }}/p11-tools/r4
      P11_BUNDLES_DIR: ${{ github.workspace }}/p11-bundles
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      R6_PACKAGE_NAME: VEUX_OEM_WALT_ABI_R6_MAIN.zip
      R6_PACKAGE_SHA256: 8c9963b23b5fce2b358c4151df83a58d68ed4b7c4884392bee871f02f65e6be2
      R6_DIR: ${{ github.workspace }}/veux-oem-walt-r6
      R6_OUT: ${{ github.workspace }}/veux-oem-walt-r6-source-only
      R7_PACKAGE_NAME: VEUX_OEM_WALT_R7_R2_PRECOMPILE_AUDIT_MAIN.zip
      R7_PACKAGE_SHA256: 84d2aea348a8181eadc712a8c4e9b1e66836650fb179e5632d403ff2f27dd051
      R7_DIR: ${{ github.workspace }}/veux-oem-walt-r7-tools
      R7_OUT: ${{ github.workspace }}/veux-oem-walt-r7-precompile-audit
      R8_PACKAGE_NAME: VEUX_OEM_WALT_R8_SOURCE_BRIDGE_MAIN.zip
      R8_PACKAGE_SHA256: e4d5c314d5ba8b090b3168175b35a80a254723c593240e2fbefcf52bf6e6ff43
      R8_DIR: ${{ github.workspace }}/veux-oem-walt-r8-tools
      R8_OUT: ${{ github.workspace }}/veux-oem-walt-r8-source-only
      R9_PACKAGE_NAME: VEUX_OEM_WALT_R9_REAL_OBJECT_COMPILE_MAIN.zip
      R9_PACKAGE_SHA256: 9ee5da65612fba59b857790843935d7e3effb4d6a0a489a989ddcc9bf8feb56d
      R9_DIR: ${{ github.workspace }}/veux-oem-walt-r9-tools
      R9_REPORT: ${{ github.workspace }}/veux-oem-walt-r9-compiler-audit
      R9_SNAPSHOT: ${{ github.workspace }}/veux-r9-kernel-copy
      R9_OBJOUT: ${{ github.workspace }}/veux-r9-out
      R9_TOOLCHAIN: ${{ github.workspace }}/toolchains/clang-r416183b
      R10_PACKAGE_NAME: VEUX_OEM_WALT_R10_OEM_API_COMPILER_MAIN.zip
      R10_PACKAGE_SHA256: ff3509dcb4bd8a5b51c3e6e1c9e201b286c0e5cb72bc88d4a4dd374de07e2c5e
      R10_DIR: ${{ github.workspace }}/veux-oem-walt-r10-tools
      R10_OUT: ${{ github.workspace }}/veux-oem-walt-r10-source-audit
      R11_PACKAGE_NAME: VEUX_OEM_WALT_R11_WALT_OBJECT_DIAGNOSTIC_MAIN.zip
      R11_PACKAGE_SHA256: 81e836e531b903f66477a88a2e3101a9e09dd6a1a051385d2d835f6072af92aa
      R11_DIR: ${{ github.workspace }}/veux-oem-walt-r11-tools
      R11_OUT: ${{ github.workspace }}/veux-oem-walt-r11-source-audit
      R11_REPORT: ${{ github.workspace }}/veux-oem-walt-r11-compiler-audit
      R12_PACKAGE_NAME: VEUX_OEM_WALT_R12_R3_RAVG_SYSCTL_MAIN.zip
      R12_PACKAGE_SHA256: 7ecc255d3eea1dca9dfa55f9726bbfe36ebc628a431a988ea44c9491ec7a8ad3
      R12_DIR: ${{ github.workspace }}/veux-oem-walt-r12-tools
      R12_OUT: ${{ github.workspace }}/veux-oem-walt-r12-source-audit
      R12_REPORT: ${{ github.workspace }}/veux-oem-walt-r12-compiler-audit
      R13_PACKAGE_NAME: VEUX_OEM_WALT_R13_SUBSYSTEM_DIAGNOSTIC_MAIN.zip
      R13_PACKAGE_SHA256: a458d99504800ebe10cb98ff0e250f83596011f0e4ba57280f99105fc855fe8b
      R13_DIR: ${{ github.workspace }}/veux-oem-walt-r13-tools
      R13_REPORT: ${{ github.workspace }}/veux-oem-walt-r13-subsystem-report
      R13_OBJOUT: ${{ github.workspace }}/veux-r12-objout
      R14_PACKAGE_NAME: VEUX_OEM_WALT_R14_AVG_TRACE_SOURCE_AND_COMPILER_MAIN.zip
      R14_PACKAGE_SHA256: 517bb81f7068cf6554f9431a6f3bb7dbc3795f9d820eabf0062083bd2b2d5def
      R14_DIR: ${{ github.workspace }}/veux-oem-walt-r14-tools
      R14_OUT: ${{ github.workspace }}/veux-oem-walt-r14-source-audit
      R14_REPORT: ${{ github.workspace }}/veux-oem-walt-r14-compiler-audit
    steps:
    - name: Checkout exact repo source read-only
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: project
        fetch-depth: 1
        persist-credentials: false
    - name: Require exact unchanged P11 R4, R6, and R7 root ZIPs
      id: package
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_REPOSITORY\" = 'Chrizz100/veux-nongki-universal-kernel'\n test \"$GITHUB_REF\"\
        \ = 'refs/heads/main'\n test \"$(git -C project rev-parse HEAD)\" = \"$GITHUB_SHA\"\n test -f \"project/$PACKAGE_NAME\"\
        \ && test ! -L \"project/$PACKAGE_NAME\"\n test -f \"project/$R6_PACKAGE_NAME\" && test ! -L \"project/$R6_PACKAGE_NAME\"\
        \n printf '%s  %s\\n' \"$PACKAGE_SHA256\" \"project/$PACKAGE_NAME\" | sha256sum -c -\n printf '%s  %s\\n' \"$R6_PACKAGE_SHA256\"\
        \ \"project/$R6_PACKAGE_NAME\" | sha256sum -c -\n echo 'present=true' >> \"$GITHUB_OUTPUT\"\n echo 'R6_ROOT_INPUTS=PASS'\n\
        \ntest -f \"project/$R7_PACKAGE_NAME\" && test ! -L \"project/$R7_PACKAGE_NAME\"\nprintf '%s  %s\\n' \"$R7_PACKAGE_SHA256\"\
        \ \"project/$R7_PACKAGE_NAME\" | sha256sum -c -\necho 'R7_ROOT_INPUT=PASS'\n"
    - name: Pin actionlint 1.7.12 and validate R6 YAML before replay
      if: ${{ steps.package.outputs.present == 'true' }}
      shell: bash
      run: "set -euo pipefail\nworkflow='project/.github/workflows/VEUX_OEM_WALT_ABI_R6_EXACT_P3_SOURCE_BRIDGE.yml'\ntest\
        \ -s \"$workflow\"\ncurl --fail --location --retry 3 --max-time 120 --silent --show-error \\\n  'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz'\
        \ \\\n  -o \"$RUNNER_TEMP/actionlint.tar.gz\"\nprintf '%s  %s\\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'\
        \ \"$RUNNER_TEMP/actionlint.tar.gz\" | sha256sum -c -\nmkdir -p \"$RUNNER_TEMP/veux-p11-actionlint\"\ntar -xzf \"\
        $RUNNER_TEMP/actionlint.tar.gz\" -C \"$RUNNER_TEMP/veux-p11-actionlint\" actionlint\n\"$RUNNER_TEMP/veux-p11-actionlint/actionlint\"\
        \ -oneline \"$workflow\"\necho 'R6_ACTIONLINT=PASS'\n"
    - name: Unpack and SHA-authenticate source-only dependencies
      if: ${{ steps.package.outputs.present == 'true' }}
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nimport hashlib,json,os,pathlib,stat,zipfile\nbase=pathlib.Path(os.environ['GITHUB_WORKSPACE'])\n\
        root=base/'project'/os.environ['PACKAGE_NAME']\ntools=pathlib.Path(os.environ['P11_TOOL_DIR'])\nbundles=pathlib.Path(os.environ['P11_BUNDLES_DIR'])\n\
        if tools.exists() or bundles.exists():raise SystemExit('P11_TOOL_DIRECTORY_ALREADY_EXISTS')\nexpected={'START_HIER.txt','P11_STATUS.json','P11_TESTS.log',\n\
        \          'P10_MASTER_ORIGINAL.zip','P3_R4_SOURCE_REPLAY.zip',\n          'p11_source_gate.py','p11_build_walt_off.sh','test_p11_source_gate.py',\n\
        \          'test_p11_build_dryrun.py','P11_BUILDRUNNER_DRYRUN_TESTS.log'}\ndef load_valid(z,expected,manifest_name):\n\
        \    info=z.infolist();names=[x.filename for x in info]\n    if set(names)!=expected|{manifest_name} or len(names)!=len(set(names)):\n\
        \        raise SystemExit('UNEXPECTED_ARCHIVE_MEMBERS')\n    if z.testzip():raise SystemExit('CRC_FAILURE')\n    for\
        \ i in info:\n        p=pathlib.PurePosixPath(i.filename)\n        if p.is_absolute() or '..' in p.parts or '\\\\\
        ' in i.filename or i.is_dir() or stat.S_IFMT(i.external_attr>>16)==stat.S_IFLNK:\n            raise SystemExit('UNSAFE_ARCHIVE_MEMBER\
        \ '+i.filename)\n    manifest=json.loads(z.read(manifest_name))\n    hashes=manifest.get('files') if manifest_name=='manifest.json'\
        \ and 'files' in manifest else manifest.get('sha256')\n    if set(hashes)!=expected:raise SystemExit('MANIFEST_SCOPE_DRIFT')\n\
        \    for n,digest in hashes.items():\n        if hashlib.sha256(z.read(n)).hexdigest()!=digest:raise SystemExit('HASH_MISMATCH\
        \ '+n)\n    return manifest\nwith zipfile.ZipFile(root) as z:\n    manifest=load_valid(z,expected,'manifest.json')\n\
        \    if manifest.get('kernel')!='5.4.274' or manifest.get('flashable') is not False:raise SystemExit('WRONG_STAGE')\n\
        \    tools.mkdir();bundles.mkdir()\n    for name in ('p11_source_gate.py','p11_build_walt_off.sh','test_p11_source_gate.py','test_p11_build_dryrun.py'):\n\
        \        (tools/name).write_bytes(z.read(name))\n    nested={'P10_MASTER_ORIGINAL.zip':'VEUX_5_4_274_P10_WALT_KOMBI_PATCH_SAMMELPAKET.zip',\n\
        \            'P3_R4_SOURCE_REPLAY.zip':'VEUX_STOCK274_P3_GATE_R4.zip'}\n    for old,new in nested.items():(bundles/new).write_bytes(z.read(old))\n\
        for nested_file,out_folder in [(bundles/'VEUX_STOCK274_P3_GATE_R4.zip',tools/'r4'),\n                            \
        \   (bundles/'VEUX_5_4_274_P10_WALT_KOMBI_PATCH_SAMMELPAKET.zip',tools/'p10')]:\n    with zipfile.ZipFile(nested_file)\
        \ as zi:\n        if zi.testzip():raise SystemExit('NESTED_CRC_FAILURE')\n        for item in zi.infolist():\n   \
        \         p=pathlib.PurePosixPath(item.filename)\n            if p.is_absolute() or '..' in p.parts or '\\\\' in item.filename\
        \ or stat.S_IFMT(item.external_attr>>16)==stat.S_IFLNK:\n                raise SystemExit('NESTED_UNSAFE_PATH')\n\
        \        zi.extractall(out_folder)\nfor path in tools.rglob('*.py'):compile(path.read_bytes(),str(path),'exec')\n\
        print('P11_NESTED_PACKAGE_AND_PYTHON=PASS')\nPY\n"
    - name: Source patch regressions before remote checkout
      if: ${{ steps.package.outputs.present == 'true' }}
      shell: bash
      run: 'set -euo pipefail

        python3 -m unittest discover -s "$P11_TOOL_DIR" -p test_p11_source_gate.py -v

        python3 -m unittest discover -s "$P10_TOOL_DIR" -p test_compose_p10_source.py -v

        python3 -m unittest discover -s "$R4_TOOL_DIR" -p test_stage_stock274.py -v

        python3 project/common/stock274/source_only_r2/test_prepare_stock274_p3.py

        echo ''P11_SOURCE_REGRESSIONS=PASS''

        '
    - name: Checkout pinned P2-v5 historical recipe
      if: ${{ steps.package.outputs.present == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: Chrizz100/veux-resukisu-builder
        ref: e58a67835f266620d4fdb86d816295e401a8858d
        fetch-depth: 1
        path: historical
        persist-credentials: false
    - name: Checkout pinned Positron vendor ancestor (will become exactly 5.4.274)
      if: ${{ steps.package.outputs.present == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: dereference23/kernel_xiaomi_sm6375
        ref: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
        fetch-depth: 0
        path: kernel
        persist-credentials: false
    - name: Install YAML parser for exact P2 reconstruction
      if: ${{ steps.package.outputs.present == 'true' }}
      shell: bash
      run: "set -euo pipefail\nif ! python3 -c 'import yaml; assert hasattr(yaml,\"safe_load\")'; then\n  sudo apt-get update\n\
        \  sudo apt-get install -y --no-install-recommends python3-yaml\nfi\npython3 -c 'import yaml; print(\"P11_YAML_PARSER=PASS\"\
        )'\n"
    - name: Independently ShellCheck each R6 YAML Bash run block
      shell: bash
      run: "set -euo pipefail\nif ! command -v shellcheck >/dev/null 2>&1; then\n  sudo apt-get update -qq\n  sudo apt-get\
        \ install -y -qq shellcheck\nfi\npython3 - <<'PY_R6_SHELLCHECK'\nimport yaml,subprocess,pathlib\ndoc=yaml.safe_load(pathlib.Path('project/.github/workflows/VEUX_OEM_WALT_ABI_R6_EXACT_P3_SOURCE_BRIDGE.yml').read_text())\n\
        blocks=[s['run'] for j in doc['jobs'].values() for s in j['steps'] if isinstance(s,dict) and isinstance(s.get('run'),str)]\n\
        if len(blocks)<9:raise SystemExit('R6_RUN_BLOCKS_MISSING')\nfor i,script in enumerate(blocks,1):\n    p=subprocess.run(['shellcheck','--shell=bash','--severity=warning','-'],input=script,text=True,capture_output=True)\n\
        \    if p.returncode:raise SystemExit('SHELLCHECK_BLOCK_'+str(i)+'_FAIL\\n'+p.stdout+p.stderr)\nprint('R6_INDEPENDENT_SHELLCHECK=PASS;\
        \ BLOCKS='+str(len(blocks)))\nPY_R6_SHELLCHECK\n"
    - name: 'R7 R2 preflight: pinned package, actionlint, ShellCheck, Clang 14/17 test suites'
      shell: bash
      run: "set -euo pipefail\nr7_zip=\"project/$R7_PACKAGE_NAME\"\nr7_yaml='project/.github/workflows/VEUX_OEM_WALT_R7_R2_EXACT_SOURCE_INTERFACE_PREFLIGHT.yml'\n\
        test -f \"$r7_zip\" && test ! -L \"$r7_zip\"\ntest -s \"$r7_yaml\" && test ! -L \"$r7_yaml\"\nprintf '%s  %s\\n' \"\
        $R7_PACKAGE_SHA256\" \"$r7_zip\" | sha256sum -c -\n\"$RUNNER_TEMP/veux-p11-actionlint/actionlint\" -oneline \"$r7_yaml\"\
        \npython3 - <<'PY_R7_SHELLCHECK'\nimport pathlib,subprocess,yaml\np=pathlib.Path('project/.github/workflows/VEUX_OEM_WALT_R7_R2_EXACT_SOURCE_INTERFACE_PREFLIGHT.yml')\n\
        d=yaml.safe_load(p.read_text())\nblocks=[s['run'] for j in d['jobs'].values() for s in j['steps'] if isinstance(s.get('run'),str)]\n\
        if len(blocks)<11: raise SystemExit('R7_YAML_RUN_BLOCKS_MISSING')\nfor i,b in enumerate(blocks,1):\n    r=subprocess.run(['shellcheck','--shell=bash','--severity=warning','-'],input=b,text=True,capture_output=True)\n\
        \    if r.returncode: raise SystemExit(f'SHELLCHECK_BLOCK_{i}: '+r.stdout+r.stderr)\nprint('R7_SELF_ACTIONLINT_AND_SHELLCHECK=PASS;\
        \ blocks='+str(len(blocks)))\nPY_R7_SHELLCHECK\npython3 - <<'PY_R7_EXTRACT'\nfrom pathlib import Path\nimport hashlib,os,stat,zipfile\n\
        src=Path(os.environ['GITHUB_WORKSPACE'])/'project'/os.environ['R7_PACKAGE_NAME']\nout=Path(os.environ['R7_DIR'])\n\
        expect={'r7_walt_interface_audit.py','test_r7_walt_interface_audit.py',\n        'OEM_VEUX_5_4_274.config','R7_START_HIER_DE.txt','R7_TEST_LOG.txt'}\n\
        if out.exists() or out.is_symlink():raise SystemExit('R7_WORK_DIR_EXISTS')\nwith zipfile.ZipFile(src) as z:\n    members=z.infolist();\
        \ names=[m.filename for m in members]\n    if set(names)!=expect|{'SHA256SUMS.txt'} or len(names)!=len(set(names)):\n\
        \        raise SystemExit('R7_ZIP_MEMBER_SCOPE_INVALID')\n    if z.testzip():raise SystemExit('R7_ZIP_CRC_FAILED')\n\
        \    for m in members:\n        if m.is_dir() or '/' in m.filename or chr(92) in m.filename or m.filename.startswith('.')\
        \ or stat.S_IFMT(m.external_attr>>16)==stat.S_IFLNK:\n            raise SystemExit('R7_UNSAFE_MEMBER:'+m.filename)\n\
        \    pins={}\n    for line in z.read('SHA256SUMS.txt').decode().splitlines():\n        h,n=line.split('  ',1)\n  \
        \      if n in pins or len(h)!=64 or any(c not in '0123456789abcdef' for c in h):\n            raise SystemExit('R7_MANIFEST_FORMAT_ERROR')\n\
        \        pins[n]=h\n    if set(pins)!=expect:raise SystemExit('R7_MANIFEST_SCOPE_INVALID')\n    for n in expect:\n\
        \        if hashlib.sha256(z.read(n)).hexdigest()!=pins[n]:raise SystemExit('R7_SHA256_MISMATCH:'+n)\n    out.mkdir()\n\
        \    for n in expect:(out/n).write_bytes(z.read(n))\n    for n in ('r7_walt_interface_audit.py','test_r7_walt_interface_audit.py'):\n\
        \        compile(z.read(n),n,'exec')\nprint('R7_ZIP_MANIFEST_SYNTAX=PASS')\nPY_R7_EXTRACT\nif ! command -v clang >/dev/null;\
        \ then echo 'R7_CLANG_MISSING_NO_DIAGNOSTIC_APPROVAL' >&2; exit 2; fi\npython3 -m unittest discover -s \"$R7_DIR\"\
        \ -p test_r7_walt_interface_audit.py -v\necho 'R7_MODEL_NEGATIVE_TESTS=PASS'\n"
    - name: 'R8 pinned OEM-source patch preflight: actionlint, ShellCheck, 30 negative and compiler regression tests'
      shell: bash
      timeout-minutes: 3
      run: "set -euo pipefail\nr8_zip=\"project/$R8_PACKAGE_NAME\"\nr8_yaml='project/.github/workflows/VEUX_OEM_WALT_R8_EXACT_OEM_INTERFACE_BRIDGE.yml'\n\
        test -s \"$r8_zip\" && test ! -L \"$r8_zip\"\ntest -s \"$r8_yaml\" && test ! -L \"$r8_yaml\"\nprintf '%s  %s\\n' \"\
        $R8_PACKAGE_SHA256\" \"$r8_zip\" | sha256sum -c -\n\"$RUNNER_TEMP/veux-p11-actionlint/actionlint\" -oneline \"$r8_yaml\"\
        \npython3 - <<'PY_R8_SHELLCHECK'\nfrom pathlib import Path\nimport yaml,subprocess\np=Path('project/.github/workflows/VEUX_OEM_WALT_R8_EXACT_OEM_INTERFACE_BRIDGE.yml')\n\
        y=yaml.safe_load(p.read_text())\nblocks=[s['run'] for j in y['jobs'].values() for s in j['steps'] if isinstance(s.get('run'),str)]\n\
        if len(blocks)<15:raise SystemExit('R8_YAML_MISSING_SHELL_BLOCKS')\nfor i,script in enumerate(blocks,1):\n    r=subprocess.run(['shellcheck','--shell=bash','--severity=warning','-'],input=script,text=True,capture_output=True)\n\
        \    if r.returncode:raise SystemExit('R8_SHELLCHECK_BLOCK_'+str(i)+': '+r.stdout+r.stderr)\nprint('R8_SELF_ACTIONLINT_AND_SHELLCHECK=PASS;\
        \ RUN_BLOCKS='+str(len(blocks)))\nPY_R8_SHELLCHECK\npython3 - <<'PY_R8_EXTRACT'\nfrom pathlib import Path,PurePosixPath\n\
        import hashlib,os,stat,zipfile\nsrc=Path(os.environ['GITHUB_WORKSPACE'])/'project'/os.environ['R8_PACKAGE_NAME']\n\
        out=Path(os.environ['R8_DIR'])\nexpect={\n 'r8_walt_oem_interface_gate.py','test_r8_walt_oem_interface_gate.py',\n\
        \ 'R8_WALT_OEM_INTERFACE_BRIDGE.patch','R8_START_HIER_DE.txt','R8_TEST_LOG.txt',\n 'fixtures/r6/source/kernel/sched/sched.h','fixtures/r6/R6_SOURCE_GATE.json',\n\
        \ 'fixtures/r7/R7_WALT_INTERFACE_AUDIT.json','fixtures/OEM_VEUX_5_4_274.config',\n}\nif out.exists() or out.is_symlink():raise\
        \ SystemExit('R8_OUTPUT_PATH_EXISTS')\nwith zipfile.ZipFile(src) as z:\n    members=z.infolist()\n    names=[m.filename\
        \ for m in members]\n    if len(names)!=len(set(names)) or set(names)!=expect|{'SHA256SUMS.txt'}:\n        raise SystemExit('R8_ZIP_MEMBERS_DRIFT')\n\
        \    if z.testzip():raise SystemExit('R8_CRC_FAILURE')\n    for m in members:\n        p=PurePosixPath(m.filename)\n\
        \        if p.is_absolute() or '..' in p.parts or chr(92) in m.filename or m.is_dir() or stat.S_IFMT(m.external_attr>>16)==stat.S_IFLNK:\n\
        \            raise SystemExit('R8_UNSAFE_ZIP_MEMBER:'+m.filename)\n    pins={}\n    for line in z.read('SHA256SUMS.txt').decode().splitlines():\n\
        \        h,n=line.split('  ',1)\n        if n in pins or len(h)!=64 or any(c not in '0123456789abcdef' for c in h):\n\
        \            raise SystemExit('R8_MANIFEST_FORMAT_DRIFT')\n        pins[n]=h\n    if set(pins)!=expect:raise SystemExit('R8_MANIFEST_SCOPE_DRIFT')\n\
        \    for n in expect:\n        if hashlib.sha256(z.read(n)).hexdigest()!=pins[n]:\n            raise SystemExit('R8_MEMBER_SHA_DRIFT:'+n)\n\
        \    out.mkdir()\n    for n in expect:\n        target=out/n\n        target.parent.mkdir(parents=True,exist_ok=True)\n\
        \        target.write_bytes(z.read(n))\n    for n in ('r8_walt_oem_interface_gate.py','test_r8_walt_oem_interface_gate.py'):\n\
        \        compile(z.read(n),n,'exec')\nprint('R8_ZIP_MEMBER_HASH_AND_PYTHON=PASS')\nPY_R8_EXTRACT\ncommand -v clang\
        \ >/dev/null\npython3 -m unittest discover -s \"$R8_DIR\" -p test_r8_walt_oem_interface_gate.py -v\necho 'R8_30_REGRESSION_TESTS=PASS'\n"
    - name: 'R9 pinned package preflight: actionlint ShellCheck 40 self-tests before heavy replay'
      shell: bash
      timeout-minutes: 4
      run: "set -euo pipefail\nr9_zip=\"project/$R9_PACKAGE_NAME\"\nr9_yaml='project/.github/workflows/VEUX_OEM_WALT_R9_EXACT_REAL_WALT_ON_OBJECT_COMPILER.yml'\n\
