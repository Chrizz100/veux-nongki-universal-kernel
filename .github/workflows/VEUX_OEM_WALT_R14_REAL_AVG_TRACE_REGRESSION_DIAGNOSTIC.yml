        \ PASSED='+str(r['object_success_count'])+'/4; IMAGE=NO; VENDOR_ABI=OPEN; FLASH=NO')\nPY_R12_RESULT\n"
    - name: R13 genuine WALT subsystem ARM64 Kbuild six remaining objects
      shell: bash
      run: |
        set -euo pipefail
        python3 "$R13_DIR/r13_walt_subsystem_probe.py" \
          --snapshot "$R9_SNAPSHOT" \
          --objout "$R13_OBJOUT" \
          --r12-report "$R12_REPORT" \
          --r12-source-dir "$R12_OUT" \
          --toolchain "$R9_TOOLCHAIN" \
          --driver "$R9_DIR/r9_walt_real_object_compile.py" \
          --stock "$R9_DIR/OEM_VEUX_5_4_274.config" \
          --output "$R13_REPORT" \
          --project "$GITHUB_WORKSPACE/project"
        python3 - <<'PY_R13_RESULT'
        import json,os,pathlib
        p=pathlib.Path(os.environ['R13_REPORT'])/'R13_SUBSYSTEM_RESULT.json'
        r=json.loads(p.read_text())
        acceptable={'R13_SIX_ADDITIONAL_WALT_OBJECTS_COMPILED','R13_COMPONENT_COMPILER_ERRORS_RECORDED'}
        if r['status'] not in acceptable:raise SystemExit('R13_DIAGNOSTIC_UNEXPECTED_STATUS')
        if r['source_r12_verified'] is not True or len(r['objects'])!=6:raise SystemExit('R13_INCOMPLETE_COMPILER_REPORT')
        if r['object_success_count']!=sum(bool(x['compiled']) for x in r['objects'].values()):
            raise SystemExit('R13_FALSE_SUCCESS_COUNT')
        if any(r[k] for k in ('kernel_image_built','vmlinux_linked','module_symvers_verified','vendor_abi_proven','flash_allowed','brene_changed','bakasusu_nomount_changed')):
            raise SystemExit('R13_FORBIDDEN_SUCCESS_CLAIM')
        print('R13_COMPILER_STATUS='+r['status']+'; PASSED='+str(r['object_success_count'])+'/6; IMAGE=NO; ABI=NO; FLASH=NO')
        PY_R13_RESULT
    - name: R14 source-only restore genuine Xiaomi CPU util AVG type and freq helper
      shell: bash
      run: |
        set -euo pipefail
        python3 "$R14_DIR/r14_walt_source_bridge.py" \
          --snapshot "$R9_SNAPSHOT" \
          --r11-gate "$R11_OUT/R11_SOURCE_GATE.json" \
          --r13-result "$R13_REPORT/R13_SUBSYSTEM_RESULT.json" \
          --output "$R14_OUT"
        python3 - <<'PY_R14_STAGE'
        import hashlib,json,os,pathlib
        p=pathlib.Path(os.environ['R14_OUT'])
        gate=json.loads((p/'R14_SOURCE_GATE.json').read_text())
        if gate['status']!='R14_REAL_XIAOMI_AVG_TRACE_HELPERS_STAGED_NOT_COMPILED':
            raise SystemExit('R14_SOURCE_STAGING_NOT_PROVEN')
        if gate['modified_files']!=['kernel/sched/sched.h','kernel/sched/fair.c']:
            raise SystemExit('R14_UNAUTHORIZED_PATCH_SCOPE')
        if any(gate[k] for k in ('kernel_image_built','vmlinux_linked','vendor_abi_proven','flash_allowed','brene_changed','bakasusu_nomount_changed')):
            raise SystemExit('R14_UNSAFE_SOURCE_CLAIM')
        for name,expected in gate['after_sha256'].items():
            current=pathlib.Path(os.environ['R9_SNAPSHOT'])/name
            if hashlib.sha256(current.read_bytes()).hexdigest()!=expected:
                raise SystemExit('R14_SOURCE_POSTIMAGE_CHANGED:'+name)
        print('R14_SOURCE_2_FILE_GATE=PASS; BUILD=PENDING; FLASH=NO')
        PY_R14_STAGE
        git -C "$R9_SNAPSHOT" apply --reverse --check "$R14_OUT/R14_WALT_AVG_TRACE.patch"
    - name: R14 real ARM64 recompile all four proven and six additional WALT objects
      shell: bash
      run: |
        set -euo pipefail
        python3 "$R14_DIR/r14_walt_recompile.py" \
          --snapshot "$R9_SNAPSHOT" \
          --objout "$R13_OBJOUT" \
          --toolchain "$R9_TOOLCHAIN" \
          --r12-report "$R12_REPORT" \
          --r13-report "$R13_REPORT" \
          --source-gate "$R14_OUT/R14_SOURCE_GATE.json" \
          --driver "$R9_DIR/r9_walt_real_object_compile.py" \
          --output "$R14_REPORT" \
          --project "$GITHUB_WORKSPACE/project"
        python3 - <<'PY_R14_RESULT'
        import json,os,pathlib
        p=pathlib.Path(os.environ['R14_REPORT'])/'R14_COMPILER_RESULT.json'
        obj=json.loads(p.read_text())
        allowed={'R14_TEN_REAL_OBJECTS_COMPILED_NO_LINK','R14_BASELINE_COMPILER_REGRESSION_RECORDED',
                 'R14_WALT_SUBSYSTEM_COMPILER_ERRORS_RECORDED'}
        if obj['status'] not in allowed:raise SystemExit('R14_UNRECOGNIZED_COMPILER_STATUS')
        if not obj['source_r14_verified'] or not obj['real_arm64_make_attempted'] or len(obj['objects'])!=10:
            raise SystemExit('R14_INCOMPLETE_10_OBJECT_PROOF')
        if obj['object_success_count']!=sum(x['compiled'] for x in obj['objects'].values()):
            raise SystemExit('R14_FALSE_SUCCESS_COUNT')
        if any(obj[k] for k in ('kernel_image_built','vmlinux_linked','vendor_abi_proven','flash_allowed','brene_changed','bakasusu_nomount_changed')):
            raise SystemExit('R14_UNSAFE_COMPILER_CLAIM')
        print('R14_GITHUB_OBJECTS='+str(obj['object_success_count'])+'/10; BASE='+str(obj['baseline_objects_compiled'])+'/4; ADDITIONAL='+str(obj['additional_objects_compiled'])+'/6; STATUS='+obj['status']+'; FLASH=NO')
        PY_R14_RESULT
