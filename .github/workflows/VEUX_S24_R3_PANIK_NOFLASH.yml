name: VEUX S24 R3 – Panikpfade – SUSFS 2.4, BakaSU, NoMount auf Xiaomi Global
'on':
  workflow_dispatch:
  push:
    branches: [main, repair/veux-s24-r3-panik]
    paths:
      - VEUX_S24_R3_PANIK_MAIN.zip
      - .github/workflows/VEUX_S24_R3_PANIK_NOFLASH.yml

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      LLDB: lldb-19
      KBUILD_JOBS: 4
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /VEUX_S24_R3_PANIK_MAIN.zip
            /VEUX_S24_R2_PID1_MAIN.zip
      - name: Geprüftes R3-Baupaket wiederherstellen
        env:
          R2_SHA256: a3220efea5594440c3449b0535a98e4dd8a870c5f0c72812e0d820a9c69c3744
          R3_UPLOAD_SHA256: 54318686f754f94ebf591b9d4d1ea07183226e8da523d1c9075892215d96b822
          R3_SHA256: 96581a4e8c391a8b3dc5162b9e807550e0b483ca50efc19e80f13df413a0ec56
        run: |
          set -euo pipefail
          upload=VEUX_S24_R3_PANIK_MAIN.zip
          actual=$(sha256sum "$upload" | cut -d ' ' -f 1)
          case "$actual" in
            "$R3_UPLOAD_SHA256")
              stage=$(mktemp -d "$RUNNER_TEMP/veux-r3.XXXXXXXX")
              base=VEUX_S24_R2_PID1_MAIN.zip
              if ! printf '%s  %s\n' "$R2_SHA256" "$base" | sha256sum --check --status 2>/dev/null; then
                base="$stage/r2.zip"
                curl --fail --silent --show-error --location --retry 3 --output "$base" \
                  https://raw.githubusercontent.com/Chrizz100/veux-nongki-universal-kernel/03534d35ef9750416f74fee017a3982d41369edf/VEUX_S24_R2_PID1_MAIN.zip
              fi
              printf '%s  %s\n' "$R2_SHA256" "$base" | sha256sum --check
              cp "$base" "$stage/baupaket.zip"
              unzip -p "$upload" r2-nach-r3.patch > "$stage/r2-nach-r3.patch"
              git -C "$stage" apply --binary "$stage/r2-nach-r3.patch"
              full="$stage/baupaket.zip"
              ;;
            "$R3_SHA256")
              full="$upload"
              ;;
            *)
              echo "Die SHA-256-Prüfsumme der R3-MAIN-ZIP ist unbekannt." >&2
              exit 1
              ;;
          esac
          printf '%s  %s\n' "$R3_SHA256" "$full" | sha256sum --check
          unzip -q "$full" -d "$RUNNER_TEMP/veux-kit"
      - name: Bauwerkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bc bison build-essential cpio flex libelf-dev libssl-dev lldb-19 liblldb-19-dev python3-lldb-19 qemu-user rsync zstd
      - name: Android-Clang wiederverwenden
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/m61/clang
          key: veux-linux-x64-clang-r416183b-0a90693130898d6f98a76538086247b374d4a57f
      - name: Xiaomi-Quellen und originales Bootabbild wiederverwenden
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/veux-inputs
          key: veux-s24-micode-61397e52-r11-bc664e31-stock-ac6522e4-v1
      - name: Quellbaum und Stock-Referenz verifizieren
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/veux-kit"
          tools="$kit/oem/tools"
          clang="$RUNNER_TEMP/m61/clang"
          mkdir -p "$RUNNER_TEMP/m61" "$RUNNER_TEMP/veux-inputs"
          if ! [[ -x "$clang/bin/clang" ]] || ! python3 "$tools/treehash.py" "$clang"; then
            if [[ -e "$clang" ]]; then mv "$clang" "$RUNNER_TEMP/clang-unverified"; fi
            bash "$tools/toolchain.sh" "$clang"
          fi
          python3 "$kit/prepare.py" base "$RUNNER_TEMP/veux-build/src" --micode "$RUNNER_TEMP/veux-inputs/micode.git" --stock "$RUNNER_TEMP/veux-inputs/boot.img"
      - name: SUSFS, BakaSU und danach NoMount bauen
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/veux-kit/build.sh" "$RUNNER_TEMP/veux-build" "$RUNNER_TEMP/m61/clang" "$RUNNER_TEMP/veux-inputs/boot.img"
      - name: Ausführbare Abschnitte mit LLDB und dem lokalen Kontrolldatensatz abgleichen
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/veux-kit"
          work="$RUNNER_TEMP/veux-build"
          g++ -std=c++17 -O2 "$kit/section_check.cpp" -I/usr/lib/llvm-19/include -L/usr/lib/llvm-19/lib -Wl,-rpath,/usr/lib/llvm-19/lib -llldb -o "$work/section-check"
          python3 "$kit/decode.py" "$work/section-check" "$work/out/vmlinux" "$work/out/arch/arm64/boot/Image" "$work/evidence" S24
          python3 "$kit/local_reference.py" "$work/out/arch/arm64/boot/Image" "$work/evidence"
          cp "$work/out/System.map" "$work/out/vmlinux" "$work/evidence/"
          cat "$work/evidence/Panik-Image.json" "$work/evidence/Vergleich-lokaler-Bau.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Prüfungen und Debugdateien sichern
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: VEUX-S24-R3-LLDB-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/veux-build/evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Bootabbild und AK3-Pakete ausgeben
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: VEUX-S24-R3-BOOT-AK3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/veux-build/pair/
          if-no-files-found: error
          retention-days: 30
