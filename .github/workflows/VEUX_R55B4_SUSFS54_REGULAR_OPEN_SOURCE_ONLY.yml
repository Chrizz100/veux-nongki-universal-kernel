    - name: Strict actionlint YAML duplicate keys and ShellCheck gate
      run: "set -euo pipefail\narchive=project/VEUX_R39_R2_MEMORY_ABI_MAIN.zip\nprintf '%s  %s\\n' '745d80b8502a9beea513a2e7a58bb59272539b7508920d235ce2e79741bda528'\
        \ \"$archive\" | sha256sum -c -\nunzip -p \"$archive\" tools/actionlint > \"$R55_STAGE/actionlint\"\nchmod 0755 \"\
        $R55_STAGE/actionlint\"\n\"$R55_STAGE/actionlint\" -version | grep -Fx '1.7.12'\n\"$R55_STAGE/actionlint\" -color=false\
        \ -shellcheck='' \"project/.github/workflows/VEUX_R55B4_SUSFS54_REGULAR_OPEN_SOURCE_ONLY.yml\" > \"$R55_STAGE/R55B4_ACTIONLINT.log\"\
        \nprintf 'R55B4_ACTIONLINT_1_7_12=PASS\\n' >> \"$R55_STAGE/R55B4_ACTIONLINT.log\"\npython3 -B - <<'PY_R55B4_CHECK_YAML'\n\
        import pathlib,hashlib,subprocess,yaml\nclass Unique(yaml.SafeLoader):pass\ndef mapping(loader,node):\n    result={}\n\
        \    for k,v in node.value:\n        key=loader.construct_object(k)\n        if key in result:raise RuntimeError('DUPLICATE_KEY:'+str(key))\n\
        \        result[key]=loader.construct_object(v)\n    return result\nUnique.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,mapping)\n\
        p=pathlib.Path('project/.github/workflows/VEUX_R55B4_SUSFS54_REGULAR_OPEN_SOURCE_ONLY.yml')\nw=yaml.load(p.read_text(),Loader=Unique)\n\
        assert list(w['on'])==['workflow_dispatch']\nassert w['permissions']=={'contents':'read'}\nassert set(w['jobs'])=={'r55b4_source'}\n\
        j=w['jobs']['r55b4_source']\nassert j['runs-on']=='ubuntu-24.04'\nassert 'github.repository' in j['if'] and 'refs/heads/main'\
        \ in j['if']\ns=j['steps']\nassert len(s)==9\nfor i in (0,1):\n    assert s[i]['uses']=='actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683'\n\
        \    assert s[i]['with']['persist-credentials'] is False\nassert s[1]['with']['repository']=='dereference23/kernel_xiaomi_sm6375'\n\
        assert s[1]['with']['ref']=='b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'\nassert s[8]['uses']=='actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02'\n\
        assert s[8]['with']['if-no-files-found']=='error'\nlogs=[]\nfor step in s:\n    if 'run' not in step:continue\n  \
        \  body=step['run']\n    if '$'+'{' in body:raise RuntimeError('SCRIPT_GITHUB_EXPRESSION')\n    for cmd in (['bash','-n','-'],['shellcheck','--shell=bash','--severity=warning','-']):\n\
        \        r=subprocess.run(cmd,input=body,text=True,capture_output=True)\n        if r.returncode:raise RuntimeError('SHELL_INVALID:'+step['name']+':'+r.stdout+r.stderr)\n\
        \    logs.append(step['name']+' BASH_SHELLCHECK_PASS SHA256='+hashlib.sha256(body.encode()).hexdigest())\npathlib.Path('/tmp/veux-r55b4/R55B4_SHELLCHECK.log').write_text('\\\
        n'.join(logs)+'\\n')\nprint('R55B4_ACTIONS_INPUTS_DUPLICATE_KEY_SHELLCHECK_PASS')\nPY_R55B4_CHECK_YAML\n"
    - name: Run 26 negative tests and executable reference harness
      run: "set -euo pipefail\npython3 -B - <<'PY_R55B4_AST'\nimport ast,pathlib\nfor path in ('scripts/r55b4_regular_open.py','tests/test_r55b4_regular_open.py'):\n\
        \    p=pathlib.Path('/tmp/veux-r55b4')/path\n    ast.parse(p.read_text('utf-8'),filename=str(p))\nprint('R55B4_PYTHON_AST_PASS')\n\
        PY_R55B4_AST\npython3 -B -m unittest discover -v -s \"$R55_STAGE/tests\" -p 'test_*.py' 2>&1 | tee \"$R55_STAGE/R55B4_TESTS.log\"\
        \ngrep -Eq '^Ran 26 tests in [0-9.]+s$' \"$R55_STAGE/R55B4_TESTS.log\"\ngrep -Fx 'OK' \"$R55_STAGE/R55B4_TESTS.log\"\
        \necho 'R55B4_26_C_EXECUTABLE_NEGATIVE_TESTS_PASS'\n"
    - name: Replay real R55B3 and port ordinary-open preflight on pinned source
      run: "set -euo pipefail\ntest \"$(git -C kernel rev-parse HEAD)\" = 'b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'\ntest\
        \ \"$(git -C kernel hash-object fs/namei.c)\" = '7c74159e29355e209b1cf4749aae23110f21a098'\npython3 -B \"$R55_STAGE/scripts/r55b4_regular_open.py\"\
        \ \\\n  --source kernel --base \"$R55_STAGE/inputs/R55B3_AUTHENTIC_15FILES.patch\" \\\n  --out \"$R55_STAGE/out\"\
        \ 2>&1 | tee \"$R55_STAGE/R55B4_REAL_SOURCE.log\"\n(cd \"$R55_STAGE/out\" && sha256sum -c SHA256SUMS.txt)\n"
    - name: Independent clean 15-file Git replay with new-file intent-to-add
      run: "set -euo pipefail\ntest \"$(git -C kernel rev-parse HEAD)\" = 'b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'\ngit\
        \ -C kernel worktree add --detach \"$R55_STAGE/replay\" 'b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'\ngit -C \"$R55_STAGE/replay\"\
        \ apply --check --whitespace=error \"$R55_STAGE/out/VEUX_R55B4_15_FILES_NORMAL_OPEN_PREFLIGHT_NOFLASH.patch\"\ngit\
        \ -C \"$R55_STAGE/replay\" apply --whitespace=error \"$R55_STAGE/out/VEUX_R55B4_15_FILES_NORMAL_OPEN_PREFLIGHT_NOFLASH.patch\"\
        \n# R55B4-R2: Git does not report newly added, untracked files in git diff.\n# Fail closed unless precisely the 3\
        \ authentic SUSFS new files are untracked.\ngit -C \"$R55_STAGE/replay\" ls-files --others --exclude-standard | LC_ALL=C\
        \ sort > \"$R55_STAGE/R55B4_R2_UNTRACKED.txt\"\nprintf '%s\\n' fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h\
        \ | LC_ALL=C sort | diff -u - \"$R55_STAGE/R55B4_R2_UNTRACKED.txt\"\n# Intent-to-add makes the new files visible to\
        \ git diff WITHOUT staging content.\ngit -C \"$R55_STAGE/replay\" add -N -- fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h\n\
        git -C \"$R55_STAGE/replay\" diff --check\npython3 -B - <<'PY_R55B4_REAL_REPLAY'\nimport pathlib,hashlib,json,subprocess\n\
        s=pathlib.Path('/tmp/veux-r55b4')\nk=pathlib.Path('kernel');r=s/'replay';out=s/'out'\nfiles=set([\n 'block/ioprio.c','fs/Makefile','fs/namei.c','fs/namespace.c',\n\
        \ 'fs/notify/fdinfo.c','fs/proc/cmdline.c','fs/proc/fd.c','fs/proc_namespace.c',\n 'fs/readdir.c','fs/statfs.c','fs/susfs.c','include/linux/mount.h',\n\
        \ 'include/linux/susfs.h','include/linux/susfs_def.h','kernel/kallsyms.c'])\nproc=subprocess.run(['git','-C',str(r),'diff','--name-only'],text=True,capture_output=True,check=True)\n\
        assert set(proc.stdout.splitlines())==files\nfor name in files:\n    a=(k/name).read_bytes();b=(r/name).read_bytes()\n\
        \    assert hashlib.sha256(a).digest()==hashlib.sha256(b).digest(),name\nproc=subprocess.run(['git','-C',str(r),'diff','--binary','--no-ext-diff'],text=True,capture_output=True,check=True)\n\
        a=(out/'VEUX_R55B4_15_FILES_NORMAL_OPEN_PREFLIGHT_NOFLASH.patch').read_bytes()\nassert proc.stdout.encode()==a\nprint('R55B4_REAL_15_FILES_BYTE_IDENTICAL_REPLAY_PASS')\n\
        PY_R55B4_REAL_REPLAY\n"
    - name: Final source scope checksums and NOFLASH gates
      run: "set -euo pipefail\npython3 -B - <<'PY_R55B4_FINAL'\nimport pathlib,json,hashlib\ns=pathlib.Path('/tmp/veux-r55b4');out=s/'out'\n\
        r=json.loads((out/'R55B4_RESULT.json').read_text())\nassert r['stage']=='R55B4_REGULAR_OPEN_SOURCE_ONLY_UNCOMPILED'\n\
        assert r['files_total']==15 and r['flash_allowed'] is False\nassert r['kernel_compiled'] is False and r['device_tested']\
        \ is False\nassert r['brene_changed'] is False and r['vendor_changed'] is False\nassert r['exclusive_open_creat_redirected']\
        \ is False\nfor name in ('R55B4_ACTIONLINT.log','R55B4_SHELLCHECK.log','R55B4_TESTS.log','R55B4_REAL_SOURCE.log'):\n\
        \    target=s/name\n    assert target.stat().st_size>5,name\n    (out/name).write_bytes(target.read_bytes())\n(out/'SHA256SUMS.txt').write_text(''.join(\n\
        \ f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\\n' for p in sorted(out.iterdir()) if p.is_file() and p.name!='SHA256SUMS.txt'))\n\
        print('R55B4_SOURCE_ONLY_NO_FLASH_SCOPE_SHA256_PASS')\nPY_R55B4_FINAL\n(cd \"$R55_STAGE/out\" && sha256sum -c SHA256SUMS.txt)\n\
        git -C kernel apply --reverse --check \"$R55_STAGE/out/VEUX_R55B4_15_FILES_NORMAL_OPEN_PREFLIGHT_NOFLASH.patch\"\n\
        test -z \"$(git -C project status --porcelain --untracked-files=all)\"\necho 'R55B4_ORIGINAL_PROJECT_UNMODIFIED_AND_NOFLASH_PASS'\n"
