# Save as: .github/workflows/veux-charger-sc8551-adc-5.4.274.yml
# Diag08: exact validated Diag07 drivers plus SC8551 ADC read-error handling.
# Manual and self-contained. Accepts only the reviewed regular Diag06/Diag07 baselines.
# No upstream update, repo promotion, permanent diagnostics or device PASS claim.
name: VEUX 5.4.274 Charger Diagnostic 08 - SC8551 ADC
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: veux-charger-sc8551-adc-5.4.274
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  diagnostic:
    name: Build validated Diag07 plus SC8551 ADC correction
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - name: Checkout exact project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 1
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Install build dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends bc binutils bison build-essential ca-certificates curl dwarves file flex git jq libelf-dev libncurses-dev libssl-dev perl python3 python3-venv python3-yaml rsync unzip zip xz-utils zstd
        python3 -m venv "$RUNNER_TEMP/veux-python"
        "$RUNNER_TEMP/veux-python/bin/python" -m pip install ruamel.yaml==0.19.1 PyYAML==6.0.3
    - name: Verify regular release regression tests
      shell: bash
      run: |
        set -euo pipefail
        for test in test_veux_update_engine.py test_veux_release.py test_veux_device_fixes.py test_veux_source_transport.py; do
          "$RUNNER_TEMP/veux-python/bin/python" "common/scripts/$test"
        done
    - name: Prepare isolated cumulative Diag08 candidate
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/veux-diag08-reports"
        exec > >(tee "$RUNNER_TEMP/veux-diag08-reports/preparation.log") 2>&1
        git clone --quiet --no-hardlinks . "$RUNNER_TEMP/veux-diag08-project"
        cd "$RUNNER_TEMP/veux-diag08-project"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        "$RUNNER_TEMP/veux-python/bin/python" - <<'PY_DIAG08'
        from pathlib import Path
        import hashlib
        import json
        repo = Path.cwd()
        def require(ok, message):
            if not ok: raise SystemExit('BLOCKED: '+message)
        def digest(path):
            require(path.is_file() and not path.is_symlink(), 'missing or linked input: '+str(path))
            return hashlib.sha256(path.read_bytes()).hexdigest()
        pins={'common/scripts/veux_update_engine.py': '4f9ed7edfd19c802850039c654a5331f653d6fe07460c4680735534808b58b8d', 'common/scripts/veux_release.py': 'd8ab6d1724d25bc77b65e201eaac34d0f35bd0ac70b59b4eb822faa377c2a258', 'common/scripts/veux_release_device.py': '6b0bb0c8815c2544461f42af621b523162fe674821561b5c5c7e09315ac67926', 'common/scripts/veux_source_transport.py': '238a1d3c3c4b49b99b91c468942af28cad8f67401cdba8ea704b5d9a898fc3e7'}
        baselines={'34070dd94ca2b325da150002dd921c4710d8b3299b79349c87a34ad51e92e51c': {'id': 'charger-diag06', 'path': 'common/device-fixes/5.4.274/charger-diag06/manifest.json', 'manifest_sha256': 'dba0faed1d98d0dbab0d722f3aae4e51f11da59652b7135fca25a69541790519'}, 'e4bd148712e22b41c40b661329c8bca559a2853c923412790838ce56570a8291': {'id': 'charger-diag07', 'path': 'common/device-fixes/5.4.274/charger-diag07/manifest.json', 'manifest_sha256': 'bfce360fccf2e3acf70ef25e8056dbf4cf8be755ad259a98b38cfffc86a15582'}}
        for name, expected in pins.items():
            require(digest(repo/name) == expected, 'baseline drift: '+name)
        baseline = baselines.get(digest(repo/'common/scripts/veux_device_fixes.py'))
        require(baseline is not None, 'unreviewed regular device-fix engine')
        require(digest(repo/baseline['path']) == baseline['manifest_sha256'], 'regular patch manifest drift')
        folder=repo/'common/diagnostics/charger-5.4.274-sc8551-build'
        folder.mkdir(parents=True, exist_ok=False)
        payload='--- a/drivers/power/supply/qcom/bq2589x_charger.c\n+++ b/drivers/power/supply/qcom/bq2589x_charger.c\n@@ -16,6 +16,7 @@\n #include <linux/init.h>\n #include <linux/interrupt.h>\n #include <linux/module.h>\n+#include <linux/mutex.h>\n #include <linux/power_supply.h>\n #include <linux/slab.h>\n #include <linux/kernel.h>\n@@ -85,6 +86,9 @@\n \n \tbool\tenabled;\n \tbool\tis_bq25890h;\n+\t/* Serialize external IIO operations against the start of shutdown. */\n+\tstruct mutex io_lock;\n+\tbool stopping;\n \n \tint\t\tvbus_volt;\n \tint\t\tvbat_volt;\n@@ -143,8 +147,11 @@\n \t\t\tmutex_unlock(&bq2589x_i2c_lock);\n \t\t\tcount--;\n \t\t} else {\n-\t\t\t*data = (u8)ret;\n+\t\t\tif (ret >= 0)\n+\t\t\t\t*data = (u8)ret;\n \t\t\tmutex_unlock(&bq2589x_i2c_lock);\n+\t\t\tif (ret < 0)\n+\t\t\t\treturn ret;\n \t\t\tbreak;\n \t\t}\n \t\tudelay(200);\n@@ -179,14 +186,14 @@\n }\n \n \n-static enum bq2589x_vbus_type bq2589x_get_vbus_type(struct bq2589x *bq)\n+static int bq2589x_get_vbus_type(struct bq2589x *bq)\n {\n \tu8 val = 0;\n \tint ret;\n \n \tret = bq2589x_read_byte(bq, &val, BQ2589X_REG_0B);\n \tif (ret < 0)\n-\t\treturn 0;\n+\t\treturn ret;\n \tval &= BQ2589X_VBUS_STAT_MASK;\n \tval >>= BQ2589X_VBUS_STAT_SHIFT;\n \n@@ -195,11 +202,11 @@\n \n static int  bq2589x_get_chg_type(struct bq2589x *bq)\n {\n-\tu8 val;\n \tint type, real_type;\n \n-\tval = bq2589x_get_vbus_type(bq);\n-\ttype = (int)val;\n+\ttype = bq2589x_get_vbus_type(bq);\n+\tif (type < 0)\n+\t\treturn type;\n \n \tif(!bq->is_bq25890h && bq->old_type == BQ2589X_VBUS_UNKNOWN) {\n \t\ttype = BQ2589X_VBUS_NONSTAND;\n@@ -461,11 +468,66 @@\n \treturn bq2589x_update_bits(bq, BQ2589X_REG_06, BQ2589X_VREG_MASK, val << BQ2589X_VREG_SHIFT);\n }\n \n+/* Match the 5 V threshold already used when an adapter is disconnected. */\n+#define BQ2589X_5V_VINDPM_MV 4400\n+\n+static bool bq2589x_is_5v_input(int vbus)\n+{\n+\treturn vbus >= 4800 && vbus <= 5500;\n+}\n+\n int bq2589x_set_input_volt_limit(struct bq2589x *bq, int volt)\n {\n+\tint vbus;\n \tu8 val;\n+\n+\t/* A cached MAXC classification can outlive the negotiated 9 V supply. */\n+\tif (volt > 5500 && bq->cfg.enable_term && !bq->cfg.otg_status) {\n+\t\tvbus = bq2589x_adc_read_vbus_volt(bq);\n+\t\tif (vbus < 0)\n+\t\t\treturn vbus;\n+\t\tif (bq2589x_is_5v_input(vbus))\n+\t\t\tvolt = BQ2589X_5V_VINDPM_MV;\n+\t}\n \tval = (volt - BQ2589X_VINDPM_BASE) / BQ2589X_VINDPM_LSB;\n \treturn bq2589x_update_bits(bq, BQ2589X_REG_0D, BQ2589X_VINDPM_MASK, val << BQ2589X_VINDPM_SHIFT);\n+}\n+\n+static int bq2589x_restore_5v_vindpm(struct bq2589x *bq)\n+{\n+\tint vbus, vindpm, ret;\n+\tu8 reg;\n+\n+\t/* Termination is disabled while the charge pump owns the charging path. */\n+\tif (!bq->cfg.enable_term || bq->cfg.otg_status)\n+\t\treturn 0;\n+\tvbus = bq2589x_adc_read_vbus_volt(bq);\n+\tif (vbus < 0)\n+\t\treturn vbus;\n+\tif (!bq2589x_is_5v_input(vbus))\n+\t\treturn 0;\n+\tret = bq2589x_read_byte(bq, &reg, BQ2589X_REG_0D);\n+\tif (ret < 0)\n+\t\treturn ret;\n+\t/* Do not override the chip\'s relative VINDPM algorithm. */\n+\tif (!(reg & BQ2589X_FORCE_VINDPM_MASK))\n+\t\treturn 0;\n+\tvindpm = BQ2589X_VINDPM_BASE +\n+\t\t((reg & BQ2589X_VINDPM_MASK) >> BQ2589X_VINDPM_SHIFT) *\n+\t\tBQ2589X_VINDPM_LSB;\n+\tif (vindpm <= vbus)\n+\t\treturn 0;\n+\tret = bq2589x_set_input_volt_limit(bq, BQ2589X_5V_VINDPM_MV);\n+\tif (ret < 0)\n+\t\treturn ret;\n+\tret = bq2589x_read_vindpm_volt(bq);\n+\tif (ret < 0)\n+\t\treturn ret;\n+\tif (ret != BQ2589X_5V_VINDPM_MV)\n+\t\treturn -EIO;\n+\tdev_info(bq->dev, "%s: VBUS %d mV, VINDPM %d -> %d mV\\n",\n+\t\t __func__, vbus, vindpm, ret);\n+\treturn 0;\n }\n \n int bq2589x_set_input_current_limit(struct bq2589x *bq, int curr)\n@@ -525,6 +587,8 @@\n \tint ret = 0;\n \tu8 data=0;\n \tret = bq2589x_read_byte(bq, &data, BQ2589X_REG_02);\n+\tif (ret < 0)\n+\t\treturn ret;\n \t//pr_err("%s data(0x%x)\\n",  __func__, data);\n \tdata &= (BQ2589X_FORCE_DPDM << BQ2589X_FORCE_DPDM_SHIFT);\n \t*done = (data >> BQ2589X_FO