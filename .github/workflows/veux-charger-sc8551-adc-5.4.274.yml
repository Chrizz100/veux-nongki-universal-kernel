        payload='#!/usr/bin/env python3\n"""Scope, baseline and publication gates for the isolated SC8551 candidate."""\nimport importlib.util\nimport json\nimport os\nfrom pathlib import Path\nimport tempfile\nimport unittest\nfrom unittest import mock\nimport veux_update_engine as e\nimport veux_device_fixes as f\n\nspec = importlib.util.spec_from_file_location(\'diag08\', Path(__file__).with_name(\'run_diag08.py\'))\nx = importlib.util.module_from_spec(spec)\nspec.loader.exec_module(x)\n\n\nclass CandidateTests(unittest.TestCase):\n    def test_cumulative_diag07_and_sc8551_scope(self):\n        targets = x.authenticate()\n        baseline = x.regular_baseline()\n        old = json.loads((e.REPO/baseline[\'path\']).read_text())\n        with x.candidate_patches():\n            _, candidate, proof = f.load(x.KERNEL)\n            self.assertEqual(candidate[\'files\'][0], old[\'files\'][0])\n            self.assertEqual(candidate[\'files\'][1][\'after_sha256\'],\n                \'c8c785d03e2c723c9a23b89f7728e16ee3bb07e888e8cfc221ce406b6f73d1ef\')\n            if baseline[\'id\'] == \'charger-diag07\':\n                self.assertEqual(candidate[\'files\'][:2], old[\'files\'])\n            else:\n                self.assertEqual(candidate[\'files\'][1][\'extra_tests\'][0], old[\'files\'][1][\'extra_tests\'][0])\n                self.assertEqual(candidate[\'files\'][1][\'test_sha256\'], old[\'files\'][1][\'test_sha256\'])\n            self.assertEqual(candidate[\'files\'][2][\'source\'], \'drivers/power/supply/qcom/sc8551_charger.c\')\n            self.assertEqual(candidate[\'files\'][2][\'after_sha256\'],\n                \'035d1204b1a4796546c90ab1f448f9ba00889164c731719e3096e4fcafc5cd69\')\n            self.assertEqual(proof[\'id\'], \'charger-diag08\')\n            self.assertEqual(len(candidate[\'files\']), 3)\n            self.assertEqual({t[\'test\'] for row in candidate[\'files\'] for t in f.host_tests(row)},\n                {\'test_bq2589x.py\', \'test_i2c_callers.py\', \'test_usb_voltage.py\',\n                 \'test_usb_type.py\', \'test_battery_voltage.py\', \'test_sc8551_adc.py\'})\n        self.assertEqual(f.expected(x.KERNEL)[0][\'id\'], baseline[\'id\'])\n        self.assertEqual(targets[\'lineages\'], [\'5.4.274\'])\n        self.assertEqual({k:v[\'commit\'] for k,v in targets[\'components\'].items()}, x.COMMITS)\n\n    def test_selection_restored_after_failure(self):\n        original = f.PATCHSETS\n        with self.assertRaisesRegex(RuntimeError, \'injected\'):\n            with x.candidate_patches():\n                raise RuntimeError(\'injected\')\n        self.assertIs(f.PATCHSETS, original)\n\n    def test_driver_or_build_failure_never_publishes(self):\n        baseline = f.expected(x.KERNEL)\n        for reason in (\'driver drift\', \'host test failure\', \'compile failure\', \'DTB mismatch\', \'static boot failure\'):\n            with self.subTest(reason=reason), tempfile.TemporaryDirectory() as tmp:\n                root = Path(tmp)/\'diag\'\n                with mock.patch.object(x.d, \'worker\', side_effect=e.Blocked(reason)), mock.patch.object(x.r, \'promote\') as promote:\n                    with self.assertRaisesRegex(e.Blocked, reason):\n                        x.run(root, 1)\n                self.assertFalse((root/\'public\').exists())\n                self.assertIn(reason, (root/\'builds/diagnostics/BLOCKED.json\').read_text())\n                self.assertEqual(f.expected(x.KERNEL), baseline)\n                promote.assert_not_called()\n\n    def test_engine_manifest_or_component_drift_stops_before_worker(self):\n        for kind in (\'engine\', \'manifest\', \'component\', \'unreviewed-baseline\'):\n            with self.subTest(kind=kind), tempfile.TemporaryDirectory() as tmp:\n                if kind == \'component\':\n                    change = mock.patch.object(x, \'COMMITS\', dict(x.COMMITS, resukisu=\'0\'*40))\n                elif kind == \'unreviewed-baseline\':\n                    change = mock.patch.object(x, \'BASELINES\', {})\n                else:\n                    path = \'common/scripts/veux_release_device.py\' if kind == \'engine\' else x.FOLDER+\'/manifest.json\'\n                    change = mock.patch.object(x, \'PINS\', dict(x.PINS, **{path:\'0\'*64}))\n                with change, mock.patch.object(x.d, \'worker\') as worker:\n                    with self.assertRaises(e.Blocked):\n                        x.run(Path(tmp)/\'diag\', 1)\n                    worker.assert_not_called()\n\n    def test_output_and_jobs_guards_stop_before_worker(self):\n        with tempfile.TemporaryDirectory() as tmp, mock.patch.object(x.d, \'worker\') as worker:\n            for path, jobs in ((Path(tmp),1), (e.REPO/\'diag08-output\',1), (e.REPO.parent,1), (Path(tmp)/\'new\',0)):\n                with self.assertRaises(e.Blocked):\n                    x.run(path, jobs)\n            worker.assert_not_called()\n\n    def worker(self, args, broken=None):\n        args.public.mkdir()\n        (args.public/\'kernel.zip\').write_bytes(b\'fixture-package\')\n        (args.public/\'boot.img\').write_bytes(b\'fixture-boot\')\n        targets = json.loads((args.bundle/\'targets.json\').read_text())\n        row = dict(artifact_name=x.r.identity(x.KERNEL, targets[\'components\']),\n            compile=True, package=True, static_boot=True, package_file=\'kernel.zip\',\n            package_sha256=e.digest(args.public/\'kernel.zip\'), boot_file=\'boot.img\',\n            static_boot_sha256=e.digest(args.public/\'boot.img\'), device_fixes=f.expected(x.KERNEL))\n        if broken == \'proof\': row[\'device_fixes\'] = []\n        if broken == \'package\': row[\'package_sha256\'] = \'0\'*64\n        if broken == \'boot\': row[\'static_boot_sha256\'] = \'0\'*64\n        if broken == \'static\': row[\'static_boot\'] = False\n        e.write_json(args.public/\'RESULT.json\', row)\n\n    def test_invalid_results_never_publish_or_emit_output(self):\n        for broken in (\'proof\', \'package\', \'boot\', \'static\'):\n            with self.subTest(broken=broken), tempfile.TemporaryDirectory() as tmp:\n                root = Path(tmp)/\'diag\'; output = Path(tmp)/\'outputs\'\n                with mock.patch.object(x.d, \'worker\', side_effect=lambda a:self.worker(a,broken)), \\\n                     mock.patch.dict(os.environ, {\'GITHUB_OUTPUT\':str(output)}):\n                    with self.assertRaises(e.Blocked):\n                        x.run(root, 1)\n                    self.assertEqual(os.environ[\'GITHUB_OUTPUT\'], str(output))\n                self.assertFalse((root/\'public\').exists())\n                self.assertFalse(output.exists())\n\n    def test_success_output_names_checksums_and_no_promotion(self):\n        baseline = x.regular_baseline()[\'id\']\n        with tempfile.TemporaryDirectory() as tmp:\n            root = Path(tmp)/\'diag\'; output = Path(tmp)/\'outputs\'\n            current = e.digest(e.REPO/x.r.CURRENT)\n            with mock.patch.object(x.d,\'worker\',side_effect=self.worker), \\\n                 mock.patch.object(x.r,\'promote\') as promote, \\\n                 mock.patch.dict(os.environ,{\'GITHUB_OUTPUT\':str(output)}):\n                x.run(root,1)\n            row = json.loads((root/\'public/RESULT.json\').read_text())\n            self.assertEqual(row[\'diagnostic_id\'],\'ChargerDiag08\')\n            self.assertEqual(row[\'baseline_diag07_run\'],\'36688871120\')\n            self.assertEqual(row[\'regular_patchset\'],baseline)\n            self.assertFalse(row[\'device\'])\n            self.assertFalse(row[\'repository_mutation\'])\n            self.assertTrue(row[\'package_file\'].endswith(\'_ChargerDiag08_AnyKernel.zip\'))\n            self.assertTrue(row[\'boot_file\'].endswith(\'_ChargerDiag08_boot.img\'))\n            self.assertEqual({p.name for p in (root/\'public\').iterdir()},\n                {row[\'package_file\'],row[\'boot_file\'],\'RESULT.json\',\'SHA256SUMS.txt\'})\n            for line in (root/\'public/SHA256SUMS.txt\').read_text().splitlines():\n                digest,name = line.split(\'  \',1)\n                self.assertEqual(e.digest(root/\'public\'/name),digest)\n            self.assertEqual(output.read_text(),\'artifact_name=\'+row[\'artifact_name\']+\'\\n\')\n            self.assertEqual(e.digest(e.REPO/x.r.CURRENT),current)\n            promote.assert_not_called()\n\n\nif __name__ == \'__main__\':\n    unittest.main()\n'
