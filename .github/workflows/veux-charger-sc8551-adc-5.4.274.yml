ce-fix engine\')\n    e.require(e.digest(e.REPO / baseline[\'path\']) == baseline[\'manifest_sha256\'],\n              \'regular patch manifest drift\')\n    e.require(f.expected(KERNEL)[0][\'id\'] == baseline[\'id\'], \'regular patch selection drift\')\n    return baseline\n\n\n@contextmanager\ndef candidate_patches():\n    original = f.PATCHSETS\n    try:\n        f.PATCHSETS = dict(original, **{KERNEL: FOLDER})\n        yield\n    finally:\n        f.PATCHSETS = original\n\n\ndef authenticate():\n    for name, expected in PINS.items():\n        e.require(e.digest(e.inside(e.REPO / name, e.REPO)) == expected,\n                  \'diagnostic baseline drift: \' + name)\n    regular_baseline()\n    with candidate_patches():\n        _, candidate, _ = f.load(KERNEL)\n        e.require(candidate[\'id\'] == \'charger-diag08\', \'candidate identity drift\')\n    cfg, _ = e.check_repo()\n    current = json.loads((e.REPO / r.CURRENT).read_text())\n    for c in e.COMPONENTS:\n        actual = current[\'targets\'][c][\'commit\']\n        e.require(actual == COMMITS[c],\n                  f\'component commit changed: {c}; expected={COMMITS[c]}; actual={actual}; candidate needs renewed review\')\n        record = json.loads((e.REPO / f\'common/upstream/{c}/current.json\').read_text())\n        e.require(record == current[\'targets\'][c], \'component record drift: \' + c)\n    e.require(r.snapshot_hashes(e.REPO / r.SOURCES) == current[\'source_sha256\'], \'source snapshot drift\')\n    overlay = e.REPO / r.OVERLAYS / KERNEL / \'overlay.json\'\n    e.require(e.digest(overlay) == current[\'lineages\'][KERNEL][\'integration_overlay_sha256\'],\n              \'validated overlay drift\')\n    return {\'schema\': 1, \'repository_sha\': e.git(e.REPO, \'rev-parse\', \'HEAD\'),\n            \'golden_sha256\': e.digest(e.REPO / cfg[\'golden_contract\']),\n            \'lineages\': [KERNEL], \'components\': current[\'targets\']}\n\n\ndef run(root, jobs):\n    root = root.resolve()\n    e.require(not root.exists() and not root.is_relative_to(e.REPO)\n              and not e.REPO.is_relative_to(root), \'require new output directory outside repository\')\n    e.require(jobs > 0, \'jobs must be positive\')\n    targets = authenticate()\n    e.require(not e.git(e.REPO, \'status\', \'--porcelain\'), \'temporary project must be clean\')\n    current_hash = e.digest(e.REPO / r.CURRENT)\n    root.mkdir(parents=True)\n    e.write_json(root / \'bundle/targets.json\', targets)\n    args = argparse.Namespace(kernel=KERNEL, bundle=root/\'bundle\', work=root/\'builds\'/KERNEL,\n        public=root/\'candidate\', overlays=root/\'overlays\', jobs=jobs)\n    output = os.environ.pop(\'GITHUB_OUTPUT\', None)\n    try:\n        with candidate_patches():\n            # Apply all validated Diag07 fixes plus SC8551 before compiling.\n            d.worker(args)\n        result_path = args.public / \'RESULT.json\'\n        result = json.loads(result_path.read_text())\n        e.require(all(result[k] for k in (\'compile\', \'package\', \'static_boot\')), \'release gate failed\')\n        with candidate_patches():\n            e.require(result[\'device_fixes\'] == f.expected(KERNEL), \'candidate proof missing\')\n        stem = result[\'artifact_name\'] + \'_ChargerDiag08\'\n        for key, suffix in ((\'package_file\',\'_AnyKernel.zip\'), (\'boot_file\',\'_boot.img\')):\n            (args.public/result[key]).rename(args.public/(stem+suffix))\n            result[key] = stem+suffix\n        e.require(e.digest(args.public/result[\'package_file\']) == result[\'package_sha256\'], \'AK3 drift\')\n        r.verify_boot(result, args.public)\n        result.update(artifact_name=stem, diagnostic_id=\'ChargerDiag08\',\n            baseline_diag07_run=\'36688871120\', regular_patchset=regular_baseline()[\'id\'],\n            baseline_regular_run=json.loads((e.REPO/r.CURRENT).read_text())[\'run_id\'],\n            base_repository_sha=os.environ.get(\'GITHUB_SHA\', \'\'),\n            repository_mutation=False, device=False)\n        e.write_json(result_path, result)\n        (args.public/\'SHA256SUMS.txt\').write_text(\'\'.join(\n            f\'{e.digest(p)}  {p.name}\\n\' for p in sorted(args.public.iterdir())\n            if p.is_file() and p.name != \'SHA256SUMS.txt\'))\n        authenticate()\n        e.require(e.digest(e.REPO/r.CURRENT) == current_hash, \'build reference changed\')\n        e.require(not e.git(e.REPO, \'status\', \'--porcelain\'), \'temporary project changed during build\')\n        shutil.move(str(args.public), root/\'public\')\n        if output:\n            with open(output, \'a\') as out:\n                out.write(\'artifact_name=\' + stem + \'\\n\')\n        print(\'CHARGER_DIAG08=COMPILE_PACKAGE_STATIC_PASS; DEVICE_PASS=NO\', flush=True)\n    except Exception as exc:\n        e.write_json(root/\'builds/diagnostics/BLOCKED.json\', {\'reason\': str(exc), \'device\': False})\n        raise\n    finally:\n        if output:\n            os.environ[\'GITHUB_OUTPUT\'] = output\n\n\ndef main():\n    p=argparse.ArgumentParser(description=__doc__)\n    p.add_argument(\'command\', choices=(\'check\',\'build\'))\n    p.add_argument(\'--root\',type=Path)\n    p.add_argument(\'--jobs\',type=int,default=4)\n    a=p.parse_args()\n    if a.command==\'check\':\n        authenticate()\n        print(\'DIAG08_AUTHENTICATION=PASS; pinned components; cumulative Diag07 plus SC8551\')\n    else:\n        if a.root is None:p.error(\'--root is required for build\')\n        run(a.root,a.jobs)\n\nif __name__==\'__main__\':\n    main()\n'
