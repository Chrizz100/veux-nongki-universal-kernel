    - name: Checkout immutable official BakaSU provider at tested source commit
      if: ${{ steps.compat.outputs.ready == 'true' }}
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: Baka-SU/BakaSU
        ref: d5e9e025b8b49155f8014684d64c91742b465f65
        path: BakaSU
        fetch-depth: 0
        persist-credentials: false
    - name: Verify P11 HEAD and original BakaSU; port genuine seven inline hooks source-only
      shell: bash
      run: |
        set -euo pipefail
        printf '%s\n' '=== R55H2 pinned BakaSU real 5.4.274 source probe ==='
        test "$(git -C BakaSU rev-parse HEAD)" = 'd5e9e025b8b49155f8014684d64c91742b465f65'
        # P11 reconstructs a real 5.4.274 commit. The original SOURCE_BASE_SHA
        # references the historic 5.4.268 checkout, not this reconstructed HEAD.
        python3 -B "$R55_STAGE/scripts/h2_reconstructed_source_gate.py" \
          --source kernel --compat "$R55_STAGE/out/R55H1_COMPATIBILITY.json" \
          --out "$R55_STAGE/out/R55H2_R2_RECONSTRUCTED_SOURCE_IDENTITY.json"
        python3 -B "$R55_STAGE/scripts/h2_bakasu_probe.py" \
          --source kernel --bakasu BakaSU \
          --patch "$R55_STAGE/inputs/R55G1_AUTHENTIC_21FILES.patch" \
          --work "$R55_STAGE/h2-candidate" --out "$R55_STAGE/out" \
          2>&1 | tee "$R55_STAGE/out/R55H2_SOURCE_PROBE.log"
        python3 -B "$R55_STAGE/scripts/h3_five_hooks.py" \
          --candidate "$R55_STAGE/h2-candidate" \
          --source-probe "$R55_STAGE/out/R55H2_BAKASU_PROVIDER_PROBE.json" \
          --out "$R55_STAGE/out" \
          2>&1 | tee "$R55_STAGE/out/R55H3_SOURCE_PORT.log"
        python3 -B "$R55_STAGE/scripts/h4_path_hooks.py" \
          --candidate "$R55_STAGE/h2-candidate" \
          --h3-report "$R55_STAGE/out/R55H3_FIVE_REAL_HOOKS_RESULT.json" \
          --out "$R55_STAGE/out" \
          2>&1 | tee "$R55_STAGE/out/R55H4_SOURCE_PORT.log"
        python3 -B - <<'PY_H2_PROBE_STATUS'
        import json,os,pathlib
        p=pathlib.Path('/tmp/veux-r55h1/out/R55H4_SEVEN_REAL_HOOKS_RESULT.json')
        r=json.loads(p.read_text())
        if r.get('status')!='SEVEN_GENUINE_BAKASU_KERNEL_HOOKS_SOURCE_PORTED' or r.get('missing_hook_count')!=0:
            raise SystemExit('R55H4_REAL_SEVEN_HOOK_GATE_FAILED')
        ready=False  # R55H4 is SOURCE-ONLY: active provider compile requires next isolated stage.
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('ready='+('true' if ready else 'false')+'\n')
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('\n### R55H4 seven genuine BakaSU hooks on kernel 5.4.274: source-only proof\n')
            f.write('Status: **'+r['status']+'**\n')
            f.write('Real kernel hook calls verified: '+str(r.get('added_hook_count','not reached'))+' / 7\n')
            for hook in r.get('missing_hook_symbols',[]):
                row=r['hook_details'][hook]
                f.write('- Missing real call: `'+hook+'` in `'+row['path']+'`\n')
            f.write('**NOT flashable; source-only diagnostic unless real objects and Image linked.**\n')
        print('R55H4_SEVEN_REAL_HOOKS='+str(r.get('added_hook_count',0))+'; remaining='+str(r.get('missing_hook_count',0)))
        print('R55H4_SOURCE_PROVEN=YES; ACTIVE_COMPILE=NOT_STARTED; FLASH=FORBIDDEN')
        PY_H2_PROBE_STATUS
      if: ${{ steps.compat.outputs.ready == 'true' }}
      id: h2_contract
      timeout-minutes: 25
    - name: Install historical pinned Clang for actual BakaSU-only conditional compiler
      if: ${{ steps.compat.outputs.ready == 'true' && steps.h2_contract.outputs.ready == 'true' }}
      timeout-minutes: 20
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends   bc bison build-essential ca-certificates cpio curl flex git libelf-dev   libncurses-dev libssl-dev patch python3 python-is-python3 rsync xz-utils zstd
        export P11_TOOLCHAIN_DIR="$GITHUB_WORKSPACE/toolchains/clang-r416183b"
        mkdir -p "$P11_TOOLCHAIN_DIR"
        curl --fail --location --retry 4 --connect-timeout 30 --max-time 360  'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/aa2e4a514a6c85eebcc4a27149eaf9244e951a1e/clang-r416183b.tar.gz'  --output "$RUNNER_TEMP/clang-r416183b.tar.gz"
        tar -xzf "$RUNNER_TEMP/clang-r416183b.tar.gz" -C "$P11_TOOLCHAIN_DIR"
        "$P11_TOOLCHAIN_DIR/bin/clang" --version | grep -F 'r416183b'
        echo "P11_TOOLCHAIN_DIR=$P11_TOOLCHAIN_DIR" >> "$GITHUB_ENV"
        echo "$P11_TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
    - name: Genuine P11 baseline compile only after BakaSU hook source gate
      id: baseline
      if: ${{ steps.compat.outputs.ready == 'true' && steps.h2_contract.outputs.ready == 'true' }}
      timeout-minutes: 115
      shell: bash
      run: |
        set -euo pipefail
        set +e
        bash "$P11_TOOL_DIR/p11_build_walt_off.sh" 2>&1 | tee "$R55_STAGE/out/H1_P11_BASELINE_FULL_COMPILE.log"
        code=${PIPESTATUS[0]}
        set -e
        python3 -B - "$code" <<'PY_H1_BASELINE'
        import json,os,pathlib,sys
        r=pathlib.Path(os.environ['RUNNER_TEMP'])/'VEUX_274_P11_EVIDENCE'/'P11_BUILD_STATUS.json'
        code=int(sys.argv[1])
        proof=json.loads(r.read_text()) if r.exists() else {}
        pass_=code==0 and proof.get('build')=='PASS' and proof.get('kernel')=='5.4.274' and proof.get('flashable') is False
        out={'status':'P11_BASELINE_BUILD_PASS' if pass_ else 'P11_BASELINE_BUILD_FAILED',
             'script_exit':code,'p11_original_build_status':proof,'walt_enabled':False,'flash_allowed':False}
        pathlib.Path('/tmp/veux-r55h1/out/H1_P11_BASELINE_REPORT.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('passed='+('true' if pass_ else 'false')+'\n')
        print('R55H1_P11_BASELINE_COMPILE='+('PASS' if pass_ else 'FAILED'))
        PY_H1_BASELINE
    - name: Compile actual pinned BakaSU plus inline SUSFS objects then full ARM64 Image DTBs
      shell: bash
      run: |
        set -euo pipefail
        bash "$R55_STAGE/scripts/h2_active_compile.sh" 2>&1 | tee "$R55_STAGE/out/R55H2_ACTIVE_COMPILE_DRIVER.log"
      if: ${{ steps.h2_contract.outputs.ready == 'true' && steps.baseline.outputs.passed == 'true' }}
      timeout-minutes: 120
    - name: Write literal H2 activation outcome and SHA256 audit; never imply flash
      shell: bash
      run: |
        set -euo pipefail
        python3 -B - <<'PY_H2_FINAL'
        import hashlib,json,os,pathlib,subprocess
        out=pathlib.Path('/tmp/veux-r55h1/out');out.mkdir(parents=True,exist_ok=True)
        read=lambda n:json.loads((out/n).read_text()) if (out/n).exists() else None
        bridge=read('R55H1_COMPATIBILITY.json')
        identity=read('R55H2_R2_RECONSTRUCTED_SOURCE_IDENTITY.json')
        probe=read('R55H4_SEVEN_REAL_HOOKS_RESULT.json') or read('R55H3_FIVE_REAL_HOOKS_RESULT.json') or read('R55H2_BAKASU_PROVIDER_PROBE.json')
        baseline=read('H1_P11_BASELINE_REPORT.json')
        compile=read('R55H2_ACTIVE_BAKASU_BUILD.json')
        active=bool(compile and compile.get('active_bakasu_susfs_image_proven') is True)
        if active: status='ACTIVE_BAKASU_SUSFS_COMPILE_PASS_NOFLASH'
        elif identity and identity.get('status')!='RECONSTRUCTED_274_SOURCE_IDENTITY_PASS':status='BLOCKED_RECONSTRUCTED_SOURCE_IDENTITY'
        elif probe and probe.get('status')=='SEVEN_GENUINE_BAKASU_KERNEL_HOOKS_SOURCE_PORTED' and probe.get('missing_hook_count')==0:status='R55H4_SEVEN_REAL_HOOKS_SOURCE_ONLY_NO_COMPILER_YET'
        elif probe and probe.get('added_hook_count')==5 and probe.get('missing_hook_count')==2:status='R55H3_FIVE_REAL_HOOKS_PORTED_TWO_FILENAME_HOOKS_PENDING'
        elif probe and probe.get('missing_hook_count',0):status='BLOCKED_MISSING_OFFICIAL_BAKASU_KERNEL_HOOKS'
        elif probe and probe.get('status')!='READY_FOR_BAKASU_INLINE_ACTIVE_COMPILE':status='BLOCKED_BAKASU_SOURCE_GATE'
        elif compile:status='BLOCKED_ACTIVE_COMPILER_OR_CONFIG'
        elif bridge and bridge.get('status')!='COMPATIBLE_SOURCE_ONLY':status='BLOCKED_REAL_274_SOURCE_BRIDGE'
        else:status='NOT_RUN_OR_INCOMPLETE'
        res={'schema':1,'stage':'R55H4_BAKASU_SEVEN_GENUINE_INLINE_HOOKS_SOURCE_ONLY',
         'status':status,'github_workflow_success_is_not_kernel_activation':True,
         'bakasu_source_commit':'d5e9e025b8b49155f8014684d64c91742b465f65',
         'source_reconstruction':bridge['status'] if bridge else 'NOT_STARTED',
         'source_identity_gate':identity['status'] if identity else 'NOT_STARTED',
         'source_identity_failure_reason':identity.get('reason') if identity else None,
         'bakasu_source_gate':probe['status'] if probe else 'NOT_STARTED',
         'bakasu_missing_hook_count':probe.get('missing_hook_count') if probe else None,
         'genuine_kernel_hook_calls_ported':probe.get('added_hook_count') if probe else None,
         'real_h4_patch_sha256':probe.get('hook_patch_sha256') if probe else None,
         'real_h3_patch_sha256':probe.get('h3_sha256') if probe else None,
         'pending_bakasu_path_hooks':probe.get('missing_hook_symbols') if probe else None,
         'baseline_compile':baseline['status'] if baseline else 'NOT_STARTED',
         'active_bakasu_compiler_result':compile['status'] if compile else 'NOT_STARTED',
         'active_bakasu_susfs_compiled':active,
         'walt_enabled':False,'nomount_integrated':False,'vendor_abi_proven':False,
         'boot_img_generated':False,'device_test':False,'flash_allowed':False,
         'no_dummy_hook_bypass':True,'no_brene_changes':True,'no_vendor_changes':True}
        project=subprocess.run(['git','-C','project','status','--porcelain','--untracked-files=all'],capture_output=True,text=True)
        res['project_repo_unchanged']=project.returncode==0 and project.stdout.strip()==''
        (out/'R55H2_FINAL_STATUS.json').write_text(json.dumps(res,indent=2,sort_keys=True)+'\n')
        files=[]
        for f in sorted(out.iterdir()):
         if f.is_file() and f.name!='SHA256SUMS.txt':
          h=hashlib.sha256()
          with f.open('rb') as q:
           for block in iter(lambda:q.read(1024*1024),b''):h.update(block)
          files.append(h.hexdigest()+'  '+f.name)
        (out/'SHA256SUMS.txt').write_text('\n'.join(files)+'\n')
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
         f.write('\n### R55H4 sieben genuine BakaSU Hooks auf 5.4.274, source-only (NO FLASH)\n')
         for k,v in res.items():f.write('- '+k+': '+str(v)+'\n')
        print('R55H4_DIAGNOSTIC_RESULT='+status)
        print('R55H2_ACTIVE_BAKASU_AND_SUSFS_PROVEN='+('YES' if active else 'NO'))
        print('R55H2_EVIDENCE_SHA256=PASS; NO FLASH')
        if not res['project_repo_unchanged']:raise SystemExit('R55H2_ORIGINAL_PROJECT_DIRTY')
        PY_H2_FINAL
        (cd "$R55_STAGE/out" && sha256sum -c SHA256SUMS.txt)
      if: ${{ always() }}
    - name: Upload BakaSU source and compiler evidence only; never boot images
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: VEUX-R55H4-SEVEN-GENUINE-BAKASU-HOOKS-SOURCE-NOFLASH-${{ github.run_id }}
        path: /tmp/veux-r55h1/out/
        if-no-files-found: error
        retention-days: 14
