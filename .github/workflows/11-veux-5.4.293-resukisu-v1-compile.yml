          grep -Fxq 'RESUKISU_INTEGRATION_GATE=PASS' "$AUDIT_DIR/13-resukisu-integration.txt"
          test "$(git -C "$SRC/.resukisu" rev-parse HEAD)" = "$RESUKISU_COMMIT"

          export PATH="$TC/bin:$PATH"
          export ARCH=arm64

          clang --version | tee "$RESULTS/clang-version.txt"
          ld.lld --version | tee "$RESULTS/lld-version.txt"

          set +e
          make -C "$SRC" O="$OUT" ARCH=arm64             CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1             "$DEFCONFIG"             2>&1 | tee "$RESULTS/defconfig.log"
          config_rc="${PIPESTATUS[0]}"
          set -e
          echo "$config_rc" > "$RESULTS/config-rc.txt"

          if [[ "$config_rc" != "0" || ! -f "$OUT/.config" ]]; then
            echo "RESUKISU_CONFIG=FAIL" | tee "$RESULTS/build-state.txt"
            echo "998" > "$RESULTS/build-rc.txt"
