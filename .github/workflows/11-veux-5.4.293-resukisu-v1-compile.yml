          fi

          test -x "$SRC/scripts/config"
          "$SRC/scripts/config" --file "$OUT/.config"             --enable KSU             --enable KSU_MANUAL_HOOK             --enable KSU_MANUAL_HOOK_AUTO_SETUID_HOOK             --enable KSU_MANUAL_HOOK_AUTO_INITRC_HOOK             --enable KSU_MANUAL_HOOK_AUTO_INPUT_HOOK             --disable KSU_TRACEPOINT_HOOK             --disable KSU_SUSFS

          make -C "$SRC" O="$OUT" ARCH=arm64             CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1             olddefconfig             2>&1 | tee "$RESULTS/olddefconfig.log"

          for expected in             'CONFIG_KSU=y'             'CONFIG_KSU_MANUAL_HOOK=y'             'CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y'             'CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y'             'CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y'
          do
            grep -Fxq "$expected" "$OUT/.config"
          done
          grep -Fxq '# CONFIG_KSU_TRACEPOINT_HOOK is not set' "$OUT/.config"
          grep -Fxq '# CONFIG_KSU_SUSFS is not set' "$OUT/.config"

          grep -E '^CONFIG_KSU|^# CONFIG_KSU' "$OUT/.config"             | tee "$RESULTS/ksu-config.txt"
          sha256sum "$OUT/.config" | tee "$RESULTS/generated-config.sha256"

          KERNELRELEASE_PRE="$(
            make -s -C "$SRC" O="$OUT" ARCH=arm64               CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 kernelrelease
          )"
          printf '%s\\n' "$KERNELRELEASE_PRE" | tee "$RESULTS/kernelrelease-prebuild.txt"
          case "$KERNELRELEASE_PRE" in
            5.4.293*) ;;
            *)
              echo "RESUKISU_KERNELRELEASE_PRECHECK=FAIL" | tee "$RESULTS/build-state.txt"
              echo "997" > "$RESULTS/build-rc.txt"
              exit 0
              ;;
          esac

          set +e
          make -C "$SRC" -j"$(nproc)" O="$OUT"             ARCH=arm64             CC=clang             CLANG_TRIPLE=aarch64-linux-gnu-             CROSS_COMPILE=aarch64-linux-gnu-             CROSS_COMPILE_ARM32=arm-linux-gnueabi-             LD=ld.lld             LLVM=1             LLVM_IAS=1             Image             2>&1 | tee "$RESULTS/build.log"
          build_rc="${PIPESTATUS[0]}"
          set -e
          echo "$build_rc" > "$RESULTS/build-rc.txt"

          IMAGE="$OUT/arch/arm64/boot/Image"
          if [[ "$build_rc" == "0" && -s "$IMAGE" ]]; then
            echo "RESUKISU_COMPILE=PASS" | tee "$RESULTS/build-state.txt"
            sha256sum "$IMAGE" | tee "$RESULTS/Image.sha256"
            wc -c "$IMAGE" | tee "$RESULTS/Image.bytes"
          else
            echo "RESUKISU_COMPILE=FAIL" | tee "$RESULTS/build-state.txt"
          fi

          error_signatures="$(grep -Eci '(^|: )(error:|fatal error:|undefined reference|undefined symbol|No rule to make target)|make(\[[0-9]+\])?: \*\*\*' "$RESULTS/build.log" 2>/dev/null || true)"
          echo "ERROR_SIGNATURES=$error_signatures" | tee "$RESULTS/error-signatures.txt"

