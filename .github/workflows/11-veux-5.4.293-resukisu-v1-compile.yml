            echo "RESUKISU_EXPECTED_UAPI=$RESUKISU_EXPECTED_UAPI"
            echo "MODULE_LOAD_FILTER=EXCLUDED"
            echo "HOOK_MODE=MANUAL"
            echo "SUSFS=NOT_PRESENT"
            echo "BUILD_RC=$build_rc"
            echo "KERNELVERSION=$kernelversion"
            echo "IMAGE_PRESENT=$image_present"
            echo "IMAGE_BYTES=$image_bytes"
            echo "IMAGE_SHA256=$image_sha"
            echo "ERROR_SIGNATURES=$error_signatures"
            echo "PACKAGE_PASS=NO"
            echo "STATIC_BOOT_PATH_PASS=NO"
            echo "DEVICE_PASS=NO"
          } | tee "$FINAL"

          (
            cd "$AUDIT_DIR"
            find . -type f ! -name SHA256SUMS.txt -print0               | LC_ALL=C sort -z               | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

