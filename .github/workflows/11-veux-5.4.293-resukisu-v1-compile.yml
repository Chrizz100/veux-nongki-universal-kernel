            echo "ERROR: reject/orig files after ReSukiSU compile" >&2
            exit 1
          fi

          bash common/scripts/audit_existing_integration.sh "$SRC"             | tee "$RESULTS/post-build-integration-audit.txt"
          bash common/scripts/identity_guard.sh             verify "$SRC" "$DEFCONFIG" "$RESULTS/identity-before-build.sha256"             | tee "$RESULTS/identity-after-build.txt"

      - name: Finalize ReSukiSU verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          WORK_ROOT="$GITHUB_WORKSPACE/.work/5.4.293-resukisu-v1"
          AUDIT_DIR="$GITHUB_WORKSPACE/.audit/workflow-11"
          SRC="$WORK_ROOT/kernel"
          OUT="$WORK_ROOT/out"
          RESULTS="$WORK_ROOT/results"
          IMAGE="$OUT/arch/arm64/boot/Image"
          FINAL="$AUDIT_DIR/FINAL-RESULT.txt"

          conflicts="999"
          [[ -f "$AUDIT_DIR/PORT_CONFLICTS.txt" ]] && conflicts="$(tr -d '[:space:]' < "$AUDIT_DIR/PORT_CONFLICTS.txt")"
          build_rc="999"
          [[ -f "$RESULTS/build-rc.txt" ]] && build_rc="$(tr -d '[:space:]' < "$RESULTS/build-rc.txt")"

          kernelversion="UNKNOWN"
          if [[ -d "$SRC" ]]; then
            kernelversion="$(make -s -C "$SRC" kernelversion 2>/dev/null || echo UNKNOWN)"
          fi

          image_present="NO"
          image_sha="NONE"
          image_bytes="0"
          if [[ -s "$IMAGE" ]]; then
            image_present="YES"
            image_sha="$(sha256sum "$IMAGE" | awk '{print $1}')"
            image_bytes="$(wc -c < "$IMAGE" | tr -d ' ')"
          fi

          error_signatures="UNKNOWN"
          if [[ -f "$RESULTS/error-signatures.txt" ]]; then
            error_signatures="$(cut -d= -f2 "$RESULTS/error-signatures.txt" | tr -d '[:space:]')"
          fi

          timer_compat="NO"
          if [[ -f "$AUDIT_DIR/09-timer-abi-compat.txt" ]] && grep -Fxq 'TIMER_ABI_COMPAT=PASS' "$AUDIT_DIR/09-timer-abi-compat.txt"; then
            timer_compat="PASS"
          fi

          baseline_freeze="NO"
          if [[ -f "$AUDIT_DIR/10-baseline-freeze.txt" ]] && grep -Fxq 'BASELINE_FREEZE=PASS' "$AUDIT_DIR/10-baseline-freeze.txt" && grep -Fxq 'RUN35374910431_BASELINE_REGRESSION=PASS' "$AUDIT_DIR/10-baseline-freeze.txt"; then
            baseline_freeze="PASS"
          fi

          integration="NO"
          if [[ -f "$RESULTS/integration.log" ]] && grep -Fxq 'RESUKISU_HOST_INTEGRATION=PASS' "$RESULTS/integration.log" && grep -Fxq 'RESUKISU_GIT_WORKTREE_LAYOUT=PASS' "$RESULTS/integration.log" && grep -Fxq 'HOST_DELTA_GUARD=PASS' "$RESULTS/integration.log" && grep -Fxq 'RESUKISU_DELTA_GUARD=PASS' "$RESULTS/integration.log" && grep -Fxq 'MODULE_LOAD_FILTER=EXCLUDED' "$RESULTS/integration.log" && grep -Fxq 'SUSFS=NOT_PRESENT' "$RESULTS/integration.log"; then
            integration="PASS"
          fi

          rs_commit="UNKNOWN"
          if [[ -d "$SRC/.resukisu/.git" ]]; then
            rs_commit="$(git -C "$SRC/.resukisu" rev-parse HEAD 2>/dev/null || echo UNKNOWN)"
          fi

          verdict="RED"
          if [[ "$conflicts" == "0" && "$timer_compat" == "PASS" && "$baseline_freeze" == "PASS" && "$build_rc" == "0" && "$kernelversion" == "$TARGET_VERSION" && "$image_present" == "YES" && "$error_signatures" == "0" && "$integration" == "PASS" && "$rs_commit" == "$RESUKISU_COMMIT" ]]; then
            verdict="GREEN_PASS"
          fi

          {
            echo "VEUX_5_4_293_RESUKISU=$verdict"
            echo "BASELINE_GITHUB_GREEN_RUN=35374910431"
            echo "SOURCE_BASE=$SOURCE_COMMIT"
            echo "SOURCE_BASE_VERSION=$SOURCE_VERSION"
            echo "OFFICIAL_STABLE_BASE=$STABLE_292_COMMIT"
            echo "OFFICIAL_STABLE_TARGET=$STABLE_293_COMMIT"
            echo "PORT_CONFLICTS=$conflicts"
            echo "TIMER_ABI_COMPAT=$timer_compat"
