      - name: Configure and compile VEUX 5.4.293 ReSukiSU
        shell: bash
        run: |
          set -euo pipefail

          WORK_ROOT="$GITHUB_WORKSPACE/.work/5.4.293-resukisu-v1"
          AUDIT_DIR="$GITHUB_WORKSPACE/.audit/workflow-11"
          SRC="$WORK_ROOT/kernel"
          TC="$WORK_ROOT/$TOOLCHAIN_DIRNAME"
          OUT="$WORK_ROOT/out"
          RESULTS="$WORK_ROOT/results"
