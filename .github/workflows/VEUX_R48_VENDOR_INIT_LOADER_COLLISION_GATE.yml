          python3 -B - "$R48_STAGE/inputs" <<'R48_META'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);run=json.loads((p/'R47_RUN.json').read_text())
          if not (run.get('id')==40176846693 and run.get('head_sha')=='fa39bae7ce0674f08cd276b8c7991317c7303ef0' and run.get('status')=='completed' and run.get('conclusion')=='success'):
              raise SystemExit('R48_R47_SOURCE_RUN_INVALID')
          a=json.loads((p/'R47_ARTIFACT_META.json').read_text())
          if not (a.get('id')==12592631872 and a.get('name')=='VEUX-R47-RMNET-ELF-ABI-40176846693' and a.get('expired') is False and a.get('digest')=='sha256:dc0d648951679e8a7081b7364f01d2d9d941b27b1e98310b76199b25324eec51'):
              raise SystemExit('R48_R47_SOURCE_ARTIFACT_INVALID')
          print('R48_R47_PINNED_RUN_AND_ARTIFACT=PASS')
          R48_META
          api_get 'actions/artifacts/12592631872/zip' "$R48_STAGE/inputs/R47_RESULT_ORIGINAL.zip"
          printf '%s  %s\n' 'dc0d648951679e8a7081b7364f01d2d9d941b27b1e98310b76199b25324eec51' "$R48_STAGE/inputs/R47_RESULT_ORIGINAL.zip" | sha256sum -c -
      - name: Test historical init parser, source pins, collisions and no-flash guards
