      - name: Prove conditional OEM RMNET loader matrix and issue precise NO-BOOT decision
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$R48_STAGE/src/r48_gate.py" \
            --r39 VEUX_R39_R2_MEMORY_ABI_MAIN.zip \
            --r47-artifact "$R48_STAGE/inputs/R47_RESULT_ORIGINAL.zip" \
            --out "$R48_STAGE/out" | tee "$R48_STAGE/out/R48_EXECUTION.log"
          cat "$R48_STAGE/out/R48_BERICHT_DE.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Fail closed for any runtime or flash claims, verify output and SHA256
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - "$R48_STAGE/out" <<'R48_GUARD'
          import csv,hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);data=json.loads((p/'R48_RESULT.json').read_text(encoding='utf-8'))
          expected={'R48_ACTIONLINT.log','R48_BASH_SHELLCHECK.log','R48_TESTS.log','R48_EXECUTION.log',
                    'R48_RESULT.json','R48_LOADER_MATRIX.csv','R48_BERICHT_DE.txt','R48_SICHERE_LOADER_STRATEGIE.md'}
          found={a.name for a in p.iterdir() if a.is_file()}
          if found!=expected:raise SystemExit('R48_OUTPUT_SCOPE_DRIFT:'+str(found^expected))
          if (data.get('schema')!='VEUX_R48_STOCK_INIT_RMNET_COLLISION_DECISION_V1' or
              data.get('decision')!='NO_R44_BOOT_UNTIL_INIT_LOADER_COLLISION_AND_RECOVERY_GATES_PROVEN' or
              data.get('source_init_commands')!=8 or data.get('conditional_vendor_init_load_attempts')!=4 or
              data.get('conditional_vendor_init_unload_attempts')!=4 or
              data.get('private_r46_data_included') is not False):
              raise SystemExit('R48_DECISION_UNEXPECTED')
          for name in ('actual_r44_boot_time_loader_execution_proven','r44_module_installation_to_device_proven',
                       'r44_vendor_autoload_collision_prevented','vendor_init_compatibility_proven',
                       'full_vendor_abi_proven','device_runtime_tested','safe_rollback_proven',
                       'bootloader_dtbo_selection_proven','selinux_vintf_proven','boot_ready','flash_allowed',
                       'kernel_built','repo_or_device_modified'):
              if data.get(name) is not False:raise SystemExit('R48_UNSAFE_TRUE:'+name)
          with (p/'R48_LOADER_MATRIX.csv').open() as f:
              if len(list(csv.DictReader(f)))!=8:raise SystemExit('R48_CSV_ROWS')
          for f in p.rglob('*'):
              if f.is_file() and (f.suffix in ('.ko','.img','.dtb','.dtbo','.bin','.elf') or f.name in ('vmlinux','Image')):
                  raise SystemExit('R48_FORBIDDEN_BINARY_OUTPUT')
          checks=[hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name for f in sorted(p.iterdir()) if f.is_file()]
          (p/'SHA256SUMS.txt').write_text('\n'.join(checks)+'\n',encoding='utf-8')
          print('R48_FINAL_GATES=PASS; VENDOR_INIT_AUTOLOAD_POLICY_UNRESOLVED; BOOT_READY=NO; FLASH_ALLOWED=NO')
          R48_GUARD
          (cd "$R48_STAGE/out" && sha256sum -c SHA256SUMS.txt)
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'R48_REPO_UNCHANGED=YES; DEVICE_UNTOUCHED=YES; R46_PRIVATE_REPORT_NOT_PUBLISHED=YES'
