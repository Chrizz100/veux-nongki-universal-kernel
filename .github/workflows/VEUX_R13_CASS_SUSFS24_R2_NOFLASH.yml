name: VEUX R13 CASS · SUSFS 2.4 R2 Statusprüfung · NOFLASH

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  statuskorrektur:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      KBUILD_JOBS: '4'
      LLDB: lldb-19
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: R2 MAIN auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /VEUX_R13_CASS_SUSFS24_R2_MAIN.zip
      - name: Basis des bestätigten GitHub-Baus auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 55908d3ae455e97fb3da22edaed82ecebdcd9e3b
          path: r13-basis
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /VEUX_R13_CASS_SUSFS24_MAIN.zip
      - name: Archive verifizieren und Statuskorrektur vorbereiten
        env:
          R2_MAIN_SHA256: 'af93d8c00310082b085137962c84f1ed27c9f2e131201c81595b15599d1b6e40'
          BASE_MAIN_SHA256: '2d21261d1372dba8ebe9ace382987aecb63829ec42b4c830dde72e2eedf541e9'
        run: |
          set -euo pipefail
          baseline=r13-basis/VEUX_R13_CASS_SUSFS24_MAIN.zip
          delta=VEUX_R13_CASS_SUSFS24_R2_MAIN.zip
          printf '%s  %s\n' "$BASE_MAIN_SHA256" "$baseline" "$R2_MAIN_SHA256" "$delta" | sha256sum -c -
          kit="$RUNNER_TEMP/veux-kit"
          fix="$RUNNER_TEMP/veux-statuskorrektur"
          unzip -q "$baseline" -d "$kit"
          unzip -q "$delta" -d "$fix"
          git -C "$kit" apply "$fix/patches/Buildpruefung.patch"
          install -m 644 "$fix/patches/R13-SUSFS-Statusantwort.patch" "$kit/patches/"
          install -m 644 "$fix/referenz/Statuskorrektur.git-tree" "$kit/referenz/"
          install -m 644 "$fix/tools/status_response.py" "$kit/tools/"
      - name: Bau- und Debugwerkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bc binutils-aarch64-linux-gnu bison build-essential cpio flex libelf-dev libssl-dev lldb-19 m4
      - name: Gepinnte Android-Toolchain wiederverwenden
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/veux-clang
          key: veux-r13-clang-r416183b-0a90693130898d6f98a76538086247b374d4a57f
      - name: Android-Clang laden und prüfen
        run: |
          set -euo pipefail
          clang="$RUNNER_TEMP/veux-clang"
          kit="$RUNNER_TEMP/veux-kit"
          if ! test -x "$clang/bin/clang"; then
            bash "$kit/tools/toolchain.sh" "$clang"
          fi
          python3 "$kit/tools/treehash.py" "$clang"
      - name: Statuskorrektur bauen und den gelinkten Kernel prüfen
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/veux-r13-statuskorrektur"
          mkdir -p "$work/evidence"
          bash "$RUNNER_TEMP/veux-kit/build.sh" "$work" "$RUNNER_TEMP/veux-clang" 2>&1 \
            | tee "$work/evidence/Bau-und-Tests.log"
          printf '%s\n' "SUSFS-Statusantwort und 10 Statuseinträge im gelinkten Kernel geprüft." >> "$GITHUB_STEP_SUMMARY"
      - name: Bauprotokoll und Prüfnachweise sichern
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: VEUX-R13-CASS-SUSFS24-R2-Pruefung-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/veux-r13-statuskorrektur/evidence/
          if-no-files-found: warn
          retention-days: 30
