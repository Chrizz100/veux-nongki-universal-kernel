name: VEUX GEN1 U5-O47 v1 5.4.301 Package Audit

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: veux-gen1-u5-o47-v1-5.4.301-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      ARCH: arm64
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      EXPECTED_WORKFLOW_REPOSITORY: Chrizz100/veux-nongki-universal-kernel

      RESTORE_KIT_RELATIVE_PATH: 
        lineages/5.4.274/P14_SOURCE_RESTORE_COMPACT_V2.zip
      RESTORE_KIT_SHA256: 
        20327b9edc783429bd4987febff3e77e42cc9be62493be41c7aaec2af3d3b0db

      BASE_DIR: ${{ github.workspace }}/kernel-p14r1-base
      TARGET_DIR: ${{ github.workspace }}/kernel-5.4.301
      RESUKISU_UPSTREAM: ${{ github.workspace }}/resukisu-upstream
      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/clang-r416183b
      OUT301: ${{ github.workspace }}/out-5.4.301
      AUDIT_DIR: ${{ github.workspace }}/u5-o47-audit
      DIST_DIR: ${{ github.workspace }}/u5-o47-dist
      EXPECTED_P13_PATCH_SHA256: 
        d56725a9d6a6dc7bf1e73a5763b894bdabb544119f4c75df5f437ccd4ff29a52
      EXPECTED_VENDOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      EXPECTED_VENDOR_KERNEL_VERSION: 5.4.268
      EXPECTED_OUTER_TREE: 19b68131d7a3955085f60c4fb8cf64442427af0c
      EXPECTED_P13_TREE: 27f712099ca93c93f7b6db8884cc1f3b6e61ae0f
      EXPECTED_P5I_COMMIT: f353a9475e40ca866d570c1d0ef55e24cf6556e4
      EXPECTED_P5I_TREE: a947c1f2891c796a08373fc755e29b23139dc761
      EXPECTED_RESUKISU_BASE_HEAD: 42034caa96466e8473fe7553eba8a1888c7f460f
      EXPECTED_RESUKISU_BASE_TREE: d818d965b855d417edfe9eb38b152ff83e75e0fb
      EXPECTED_P12_EXEC_SHA256: 
        fa3b73421f35d6220fb9e03e112a9509b76c04933af2353c9a8c65d6fb6bd6a9
      EXPECTED_P12_CONTRACT_SHA256: 
        b6d1875f6a79231465bc78df6484f2856a427259998eb93ba9fd2597cb45ca53
      EXPECTED_P12_SUSFS_C_SHA256: 
        e430d573ba5875a55d1ca70ba1b304e4b6727bbc42b8c3ac16f2c175b29a59c1
      EXPECTED_P12_SUSFS_H_SHA256: 
        3c5fb1bcc28a70c82ee5cfe0a7375bb8e7babd26618ce9b451e598fa31aa3b6e
      EXPECTED_P12_SUSFS_DEF_SHA256: 
        b16108a5fcd4cdd7203d9f084c2154da708ab3ae6bed17109e4ec63f04ff0f68

      # Exact real-device P14R1 ReSukiSU lineage.
      RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
      RESUKISU_COMMON_BASE: faccf4c5edc7be37776216e7d43dd3dca0239331
      RESUKISU_DEVICE_PASS_BASE: 052ca27775cc9c8570e3b1ba3db7c29486d6020e
      RESUKISU_P13_DEVICE_PASS: 7741f87849f7ad7cebf82bbb4c5b89880e61e37e
      RESUKISU_P14_DEVICE_PASS: 6ec8d9a8a8be30878c388504cacf8ae7849c757b
      RESUKISU_TARGET: 3d1185d878a856ea6435799b436b3d3ec510da76
      RESUKISU_EXPECTED_DELTA_COMMITS: '3'
      EXPECTED_KSU_VERSION: '35157'
      EXPECTED_KSU_UAPI: '4'
      RESUKISU_EXCLUDED_MODULE_FILTER: b2ac2fc8703ce9f5226e2a38a59f8b72f8a3005c
      RESUKISU_MANAGER_PARENT_BLOB: b96e219fb0ff155eaefefbd74cd989968d209bab
      RESUKISU_MANAGER_TARGET_BLOB: 5166d5cf4d82a2e9bf7305fa775791ec4e1957e3
      RESUKISU_IMAGE_IDENTITY: v4.2.0-rc2-3d1185d8-p14r1@ReSukiSU

      # Proven VEUX build identity.
      CLANG_PREBUILT_COMMIT: aa2e4a514a6c85eebcc4a27149eaf9244e951a1e
      KBUILD_BUILD_USER: builder
      KBUILD_BUILD_HOST: pangu-build-component-vendor-345942-54r9t-tw0tk-tq90c
      KBUILD_BUILD_TIMESTAMP: Thu Dec 5 14:47:59 UTC 2024
      KBUILD_BUILD_VERSION: '1'
      SOURCE_DATE_EPOCH: '1733410079'
      KBUILD_FIXED_SCM_SUFFIX: -g82179e362f33
      EFFECTIVE_KCFLAGS: -D__ANDROID_COMMON_KERNEL__
      EXPECTED_RELEASE_301: 5.4.301-qgki-g82179e362f33
      EXPECTED_CONFIG_301_SHA256: 
        864c412f9a98e724fae63a6207838783bb1d4b36e6213d2dbe0965c22de45f3d
      EXPECTED_DTB_SHA256: 
        42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37
      SUPPORT301_RELATIVE_PATH: lineages/5.4.301/O45_5.4.301_PORT_SUPPORT_V1.zip
      SUPPORT301_SHA256: 
        cf53241b1354e0c3ec415f707e18a5da0b4398f6f60c9a77e8f2aa0faa68558f
      SUPPORT301_ROOT: ${{ github.workspace }}/.o47-support
      RESTORE_ROOT: ${{ github.workspace }}/.o47-restore

      # Frozen, already-GREEN 5.4.300 reconstruction.
      EXPECTED_P301_PATCH_SHA256: 
        5f14bf8ab9464ac52ed00f23a9fa9d5dbe43637697aef118f9e85abaf25e608a
      EXPECTED_PM301_PATCH_SHA256: 
        020b692bb47f631907fc5c7a3c14e67ad97c5b902d7f1cd24303c77b511ba17e
      EXPECTED_DEP301_PATCH_SHA256: 
        9c1cb6965286f53a910733c84809ff51df7a826950853247843d816a10023577
      EXPECTED_301_PRE_DEP_TREE: 0440fcb6c822ac6a77da4d0aa4e1ddfaf530bd28
      EXPECTED_301_FINAL_TREE: 6c40e348ed03083346204dca331a0be563553062
      EXPECTED_IMAGE_301_SHA256: 
        d331865930fd6544bb7457d6d6e0241fc3b181f1f831a6c9ae921a57f79b8c82
      FREEZE_RUN_ID: '35457980880'
      FREEZE_HEAD_SHA: cc09c7ed542d27931c023f05b489f58912ed1c7a
      SOURCE_GREEN_RUN_ID: '35450814757'
      SOURCE_GREEN_HEAD_SHA: 58047eeccf55a152574f4bf25ff2c1de304b5a5b
      SOURCE_GREEN_ARTIFACT_SHA256: 
        36bccc1807ae4263f561831b0423fd9f4bb2ef0d90b788ed4edf36be543f9d6d
      AK3_REPO: https://github.com/osm0sis/AnyKernel3.git
      AK3_COMMIT: af770f7b16cf8f8eb7c68614b2a693b3b361c90c
      AK3_DIR: ${{ github.workspace }}/AnyKernel3
      AK3_ZIP_NAME: VEUX-5.4.301-ReSukiSU-35157-UAPI4-SUSFS-2.3.0-AK3.zip
    steps:
    - name: Repository and immutable-plan gate
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "$BASE_DIR" "$TARGET_DIR" "$RESUKISU_UPSTREAM" "$TOOLCHAIN_DIR" \
               "$OUT301" "$SUPPORT301_ROOT" "$RESTORE_ROOT" "$AK3_DIR" \
               "$AUDIT_DIR" "$DIST_DIR"
        mkdir -p "$AUDIT_DIR" "$DIST_DIR" "$TOOLCHAIN_DIR"
        test "$GITHUB_REPOSITORY" = "$EXPECTED_WORKFLOW_REPOSITORY"
        cat > "$AUDIT_DIR/00-plan.txt" <<'EOF'
        U5-O47 v1: package the frozen GREEN VEUX Linux 5.4.301 lineage.
        Source authority: O46-v3 frozen O45_5.4.301_PORT_SUPPORT_V1.zip.
        ReSukiSU lineage: P14R1 / 35157 / UAPI4 / SUSFS 2.3.0.
        Module-load-filter remains excluded.
        Target ladder in this workflow:
        SOURCE_PORT_PASS=PASS (replay-authenticated)
        COMPILE_PASS=YES (exact known Image reproduced)
        PACKAGE_PASS=YES (only if CLEAN Image-only AK3 validation passes)
        STATIC_BOOT_PATH_PASS=NO
        DEVICE_PASS=NO
        EOF
    - name: Checkout current universal-kernel project
      uses: actions/checkout@v7
      with:
        path: project
        fetch-depth: 1
        persist-credentials: false

    - name: Install build and package dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ca-certificates curl flex git jq \
          libelf-dev libncurses-dev libssl-dev patch python3 rsync unzip zip xz-utils zstd file
    - name: Authenticate frozen 5.4.301 lineage support kit
      shell: bash
      run: |
        set -euo pipefail
        kit="$GITHUB_WORKSPACE/project/$SUPPORT301_RELATIVE_PATH"
        test -s "$kit"
        test "$(sha256sum "$kit" | awk '{print $1}')" = "$SUPPORT301_SHA256"
        unzip -t "$kit" > "$AUDIT_DIR/01-support-zip-test.txt"
        mkdir -p "$SUPPORT301_ROOT"
        unzip -q "$kit" -d "$SUPPORT301_ROOT"
        support="$SUPPORT301_ROOT/O45_5.4.301_PORT_SUPPORT_V1"
        test -d "$support"
        test -f "$support/SHA256SUMS"
        (cd "$support" && sha256sum -c SHA256SUMS) | tee "$AUDIT_DIR/01-support-sha256.txt"

        p301="$support/source/P13-to-5.4.301-AUTO-MERGED-PARTIAL.patch"
        p13="$support/source/07-P13-post-exec.patch"
        pm="$support/deps/06-pm-runtime-needs-force-resume-5.4.301.patch"
        dep="$support/deps/08-timer-sizeadd-dependency-5.4.301.patch"
        for f in "$p301" "$p13" "$pm" "$dep" "$support/PROVENANCE.txt" "$support/PORT_RESULT.txt" "$support/COMPILE_RESULT.txt"; do
          test -s "$f"
        done

        test "$(sha256sum "$p301" | awk '{print $1}')" = "$EXPECTED_P301_PATCH_SHA256"
        test "$(sha256sum "$p13" | awk '{print $1}')" = "$EXPECTED_P13_PATCH_SHA256"
        test "$(sha256sum "$pm" | awk '{print $1}')" = "$EXPECTED_PM301_PATCH_SHA256"
        test "$(sha256sum "$dep" | awk '{print $1}')" = "$EXPECTED_DEP301_PATCH_SHA256"

        grep -Fxq 'repo=Chrizz100/veux-nongki-universal-kernel' "$support/PROVENANCE.txt"
        grep -Fxq 'freeze_workflow=U5-O46-V3' "$support/PROVENANCE.txt"
        grep -Fxq "freeze_run=$FREEZE_RUN_ID" "$support/PROVENANCE.txt"
        grep -Fxq "freeze_head_sha=$FREEZE_HEAD_SHA" "$support/PROVENANCE.txt"
        grep -Fxq "source_green_run=$SOURCE_GREEN_RUN_ID" "$support/PROVENANCE.txt"
        grep -Fxq "source_green_head_sha=$SOURCE_GREEN_HEAD_SHA" "$support/PROVENANCE.txt"
        grep -Fxq "source_green_artifact_sha256=$SOURCE_GREEN_ARTIFACT_SHA256" "$support/PROVENANCE.txt"
        grep -Fxq "source_green_image_sha256=$EXPECTED_IMAGE_301_SHA256" "$support/PROVENANCE.txt"
        grep -Fxq "resukisu_target=$RESUKISU_TARGET" "$support/PROVENANCE.txt"
        grep -Fxq 'ksu_version=35157' "$support/PROVENANCE.txt"
        grep -Fxq 'uapi=4' "$support/PROVENANCE.txt"
        grep -Fxq 'susfs=2.3.0' "$support/PROVENANCE.txt"
        grep -Fxq 'module_load_filter=EXCLUDED' "$support/PROVENANCE.txt"
        grep -Fxq "source_301_pre_dependency_tree=$EXPECTED_301_PRE_DEP_TREE" "$support/PROVENANCE.txt"
        grep -Fxq "source_301_final_tree=$EXPECTED_301_FINAL_TREE" "$support/PROVENANCE.txt"

        grep -Fxq 'OFFICIAL_300_TO_301_DELTA=PASS' "$support/PORT_RESULT.txt"
        grep -Fxq 'TARGET_5.4.301_SOURCE=PASS' "$support/PORT_RESULT.txt"
        grep -Fxq "KERNEL_RELEASE=$EXPECTED_RELEASE_301" "$support/COMPILE_RESULT.txt"
        grep -Fxq "IMAGE_SHA256=$EXPECTED_IMAGE_301_SHA256" "$support/COMPILE_RESULT.txt"
        grep -Fxq "CONFIG_SHA256=$EXPECTED_CONFIG_301_SHA256" "$support/COMPILE_RESULT.txt"
        grep -Fxq "DTB_SHA256=$EXPECTED_DTB_SHA256" "$support/COMPILE_RESULT.txt"
        grep -Fxq 'SOURCE_PORT_PASS=PASS' "$support/COMPILE_RESULT.txt"
        grep -Fxq 'COMPILE_GREEN_CANDIDATE=PASS' "$support/COMPILE_RESULT.txt"
        grep -Fxq 'PACKAGE_PASS=NO' "$support/COMPILE_RESULT.txt"

        {
          echo "P301_PATCH=$p301"
          echo "P13_PATCH=$p13"
          echo "PM_PATCH=$pm"
          echo "DEP_PATCH=$dep"
        } >> "$GITHUB_ENV"

        echo 'FROZEN_5.4.301_SUPPORT_AUTH=PASS' | tee "$AUDIT_DIR/01-support-gate.txt"
    - name: Reconstruct exact frozen 5.4.274 outer source
      shell: bash
      run: |
        set -euo pipefail
        git clone -q https://github.com/dereference23/kernel_xiaomi_sm6375.git "$BASE_DIR"
        git -C "$BASE_DIR" checkout -q --detach "$EXPECTED_VENDOR_SHA"
        test "$(git -C "$BASE_DIR" rev-parse HEAD)" = "$EXPECTED_VENDOR_SHA"
        test "$(make -s -C "$BASE_DIR" kernelversion)" = "$EXPECTED_VENDOR_KERNEL_VERSION"

        kit="$GITHUB_WORKSPACE/project/$RESTORE_KIT_RELATIVE_PATH"
        test -s "$kit"
        test "$(sha256sum "$kit" | awk '{print $1}')" = "$RESTORE_KIT_SHA256"
        mkdir -p "$RESTORE_ROOT"
        unzip -q "$kit" -d "$RESTORE_ROOT"
        restore_dir="$RESTORE_ROOT/source-restore-kit"
        result_file="$RESTORE_ROOT/17-result.txt"
        test -d "$restore_dir"
        test -f "$result_file"
        grep -Fxq 'CLEAN_GEN1_P6V11_FULL_SUSFS_OUTER_INTEGRATION_DETERMINISTIC_BUILD=PASS' "$result_file"
        (cd "$restore_dir" && sha256sum -c SHA256SUMS) | tee "$AUDIT_DIR/02-restore-sha256.txt"

        test "$(sha256sum "$restore_dir/manifest.json" | awk '{print $1}')" = '35ccea66e7c25078a0169e02d2cbb42061dc002c578a456c41c045935db1acc7'
        test "$(sha256sum "$restore_dir/p5i/manifest.json" | awk '{print $1}')" = 'd905ddeedaf379de15d42f5094267b70897061cd08275041f1d588604c6e1546'
        test "$(sha256sum "$restore_dir/p5i/vendor-20240619-to-p5i-outer.patch" | awk '{print $1}')" = '4016649007e50b67389c3c5860b7124d1454f9f29973079e9f0754a439c50991'
        test "$(sha256sum "$restore_dir/p5i-to-p6-source-compat.patch" | awk '{print $1}')" = '1edd7b005f8af7bd9cad955bced33c6d5509347a6c17c51c4678be89fd3c1cbc'
        test "$(sha256sum "$restore_dir/p6v10-to-p6v11-full-susfs-outer.patch" | awk '{print $1}')" = '220c388cc13640971802f422fee3804ef78bd892d7c077bcf216e0e80bf14e44'

        jq -e \
          --arg p5commit "$EXPECTED_P5I_COMMIT" \
          --arg p5tree "$EXPECTED_P5I_TREE" \
          --arg rhead "$EXPECTED_RESUKISU_BASE_HEAD" \
          --arg rtree "$EXPECTED_RESUKISU_BASE_TREE" \
          --arg outer "$EXPECTED_OUTER_TREE" \
          '.stage == "CLEAN_GEN1_P6V11_SOURCE" and .p5i_commit == $p5commit and .p5i_tree == $p5tree and .resukisu_head == $rhead and .resukisu_tree == $rtree and .p6_source_tree == $outer' \
          "$restore_dir/manifest.json" >/dev/null

        git -C "$BASE_DIR" reset --hard "$EXPECTED_VENDOR_SHA"
        git -C "$BASE_DIR" clean -fdx
        for p in \
          "$restore_dir/p5i/vendor-20240619-to-p5i-outer.patch" \
          "$restore_dir/p5i-to-p6-source-compat.patch" \
          "$restore_dir/p6v10-to-p6v11-full-susfs-outer.patch"; do
          git -C "$BASE_DIR" apply --check --whitespace=error --binary "$p"
          git -C "$BASE_DIR" apply --index --whitespace=error --binary "$p"
        done
        test "$(git -C "$BASE_DIR" write-tree)" = "$EXPECTED_OUTER_TREE"
        test "$(make -s -C "$BASE_DIR" kernelversion)" = '5.4.274'
        test "$(sha256sum "$BASE_DIR/fs/exec.c" | awk '{print $1}')" = "$EXPECTED_P12_EXEC_SHA256"
        test "$(sha256sum "$BASE_DIR/include/linux/ksu_hook_contract.h" | awk '{print $1}')" = "$EXPECTED_P12_CONTRACT_SHA256"
        test "$(sha256sum "$BASE_DIR/fs/susfs.c" | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_C_SHA256"
        test "$(sha256sum "$BASE_DIR/include/linux/susfs.h" | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_H_SHA256"
        test "$(sha256sum "$BASE_DIR/include/linux/susfs_def.h" | awk '{print $1}')" = "$EXPECTED_P12_SUSFS_DEF_SHA256"
        echo 'OUTER_SOURCE_RECONSTRUCTION=PASS' | tee "$AUDIT_DIR/02-outer-source.txt"

    - name: Construct exact P14R1 ReSukiSU 35157 subtree
      shell: bash
      run: |
        set -euo pipefail
        git clone -q "$RESUKISU_REPO" "$RESUKISU_UPSTREAM"
        for c in "$RESUKISU_COMMON_BASE" "$RESUKISU_DEVICE_PASS_BASE" "$RESUKISU_P13_DEVICE_PASS" \
                 "$RESUKISU_P14_DEVICE_PASS" "$RESUKISU_TARGET" "$RESUKISU_EXCLUDED_MODULE_FILTER"; do
          git -C "$RESUKISU_UPSTREAM" cat-file -e "${c}^{commit}"
        done
        git -C "$RESUKISU_UPSTREAM" merge-base --is-ancestor "$RESUKISU_P14_DEVICE_PASS" "$RESUKISU_TARGET"
        test "$(git -C "$RESUKISU_UPSTREAM" rev-list --count "${RESUKISU_P14_DEVICE_PASS}..${RESUKISU_TARGET}")" = "$RESUKISU_EXPECTED_DELTA_COMMITS"
        git -C "$RESUKISU_UPSTREAM" diff --name-only "$RESUKISU_P14_DEVICE_PASS" "$RESUKISU_TARGET" -- kernel uapi \
          | LC_ALL=C sort > "$AUDIT_DIR/03-resukisu-delta.txt"
        printf '%s\n' 'kernel/manager/manager.c' > "$AUDIT_DIR/03-resukisu-delta.expected.txt"
        diff -u "$AUDIT_DIR/03-resukisu-delta.expected.txt" "$AUDIT_DIR/03-resukisu-delta.txt"
        git -C "$RESUKISU_UPSTREAM" diff --quiet "$RESUKISU_P14_DEVICE_PASS" "$RESUKISU_TARGET" -- uapi
        test "$(git -C "$RESUKISU_UPSTREAM" rev-parse "$RESUKISU_P14_DEVICE_PASS:kernel/manager/manager.c")" = "$RESUKISU_MANAGER_PARENT_BLOB"
        test "$(git -C "$RESUKISU_UPSTREAM" rev-parse "$RESUKISU_TARGET:kernel/manager/manager.c")" = "$RESUKISU_MANAGER_TARGET_BLOB"
        target_count="$(git -C "$RESUKISU_UPSTREAM" rev-list --count "$RESUKISU_TARGET")"
        test "$((30700 + target_count))" = "$EXPECTED_KSU_VERSION"
        git -C "$RESUKISU_UPSTREAM" show "$RESUKISU_TARGET:uapi/supercall.h" | grep -Eq "KERNEL_SU_UAPI_VERSION = ${EXPECTED_KSU_UAPI};"

        git -C "$RESUKISU_UPSTREAM" checkout -q --detach "$RESUKISU_TARGET"
        git -C "$RESUKISU_UPSTREAM" reset --hard -q "$RESUKISU_TARGET"
        git -C "$RESUKISU_UPSTREAM" clean -fdx -q
        python3 - <<'PY'
        from pathlib import Path
        import os
        root=Path(os.environ['RESUKISU_UPSTREAM'])
        def remove_exact(path, block, expected=1):
            p=root/path
            t=p.read_text(encoding='utf-8')
            if t.count(block) != expected:
                raise SystemExit(f'{path}: unexpected block count')
            p.write_text(t.replace(block,'',expected), encoding='utf-8')
        for rel in ('kernel/feature/module_load_filter.c','kernel/feature/module_load_filter.h'):
            p=root/rel
            if not p.is_file(): raise SystemExit('missing '+rel)
            p.unlink()
        remove_exact('kernel/Kbuild','kernelsu-objs += feature/module_load_filter.o\n')
        remove_exact('kernel/core/init.c','#include "feature/module_load_filter.h"\n')
        remove_exact('kernel/core/init.c','char ksu_block_modules[256];\nmodule_param_string(block_modules, ksu_block_modules, sizeof(ksu_block_modules), 0);\nMODULE_PARM_DESC(block_modules, "Comma-separated preset module names to acknowledge without loading");\n\n')
        remove_exact('kernel/core/init.c','        ksu_module_load_filter_hook_init();\n\n')
        remove_exact('kernel/core/init.c','    ksu_module_load_filter_hook_exit();\n')
        PY
        ! grep -RFn 'module_load_filter' "$RESUKISU_UPSTREAM/kernel" "$RESUKISU_UPSTREAM/uapi"
        ! grep -RFn 'block_modules' "$RESUKISU_UPSTREAM/kernel" "$RESUKISU_UPSTREAM/uapi"

        import_patch="$AUDIT_DIR/03-p14r1-kernel-uapi.patch"
        git -C "$RESUKISU_UPSTREAM" diff --binary "$RESUKISU_COMMON_BASE" -- kernel uapi > "$import_patch"
        test -s "$import_patch"
        rm -rf "$BASE_DIR/KernelSU"
        git clone -q "$RESUKISU_REPO" "$BASE_DIR/KernelSU"
        git -C "$BASE_DIR/KernelSU" checkout -q --detach "$RESUKISU_COMMON_BASE"
        git -C "$BASE_DIR/KernelSU" reset --hard -q "$RESUKISU_COMMON_BASE"
        git -C "$BASE_DIR/KernelSU" clean -fdx -q
        git -C "$BASE_DIR/KernelSU" apply --check --whitespace=nowarn "$import_patch"
        git -C "$BASE_DIR/KernelSU" apply --index --whitespace=nowarn "$import_patch"

        python3 - <<'PY'
        from pathlib import Path
        from textwrap import dedent
        import os
        root=Path(os.environ['BASE_DIR'])/'KernelSU'
        def ensure_include(rel, anchor):
            p=root/rel; t=p.read_text(encoding='utf-8'); inc='#include <linux/ksu_hook_contract.h>'
            if inc not in t:
                if anchor not in t: raise SystemExit('missing anchor '+rel)
                p.write_text(t.replace(anchor, anchor+'\n'+inc,1), encoding='utf-8')
        ensure_include('kernel/feature/sucompat.h','#include "compat/kernel_compat.h"')
        ensure_include('kernel/runtime/ksud_integration.c','#include <linux/version.h>')
        ensure_include('kernel/supercall/supercall.c','#include <linux/anon_inodes.h>')
        p=root/'kernel/Kbuild'; t=p.read_text(encoding='utf-8')
        old=dedent('''\
        KSU_LOCAL_VERSION := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-list --count HEAD)
        KSU_VERSION := $(shell expr 30000 + $(KSU_LOCAL_VERSION) + 700)

        KSU_TAG_NAME    := $(shell cd $(KSU_SRC); $(GIT_BIN) describe --abbrev=0 --tags 2>/dev/null || echo "v4.1.0")
        KSU_COMMIT_SHA  := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-parse --short=8 HEAD 2>/dev/null || echo "unknown")
        ifneq ($(shell cd $(KSU_SRC); $(GIT_BIN) diff-index --quiet HEAD; echo $$?),0)
        KSU_COMMIT_SHA  := $(KSU_COMMIT_SHA)-dirty
        endif
        KSU_BRANCH_NAME := $(shell cd $(KSU_SRC); $(GIT_BIN) branch --show-current 2>/dev/null || echo "unknown")''')
        new=dedent(f'''\
        KSU_LOCAL_VERSION := $(shell cd $(KSU_SRC); $(GIT_BIN) rev-list --count HEAD)
        CLEAN_GEN1_UPSTREAM_COMPAT_VERSION := {os.environ['EXPECTED_KSU_VERSION']}
        CLEAN_GEN1_UPSTREAM_TARGET := {os.environ['RESUKISU_TARGET']}
        KSU_VERSION := $(CLEAN_GEN1_UPSTREAM_COMPAT_VERSION)

        KSU_TAG_NAME    := v4.2.0-rc2
        KSU_COMMIT_SHA  := 3d1185d8-p14r1
        KSU_BRANCH_NAME := clean-gen1-p14r1''')
        if old not in t: raise SystemExit('Kbuild identity block missing')
        p.write_text(t.replace(old,new,1), encoding='utf-8')
        PY
        git -C "$BASE_DIR/KernelSU" add kernel uapi
        test -z "$(git -C "$BASE_DIR/KernelSU" ls-files -u)"
        grep -Fq "CLEAN_GEN1_UPSTREAM_COMPAT_VERSION := $EXPECTED_KSU_VERSION" "$BASE_DIR/KernelSU/kernel/Kbuild"
        grep -Fq "CLEAN_GEN1_UPSTREAM_TARGET := $RESUKISU_TARGET" "$BASE_DIR/KernelSU/kernel/Kbuild"
        grep -Eq "KERNEL_SU_UAPI_VERSION = ${EXPECTED_KSU_UAPI};" "$BASE_DIR/KernelSU/uapi/supercall.h"
        test ! -e "$BASE_DIR/KernelSU/kernel/feature/module_load_filter.c"
        test "$(git -C "$BASE_DIR/KernelSU" hash-object kernel/manager/manager.c)" = "$RESUKISU_MANAGER_TARGET_BLOB"
        echo 'P14R1_RESUKISU_SUBTREE=PASS' | tee "$AUDIT_DIR/03-resukisu-gate.txt"

    - name: Reapply P13 outer hook and verify P14R1 contracts
      shell: bash
      run: |
        set -euo pipefail
        git -C "$BASE_DIR" apply --check --whitespace=error --binary "$P13_PATCH"
        git -C "$BASE_DIR" apply --index --whitespace=error --binary "$P13_PATCH"
        git -C "$BASE_DIR" diff --cached --check
        test "$(git -C "$BASE_DIR" write-tree)" = "$EXPECTED_P13_TREE"
        grep -Fq 'ksu_handle_post_execve' "$BASE_DIR/fs/exec.c"
        ! grep -Fq 'ksu_install_su_fd' "$BASE_DIR/fs/exec.c"
        ! grep -Fq 'key_need_perm' "$BASE_DIR/include/linux/key.h"
        grep -Fq 'session_keyring;' "$BASE_DIR/include/linux/cred.h"
        grep -Fq 'LSM_HOOK_INIT(key_permission, ksu_handle_key_permission)' "$BASE_DIR/KernelSU/kernel/hook/lsm_hooks.c"
        grep -Fq 'install_session_keyring_to_cred(ksu_cred, init_session_keyring);' "$BASE_DIR/KernelSU/kernel/compat/kernel_compat.c"
        grep -Fq 'init_session_keyring = ksu_get_session_keyring(current_cred());' "$BASE_DIR/KernelSU/kernel/core/init.c"

        git -C "$BASE_DIR" config user.name 'VEUX O47 Audit'
        git -C "$BASE_DIR" config user.email 'veux-o47@invalid.local'
        outer_tree="$(git -C "$BASE_DIR" write-tree)"
        base_commit="$(printf '%s\n' 'O47 exact P14R1 integration base' | git -C "$BASE_DIR" commit-tree "$outer_tree" -p "$EXPECTED_VENDOR_SHA")"
        git -C "$BASE_DIR" reset --hard "$base_commit"
        KSU_TREE="$(git -C "$BASE_DIR/KernelSU" write-tree)"
        echo "BASE_COMMIT=$base_commit" >> "$GITHUB_ENV"
        echo "KSU_TREE=$KSU_TREE" >> "$GITHUB_ENV"
        # Required by the later lineage-freeze step. O46 v2 only wrote this
        # value to the audit file, so set -u aborted while expanding PROVENANCE.txt.
        test -n "$outer_tree"
        echo "P13_OUTER_TREE=$outer_tree" >> "$GITHUB_ENV"
        {
          echo "P13_OUTER_TREE=$outer_tree"
          echo "P14R1_KERNELSU_TREE=$KSU_TREE"
          echo 'P13_POST_EXEC=PASS'
          echo 'P14R1_KEYRING_MATRIX=PASS'
        } | tee "$AUDIT_DIR/04-p14r1-integration.txt"

    - name: Replay frozen 5.4.301 lineage from authenticated support
      shell: bash
      run: |
        set -euo pipefail
        git -C "$BASE_DIR" worktree add -q --detach "$TARGET_DIR" "$BASE_COMMIT"

        git -C "$TARGET_DIR" apply --check --whitespace=error --binary "$P301_PATCH"
        git -C "$TARGET_DIR" apply --index --whitespace=error --binary "$P301_PATCH"
        git -C "$TARGET_DIR" diff --cached --check
        test "$(make -s -C "$TARGET_DIR" kernelversion)" = '5.4.301'
        test "$(git -C "$TARGET_DIR" write-tree)" = "$EXPECTED_301_PRE_DEP_TREE"

        # KernelSU is a nested repository and is therefore copied from the authenticated P14R1 base.
        rm -rf "$TARGET_DIR/KernelSU"
        cp -a "$BASE_DIR/KernelSU" "$TARGET_DIR/KernelSU"
        test "$(git -C "$TARGET_DIR/KernelSU" write-tree)" = "$KSU_TREE"

        git -C "$TARGET_DIR" apply --check --whitespace=error "$PM_PATCH"
        git -C "$TARGET_DIR" apply --index --whitespace=error "$PM_PATCH"
        git -C "$TARGET_DIR" apply --check --whitespace=error "$DEP_PATCH"
        git -C "$TARGET_DIR" apply --index --whitespace=error "$DEP_PATCH"
        git -C "$TARGET_DIR" diff --cached --check
        test "$(git -C "$TARGET_DIR" write-tree)" = "$EXPECTED_301_FINAL_TREE"

        grep -Fq 'ksu_handle_post_execve' "$TARGET_DIR/fs/exec.c"
        ! grep -Fq 'ksu_install_su_fd' "$TARGET_DIR/fs/exec.c"
        grep -Fq '#define ARM_CPU_PART_NEOVERSE_V3AE' "$TARGET_DIR/arch/arm64/include/asm/cputype.h"
        ! grep -Fq 'PCI_DMA_FROMDEVICE' "$TARGET_DIR/drivers/media/pci/ivtv/ivtv-streams.c"
        grep -Fq '__tcs_trigger(drv, i, false);' "$TARGET_DIR/drivers/soc/qcom/rpmh-rsc.c"
        grep -Fq 'needs_force_resume:1;' "$TARGET_DIR/include/linux/pm.h"
        grep -Eq 'static[[:space:]]+inline[[:space:]]+size_t[[:space:]]+smci_size_add[[:space:]]*\(' "$TARGET_DIR/drivers/soc/qcom/smcinvoke.c"
        grep -Fq 'del_timer_sync(&req->rsk_timer)' "$TARGET_DIR/net/ipv4/inet_connection_sock.c"
        ! grep -Fq 'timer_delete_sync(&req->rsk_timer)' "$TARGET_DIR/net/ipv4/inet_connection_sock.c"
        test ! -e "$TARGET_DIR/KernelSU/kernel/feature/module_load_filter.c"
        ! grep -RFn 'module_load_filter' "$TARGET_DIR/KernelSU/kernel" "$TARGET_DIR/KernelSU/uapi"

        git -C "$TARGET_DIR" status --short | tee "$AUDIT_DIR/05-replay-status.txt"
        {
          echo "SOURCE_PORT_PASS=PASS"
          echo "KERNEL_VERSION=$(make -s -C "$TARGET_DIR" kernelversion)"
          echo "PRE_DEP_TREE=$EXPECTED_301_PRE_DEP_TREE"
          echo "FINAL_TREE=$(git -C "$TARGET_DIR" write-tree)"
          echo "P14R1_KERNELSU_TREE=$KSU_TREE"
          echo "FROZEN_301_REPLAY=PASS"
        } | tee "$AUDIT_DIR/05-replay-result.txt"
    - name: Install exact proven Android clang-r416183b
      shell: bash
      run: |
        set -euo pipefail
        url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_PREBUILT_COMMIT}/clang-r416183b.tar.gz"
        curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/clang-r416183b.tar.gz"
        tar -xzf "$RUNNER_TEMP/clang-r416183b.tar.gz" -C "$TOOLCHAIN_DIR"
        for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
          test -x "$TOOLCHAIN_DIR/bin/$tool"
        done
        "$TOOLCHAIN_DIR/bin/clang" --version | tee "$AUDIT_DIR/07-clang.txt"

    - name: Compile and regression-audit 5.4.301
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$TOOLCHAIN_DIR/bin:$PATH"
        export KBUILD_BUILD_USER KBUILD_BUILD_HOST KBUILD_BUILD_TIMESTAMP KBUILD_BUILD_VERSION SOURCE_DATE_EPOCH
        rm -rf "$OUT301"
        make -C "$TARGET_DIR" O="$OUT301" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
          veux_defconfig 2>&1 | tee "$AUDIT_DIR/08-config.log"
        for q in \
          'CONFIG_KSU=y' \
          'CONFIG_KSU_SUSFS=y' \
          '# CONFIG_KSU_MANUAL_HOOK is not set' \
          'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' \
          'CONFIG_LOCALVERSION="-qgki"'; do
          grep -Fxq "$q" "$OUT301/.config"
        done
        config_sha="$(sha256sum "$OUT301/.config" | awk '{print $1}')"
        test "$config_sha" = "$EXPECTED_CONFIG_301_SHA256"

        make -C "$TARGET_DIR" -j"$(nproc)" O="$OUT301" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
          KCFLAGS="$EFFECTIVE_KCFLAGS" Image dtbs 2>&1 | tee "$AUDIT_DIR/08-build.log"

        image="$OUT301/arch/arm64/boot/Image"
        dtb="$OUT301/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb"
        test -s "$image"; test -s "$dtb"
        test "$(stat -c '%s' "$image")" -gt 20000000
        release="$(make -s -C "$TARGET_DIR" O="$OUT301" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 kernelrelease)"
        test "$release" = "$EXPECTED_RELEASE_301"
        test "$(sha256sum "$dtb" | awk '{print $1}')" = "$EXPECTED_DTB_SHA256"

        strings -a "$image" > "$AUDIT_DIR/08-image-strings.txt"
        grep -Fq "Linux version $EXPECTED_RELEASE_301 ($KBUILD_BUILD_USER@$KBUILD_BUILD_HOST)" "$AUDIT_DIR/08-image-strings.txt"
        grep -Fq "$RESUKISU_IMAGE_IDENTITY" "$AUDIT_DIR/08-image-strings.txt"
        grep -Fq 'susfs' "$AUDIT_DIR/08-image-strings.txt"

        python3 - "$AUDIT_DIR/08-build.log" <<'PY'
        from pathlib import Path
        import re, sys
        lines=Path(sys.argv[1]).read_text(errors='replace').splitlines()
        got=[]
        for line in lines:
            if 'warning:' not in line.lower(): continue
            m=re.search(r'((?:drivers|fs|net)/[^:]+:\d+:\d+: warning: .*)$', line)
            got.append(m.group(1) if m else line.strip())
        expected=[
        "drivers/clk/qcom/clk-rpmh.c:283:14: warning: comparison of distinct pointer types ('typeof (cmd_state) *' (aka 'unsigned int *') and 'typeof (16383) *' (aka 'int *')) [-Wcompare-distinct-pointer-types]",
        "fs/namei.c:3320:12: warning: unused function 'atomic_open' [-Wunused-function]",
        "drivers/cpufreq/qcom-cpufreq-hw.c:551:23: warning: unused variable 'c' [-Wunused-variable]",
        "net/ipv4/tcp_output.c:2028:14: warning: comparison of distinct pointer types ('typeof (srtt_in_ns >> 1) *' (aka 'unsigned long long *') and 'typeof (1000000L) *' (aka 'long *')) [-Wcompare-distinct-pointer-types]",
        ]
        if sorted(got) != sorted(expected):
            raise SystemExit('warning fingerprint changed\nGOT:\n'+'\n'.join(sorted(got))+'\nEXPECTED:\n'+'\n'.join(sorted(expected)))
        print('WARNING_REGRESSION_GATE=PASS')
        PY
        ! grep -Ei '(^|[^A-Za-z])(error:|fatal error:|undefined reference|ld\.lld: error:)' "$AUDIT_DIR/08-build.log"

        image_sha="$(sha256sum "$image" | awk '{print $1}')"
        test "$image_sha" = "$EXPECTED_IMAGE_301_SHA256"
        mkdir -p "$DIST_DIR/5.4.301"
        cp "$image" "$DIST_DIR/5.4.301/Image"
        cp "$dtb" "$DIST_DIR/5.4.301/veux.dtb"
        cp "$OUT301/.config" "$DIST_DIR/5.4.301/config"
        (cd "$DIST_DIR/5.4.301" && sha256sum Image veux.dtb config > SHA256SUMS.txt)
        {
          echo "KERNEL_RELEASE=$release"
          echo "RESUKISU_VERSION=$EXPECTED_KSU_VERSION"
          echo "RESUKISU_COMMIT=$RESUKISU_TARGET"
          echo "UAPI=$EXPECTED_KSU_UAPI"
          echo 'SUSFS=2.3.0'
          echo 'MODULE_LOAD_FILTER=EXCLUDED'
          echo 'P14R1_KEYRING_MATRIX=PASS'
          echo 'P13_POST_EXEC=PASS'
          echo 'WARNING_REGRESSION_GATE=PASS'
          echo "IMAGE_BYTES=$(stat -c '%s' "$image")"
          echo "IMAGE_SHA256=$image_sha"
          echo "CONFIG_SHA256=$config_sha"
          echo "DTB_SHA256=$(sha256sum "$dtb" | awk '{print $1}')"
          echo 'SOURCE_PORT_PASS=PASS'
          echo 'COMPILE_PASS=YES'
          echo 'PACKAGE_PASS=NO'
          echo 'STATIC_BOOT_PATH_PASS=NO'
          echo 'DEVICE_PASS=NO'
        } | tee "$AUDIT_DIR/09-result.txt"
        echo 'O47_COMPILE_PASS=1' >> "$GITHUB_ENV"

    - name: Build CLEAN Image-only 5.4.301 AnyKernel3 package
      shell: bash
      run: |
        set -euo pipefail
        test "${O47_COMPILE_PASS:-0}" = '1'
        image="$OUT301/arch/arm64/boot/Image"
        test -s "$image"
        test "$(sha256sum "$image" | awk '{print $1}')" = "$EXPECTED_IMAGE_301_SHA256"

        rm -rf "$AK3_DIR"
        git clone -q "$AK3_REPO" "$AK3_DIR"
        git -C "$AK3_DIR" checkout -q --detach "$AK3_COMMIT"
        test "$(git -C "$AK3_DIR" rev-parse HEAD)" = "$AK3_COMMIT"

        rm -f "$AK3_DIR/Image" "$AK3_DIR/Image.gz" "$AK3_DIR/Image.gz-dtb" \
              "$AK3_DIR/dtb" "$AK3_DIR/dtbo.img" "$AK3_DIR/boot.img"
        cp "$image" "$AK3_DIR/Image"

        cat > "$AK3_DIR/anykernel.sh" <<'EOF'
        # AnyKernel3 Ramdisk Mod Script
        # osm0sis @ xda-developers

        properties() { '
        kernel.string=VEUX Linux 5.4.301 ReSukiSU 3d1185d8 UAPI4 + SUSFS 2.3.0
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=veux
        supported.versions=13
        supported.patchlevels=
        '; }

        BLOCK=boot;
        IS_SLOT_DEVICE=1;
        SLOT_SELECT=active;
        RAMDISK_COMPRESSION=auto;
        PATCH_VBMETA_FLAG=0;

        . tools/ak3-core.sh;
        dump_boot;
        write_boot;
        EOF
        chmod 0755 "$AK3_DIR/anykernel.sh"

        rm -rf "$AK3_DIR/.git" "$AK3_DIR/.github"
        rm -f "$AK3_DIR/README.md"
        find "$AK3_DIR" -type f -name '*placeholder' -delete
        find "$AK3_DIR" -maxdepth 1 -type f -name '*.txt' -delete

        zip_path="$DIST_DIR/$AK3_ZIP_NAME"
        (
          cd "$AK3_DIR"
          zip -r9 "$zip_path" . -x '.github/*' 'README.md' '*placeholder' '*.txt'
        )
        test -s "$zip_path"
        echo "AK3_ZIP=$zip_path" >> "$GITHUB_ENV"
        {
          echo 'AK3_BUILD=PASS'
          echo 'AK3_IMAGE_ONLY=PASS'
          echo 'AK3_DEVICECHECK=ENABLED'
          echo 'AK3_ANDROID=13'
          echo "AK3_PIN=$AK3_COMMIT"
        } | tee "$AUDIT_DIR/10-ak3-build.txt"
    - name: Validate CLEAN AK3 and set PACKAGE PASS
      shell: bash
      run: |
        set -euo pipefail
        test -s "$AK3_ZIP"
        unzip -t "$AK3_ZIP" | tee "$AUDIT_DIR/11-ak3-unzip.txt"

        for required in anykernel.sh tools/ak3-core.sh Image META-INF/com/google/android/update-binary META-INF/com/google/android/updater-script; do
          unzip -Z1 "$AK3_ZIP" | grep -Fxq "$required"
        done

        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        unzip -p "$AK3_ZIP" Image > "$tmp/Image"
        cmp -s "$OUT301/arch/arm64/boot/Image" "$tmp/Image"
        test "$(sha256sum "$tmp/Image" | awk '{print $1}')" = "$EXPECTED_IMAGE_301_SHA256"

        unzip -p "$AK3_ZIP" anykernel.sh > "$tmp/anykernel.sh"
        bash -n "$tmp/anykernel.sh"
        grep -Fqx 'do.devicecheck=1' "$tmp/anykernel.sh"
        grep -Fqx 'device.name1=veux' "$tmp/anykernel.sh"
        grep -Fqx 'supported.versions=13' "$tmp/anykernel.sh"
        grep -Fqx 'BLOCK=boot;' "$tmp/anykernel.sh"
        grep -Fqx 'IS_SLOT_DEVICE=1;' "$tmp/anykernel.sh"
        grep -Fqx 'SLOT_SELECT=active;' "$tmp/anykernel.sh"
        grep -Fqx 'RAMDISK_COMPRESSION=auto;' "$tmp/anykernel.sh"
        grep -Fqx 'PATCH_VBMETA_FLAG=0;' "$tmp/anykernel.sh"
        grep -Fqx '. tools/ak3-core.sh;' "$tmp/anykernel.sh"
        grep -Fqx 'dump_boot;' "$tmp/anykernel.sh"
        grep -Fqx 'write_boot;' "$tmp/anykernel.sh"
        ! grep -Eq '^(block|is_slot_device|slot_select|ramdisk_compression|patch_vbmeta_flag)=' "$tmp/anykernel.sh"

        ! unzip -Z1 "$AK3_ZIP" | grep -Eq '(^|/)(boot\.img|rollback_stock_boot\.img(\.gz)?|dtb|dtbo\.img|Image\.gz|Image\.gz-dtb)$'
        ! unzip -Z1 "$AK3_ZIP" | grep -Ei '(^|/)(audit|build-info|final-result|sha256sums)([^/]*)$'
        ! unzip -Z1 "$AK3_ZIP" | grep -E '(^|/)\.git(/|$)|(^|/)\.github(/|$)|(^|/)README\.md$'

        python3 - "$AK3_ZIP" <<'PY2'
        import stat, sys, zipfile
        zpath=sys.argv[1]
        with zipfile.ZipFile(zpath) as z:
            names=z.namelist()
            if len(names) != len(set(names)):
                raise SystemExit('duplicate ZIP entries')
            for info in z.infolist():
                name=info.filename
                parts=[p for p in name.replace('\\','/').split('/') if p not in ('','.')]
                if name.startswith('/') or '..' in parts:
                    raise SystemExit(f'unsafe ZIP path: {name}')
                mode=(info.external_attr >> 16) & 0xFFFF
                if stat.S_ISLNK(mode):
                    raise SystemExit(f'symlink not allowed: {name}')
        print('ZIP_PATH_AND_SYMLINK_GUARD=PASS')
        PY2

        ak3_sha="$(sha256sum "$AK3_ZIP" | awk '{print $1}')"
        cp "$OUT301/arch/arm64/boot/Image" "$DIST_DIR/Image"
        # Keep the package artifact CLEAN: only the flash ZIP and exact audited Image.
        find "$DIST_DIR" -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
        find "$DIST_DIR" -maxdepth 1 -type f ! -name "$AK3_ZIP_NAME" ! -name 'Image' -delete

        grep -Fxq 'SOURCE_PORT_PASS=PASS' "$AUDIT_DIR/05-replay-result.txt"
        grep -Fxq 'FROZEN_301_REPLAY=PASS' "$AUDIT_DIR/05-replay-result.txt"
        grep -Fxq 'COMPILE_PASS=YES' "$AUDIT_DIR/09-result.txt"
        grep -Fxq 'WARNING_REGRESSION_GATE=PASS' "$AUDIT_DIR/09-result.txt"
        grep -Fxq 'AK3_BUILD=PASS' "$AUDIT_DIR/10-ak3-build.txt"

        {
          echo 'O47_5.4.301_PACKAGE_AUDIT=PASS'
          echo 'DEVICE=veux'
          echo 'LINUX=5.4.301'
          echo "KERNEL_RELEASE=$EXPECTED_RELEASE_301"
          echo "RESUKISU_COMMIT=$RESUKISU_TARGET"
          echo "KSU_VERSION=$EXPECTED_KSU_VERSION"
          echo "KSU_UAPI=$EXPECTED_KSU_UAPI"
          echo 'SUSFS=2.3.0'
          echo 'MODULE_LOAD_FILTER=EXCLUDED'
          echo 'SOURCE_PORT_PASS=PASS'
          echo 'COMPILE_PASS=YES'
          echo 'PACKAGE_PASS=YES'
          echo 'STATIC_BOOT_PATH_PASS=NO'
          echo 'DEVICE_PASS=NO'
          echo "IMAGE_SHA256=$EXPECTED_IMAGE_301_SHA256"
          echo "AK3=$(basename "$AK3_ZIP")"
          echo "AK3_SHA256=$ak3_sha"
          echo "AK3_PIN=$AK3_COMMIT"
          echo 'AK3_IMAGE_BYTE_PARITY=PASS'
          echo 'AK3_CLEAN_PUBLIC_PAYLOAD=PASS'
        } | tee "$AUDIT_DIR/11-package-result.txt"

        (
          cd "$AUDIT_DIR"
          sha256sum ./* | LC_ALL=C sort > SHA256SUMS.txt
        )
    - name: Upload CLEAN 5.4.301 AK3 package
      uses: actions/upload-artifact@v7
      with:
        name: VEUX-5.4.301-ReSukiSU-35157-P14R1-O47V1-PACKAGE-${{ github.run_id 
          }}
        path: u5-o47-dist/
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
    - name: Upload O47 package audit evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: VEUX-5.4.301-O47V1-AUDIT-${{ github.run_id }}
        path: u5-o47-audit/
        if-no-files-found: warn
        retention-days: 90
    - name: Final real GREEN gate
      shell: bash
      run: |
        set -euo pipefail
        result="$AUDIT_DIR/11-package-result.txt"
        test -s "$result"
        grep -Fxq 'O47_5.4.301_PACKAGE_AUDIT=PASS' "$result"
        grep -Fxq 'SOURCE_PORT_PASS=PASS' "$result"
        grep -Fxq 'COMPILE_PASS=YES' "$result"
        grep -Fxq 'PACKAGE_PASS=YES' "$result"
        grep -Fxq 'STATIC_BOOT_PATH_PASS=NO' "$result"
        grep -Fxq 'DEVICE_PASS=NO' "$result"
        grep -Fxq "IMAGE_SHA256=$EXPECTED_IMAGE_301_SHA256" "$result"
        grep -Fxq "AK3_PIN=$AK3_COMMIT" "$result"
        test -s "$DIST_DIR/$AK3_ZIP_NAME"
        test -s "$DIST_DIR/Image"
        test "$(sha256sum "$DIST_DIR/Image" | awk '{print $1}')" = "$EXPECTED_IMAGE_301_SHA256"
        test "$(find "$DIST_DIR" -maxdepth 1 -type f | wc -l)" -eq 2
        echo 'O47_REAL_GREEN_GATE=PASS'
