        import json,os,pathlib
        report=pathlib.Path(os.environ['R20_OUT'])/'R20_BUILD_RESULT.json'
        j=json.loads(report.read_text())
        if j.get('status') not in (
            'R20_WALT_ON_VMLINUX_IMAGE_DTB_AND_MODULE_BUILD_PROVEN_NO_FLASH',
            'R20_WALT_ON_FULL_BUILD_DIAGNOSTICS_RECORDED_NO_FLASH'):
            raise SystemExit('R20_STATUS_NOT_RECOGNIZED')
        if j.get('real_arm64_make_attempted') is not True or not j.get('make_targets'):
            raise SystemExit('R20_NO_GENUINE_FULL_BUILD_ATTEMPT')
        for x in ('vendor_abi_proven','flash_allowed','runtime_tested','brene_changed',
                  'bakasusu_nomount_changed','vendor_crc_matched'):
            if j.get(x) is not False:raise SystemExit('R20_UNSAFE_RELEASE_CLAIM:'+x)
        if j['full_image_proven']:
            if not (j['kernel_image_built'] and j['vmlinux_linked'] and
                    j['source_read_only'] and j['image']['arm64_header_ok'] and
                    j['vmlinux']['aarch64_elf_ok']):
                raise SystemExit('R20_FALSE_FULL_BUILD_CLAIM')
            if j['status']!='R20_WALT_ON_VMLINUX_IMAGE_DTB_AND_MODULE_BUILD_PROVEN_NO_FLASH':
                raise SystemExit('R20_SUCCESS_STATUS_MISMATCH')
        else:
            if j['status']!='R20_WALT_ON_FULL_BUILD_DIAGNOSTICS_RECORDED_NO_FLASH':
                raise SystemExit('R20_FALSE_DIAG_STATUS')
            print('::warning::R20 genuine full kernel make did not complete; '
                  'inspect R20_BUILD_RESULT.json and make_logs. Green workflow is diagnostic only.')
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('full_build='+str(j['full_image_proven']).lower()+'\n')
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## VEUX R20 – genuine WALT-ON full build (NO FLASH)\n')
            f.write('- 15/15 real R19 ARM64 objects, 13/13 typed provider symbols checked\n')
            f.write('- vmlinux linked: **'+str(j['vmlinux_linked'])+'**\n')
            f.write('- ARM64 Image: **'+str(j['kernel_image_built'])+'**\n')
            f.write('- DTB files: **'+str(len(j['dtb_files']))+'**\n')
            f.write('- Kernel modules: **'+str(len(j['module_files']))+'**\n')
            f.write('- **full_image_proven='+str(j['full_image_proven'])+'**\n')
            f.write('- Vendor ABI, CRC compatibility, device test: **NOT APPROVED**\n')
        print('R20_FINAL_DIAGNOSTIC_GATE=PASS; FULL_BUILD='+str(j['full_image_proven'])+'; FLASH=NO')
        PY_R20_STATUS
