        \    parts=line.split()\n        if len(parts)<4:raise ValueError('MALFORMED_SYMVERS_LINE:'+line[:60])\n        crc,name=parts[:2]\n        if not crc.startswith('0x'):raise\
        \ ValueError('SYMVERS_MISSING_CRC:'+name)\n        crc=f'0x{int(crc,16):08x}'\n        if name in out and out[name]!=crc:raise ValueError('SYMVERS_DUPLICATE_DIFFERENT_CRC:'+name)\n\
        \        out[name]=crc\n    return out\n\n\ndef audit(config_file, symvers_file, release, dtb_sha256=None, require_config_sha=True):\n    failures=[]\n    conf_path=Path(config_file)\n\
