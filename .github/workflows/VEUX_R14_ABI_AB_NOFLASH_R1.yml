        \    'critical_config':{k:cfg.get(k,'n') for k in FEATURES},\n        'rmnet_imports_count':len(crc_rows),\n        'rmnet_imports_matched':sum(x['status']=='MATCH' for x in\
        \ crc_rows),\n        'rmnet_module_layout_crc':sym.get('module_layout'),\n        'failures':failures, 'flash_allowed':False,\n        'device_test':False,\n        'new_bakasu_35252_integrated':False,\n\
        \        'new_nomount_v22_integrated':False,\n        'walt_porting_in_this_stage':False,\n    }\n    return report,crc_rows\n\n\ndef main():\n    ap=argparse.ArgumentParser()\n\
        \    ap.add_argument('--config',required=True)\n    ap.add_argument('--symvers',required=True)\n    ap.add_argument('--release-file',required=True)\n    ap.add_argument('--dtb-sha256')\n\
        \    ap.add_argument('--report-dir',required=True)\n    ns=ap.parse_args()\n    report,rows=audit(ns.config,ns.symvers,Path(ns.release_file).read_text(),ns.dtb_sha256)\n    d=Path(ns.report_dir)\n\
        \    d.mkdir(parents=True,exist_ok=True)\n    (d/'R55H17_R1_CASS_RESULT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\\n',encoding='utf-8')\n    with (d/'R55H17_R1_RMNET_132_ABI.csv').open('w',newline='',encoding='utf-8')\
        \ as f:\n        w=csv.DictWriter(f,fieldnames=list(rows[0]),delimiter=';');w.writeheader();w.writerows(rows)\n    print(f'R55H17_R1_CASS_GATE={report[\"status\"]}; RMNET={report[\"\
        rmnet_imports_matched\"]}/{len(rows)}; NO_FLASH')\n    if report['failures']:\n        for msg in report['failures'][:24]:print('BLOCKER:',msg)\n        raise SystemExit(26)\n\
