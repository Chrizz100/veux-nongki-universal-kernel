        \ <<'PY_R4_FINAL'\nimport json,sys\nfrom pathlib import Path\nupdated=json.loads(Path(sys.argv[1]).read_text())\nbaseline=json.loads(Path(sys.argv[2]).read_text())\nif updated.get('status')!='CASS_UPDATED_FULL_BUILD_AND_STATIC_ABI_PASS_NOFLASH':\n\
        \    raise SystemExit('UPDATED_CASS_BUILD_OR_STATIC_GATES_INCOMPLETE')\nfor flag in ('compiler_test','source_updates_staged','kernel_image_generated','raw_exported',\n      \
        \       'original_baseline_unchanged','embedded_config_matches','cass_linked'):\n    if updated.get(flag) is not True:raise SystemExit('MISSING_PROOF:'+flag)\nif (updated.get('flash_allowed')\
        \ is not False or updated.get('device_test') is not False\n    or updated.get('rmnet_imports_matched')!=132\n    or baseline.get('rmnet_imports_matched')!=132\n    or updated.get('bakasu_version',{}).get('count')!=4554\n\
        \    or updated.get('bakasu_version',{}).get('version')!=35254\n    or updated.get('bakasu_version',{}).get('commit')!='d2537b13ab15fce72e8c0d99e7788805f071aeb4'\n    or updated.get('bakasu_version',{}).get('parent')!='2cbbcc2363aa8d4b6286fc2266a338063b2b77a7'):\n\
        \    raise SystemExit('R4_VERSION_ABI_OR_NOFLASH_CONTRACT_CHANGED')\nprint('R55H17_R4_UPDATED_CASS_BUILD_AND_STATIC_ABI=PASS; DEVICE_TEST=NO; FLASH=NO')\nPY_R4_FINAL\n"
      id: r4_verify
    - name: 05 Record actual toolchain and reproducible build evidence
      id: r12_environment
      shell: bash
      run: "set -euo pipefail\npython3 -B \"$REPRO_PAYLOAD/r13/record_environment_r13.py\" \\\n  --stage \"$RUNNER_TEMP/veux-r55h17-r4\" --out \"$RUNNER_TEMP/r12-reports\"\ncp \"$REPRO_PAYLOAD/PAYLOAD_MANIFEST.json\"\
        \ \"$RUNNER_TEMP/r12-reports/PIPELINE_INPUT_MANIFEST.json\"\ncp \"$REPRO_PAYLOAD/provenance/REPRODUCIBLE_INPUT_CONTRACT.json\" \"$RUNNER_TEMP/r12-reports/\"\ncp \"$GITHUB_WORKSPACE/.github/workflows/VEUX_R13_CASS_BUILD.yml\"\
        \ \"$RUNNER_TEMP/r12-reports/EXECUTED_WORKFLOW.yml\"\ncp \"$RUNNER_TEMP/r11-reports/BASELINE_ABI_ORDER_CHECK.json\" \"$RUNNER_TEMP/veux-r55h17-r4/evidence/\"\ncp \"$RUNNER_TEMP/r11-reports/BASELINE_ABI_ORDER_CHECK.json\"\
        \ \"$RUNNER_TEMP/r12-reports/\"\ncp \"$REPRO_PAYLOAD/r13/SOURCE_CONTRACT.json\" \"$RUNNER_TEMP/r12-reports/R13_SOURCE_CONTRACT.json\"\n"
    - name: 06 Validate complete Image and vmlinux, built-in drivers, and real CI provenance
      id: r12_builtin
      shell: bash
      run: "set -euo pipefail\npython3 -B \"$REPRO_PAYLOAD/r13/packaging/collect_builtin.py\" \\\n  --source \"$RUNNER_TEMP/veux-r55h17-r4/source/kernel\" \\\n  --build \"$RUNNER_TEMP/veux-r55h17-r4/build\"\
        \ \\\n  --evidence \"$RUNNER_TEMP/veux-r55h17-r4/evidence\" \\\n  --out \"$RUNNER_TEMP/r12-flat-build\" \\\n  --repo-commit \"$GITHUB_SHA\" --evidence-mode ci\npython3 -B \"\
        $REPRO_PAYLOAD/r11/packaging/test_builtin_contract.py\" \\\n  --reference-pipeline \"$REPRO_PAYLOAD/pipeline\" \\\n  --candidate-build \"$RUNNER_TEMP/veux-r55h17-r4/build\" \\\
        \n  --output \"$RUNNER_TEMP/r12-reports/BUILTIN_COMMAND_CONTRACT_TESTS.json\"\n# The complete kernel was compiled once in the candidate stage above.\n# No external RMNET rebuild,\
        \ dummy module or previous vmlinux is accepted here.\n"
    - name: 07 Package the freshly built kernel as the normal AnyKernel ZIP
      id: r12_package
      shell: bash
      run: "set -euo pipefail\npython3 -B \"$REPRO_PAYLOAD/r13/package_anykernel.py\" \\\n  --inputs \"$RUNNER_TEMP/r12-flat-build\" \\\n  --receipt \"$RUNNER_TEMP/r12-flat-build/BUILD_OUTPUTS.json\"\
        \ \\\n  --out \"$RUNNER_TEMP/r12-kernel\" \\\n  --payload \"$REPRO_PAYLOAD\" \\\n  --evidence-mode ci\ntest -s \"$RUNNER_TEMP/r12-kernel/VEUX_R13_CASS_KERNEL.zip\"\ntest -s \"\
        $RUNNER_TEMP/r12-kernel/BUILD_PACKAGE_CHECK.json\"\ntest -s \"$RUNNER_TEMP/r12-kernel/BUILD_OUTPUTS.json\"\ntest -s \"$RUNNER_TEMP/r12-kernel/PACKAGE_RESULT.json\"\ntest -s \"\
        $RUNNER_TEMP/r12-kernel/SHA256SUMS\"\n(cd \"$RUNNER_TEMP/r12-kernel\" && sha256sum --check --strict SHA256SUMS)\n"
    - name: 08 Include the matching read-only R2 diagnosis and final checksums
      id: r12_diagnostics
      shell: bash
      run: "set -euo pipefail\npython3 -B \"$REPRO_PAYLOAD/r13/write_device_diagnostics.py\" \\\n  --checks \"$RUNNER_TEMP/r12-kernel/BUILD_PACKAGE_CHECK.json\" \\\n  --out \"$RUNNER_TEMP/r12-kernel/VEUX_R13_GERAETEDIAGNOSE_R2.sh\"\
        \nsh -n \"$RUNNER_TEMP/r12-kernel/VEUX_R13_GERAETEDIAGNOSE_R2.sh\"\nshellcheck --shell=sh --severity=error \"$RUNNER_TEMP/r12-kernel/VEUX_R13_GERAETEDIAGNOSE_R2.sh\"\n(cd \"\
        $RUNNER_TEMP/r12-kernel\" && sha256sum VEUX_R13_GERAETEDIAGNOSE_R2.sh >> SHA256SUMS && sha256sum --check --strict SHA256SUMS)\n"
    - name: Verify checked-out repository stayed unchanged
      if: ${{ always() }}
      shell: bash
      run: 'set -euo pipefail

        test "$GITHUB_REPOSITORY" = "$EXPECTED_REPO"

        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

        test -z "$(git status --porcelain --untracked-files=all)"

        echo ''R55H17_R4_CHECKED_OUT_REPOSITORY_UNCHANGED=PASS; DEVICE_TEST=NO; FLASH=NO''

        '
      id: r12_repo_unchanged
    - name: 09 Upload the verified kernel artifact
      id: r12_kernel_upload
      if: ${{ success() && steps.r12_package.conclusion == 'success' && steps.r12_diagnostics.conclusion == 'success' && steps.r12_repo_unchanged.conclusion == 'success' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: VEUX_R13_KERNEL
        path: '${{ runner.temp }}/r12-kernel/VEUX_R13_CASS_KERNEL.zip

          ${{ runner.temp }}/r12-kernel/VEUX_R13_GERAETEDIAGNOSE_R2.sh

          ${{ runner.temp }}/r12-kernel/SHA256SUMS

          ${{ runner.temp }}/r12-kernel/BUILD_OUTPUTS.json

          ${{ runner.temp }}/r12-kernel/BUILD_PACKAGE_CHECK.json

          ${{ runner.temp }}/r12-kernel/PACKAGE_RESULT.json

          ${{ runner.temp }}/r12-kernel/ANYKERNEL_PACKAGE_CHECK.json

          ${{ runner.temp }}/r12-kernel/README.txt

          ${{ runner.temp }}/r12-kernel/BakaSU_v4.2.0-rc3_35252-arm64-v8a-spoofed-release.apk

          ${{ runner.temp }}/r12-kernel/NoMount-v2.2.0-release-bf1847f-605.zip

          '
        if-no-files-found: error
        compression-level: 0
        retention-days: 21
    - name: Preserve build and failure reports
      id: r12_reports_upload
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: VEUX_R13_PRUEFBERICHTE
        path: '${{ runner.temp }}/r12-reports/

          ${{ runner.temp }}/r11-reports/

          ${{ runner.temp }}/veux-r55h17-r4/evidence/

          ${{ runner.temp }}/veux-r55h17-r1-audit/

          ${{ runner.temp }}/veux-r5s2-overlay/ZIP_VALIDATION.json

          ${{ runner.temp }}/veux-real-version-overlay/MANIFEST_SHA256.json

          ${{ runner.temp }}/veux-r5s2-work/prepare.json

          ${{ runner.temp }}/veux-r5s2-work/report/*.json

          ${{ runner.temp }}/veux-r5s2-work/builds/diagnostics/5.4.274/**/*.json

          ${{ runner.temp }}/veux-r5s2-work/builds/diagnostics/5.4.274/**/*.log

          ${{ runner.temp }}/veux-r5s2-work/builds/diagnostics/5.4.274/**/*.config

          ${{ runner.temp }}/veux-r5s2-work/builds/diagnostics/5.4.274/**/Module.symvers

          ${{ runner.temp }}/veux-r5s2-work/builds/diagnostics/5.4.274/**/System.map

          ${{ runner.temp }}/r12-flat-build/*.json

          ${{ runner.temp }}/r12-flat-build/provenance/

          ${{ runner.temp }}/r12-kernel/*.json

          '
        if-no-files-found: warn
        include-hidden-files: true
        compression-level: 6
        retention-days: 21
    - name: 10 Verify full result and publish the download location
      id: r12_complete
      if: ${{ always() }}
      env:
        STATIC_RESULT: ${{ steps.r12_static.conclusion }}
        COMPILE_RESULT: ${{ steps.r12_compile.conclusion }}
        R4_RESULT: ${{ steps.r4_verify.conclusion }}
        BUILTIN_RESULT: ${{ steps.r12_builtin.conclusion }}
        PACKAGE_RESULT: ${{ steps.r12_package.conclusion }}
        DIAGNOSTICS_RESULT: ${{ steps.r12_diagnostics.conclusion }}
        REPO_RESULT: ${{ steps.r12_repo_unchanged.conclusion }}
        KERNEL_UPLOAD_RESULT: ${{ steps.r12_kernel_upload.conclusion }}
        JOB_RESULT_BEFORE_SUMMARY: ${{ job.status }}
      shell: bash
      run: "set -euo pipefail\npython3 -B - <<'PY_R12_COMPLETE'\nimport json, os\nfrom pathlib import Path\nrequired = ['STATIC_RESULT', 'COMPILE_RESULT', 'R4_RESULT', 'BUILTIN_RESULT',\n\
        \            'PACKAGE_RESULT', 'DIAGNOSTICS_RESULT', 'REPO_RESULT', 'KERNEL_UPLOAD_RESULT']\nfailed = [name for name in required if os.environ.get(name) != 'success']\ncomplete\
        \ = not failed and os.environ['JOB_RESULT_BEFORE_SUMMARY'] == 'success'\nstatus = 'KERNEL_ZIP_BUILD_AND_UPLOAD_PASS_DEVICE_UNTESTED' if complete else 'KERNEL_BUILD_OR_PACKAGE_INCOMPLETE'\n\
        lines = ['## VEUX R13', '', '**Ergebnis:** `' + status + '`', '']\nif complete:\n    lines += ['Download: Artefakt **VEUX_R13_KERNEL**.',\n              'Die aeussere GitHub-Artefakt-ZIP\
        \ entpacken. Darin liegt **VEUX_R13_CASS_KERNEL.zip**.',\n              'Diagnose: `VEUX_R13_GERAETEDIAGNOSE_R2.sh`; Pruefsummen: `SHA256SUMS`.',\n              'Vollstaendiger\
        \ Build und Paketpruefung bestanden; ein Geraetetest wurde nicht durchgefuehrt.', '']\nelse:\n    lines += ['Der Kernel wurde nicht als vollstaendig geprueftes Ergebnis bereitgestellt.',\n\
        \              'Fehlgeschlagene Pflichtstufen: ' + ', '.join(failed),\n              'Details stehen in der ersten fehlgeschlagenen Stufe und im Artefakt **VEUX_R13_PRUEFBERICHTE**.',\
        \ '']\nwith Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:\n    summary.write('\\n'.join(lines))\nprint(json.dumps({'status': status, 'failed_required_stages':\
        \ failed,\n                  'device_test': False, 'automatic_flash': False}))\nif not complete:\n    raise SystemExit(1)\nPY_R12_COMPLETE\n"
    - name: R14 publish all research evidence (NEVER FLASH)
      id: r14_upload
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: VEUX_R14_ABI_A_B_NOFLASH
        path: ${{ runner.temp }}/r14-abi-variants/
        if-no-files-found: warn
        retention-days: 21
