    - name: Strict actionlint duplicate YAML keys Actions inputs ShellCheck
      run: |
        set -euo pipefail
        archive='project/VEUX_R39_R2_MEMORY_ABI_MAIN.zip'
        printf '%s  %s\n' '745d80b8502a9beea513a2e7a58bb59272539b7508920d235ce2e79741bda528' "$archive" | sha256sum -c -
        unzip -p "$archive" tools/actionlint > "$R55_STAGE/actionlint"
        chmod 0755 "$R55_STAGE/actionlint"
        "$R55_STAGE/actionlint" -version | grep -Fx '1.7.12'
        "$R55_STAGE/actionlint" -color=false -shellcheck='' 'project/.github/workflows/VEUX_R55F2_SUSFS54_SYS_PRIORITY_SOURCE_ONLY.yml' > "$R55_STAGE/R55F2_ACTIONLINT.log"
        printf 'R55F2_ACTIONLINT=PASS\n' >> "$R55_STAGE/R55F2_ACTIONLINT.log"
        python3 -B - <<'PY_R55F2_YAML_AUDIT'
        import hashlib,pathlib,subprocess,yaml
        class Unique(yaml.SafeLoader):pass
        def no_duplicates(loader,node):
            d={}
            for kn,vn in node.value:
                k=loader.construct_object(kn)
                if k in d:raise ValueError('DUPLICATE_YAML_KEY:'+str(k))
                d[k]=loader.construct_object(vn)
            return d
        Unique.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,no_duplicates)
        w=yaml.load(pathlib.Path('project/.github/workflows/VEUX_R55F2_SUSFS54_SYS_PRIORITY_SOURCE_ONLY.yml').read_text('utf-8'),Loader=Unique)
        assert list(w['on'])==['workflow_dispatch'] and w['permissions']=={'contents':'read'}
        assert set(w['jobs'])=={'r55f2_source'}
        j=w['jobs']['r55f2_source'];s=j['steps']
        assert j['runs-on']=='ubuntu-24.04' and j['timeout-minutes']==35
        expected=chr(36)+chr(123)+chr(123)+" github.repository == 'Chrizz100/veux-nongki-universal-kernel' && github.ref == 'refs/heads/main' "+chr(125)+chr(125)
        assert j['if']==expected and len(s)==9
        for i in (0,1):
            assert s[i]['uses']=='actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683'
            assert s[i]['with']['persist-credentials'] is False
        assert s[1]['with']['repository']=='dereference23/kernel_xiaomi_sm6375'
        assert s[1]['with']['ref']=='b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'
        assert s[8]['uses']=='actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02'
        assert s[8]['with']['path']=='/tmp/veux-r55f2/out/' and s[8]['with']['if-no-files-found']=='error'
        assert s[8]['with']['retention-days']==14
        log=[]
        for step in s:
            if 'run' not in step:continue
            b=step['run']
            if chr(36)+chr(123) in b:raise RuntimeError('GITHUB_EXPRESSION_INSIDE_RUN')
            for tool in (['bash','-n','-'],['shellcheck','--shell=bash','--severity=warning','-']):
                r=subprocess.run(tool,input=b,text=True,capture_output=True)
                if r.returncode:raise RuntimeError('BASH_OR_SHELLCHECK_FAILED:'+step['name']+r.stdout+r.stderr)
            log.append(step['name']+' BASH_SHELLCHECK_PASS SHA256='+hashlib.sha256(b.encode()).hexdigest())
        pathlib.Path('/tmp/veux-r55f2/R55F2_SHELLCHECK.log').write_text('\n'.join(log)+'\n')
        print('R55F2_STRICT_YAML_ACTION_INPUTS_ALL_RUN_SHELLS=PASS')
        PY_R55F2_YAML_AUDIT
    - name: 38 positive negative compiled C and synthetic 20-file Git tests
      run: |
        set -euo pipefail
        python3 -B - <<'PY_R55F2_AST'
        import ast,pathlib
        stage=pathlib.Path('/tmp/veux-r55f2')
        for f in ('scripts/r55f2_priority.py','tests/test_r55f2_priority.py'):
            ast.parse((stage/f).read_text('utf-8'))
        print('R55F2_PYTHON_AST=PASS')
        PY_R55F2_AST
        python3 -B -m unittest discover -v -s "$R55_STAGE/tests" -p 'test_r55f2_priority.py' 2>&1 | tee "$R55_STAGE/R55F2_TESTS.log"
        grep -Eq '^Ran 38 tests in [0-9.]+s$' "$R55_STAGE/R55F2_TESTS.log"
        grep -Fx 'OK' "$R55_STAGE/R55F2_TESTS.log"
        echo 'R55F2_38_POSITIVE_NEGATIVE_C_AND_20_FILE_GIT_TESTS=PASS'
    - name: Replay real R55F1 and port priority UID filter in kernel/sys.c
      run: |
        set -euo pipefail
        python3 -B "$R55_STAGE/scripts/r55f2_priority.py" \
         --source kernel --base "$R55_STAGE/inputs/R55F1_AUTHENTIC_20FILES.patch" \
         --out "$R55_STAGE/out" 2>&1 | tee "$R55_STAGE/R55F2_REAL_SOURCE.log"
        python3 -B - <<'PY_R55F2_POST'
        import pathlib,json,hashlib
        out=pathlib.Path('/tmp/veux-r55f2/out');r=json.loads((out/'R55F2_RESULT.json').read_text('utf-8'))
        assert r['r55f1_input_sha256']=='06e3566ea6cc60c3eb13cb0348b508b635f6f60862a1821e4e1c7babc669eca1'
        assert r['kernel_sys_r55f1_blob']=='0b5911e9f5f6d67449ad0b2d28b8895691152a55'
        assert r['files_total']==20 and r['priority_filter_integrated']
        assert r['setpriority_getpriority_prio_user_only'] and r['newuname_spoof_preserved']
        assert r['kernel_compiled'] is False and r['flash_allowed'] is False
        p=out/'VEUX_R55F2_SUSFS54_20_FILES_SYS_PRIORITY_NOFLASH.patch'
        assert hashlib.sha256(p.read_bytes()).hexdigest()==r['complete_20_file_patch_sha256']
        print('R55F2_PINNED_SOURCE_POSTCHECK=PASS')
        PY_R55F2_POST
    - name: Independent byte-identical clean 20-file Git source replay
      run: |
        set -euo pipefail
        git -C kernel worktree add --detach "$R55_STAGE/replay" b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
        patch="$R55_STAGE/out/VEUX_R55F2_SUSFS54_20_FILES_SYS_PRIORITY_NOFLASH.patch"
        git -C "$R55_STAGE/replay" apply --check --whitespace=error "$patch"
        git -C "$R55_STAGE/replay" apply --whitespace=error "$patch"
        git -C "$R55_STAGE/replay" add -N -- fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h
        git -C "$R55_STAGE/replay" diff --check
        git -C "$R55_STAGE/replay" apply --reverse --check "$patch"
        python3 -B - <<'PY_R55F2_REPLAY'
        import pathlib,subprocess,hashlib,json,sys
        stage=pathlib.Path('/tmp/veux-r55f2');a=pathlib.Path('kernel');b=stage/'replay';out=stage/'out'
        sys.path.insert(0,str(stage/'scripts'));import r55f2_priority as port
        def call(*argv):return subprocess.run(argv,capture_output=True,check=True).stdout
        files=set(call('git','-C',str(b),'diff','--name-only').decode().splitlines())
        assert files==port.EXPECTED,('DIFF_SCOPE',sorted(files^port.EXPECTED))
        for f in sorted(files):
            assert hashlib.sha256((a/f).read_bytes()).digest()==hashlib.sha256((b/f).read_bytes()).digest(),f
        assert call('git','-C',str(b),'diff','--binary','--no-ext-diff')==(out/port.TOTAL_NAME).read_bytes(),'DIFF_BYTE_MISMATCH'
        r=json.loads((out/port.RESULT_NAME).read_text('utf-8'))
        r['source_replay_verified']=True
        (out/port.RESULT_NAME).write_text(json.dumps(r,indent=2,sort_keys=True)+'\n','utf8')
        print('R55F2_REAL_20_FILE_BYTE_IDENTICAL_GIT_REPLAY=PASS')
        PY_R55F2_REPLAY
    - name: Final 20-file scope SHA-256 and NOFLASH gate
      run: |
        set -euo pipefail
        cp "$R55_STAGE/R55F2_ACTIONLINT.log" "$R55_STAGE/R55F2_SHELLCHECK.log" \
         "$R55_STAGE/R55F2_TESTS.log" "$R55_STAGE/R55F2_REAL_SOURCE.log" "$R55_STAGE/out/"
        python3 -B - <<'PY_R55F2_FINAL'
        import pathlib,json,hashlib
        out=pathlib.Path('/tmp/veux-r55f2/out');r=json.loads((out/'R55F2_RESULT.json').read_text('utf8'))
        assert r['source_replay_verified'] is True and r['files_total']==20
        assert r['priority_filter_integrated'] and r['newuname_spoof_preserved']
        for flag in ('kernel_compiled','full_susfs_port','baka_su_uapi6_integrated',
         'nomount_v22_integrated','device_tested','brene_changed','vendor_changed',
         'boot_ready','flash_allowed','user_repo_modified','runtime_semantics_review_complete'):
            assert r[flag] is False,flag
        assert len([p for p in out.iterdir() if p.is_file()])==8
        (out/'SHA256SUMS.txt').write_text(''.join(
         hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n'
         for p in sorted(out.iterdir()) if p.is_file() and p.name!='SHA256SUMS.txt'))
        print('R55F2_FINAL_20_FILE_SCOPE_SHA256_NOFLASH=PASS')
        PY_R55F2_FINAL
        (cd "$R55_STAGE/out" && sha256sum -c SHA256SUMS.txt)
        [ -z "$(git -C project status --porcelain --untracked-files=all)" ]
        echo 'R55F2_USER_REPO_UNMODIFIED; NO_KERNEL_BUILD; NO_FLASH'
    - name: Upload only source patch and audit artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: VEUX-R55F2-SYS-PRIORITY-20FILES-NOFLASH-${{ github.run_id }}
        path: /tmp/veux-r55f2/out/
        retention-days: 14
        if-no-files-found: error
