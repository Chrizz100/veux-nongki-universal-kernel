      - name: Strict no-flash result guards, README and SHA256
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - "$R45_ROOT/out" <<'PY_R45_FINAL'
          import hashlib,json,pathlib,sys
          d=pathlib.Path(sys.argv[1]);r=json.loads((d/'R45_RESULT.json').read_text(encoding='utf-8'))
          expected={'R45_ACTIONLINT.log','R45_INDEPENDENT_SHELLCHECK.log','R45_TESTS.log','R45_RESULT.json',
                    'R45_RMNET_LOADED_HISTORICAL.json','R45_ALL_218_HISTORICAL_VENDOR.csv',
                    'R45_SEVEN_HISTORICAL_FOCUS.csv','R45_RMNET_2EF0_IMPORTS.csv','R45_BERICHT_DE.txt'}
          present={f.name for f in d.iterdir() if f.is_file()}
          if present!=expected:raise SystemExit('R45_ARTIFACT_SET_MISMATCH:'+str(present^expected))
          if (r.get('schema')!='VEUX_R45_TARGETED_VENDOR_ABI_V1' or
              r.get('r44_module_symvers_exactly_equals_pinned_r20') is not True or
              r.get('loaded_2ef0_rmnet_totals')!={'match':61,'crc_mismatch':70,'export_absent':1,'total':132} or
              r.get('historical_vendor_modules')!=218 or r.get('focus_historical_files')!=7):
              raise SystemExit('R45_ABI_EVIDENCE_MISMATCH')
          for key in ('vendor_abi_proven','boot_ready','flash_allowed','r44_newly_built_rmnet_runtime_tested',
                      'r30_actual_loader_path_proven','active_7_vendor_files_proven',
                      'kernel_sources_modified','brene_modified','walt_modified','full_kernel_built_in_r45'):
              if r.get(key) is not False:raise SystemExit('R45_UNSAFE_SUCCESS_FLAG:'+key)
          lines=[]
          for file in sorted(d.iterdir()):
              if file.is_file():
                  if file.suffix in ('.ko','.dtb','.dtbo','.img','.elf') or file.name in ('Image','vmlinux'):
                      raise SystemExit('R45_FLASHABLE_OUTPUT_FORBIDDEN')
                  lines.append(hashlib.sha256(file.read_bytes()).hexdigest()+'  '+file.name)
          (d/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('R45_PINNED_VENDOR_ABI_DIAGNOSIS=PASS; OLD_2EF0_MODULE_ABI=FAIL; BOOT_READY=NO; FLASH_ALLOWED=NO')
          PY_R45_FINAL
          (cd "$R45_ROOT/out" && sha256sum -c SHA256SUMS.txt)
          test -z "$(git status --porcelain)"
          echo 'R45_REPOSITORY_UNCHANGED=YES; NO_KERNEL_BUILT; NO_FLASH'

