        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VEUX-R45-VENDOR-ABI-READONLY-${{ github.run_id }}
          path: /tmp/veux-r45/out/
          if-no-files-found: error
          retention-days: 14
