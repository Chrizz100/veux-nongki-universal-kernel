            | tee "$R45_ROOT/out/R45_TESTS.log"
          grep -F 'Ran 26 tests' "$R45_ROOT/out/R45_TESTS.log"
          grep -Fx 'OK' "$R45_ROOT/out/R45_TESTS.log"
          echo 'R45_26_INDEPENDENT_REGRESSIONS=PASS'

      - name: Classify 218 historical vendors and actual 2EF0 runtime RMNET against R44 export table
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$R45_ROOT/scripts/r45_gate.py" \
            --r39 'VEUX_R39_R2_MEMORY_ABI_MAIN.zip' \
            --r44-diagnostics "$R45_ROOT/inputs/VEUX_R44_R2_FULL_BUILD_DIAGNOSTICS_40168917960.zip" \
            --r44-proof "$R45_ROOT/inputs/VEUX_R44_R2_GPU_WALT_PROOF_40168917960.zip" \
            --r44-run "$R45_ROOT/inputs/R44_RUN.json" \
            --out "$R45_ROOT/out"
