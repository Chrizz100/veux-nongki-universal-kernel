      - name: Checkout exact pinned donor source in isolated temporary folder
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-stock-r2"
          SRC="$ROOT/donor"
          mkdir -p "$SRC"
          git -C "$SRC" init -q
          git -C "$SRC" remote add origin "$DONOR_URL"
          git -C "$SRC" -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=120 \
            fetch --no-tags --filter=blob:none --depth=1 origin "$DONOR_SHA"
          git -C "$SRC" checkout --detach -q FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$DONOR_SHA"
          test -z "$(git -C "$SRC" status --porcelain)"
          git -C "$SRC" rev-parse HEAD > "$ROOT/reports/DONOR_COMMIT.txt"

      - name: Fetch exact AOSP stock compiler tree (no replacement by GCC)
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-stock-r2"
          CLANG_GIT="$ROOT/aosp-clang"
          git init -q "$CLANG_GIT"
          git -C "$CLANG_GIT" remote add origin "$CLANG_URL"
          git -C "$CLANG_GIT" sparse-checkout init --cone
          git -C "$CLANG_GIT" sparse-checkout set clang-r383902b1
          git -C "$CLANG_GIT" -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=180 \
            fetch --no-tags --depth=1 --filter=blob:none origin "refs/heads/$CLANG_BRANCH" \
            2>&1 | tee "$ROOT/reports/AOSP_CLANG_FETCH.log"
          git -C "$CLANG_GIT" checkout --detach -q FETCH_HEAD
          TREE_ACTUAL="$(git -C "$CLANG_GIT" rev-parse HEAD:clang-r383902b1)"
          test "$TREE_ACTUAL" = "$CLANG_TREE"
          CLANG_DIR="$CLANG_GIT/clang-r383902b1/bin"
          test -x "$CLANG_DIR/clang"
          "$CLANG_DIR/clang" --version > "$ROOT/reports/CLANG_VERSION.txt"
          grep -F 'Android (6877366 based on r383902b1) clang version 11.0.2' \
            "$ROOT/reports/CLANG_VERSION.txt"
          printf 'AOSP_CLANG_GIT_TREE=%s\n' "$TREE_ACTUAL" > "$ROOT/reports/AOSP_TOOLCHAIN_PROVENANCE.txt"
          echo 'AOSP_STOCK_CLANG=PINNED_AND_VERIFIED'

      - name: Resolve original stock configuration using exact Android Clang 11
        shell: bash
        run: |
          set -euo pipefail
