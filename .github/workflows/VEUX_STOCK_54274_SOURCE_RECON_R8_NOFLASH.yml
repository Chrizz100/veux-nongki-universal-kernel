            2>&1 | tee "$ROOT/reports/R8_PAIR_SOURCE_FETCH.log"
          git -C "$PAIR" checkout --detach -q FETCH_HEAD
          test "$(git -C "$PAIR" rev-parse HEAD)" = "$PAIR_SHA"
          test -z "$(git -C "$PAIR" status --porcelain)"
          test "$(git -C "$PAIR" rev-parse HEAD:drivers/iommu/msm_dma_iommu_mapping.c)" = a23aa9a48c40ceb98ac30c798cbd5ef0a86317d6
          git -C "$PAIR" rev-parse HEAD > "$ROOT/reports/R8_PAIRED_SOURCE_COMMIT.txt"

