# VEUX Stock 5.4.274 R8: paired stock IOMMU/ION ABI experiment against frozen R6; NOFLASH
# Reuses the immutable, previously proven R1 source reference.
name: VEUX STOCK 5.4.274 paired OEM IOMMU ION ABI R8 - NOFLASH
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stock-54274-recon-r8-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stock_source_abi_r8:
    if: ${{ github.repository == 'Chrizz100/veux-nongki-universal-kernel' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      R1_ARCHIVE: VEUX_STOCK_54274_SOURCE_RECON_R1_MAIN.zip
      R1_SHA256: 04a8bc015abd2a8b9c5adf17b63f97f75e9cd06fb038480d695ff0263e758789
      R2_ARCHIVE: VEUX_STOCK_54274_SOURCE_RECON_R2_MAIN.zip
      R2_SHA256: fdf72f74fc9f2ca219d80d726387c7e9c2ba917c74761331d4906ae9ee022f68
      R4_ARCHIVE: VEUX_STOCK_54274_SOURCE_RECON_R4_MAIN.zip
      R4_SHA256: fe29d83963f3ee3bca1f9de6229fd2e35ff22961180144a977efca0bf9bd54b6
      R5_ARCHIVE: VEUX_STOCK_54274_SOURCE_RECON_R5_MAIN.zip
      R6_ARCHIVE: VEUX_STOCK_54274_SOURCE_RECON_R6_MAIN.zip
      R6_SHA256: 7227d090ef73b8a26e57349bba0ed7aee256796f16a08022bfcbe43b7378d108
      R5_SHA256: 5488dde35b7848aaa3c65213d6a558ca79b6432b223bf82f07d1dd035a682ebc
      R5_HEADER_SHA256: bc73b24be7b7ffad9807d23f7eae5b16771c08aa37082493cd41f2b191ccd1d8
      R7_ARCHIVE: VEUX_STOCK_54274_SOURCE_RECON_R7_MAIN.zip
      R7_SHA256: f8b38319a89ad56be013aa3497b4deaccb6823499e3beb37dec30403a27d6bea
      R8_ARCHIVE: VEUX_STOCK_54274_SOURCE_RECON_R8_MAIN.zip
      R8_SHA256: a5fe6ca67213ba663cea846c4650a224426c1d2cb94c29cff01f9ba57319c9fa
      PAIR_SHA: 01cb3a8824b7b4caf3e3540274e71abba5ade538
      PAIR_URL: https://github.com/shandongtlb/kernel_xiaomi_sm8350_M11.git
      DONOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      DONOR_URL: https://github.com/dereference23/kernel_xiaomi_sm6375.git
      CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
      CLANG_BRANCH: android11-qpr2-release
      CLANG_TREE: 1c7dcc2e7095197f7a05dff22a875b6b02ed7117
    steps:
      - name: Checkout exact main revision read only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: actionlint syntax and GitHub workflow semantics - pinned tool
        shell: bash
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/veux-stock-r2-tools"
          mkdir -p "$GOBIN"
          GOTOOLCHAIN=local go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$GOBIN/actionlint" ".github/workflows/VEUX_STOCK_54274_SOURCE_RECON_R7_NOFLASH.yml"
          echo 'R7_WORKFLOW_ACTIONLINT=PASS'

      - name: Authenticate both MAIN ZIPs and safely extract exact paths
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-stock-r2"
          mkdir -p "$ROOT/reports"
          printf '%s  %s\n' "$R1_SHA256" "$GITHUB_WORKSPACE/$R1_ARCHIVE" | sha256sum --check --strict
          printf '%s  %s\n' "$R2_SHA256" "$GITHUB_WORKSPACE/$R2_ARCHIVE" | sha256sum --check --strict
          python3 -I - "$GITHUB_WORKSPACE/$R2_ARCHIVE" "$GITHUB_WORKSPACE/$R1_ARCHIVE" "$ROOT" <<'PY_AUTH'
          import hashlib,json,stat,sys
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          r2,r1,root=map(Path,sys.argv[1:]); sha=lambda x:hashlib.sha256(x).hexdigest()
          for path,folder,size_limit in ((r1,root/'r1',12_000_000),(r2,root/'r2',2_000_000)):
              if path.is_symlink() or not path.is_file():raise RuntimeError('MAIN_ZIP_NOT_REGULAR')
              with ZipFile(path) as z:
                  infos=z.infolist();names=[i.filename for i in infos]
                  if not names or len(names)!=len(set(names)) or z.testzip() is not None:
                      raise RuntimeError('MAIN_DUPLICATE_OR_CORRUPT')
                  if sum(i.file_size for i in infos)>size_limit:raise RuntimeError('MAIN_SIZE_LIMIT')
                  manifest=json.loads(z.read('MANIFEST_SHA256.json'))
                  schema=('VEUX_STOCK_54274_REFERENCE_MAIN_R1' if folder.name=='r1'
                          else 'VEUX_STOCK_54274_SOURCE_RECON_MAIN_R2')
                  if manifest['schema']!=schema or manifest['flash_allowed'] is not False:
                      raise RuntimeError('MANIFEST_SCHEMA_OR_FLASH_DRIFT')
                  if manifest['donor_commit']!='b2b7a3bbc36d120ee523ebc8d68e0f13a97df632':
                      raise RuntimeError('DONOR_COMMIT_DRIFT')
                  if set(names)!=(set(manifest['files'])|{'MANIFEST_SHA256.json'}):
                      raise RuntimeError('MAIN_PATH_DRIFT')
                  folder.mkdir(parents=True,exist_ok=False)
                  for i in infos:
                      rel=PurePosixPath(i.filename)
                      if rel.is_absolute() or '..' in rel.parts or str(rel)!=i.filename or '\\' in i.filename:
                          raise RuntimeError('UNSAFE_PATH')
                      if i.is_dir() or stat.S_IFMT(i.external_attr>>16) not in (0,stat.S_IFREG):
                          raise RuntimeError('UNSAFE_FILE_TYPE')
                      raw=z.read(i.filename)
                      if i.filename!='MANIFEST_SHA256.json' and sha(raw)!=manifest['files'][i.filename]:
                          raise RuntimeError('BAD_INNER_SHA:'+i.filename)
                      target=folder.joinpath(*rel.parts)
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(raw)
                  (root/'reports'/('R1_MAIN_VERIFIED.txt' if folder.name=='r1' else 'R2_MAIN_VERIFIED.txt')).write_text('PINNED_ARCHIVE_AND_CONTENT_HASH_PASS\n')
          print('R1_AND_R2_MAIN_HASH_PATH_GUARD=PASS')
          PY_AUTH

      - name: Authenticate R4 MAIN source-probe helper, refuse unsafe archive paths
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-stock-r2"
          printf '%s  %s\n' "$R4_SHA256" "$GITHUB_WORKSPACE/$R4_ARCHIVE" | sha256sum --check --strict
          python3 -I - "$GITHUB_WORKSPACE/$R4_ARCHIVE" "$ROOT/r4" <<'PY_R4_AUTH'
          import hashlib,json,stat,sys
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          archive,dst=map(Path,sys.argv[1:])
          sha=lambda b:hashlib.sha256(b).hexdigest()
          if archive.is_symlink() or not archive.is_file() or dst.exists():
              raise RuntimeError('R4_ARCHIVE_UNSAFE_OR_STAGE_EXISTS')
          with ZipFile(archive) as z:
              infos=z.infolist();names=[x.filename for x in infos]
              if not infos or len(infos)!=len(set(names)) or z.testzip() is not None:
                  raise RuntimeError('R4_BAD_ZIP')
              if sum(x.file_size for x in infos)>1_000_000:
                  raise RuntimeError('R4_UNEXPECTED_UNPACKED_SIZE')
              m=json.loads(z.read('MANIFEST_SHA256.json'))
              if m['schema']!='VEUX_STOCK_54274_SOURCE_PROBE_MAIN_R4':
                  raise RuntimeError('R4_WRONG_SCHEMA')
              if m['donor_commit']!='b2b7a3bbc36d120ee523ebc8d68e0f13a97df632':
                  raise RuntimeError('R4_DONOR_PIN_DRIFT')
              if m['required_r1_zip_sha256']!='04a8bc015abd2a8b9c5adf17b63f97f75e9cd06fb038480d695ff0263e758789' or m['required_r2_zip_sha256']!='fdf72f74fc9f2ca219d80d726387c7e9c2ba917c74761331d4906ae9ee022f68':
                  raise RuntimeError('R4_REQUIRED_MAIN_DRIFT')
              if m['flash_allowed'] is not False or m['oem_abi_verified'] is not False or m['production_source_patch_approved'] is not False:
                  raise RuntimeError('R4_NOFLASH_GUARD_VIOLATION')
              if set(names)!=set(m['files'])|{'MANIFEST_SHA256.json'}:
                  raise RuntimeError('R4_ZIP_FILESET_DRIFT')
              dst.mkdir(parents=True,exist_ok=False)
              for i in infos:
                  rel=PurePosixPath(i.filename)
                  if rel.is_absolute() or '..' in rel.parts or str(rel)!=i.filename or '\\' in i.filename:
                      raise RuntimeError('R4_UNSAFE_PATH')
                  if i.is_dir() or stat.S_IFMT(i.external_attr>>16) not in (0,stat.S_IFREG):
                      raise RuntimeError('R4_UNSAFE_TYPE')
                  raw=z.read(i.filename)
                  if i.filename!='MANIFEST_SHA256.json' and sha(raw)!=m['files'][i.filename]:
                      raise RuntimeError('R4_INTERNAL_SHA_DRIFT:'+i.filename)
                  target=dst.joinpath(*rel.parts);target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(raw)
          print('R4_MAIN_AUTHENTICATION=PASS')
          PY_R4_AUTH


      - name: Authenticate R5 additional source header tool and test suite
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-stock-r2"
          printf '%s  %s\n' "$R5_SHA256" "$GITHUB_WORKSPACE/$R5_ARCHIVE" | sha256sum --check --strict
          python3 -I - "$GITHUB_WORKSPACE/$R5_ARCHIVE" "$ROOT/r5" <<'PY_R5_AUTH'
          import hashlib,json,stat,sys
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          archive,dst=map(Path,sys.argv[1:]);sha=lambda b:hashlib.sha256(b).hexdigest()
          if archive.is_symlink() or not archive.is_file() or dst.exists():
              raise RuntimeError('R5_ZIP_UNSAFE')
          with ZipFile(archive) as z:
              infos=z.infolist();names=[i.filename for i in infos]
              if not infos or len(infos)!=len(set(names)) or z.testzip() is not None:
                  raise RuntimeError('R5_BAD_ZIP')
              if sum(i.file_size for i in infos)>1_000_000:
                  raise RuntimeError('R5_UNPACKED_SIZE_LIMIT')
              m=json.loads(z.read('MANIFEST_SHA256.json'))
              if m['schema']!='VEUX_STOCK_54274_SOURCE_PROBE_MAIN_R5' or m['donor_commit']!= 'b2b7a3bbc36d120ee523ebc8d68e0f13a97df632':
                  raise RuntimeError('R5_SCHEMA_OR_DONOR_DRIFT')
              if (m['required_r1_zip_sha256']!='04a8bc015abd2a8b9c5adf17b63f97f75e9cd06fb038480d695ff0263e758789' or
                  m['required_r2_zip_sha256']!='fdf72f74fc9f2ca219d80d726387c7e9c2ba917c74761331d4906ae9ee022f68' or
                  m['required_r4_zip_sha256']!='fe29d83963f3ee3bca1f9de6229fd2e35ff22961180144a977efca0bf9bd54b6'):
                  raise RuntimeError('R5_PARENT_PIN_DRIFT')
              if m['stock_header_sha256']!='bc73b24be7b7ffad9807d23f7eae5b16771c08aa37082493cd41f2b191ccd1d8' or m['stock_kheaders_tar_sha256']!='39be17eec6033eb154baaf71a77ce17db0d998043301b9e3dd5cf060b2cad279':
                  raise RuntimeError('R5_STOCK_ORIGIN_DRIFT')
              if (m['flash_allowed'] is not False or m['oem_abi_verified'] is not False or
                  m['original_stock_source_recovered'] is not False):
                  raise RuntimeError('R5_NOFLASH_GATE_DRIFT')
              if set(names)!=(set(m['files'])|{'MANIFEST_SHA256.json'}):
                  raise RuntimeError('R5_FILESET_DRIFT')
              dst.mkdir(parents=True,exist_ok=False)
              for i in infos:
                  rel=PurePosixPath(i.filename)
                  if rel.is_absolute() or '..' in rel.parts or str(rel)!=i.filename or '\\' in i.filename:
                      raise RuntimeError('R5_UNSAFE_PATH')
                  if i.is_dir() or stat.S_IFMT(i.external_attr>>16) not in (0,stat.S_IFREG):
                      raise RuntimeError('R5_UNSAFE_FILETYPE')
                  raw=z.read(i.filename)
                  if i.filename!='MANIFEST_SHA256.json' and sha(raw)!=m['files'][i.filename]:
                      raise RuntimeError('R5_SHA_MISMATCH:'+i.filename)
                  path=dst.joinpath(*rel.parts)
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(raw)
          print('R5_AUTHENTICATION=PASS')
          PY_R5_AUTH

      - name: Authenticate R6 actual vendor-import historical ABI evidence - NOFLASH
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-stock-r2"
          printf '%s  %s\n' "$R6_SHA256" "$GITHUB_WORKSPACE/$R6_ARCHIVE" | sha256sum --check --strict
          python3 -I - "$GITHUB_WORKSPACE/$R6_ARCHIVE" "$ROOT/r6" <<'PY_R6_AUTH'
          import hashlib,json,stat,sys
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          source,dest=map(Path,sys.argv[1:]); h=lambda b:hashlib.sha256(b).hexdigest()
          if source.is_symlink() or not source.is_file() or dest.exists():raise RuntimeError('R6_ARCHIVE_INVALID')
          with ZipFile(source) as z:
              infos=z.infolist();names=[x.filename for x in infos]
              if not infos or len(names)!=len(set(names)) or z.testzip() is not None:raise RuntimeError('R6_ZIP_CORRUPT')
              if sum(x.file_size for x in infos)>3_000_000:raise RuntimeError('R6_UNEXPECTED_UNPACK_SIZE')
              m=json.loads(z.read('MANIFEST_SHA256.json'))
              if m['schema']!='VEUX_STOCK_54274_QGKI_ABI_DIAGNOSTIC_MAIN_R6':raise RuntimeError('R6_SCHEMA_MISMATCH')
              req={'r1_sha256':'04a8bc015abd2a8b9c5adf17b63f97f75e9cd06fb038480d695ff0263e758789',
                   'r2_sha256':'fdf72f74fc9f2ca219d80d726387c7e9c2ba917c74761331d4906ae9ee022f68',
                   'r4_sha256':'fe29d83963f3ee3bca1f9de6229fd2e35ff22961180144a977efca0bf9bd54b6',
                   'r5_sha256':'5488dde35b7848aaa3c65213d6a558ca79b6432b223bf82f07d1dd035a682ebc',
                   'donor_commit':'b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'}
              if m['required']!=req:raise RuntimeError('R6_PARENT_SHA_MISMATCH')
              if m['flash_allowed'] is not False or m['original_stock_source_recovered'] is not False or m['oem_abi_verified'] is not False or m['active_vendor_module_cohort_verified'] is not False:raise RuntimeError('R6_NOFLASH_DRIFT')
              if m['source_archives']['R28_OEM_R21_IMPORTS_sha256']!='bc772c1bdf961a25c0da60aae0352383ef93f9b6106960c2234aef7317fff394':raise RuntimeError('R6_R28_SOURCE_DRIFT')
              if set(names)!=set(m['files'])|{'MANIFEST_SHA256.json'}:raise RuntimeError('R6_FILES_DRIFT')
              dest.mkdir(parents=True,exist_ok=False)
              for item in infos:
                  name=item.filename; p=PurePosixPath(name)
                  if not name or name.startswith('/') or '..' in p.parts or name!=str(p) or '\\' in name or p.is_absolute():raise RuntimeError('R6_PATH_UNSAFE')
                  if item.is_dir() or stat.S_IFMT(item.external_attr>>16) not in (0,stat.S_IFREG):raise RuntimeError('R6_TYPE_UNSAFE')
                  blob=z.read(name)
                  if name!='MANIFEST_SHA256.json' and h(blob)!=m['files'][name]:raise RuntimeError('R6_CONTENT_SHA_DRIFT:'+name)
                  to=dest.joinpath(*p.parts); to.parent.mkdir(parents=True,exist_ok=True);to.write_bytes(blob)
          print('R6_MANIFEST_PROVENANCE_AND_SHAS=PASS; FLASH=NO')
          PY_R6_AUTH

      - name: R7 authenticate immutable baseline reports and stock-header experiment helper
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-stock-r2"
          printf '%s  %s\n' "$R7_SHA256" "$GITHUB_WORKSPACE/$R7_ARCHIVE" | sha256sum --check --strict
          python3 -I - "$GITHUB_WORKSPACE/$R7_ARCHIVE" "$ROOT/r7" <<'PY_R7_AUTH'
          import hashlib,json,stat,sys
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          archive,dst=map(Path,sys.argv[1:])
          sha=lambda b:hashlib.sha256(b).hexdigest()
          if archive.is_symlink() or not archive.is_file() or dst.exists():
              raise RuntimeError('R7_ZIP_UNSAFE_OR_ALREADY_EXTRACTED')
          with ZipFile(archive) as z:
              infos=z.infolist();names=[i.filename for i in infos]
              if not infos or len(infos)!=len(set(names)) or z.testzip() is not None:
                  raise RuntimeError('R7_BAD_ZIP')
              if sum(i.file_size for i in infos)>2_000_000:
                  raise RuntimeError('R7_ARCHIVE_SIZE_EXCEEDED')
              m=json.loads(z.read('MANIFEST_SHA256.json'))
              if m['schema']!='VEUX_STOCK_54274_SOURCE_REFERENCE_ABI_EXPERIMENT_MAIN_R7':
                  raise RuntimeError('R7_SCHEMA_DRIFT')
              frozen={'R1':'04a8bc015abd2a8b9c5adf17b63f97f75e9cd06fb038480d695ff0263e758789',
                      'R2':'fdf72f74fc9f2ca219d80d726387c7e9c2ba917c74761331d4906ae9ee022f68',
                      'R4':'fe29d83963f3ee3bca1f9de6229fd2e35ff22961180144a977efca0bf9bd54b6',
                      'R5':'5488dde35b7848aaa3c65213d6a558ca79b6432b223bf82f07d1dd035a682ebc',
                      'R6':'7227d090ef73b8a26e57349bba0ed7aee256796f16a08022bfcbe43b7378d108'}
              if m['required_main_zip_sha256']!=frozen:
                  raise RuntimeError('R7_REQUIRED_PARENT_MAIN_DRIFT')
              if m['known_r6_artifact']!={'run_id':42031451479,'id':13418820891,
                  'artifact_sha256':'19229f36a2a953762829d705442c0b91a7a296d1f4f504acf279bf255ead0d76'}:
                  raise RuntimeError('R7_BASELINE_PROVENANCE_DRIFT')
              if (m['donor_commit']!='b2b7a3bbc36d120ee523ebc8d68e0f13a97df632' or
                  m['stock_header_sha256']!='dc28c43819628f359cc3776b53a4b0a09e4cc99e321d08d25b23ab81df6eb027' or
                  m['original_donor_device_header_git_blob']!='3937c1c06f9c152e6272743d1536303b9eea09df' or
                  m['stock_kheaders_sha256']!='39be17eec6033eb154baaf71a77ce17db0d998043301b9e3dd5cf060b2cad279' or
                  m['baseline_symvers_sha256']!='d0cce8b3920dd22ab6eafc6c68e6bfb6dd1e4635835e2d6c4a5ad798bf0761e3' or
                  m['baseline_olddefconfig_sha256']!='ea56096f52843e8f66368946ccaad3c420c0eeee705edfd84990f1de3466c799'):
                  raise RuntimeError('R7_PIN_DRIFT')
              if (m['production_patch_approved'] is not False or m['oem_abi_verified'] is not False or
                  m['boot_tested'] is not False or m['flash_allowed'] is not False):
                  raise RuntimeError('R7_NOFLASH_PROVENANCE_GUARD_DRIFT')
              if set(names)!=(set(m['files'])|{'MANIFEST_SHA256.json'}):
                  raise RuntimeError('R7_UNEXPECTED_FILESET')
              dst.mkdir(parents=True,exist_ok=False)
              for i in infos:
                  rel=PurePosixPath(i.filename)
                  if rel.is_absolute() or '..' in rel.parts or str(rel)!=i.filename or '\\' in i.filename:
                      raise RuntimeError('R7_ZIP_PATH_UNSAFE')
                  if i.is_dir() or stat.S_IFMT(i.external_attr>>16) not in (0,stat.S_IFREG):
                      raise RuntimeError('R7_ZIP_SPECIAL_FILE')
                  data=z.read(i.filename)
                  if i.filename!='MANIFEST_SHA256.json' and sha(data)!=m['files'][i.filename]:
                      raise RuntimeError('R7_INNER_SHA_DRIFT:'+i.filename)
                  target=dst.joinpath(*rel.parts);target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
          print('R7_MAIN_R6_BASELINE_FROZEN=PASS; FLASH=NO')
          PY_R7_AUTH

      - name: R8 authenticate source-pair MAIN and immutable provenance - NOFLASH
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-stock-r2"
          printf '%s  %s\n' "$R8_SHA256" "$GITHUB_WORKSPACE/$R8_ARCHIVE" | sha256sum --check --strict
          python3 -I - "$GITHUB_WORKSPACE/$R8_ARCHIVE" "$ROOT/r8" <<'PY_R8_AUTH'
          import json,hashlib,stat,sys
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          zip_path,dst=map(Path,sys.argv[1:])
          h=lambda b:hashlib.sha256(b).hexdigest()
          if zip_path.is_symlink() or not zip_path.is_file() or dst.exists():raise RuntimeError('R8_MAIN_PATH_ERROR')
          with ZipFile(zip_path) as z:
              infos=z.infolist();names=[i.filename for i in infos]
              if not infos or len(set(names))!=len(names) or z.testzip() is not None:raise RuntimeError('R8_ZIP_BROKEN')
              if sum(i.file_size for i in infos)>500_000:raise RuntimeError('R8_ZIP_OVERSIZE')
              m=json.loads(z.read('MANIFEST_SHA256.json'))
              if m['schema']!='VEUX_STOCK_54274_PAIRED_IOMMU_ION_DIAGNOSTIC_MAIN_R8':raise RuntimeError('R8_BAD_SCHEMA')
              if m['donor_commit']!='b2b7a3bbc36d120ee523ebc8d68e0f13a97df632' or m['source_pair_commit']!='01cb3a8824b7b4caf3e3540274e71abba5ade538':raise RuntimeError('R8_SOURCE_DRIFT')
              if m['parent_r7_main_sha256']!='f8b38319a89ad56be013aa3497b4deaccb6823499e3beb37dec30403a27d6bea':raise RuntimeError('R8_PARENT_DRIFT')
              if m['stock_headers_tar_sha256']!='39be17eec6033eb154baaf71a77ce17db0d998043301b9e3dd5cf060b2cad279':raise RuntimeError('R8_STOCK_PROVENANCE_DRIFT')
              if (m['original_stock_source_recovered'] is not False or m['production_patch_approved'] is not False or m['oem_abi_verified'] is not False or m['flash_allowed'] is not False):raise RuntimeError('R8_NOFLASH_INVALID')
              if set(names)!=(set(m['files'])|{'MANIFEST_SHA256.json'}):raise RuntimeError('R8_CONTENTS_MISMATCH')
              dst.mkdir(parents=True,exist_ok=False)
              for i in infos:
                  name=i.filename;rel=PurePosixPath(name)
                  if rel.is_absolute() or '..' in rel.parts or name!=str(rel) or '\\' in name or i.is_dir() or stat.S_IFMT(i.external_attr>>16) not in (0,stat.S_IFREG):raise RuntimeError('R8_ZIP_UNSAFE:'+name)
                  data=z.read(name)
                  if name!='MANIFEST_SHA256.json' and h(data)!=m['files'][name]:raise RuntimeError('R8_INNER_HASH_DRIFT:'+name)
                  path=dst.joinpath(*rel.parts);path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          print('R8_ARCHIVE_MANIFEST_SAFE=PASS; NOFLASH')
          PY_R8_AUTH

      - name: R8 paired source and failure-safety regression tests
