          printf '%s  %s\n' 'dc28c43819628f359cc3776b53a4b0a09e4cc99e321d08d25b23ab81df6eb027' "$ROOT/r4-donor/include/linux/device.h" | sha256sum --check --strict
          printf '%s  %s\n' '4488aee19289dba76ab23cfd46c64aa8c8ddec37c12048faec27ff460f42534f' "$ROOT/r4-donor/include/linux/ion.h" | sha256sum --check --strict
          printf '%s  %s\n' '9394f06ede665497ab41652e354683e384ee78bc1c39f2ff2659ea39f6638a54' "$ROOT/r4-donor/include/linux/msm_dma_iommu_mapping.h" | sha256sum --check --strict
          echo 'R8_COHERENT_HEADER_PAIR_STAGED=PASS; FLASH=NO'

      - name: R8 compile paired source and measure actual QGKI/GKI ABI delta - NOFLASH
        shell: bash
        timeout-minutes: 48
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-stock-r2"
          export PATH="$ROOT/aosp-clang/clang-r383902b1/bin:$PATH"
          STAGE="$ROOT/r4-donor"
          OUT="$ROOT/r8-build"
          mkdir -p "$OUT"
          cp "$ROOT/r1/reference/stock.config" "$OUT/.config"
          make -C "$STAGE" O="$OUT" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 olddefconfig \
            > "$ROOT/reports/R8_OLDDEFCONFIG.log" 2>&1
          cmp "$ROOT/r7/reference/R6_Donor_olddefconfig.config" "$OUT/.config"
          set +e
          timeout 2400s make -C "$STAGE" O="$OUT" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            -j2 Image dtbs > "$ROOT/reports/R8_PAIRED_IOMMU_ION_BUILD.log" 2>&1
          RC=$?
          set -e
          printf '%s\n' "$RC" > "$ROOT/reports/R8_COMPILER_RETURN_CODE.txt"
          if [[ "$RC" == 0 ]]; then
            test -s "$OUT/Module.symvers"
            test -s "$OUT/arch/arm64/boot/Image"
            cp "$OUT/Module.symvers" "$ROOT/reports/R8_COMPILED_Module.symvers"
            sha256sum "$OUT/Module.symvers" "$OUT/arch/arm64/boot/Image" > "$ROOT/reports/R8_BUILD_HASHES.txt"
          fi
          python3 -B "$ROOT/r8/tools/r8_iommu_pair.py" summary \
            --baseline-report "$ROOT/r7/reference/R6_CANDIDATE_ABI_REPORT.json" \
            --baseline-symvers "$ROOT/r7/reference/R6_COMPILED_CANDIDATE_Module.symvers" \
            --r6-tool "$ROOT/r6/tools/r6_abi.py" \
            --imports "$ROOT/r6/reference/OEM_R21_IMPORTS.csv" \
            --candidate-symvers "$OUT/Module.symvers" \
            --image "$OUT/arch/arm64/boot/Image" \
            --return-code "$ROOT/reports/R8_COMPILER_RETURN_CODE.txt" \
            --build-log "$ROOT/reports/R8_PAIRED_IOMMU_ION_BUILD.log" \
            --reports "$ROOT/reports"
          tail -n 115 "$ROOT/reports/R8_PAIRED_IOMMU_ION_BUILD.log"
          test -z "$(git -C "$ROOT/donor" status --porcelain)"
          echo "R8_COMPILER_RETURN_CODE=$RC; QGKI_DELTA_IN_REPORT; FLASH=NO"

      - name: Always publish R8 ABI text and Module.symvers ONLY - NOFLASH
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VEUX-STOCK-54274-R8-COHERENT-IOMMU-ION-ABI-NOFLASH-${{ github.run_id }}
          path: ${{ runner.temp }}/veux-stock-r2/reports/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
