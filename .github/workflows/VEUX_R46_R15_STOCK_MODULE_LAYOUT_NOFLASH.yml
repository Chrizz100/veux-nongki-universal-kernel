        CONFIG_SHA = '7fa8abbe8e6496ec1613df60fa33da01f1614121a642a780ff909cd438ca6ffe'
        GATES_FALSE = ('kernel_built', 'vendor_abi_proven', 'runtime_driver_probe_proven',
                       'bootloader_dtbo0_choice_proven', 'boot_ready', 'flash_allowed',
                       'brene_modified', 'walt_modified', 'project_repository_modified')


        def require(ok: bool, message: str) -> None:
            if not ok:
                raise ValueError(message)


        def sha(data: bytes) -> str:
            return hashlib.sha256(data).hexdigest()


        def git_blob(data: bytes) -> str:
            return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()


        def cells(data: bytes) -> tuple[int, ...]:
            require(len(data) % 4 == 0, 'UNALIGNED_CELLS')
            return struct.unpack('>' + 'I' * (len(data) // 4), data)


        def scalar(data: bytes) -> int:
            require(len(data) == 4, 'EXPECTED_ONE_CELL')
            return cells(data)[0]


        def string(data: bytes) -> str:
            require(bool(data) and data.endswith(b'\0') and data.count(b'\0') == 1, 'INVALID_STRING')
            return data[:-1].decode('ascii')


        def enabled(tree: dict, path: str) -> bool:
            require(path in tree, 'NODE_MISSING:' + path)
            while True:
                require(path in tree, 'ANCESTOR_MISSING:' + path)
                if tree[path].get('status', b'okay\0') not in (b'okay\0', b'ok\0'):
                    return False
                if path == '/':
                    return True
                path = path.rsplit('/', 1)[0] or '/'


        def handles(tree: dict) -> dict[int, str]:
            index = {}
            for path, props in tree.items():
                a, b = props.get('phandle'), props.get('linux,phandle')
                if a is None and b is None:
                    continue
                require(a is None or b is None or a == b, 'CONFLICTING_PHANDLE:' + path)
                ident = scalar(a if a is not None else b)
                require(ident not in (0, 0xffffffff), 'INVALID_PHANDLE:' + path)
                require(ident not in index, 'DUPLICATE_PHANDLE')
                index[ident] = path
            return index


        def target(tree: dict, data: bytes) -> str:
            ident = scalar(data)
            index = handles(tree)
            require(ident in index, 'DANGLING_PHANDLE')
            return index[ident]


        def supplier_signature(tree: dict, path: str) -> dict:
            require(path == SUPPLY, 'STOCK_SUPPLY_NOT_S8_LEVEL_AO:' + path)
            p = tree[path]
            require(enabled(tree, path), 'SUPPLIER_DISABLED')
            require(p.get('compatible') == b'qcom,rpm-smd-regulator\0', 'SUPPLIER_COMPATIBLE')
            require(p.get('regulator-name') == b'pm6125_s8_level_ao\0', 'SUPPLIER_NAME')
            require(p.get('qcom,set') == struct.pack('>I', 1), 'SUPPLIER_SET')
            require('qcom,use-voltage-level' in p and p['qcom,use-voltage-level'] == b'', 'SUPPLIER_NOT_LEVEL_MODE')
            require('qcom,use-voltage-floor-level' not in p, 'SUPPLIER_UNEXPECTED_FLOOR_MODE')
            parent = tree[PARENT]
            require(parent.get('qcom,resource-name') == b'rwgx\0', 'WRONG_GPU_RAIL')
            require(parent.get('qcom,resource-id') == b'\0\0\0\0', 'WRONG_GPU_RAIL_ID')
            return {'path': path, 'regulator_name': string(p['regulator-name']),
                    'resource_name': string(parent['qcom,resource-name']),
                    'resource_id': scalar(parent['qcom,resource-id']),
                    'qcom_set': scalar(p['qcom,set']), 'voltage_level_mode': True,
                    'minimum_level': scalar(p['regulator-min-microvolt']),
                    'maximum_level': scalar(p['regulator-max-microvolt'])}


        def resolve_stock_supply(stock: dict, r20: dict) -> dict:
            require(STOCK_GFX in stock and enabled(stock, STOCK_GFX), 'STOCK_GFX_NOT_ACTIVE')
            props = stock[STOCK_GFX]
            require(props.get('compatible') == b'qcom,regulator-cooling-device\0', 'STOCK_GFX_COMPATIBLE')
            require(props.get('regulator-levels') == struct.pack('>II', 0, 192), 'STOCK_LEVELS_DRIFT')
            supply_id = scalar(props['regulator-cdev-supply'])
            supply_path = target(stock, props['regulator-cdev-supply'])
            stock_sig = supplier_signature(stock, supply_path)
            r20_sig = supplier_signature(r20, SUPPLY)
            require(stock_sig == r20_sig, 'SUPPLIER_SEMANTIC_DIFFERENCE')
            symbols = r20.get('/__symbols__', {})
            require(symbols.get('S8A_LEVEL_AO') == (SUPPLY + '\0').encode(), 'R20_SYMBOL_S8A_LEVEL_AO_MISMATCH')
            return {'stock_supply_phandle': supply_id, 'stock_supply_path': supply_path,
                    'stock_supplier': stock_sig, 'r20_supplier': r20_sig,
                    'r20_symbol': 'S8A_LEVEL_AO', 'r20_supply_phandle': fdt.phandle(r20[SUPPLY]),
                    'same_number_in_r20_resolves_to': handles(r20).get(supply_id),
                    'candidate_supply_condition_verified': True}


        def cooling_signature(tree: dict, provider: str) -> list[dict]:
            index = handles(tree)
            require(provider in tree and enabled(tree, provider), 'COOLING_PROVIDER_MISSING_OR_DISABLED')
            require(tree[provider].get('#cooling-cells') == struct.pack('>I', 2), 'COOLING_ARITY')
            result = []
            for path, props in sorted(tree.items()):
                if '/thermal-zones/' not in path or '/cooling-maps/' not in path or 'cooling-device' not in props:
                    continue
                c = cells(props['cooling-device'])
                offset = 0
                while offset < len(c):
                    require(c[offset] in index, 'COOLING_DANGLING_PROVIDER')
                    ref = index[c[offset]]
                    arity = scalar(tree[ref]['#cooling-cells'])
                    require(arity == 2 and offset + arity + 1 <= len(c), 'COOLING_BAD_ARGUMENTS')
                    if ref == provider:
                        zone = path.split('/cooling-maps/', 1)[0]
                        require(enabled(tree, zone) and enabled(tree, path), 'COOLING_ZONE_OR_MAP_DISABLED')
                        trip_path = target(tree, props['trip'])
                        require(trip_path.startswith(zone + '/trips/'), 'TRIP_WRONG_ZONE')
                        trip = {k: v.hex() for k, v in sorted(tree[trip_path].items())
                                if k not in ('phandle', 'linux,phandle')}
                        result.append({'zone': zone, 'map_name': path.rsplit('/', 1)[1],
                                       'provider_path': provider, 'min_state': c[offset+1],
                                       'max_state': c[offset+2], 'trip_path': trip_path, 'trip': trip})
                    offset += arity + 1
            require(len(result) == 2, 'EXPECTED_TWO_GPU_MAPS')
            require({r['zone'] for r in result} == {f'{THERMAL}/zeroc-{i}-step' for i in (0, 1)},
                    'GPU_MAP_ZONE_SET')
            return result


        def config_value(config: str, key: str) -> str:
            found = []
            for line in config.splitlines():
                if line.startswith(key + '='):
                    found.append(line.split('=', 1)[1])
                elif line == f'# {key} is not set':
                    found.append('n')
            require(len(found) == 1, 'CONFIG_MISSING_OR_DUPLICATE:' + key)
            return found[0]


        def config_gate(data: bytes) -> dict:
            require(sha(data) == CONFIG_SHA, 'ORIGINAL_CONFIG_SHA_MISMATCH')
            text = data.decode()
            expected = {'CONFIG_REGULATOR_COOLING_DEVICE': 'y', 'CONFIG_QTI_DEVFREQ_VDD_COOLING_DEVICE': 'n',
                        'CONFIG_OF': 'y', 'CONFIG_THERMAL': 'y', 'CONFIG_THERMAL_OF': 'y', 'CONFIG_REGULATOR': 'y'}
            actual = {k: config_value(text, k) for k in expected}
            require(actual == expected, 'CONFIG_PREREQUISITES_DIFFER')
            return actual


        def write_json(path: Path, data: dict | list) -> None:
            path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')


        def run_command(args: list[str], cwd: Path, log: Path, timeout: int = 90) -> str:
            p = subprocess.run(args, cwd=cwd, text=True, capture_output=True, timeout=timeout, check=False)
            log.write_text('$ ' + shlex.join(args) + '\n' + p.stdout + p.stderr, encoding='utf-8')
            require(p.returncode == 0, f'COMMAND_FAILED:{Path(args[0]).name}:{p.returncode}; see {log.name}')
            return p.stdout


        def verify_source(source: Path, out: Path) -> None:
            actual = run_command(['git', 'rev-parse', 'HEAD'], source, out/'R43_SOURCE_HEAD.log').strip()
            require(actual == SOURCE_COMMIT, 'SOURCE_COMMIT_MISMATCH')
            require(not run_command(['git', 'status', '--porcelain'], source, out/'R43_SOURCE_INITIAL_STATUS.log').strip(),
                    'SOURCE_CHECKOUT_NOT_CLEAN')
            for name, wanted in SOURCE_PINS.items():
                p = source/name
                require(p.is_file() and not p.is_symlink() and git_blob(p.read_bytes()) == wanted,
                        'SOURCE_BLOB_MISMATCH:' + name)
            mk = (source/'drivers/thermal/qcom/Makefile').read_text()
            require('obj-$(CONFIG_REGULATOR_COOLING_DEVICE) += regulator_cdev.o' in mk, 'REGULATOR_KBUILD_LINK')
            driver = (source/'drivers/thermal/qcom/regulator_cdev.c').read_text()
            for token in ('qcom,regulator-cooling-device', 'regulator-cdev', 'regulator-levels',
                          'regulator_set_voltage', 'thermal_of_cooling_device_register'):
                require(token in driver, 'REGULATOR_DRIVER_INTERFACE:' + token)
            require(not (source/NEW_DTSI).exists(), 'PATCH_ALREADY_APPLIED')


        def compiler_commands(source: Path, work: Path, name: str) -> tuple[list[str], list[str]]:
            pre = work/f'{name}.dts'
            dep = work/f'{name}.d'
            out = work/f'{name}.dtb'
            gcc = ['gcc', '-E', '-nostdinc', '-undef', '-D__DTS__', '-x', 'assembler-with-cpp',
                   '-I', str(source/'include'), '-I', str(source/'scripts/dtc/include-prefixes'),
                   '-MMD', '-MF', str(dep), '-o', str(pre), str(source/ENTRY)]
            dtc = ['dtc', '-I', 'dts', '-O', 'dtb', '-b', '0', '-H', 'epapr', '-@', '-i', str((source/ENTRY).parent),
                   '-o', str(out), str(pre)]
            return gcc, dtc


        def dependency_manifest(source: Path, depfile: Path) -> dict[str, str]:
            data = depfile.read_text().replace('\\\n', ' ')
            require(': ' in data, 'DEPENDENCY_FILE_MALFORMED')
            deps = shlex.split(data.split(': ', 1)[1])
            require(bool(deps), 'DEPENDENCY_LIST_EMPTY')
            result = {}
            for raw in deps:
                path = Path(raw)
                if not path.is_absolute():
                    path = source/path
                resolved = path.resolve(strict=True)
                require(resolved.is_relative_to(source.resolve()), 'DEPENDENCY_ESCAPES_SOURCE')
                rel = str(resolved.relative_to(source.resolve()))
                require(resolved.is_file(), 'DEPENDENCY_NOT_FILE')
                result[rel] = sha(resolved.read_bytes())
            require(ENTRY in result and 'arch/arm64/boot/dts/vendor/qcom/holi-thermal.dtsi' in result
                    and 'arch/arm64/boot/dts/vendor/qcom/holi-regulators-pm6125.dtsi' in result,
                    'VEUX_INCLUDE_LINEAGE_NOT_PROVEN')
            return result


        def build_dtb(source: Path, work: Path, out: Path, name: str) -> tuple[bytes, dict]:
            gcc, dtc = compiler_commands(source, work, name)
            run_command(gcc, source, out/f'R43_{name}_CPP.log')
            run_command(dtc, source, out/f'R43_{name}_DTC.log')
            data = (work/f'{name}.dtb').read_bytes()
            fdt.fdt_properties(data)  # structural verification, not a boot assertion
            return data, dependency_manifest(source, work/f'{name}.d')


        def tree_delta(before: dict, after: dict) -> dict:
            # Compare node scope exactly. Do not treat random integers as phandles.
            added = set(after) - set(before)
            removed = set(before) - set(after)
            wanted_added = {STOCK_GFX} | {f'{THERMAL}/zeroc-{i}-step/cooling-maps/gfx_vdd_cdev' for i in (0, 1)}
            wanted_removed = {DEVFREQ} | {f'{THERMAL}/zeroc-{i}-step/cooling-maps/devfreq_vdd_cdev' for i in (0, 1)}
            require(added == wanted_added and removed == wanted_removed, 'UNEXPECTED_DTB_NODE_SCOPE')
            require('devfreq_vdd_cdev' not in after.get('/__symbols__', {}), 'STALE_DEVFREQ_SYMBOL')
            require(after.get('/__symbols__', {}).get('gfx_cdev') == (STOCK_GFX+'\0').encode(), 'GFX_SYMBOL_MISSING')
            # These are evidence of raw encoding differences only; do not overclaim global equivalence.
            changed = {p: sorted(k for k in set(before[p]) | set(after[p]) if before[p].get(k) != after[p].get(k))
                       for p in set(before) & set(after) if before[p] != after[p]}
            return {'nodes_added': sorted(added), 'nodes_removed': sorted(removed),
                    'raw_properties_changed_in_existing_nodes': dict(sorted(changed.items())),
                    'raw_difference_note': 'Phandle renumbering is recorded, never interpreted as hardware equivalence.'}


        def all_cooling_maps(tree: dict) -> dict:
            index = handles(tree)
            result = {}
            for path, props in sorted(tree.items()):
                if '/thermal-zones/' not in path or '/cooling-maps/' not in path or 'cooling-device' not in props:
                    continue
                values = cells(props['cooling-device'])
                refs, offset = [], 0
                while offset < len(values):
                    require(values[offset] in index, 'UNRESOLVED_COOLING_MAP')
                    provider = index[values[offset]]
                    arity = scalar(tree[provider]['#cooling-cells'])
                    require(0 <= arity <= 16 and offset + 1 + arity <= len(values), 'COOLING_MAP_ARITY')
                    refs.append({'provider': provider, 'arguments': values[offset+1:offset+1+arity]})
                    offset += arity + 1
                result[path] = {'references': refs, 'trip': target(tree, props['trip']),
                    'other_properties': {k: v.hex() for k,v in sorted(props.items())
                        if k not in ('phandle','linux,phandle','cooling-device','trip')}}
            return result


        def verify_patch_result(stock: dict, r20: dict, patched: dict) -> dict:
            require(DEVFREQ not in patched and STOCK_GFX in patched, 'PATCH_PROVIDER_SWITCH_FAILED')
            require(enabled(patched, STOCK_GFX), 'PATCHED_GFX_DISABLED')
            a, b = stock[STOCK_GFX], patched[STOCK_GFX]
            for key in ('compatible', '#cooling-cells', 'regulator-levels', 'status'):
                require(a.get(key) == b.get(key), 'PATCHED_PROPERTY_NOT_STOCK:' + key)
            require(target(patched, b['regulator-cdev-supply']) == SUPPLY, 'PATCHED_SUPPLY_WRONG')
            require(supplier_signature(stock, SUPPLY) == supplier_signature(patched, SUPPLY), 'PATCHED_SUPPLIER_CHANGED')
            stock_maps = cooling_signature(stock, STOCK_GFX)
            patched_maps = cooling_signature(patched, STOCK_GFX)
            require(stock_maps == patched_maps, 'PATCHED_COOLING_MAPS_NOT_STOCK')
            r20_maps = cooling_signature(r20, DEVFREQ)
            require(all(r['min_state'] == r['max_state'] == 2 for r in r20_maps), 'R20_STATE_DRIFT')
            require(all(r['min_state'] == r['max_state'] == 1 for r in patched_maps), 'PATCHED_STATE_DRIFT')
            old_maps, new_maps = all_cooling_maps(r20), all_cooling_maps(patched)
            old_gpu = {f'{THERMAL}/zeroc-{i}-step/cooling-maps/devfreq_vdd_cdev' for i in (0,1)}
            new_gpu = {f'{THERMAL}/zeroc-{i}-step/cooling-maps/gfx_vdd_cdev' for i in (0,1)}
            require({p:v for p,v in old_maps.items() if p not in old_gpu} ==
                    {p:v for p,v in new_maps.items() if p not in new_gpu}, 'UNRELATED_COOLING_MAP_CHANGED')
            return {'unrelated_cooling_maps_unchanged': len(old_maps)-2, 'stock_maps': stock_maps, 'patched_maps': patched_maps,
                    'r20_previous_maps': r20_maps, 'stock_provider_properties_match': True,
                    'stock_supplier_identity_match': True}


        def load_inputs(root: Path) -> tuple[bytes, bytes, bytes, bytes]:
            for name, expected in INPUTS.items():
                path = root/name
                require(path.is_file() and not path.is_symlink(), 'INPUT_MISSING_OR_SYMLINK:' + name)
                require(sha(path.read_bytes()) == expected, 'INPUT_HASH_MISMATCH:' + name)
            r38 = fdt.members(root/'VEUX_R39_R2_MEMORY_ABI_MAIN.zip',
                              ['evidence/VEUX_R38_OVERLAY_VENDOR_ABI_MAIN.zip'])['evidence/VEUX_R38_OVERLAY_VENDOR_ABI_MAIN.zip']
            r20 = fdt.members(io.BytesIO(r38), ['evidence/R20_VEUX.dtb'])['evidence/R20_VEUX.dtb']
            require(sha(r20) == fdt.R20_DTB_SHA256, 'R20_DTB_HASH_MISMATCH')
            device = fdt.members(root/'VEUX_R37_DEVICE_EVIDENCE.zip',
                                 ['R37_VENDOR_BOOT_BASE.dtb', 'R37_DTBO_CANDIDATE0.dtbo'])
            cfg = fdt.members(root/'VEUX_OEM_WALT_R26_R2_SYMVERS_SEMANTIC_PROOF_MAIN.zip',
                              ['fixtures/R20_REAL_BUILD_CONFIG.config'])['fixtures/R20_REAL_BUILD_CONFIG.config']
            return device['R37_VENDOR_BOOT_BASE.dtb'], device['R37_DTBO_CANDIDATE0.dtbo'], r20, cfg


        def merge_logged(base: bytes, overlay: bytes, work: Path, out: Path, name: str) -> bytes:
            bp, op, mp = work/(name+'_base.dtb'), work/(name+'_overlay.dtbo'), work/(name+'_merged.dtb')
            bp.write_bytes(base)
            op.write_bytes(overlay)
            run_command(['fdtoverlay', '-i', str(bp), '-o', str(mp), str(op)], work,
                        out/('R43_'+name+'_MERGE.log'), timeout=45)
            result = mp.read_bytes()
            fdt.fdt_properties(result)
            return result


        def run(root: Path, source: Path, payload: Path, work: Path, out: Path) -> dict:
            require(root.resolve() != source.resolve(), 'SOURCE_MUST_BE_ISOLATED')
            for p in (work, out):
                p.mkdir(parents=True, exist_ok=True)
                require(not p.resolve().is_relative_to(root.resolve()) and not p.resolve().is_relative_to(source.resolve()),
                        'OUTPUT_MUST_BE_OUTSIDE_REPOSITORIES')
            patch = payload/'patches/R43_STOCK_GFX.patch'
            require(sha(patch.read_bytes()) == PATCH_SHA, 'PATCH_PAYLOAD_HASH_MISMATCH')
            expected_path = payload/'fixtures/R42_RESULT.json'
            require(sha(expected_path.read_bytes()) == R42_RESULT_SHA, 'R42_REPORT_HASH_MISMATCH')
            expected = json.loads(expected_path.read_text())
            stock_raw, overlay, original_r20, config = load_inputs(root)
            config_result = config_gate(config)
            stock = fdt.fdt_properties(merge_logged(stock_raw, overlay, work, out, 'STOCK'))
            r20 = fdt.fdt_properties(merge_logged(original_r20, overlay, work, out, 'R20'))
            require({k: v.hex() for k, v in sorted(stock[STOCK_GFX].items())} == expected['stock_properties_hex'],
                    'R42_STOCK_PROPERTIES_CHANGED')
            observed_path = target(stock, stock[STOCK_GFX]['regulator-cdev-supply'])
            observed = {'stock_supply_path': observed_path,
                        'stock_supply_phandle': scalar(stock[STOCK_GFX]['regulator-cdev-supply']),
                        'stock_supplier_properties_hex': {k: b.hex() for k, b in stock[observed_path].items()},
                        'r20_expected_supplier_path': SUPPLY,
                        'r20_supplier_properties_hex': {k: b.hex() for k, b in r20.get(SUPPLY, {}).items()},
                        'comparison_pending': True}
            write_json(out/'R43_SUPPLY_OBSERVED.json', observed)
            supply = resolve_stock_supply(stock, r20)
            write_json(out/'R43_SUPPLY_PROOF.json', supply)
            print('R43_STOCK_SUPPLY_RESOLVED=' + supply['stock_supply_path'], flush=True)
            verify_source(source, out)
            before_blob, before_deps = build_dtb(source, work, out, 'BEFORE')
            before_raw = fdt.fdt_properties(before_blob)
            raw_r20 = fdt.fdt_properties(original_r20)
            # Require the identical original tree, including its resolved handle encoding.
            # This protects against accidentally testing another ancestor/configuration.
            if before_raw != raw_r20:
                write_json(out/'R43_BASELINE_MISMATCH.json', {
                    'compiled_only_paths': sorted(set(before_raw)-set(raw_r20)),
                    'r20_only_paths': sorted(set(raw_r20)-set(before_raw)),
                    'changed_properties': {p: {k: {'compiled': before_raw[p].get(k, b'').hex(),
                                                  'original_r20': raw_r20[p].get(k, b'').hex()}
                        for k in sorted(set(before_raw[p])|set(raw_r20[p]))
                        if before_raw[p].get(k) != raw_r20[p].get(k)}
                        for p in sorted(set(before_raw)&set(raw_r20)) if before_raw[p] != raw_r20[p]}})
                raise ValueError('COMPILED_BASELINE_NOT_ORIGINAL_R20_TREE')
            write_json(out/'R43_BASELINE_MATCH.json', {'all_nodes_and_properties_equal': True,
                'nodes': len(raw_r20), 'reference_dtb_sha256': sha(original_r20),
                'compiled_dtb_sha256': sha(before_blob),
                'comparison': 'all parsed FDT nodes and every property byte; header layout may differ'})
            run_command(['git', 'apply', '--check', str(patch.resolve())], source, out/'R43_GIT_APPLY_CHECK.log')
            run_command(['git', 'apply', str(patch.resolve())], source, out/'R43_GIT_APPLY.log')
            tracked = run_command(['git', 'diff', '--name-only'], source, out/'R43_CHANGED_TRACKED.log').splitlines()
            untracked = run_command(['git', 'ls-files', '--others', '--exclude-standard'], source,
                                    out/'R43_CHANGED_UNTRACKED.log').splitlines()
            require(tracked == [ENTRY] and untracked == [NEW_DTSI], 'PATCH_FILE_SCOPE_CHANGED')
            after_blob, after_deps = build_dtb(source, work, out, 'AFTER')
            require(set(after_deps) == set(before_deps) | {NEW_DTSI}, 'PATCH_DEPENDENCY_SET_CHANGED')
            require(all(after_deps[k] == v for k, v in before_deps.items() if k != ENTRY),
                    'UNRELATED_SOURCE_DEPENDENCY_MODIFIED')
            after_raw = fdt.fdt_properties(after_blob)
            delta = tree_delta(before_raw, after_raw)
            after = fdt.fdt_properties(merge_logged(after_blob, overlay, work, out, 'PATCHED'))
            check = verify_patch_result(stock, r20, after)
            project_status = run_command(['git', 'status', '--porcelain'], root, out/'R43_PROJECT_STATUS.log')
            require(not project_status.strip(), 'PROJECT_REPOSITORY_MODIFIED')
            # Recheck all input archives after compilation/application.
            require(all(sha((root/n).read_bytes()) == digest for n, digest in INPUTS.items()), 'INPUT_CHANGED_DURING_RUN')
            write_json(out/'R43_DEPENDENCIES.json', {'before': before_deps, 'after': after_deps})
            write_json(out/'R43_TREE_DELTA.json', delta)
            write_json(out/'R43_COOLING_COMPARISON.json', check)
            (out/'R43_STOCK_GFX_SOURCE.patch').write_bytes(patch.read_bytes())
            (out/'R43_VEUX_GFX_SOURCE.dtsi.txt').write_bytes((source/NEW_DTSI).read_bytes())
            result = {'schema': 'VEUX_R43_R2_AO_SUPPLY_PATCH_DTB_V1',
                'result': 'SUPPLY_PROVEN_SOURCE_PATCH_COMPILED_STOCK_GPU_MATCH',
                'revision': 'R43-R2', 'previous_failure_run': 40131737405,
                'source_commit': SOURCE_COMMIT, 'input_sha256': INPUTS, 'source_git_blob_pins': SOURCE_PINS,
                'patch_sha256': PATCH_SHA, 'config': config_result,
                'stock_supply_condition_verified': True, 'source_patch_applied_to_isolated_checkout': True,
                'baseline_full_tree_matches_original_r20': True, 'native_veux_dtb_before_after_compiled': True,
                'stock_gpu_semantics_match_after_dtbo0': True, 'unrelated_source_dependencies_unchanged': True,
                'dtbo_mode': 'OFFLINE_CANDIDATE_0_NOT_BOOTLOADER_PROOF',
                'source_changes': [ENTRY, NEW_DTSI], 'build_output_uploaded': False,
                'raw_node_counts': {'original_r20': len(raw_r20), 'before': len(before_raw), 'after': len(after_raw)},
                'merged_node_counts': {'stock': len(stock), 'r20': len(r20), 'patched': len(after)},
                'next_step': 'Integrate this verified DTS-only patch into R20-R11 full build; vendor ABI remains a separate gate.',
                **{k: False for k in GATES_FALSE}}
            write_json(out/'R43_RESULT.json', result)
            (out/'R43_BERICHT_DE.txt').write_text(
                'R43: Stock-S8-AO-Versorgung aufgeloest; Patch nur in isolierter Quellkopie angewendet.\n'
                'VEUX-DTB vor und nach dem Patch mit GCC/DTC kompiliert. Ungepatchter Baum entspricht dem originalen R20-Baum.\n'
                'Gepatchte GPU-Eigenschaften, Versorgung, beide Maps und Trips entsprechen Stock+DTBO0 offline.\n'
                'Nur veux.dts und neue veux-gfx-stock-cooling.dtsi geaendert; gemeinsame Quellen unveraendert.\n'
                'KEIN vollstaendiger Kernel-Build, keine Vendor-ABI-/Runtime-/Bootloader-Freigabe.\n'
                'BOOT_READY=NO; FLASH_ALLOWED=NO. Kein Image/DTB/AK3 im Ergebnisartefakt.\n', encoding='utf-8')
            return result


        def main() -> int:
            parser = argparse.ArgumentParser(description=__doc__)
            for name in ('root', 'source', 'payload', 'work', 'out'):
                parser.add_argument('--' + name, required=True, type=Path)
            args = parser.parse_args()
            try:
                result = run(args.root, args.source, args.payload, args.work, args.out)
            except Exception as exc:
                args.out.mkdir(parents=True, exist_ok=True)
                write_json(args.out/'R43_FAILURE.json', {'schema': 'VEUX_R43_R2_FAILURE_V1',
                    'result': 'BLOCKED_NOT_APPROVED', 'error_type': type(exc).__name__,
                    'reason': str(exc), **{k: False for k in GATES_FALSE}})
                (args.out/'R43_FAILURE_TRACE.log').write_text(traceback.format_exc(), encoding='utf-8')
                print('R43_BLOCKED: ' + str(exc), file=sys.stderr)
                return 1
            print('R43_SUPPLY_PATCH_DTB=PASS; FULL_KERNEL_BUILD=NO; VENDOR_ABI_UNPROVEN; BOOT_READY=NO; FLASH=NO')
            require(result['boot_ready'] is False, 'INVALID_SUCCESS')
            return 0


        if __name__ == '__main__':
            raise SystemExit(main())
        R44_PAYLOAD_r43_gate_py
        cat > "$R44_DIR/r44_gpu_gate.py" <<'R44_PAYLOAD_r44_gpu_gate_py'
        #!/usr/bin/env python3
        """R44: stage proven VEUX-only GPU DTS patch on the R20 WALT snapshot.

        Fail closed on source/config/input drift and changed reference semantics.
        No boot.img, AK3, device access, or vendor ABI release.
        """
        from __future__ import annotations
        import argparse
        import hashlib
        import io
        import json
        import pathlib
        import shlex
        import subprocess
        import sys
        import traceback

        import r42_stock_capture as fdt
        import r43_gate as proven

        ENTRY = proven.ENTRY
        EXTRA = proven.NEW_DTSI
        PATCH_SHA = proven.PATCH_SHA
        GFX_PATH = proven.STOCK_GFX
        NEW_GPU = {GFX_PATH, *(f'{proven.THERMAL}/zeroc-{i}-step/cooling-maps/gfx_vdd_cdev' for i in (0, 1))}
        OLD_GPU = {proven.DEVFREQ, *(f'{proven.THERMAL}/zeroc-{i}-step/cooling-maps/devfreq_vdd_cdev' for i in (0, 1))}
        # Only properties known to contain a phandle or a phandle specifier may undergo
        # a remap. Ordinary numbers, strings, flags and the other hardware state must
        # remain byte-for-byte identical outside the intentional GPU changes.
        KNOWN_REFERENCE_PROPERTIES = frozenset('''
        clocks iommus interconnects pinctrl-0 pinctrl-1 memory-region qcom,target-dev
