    - name: R9 install identical historical Android Clang r416183b toolchain
      shell: bash
      timeout-minutes: 20
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ca-certificates cpio curl flex git libelf-dev \
          libncurses-dev libssl-dev patch python3 python-is-python3 rsync xz-utils zstd
        # R19 run 39698934163: real Android Clang 12.0.5, based on r416183b.
        # Fail-closed: try exact SHA256 of the successful R19 Gitiles archive.
        # On server-side HTTP 503 or archive mismatch, fetch precisely the same
        # AOSP commit and clang sub-tree from Microsoft's read-only AOSP git mirror.
        clang_commit='aa2e4a514a6c85eebcc4a27149eaf9244e951a1e'
        clang_root_tree='2fdc995c25e58c0206ff32d5dd46a200431912fa'
        clang_subtree='0a90693130898d6f98a76538086247b374d4a57f'
        clang_archive_sha='f6d76f9a7dfafe63363b0ba5398513eff6c6b650d3e15351751afdedc4fd7d37'
        clang_src='https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/aa2e4a514a6c85eebcc4a27149eaf9244e951a1e/clang-r416183b.tar.gz'
        clang_mirror='https://github.com/msft-mirror-aosp/platform.prebuilts.clang.host.linux-x86.git'
        archive="$RUNNER_TEMP/veux-r9-clang-r416183b.tar.gz"
        mkdir -p "$R9_TOOLCHAIN" "$R9_REPORT"
        test -z "$(find "$R9_TOOLCHAIN" -mindepth 1 -print -quit)"
        if curl --fail --location --retry 4 --connect-timeout 30 --max-time 420 \
            "$clang_src" --output "$archive" && \
            { actual_archive_sha=$(sha256sum "$archive" | awk '{print $1}');
              case "$actual_archive_sha" in
                f6d76f9a7dfafe63363b0ba5398513eff6c6b650d3e15351751afdedc4fd7d37|f72b806c4ec9bb28f8ae615c7c7289a070a82efed13854f7814595d3be588bde)
                  clang_archive_sha="$actual_archive_sha" ;;
                *) false ;;
              esac;
            } && \
            tar -tzf "$archive" > /dev/null; then
          tar -xzf "$archive" -C "$R9_TOOLCHAIN"
          printf '%s  %s\n' "$clang_archive_sha" "$archive" > "$R9_REPORT/R9_PINNED_TOOLCHAIN_ARCHIVE.sha256"
          printf 'source=GOOGLE_GITILES_ARCHIVE\ncommit=%s\nsubtree=%s\narchive_sha256=%s\n' \
            "$clang_commit" "$clang_subtree" "$clang_archive_sha" > "$R9_REPORT/R9_TOOLCHAIN_PROVENANCE.txt"
        else
          echo '::warning::Official Google archive unavailable or rejected; trying exact AOSP commit on GitHub mirror'
          rm -f "$archive"
          backup=$(mktemp -d "$RUNNER_TEMP/veux-r9-gitmirror.XXXXXXXX")
          trap 'rm -rf "$backup"' EXIT
          git -C "$backup" init -q
          git -C "$backup" remote add origin "$clang_mirror"
          git -C "$backup" sparse-checkout init --cone
          git -C "$backup" sparse-checkout set clang-r416183b
          git -C "$backup" -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none origin "$clang_commit"
          git -C "$backup" -c advice.detachedHead=false checkout --detach --quiet FETCH_HEAD
          test "$(git -C "$backup" rev-parse HEAD)" = "$clang_commit"
          test "$(git -C "$backup" rev-parse 'HEAD^{tree}')" = "$clang_root_tree"
          test "$(git -C "$backup" rev-parse 'HEAD:clang-r416183b')" = "$clang_subtree"
          test -x "$backup/clang-r416183b/bin/clang"
          cp -a "$backup/clang-r416183b/." "$R9_TOOLCHAIN/"
          printf 'source=MICROSOFT_AOSP_GIT_MIRROR\ncommit=%s\nroot_tree=%s\nsubtree=%s\n' \
            "$clang_commit" "$clang_root_tree" "$clang_subtree" > "$R9_REPORT/R9_TOOLCHAIN_PROVENANCE.txt"
        fi
        test -x "$R9_TOOLCHAIN/bin/clang"
        test -x "$R9_TOOLCHAIN/bin/llvm-nm"
        test -x "$R9_TOOLCHAIN/bin/ld.lld"
        "$R9_TOOLCHAIN/bin/clang" --version | grep -F 'r416183b'
        "$R9_TOOLCHAIN/bin/clang" --version | grep -F '12.0.5'
        "$R9_TOOLCHAIN/bin/llvm-nm" --version | grep -E 'LLVM|llvm|12.0.5' > /dev/null
        cat "$R9_REPORT/R9_TOOLCHAIN_PROVENANCE.txt"
        echo 'R9_HISTORICAL_ANDROID_CLANG=AVAILABLE; TOOLCHAIN_PIN_VERIFIED=YES'
