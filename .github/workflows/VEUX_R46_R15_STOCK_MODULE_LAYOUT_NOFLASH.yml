      shell: bash
      run: |
        set -euo pipefail
        test -x "$R44_DIR/actionlint"
        printf '%s  %s\n' c872d6db8c6bf83a8eaa704fc93999f027d55dffbc63b8a6abdccb47df5f4cd4 "$R44_DIR/actionlint" | sha256sum -c --strict -
        mkdir -p "$RUNNER_TEMP/veux-p11-actionlint"
