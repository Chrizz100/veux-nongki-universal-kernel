    - name: 'R46-R2 SHA-pinned MAIN: actionlint ShellCheck regressions before compiler'
      if: ${{ steps.package.outputs.present == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$R45_OUT"
        test -s "$R45_WORKFLOW"
        test -s "project/$R45_PACKAGE_NAME"
        printf '%s  %s\n' "$R45_PACKAGE_SHA256" "project/$R45_PACKAGE_NAME" | sha256sum -c - | tee "$R45_OUT/R45_MAIN_SHA_CHECK.log"
        test ! -e "$R45_TOOLS_DIR"
        python3 - "project/$R45_PACKAGE_NAME" "$R45_TOOLS_DIR" <<'PY_R45_R3_UNPACK'
        import pathlib,stat,sys,zipfile
        package=pathlib.Path(sys.argv[1]);target=pathlib.Path(sys.argv[2])
        with zipfile.ZipFile(package) as z:
            members=z.infolist()
            names=[x.filename for x in members]
            if z.testzip() is not None or len(names)!=len(set(names)) or len(names)>35:
                raise SystemExit('R45_ZIP_INTEGRITY_OR_DUPLICATE')
            if sum(x.file_size for x in members)>2500000:
                raise SystemExit('R45_ZIP_UNCOMPRESSED_LIMIT')
            for info in members:
                p=pathlib.PurePosixPath(info.filename)
                if (p.is_absolute() or '..' in p.parts or
                    stat.S_ISLNK(info.external_attr >> 16) or not p.parts or
                    info.is_dir() or info.file_size>600000):
                    raise SystemExit('R45_UNSAFE_MEMBER:'+info.filename)
            target.mkdir(parents=True)
            for info in members:
                path=target.joinpath(*pathlib.PurePosixPath(info.filename).parts)
                path.parent.mkdir(parents=True,exist_ok=True)
                path.write_bytes(z.read(info))
        print('R45_SHA_PINNED_MAIN_SAFE_UNPACK_OK')
        PY_R45_R3_UNPACK
        (cd "$R45_TOOLS_DIR" && sha256sum -c MANIFEST_SHA256.txt) > "$R45_OUT/R45_ZIP_MANIFEST.log"
        test -x "$R44_DIR/actionlint"
        command -v shellcheck
        "$R44_DIR/actionlint" -version > "$R45_OUT/R45_ACTIONLINT_VERSION.log" 2>&1
        shellcheck --version > "$R45_OUT/R45_SHELLCHECK_VERSION.log" 2>&1
        if ! "$R44_DIR/actionlint" -color=false -shellcheck= "$R45_WORKFLOW" > "$R45_OUT/R45_ACTIONLINT.log" 2>&1; then
          cat "$R45_OUT/R45_ACTIONLINT.log"
          exit 3
        fi
        python3 - "$R45_WORKFLOW" "$R45_OUT" <<'PY_R45_R3_CHECK_ALL_SCRIPTS'
        import json,pathlib,subprocess,sys,yaml
        wf=pathlib.Path(sys.argv[1]);out=pathlib.Path(sys.argv[2]);doc=yaml.safe_load(wf.read_text())
        scripts=[(name,step.get('name',''),step['run']) for name,job in doc['jobs'].items()
                 for step in job['steps'] if isinstance(step.get('run'),str)]
        failures=[]
        for job,name,body in scripts:
            for label,cmd in [('bash',['bash','-n']),
                              ('shellcheck',['shellcheck','--shell=bash','--severity=warning','-'])]:
                r=subprocess.run(cmd,input=body,capture_output=True,text=True,timeout=80)
                if r.returncode:
                    failures.append({'job':job,'step':name,'check':label,'exit':r.returncode,
                                     'message':(r.stdout+r.stderr)[-3000:]})
        result={'schema':'VEUX_R46_R2_STATIC_PREFLIGHT_V1','scripts':len(scripts),
                'bash_checks':len(scripts),'shellcheck_checks':len(scripts),
                'actionlint':'PASS','failures':failures,'flash_allowed':False}
        (out/'R45_R3_STATIC_PREFLIGHT.json').write_text(json.dumps(result,indent=2)+'\n')
        if failures:
            for error in failures[:10]: print(error)
            raise SystemExit(3)
        if len(scripts)<70:raise SystemExit('R45_MISSING_SCRIPT_BLOCKS')
        print('R45_ACTIONLINT_AND_SHELLCHECK_BASH_PASS; BLOCKS='+str(len(scripts)))
        PY_R45_R3_CHECK_ALL_SCRIPTS
