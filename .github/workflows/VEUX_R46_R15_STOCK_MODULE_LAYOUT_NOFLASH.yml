    - name: Assert unchanged project and report actual R21 build static pass and Device Pass separately
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        test "$(git -C project rev-parse HEAD)" = "$GITHUB_SHA"
        test -z "$(git -C project status --porcelain --untracked-files=all)"
        python3 -B - <<'PY_R21_SUMMARY'
        import json,os,pathlib
        build=pathlib.Path(os.environ['R16_REPAIR_OUTPUT'])/'R21_RESULT.json'
        pack=pathlib.Path(os.environ['R21_PACKAGE_OUTPUT'])/'R21_PACKAGE_RESULT.json'
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('### VEUX R21 Scheduler, Originalkennung, Boot.img und AK3\n\n')
            if build.exists():
                r=json.loads(build.read_text());f.write('Build: **'+r['status']+'**\n\n')
                f.write('Gemessene OEM-CRCs: `'+str(r.get('qgki_counts','nicht erreicht'))+'`\n\n')
                f.write('Passende Module: '+str(r.get('fully_matching_modules','nicht erreicht'))+'/37\n\n')
                f.write('Kernelkennung: `'+r.get('release',{}).get('verified_release','nicht erreicht')+'`\n\n')
            else:f.write('Vollstaendiger R21-Neubau nicht erreicht.\n\n')
            if pack.exists():
                r=json.loads(pack.read_text());f.write('Boot-/AK3-Container: **'+r['status']+'**\n\n')
            else:f.write('Boot-/AK3-Paketpruefung nicht erreicht.\n\n')
            f.write('Device Pass: **NEIN**. Flashfreigabe: **NEIN**.\n')
        print('R21_REPO_UNCHANGED=YES DEVICE_PASS=NO FLASH=NO')
        PY_R21_SUMMARY
    name: R6 control then R21 full stock ABI release build and static boot AK3 gates
