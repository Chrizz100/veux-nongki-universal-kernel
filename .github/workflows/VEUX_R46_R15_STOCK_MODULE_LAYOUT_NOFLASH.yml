      shell: bash
      run: |
        set -euo pipefail
        test -s "$R45_OUT/R47_R13_PREFLIGHT.json"
        test -s "$R20_OUT/R20_BUILD_RESULT.json"
        test -s "$R46_OUT/R46_POSTBUILD_RESULT.json"
        test ! -e "$R47_REPORT_DIR"
        python3 -B "$R47_TOOLS_DIR/Tools/veux_r47_r13_on_r46.py" build \
