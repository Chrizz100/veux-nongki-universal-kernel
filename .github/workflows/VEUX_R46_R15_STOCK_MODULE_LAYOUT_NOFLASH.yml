        qcom,bt-vdd-pa-supply qcom,bt-vdd-smps-supply qcom,bt-vdd-xtal-supply
        qcom,cpucc qcom,dispcc qcom,gcc qcom,gpucc qcom,mccc vdd_gx-supply
