    - name: R47-R13 rebuild actual ARM64 WALT Image DTB modules with both RMNET built-ins
      shell: bash
      run: |
        set -euo pipefail
        test -s "$R45_OUT/R47_R13_PREFLIGHT.json"
        test -s "$R20_OUT/R20_BUILD_RESULT.json"
        test -s "$R46_OUT/R46_POSTBUILD_RESULT.json"
        test ! -e "$R47_REPORT_DIR"
        python3 -B "$R47_TOOLS_DIR/Tools/veux_r47_r13_on_r46.py" build \
          --source "$R9_SNAPSHOT" --objout "$R13_OBJOUT" \
          --baseline "$R20_OUT/R20_BUILD_RESULT.json" \
          --r46 "$R46_OUT/R46_POSTBUILD_RESULT.json" \
          --project "$GITHUB_WORKSPACE/project" --output "$R47_REPORT_DIR"
        test -s "$R47_REPORT_DIR/R47_RESULT.json"
        python3 - "$R47_REPORT_DIR/R47_RESULT.json" <<'PY_R47_REBUILT_RESULT'
        import json,sys
        report=json.load(open(sys.argv[1],encoding='utf-8'))
        if (report.get('status')!='R46_R6_ROOTLESS_CONFIG_RELEASE_AND_RMNET_BUILD_PROVEN_NOFLASH'
            or len(report.get('historical_r13_hunks',[]))!=2
            or len(report.get('make_results',[]))!=3
            or any(x.get('exit_code')!=0 for x in report['make_results'])
            or set(report.get('built_in_rmnet_initcall_proven',{}))
               != {'rmnet_shs','rmnet_offload','rmnet_core'}
            or report.get('genuine_link_log_proof',{}).get('all_real_build_traces_seen') is not True
            or report.get('genuine_link_log_proof',{}).get('missing_llvm_nm_errors') != 0
            or report.get('genuine_link_log_proof',{}).get('linker_warning_free') is not True
            or report.get('lto_linker_fix',{}).get('initcall_levels_preserved') is not True
            or len(report.get('verified_other_four',[])) != 4
            or report.get('experimental_release_before') != '5.4.274~positron'
            or report.get('original_stock_release_reference') != '5.4.274-qgki-g82179e362f33'
            or report.get('candidate_release_verified') != '5.4.274-qgki'
            or report.get('config_release_fix',{}).get('expected_candidate_release') != '5.4.274-qgki'
            or len(report.get('config_release_fix',{}).get('changes',[])) != 2
            or report.get('config_release_verification',{}).get('verified_release') != '5.4.274-qgki'
            or report.get('config_release_verification',{}).get('no_stock_git_id_spoof') is not True
            or len(report.get('config_release_verification',{}).get('artifacts',[])) != 6
            or report.get('vendor_abi_diagnostic',{}).get('cohort') != 'OEM_QGKI_ONLY'
            or report.get('vendor_abi_diagnostic',{}).get('full_vendor_abi_proven') is not False
            or report.get('vendor_abi_diagnostic',{}).get('status') != 'STOCK_VENDOR_ABI_UNPROVEN_NOFLASH'
            or report.get('vendor_abi_proven') is not False
            or report.get('flash_allowed') is not False):
            raise SystemExit('R47_R13_GENUINE_WALT_BUILTIN_FULL_LINK_NOT_PROVEN')
        print('R46_R6_CONFIG_RELEASE_POSITRON_REMOVED_AND_BUILTIN_LINK_PASS_NOFLASH')
        PY_R47_REBUILT_RESULT
        test -z "$(git -C project status --porcelain --untracked-files=all)"
        echo 'R46_R6_CONFIG_RELEASE_CANDIDATE_ONLY; OEM_VENDOR_ABI_UNPROVEN; FLASH=NO'
    - name: R47-R13 preserve separate text-only build evidence on failures
