          test "$(git -C "$backup" rev-parse 'HEAD:clang-r416183b')" = "$clang_subtree"
          test -x "$backup/clang-r416183b/bin/clang"
          cp -a "$backup/clang-r416183b/." "$R9_TOOLCHAIN/"
          printf 'source=MICROSOFT_AOSP_GIT_MIRROR\ncommit=%s\nroot_tree=%s\nsubtree=%s\n' \
