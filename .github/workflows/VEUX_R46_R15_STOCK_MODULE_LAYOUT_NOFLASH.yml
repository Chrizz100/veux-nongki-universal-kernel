            for source_path,pin in proven.SOURCE_PINS.items():
                # Xiaomi WALT sources do not need to modify these GPU/DT infrastructure files.
                f=snap/source_path
                require(f.is_file() and not f.is_symlink() and proven.git_blob(f.read_bytes())==pin,
                        'SNAPSHOT_GPU_SOURCE_NOT_PINNED:'+source_path)
            require(not (snap/EXTRA).exists(), 'PATCH_ALREADY_APPLIED')
            cfg=verify_config(pathlib.Path(args.objout)/'.config')
            stock_raw,overlay,original_r20,prior_config=proven.load_inputs(p)
            require(proven.sha(prior_config)==proven.CONFIG_SHA, 'ORIGINAL_R20_CONFIG_CHANGED')
            before_blob,before_deps=proven.build_dtb(snap,work,out,'R44_BEFORE')
