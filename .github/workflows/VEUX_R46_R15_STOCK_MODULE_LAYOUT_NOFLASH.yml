    - name: R44 preserve evidence hashes and explicitly NO FLASH even on failure
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$R44_OUT"
        python3 -B - <<'PY_R44_MANIFEST'
        import hashlib,json,os,pathlib
        out=pathlib.Path(os.environ['R44_OUT'])
        files=[p for p in out.iterdir() if p.is_file() and p.name!='SHA256SUMS.txt']
        lines=[hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in sorted(files)]
        (out/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
        print('R44_REPORT_FILES='+str(len(files))+'; BOOT_READY=NO; FLASH_ALLOWED=NO')
        PY_R44_MANIFEST
        (cd "$R44_OUT" && sha256sum -c SHA256SUMS.txt)
