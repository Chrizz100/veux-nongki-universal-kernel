        import ast,os,pathlib,re,yaml
        workspace=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
        wf=workspace/'project/.github/workflows/VEUX_OEM_WALT_R12_R3_REAL_WALT_SYSCTL_COMPILER.yml'
