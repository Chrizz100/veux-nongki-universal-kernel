      shell: bash
      run: |
        set -euo pipefail
        python3 -B - <<'PY_R16_PINNED_MAIN'
        import base64,hashlib,os,pathlib,re,urllib.request
        current=pathlib.Path('project/.github/workflows/VEUX_R46_R15_STOCK_MODULE_LAYOUT_NOFLASH.yml')
        current_size=current.stat().st_size
        assert 0<current_size<=500_000, 'WORKFLOW_FILE_EXCEEDS_500000_BYTES'
        url=('https://raw.githubusercontent.com/Chrizz100/veux-nongki-universal-kernel/'
             '062f4b4de7704d07e226755b4930596128d25f06/'
             '.github/workflows/VEUX_R46_R15_STOCK_MODULE_LAYOUT_NOFLASH.yml')
        request=urllib.request.Request(url,headers={'User-Agent':'VEUX-R16-R4-pinned-bootstrap'})
        for attempt in range(3):
            try:
                with urllib.request.urlopen(request,timeout=45) as response:
                    raw=response.read(600_001)
                break
            except (OSError,TimeoutError):
                if attempt==2:raise
        assert len(raw)==541617, 'PINNED_SOURCE_WORKFLOW_LENGTH_CHANGED'
        assert hashlib.sha256(raw).hexdigest()=='f971071c60498da03df20c2d3e5d103b0c9b32467745d04fcfba07e233e691b9', 'PINNED_SOURCE_WORKFLOW_HASH_CHANGED'
        matches=re.findall("payload='''(.*?)'''",raw.decode('utf-8'),re.S)
        assert len(matches)==1, 'PINNED_MAIN_PAYLOAD_NOT_UNIQUE'
        data=base64.b64decode(''.join(matches[0].split()),validate=True)
        assert len(data)==183122
        assert hashlib.sha256(data).hexdigest()=='02b5fead3eaab3a5d5c9e82f887c5690af80849d26e70779306ac5fc77bd5764'
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'veux-r16-main.zip'
        with p.open('xb') as f:f.write(data)
        print('WORKFLOW_FILE_BYTES='+str(current_size)+'; LIMIT=500000; R3_MAIN_BYTE_IDENTICAL=YES')
        PY_R16_PINNED_MAIN
        printf '%s  %s\n' 02b5fead3eaab3a5d5c9e82f887c5690af80849d26e70779306ac5fc77bd5764 "$RUNNER_TEMP/veux-r16-main.zip" | sha256sum -c --strict -
        python3 -B - <<'PY_R16_UNPACK'
        import os,pathlib,stat,zipfile
        out=pathlib.Path(os.environ['R16_REPAIR_DIR'])
        assert not out.exists()
        with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP'])/'veux-r16-main.zip') as z:
            members=z.infolist()
            assert len(members)<150 and sum(p.file_size for p in members)<2_000_000
            assert z.testzip() is None and len(members)==len(set(p.filename for p in members))
            for item in members:
                p=pathlib.PurePosixPath(item.filename)
                assert not p.is_absolute() and '..' not in p.parts and '\\' not in item.filename
                assert not item.is_dir() and not stat.S_ISLNK(item.external_attr>>16)
