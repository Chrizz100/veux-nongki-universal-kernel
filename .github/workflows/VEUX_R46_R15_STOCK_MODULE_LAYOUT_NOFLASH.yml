les']))+'**\\n')\n    f.write('- Kernel modules: **'+str(len(j['module_files']))+'**\\n')\n    f.write('- **full_image_proven='+str(j['full_image_proven'])+'**\\n')\n    f.write('- Vendor ABI, CRC compatibility, device test: **NOT APPROVED**\\n')\nprint('R20_FINAL_DIAGNOSTIC_GATE=PASS; FULL_BUILD='+str(j['full_image_proven'])+'; FLASH=NO')\nPY_R20_STATUS\n"
