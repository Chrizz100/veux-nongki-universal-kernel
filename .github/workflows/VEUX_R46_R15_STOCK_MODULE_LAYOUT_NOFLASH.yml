        ENTRY = proven.ENTRY
        EXTRA = proven.NEW_DTSI
        PATCH_SHA = proven.PATCH_SHA
        GFX_PATH = proven.STOCK_GFX
        NEW_GPU = {GFX_PATH, *(f'{proven.THERMAL}/zeroc-{i}-step/cooling-maps/gfx_vdd_cdev' for i in (0, 1))}
        OLD_GPU = {proven.DEVFREQ, *(f'{proven.THERMAL}/zeroc-{i}-step/cooling-maps/devfreq_vdd_cdev' for i in (0, 1))}
        # Only properties known to contain a phandle or a phandle specifier may undergo
        # a remap. Ordinary numbers, strings, flags and the other hardware state must
        # remain byte-for-byte identical outside the intentional GPU changes.
        KNOWN_REFERENCE_PROPERTIES = frozenset('''
        clocks iommus interconnects pinctrl-0 pinctrl-1 memory-region qcom,target-dev
