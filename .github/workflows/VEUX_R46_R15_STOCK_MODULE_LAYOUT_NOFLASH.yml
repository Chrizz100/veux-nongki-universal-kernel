        vdd-3.3-ch1-supply vdd-cx-mx-supply vdd-smps-supply vdd-parent-supply
        vdd_lpi_cx-supply vdd_lpi_mx-supply refgen-supply vdda-1p2-supply
        vdda-0p9-supply sde-vdd-supply power-domains qcom,mdss-rot-parent
        asoc-cpu asoc-platform pinctrl-2 pinctrl-3 hwlocks qcom,cx-ipeak-data
        venus-core0-supply venus-supply qcom,rpm-msg-ram core-supply
        USB3_GDSC-supply dpdm-supply usb-phy phys reset-gpios
        '''.split())

        def require(condition, code):
            if not condition:
                raise ValueError(code)

        def sha(data: bytes) -> str:
            return hashlib.sha256(data).hexdigest()

        def json_write(path: pathlib.Path, obj):
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_text(json.dumps(obj, sort_keys=True, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')

        def safe_cmd(cmd, cwd, log, timeout=90):
            p = subprocess.run(cmd, cwd=cwd, text=True, capture_output=True, timeout=timeout, check=False)
            log.write_text('$ '+shlex.join(cmd)+'\n'+p.stdout+p.stderr, encoding='utf-8')
            require(p.returncode == 0, 'COMMAND_FAILED:'+pathlib.Path(cmd[0]).name+':'+str(p.returncode))
            return p.stdout

        def refs(tree: dict) -> dict[int, str]:
            return proven.handles(tree)

        def remap_external_reference_properties(before: dict, after: dict, *, require_gpu_change=True) -> dict:
            """Check every changed 32-bit cell against both trees' handle-to-path map.

            Raw equality is enforced on unchanged scalar cells. Changed cells are accepted
            only in an explicit phandle-property whitelist when the old and new ids resolve
            to precisely the same DT node path. No arbitrary integer replacement is ignored.
            """
            old_paths = set(before); new_paths = set(after)
            if require_gpu_change:
                require(new_paths-old_paths == NEW_GPU, 'GPU_ADDED_NODE_SCOPE_DRIFT')
                require(old_paths-new_paths == OLD_GPU, 'GPU_REMOVED_NODE_SCOPE_DRIFT')
            else:
                require(old_paths == new_paths, 'DTB_NODE_SET_DRIFT')
            oldrefs = refs(before); newrefs = refs(after)
            translated = 0
            raw_change_nodes = 0
            raw_change_props = 0
            renamed_symbol_nodes = 0
            categories = {}
            for path in sorted(old_paths & new_paths):
                aa, bb = before[path], after[path]
                akeys, bkeys = set(aa), set(bb)
                symbol_entries_replaced = 0
                if path == '/__symbols__' and require_gpu_change:
                    require(akeys-bkeys == {'devfreq_vdd_cdev'}, 'SYMBOL_DELETION_DRIFT')
                    require(bkeys-akeys == {'gfx_cdev'}, 'SYMBOL_ADDITION_DRIFT')
                    require(aa['devfreq_vdd_cdev'] == (proven.DEVFREQ+'\0').encode(),
                            'OLD_GPU_SYMBOL_WRONG')
                    require(bb['gfx_cdev'] == (GFX_PATH+'\0').encode(), 'GPU_SYMBOL_WRONG')
                    # R43's 449-node raw delta includes this symbol-table node: the two
                    # PROPERTY KEYS changed, even though none of their shared values did.
                    symbol_entries_replaced = len(akeys ^ bkeys)
                    require(symbol_entries_replaced == 2, 'SYMBOL_KEY_DELTA_COUNT_DRIFT')
                else:
                    require(akeys == bkeys, 'PROPERTY_SET_CHANGED:'+path)
                node_changed = symbol_entries_replaced > 0
                raw_change_props += symbol_entries_replaced
                if symbol_entries_replaced:
                    renamed_symbol_nodes += 1
                for key in sorted(akeys & bkeys):
                    a,b=aa[key],bb[key]
                    if a == b:
                        continue
                    node_changed = True
                    raw_change_props += 1
                    if key in ('phandle','linux,phandle'):
                        require(len(a)==4 and len(b)==4, 'PHANDLE_CELL_SIZE')
                        av=int.from_bytes(a,'big');bv=int.from_bytes(b,'big')
                        require(oldrefs.get(av)==newrefs.get(bv)==path, 'NODE_PHANDLE_TARGET_CHANGED:'+path)
                        translated += 1
                        categories['phandle'] = categories.get('phandle',0)+1
                    else:
                        require(key in KNOWN_REFERENCE_PROPERTIES, 'UNKNOWN_CHANGED_PROPERTY:'+path+':'+key)
                        require(len(a)==len(b) and len(a)>0 and len(a)%4==0,
                                'REFERENCE_CELL_LAYOUT_CHANGED:'+path+':'+key)
                        for off in range(0,len(a),4):
                            left,right=int.from_bytes(a[off:off+4],'big'),int.from_bytes(b[off:off+4],'big')
                            if left==right:
                                continue
                            require(left in oldrefs and right in newrefs,
                                    'UNRESOLVED_RENUMBERED_CELL:'+path+':'+key+':'+str(off))
                            require(oldrefs[left]==newrefs[right],
                                    'REFERENCE_TARGET_CHANGED:'+path+':'+key+':'+str(off))
                            translated += 1
                        categories[key]=categories.get(key,0)+1
                if node_changed:
                    raw_change_nodes+=1
            if require_gpu_change:
                require(renamed_symbol_nodes == 1, 'R43_SYMBOL_NODE_NOT_COUNTED')
                require(raw_change_nodes == 449, 'R43_RAW_DELTA_COUNT_DRIFT:'+str(raw_change_nodes))
                require(translated > 400, 'PHANDLE_RENUMBER_NOT_REVIEWED')
            return {'raw_changed_existing_nodes':raw_change_nodes,
                    'renamed_symbol_table_nodes':renamed_symbol_nodes,
                    'raw_changed_existing_properties':raw_change_props,
                    'unchanged_or_target_equivalent_words': True,
                    'checked_renumbered_cells':translated,
                    'property_categories':dict(sorted(categories.items())),
                    'node_phandle_entries_before':len(oldrefs),
                    'node_phandle_entries_after':len(newrefs),
                    'comparison':'Every changed u32 cell in explicitly whitelisted reference-bearing properties resolves to the identical provider node path. Other cells are byte-identical.',
                    'note':'No runtime probing or proof of all driver behavior; exact source/DTB coverage only.'}

        def verify_config(config: pathlib.Path) -> dict:
            require(config.is_file() and not config.is_symlink(), 'MISSING_REAL_CONFIG')
            lines=config.read_text(encoding='utf-8').splitlines()
            want=['CONFIG_SCHED_WALT=y','CONFIG_REGULATOR_COOLING_DEVICE=y',
                  '# CONFIG_QTI_DEVFREQ_VDD_COOLING_DEVICE is not set',
                  'CONFIG_THERMAL_OF=y','CONFIG_OF=y']
            for line in want:
                require(lines.count(line)==1, 'CONFIG_DRIFT:'+line)
            return {'config_sha256':sha(config.read_bytes()),'required_flags':want}

        def run_stage(args):
            p=pathlib.Path(args.project).resolve(); snap=pathlib.Path(args.snapshot).resolve()
            out=pathlib.Path(args.out).resolve(); work=pathlib.Path(args.work).resolve();stage=pathlib.Path(args.stage).resolve()
            require(snap != p and not snap.is_relative_to(p) and not p.is_relative_to(snap), 'SNAPSHOT_NOT_ISOLATED')
            require(not (snap/'.git').exists(), 'SNAPSHOT_EXPECTED_WITHOUT_GIT')
            for path in (out,work):
                require(not path.is_relative_to(snap) and not path.is_relative_to(p), 'OUTPUT_NOT_SEPARATE')
                path.mkdir(parents=True,exist_ok=True)
            patch=stage/'R43_STOCK_GFX_SOURCE.patch'
            require(patch.is_file() and not patch.is_symlink() and sha(patch.read_bytes())==PATCH_SHA,
                    'R43_PATCH_DIGEST_CHANGED')
            for source_path,pin in proven.SOURCE_PINS.items():
                # Xiaomi WALT sources do not need to modify these GPU/DT infrastructure files.
                f=snap/source_path
                require(f.is_file() and not f.is_symlink() and proven.git_blob(f.read_bytes())==pin,
                        'SNAPSHOT_GPU_SOURCE_NOT_PINNED:'+source_path)
            require(not (snap/EXTRA).exists(), 'PATCH_ALREADY_APPLIED')
            cfg=verify_config(pathlib.Path(args.objout)/'.config')
            stock_raw,overlay,original_r20,prior_config=proven.load_inputs(p)
            require(proven.sha(prior_config)==proven.CONFIG_SHA, 'ORIGINAL_R20_CONFIG_CHANGED')
            before_blob,before_deps=proven.build_dtb(snap,work,out,'R44_BEFORE')
            baseline=fdt.fdt_properties(original_r20)
