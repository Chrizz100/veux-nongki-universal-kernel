          require(r.returncode==0,'R44_'+name+'_FAILED:'+job+':'+str(index)+':'+(r.stdout+r.stderr)[-700:])
         results.append({'job':job,'step':index,'name':s.get('name',''), 'bytes':len(script.encode())})
        (report/'R44_STATIC_LINT.json').write_text(json.dumps({'actionlint_version':'1.7.12','all_run_blocks_checked':len(block),'steps':results,'success':True},indent=2)+'\n')
        print('R44_FULL_WORKFLOW_ACTIONLINT_SHELLCHECK_BASH_PASS; BLOCKS='+str(len(block)))
        PY_R44_ALL_BLOCKS_LINT
        test -z "$(git -C project status --porcelain)"
        echo 'R44_LOCAL_REGRESSION_AND_FULL_WORKFLOW_LINT_PASS; NO_KERNEL_SOURCE_EDITED'
