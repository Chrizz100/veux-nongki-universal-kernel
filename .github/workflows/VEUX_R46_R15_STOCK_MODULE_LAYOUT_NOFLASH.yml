            'VEUX_OEM_WALT_R26_R2_SYMVERS_SEMANTIC_PROOF_MAIN.zip': '1eb9edcf361e2c5ada4316768ddf3b70e9a4a853fec81b99c8d92d0f10f198eb',
        }
        SOURCE_PINS = {
            ENTRY: 'dc0f1bfe8db4676f9cff73b09956b789e56cbab4',
            'arch/arm64/boot/dts/vendor/qcom/blair.dts': '57b1e25b8c40a2f56b44065d837c773e0f76dd9d',
            'arch/arm64/boot/dts/vendor/qcom/blair.dtsi': 'd5aa5bc67fdd505a0cfa579a1948edde0ff8598d',
            'arch/arm64/boot/dts/vendor/qcom/holi-regulators-pm6125.dtsi': 'e5f25c6397f49af2aec557e05f4d6bff635c5032',
            'arch/arm64/boot/dts/vendor/qcom/holi-thermal.dtsi': '2ba52043e83f3cff785cdac67cefa89980813c4b',
            'drivers/thermal/qcom/regulator_cdev.c': '33ff71176ee0b6b592eaab1941b15c75b49ce079',
            'drivers/thermal/qcom/Makefile': '6127db42633c5b94e4125b64094e6b83997ef75c',
            'drivers/thermal/qcom/Kconfig': 'ba04b3c13c39c2d12513520562950822cf3a300f',
        }
        PATCH_SHA = '4842c703a5ae3594a4850ae6d5d9b22c0f882394e844929d2ff149d948cd74fc'
