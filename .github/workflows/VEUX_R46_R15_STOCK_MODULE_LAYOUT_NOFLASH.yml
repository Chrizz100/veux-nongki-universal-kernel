        qcom,bt-sw-ctrl-gpio qcom,bt-vdd-core-supply qcom,bt-vdd-io-supply
        qcom,bt-vdd-pa-supply qcom,bt-vdd-smps-supply qcom,bt-vdd-xtal-supply
        qcom,cpucc qcom,dispcc qcom,gcc qcom,gpucc qcom,mccc vdd_gx-supply
        vdda18-supply vdda33-supply syscon camss-vdd-supply gpios acd-misc-reset
