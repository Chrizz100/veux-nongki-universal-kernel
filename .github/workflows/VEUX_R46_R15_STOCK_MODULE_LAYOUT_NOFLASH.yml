      shell: bash
      run: |
        set -euo pipefail
        python3 -B "$R16_REPAIR_DIR/Tools/restore_memory_network.py" build \
          --source "$R9_SNAPSHOT" --objout "$R13_OBJOUT" \
          --r6-report "$R47_REPORT_DIR/R47_RESULT.json" \
          --r6-tool "$R47_TOOLS_DIR/Tools/veux_r47_r13_on_r46.py" \
