name: VEUX V4 - Daily Upstream Auto R1

'on':
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * *'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: veux-v4-daily-upstream-auto-main
  cancel-in-progress: false

jobs:
  check:
    name: Daily upstream candidate check
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      updates_found: ${{ steps.upstream.outputs.updates_found }}
    steps:
      - name: Checkout exact main snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Compare validated CURRENT_BUILD with upstream heads
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          COMPONENTS = ('resukisu', 'susfs', 'nomount')
          EXPECTED = {'5.4.274','5.4.292','5.4.293','5.4.300','5.4.301','5.4.302'}
          current = json.loads(Path('common/contracts/CURRENT_BUILD.json').read_text())

          def require(ok, reason):
              if not ok:
                  raise SystemExit('BLOCKED: ' + reason)

          require(current.get('status') == 'compile-package-static-validated',
                  'CURRENT_BUILD is not validated')
          require(current.get('device_pass_inferred') is False,
                  'CURRENT_BUILD inferred device PASS')
          require(set(current.get('lineages', {})) == EXPECTED,
                  'CURRENT_BUILD lineage set changed')
          require(set(current.get('targets', {})) == set(COMPONENTS),
                  'CURRENT_BUILD component set changed')
          require(current['targets']['resukisu'].get('uapi') == 5,
                  'CURRENT_BUILD ReSukiSU is not reviewed UAPI5')

          changed = []
          summary = ['## VEUX daily upstream check', '']
          for name in COMPONENTS:
              row = current['targets'][name]
              commit = row.get('commit', '')
              url = row.get('url', '')
              ref = row.get('ref', '')
              require(re.fullmatch(r'[0-9a-f]{40}', commit) is not None,
                      name + ': current commit invalid')
              require(isinstance(url, str) and url.startswith('https://') and url.endswith('.git'),
                      name + ': current URL invalid')
              require(isinstance(ref, str) and ref.startswith('refs/heads/'),
                      name + ': current ref invalid')
              result = subprocess.run(
                  ['git', '-c', 'http.lowSpeedLimit=1', '-c', 'http.lowSpeedTime=20',
                   'ls-remote', '--exit-code', '--refs', url, ref],
                  text=True, capture_output=True, timeout=60,
                  env=dict(os.environ, GIT_TERMINAL_PROMPT='0'))
              require(result.returncode == 0,
                      name + ': ls-remote failed: ' + result.stderr.strip()[-400:])
              lines = [line.split() for line in result.stdout.splitlines() if line.strip()]
              require(len(lines) == 1 and len(lines[0]) == 2,
                      name + ': upstream ref missing or ambiguous')
              head, returned = lines[0]
              require(returned == ref and re.fullmatch(r'[0-9a-f]{40}', head) is not None,
                      name + ': invalid upstream identity')
              state = 'UPDATE' if head != commit else 'UP TO DATE'
              if head != commit:
                  changed.append(name)
              summary.append(f'- {name}: **{state}** `{commit[:12]}` -> `{head[:12]}`')

          updates = bool(changed)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('updates_found=' + ('true' if updates else 'false') + '\n')
          summary += ['', 'Updates found: **' + ('YES' if updates else 'NO') + '**']
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                  f.write('\n'.join(summary) + '\n')
          print('UPDATES_FOUND=' + ('YES' if updates else 'NO'))
          print('CHANGED_COMPONENTS=' + (','.join(changed) if changed else 'NONE'))
          PY

      - name: Prove check job is read-only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'CHECK_REPOSITORY_MUTATION=NO'

  update:
    name: Build 6-of-6 and promote compatible upstreams
    needs: check
    if: ${{ needs.check.outputs.updates_found == 'true' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Use exact main snapshot
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main "${GITHUB_SHA}"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc binutils bison build-essential ca-certificates curl dwarves file flex git jq \
            libelf-dev libncurses-dev libssl-dev perl python3 python3-venv python3-yaml \
            rsync unzip zip xz-utils zstd
          python3 -m venv "$RUNNER_TEMP/veux-python"
          "$RUNNER_TEMP/veux-python/bin/python" -m pip install --disable-pip-version-check \
            ruamel.yaml==0.19.1 PyYAML==6.0.3

      - name: Verify V4, UAPI5 and device gates
        shell: bash
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/veux-python/bin/python"
          "$PY" common/scripts/test_veux_update_engine.py
          "$PY" common/scripts/test_veux_release.py
          "$PY" common/scripts/test_veux_current_components.py
          "$PY" common/scripts/test_veux_device_fixes.py
          "$PY" common/scripts/test_veux_rpm_fixes.py
          "$PY" common/scripts/test_veux_config_compat.py
          "$PY" common/scripts/test_veux_source_transport.py
          "$PY" common/scripts/test_veux_wakeup_fixes.py
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Resolve reviewed current upstream candidates
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/veux-python/bin/python" -u common/scripts/veux_current_components.py \
            --work "$RUNNER_TEMP/veux-targets"

      - name: Require Fast-Forward candidates and unchanged reviewed UAPI
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/veux-python/bin/python"
          "$PY" - "$RUNNER_TEMP/veux-targets" <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          bundle = Path(sys.argv[1])
          current = json.loads(Path('common/contracts/CURRENT_BUILD.json').read_text())
          candidate = json.loads((bundle / 'targets.json').read_text())
          components = ('resukisu', 'susfs', 'nomount')
          expected = ['5.4.274','5.4.292','5.4.293','5.4.300','5.4.301','5.4.302']

          def require(ok, reason):
              if not ok:
                  raise SystemExit('BLOCKED: ' + reason)

          require(candidate.get('lineages') == expected, 'candidate lineage set/order changed')
          require(set(candidate.get('components', {})) == set(components),
                  'candidate component set changed')
          require(current.get('status') == 'compile-package-static-validated',
                  'current build status changed')
          changed = []
          for name in components:
              old = current['targets'][name]
              new = candidate['components'][name]
              require(new.get('url') == old.get('url'), name + ': source URL changed')
              require(new.get('ref') == old.get('ref'), name + ': tracked ref changed')
              donor = bundle / name
              proc = subprocess.run(
                  ['git', '-C', str(donor), 'merge-base', '--is-ancestor',
                   old['commit'], new['commit']], capture_output=True, text=True)
              require(proc.returncode == 0,
                      name + ': upstream is not a fast-forward from CURRENT_BUILD')
              if new['commit'] != old['commit']:
                  changed.append(name)

          require(current['targets']['resukisu'].get('uapi') == 5,
                  'current ReSukiSU UAPI is not 5')
          require(candidate['components']['resukisu'].get('uapi') == 5,
                  'ReSukiSU UAPI change requires manual review')
          require(changed, 'upstream changed during check/resolve and no candidate remains')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('changed=true\n')
          print('CANDIDATE_FAST_FORWARD=PASS')
          print('CANDIDATE_UAPI5=PASS')
          print('CHANGED_COMPONENTS=' + ','.join(changed))
          print('DEVICE_PASS_INFERRED=NO')
          PY
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build and validate 5.4.274
        id: kernel_5_4_274
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/veux-python/bin/python" -u common/scripts/veux_release_device.py worker \
            --kernel 5.4.274 --bundle "$RUNNER_TEMP/veux-targets" \
            --work "$RUNNER_TEMP/veux-builds/5.4.274" \
            --public "$RUNNER_TEMP/veux-public/5.4.274" \
            --overlays "$RUNNER_TEMP/veux-overlays" --jobs "$(nproc)"

      - name: Publish 5.4.274
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.kernel_5_4_274.outputs.artifact_name }}
          path: ${{ runner.temp }}/veux-public/5.4.274/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Build and validate 5.4.292
        id: kernel_5_4_292
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/veux-python/bin/python" -u common/scripts/veux_release_device.py worker \
            --kernel 5.4.292 --bundle "$RUNNER_TEMP/veux-targets" \
            --work "$RUNNER_TEMP/veux-builds/5.4.292" \
            --public "$RUNNER_TEMP/veux-public/5.4.292" \
            --overlays "$RUNNER_TEMP/veux-overlays" --jobs "$(nproc)"

      - name: Publish 5.4.292
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.kernel_5_4_292.outputs.artifact_name }}
          path: ${{ runner.temp }}/veux-public/5.4.292/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Build and validate 5.4.293
        id: kernel_5_4_293
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/veux-python/bin/python" -u common/scripts/veux_release_device.py worker \
            --kernel 5.4.293 --bundle "$RUNNER_TEMP/veux-targets" \
            --work "$RUNNER_TEMP/veux-builds/5.4.293" \
            --public "$RUNNER_TEMP/veux-public/5.4.293" \
            --overlays "$RUNNER_TEMP/veux-overlays" --jobs "$(nproc)"

      - name: Publish 5.4.293
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.kernel_5_4_293.outputs.artifact_name }}
          path: ${{ runner.temp }}/veux-public/5.4.293/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Build and validate 5.4.300
        id: kernel_5_4_300
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/veux-python/bin/python" -u common/scripts/veux_release_device.py worker \
            --kernel 5.4.300 --bundle "$RUNNER_TEMP/veux-targets" \
            --work "$RUNNER_TEMP/veux-builds/5.4.300" \
            --public "$RUNNER_TEMP/veux-public/5.4.300" \
            --overlays "$RUNNER_TEMP/veux-overlays" --jobs "$(nproc)"

      - name: Publish 5.4.300
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.kernel_5_4_300.outputs.artifact_name }}
          path: ${{ runner.temp }}/veux-public/5.4.300/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Build and validate 5.4.301
        id: kernel_5_4_301
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/veux-python/bin/python" -u common/scripts/veux_release_device.py worker \
            --kernel 5.4.301 --bundle "$RUNNER_TEMP/veux-targets" \
            --work "$RUNNER_TEMP/veux-builds/5.4.301" \
            --public "$RUNNER_TEMP/veux-public/5.4.301" \
            --overlays "$RUNNER_TEMP/veux-overlays" --jobs "$(nproc)"

      - name: Publish 5.4.301
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.kernel_5_4_301.outputs.artifact_name }}
          path: ${{ runner.temp }}/veux-public/5.4.301/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Build and validate 5.4.302
        id: kernel_5_4_302
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/veux-python/bin/python" -u common/scripts/veux_release_device.py worker \
            --kernel 5.4.302 --bundle "$RUNNER_TEMP/veux-targets" \
            --work "$RUNNER_TEMP/veux-builds/5.4.302" \
            --public "$RUNNER_TEMP/veux-public/5.4.302" \
            --overlays "$RUNNER_TEMP/veux-overlays" --jobs "$(nproc)"

      - name: Publish 5.4.302
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.kernel_5_4_302.outputs.artifact_name }}
          path: ${{ runner.temp }}/veux-public/5.4.302/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Require 6-of-6 before automatic promotion
        shell: bash
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/veux-python/bin/python"
          "$PY" - "$RUNNER_TEMP/veux-targets" "$RUNNER_TEMP/veux-public" <<'PY'
          import json
          from pathlib import Path
          from types import SimpleNamespace
          import sys

          sys.path.insert(0, str(Path.cwd() / 'common/scripts'))
          import veux_release_device as release

          bundle = Path(sys.argv[1])
          artifacts = Path(sys.argv[2])
          release.verify_results(SimpleNamespace(bundle=bundle, artifacts=artifacts))
          targets = json.loads((bundle / 'targets.json').read_text())
          expected = ['5.4.274','5.4.292','5.4.293','5.4.300','5.4.301','5.4.302']
          if targets.get('lineages') != expected:
              raise SystemExit('BLOCKED: lineage set/order changed')
          if targets['components']['resukisu'].get('uapi') != 5:
              raise SystemExit('BLOCKED: candidate ReSukiSU is not reviewed UAPI5')
          for kernel in expected:
              row = json.loads((artifacts / kernel / 'RESULT.json').read_text())
              if not all(row.get(k) is True for k in ('compile','package','static_boot')):
                  raise SystemExit('BLOCKED: incomplete validation: ' + kernel)
              if row.get('device') is not False:
                  raise SystemExit('BLOCKED: CI inferred device PASS: ' + kernel)
              if row.get('targets') != targets['components']:
                  raise SystemExit('BLOCKED: component set differs: ' + kernel)
          print('DAILY_UPSTREAM_PREPROMOTION=PASS')
          print('LINEAGES=6/6')
          print('DEVICE_PASS_INFERRED=NO')
          PY
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Promote validated compatible upstreams to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH_HEADER"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH_HEADER"
          "$RUNNER_TEMP/veux-python/bin/python" -u common/scripts/veux_release_device.py promote \
            --bundle "$RUNNER_TEMP/veux-targets" \
            --artifacts "$RUNNER_TEMP/veux-public" \
            --overlays "$RUNNER_TEMP/veux-overlays" \
            --output "$RUNNER_TEMP/veux-promotion"

      - name: Verify promoted CURRENT_BUILD and remote main
        shell: bash
        run: |
          set -euo pipefail
          PY="$RUNNER_TEMP/veux-python/bin/python"
          "$PY" - "$RUNNER_TEMP/veux-targets/targets.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          candidate = json.loads(Path(sys.argv[1]).read_text())
          current = json.loads(Path('common/contracts/CURRENT_BUILD.json').read_text())
          expected = {'5.4.274','5.4.292','5.4.293','5.4.300','5.4.301','5.4.302'}
          if current.get('status') != 'compile-package-static-validated':
              raise SystemExit('BLOCKED: promoted CURRENT_BUILD status invalid')
          if current.get('repository_mutation') is not True:
              raise SystemExit('BLOCKED: promotion not recorded')
          if current.get('device_pass_inferred') is not False:
              raise SystemExit('BLOCKED: promoted CURRENT_BUILD inferred device PASS')
          if set(current.get('lineages', {})) != expected:
              raise SystemExit('BLOCKED: promoted lineage set changed')
          if current.get('targets') != candidate.get('components'):
              raise SystemExit('BLOCKED: promoted components differ from candidate')
          if current['targets']['resukisu'].get('uapi') != 5:
              raise SystemExit('BLOCKED: promoted ReSukiSU is not reviewed UAPI5')
          print('DAILY_UPSTREAM_PROMOTION=PASS')
          print('CURRENT_BUILD=6_OF_6')
          print('DEVICE_PASS_INFERRED=NO')
          PY
          LOCAL_HEAD="$(git rev-parse HEAD)"
          REMOTE_HEAD="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$REMOTE_HEAD"
          test "$LOCAL_HEAD" = "$REMOTE_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'REMOTE_MAIN_PROMOTION=PASS'

      - name: Publish promotion proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: VEUX-Daily-Upstream-Promotion-Proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/veux-promotion/PROMOTION-READY.json
            common/contracts/CURRENT_BUILD.json
            common/upstream/resukisu/current.json
            common/upstream/susfs/current.json
            common/upstream/nomount/current.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Publish failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: VEUX-Daily-Upstream-Diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/veux-builds/diagnostics/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
