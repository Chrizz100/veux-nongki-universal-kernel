name: VEUX U6-O53 v2 All Six ReSukiSU 35158 Static Boot Fail-Closed Recheck

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: veux-u6-o53-v2-static-recheck-35158-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: Chrizz100/veux-nongki-universal-kernel

  O53V1_RUN_ID: '35499408928'
  O53V1_HEAD_SHA: 6cbdf81af8650cd400180a1eaddca9b9c6ea6093
  O53V1_ARTIFACT_ID: '10601802164'
  O53V1_ARTIFACT_NAME: VEUX-U6-O53V1-ReSukiSU-35158-ALL-SIX-STATIC-BOOT-35499408928
  O53V1_ARTIFACT_SHA256: 7190afc612a1f74e9c503152ee84db6e9f16374a907ce90e0809d0ae821dd377

  O52_RUN_ID: '35497490635'
  O52_HEAD_SHA: f569708ff1ad8c53aaf6cefd5a3ca763ceac37ff
  O52_ARTIFACT_ID: '10601347053'
  O52_ARTIFACT_NAME: VEUX-U6-O52V1-ReSukiSU-35158-ALL-SIX-AK3-35497490635
  O52_ARTIFACT_SHA256: 0c1244aec5a60f42c232611df0e05d32b95898afdca50a9baea81dae0e72590b

  RESUKISU_COMMIT: 6d18926ae6eeb571a04c1ce7552c324d606fa9d8
  RESUKISU_SHORT: 6d18926a
  RESUKISU_VERSION: '35158'
  RESUKISU_UAPI: '4'
  SUSFS_COMMIT: 04a9d713106191ba98be680bd7ad9547ab1de964
  SUSFS_VERSION: v2.3.0

  IMAGE_SHA_274: 4959838b9cc49f693080e60b917cc839b5bd873e4f38b20c8d39d72973b8a85d
  IMAGE_SHA_292: cebdc135d154e88f8f8c08b3e44181470c56a45f054537e96a5d1b6dbcca952a
  IMAGE_SHA_293: 7d3b0f6200a1cecb0d6675318fc35f21e8bc8657b67437c1382a3ef4d735919d
  IMAGE_SHA_300: 09bf533d83c3c140b8c7837883ced6291615e5bfc42efa51c4dc298a982394e0
  IMAGE_SHA_301: 4de18f2ef3ca32a59e06380309bbef8f061b7729543dac53304c4f985ff5e394
  IMAGE_SHA_302: faf2bac3e43e1e05f4703cef69158f9c18961a572d8e8789999bd0e0cb073761

  IMAGE_BYTES_274: '29843968'
  IMAGE_BYTES_292: '33925632'
  IMAGE_BYTES_293: '33925632'
  IMAGE_BYTES_300: '29911552'
  IMAGE_BYTES_301: '29911552'
  IMAGE_BYTES_302: '29911552'

  AK3_SHA_274: 3e5851bfc63bc817d9b10ee81c154eb51f83bad0f0d9fb767018019c772f6f93
  AK3_SHA_292: 9df5b4533b9b933825fc4e318861ff575fdc793086c4c65e7696a5ae35099fe7
  AK3_SHA_293: 404f55333f2397398967414bc354d9dd439f5c8ecc61ded601f7d804ac74d777
  AK3_SHA_300: 8340c3798b613d64fddb2c7e601bab843438932c305e05272a5b252d163f9069
  AK3_SHA_301: a55369a58050252fa43990e5e9202c228d066f4e109dae4a7d005c2696667366
  AK3_SHA_302: a0b3edc93d7c5d04f5a08a9d889eda92b1c01a68651b413a5158b84d0e48312d

  BOOT_SHA_274: 6bf0bca708a39bbb8a95bef52438d91ff0ee3851e002b12029800f44dca5cd43
  BOOT_SHA_292: fa0f31fb3ffb8fa68243d4ea6c4fb142cadec4d7d3d7cc20fdc3a7b43741e5c5
  BOOT_SHA_293: dbb5bc939df3e18d60e88296b0c5c98c354fda1f90887def62711c0144068842
  BOOT_SHA_300: 66859a66ef1e9d5764080dae7e24749bf544c5c61279983b61db2771ae0bb027
  BOOT_SHA_301: 97dc2e59a0d09e6c3a6a4adccb6df05788984680398adf6db94f906a7d992d30
  BOOT_SHA_302: dd34cfea469af01abf05d1253b00dacece085562b13f8cd005d38df1106a1a19

  BASE_BOOT_URL: https://github.com/Chrizz100/veux-nongki-universal-kernel/releases/download/v1.0.0-beta1/VEUX-5.4.302-ReSukiSU-35157-UAPI4-SUSFS-2.3.0-BOOTTEST.img
  BASE_BOOT_SHA256: b79d121003e9abb12962eaf44ff56aa4c66588d2245ed09d8325e3c39fe67e65
  BASE_KERNEL_SHA256: 67807748edd57e9fa714d444a39fccf54d88b95c92d54de029b4c12bc868345a
  BASE_KERNEL_BYTES: '29911552'
  RAW_STOCK_RAMDISK_SHA256: 0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a
  DECODED_STOCK_RAMDISK_SHA256: d3c0e26ce76ab272a9c7bfd53ad3b0f57754e8eb9a30085abfbacf180c2638e5
  BOOT_PARTITION_SIZE: '134217728'
  EXPECTED_HEADER_VERSION: '3'
  BOOT_PAGE_SIZE: '4096'

  MAGISK_APK_URL: https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk
  MAGISK_APK_SHA256: e0d32d2123532860f97123d927b1bb86c4e08e6fd8a48bfc6b5bee0afae9ebd5

  AVB_REPO: https://android.googlesource.com/platform/external/avb
  AVB_COMMIT: de53827b226bccef7407e4c253b0152e8d9f8e04

jobs:
  static-recheck:
    name: Fail-closed recheck of all six static boot images
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Repository identity gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"

      - name: Checkout current project read-only
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install recheck dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl file git jq python3 unzip

      - name: Initialize fail-closed helpers
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$GITHUB_WORKSPACE/o53v2-aggregate" \
            "$RUNNER_TEMP/o53v2-work" \
            "$RUNNER_TEMP/o53v1-source" \
            "$RUNNER_TEMP/o52-source"
          rm -f "$RUNNER_TEMP/o53v1-source.zip" "$RUNNER_TEMP/o52-source.zip"

          mkdir -p \
            "$GITHUB_WORKSPACE/o53v2-aggregate/boots" \
            "$GITHUB_WORKSPACE/o53v2-aggregate/audit" \
            "$RUNNER_TEMP/o53v2-work" \
            "$RUNNER_TEMP/o53v1-source" \
            "$RUNNER_TEMP/o52-source"

          cat > "$GITHUB_WORKSPACE/o53v2-aggregate/audit/00-PLAN.txt" <<'EOF'
          VEUX U6-O53 v2
          O53 v1 is not accepted as a static certification authority because its
          avbtool verify_image failures were masked by Bash conditional errexit semantics.

          v2 does not rebuild the six boot images.
          It authenticates the exact v1 boot-image bytes and independently rechecks them.

          Critical correction:
          avbtool verify_image receives a same-directory alias named boot.img, matching
          the AVB boot hash descriptor. The verifier runs in a separate fail-closed shell.

          Every image must independently pass:
          - exact O52 AK3/Image binding
          - exact O53-v1 boot SHA-256
          - AVB info and verify_image with zero exit status and no traceback
          - preserved AVB salt and properties
          - exact raw stock ramdisk identity
          - exact decoded stock ramdisk identity
          - exact target kernel after re-extraction
          - Android boot header v3 mutation scope
          - ReSukiSU 35158 identity strings

          DEVICE_PASS remains NO.
          EOF

          cat > "$RUNNER_TEMP/o53v2-base-header.py" <<'PY'
          import struct, sys
          p = sys.argv[1]
          expected_ver = int(sys.argv[2])
          expected_kernel = int(sys.argv[3])
          page = int(sys.argv[4])
          b = open(p, 'rb').read(page)
          if len(b) != page or b[:8] != b'ANDROID!':
              raise SystemExit('invalid boot header page')
          ks = struct.unpack_from('<I', b, 8)[0]
          rs = struct.unpack_from('<I', b, 12)[0]
          hs = struct.unpack_from('<I', b, 20)[0]
          hv = struct.unpack_from('<I', b, 40)[0]
          if ks != expected_kernel or hv != expected_ver or rs <= 0 or hs <= 0:
              raise SystemExit('base boot header contract mismatch')
          print(f'KERNEL_SIZE={ks}')
          print(f'RAMDISK_SIZE={rs}')
          print(f'HEADER_SIZE={hs}')
          print(f'HEADER_VERSION={hv}')
          PY

          cat > "$RUNNER_TEMP/o53v2-avb-props.py" <<'PY'
          import re, sys
          src, dst = sys.argv[1:3]
          props = []
          for line in open(src, encoding='utf-8'):
              m = re.match(r"\s*Prop:\s+(.+?)\s+->\s+'(.*)'\s*$", line.rstrip('\n'))
              if m:
                  props.append((m.group(1), m.group(2)))
          if not props:
              raise SystemExit('AVB properties missing')
          with open(dst, 'w', encoding='utf-8') as f:
              for key, value in sorted(props):
                  f.write(f'{key}\t{value}\n')
          PY

          cat > "$RUNNER_TEMP/o53v2-header-check.py" <<'PY'
          import struct, sys
          base_path, final_path = sys.argv[1], sys.argv[2]
          expected_ver = int(sys.argv[3])
          expected_kernel = int(sys.argv[4])
          expected_ramdisk = int(sys.argv[5])
          page = int(sys.argv[6])
          base_kernel = int(sys.argv[7])

          base = bytearray(open(base_path, 'rb').read(page))
          final = bytearray(open(final_path, 'rb').read(page))
          if len(base) != page or len(final) != page:
              raise SystemExit('short header page')
          if base[:8] != b'ANDROID!' or final[:8] != b'ANDROID!':
              raise SystemExit('boot magic mismatch')

          ks = struct.unpack_from('<I', final, 8)[0]
          rs = struct.unpack_from('<I', final, 12)[0]
          hs = struct.unpack_from('<I', final, 20)[0]
          hv = struct.unpack_from('<I', final, 40)[0]

          if ks != expected_kernel:
              raise SystemExit(f'kernel size mismatch {ks} != {expected_kernel}')
          if rs != expected_ramdisk:
              raise SystemExit(f'ramdisk size mismatch {rs} != {expected_ramdisk}')
          if hv != expected_ver or hs <= 0:
              raise SystemExit('header-v3 contract mismatch')

          base_masked = bytearray(base)
          final_masked = bytearray(final)
          base_masked[8:12] = b'\0' * 4
          final_masked[8:12] = b'\0' * 4
          if base_masked != final_masked:
              diffs = [i for i, (a, b) in enumerate(zip(base_masked, final_masked)) if a != b]
              raise SystemExit(f'unexpected header changes {diffs[:32]}')

          if expected_kernel == base_kernel and base != final:
              raise SystemExit('same-size target changed header page')

          print('BOOT_MAGIC=PASS')
          print(f'HEADER_VERSION={hv}')
          print(f'HEADER_SIZE={hs}')
          print(f'KERNEL_SIZE={ks}')
          print(f'RAMDISK_SIZE={rs}')
          print('HEADER_BYTES_EXCEPT_KERNEL_SIZE=IDENTICAL')
          if expected_kernel == base_kernel:
              print('FULL_HEADER_PAGE_IDENTITY=PASS')
          else:
              print('ONLY_KERNEL_SIZE_HEADER_FIELD_CHANGE=PASS')
          PY

          python3 -m py_compile \
            "$RUNNER_TEMP/o53v2-base-header.py" \
            "$RUNNER_TEMP/o53v2-avb-props.py" \
            "$RUNNER_TEMP/o53v2-header-check.py"

      - name: Authenticate O53 v1 and O52 source artifacts
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          audit="$GITHUB_WORKSPACE/o53v2-aggregate/audit"

          api_get() {
            local url="$1" output="$2"
            curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_READ_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$output"
          }

          authenticate_artifact() {
            local run_id="$1"
            local head_sha="$2"
            local artifact_id="$3"
            local artifact_name="$4"
            local artifact_sha="$5"
            local out_zip="$6"
            local out_dir="$7"
            local label="$8"

            local run_json="$RUNNER_TEMP/o53v2-work/${label}-run.json"
            local artifact_json="$RUNNER_TEMP/o53v2-work/${label}-artifact.json"

            api_get \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              "$run_json"
            jq -e \
              --arg head "$head_sha" \
              '.status == "completed" and .conclusion == "success" and .head_sha == $head' \
              "$run_json" >/dev/null

            api_get \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              "$artifact_json"
            jq -e \
              --arg name "$artifact_name" \
              --arg digest "sha256:$artifact_sha" \
              --argjson run "$run_id" \
              '.expired == false and .name == $name and .digest == $digest and .workflow_run.id == $run' \
              "$artifact_json" >/dev/null

            api_get \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              "$out_zip"

            test -s "$out_zip"
            test "$(sha256sum "$out_zip" | awk '{print $1}')" = "$artifact_sha"
            unzip -q "$out_zip" -d "$out_dir"
            (
              cd "$out_dir"
              sha256sum -c SHA256SUMS.txt
            ) > "$audit/${label}-SHA256-CHECK.txt"
          }

          authenticate_artifact \
            "$O53V1_RUN_ID" "$O53V1_HEAD_SHA" \
            "$O53V1_ARTIFACT_ID" "$O53V1_ARTIFACT_NAME" "$O53V1_ARTIFACT_SHA256" \
            "$RUNNER_TEMP/o53v1-source.zip" "$RUNNER_TEMP/o53v1-source" "O53V1"

          authenticate_artifact \
            "$O52_RUN_ID" "$O52_HEAD_SHA" \
            "$O52_ARTIFACT_ID" "$O52_ARTIFACT_NAME" "$O52_ARTIFACT_SHA256" \
            "$RUNNER_TEMP/o52-source.zip" "$RUNNER_TEMP/o52-source" "O52"

          echo "O53V1_ARTIFACT_AUTH=PASS"
          echo "O52_ARTIFACT_AUTH=PASS"

      - name: Install pinned MagiskBoot and AOSP avbtool
        shell: bash
        run: |
          set -euo pipefail

          work="$RUNNER_TEMP/o53v2-work"
          audit="$GITHUB_WORKSPACE/o53v2-aggregate/audit"

          apk="$work/Magisk-v30.7.apk"
          curl --fail --location --retry 3 "$MAGISK_APK_URL" -o "$apk"
          test "$(sha256sum "$apk" | awk '{print $1}')" = "$MAGISK_APK_SHA256"

          mapfile -t candidates < <(
            zipinfo -1 "$apk" | grep -E '^lib/x86_64/(lib)?magiskboot(\.so)?$'
          )
          test "${#candidates[@]}" -eq 1
          unzip -p "$apk" "${candidates[0]}" > "$work/magiskboot"
          chmod 0755 "$work/magiskboot"
          file "$work/magiskboot" > "$audit/TOOLS-MAGISKBOOT.txt"
          grep -Eq 'ELF 64-bit.*x86-64|ELF 64-bit.*x86_64' "$audit/TOOLS-MAGISKBOOT.txt"

          avb="$work/avb"
          git init -q "$avb"
          git -C "$avb" remote add origin "$AVB_REPO"
          git -C "$avb" fetch -q --depth=1 origin "$AVB_COMMIT"
          git -C "$avb" checkout -q --detach FETCH_HEAD
          test "$(git -C "$avb" rev-parse HEAD)" = "$AVB_COMMIT"
          python3 "$avb/avbtool.py" version > "$audit/TOOLS-AVBTOOL.txt"

          echo "TOOLS_AUTH=PASS"

      - name: Authenticate boot-v3 reference
        shell: bash
        run: |
          set -euo pipefail

          work="$RUNNER_TEMP/o53v2-work"
          audit="$GITHUB_WORKSPACE/o53v2-aggregate/audit"
          base="$work/base.img"
          mb="$work/magiskboot"
          avb="$work/avb/avbtool.py"

          curl --fail --location --retry 3 "$BASE_BOOT_URL" -o "$base"
          test "$(stat -c '%s' "$base")" = "$BOOT_PARTITION_SIZE"
          test "$(sha256sum "$base" | awk '{print $1}')" = "$BASE_BOOT_SHA256"

          python3 "$RUNNER_TEMP/o53v2-base-header.py" \
            "$base" "$EXPECTED_HEADER_VERSION" "$BASE_KERNEL_BYTES" "$BOOT_PAGE_SIZE" \
            > "$audit/BASE-HEADER.txt"

          base_ramdisk_bytes="$(sed -n 's/^RAMDISK_SIZE=//p' "$audit/BASE-HEADER.txt")"
          test -n "$base_ramdisk_bytes"

          python3 "$avb" info_image --image "$base" > "$audit/BASE-AVB.txt"
          grep -Eq '^Algorithm:[[:space:]]+NONE$' "$audit/BASE-AVB.txt"
          grep -Eq '^[[:space:]]*Partition Name:[[:space:]]+boot$' "$audit/BASE-AVB.txt"
          grep -Eq '^[[:space:]]*Hash Algorithm:[[:space:]]+sha256$' "$audit/BASE-AVB.txt"

          salt="$(
            sed -n 's/^[[:space:]]*Salt:[[:space:]]*//p' "$audit/BASE-AVB.txt" \
              | head -1 | tr 'A-F' 'a-f'
          )"
          test -n "$salt"
          [[ "$salt" =~ ^[0-9a-f]+$ ]]

          python3 "$RUNNER_TEMP/o53v2-avb-props.py" \
            "$audit/BASE-AVB.txt" "$audit/BASE-AVB-PROPS.txt"

          mkdir -p "$work/base-raw" "$work/base-decoded"
          (
            cd "$work/base-raw"
            "$mb" unpack -n -h "$base" > "$audit/BASE-RAW-UNPACK.txt" 2>&1
          )
          (
            cd "$work/base-decoded"
            "$mb" unpack -h "$base" > "$audit/BASE-DECODED-UNPACK.txt" 2>&1
          )

          test "$(sha256sum "$work/base-raw/kernel" | awk '{print $1}')" = "$BASE_KERNEL_SHA256"
          test "$(sha256sum "$work/base-raw/ramdisk.cpio" | awk '{print $1}')" = "$RAW_STOCK_RAMDISK_SHA256"
          test "$(sha256sum "$work/base-decoded/ramdisk.cpio" | awk '{print $1}')" = "$DECODED_STOCK_RAMDISK_SHA256"

          echo "AVB_SALT=$salt" >> "$GITHUB_ENV"
          echo "BASE_RAMDISK_BYTES=$base_ramdisk_bytes" >> "$GITHUB_ENV"
          echo "BOOT_V3_REFERENCE_AUTH=PASS"

      - name: Write isolated fail-closed verifier
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/o53v2-verify-one.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          : "${KERNEL:?}"
          : "${EXPECTED_IMAGE_SHA:?}"
          : "${EXPECTED_IMAGE_BYTES:?}"
          : "${EXPECTED_AK3_SHA:?}"
          : "${EXPECTED_BOOT_SHA:?}"

          o53="$RUNNER_TEMP/o53v1-source"
          o52="$RUNNER_TEMP/o52-source"
          work="$RUNNER_TEMP/o53v2-work"
          aggregate="$GITHUB_WORKSPACE/o53v2-aggregate"
          audit="$aggregate/audit/$KERNEL"
          dist="$aggregate/boots/$KERNEL"

          mb="$work/magiskboot"
          avb="$work/avb/avbtool.py"
          base="$work/base.img"

          package="$o52/packages/$KERNEL/VEUX-${KERNEL}-ReSukiSU-35158-UAPI4-SUSFS-2.3.0-AK3.zip"
          source_boot="$o53/boots/$KERNEL/VEUX-${KERNEL}-ReSukiSU-35158-UAPI4-SUSFS-2.3.0-BOOTTEST.img"
          final="$dist/VEUX-${KERNEL}-ReSukiSU-35158-UAPI4-SUSFS-2.3.0-BOOTTEST.img"

          rm -rf "$audit" "$dist" "$work/check-$KERNEL"
          mkdir -p "$audit" "$dist" "$work/check-$KERNEL"

          test -s "$package"
          test -s "$source_boot"
          test "$(sha256sum "$package" | awk '{print $1}')" = "$EXPECTED_AK3_SHA"
          test "$(sha256sum "$source_boot" | awk '{print $1}')" = "$EXPECTED_BOOT_SHA"
          test "$(stat -c '%s' "$source_boot")" = "$BOOT_PARTITION_SIZE"

          unzip -tq "$package"
          unzip -p "$package" Image > "$work/check-$KERNEL/ak3-Image"
          test "$(stat -c '%s' "$work/check-$KERNEL/ak3-Image")" = "$EXPECTED_IMAGE_BYTES"
          test "$(sha256sum "$work/check-$KERNEL/ak3-Image" | awk '{print $1}')" = "$EXPECTED_IMAGE_SHA"

          # AVB verifier resolves the boot hash descriptor by partition filename.
          # Provide the required same-directory boot.img alias without modifying bytes.
          verify_dir="$work/check-$KERNEL/avb-verify"
          mkdir -p "$verify_dir"
          ln -s "$source_boot" "$verify_dir/boot.img"

          python3 "$avb" info_image --image "$verify_dir/boot.img" > "$audit/01-AVB-INFO.txt"
          python3 "$avb" verify_image --image "$verify_dir/boot.img" \
            > "$audit/01-AVB-VERIFY.txt" 2>&1

          ! grep -Fq 'Traceback' "$audit/01-AVB-VERIFY.txt"
          grep -Fq 'Successfully verified footer' "$audit/01-AVB-VERIFY.txt"

          grep -Eq '^Algorithm:[[:space:]]+NONE$' "$audit/01-AVB-INFO.txt"
          grep -Eq '^[[:space:]]*Partition Name:[[:space:]]+boot$' "$audit/01-AVB-INFO.txt"
          grep -Eq '^[[:space:]]*Hash Algorithm:[[:space:]]+sha256$' "$audit/01-AVB-INFO.txt"

          final_salt="$(
            sed -n 's/^[[:space:]]*Salt:[[:space:]]*//p' "$audit/01-AVB-INFO.txt" \
              | head -1 | tr 'A-F' 'a-f'
          )"
          test "$final_salt" = "$AVB_SALT"

          python3 "$RUNNER_TEMP/o53v2-avb-props.py" \
            "$audit/01-AVB-INFO.txt" "$audit/01-AVB-PROPS.txt"
          cmp -s "$aggregate/audit/BASE-AVB-PROPS.txt" "$audit/01-AVB-PROPS.txt"

          mkdir -p "$work/check-$KERNEL/raw" "$work/check-$KERNEL/decoded"
          (
            cd "$work/check-$KERNEL/raw"
            "$mb" unpack -n -h "$source_boot" > "$audit/02-RAW-UNPACK.txt" 2>&1
          )
          (
            cd "$work/check-$KERNEL/decoded"
            "$mb" unpack -h "$source_boot" > "$audit/02-DECODED-UNPACK.txt" 2>&1
          )

          test "$(stat -c '%s' "$work/check-$KERNEL/raw/kernel")" = "$EXPECTED_IMAGE_BYTES"
          test "$(sha256sum "$work/check-$KERNEL/raw/kernel" | awk '{print $1}')" = "$EXPECTED_IMAGE_SHA"
          test "$(sha256sum "$work/check-$KERNEL/decoded/kernel" | awk '{print $1}')" = "$EXPECTED_IMAGE_SHA"

          test "$(sha256sum "$work/check-$KERNEL/raw/ramdisk.cpio" | awk '{print $1}')" = "$RAW_STOCK_RAMDISK_SHA256"
          test "$(sha256sum "$work/check-$KERNEL/decoded/ramdisk.cpio" | awk '{print $1}')" = "$DECODED_STOCK_RAMDISK_SHA256"
          cmp -s "$work/base-raw/ramdisk.cpio" "$work/check-$KERNEL/raw/ramdisk.cpio"
          cmp -s "$work/base-decoded/ramdisk.cpio" "$work/check-$KERNEL/decoded/ramdisk.cpio"

          python3 "$RUNNER_TEMP/o53v2-header-check.py" \
            "$base" "$source_boot" "$EXPECTED_HEADER_VERSION" "$EXPECTED_IMAGE_BYTES" \
            "$BASE_RAMDISK_BYTES" "$BOOT_PAGE_SIZE" "$BASE_KERNEL_BYTES" \
            > "$audit/03-HEADER-CONTRACT.txt"

          grep -aFq "Linux version $KERNEL" "$work/check-$KERNEL/raw/kernel"
          grep -aFq "v4.2.0-rc2-$RESUKISU_SHORT" "$work/check-$KERNEL/raw/kernel"
          grep -aFq '@ReSukiSU' "$work/check-$KERNEL/raw/kernel"

          cp "$source_boot" "$final"
          test "$(sha256sum "$final" | awk '{print $1}')" = "$EXPECTED_BOOT_SHA"

          {
            echo "KERNEL=$KERNEL"
            echo "O53V1_BOOT_SHA256=$EXPECTED_BOOT_SHA"
            echo "O52_AK3_SHA256=$EXPECTED_AK3_SHA"
            echo "IMAGE_SHA256=$EXPECTED_IMAGE_SHA"
            echo "IMAGE_BYTES=$EXPECTED_IMAGE_BYTES"
            echo "BOOT_BYTES=$BOOT_PARTITION_SIZE"
            echo "RESUKISU_COMMIT=$RESUKISU_COMMIT"
            echo "RESUKISU_VERSION=$RESUKISU_VERSION"
            echo "UAPI=$RESUKISU_UAPI"
            echo "SUSFS_VERSION=$SUSFS_VERSION"
            echo "SUSFS_COMMIT=$SUSFS_COMMIT"
            echo "MODULE_LOAD_FILTER=EXCLUDED"
            echo "O53V1_BOOT_BYTE_IDENTITY=PASS"
            echo "O52_AK3_TO_BOOT_KERNEL_BINDING=PASS"
            echo "AVB_VERIFY_IMAGE_EXIT_ZERO=PASS"
            echo "AVB_VERIFY_NO_TRACEBACK=PASS"
            echo "AVB_PROPERTIES_PRESERVED=PASS"
            echo "RAW_RAMDISK_BYTE_IDENTITY=PASS"
            echo "DECODED_RAMDISK_BYTE_IDENTITY=PASS"
            echo "BOOT_HEADER_V3=PASS"
            echo "BOOT_HEADER_MUTATION_SCOPE=PASS"
            echo "KERNEL_IDENTITY_STRINGS=PASS"
            echo "PACKAGE_PASS=YES_FROM_O52"
            echo "STATIC_BOOT_PATH_PASS=PASS"
            echo "DEVICE_PASS=NO"
          } > "$audit/FINAL-RESULT.txt"
          SH

          chmod 0755 "$RUNNER_TEMP/o53v2-verify-one.sh"
          bash -n "$RUNNER_TEMP/o53v2-verify-one.sh"

      - name: Fail-closed recheck all six exact boot images
        id: recheck
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          declare -A image_sha image_bytes ak3_sha boot_sha
          image_sha["5.4.274"]="$IMAGE_SHA_274"
          image_sha["5.4.292"]="$IMAGE_SHA_292"
          image_sha["5.4.293"]="$IMAGE_SHA_293"
          image_sha["5.4.300"]="$IMAGE_SHA_300"
          image_sha["5.4.301"]="$IMAGE_SHA_301"
          image_sha["5.4.302"]="$IMAGE_SHA_302"

          image_bytes["5.4.274"]="$IMAGE_BYTES_274"
          image_bytes["5.4.292"]="$IMAGE_BYTES_292"
          image_bytes["5.4.293"]="$IMAGE_BYTES_293"
          image_bytes["5.4.300"]="$IMAGE_BYTES_300"
          image_bytes["5.4.301"]="$IMAGE_BYTES_301"
          image_bytes["5.4.302"]="$IMAGE_BYTES_302"

          ak3_sha["5.4.274"]="$AK3_SHA_274"
          ak3_sha["5.4.292"]="$AK3_SHA_292"
          ak3_sha["5.4.293"]="$AK3_SHA_293"
          ak3_sha["5.4.300"]="$AK3_SHA_300"
          ak3_sha["5.4.301"]="$AK3_SHA_301"
          ak3_sha["5.4.302"]="$AK3_SHA_302"

          boot_sha["5.4.274"]="$BOOT_SHA_274"
          boot_sha["5.4.292"]="$BOOT_SHA_292"
          boot_sha["5.4.293"]="$BOOT_SHA_293"
          boot_sha["5.4.300"]="$BOOT_SHA_300"
          boot_sha["5.4.301"]="$BOOT_SHA_301"
          boot_sha["5.4.302"]="$BOOT_SHA_302"

          failures=0
          for kernel in 5.4.274 5.4.292 5.4.293 5.4.300 5.4.301 5.4.302; do
            echo "===== O53 V2 RECHECK START $kernel ====="

            if env \
              KERNEL="$kernel" \
              EXPECTED_IMAGE_SHA="${image_sha[$kernel]}" \
              EXPECTED_IMAGE_BYTES="${image_bytes[$kernel]}" \
              EXPECTED_AK3_SHA="${ak3_sha[$kernel]}" \
              EXPECTED_BOOT_SHA="${boot_sha[$kernel]}" \
              bash "$RUNNER_TEMP/o53v2-verify-one.sh"
            then
              echo "===== O53 V2 RECHECK PASS $kernel ====="
            else
              rc=$?
              failures=$((failures + 1))
              mkdir -p "$GITHUB_WORKSPACE/o53v2-aggregate/audit/$kernel"
              {
                echo "KERNEL=$kernel"
                echo "RECHECK=FAIL"
                echo "FAILURE_RC=$rc"
                echo "STATIC_BOOT_PATH_PASS=NO"
                echo "DEVICE_PASS=NO"
              } > "$GITHUB_WORKSPACE/o53v2-aggregate/audit/$kernel/FAILURE.txt"
              echo "===== O53 V2 RECHECK FAIL $kernel rc=$rc ====="
            fi
          done

          echo "O53V2_FAILURE_COUNT=$failures" \
            | tee "$GITHUB_WORKSPACE/o53v2-aggregate/audit/RECHECK-LOOP.txt"

          test "$failures" = 0

      - name: Finalize O53 v2 certification aggregate
        if: always()
        shell: bash
        env:
          RECHECK_OUTCOME: ${{ steps.recheck.outcome }}
        run: |
          set -euo pipefail

          aggregate="$GITHUB_WORKSPACE/o53v2-aggregate"
          audit="$aggregate/audit"

          {
            echo "RECHECK_STEP_OUTCOME=$RECHECK_OUTCOME"
            echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
            echo "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "O53V1_RUN_ID=$O53V1_RUN_ID"
            echo "O53V1_ARTIFACT_ID=$O53V1_ARTIFACT_ID"
            echo "O53V1_ARTIFACT_SHA256=$O53V1_ARTIFACT_SHA256"
            echo "O52_RUN_ID=$O52_RUN_ID"
            echo "O52_ARTIFACT_ID=$O52_ARTIFACT_ID"
            echo "O52_ARTIFACT_SHA256=$O52_ARTIFACT_SHA256"
            echo "RESUKISU_COMMIT=$RESUKISU_COMMIT"
            echo "RESUKISU_VERSION=$RESUKISU_VERSION"
            echo "UAPI=$RESUKISU_UAPI"
            echo "SUSFS_VERSION=$SUSFS_VERSION"
            echo "SUSFS_COMMIT=$SUSFS_COMMIT"
            echo "MODULE_LOAD_FILTER=EXCLUDED"
          } > "$audit/RUN-METADATA.txt"

          all_pass=1
          : > "$audit/STATIC-BOOT-MATRIX.txt"

          for kernel in 5.4.274 5.4.292 5.4.293 5.4.300 5.4.301 5.4.302; do
            result="$audit/$kernel/FINAL-RESULT.txt"
            boot="$(find "$aggregate/boots/$kernel" -maxdepth 1 -type f -name '*BOOTTEST.img' -print -quit)"

            if [ ! -s "$result" ] || [ -z "$boot" ] || [ ! -s "$boot" ]; then
              echo "$kernel=FAIL" >> "$audit/STATIC-BOOT-MATRIX.txt"
              all_pass=0
              continue
            fi

            grep -Fxq 'AVB_VERIFY_IMAGE_EXIT_ZERO=PASS' "$result" || all_pass=0
            grep -Fxq 'AVB_VERIFY_NO_TRACEBACK=PASS' "$result" || all_pass=0
            grep -Fxq 'STATIC_BOOT_PATH_PASS=PASS' "$result" || all_pass=0

            sha="$(sha256sum "$boot" | awk '{print $1}')"
            expected="$(sed -n 's/^O53V1_BOOT_SHA256=//p' "$result")"
            test "$sha" = "$expected"

            echo "$kernel=STATIC_BOOT_PASS BOOT_SHA256=$sha" >> "$audit/STATIC-BOOT-MATRIX.txt"
          done

          if [ "$RECHECK_OUTCOME" != success ]; then
            all_pass=0
          fi

          {
            if [ "$all_pass" = 1 ]; then
              echo 'VEUX_U6_O53V2_ALL_SIX_STATIC_BOOT_RECERTIFICATION=PASS'
              echo 'ALL_SIX_STATIC_BOOT_PATH_PASS=YES'
              echo 'O53V1_FALSE_GREEN_CLASSIFICATION=CORRECTED'
            else
              echo 'VEUX_U6_O53V2_ALL_SIX_STATIC_BOOT_RECERTIFICATION=FAIL'
              echo 'ALL_SIX_STATIC_BOOT_PATH_PASS=NO'
            fi
            echo 'SOURCE_PORT_PASS=PASS_FROM_O51'
            echo 'COMPILE_PASS=YES_FROM_O51'
            echo 'PACKAGE_PASS=YES_FROM_O52'
            echo 'DEVICE_PASS=NO'
          } > "$aggregate/FINAL-RESULT.txt"

          (
            cd "$aggregate"
            rm -f SHA256SUMS.txt
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 -r sha256sum > SHA256SUMS.txt
          )

      - name: Upload single O53 v2 certification aggregate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VEUX-U6-O53V2-ReSukiSU-35158-ALL-SIX-STATIC-BOOT-CERT-${{ github.run_id }}
          path: o53v2-aggregate/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Final real O53 v2 GREEN gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          aggregate="$GITHUB_WORKSPACE/o53v2-aggregate"
          final="$aggregate/FINAL-RESULT.txt"

          grep -Fxq 'VEUX_U6_O53V2_ALL_SIX_STATIC_BOOT_RECERTIFICATION=PASS' "$final"
          grep -Fxq 'ALL_SIX_STATIC_BOOT_PATH_PASS=YES' "$final"
          grep -Fxq 'O53V1_FALSE_GREEN_CLASSIFICATION=CORRECTED' "$final"
          grep -Fxq 'PACKAGE_PASS=YES_FROM_O52' "$final"
          grep -Fxq 'DEVICE_PASS=NO' "$final"

          test "$(find "$aggregate/boots" -type f -name '*BOOTTEST.img' | wc -l)" -eq 6

          for kernel in 5.4.274 5.4.292 5.4.293 5.4.300 5.4.301 5.4.302; do
            result="$aggregate/audit/$kernel/FINAL-RESULT.txt"

            grep -Fxq 'O53V1_BOOT_BYTE_IDENTITY=PASS' "$result"
            grep -Fxq 'O52_AK3_TO_BOOT_KERNEL_BINDING=PASS' "$result"
            grep -Fxq 'AVB_VERIFY_IMAGE_EXIT_ZERO=PASS' "$result"
            grep -Fxq 'AVB_VERIFY_NO_TRACEBACK=PASS' "$result"
            grep -Fxq 'AVB_PROPERTIES_PRESERVED=PASS' "$result"
            grep -Fxq 'RAW_RAMDISK_BYTE_IDENTITY=PASS' "$result"
            grep -Fxq 'DECODED_RAMDISK_BYTE_IDENTITY=PASS' "$result"
            grep -Fxq 'BOOT_HEADER_V3=PASS' "$result"
            grep -Fxq 'BOOT_HEADER_MUTATION_SCOPE=PASS' "$result"
            grep -Fxq 'KERNEL_IDENTITY_STRINGS=PASS' "$result"
            grep -Fxq 'STATIC_BOOT_PATH_PASS=PASS' "$result"
            grep -Fxq 'DEVICE_PASS=NO' "$result"
          done

          (
            cd "$aggregate"
            sha256sum -c SHA256SUMS.txt
          )

          echo "O53V2_REAL_GREEN_GATE=PASS"
