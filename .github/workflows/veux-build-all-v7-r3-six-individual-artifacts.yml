        retention-days: 90
        compression-level: 0
    - name: Verify six individual artifacts are visible in this run
      shell: bash
      env:
        GH_READ_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\n\nexpected=(\n  'VEUX-5.4.274-ReSukiSU35170-SUSFS2.3.0-NoMount2.0.0-AK3'\n  'VEUX-5.4.292-ReSukiSU35170-SUSFS2.3.0-NoMount2.0.0-AK3'\n\
        \  'VEUX-5.4.293-ReSukiSU35158-SUSFS2.3.0-AK3'\n  'VEUX-5.4.300-ReSukiSU35158-SUSFS2.3.0-AK3'\n  'VEUX-5.4.301-ReSukiSU35158-SUSFS2.3.0-AK3'\n\
        \  'VEUX-5.4.302-ReSukiSU35158-SUSFS2.3.0-AK3'\n)\n\nmeta=\"$RUNNER_TEMP/v7-r3-artifacts.json\"\nvisible=0\nfor _\
        \ in $(seq 1 30); do\n  curl --fail --location --silent --show-error \\\n    --retry 3 --retry-delay 2 \\\n    -H\
        \ \"Accept: application/vnd.github+json\" \\\n    -H \"Authorization: Bearer $GH_READ_TOKEN\" \\\n    -H \"X-GitHub-Api-Version:\
        \ 2022-11-28\" \\\n    \"https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100\"\
        \ \\\n    -o \"$meta\"\n\n  visible=1\n  for name in \"${expected[@]}\"; do\n    count=\"$(jq --arg n \"$name\" '[.artifacts[]\
        \ | select(.name == $n and .expired == false)] | length' \"$meta\")\"\n    if [ \"$count\" != 1 ]; then\n      visible=0\n\
        \      break\n    fi\n  done\n  [ \"$visible\" -eq 1 ] && break\n  sleep 2\ndone\n\ntest \"$visible\" -eq 1\n\nfor\
        \ name in \"${expected[@]}\"; do\n  size=\"$(jq -r --arg n \"$name\" '.artifacts[] | select(.name == $n) | .size_in_bytes'\
        \ \"$meta\")\"\n  digest=\"$(jq -r --arg n \"$name\" '.artifacts[] | select(.name == $n) | .digest' \"$meta\")\"\n\
        \  test \"$size\" -gt 0\n  case \"$digest\" in sha256:*) ;; *) exit 91 ;; esac\n  printf '%s SIZE=%s DIGEST=%s\\n'\
        \ \"$name\" \"$size\" \"$digest\"\ndone\n\n# The former single giant public aggregate must no longer be published\
        \ by R3.\ntest \"$(jq '[.artifacts[] | select(.name | startswith(\"VEUX-BUILD-ALL-V7-R3\"))] | length' \"$meta\")\"\
        \ -eq 0\n\necho 'V7_R3_SIX_INDIVIDUAL_ARTIFACTS_VISIBLE=PASS' "
    - name: Final V7 R3 GREEN gate
      shell: bash
      run: |
        set -euo pipefail

        final="$V7_AGGREGATE/FINAL-RESULT.txt"
        test -s "$final"
        grep -Fxq 'VEUX_BUILD_ALL_V7_R3_SPLIT_ARTIFACTS=PASS' "$final"
        grep -Fxq 'LINEAGE_COUNT=6' "$final"
        grep -Fxq 'ALL_SIX_FRESH_COMPILE_PASS=YES' "$final"
        grep -Fxq 'ALL_SIX_PACKAGE_PASS=YES' "$final"
        grep -Fxq 'ALL_SIX_STATIC_BOOT_PASS=YES' "$final"
        grep -Fxq 'CURRENT_VALIDATED_PIN_POLICY=PRESERVED' "$final"
        grep -Fxq 'UNIFIED_35170_NOMOUNT_END_STATE=NO_PENDING_293_300_301_302_PORT' "$final"
        grep -Fxq 'DEVICE_PASS=NO_IN_V7_CHAIN' "$final"

        test "$(grep -c '=PACKAGE_PASS AK3_SHA256=' "$V7_AGGREGATE/audit/PACKAGE-MATRIX.txt")" -eq 6
        test "$(grep -c '=STATIC_BOOT_PASS BOOT_SHA256=' "$V7_AGGREGATE/audit/STATIC-MATRIX.txt")" -eq 6
        test "$(find "$V7_AGGREGATE/images" -type f -name Image | wc -l)" -eq 6
        test "$(find "$V7_AGGREGATE/packages" -type f -name '*.zip' | wc -l)" -eq 6
        test "$(find "$V7_AGGREGATE/boots" -type f -name '*.img' | wc -l)" -eq 6

        (
          cd "$V7_AGGREGATE"
          sha256sum -c SHA256SUMS.txt
        )

        test "$(find "$GITHUB_WORKSPACE/v7-public" -type f -name '*.zip' | wc -l)" -eq 6
        test "$(find "$GITHUB_WORKSPACE/v7-public" -type f -name '*.img' | wc -l)" -eq 0
        echo 'VEUX_BUILD_ALL_V7_R3_SPLIT_ARTIFACTS_FINAL_GREEN_GATE=PASS'
