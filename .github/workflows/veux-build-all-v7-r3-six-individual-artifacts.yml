    - name: Publish 5.4.302 as individual kernel artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: VEUX-5.4.302-ReSukiSU35158-SUSFS2.3.0-AK3
