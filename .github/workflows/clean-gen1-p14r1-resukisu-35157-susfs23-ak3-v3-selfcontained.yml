          cat > "$ak3/anykernel.sh" <<EOF
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers

          properties() { '
          kernel.string=VEUX GEN1 P14R1 Linux 5.4.274 ReSukiSU ${P14R1_TARGET_SHORT} UAPI${EXPECTED_KSU_UAPI} + SUSFS 2.3
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=veux
          supported.versions=13
          supported.patchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          SLOT_SELECT=active;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=0;

          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF
          chmod 0755 "$ak3/anykernel.sh"

          rm -rf "$ak3/.git" "$ak3/.github"
          rm -f "$ak3/README.md"
          find "$ak3" -type f -name '*placeholder' -delete
          find "$ak3" -maxdepth 1 -type f -name '*.txt' -delete

          zip_name="VEUX-5.4.274-P14R1-ReSukiSU-35157-UAPI4-SUSFS-2.3-AK3-CLEAN.zip"
          (
            cd "$ak3"
            zip -r9 "$DIST_DIR/$zip_name" . \
              -x '.github/*' 'README.md' '*placeholder' '*.txt'
          )
          test -s "$DIST_DIR/$zip_name"
          echo "AK3_ZIP=$DIST_DIR/$zip_name" >> "$GITHUB_ENV"

          {
            echo "P14R1_AK3_BUILD=PASS"
            echo "AK3_ACTIVE_SLOT_UPPERCASE_CONTRACT=PASS"
            echo "AK3_IMAGE_ONLY=PASS"
            echo "AK3_CLEAN_PUBLIC_PAYLOAD=PASS"
          } | tee "$AUDIT_DIR/09-ak3-build.txt"

      - name: Validate CLEAN AK3 and write final P14R1 result
        shell: bash
        run: |
          set -euo pipefail
          test -s "$AK3_ZIP"
          unzip -t "$AK3_ZIP" | tee "$AUDIT_DIR/10-ak3-unzip.txt"

          for required in anykernel.sh tools/ak3-core.sh Image META-INF/com/google/android/update-binary META-INF/com/google/android/updater-script; do
            unzip -Z1 "$AK3_ZIP" | grep -Fxq "$required"
          done

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -p "$AK3_ZIP" Image > "$tmp/Image"
          cmp -s "$DIST_DIR/Image" "$tmp/Image"

          unzip -p "$AK3_ZIP" anykernel.sh > "$tmp/anykernel.sh"
          bash -n "$tmp/anykernel.sh"
          grep -Fqx 'device.name1=veux' "$tmp/anykernel.sh"
          grep -Fqx 'supported.versions=13' "$tmp/anykernel.sh"
          grep -Fqx 'BLOCK=boot;' "$tmp/anykernel.sh"
          grep -Fqx 'IS_SLOT_DEVICE=1;' "$tmp/anykernel.sh"
          grep -Fqx 'SLOT_SELECT=active;' "$tmp/anykernel.sh"
          grep -Fqx 'RAMDISK_COMPRESSION=auto;' "$tmp/anykernel.sh"
          grep -Fqx 'PATCH_VBMETA_FLAG=0;' "$tmp/anykernel.sh"
          ! grep -Eq '^(block|is_slot_device|slot_select|ramdisk_compression|patch_vbmeta_flag)=' "$tmp/anykernel.sh"

          ! unzip -Z1 "$AK3_ZIP" | grep -Eq '(^|/)(boot\.img|rollback_stock_boot\.img(\.gz)?|dtb|dtbo\.img|Image\.gz|Image\.gz-dtb)$'
          ! unzip -Z1 "$AK3_ZIP" | grep -Ei '(^|/)(audit|build-info|final-result|sha256sums)([^/]*)$'

          python3 - "$AK3_ZIP" <<'PY'
          import stat, sys, zipfile
          zpath = sys.argv[1]
          with zipfile.ZipFile(zpath) as z:
              names = z.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit('duplicate ZIP entries')
              for info in z.infolist():
                  name = info.filename
                  parts = [p for p in name.replace('\\', '/').split('/') if p not in ('', '.')]
                  if name.startswith('/') or '..' in parts:
                      raise SystemExit(f'unsafe ZIP path: {name}')
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'symlink not allowed: {name}')
          print('ZIP_PATH_AND_SYMLINK_GUARD=PASS')
          PY

          sha256sum "$AK3_ZIP" > "$AK3_ZIP.sha256"

          grep -Fxq 'RESUKISU_RCU_FIX_CONTRACT=PASS' "$AUDIT_DIR/03-resukisu-update-contract.txt"
          grep -Fxq 'MODULE_LOAD_FILTER_EXCLUDED=PASS' "$AUDIT_DIR/05-integration-boundaries.txt"
          grep -Fxq 'P13_AUDITED_SOURCE_DELTA=PASS' "$AUDIT_DIR/05-integration-boundaries.txt"
          grep -Fxq 'SUSFS_2_3_OUTER_BYTE_PRESERVED=PASS' "$AUDIT_DIR/05-integration-boundaries.txt"
          grep -Fxq 'P14R1_SOURCE_MATRIX=PASS' "$AUDIT_DIR/06-keyring-lsm-matrix.txt"
          grep -Fxq 'FRESH_P14R1_KERNEL_BUILD=PASS' "$AUDIT_DIR/08-build-result.txt"
          grep -Fxq 'WARNING_REGRESSION_GATE=PASS' "$AUDIT_DIR/08-build-result.txt"
          grep -Fxq 'P14_DTB_REGRESSION_GATE=PASS' "$AUDIT_DIR/08-build-result.txt"
          grep -Fxq 'P14R1_AK3_BUILD=PASS' "$AUDIT_DIR/09-ak3-build.txt"

          {
            echo "CLEAN_GEN1_P14R1_RESUKISU_35157_AK3=PASS"
            echo "DEVICE=veux"
            echo "LINUX=5.4.274"
            echo "IMMUTABLE_DEVICE_PASS_PARENT=P14"
            echo "P14_PARENT_RESUKISU=$RESUKISU_P14_DEVICE_PASS"
            echo "P14_PARENT_DEVICE_PASS=YES"
            echo "RESUKISU_TARGET=$RESUKISU_TARGET"
            echo "RESUKISU_TAG=$P14R1_TARGET_TAG"
            echo "KSU_VERSION=$P14R1_KSU_VERSION"
            echo "KSU_UAPI=$EXPECTED_KSU_UAPI"
            echo "RESUKISU_RCU_FIX_CONTRACT=PASS"
            echo "SUSFS=2.3.0_FROZEN"
            echo "VEUX_KEY_PERMISSION_SIGNATURE=unsigned_perm"
            echo "SESSION_KEYRING_UPDATE=PRESERVED"
            echo "P13_POST_EXEC_DELTA=PRESERVED"
            echo "MODULE_LOAD_FILTER=EXCLUDED"
            echo "WARNING_REGRESSION_GATE=PASS"
            echo "P14_DTB_REGRESSION_GATE=PASS"
            echo "COMPILE_PASS=YES"
            echo "PACKAGE_PASS=YES"
            echo "STATIC_BOOT_PATH_PASS=NO"
            echo "DEVICE_PASS=NO"
            echo "IMAGE_BYTES=$(stat -c '%s' "$DIST_DIR/Image")"
            echo "IMAGE_SHA256=$(sha256sum "$DIST_DIR/Image" | awk '{print $1}')"
            echo "VEUX_DTB_SHA256=$(sha256sum "$DIST_DIR/veux.dtb" | awk '{print $1}')"
            echo "AK3=$(basename "$AK3_ZIP")"
            echo "AK3_SHA256=$(sha256sum "$AK3_ZIP" | awk '{print $1}')"
            echo "AK3_PIN=$AK3_COMMIT"
            echo "AK3_ACTIVE_SLOT_UPPERCASE_CONTRACT=PASS"
          } | tee "$DIST_DIR/FINAL-RESULT.txt"

          (
            cd "$DIST_DIR"
            sha256sum Image veux.dtb "$(basename "$AK3_ZIP")" \
              "$(basename "$AK3_ZIP").sha256" FINAL-RESULT.txt \
              > SUPPORT-SHA256SUMS
          )
          sha256sum "$AUDIT_DIR"/* | LC_ALL=C sort > "$AUDIT_DIR/SHA256SUMS"

      - name: Upload P14R1 kernel and CLEAN AK3
        uses: actions/upload-artifact@v7
        with:
          name: clean-gen1-p14r1-v3-veux-resukisu-35157-susfs23-ak3-${{ github.run_id }}
          path: clean-gen1-p14r1-dist/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload P14R1 audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clean-gen1-p14r1-v3-audit-${{ github.run_id }}
          path: clean-gen1-p14r1-audit/
          if-no-files-found: warn
          retention-days: 90

      - name: Final real GREEN gate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="$DIST_DIR/FINAL-RESULT.txt"
          test -s "$result"
          grep -Fxq 'CLEAN_GEN1_P14R1_RESUKISU_35157_AK3=PASS' "$result"
          grep -Fxq 'KSU_VERSION=35157' "$result"
          grep -Fxq 'KSU_UAPI=4' "$result"
          grep -Fxq 'RESUKISU_RCU_FIX_CONTRACT=PASS' "$result"
          grep -Fxq 'SUSFS=2.3.0_FROZEN' "$result"
          grep -Fxq 'MODULE_LOAD_FILTER=EXCLUDED' "$result"
          grep -Fxq 'WARNING_REGRESSION_GATE=PASS' "$result"
          grep -Fxq 'P14_DTB_REGRESSION_GATE=PASS' "$result"
          grep -Fxq 'COMPILE_PASS=YES' "$result"
          grep -Fxq 'PACKAGE_PASS=YES' "$result"
          grep -Fxq 'STATIC_BOOT_PATH_PASS=NO' "$result"
          grep -Fxq 'DEVICE_PASS=NO' "$result"
          echo 'P14R1_REAL_GREEN_GATE=PASS'
