name: VEUX R55H5-R4-R2 5.4.274 size-safe native headers and genuine BakaSU SUSFS build - NO FLASH
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: veux-r55h5-r4-r2-size-safe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  r55h2_bakasu:
    if: ${{ github.repository == 'Chrizz100/veux-nongki-universal-kernel' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      PACKAGE_NAME: VEUX_STOCK274_P11_R4_MAIN.zip
      PACKAGE_SHA256: 46eef073d2418f0b64b66a0ff3ab33d788c485db3dcf8afa5cf56f89da27fb50
      P11_TOOL_DIR: ${{ github.workspace }}/p11-tools
      P10_TOOL_DIR: ${{ github.workspace }}/p11-tools/p10
      R4_TOOL_DIR: ${{ github.workspace }}/p11-tools/r4
      P11_BUNDLES_DIR: ${{ github.workspace }}/p11-bundles
      R55_STAGE: /tmp/veux-r55h1
      SOURCE_BASE_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
    - name: Initialize R55H5-R4-R2 size-safe native header active build diagnostic
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$R55_STAGE/out"
        echo 'R55H5_ACTIVE_BUILD_DIAGNOSTIC_STARTED; NO_FLASH' > "$R55_STAGE/out/H1_STARTED.txt"
    - name: Read-only project checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        path: project
        fetch-depth: 1
        persist-credentials: false
    - name: Pinned Positron ancestor checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: dereference23/kernel_xiaomi_sm6375
        ref: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
        fetch-depth: 0
        path: kernel
        persist-credentials: false
