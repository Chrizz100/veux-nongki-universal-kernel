        grep -Fx 'OK' "$R55_STAGE/out/R55H5_R3_35_COMPOSITE_KBUILD_TESTS.log"
        echo 'R55H5_R3_35_ORIGINAL_ERROR_AND_IN_TREE_COMPOSITE_NEGATIVE_TESTS=PASS'

        python3 -B -m unittest discover -v -s "$R55_STAGE/tests" -p 'test_h5_r4_native_headers.py' 2>&1 | tee "$R55_STAGE/out/R55H5_R4_40_NATIVE_GENERATED_HEADER_TESTS.log"
        grep -Eq '^Ran 40 tests in [0-9.]+s$' "$R55_STAGE/out/R55H5_R4_40_NATIVE_GENERATED_HEADER_TESTS.log"
        grep -Fx 'OK' "$R55_STAGE/out/R55H5_R4_40_NATIVE_GENERATED_HEADER_TESTS.log"
        echo 'R55H5_R4_40_NATIVE_GENERATED_HEADER_NEGATIVE_AND_GIT_TESTS=PASS'
    - name: Reproduce exact stock-near 5.4.274 P3 source
      shell: bash
      run: |
        set -euo pipefail
        python3 "$R4_TOOL_DIR/stage_stock274.py"
        test -s "$RUNNER_TEMP/VEUX_274_P3_OUTPUT/P3_RESULT.json"
        python3 -B - <<'PY_H1_P3_REPORT'
        import json,os,pathlib
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'VEUX_274_P3_OUTPUT/P3_RESULT.json'
        r=json.loads(p.read_text())
        assert r['kernel']=='5.4.274' and r['p3_cass_free_tree']=='7f97dbbff432d61bbf11cae03de257a21f1d3c74'
        print('R55H1_REAL_P3_SOURCE_REPRODUCED=PASS')
        PY_H1_P3_REPORT
    - name: Compose original P10/P11 stock-near source
      shell: bash
      run: |
        set -euo pipefail
        python3 "$P11_TOOL_DIR/p11_source_gate.py" \
         --workspace "$GITHUB_WORKSPACE" \
         --p10-tools "$P10_TOOL_DIR" \
         --p3-result "$RUNNER_TEMP/VEUX_274_P3_OUTPUT/P3_RESULT.json" \
         --output "$RUNNER_TEMP/VEUX_274_P11_PREP"
        test -s "$RUNNER_TEMP/VEUX_274_P11_PREP/P11_PREP_REPORT.json"
        echo 'R55H1_REAL_P11_274_SOURCE_RECONSTRUCTED=PASS'
    - name: Check R55G1 patch against real 5.4.274 source without applying
      id: compat
      shell: bash
      run: |
        set -euo pipefail
        python3 -B "$R55_STAGE/scripts/h1_bridge.py" \
          --source kernel \
          --patch "$R55_STAGE/inputs/R55G1_AUTHENTIC_21FILES.patch" \
          --p3-result "$RUNNER_TEMP/VEUX_274_P3_OUTPUT/P3_RESULT.json" \
          --p11-report "$RUNNER_TEMP/VEUX_274_P11_PREP/P11_PREP_REPORT.json" \
          --out "$R55_STAGE/out" | tee "$R55_STAGE/out/H1_REAL_COMPAT.log"
        python3 -B - <<'PY_H1_COMPAT_OUTPUT'
        import json,os,pathlib
        r=json.loads(pathlib.Path('/tmp/veux-r55h1/out/R55H1_COMPATIBILITY.json').read_text())
        ready=r['status']=='COMPATIBLE_SOURCE_ONLY' and r['ready_for_isolated_source_test'] is True
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('ready='+('true' if ready else 'false')+'\n')
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('## R55H1 echte 5.4.274 Quellbruecke\nStatus: **'+r['status']+'**\n')
            f.write('Grund: '+str(r.get('reason'))+'\n')
        print('R55H1_BUILD_PRECHECK='+('READY' if ready else 'BLOCKED'))
        PY_H1_COMPAT_OUTPUT
    - name: Checkout immutable official BakaSU provider at tested source commit
      if: ${{ steps.compat.outputs.ready == 'true' }}
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: Baka-SU/BakaSU
        ref: d5e9e025b8b49155f8014684d64c91742b465f65
        path: BakaSU
        fetch-depth: 0
        persist-credentials: false
    - name: R55H5 require genuine 7/7 source proof before enabling BakaSU/SUSFS compilation
      shell: bash
      run: |
        set -euo pipefail
        printf '%s\n' '=== R55H2 pinned BakaSU real 5.4.274 source probe ==='
        test "$(git -C BakaSU rev-parse HEAD)" = 'd5e9e025b8b49155f8014684d64c91742b465f65'
        # P11 reconstructs a real 5.4.274 commit. The original SOURCE_BASE_SHA
        # references the historic 5.4.268 checkout, not this reconstructed HEAD.
        python3 -B "$R55_STAGE/scripts/h2_reconstructed_source_gate.py" \
          --source kernel --compat "$R55_STAGE/out/R55H1_COMPATIBILITY.json" \
          --out "$R55_STAGE/out/R55H2_R2_RECONSTRUCTED_SOURCE_IDENTITY.json"
        python3 -B "$R55_STAGE/scripts/h2_bakasu_probe.py" \
          --source kernel --bakasu BakaSU \
          --patch "$R55_STAGE/inputs/R55G1_AUTHENTIC_21FILES.patch" \
          --work "$R55_STAGE/h2-candidate" --out "$R55_STAGE/out" \
          2>&1 | tee "$R55_STAGE/out/R55H2_SOURCE_PROBE.log"
        python3 -B "$R55_STAGE/scripts/h3_five_hooks.py" \
          --candidate "$R55_STAGE/h2-candidate" \
          --source-probe "$R55_STAGE/out/R55H2_BAKASU_PROVIDER_PROBE.json" \
          --out "$R55_STAGE/out" \
          2>&1 | tee "$R55_STAGE/out/R55H3_SOURCE_PORT.log"
        python3 -B "$R55_STAGE/scripts/h4_path_hooks.py" \
          --candidate "$R55_STAGE/h2-candidate" \
          --h3-report "$R55_STAGE/out/R55H3_FIVE_REAL_HOOKS_RESULT.json" \
          --out "$R55_STAGE/out" \
          2>&1 | tee "$R55_STAGE/out/R55H4_SOURCE_PORT.log"
        python3 -B - <<'PY_H2_PROBE_STATUS'
        import json,os,pathlib
        p=pathlib.Path('/tmp/veux-r55h1/out/R55H4_SEVEN_REAL_HOOKS_RESULT.json')
        r=json.loads(p.read_text())
        if r.get('status')!='SEVEN_GENUINE_BAKASU_KERNEL_HOOKS_SOURCE_PORTED' or r.get('missing_hook_count')!=0:
            raise SystemExit('R55H4_REAL_SEVEN_HOOK_GATE_FAILED')
        # R55H4-R2 was independently replayed on the genuine P11-274 source;
        # this new stage is allowed to enter an isolated compiler ONLY with all 7 hooks.
        assert r['source_only'] is True
        assert r['bakasu_commit']=='d5e9e025b8b49155f8014684d64c91742b465f65'
        assert r['h3_sha256']=='ae3a7aed0ba20f334e987a369371d5f9bc93174836568d50e2a49628cd766f13'
        assert r['hook_patch_sha256']=='14744c535ebb710517987c302d0b279bc3f80c05e301ae327399192e73c90b47'
        assert r['real_git_apply_check'] and r['real_git_reverse_check']
        assert r['independent_clean_byte_identical_apply_and_reverse']
        assert len(r['hook_details'])==7 and all(x['ready'] for x in r['hook_details'].values())
        ready=True
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('ready='+('true' if ready else 'false')+'\n')
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('\n### R55H5 real BakaSU/SUSFS compiler authorized by 7/7 source proof\n')
            f.write('Status: **'+r['status']+'**\n')
            f.write('Real kernel hook calls verified: '+str(r.get('added_hook_count','not reached'))+' / 7\n')
            for hook in r.get('missing_hook_symbols',[]):
                row=r['hook_details'][hook]
                f.write('- Missing real call: `'+hook+'` in `'+row['path']+'`\n')
            f.write('**Build authorization is NOT flash approval; compiler result is separately checked.**\n')
        print('R55H4_SEVEN_REAL_HOOKS='+str(r.get('added_hook_count',0))+'; remaining='+str(r.get('missing_hook_count',0)))
        print('R55H5_SOURCE_GATE=7_OF_7_TRUE; ACTIVE_BUILD_CONDITION=OPEN; FLASH=FORBIDDEN')
        PY_H2_PROBE_STATUS
      if: ${{ steps.compat.outputs.ready == 'true' }}
      id: h2_contract
      timeout-minutes: 25
    - name: Install pinned clang-r416183b only after seven real BakaSU kernel calls pass
      if: ${{ steps.compat.outputs.ready == 'true' && steps.h2_contract.outputs.ready == 'true' }}
      timeout-minutes: 20
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends   bc bison build-essential ca-certificates cpio curl flex git libelf-dev   libncurses-dev libssl-dev patch python3 python-is-python3 rsync xz-utils zstd
        export P11_TOOLCHAIN_DIR="$GITHUB_WORKSPACE/toolchains/clang-r416183b"
        mkdir -p "$P11_TOOLCHAIN_DIR"
        curl --fail --location --retry 4 --connect-timeout 30 --max-time 360  'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/aa2e4a514a6c85eebcc4a27149eaf9244e951a1e/clang-r416183b.tar.gz'  --output "$RUNNER_TEMP/clang-r416183b.tar.gz"
        tar -xzf "$RUNNER_TEMP/clang-r416183b.tar.gz" -C "$P11_TOOLCHAIN_DIR"
        "$P11_TOOLCHAIN_DIR/bin/clang" --version | grep -F 'r416183b'
        echo "P11_TOOLCHAIN_DIR=$P11_TOOLCHAIN_DIR" >> "$GITHUB_ENV"
        echo "$P11_TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
    - name: Reproduce genuine P11 5.4.274 baseline compile before BakaSU activation
      id: baseline
      if: ${{ steps.compat.outputs.ready == 'true' && steps.h2_contract.outputs.ready == 'true' }}
      timeout-minutes: 115
      shell: bash
      run: |
        set -euo pipefail
        set +e
        bash "$P11_TOOL_DIR/p11_build_walt_off.sh" 2>&1 | tee "$R55_STAGE/out/H1_P11_BASELINE_FULL_COMPILE.log"
        code=${PIPESTATUS[0]}
        set -e
        python3 -B - "$code" <<'PY_H1_BASELINE'
        import json,os,pathlib,sys
        r=pathlib.Path(os.environ['RUNNER_TEMP'])/'VEUX_274_P11_EVIDENCE'/'P11_BUILD_STATUS.json'
        code=int(sys.argv[1])
        proof=json.loads(r.read_text()) if r.exists() else {}
        pass_=code==0 and proof.get('build')=='PASS' and proof.get('kernel')=='5.4.274' and proof.get('flashable') is False
        out={'status':'P11_BASELINE_BUILD_PASS' if pass_ else 'P11_BASELINE_BUILD_FAILED',
             'script_exit':code,'p11_original_build_status':proof,'walt_enabled':False,'flash_allowed':False}
        pathlib.Path('/tmp/veux-r55h1/out/H1_P11_BASELINE_REPORT.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('passed='+('true' if pass_ else 'false')+'\n')
        print('R55H1_P11_BASELINE_COMPILE='+('PASS' if pass_ else 'FAILED'))
        PY_H1_BASELINE
    - name: Native Linux-5.4 generated compile.h flask.h then BakaSU/SUSFS and full ARM64 Image DTBs
      shell: bash
      run: |
        set -euo pipefail
        bash "$R55_STAGE/scripts/h5_active_compile.sh" 2>&1 | tee "$R55_STAGE/out/R55H5_ACTIVE_COMPILE_DRIVER.log"
      if: ${{ steps.h2_contract.outputs.ready == 'true' && steps.baseline.outputs.passed == 'true' }}
      timeout-minutes: 120
    - name: Record R55H5-R4-R2 real compiler status, evidence hashes and no-flash gate
      shell: bash
      run: |
        set -euo pipefail
        python3 -B - <<'PY_H5_FINAL'
        import hashlib,json,os,pathlib,subprocess
        out=pathlib.Path('/tmp/veux-r55h1/out');out.mkdir(parents=True,exist_ok=True)
        read=lambda n:json.loads((out/n).read_text()) if (out/n).exists() else None
        bridge=read('R55H1_COMPATIBILITY.json')
        identity=read('R55H2_R2_RECONSTRUCTED_SOURCE_IDENTITY.json')
        h4=read('R55H4_SEVEN_REAL_HOOKS_RESULT.json')
        base=read('H1_P11_BASELINE_REPORT.json')
        active=read('R55H5_ACTIVE_BUILD_RESULT.json')
        real=bool(active and active.get('active_bakasu_susfs_image_proven') is True)
        if real:status='ACTIVE_BAKASU_SUSFS_TRUE_KERNEL_BUILD_PASS_NOFLASH'
        elif active:status='BLOCKED_REAL_BAKASU_SUSFS_COMPILER_OR_CONFIG'
        elif base and base.get('status')!='P11_BASELINE_BUILD_PASS':status='BLOCKED_P11_BASELINE'
        elif h4 and h4.get('status')=='SEVEN_GENUINE_BAKASU_KERNEL_HOOKS_SOURCE_PORTED':status='BLOCKED_BEFORE_REAL_COMPILER_START'
        elif bridge and bridge.get('status')!='COMPATIBLE_SOURCE_ONLY':status='BLOCKED_REAL_274_SOURCE'
        else:status='NOT_STARTED'
        res={'schema':1,'stage':'R55H5_R4_R2_NATIVE_GENERATED_HEADERS_AND_COMPOSITE_KERNEL_BUILD',
         'status':status,'true_active_bakasu_susfs_compiled':real,
         'walt_enabled':False,'nomount_enabled':False,'vendor_abi_proven':False,
         'device_test':False,'boot_img_generated':False,'flash_allowed':False,
         'h4_genuine_hook_count':h4.get('added_hook_count') if h4 else None,
         'h4_missing_hooks':h4.get('missing_hook_count') if h4 else None,
         'source_identity_gate':identity.get('status') if identity else 'NOT_STARTED',
         'source_bridge_gate':bridge.get('status') if bridge else 'NOT_STARTED',
         'baseline_status':base.get('status') if base else 'NOT_STARTED',
         'compiler_status':active.get('status') if active else 'NOT_STARTED',
         'compiler_exits':active.get('kbuild_exit_codes') if active else None,
         'compiler_file_hashes':active.get('files') if active else {},
         'github_workflow_success_is_not_kernel_activation':True,
         'no_dummy_hook_bypass':True,'no_brene_changes':True,'no_vendor_changes':True}
        project=subprocess.run(['git','-C','project','status','--porcelain','--untracked-files=all'],capture_output=True,text=True)
        res['project_repo_unchanged']=project.returncode==0 and project.stdout.strip()==''
        (out/'R55H5_FINAL_STATUS.json').write_text(json.dumps(res,indent=2,sort_keys=True)+'\n')
        files=[]
        for f in sorted(out.iterdir()):
         if f.is_file() and f.name!='SHA256SUMS.txt':
          h=hashlib.sha256()
          with f.open('rb') as q:
           for chunk in iter(lambda:q.read(1024*1024),b''):h.update(chunk)
          files.append(h.hexdigest()+'  '+f.name)
        (out/'SHA256SUMS.txt').write_text('\n'.join(files)+'\n')
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
         f.write('\n### R55H5 actual BakaSU / SUSFS ARM64 compiler result (NO FLASH)\n')
         for k,v in res.items():f.write('- '+k+': '+str(v)+'\n')
        print('R55H5_TRUE_COMPILER_RESULT='+status)
        print('R55H5_ACTIVE_BAKASU_AND_SUSFS_LINK_PROVEN='+('YES' if real else 'NO'))
        print('R55H5_ARTIFACT_EVIDENCE_SHA256=PASS; NO FLASH')
        if not res['project_repo_unchanged']:raise SystemExit('R55H5_ORIGINAL_PROJECT_DIRTY')
        PY_H5_FINAL
        (cd "$R55_STAGE/out" && sha256sum -c SHA256SUMS.txt)
      if: ${{ always() }}
    - name: Upload BakaSU source and compiler evidence only; never boot images
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: VEUX-R55H5-R4-R2-SIZE-SAFE-BAKASU-SUSFS-NOFLASH-${{ github.run_id }}
        path: /tmp/veux-r55h1/out/
        if-no-files-found: error
        retention-days: 14
