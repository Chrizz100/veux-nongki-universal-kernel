        with tarfile.open(fileobj=io.BytesIO(lzma.decompress(archive)),mode="r:") as bundle:
            members=bundle.getmembers()
            if len(members)!=len(expected) or {m.name for m in members}!=set(expected):raise SystemExit('R55H5_R4_R2_ASSET_SET_MISMATCH')
            for member in members:
                if not member.isfile() or member.name not in expected:raise SystemExit("R55H5_R4_R2_UNSAFE_ASSET:"+member.name)
                digest,size=expected[member.name]
                if member.size!=size:raise SystemExit("R55H5_R4_R2_ASSET_SIZE_MISMATCH:"+member.name)
                stream=bundle.extractfile(member)
                if stream is None:raise SystemExit("R55H5_R4_R2_EMPTY_ASSET:"+member.name)
                raw=stream.read()
                if hashlib.sha256(raw).hexdigest()!=digest:raise SystemExit("R55H5_R4_R2_ASSET_SHA_MISMATCH:"+member.name)
                dest=base/member.name;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(raw)
                print("R55H5_R4_R2_EMBEDDED_SHA256=PASS",member.name,len(raw),digest)
        PY_H5_RESTORE
