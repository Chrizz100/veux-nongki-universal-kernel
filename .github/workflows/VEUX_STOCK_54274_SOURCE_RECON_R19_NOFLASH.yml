          ROOT="$RUNNER_TEMP/veux-r15"
          REPORTS="$RUNNER_TEMP/veux-r18/reports"
          INPUT="$RUNNER_TEMP/veux-r18/main"
          export PATH="$ROOT/aosp-clang/clang-r383902b1/bin:$PATH"
          TRIAL="$ROOT/walt-trial"
          OUT="$ROOT/build"
          mkdir -p "$REPORTS"
          python3 -B "$INPUT/tools/r18_full_link.py" verify --root "$INPUT"
          printf '%s  %s\n' 'a9923e4444aaa3a58c08776268914b3e3ee5f0042676d4c86a48eaf88381b111' "$TRIAL/include/linux/sched.h" | sha256sum --check --strict
          test -z "$(git -C "$ROOT/donor" status --porcelain)"
          grep -Fqx 'CONFIG_SCHED_WALT=y' "$OUT/.config"
          python3 -I - "$ROOT/reports/R17_PINNED_HRTIMER_COMPILER_SUMMARY.json" <<'PY_R18_PRECHECK'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['r17_all_component_compilers_pass'] is True
          assert d['r17_12_unique_object_files']==12 and d['flash_allowed'] is False
          assert d['full_scheduler_hooks_ported'] is False and d['stock_rtmm_implemented'] is False
          print('R18_R17_REAL_TWELVE_COMPONENTS=PASS; FULL_LINK_ABI_UNPROVEN')
          PY_R18_PRECHECK
          echo 'R19_AFTER_SOURCE_TRIAL_FULL_DONOR_WALT_KERNEL_BUILD=STARTED; NOFLASH=YES'
          set +e
          timeout 3600s make -C "$TRIAL" O="$OUT" ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 -j2 Image dtbs \
            > "$REPORTS/R18_FULL_KERNEL_BUILD.log" 2>&1
          RC=$?
          set -e
          printf '%s\n' "$RC" > "$REPORTS/R18_FULL_KERNEL_RC.txt"
          python3 -B "$INPUT/tools/r18_full_link.py" summary --root "$INPUT" \
            --reports "$REPORTS" --build-dir "$OUT"
          echo '===== R18 FULL KERNEL COMPILER/LINK LOG LAST 130 LINES ====='
          tail -n 130 "$REPORTS/R18_FULL_KERNEL_BUILD.log"
          test -z "$(git -C "$ROOT/donor" status --porcelain)"
          python3 -I - "$REPORTS/R18_FULL_LINK_AND_ABI.json" <<'PY_R18_GATE'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text())
          for k in ('flash_allowed','boot_verified','source_patch_approved','stock_rtmm_implemented','runtime_walt_hooks_verified','oem_abi_verified'):
              if d[k] is not False:raise RuntimeError('R18_NOFLASH_SAFETY_BROKEN:'+k)
          if not d['linked_image_and_vmlinux'] or d['vendor_module_abi'] is None:
              print('::error::R18_FULL_IMAGE_LINK_FAILED_OR_ABI_NOT_MEASURABLE; see uploaded compile log')
              raise SystemExit(1)
          print('R18_FULL_IMAGE_LINK_AND_R6_QGKI_GKI_ABI=MEASURED; RUNTIME_BOOT_AND_FLASH=NOT_VERIFIED')
          PY_R18_GATE

      - name: Always upload R19 source compatibility and optional R18 full-build ABI reports, NEVER binary images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VEUX-STOCK-54274-R19-QUALCOMM-SOURCE-TRIAL-IMAGE-ABI-NOFLASH-${{ github.run_id }}
          path: ${{ runner.temp }}/veux-r18/reports/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
