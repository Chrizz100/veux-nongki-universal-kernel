# VEUX Stock 5.4.274 R19: pinned whole-source compatibility trial after R18 failure.
# R17 already successfully compiled 12 individual WALT and runtime objects on GitHub.
# Full link still may fail, WALT hooks and RTMM are NOT proven. NOFLASH.
# R16 confirmed the single missing HRTIMER_STATE_PINNED compiler blocker; R17 applies genuine Stock definitions and verified Qualcomm transitions ONLY in a disposable Git worktree.
# Original Stock 5.4.274 header declarations + pinned upstream implementations in disposable donor worktree.
# Compiles 9 WALT-family objects + watchdog/hrtimer/timer/sysctl provider objects; NOT a link/ABI/boot test.
# This is a compiler diagnostic, NOT a complete scheduler backport, vmlinux, OEM ABI, boot, or flash.
# Original Stock task_struct is fixed, original donor remains clean, NOFLASH and no binaries.
name: VEUX STOCK 5.4.274 R19 original Qualcomm core mm source trial then full link - NOFLASH
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: veux-stock-r19-upstream-core-vmscan-${{ github.ref }}
  cancel-in-progress: false
jobs:
  walt_core_mm_trial_r19:
    if: ${{ github.repository == 'Chrizz100/veux-nongki-universal-kernel' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      R19_MAIN: VEUX_STOCK_54274_SOURCE_RECON_R19_MAIN.zip
      R19_MAIN_SHA256: ac894f380411d0df694688cb108daed98d7bcf3330262c051af09705b7b7fdaa
      R18_MAIN: VEUX_STOCK_54274_SOURCE_RECON_R18_MAIN.zip
      R18_MAIN_SHA256: 1831afc6cd9b9b9458dd7a2baf0558b0538100265699f6cfd0a25b3bb5099d69
      R17_MAIN: VEUX_STOCK_54274_SOURCE_RECON_R17_MAIN.zip
      R17_MAIN_SHA256: 511dc8744b4f6b06f837bba9a92e32cf2510eb383224d27bd342b44a4991e4a6
      R16_MAIN: VEUX_STOCK_54274_SOURCE_RECON_R16_MAIN.zip
      R16_MAIN_SHA256: 18263bfbe35f1a216e6d621b58fe9c3d787f1279a705a2f6239c0eb068f4d59c
      R15_MAIN: VEUX_STOCK_54274_SOURCE_RECON_R15_MAIN.zip
      R15_MAIN_SHA256: 2840878243c67d6a0724b1cc24a4f435d69ea83a1bee38f7ec2103bedfdfd331
      R14_MAIN: VEUX_STOCK_54274_SOURCE_RECON_R14_MAIN.zip
      R14_MAIN_SHA256: 42de59e084ab7ef539dd78bfe489ee5a27b99afd00196ad63db7160623bfd3d0
      R13_PARENT_SHA256: 71badc859c4c204edef6996fa572e558b26a646a616d1b7859d07651a6cafe19
      PAIR_URL: https://github.com/shandongtlb/kernel_xiaomi_sm8350_M11.git
      PAIR_SHA: 01cb3a8824b7b4caf3e3540274e71abba5ade538
      DONOR_URL: https://github.com/dereference23/kernel_xiaomi_sm6375.git
      DONOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
      CLANG_BRANCH: android11-qpr2-release
      CLANG_TREE: 1c7dcc2e7095197f7a05dff22a875b6b02ed7117
    steps:
      - name: Checkout read-only exact workflow revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate R19 workflow using pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/veux-r15-actionlint"
          mkdir -p "$GOBIN"
          GOTOOLCHAIN=local go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$GOBIN/actionlint" .github/workflows/VEUX_STOCK_54274_SOURCE_RECON_R19_NOFLASH.yml
          echo 'R19_ACTIONLINT=PASS'

      - name: R19 authenticate only uploaded MAIN, automatically restore genuine R18 parent and run 25 tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-r19/main"
          REPORTS="$RUNNER_TEMP/veux-r18/reports"
          mkdir -p "$ROOT" "$REPORTS"
          printf '%s  %s\n' "$R19_MAIN_SHA256" "$GITHUB_WORKSPACE/$R19_MAIN" | sha256sum --check --strict
          python3 -I - "$GITHUB_WORKSPACE/$R19_MAIN" "$ROOT" "$GITHUB_WORKSPACE/$R18_MAIN" <<'PY_R19_AUTH'
          import hashlib,json,stat,sys
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          arc,dst,parent=map(Path,sys.argv[1:])
          if arc.is_symlink() or not arc.is_file() or any(dst.iterdir()):
              raise RuntimeError('R19_BAD_MAIN_OR_DESTINATION')
          with ZipFile(arc) as z:
              infos=z.infolist(); names=[x.filename for x in infos]
              if not infos or len(infos)>12 or len(names)!=len(set(names)) or z.testzip() or sum(x.file_size for x in infos)>3_000_000:
                  raise RuntimeError('R19_BAD_ARCHIVE_OR_SIZE')
              m=json.loads(z.read('MANIFEST_SHA256.json'))
              if m.get('schema')!='VEUX_R19_PINNED_QUALCOMM_SOURCE_SURFACE_NOFLASH' or m.get('r18_parent_sha256')!='1831afc6cd9b9b9458dd7a2baf0558b0538100265699f6cfd0a25b3bb5099d69' or m.get('flash_allowed') is not False:
                  raise RuntimeError('R19_MAIN_PROVENANCE')
              if set(names)!=set(m['files'])|{'MANIFEST_SHA256.json'}:
                  raise RuntimeError('R19_FILESET')
              for member in infos:
                  rel=PurePosixPath(member.filename)
                  if member.is_dir() or rel.is_absolute() or '..' in rel.parts or str(rel)!=member.filename or '\\' in member.filename or stat.S_IFMT(member.external_attr>>16) not in (0,stat.S_IFREG):
                      raise RuntimeError('R19_UNSAFE_ZIP_PATH')
                  b=z.read(member.filename)
                  if member.filename!='MANIFEST_SHA256.json' and hashlib.sha256(b).hexdigest()!=m['files'][member.filename]:
                      raise RuntimeError('R19_CONTENT_SHA')
                  p=dst.joinpath(*rel.parts);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          b=(dst/'reference/R18_MAIN_ORIGINAL.zip').read_bytes()
          d=hashlib.sha256(b).hexdigest()
          if d!='1831afc6cd9b9b9458dd7a2baf0558b0538100265699f6cfd0a25b3bb5099d69':
              raise RuntimeError('R19_PAIRED_R18_PARENT_IS_NOT_ORIGINAL')
          if parent.exists():
              if parent.is_symlink() or hashlib.sha256(parent.read_bytes()).hexdigest()!=d:
                  raise RuntimeError('R19_WORKSPACE_R18_PARENT_CHANGED')
          else:parent.write_bytes(b)
          print('R19_EXACT_R18_PARENT_RESTORED_READONLY=PASS')
          PY_R19_AUTH
          python3 -B "$ROOT/tools/r19_qualcomm_surface.py" verify --root "$ROOT"
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s "$ROOT/tools" -p 'test_*.py' -v 2>&1 | tee "$REPORTS/R19_TESTS.log"
          echo 'R19_25_REGRESSIONS_AND_IMMUTABLE_R18_SOURCE_PARENT=PASS'

      - name: R18 authenticate exact original R17 and R6 ABI reference files; 24 regression tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-r18/main"
          REPORTS="$RUNNER_TEMP/veux-r18/reports"
          mkdir -p "$REPORTS"
          printf '%s  %s\n' "$R18_MAIN_SHA256" "$GITHUB_WORKSPACE/$R18_MAIN" | sha256sum --check --strict
          python3 -I - "$GITHUB_WORKSPACE/$R18_MAIN" "$ROOT" "$GITHUB_WORKSPACE/$R17_MAIN" <<'PY_R18_AUTH'
          import hashlib,json,stat,sys
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          arc,dst,parent=map(Path,sys.argv[1:]); dst.mkdir(parents=True)
          if arc.is_symlink() or not arc.is_file() or any(dst.iterdir()):
              raise RuntimeError('R18_UNSAFE_MAIN_INPUT')
          with ZipFile(arc) as z:
              infos=z.infolist();names=[x.filename for x in infos]
              if (not infos or len(infos)>16 or len(names)!=len(set(names)) or z.testzip()
                  or sum(x.file_size for x in infos)>7_000_000):
                  raise RuntimeError('R18_BAD_ARCHIVE_OR_SIZE')
              m=json.loads(z.read('MANIFEST_SHA256.json'))
              if (m.get('schema')!='VEUX_R18_WALT_FULL_IMAGE_LINK_ABI_DIAGNOSTIC_NOFLASH' or
                  m.get('r17_parent_sha256')!='511dc8744b4f6b06f837bba9a92e32cf2510eb383224d27bd342b44a4991e4a6' or
                  any(m.get(k) is not False for k in
                      ('flash_allowed','production_patch_approved','boot_verified','expected_full_kernel_link_pass'))):
                  raise RuntimeError('R18_MANIFEST_CONTRACT')
              if set(names)!=set(m['files'])|{'MANIFEST_SHA256.json'}:
                  raise RuntimeError('R18_ARCHIVE_FILESET')
              for i in infos:
                  rel=PurePosixPath(i.filename)
                  if (i.is_dir() or rel.is_absolute() or '..' in rel.parts or
                      str(rel)!=i.filename or '\\' in i.filename or
                      stat.S_IFMT(i.external_attr>>16) not in (0,stat.S_IFREG)):
                      raise RuntimeError('R18_UNSAFE_ZIP_MEMBER')
                  b=z.read(i.filename)
                  if i.filename!='MANIFEST_SHA256.json' and hashlib.sha256(b).hexdigest()!=m['files'][i.filename]:
                      raise RuntimeError('R18_CORRUPT_REFERENCE:'+i.filename)
                  p=dst.joinpath(*rel.parts);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          blob=(dst/'reference/R17_MAIN_ORIGINAL.zip').read_bytes()
          digest=hashlib.sha256(blob).hexdigest()
          if digest!='511dc8744b4f6b06f837bba9a92e32cf2510eb383224d27bd342b44a4991e4a6':
              raise RuntimeError('R18_R17_PARENT_NOT_GENUINE')
          if parent.exists():
              if parent.is_symlink() or hashlib.sha256(parent.read_bytes()).hexdigest()!=digest:
                  raise RuntimeError('R18_WORKSPACE_R17_CHANGED')
          else:
              parent.write_bytes(blob)
          print('R18_GENUINE_R17_PARENT_AND_FIXED_R6_ABI_REFERENCE=PASS')
          PY_R18_AUTH
          python3 -B "$ROOT/tools/r18_full_link.py" verify --root "$ROOT"
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s "$ROOT/tools" -p 'test_*.py' -v 2>&1 | tee "$REPORTS/R18_TESTS.log"
          echo 'R18_24_REGRESSION_TESTS_AND_R6_CRC_BASELINES=PASS'

      - name: R17 authenticate pinned-state MAIN, immutable R16 parent and run 28 new tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-r17/main"
          printf '%s  %s\n' "$R17_MAIN_SHA256" "$GITHUB_WORKSPACE/$R17_MAIN" | sha256sum --check --strict
          python3 -I - "$GITHUB_WORKSPACE/$R17_MAIN" "$ROOT" "$GITHUB_WORKSPACE/$R16_MAIN" <<'PY_R17_AUTH'
          import hashlib,json,stat,sys
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          archive,dest,parent=map(Path,sys.argv[1:])
          if archive.is_symlink() or not archive.is_file() or dest.exists():
              raise RuntimeError('R17_INVALID_ARCHIVE_INPUT')
          with ZipFile(archive) as z:
              entries=z.infolist(); names=[m.filename for m in entries]
              if (not entries or len(entries)>20 or len(names)!=len(set(names)) or
                  sum(m.file_size for m in entries)>1_000_000 or z.testzip()):
                  raise RuntimeError('R17_UNSAFE_ZIP_OR_EXPANSION')
              manifest=json.loads(z.read('MANIFEST_SHA256.json'))
              if (manifest.get('schema')!='VEUX_R17_PINNED_HRTIMER_BACKPORT_NOFLASH' or
                  manifest.get('r16_parent_sha256')!='18263bfbe35f1a216e6d621b58fe9c3d787f1279a705a2f6239c0eb068f4d59c' or
                  any(manifest.get(k) is not False for k in
                      ('flash_allowed','kernel_built','vmlinux_linked','oem_abi_verified','boot_verified','production_patch_approved'))):
                  raise RuntimeError('R17_UNSAFE_MANIFEST')
              if set(names)!=(set(manifest['files'])|{'MANIFEST_SHA256.json'}):
                  raise RuntimeError('R17_FILESET')
              dest.mkdir(parents=True)
              for m in entries:
                  rel=PurePosixPath(m.filename)
                  if (m.is_dir() or rel.is_absolute() or '..' in rel.parts or
                      str(rel)!=m.filename or '\\' in m.filename or
                      stat.S_IFMT(m.external_attr>>16) not in (0,stat.S_IFREG)):
                      raise RuntimeError('R17_UNSAFE_PATH')
                  b=z.read(m.filename)
                  if m.filename!='MANIFEST_SHA256.json' and hashlib.sha256(b).hexdigest()!=manifest['files'][m.filename]:
                      raise RuntimeError('R17_CORRUPT_CONTENT:'+m.filename)
                  f=dest.joinpath(*rel.parts);f.parent.mkdir(exist_ok=True,parents=True);f.write_bytes(b)
          original=(dest/'reference/R16_MAIN_ORIGINAL.zip').read_bytes()
          digest=hashlib.sha256(original).hexdigest()
          if digest!='18263bfbe35f1a216e6d621b58fe9c3d787f1279a705a2f6239c0eb068f4d59c':raise RuntimeError('R17_IMMUTABLE_PARENT_HASH')
          if parent.exists():
              if parent.is_symlink() or hashlib.sha256(parent.read_bytes()).hexdigest()!=digest:
                  raise RuntimeError('R17_EXISTING_R16_MISMATCH')
          else:parent.write_bytes(original)
          print('R17_IMMUTABLE_R16_PARENT_AND_ALL_MANIFEST_ENTRIES=PASS')
          PY_R17_AUTH
          mkdir -p "$RUNNER_TEMP/veux-r15/reports"
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s "$ROOT/tools" -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/veux-r15/reports/R17_TESTS.log"
          python3 -B "$ROOT/tools/r17_hrtimer_pin.py" verify --root "$ROOT"
          echo 'R17_28_PINNED_STATE_REGRESSIONS=PASS'

      - name: R16 authenticate diagnostic bundle and prove immutable R15 source baseline
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-r16"
          printf '%s  %s\n' "$R16_MAIN_SHA256" "$GITHUB_WORKSPACE/$R16_MAIN" | sha256sum --check --strict
          python3 -I - "$GITHUB_WORKSPACE/$R16_MAIN" "$ROOT" "$GITHUB_WORKSPACE/$R15_MAIN" <<'PY_R16_AUTH'
          import hashlib,json,stat,sys
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          archive,dest,parent=map(Path,sys.argv[1:])
          if archive.is_symlink() or not archive.is_file() or dest.exists():
              raise RuntimeError('R16_INVALID_INPUT')
          with ZipFile(archive) as z:
              entries=z.infolist();names=[i.filename for i in entries]
              if (not entries or len(entries)>15 or len(names)!=len(set(names)) or
                  z.testzip() or sum(i.file_size for i in entries)>750_000):
                  raise RuntimeError('R16_UNSAFE_ARCHIVE')
              manifest=json.loads(z.read('MANIFEST_SHA256.json'))
              if (manifest.get('schema')!='VEUX_STOCK_R16_HRTIMER_DIAGNOSTIC_NOFLASH' or
                  manifest.get('parent_r15_sha256')!='2840878243c67d6a0724b1cc24a4f435d69ea83a1bee38f7ec2103bedfdfd331' or
                  any(manifest.get(k) is not False for k in
                      ('flash_allowed','new_kernel_build','source_patch','boot_verified','abi_verified'))):
                  raise RuntimeError('R16_MANIFEST_CONTRACT')
              if set(names) != set(manifest['files'])|{'MANIFEST_SHA256.json'}:
                  raise RuntimeError('R16_MANIFEST_FILESET')
              dest.mkdir(parents=True)
              for entry in entries:
                  rel=PurePosixPath(entry.filename)
                  if (entry.is_dir() or rel.is_absolute() or '..' in rel.parts or
                      str(rel)!=entry.filename or '\\' in entry.filename or
                      stat.S_IFMT(entry.external_attr>>16) not in (0,stat.S_IFREG)):
                      raise RuntimeError('R16_ARCHIVE_TRAVERSAL')
                  data=z.read(entry.filename)
                  if entry.filename!='MANIFEST_SHA256.json' and hashlib.sha256(data).hexdigest()!=manifest['files'][entry.filename]:
                      raise RuntimeError('R16_CONTENT_SHA:'+entry.filename)
                  target=dest.joinpath(*rel.parts);target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
          original=(dest/'reference/R15_MAIN_ORIGINAL.zip').read_bytes()
          digest=hashlib.sha256(original).hexdigest()
          if digest!='2840878243c67d6a0724b1cc24a4f435d69ea83a1bee38f7ec2103bedfdfd331':
              raise RuntimeError('R16_R15_ORIGINAL_DRIFT')
          if parent.exists():
              if parent.is_symlink() or hashlib.sha256(parent.read_bytes()).hexdigest()!=digest:
                  raise RuntimeError('R16_R15_WORKSPACE_FILE_MISMATCH')
          else:
              parent.write_bytes(original)
          print('R16_INNER_R15_SHA_IDENTICAL=PASS; NO_KERNEL_CHANGES=YES')
          PY_R16_AUTH
          mkdir -p "$RUNNER_TEMP/veux-r15/reports"
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s "$ROOT/tools" -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/veux-r15/reports/R16_REGRESSION_TESTS.log"
          echo 'R16_15_REGRESSION_TESTS=PASS'

      - name: Authenticate R15 and immutable R14 parent from a single repository upload
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-r15"
          mkdir -p "$ROOT/reports"
          printf '%s  %s\n' "$R15_MAIN_SHA256" "$GITHUB_WORKSPACE/$R15_MAIN" | sha256sum --check --strict
          python3 -I - "$GITHUB_WORKSPACE/$R15_MAIN" "$ROOT/r15" <<'PY_R15_AUTH'
          import hashlib,json,stat,sys
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          arc,dst=map(Path,sys.argv[1:])
          with ZipFile(arc) as z:
              entries=z.infolist(); names=[x.filename for x in entries]
              if not entries or len(names)!=len(set(names)) or z.testzip() or sum(x.file_size for x in entries)>5_000_000:
                  raise RuntimeError('R15_BAD_ZIP_OR_UNSAFE_EXPANSION')
              manifest=json.loads(z.read('MANIFEST_SHA256.json'))
              if (manifest.get('schema')!='VEUX_R15_AUTHENTIC_WALT_RUNTIME_PROVIDERS_NOFLASH' or
                  manifest.get('r14_sha256')!='42de59e084ab7ef539dd78bfe489ee5a27b99afd00196ad63db7160623bfd3d0' or
                  manifest.get('flash_allowed') is not False or manifest.get('vmlinux_linked') is not False or
                  manifest.get('production_patch_approved') is not False):
                  raise RuntimeError('R15_MANIFEST_DRIFT')
              if set(names)!=set(manifest['files'])|{'MANIFEST_SHA256.json'}:
                  raise RuntimeError('R15_UNEXPECTED_CONTENT')
              if dst.exists() or arc.is_symlink(): raise RuntimeError('R15_UNSAFE_DEST')
              dst.mkdir(parents=True)
              for ent in entries:
                  rel=PurePosixPath(ent.filename)
                  if (ent.is_dir() or rel.is_absolute() or '..' in rel.parts or str(rel)!=ent.filename or
                      '\\' in ent.filename or stat.S_IFMT(ent.external_attr>>16) not in (0,stat.S_IFREG)):
                      raise RuntimeError('R15_BAD_FILETYPE_OR_TRAVERSAL')
                  b=z.read(ent.filename)
                  if ent.filename!='MANIFEST_SHA256.json' and hashlib.sha256(b).hexdigest()!=manifest['files'][ent.filename]:
                      raise RuntimeError('R15_FILE_HASH_MISMATCH:'+ent.filename)
                  p=dst.joinpath(*rel.parts);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          print('R15_MAIN_SHA_AND_ALL_FIVE_REFERENCE_FILES=PASS')
          PY_R15_AUTH
          printf '%s  %s\n' "$R14_MAIN_SHA256" "$ROOT/r15/reference/R14_MAIN_ORIGINAL.zip" | sha256sum --check --strict
          python3 -B "$ROOT/r15/tools/r15_walt_providers.py" verify --root "$ROOT/r15"
          echo 'R15_AUTHENTICATED_UPSTREAM_SOURCE_INPUTS=PASS'

      - name: Authenticate R14/R13/R12/R11 nested originals with path and hash gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-r15"
          mkdir -p "$ROOT/reports"
          printf '%s  %s\n' "$R14_MAIN_SHA256" "$ROOT/r15/reference/R14_MAIN_ORIGINAL.zip" | sha256sum --check --strict
          python3 -I - "$ROOT/r15/reference/R14_MAIN_ORIGINAL.zip" "$ROOT/r14" <<'PY_R14_AUTH'
          import hashlib,json,stat,sys
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          archive,dest=map(Path,sys.argv[1:])
          if not archive.is_file() or archive.is_symlink() or dest.exists():
              raise RuntimeError('R14_UNSAFE_PARENT_INPUT')
          with ZipFile(archive) as z:
              infos=z.infolist(); names=[x.filename for x in infos]
              if not infos or len(names)!=len(set(names)) or z.testzip() or sum(x.file_size for x in infos)>4_000_000:
                  raise RuntimeError('R14_CORRUPT_PARENT_ARCHIVE')
              m=json.loads(z.read('MANIFEST_SHA256.json'))
              if (m.get('schema')!='VEUX_R14_FULL_QUALCOMM_WALT_COMPONENT_COMPILER_NOFLASH' or
                  m.get('flash_allowed') is not False or m.get('full_walt_linked') is not False or
                  m.get('r13_sha256')!='71badc859c4c204edef6996fa572e558b26a646a616d1b7859d07651a6cafe19' or
                  m.get('production_patch_approved') is not False):
                  raise RuntimeError('R14_PARENT_MANIFEST_CONTRACT')
              if set(names)!=set(m['files'])|{'MANIFEST_SHA256.json'}:
                  raise RuntimeError('R14_PARENT_FILESET_DRIFT')
              dest.mkdir(parents=True)
              for info in infos:
                  rel=PurePosixPath(info.filename)
                  if (info.is_dir() or rel.is_absolute() or '..' in rel.parts or str(rel)!=info.filename or
                      '\\' in info.filename or stat.S_IFMT(info.external_attr>>16) not in (0,stat.S_IFREG)):
                      raise RuntimeError('R14_ZIP_PATH_OR_MODE_UNSAFE')
                  b=z.read(info.filename)
                  if info.filename!='MANIFEST_SHA256.json' and hashlib.sha256(b).hexdigest()!=m['files'][info.filename]:
                      raise RuntimeError('R14_CONTENT_SHA_DRIFT:'+info.filename)
                  target=dest.joinpath(*rel.parts);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(b)
          print('R14_MAIN_PINNED_PARENT_ARCHIVE=PASS')
          PY_R14_AUTH
          printf '%s  %s\n' "$R13_PARENT_SHA256" "$ROOT/r14/reference/R13_MAIN_ORIGINAL.zip" | sha256sum --check --strict
          python3 -I - "$ROOT/r14/reference/R13_MAIN_ORIGINAL.zip" "$ROOT" <<'PY_R13_AUTH'
          import hashlib,json,stat,sys
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          archive,root=map(Path,sys.argv[1:])
          specs=[(archive,root/'r13','VEUX_R13_VERIFIED_STOCK_SYSCTL_FUNCTION_PAIR_NOFLASH',4_000_000),
                 (root/'r13/reference/R12_MAIN_ORIGINAL.zip',root/'r12','VEUX_R12_WALT_PINNED_INTERFACE_HEADER_PROBE_NOFLASH',4_000_000),
                 (root/'r12/reference/R11_MAIN_ORIGINAL.zip',root/'r11','VEUX_R11_STOCK_TASK_WALT_OBJECT_PROBE_NOFLASH',4_000_000)]
          digest=lambda b:hashlib.sha256(b).hexdigest()
          for index,(arc,dst,schema,limit) in enumerate(specs):
              if not arc.is_file() or arc.is_symlink() or dst.exists():
                  raise RuntimeError('R13_UNSAFE_ARCHIVE_OR_STAGE:'+str(index))
              if index==1 and digest(arc.read_bytes())!='71a2984347ce1302f9503e240b832b8fb07506961879dceec1790e3572bfe6ee':
                  raise RuntimeError('R13_WRONG_R12_PARENT')
              if index==2 and digest(arc.read_bytes())!='06a6f468699d0785b0db8bcbb745b51d8e12d6b7c26c6b3a4999248e1e994513':
                  raise RuntimeError('R13_WRONG_R11_PARENT')
              with ZipFile(arc) as z:
                  infos=z.infolist();names=[x.filename for x in infos]
                  if not infos or len(names)!=len(set(names)) or z.testzip() is not None or sum(x.file_size for x in infos)>limit:
                      raise RuntimeError('R13_ZIP_CORRUPT_OR_OVERSIZED:'+str(index))
                  m=json.loads(z.read('MANIFEST_SHA256.json'))
                  if m.get('schema')!=schema or m.get('flash_allowed') is not False:
                      raise RuntimeError('R13_NESTED_SCHEMA_OR_FLASH_DRIFT:'+str(index))
                  if set(names)!=set(m['files'])|{'MANIFEST_SHA256.json'}:
                      raise RuntimeError('R13_NESTED_FILESET_DRIFT:'+str(index))
                  dst.mkdir(parents=True,exist_ok=False)
                  for x in infos:
                      rel=PurePosixPath(x.filename)
                      if (rel.is_absolute() or '..' in rel.parts or str(rel)!=x.filename or '\\' in x.filename or
                          x.is_dir() or stat.S_IFMT(x.external_attr>>16) not in (0,stat.S_IFREG)):
                          raise RuntimeError('R13_ZIP_PATH_OR_TYPE_UNSAFE:'+x.filename)
                      raw=z.read(x.filename)
                      if x.filename!='MANIFEST_SHA256.json' and digest(raw)!=m['files'][x.filename]:
                          raise RuntimeError('R13_PARENT_FILE_HASH_MISMATCH:'+x.filename)
                      target=dst.joinpath(*rel.parts);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(raw)
          print('R13_R12_R11_NESTED_AUTHENTICATION=PASS')
          PY_R13_AUTH
          python3 -B "$ROOT/r13/tools/r13_sysctl_pair.py" verify --root "$ROOT/r13"
          python3 -B "$ROOT/r12/tools/r12_walt_headers.py" verify --root "$ROOT/r12"
