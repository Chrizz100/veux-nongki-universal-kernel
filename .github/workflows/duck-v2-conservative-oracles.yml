name: Build Duck v2 Conservative Oracles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact upstream Duck source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: eltavine/Duck-Detector-Refactoring
          ref: f74b70686a3a573164d121b795e36954ca802dd5
          path: duck
          fetch-depth: 1
          persist-credentials: false

      - name: Verify upstream identity
        shell: bash
        working-directory: duck
        run: |
          set -euo pipefail
          expected="f74b70686a3a573164d121b795e36954ca802dd5"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "UPSTREAM_IDENTITY=PASS $actual"

      - name: Read Android toolchain settings
        id: toolchain
        shell: bash
        working-directory: duck
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path

          props = {}
          for raw in Path("gradle.properties").read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              props[key.strip()] = value.strip()

          mapping = {
              "build_tools": "duckdetector.android.buildTools",
              "cmake": "duckdetector.android.cmake",
              "compile_sdk": "duckdetector.android.compileSdk",
              "compile_sdk_minor": "duckdetector.android.compileSdkMinor",
              "ndk": "duckdetector.android.ndk",
          }
          for output_name, property_name in mapping.items():
              value = props.get(property_name)
              if not value:
                  raise SystemExit(f"Missing required Gradle property: {property_name}")
              print(f"{output_name}={value}")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install exact Android SDK packages
        shell: bash
        env:
          BUILD_TOOLS: ${{ steps.toolchain.outputs.build_tools }}
          CMAKE: ${{ steps.toolchain.outputs.cmake }}
          COMPILE_SDK: ${{ steps.toolchain.outputs.compile_sdk }}
          COMPILE_SDK_MINOR: ${{ steps.toolchain.outputs.compile_sdk_minor }}
          NDK: ${{ steps.toolchain.outputs.ndk }}
        run: |
          set -euo pipefail
          packages=(
            "platform-tools"
            "platforms;android-${COMPILE_SDK}.${COMPILE_SDK_MINOR}"
            "build-tools;${BUILD_TOOLS}"
            "cmake;${CMAKE}"
            "ndk;${NDK}"
          )
          for attempt in 1 2 3; do
            if sdkmanager --install "${packages[@]}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android SDK installation failed after 3 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Apply conservative detector fixes
        shell: bash
        working-directory: duck
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"{label}=PASS")

          # 1) Scene: verifier stays passive.
          p = Path("app/src/main/java/com/eltavine/duckdetector/features/dangerousapps/data/repository/DangerousAppsRepository.kt")
          replace_exact(
              p,
              '''        val accessOutcome = probeAccess(path)
                  val statOutcome = probeStat(path)
                  val openOutcome = probeOpen(path)
                  val createOutcome = probeCreate(path)

                  if (listOf(accessOutcome, statOutcome, openOutcome).any { it == PathProbeOutcome.MISSING }) {
                      return false
                  }

                  runCatching { Os.getxattr(path, "security.selinux") }

                  return createOutcome == CreateProbeOutcome.ALREADY_EXISTS ||
                      listOf(accessOutcome, statOutcome, openOutcome).any { it == PathProbeOutcome.EXISTS }
          ''',
              '''        val accessOutcome = probeAccess(path)
                  val statOutcome = probeStat(path)
                  val openOutcome = probeOpen(path)

                  if (listOf(accessOutcome, statOutcome, openOutcome).any { it == PathProbeOutcome.MISSING }) {
                      return false
                  }

                  runCatching { Os.getxattr(path, "security.selinux") }

                  return listOf(accessOutcome, statOutcome, openOutcome)
                      .any { it == PathProbeOutcome.EXISTS }
          ''',
              "SCENE_PASSIVE_VERIFIER",
          )

          # 2) SELinux: Java-only verdict is supporting evidence, not authoritative.
          p = Path("app/src/main/java/com/eltavine/duckdetector/features/selinux/data/repository/SelinuxRepository.kt")
          replace_exact(
              p,
              '''        val effectiveNativeAllowed = nativeAllowed.takeIf { nativeTrack.reportable }
                  val effectiveJavaAllowed = javaAllowed.takeIf { javaTrack.reportable }
                  val allowed = when {
                      effectiveNativeAllowed != null && effectiveJavaAllowed != null && effectiveNativeAllowed != effectiveJavaAllowed -> null
                      effectiveNativeAllowed == true || effectiveJavaAllowed == true -> true
                      effectiveNativeAllowed == false || effectiveJavaAllowed == false -> false
                      else -> null
                  }
                  val trusted = allowed == true && (
                      nativeTrack.trusted && effectiveNativeAllowed == true ||
                          javaTrack.trusted && effectiveJavaAllowed == true
                      )
          ''',
              '''        val effectiveNativeAllowed = nativeAllowed.takeIf { nativeTrack.reportable }
                  val effectiveJavaAllowed = javaAllowed.takeIf { javaTrack.reportable }
                  val allowed = when {
                      effectiveNativeAllowed != null &&
                          effectiveJavaAllowed != null &&
                          effectiveNativeAllowed != effectiveJavaAllowed -> null
                      effectiveNativeAllowed != null -> effectiveNativeAllowed
                      effectiveJavaAllowed != null -> null
                      else -> null
                  }
                  val trusted = allowed == true &&
                      nativeTrack.trusted &&
                      effectiveNativeAllowed == true
          ''',
              "SELINUX_NATIVE_CONFIRMATION",
          )
          replace_exact(
              p,
              '''                add("Native dedicated=${nativeTrack.describe(nativeAllowed)}")
          ''',
              '''                if (effectiveNativeAllowed == null && effectiveJavaAllowed != null) {
                          add("The Java-only app_zygote verdict is supporting evidence only and is not promoted to an authoritative dirty-policy verdict without native confirmation.")
                      }
                      add("Native dedicated=${nativeTrack.describe(nativeAllowed)}")
          ''',
              "SELINUX_JAVA_ONLY_NOTE",
          )

          # 3) Mount: raw table divergence alone is informational.
          p = Path("app/src/main/java/com/eltavine/duckdetector/features/mount/domain/MountReport.kt")
          replace_exact(
              p,
              '''    val warningFindings: List<MountFinding>
                  get() = findings.filter { it.severity == MountFindingSeverity.WARNING }

              val dangerSignalCount: Int
          ''',
              '''    val warningFindings: List<MountFinding>
                  get() = findings.filter { it.severity == MountFindingSeverity.WARNING }

              val procMountViewSemanticDrift: Boolean
                  get() = consistencyRows.any {
                      it.severity == MountFindingSeverity.WARNING ||
                          it.severity == MountFindingSeverity.DANGER
                  }

              val dangerSignalCount: Int
          ''',
              "MOUNT_SEMANTIC_DRIFT_PROPERTY",
          )
          replace_exact(
              p,
              '''    val warningSignalCount: Int
                  get() = warningFindings.size + if (procMountViewDivergent && !procMountViewTokenHit) 1 else 0
          ''',
              '''    val warningSignalCount: Int
                  get() = warningFindings.size + if (
                      procMountViewDivergent &&
                      !procMountViewTokenHit &&
                      procMountViewSemanticDrift
                  ) 1 else 0
          ''',
              "MOUNT_WARNING_GATE",
          )

          p = Path("app/src/main/java/com/eltavine/duckdetector/features/mount/presentation/MountCardModelMapper.kt")
          text = p.read_text(encoding="utf-8")
          import re

          summary_pattern = re.compile(
              r'report\.procMountViewDivergent ->\n(\s+)"Cross-process mount tables diverge from the isolated-process baseline\."'
          )
          text, summary_count = summary_pattern.subn(
              r'report.procMountViewDivergent && report.procMountViewSemanticDrift ->\n\1"Cross-process mount tables diverge and semantic consistency checks corroborate mount drift."',
              text,
          )
          if summary_count != 2:
              raise SystemExit(f"MOUNT_SUMMARY: expected 2 matches, found {summary_count}")

          impact_pattern = re.compile(
              r'} else if \(report\.procMountViewDivergent\) \{\n'
              r'(\s+)add\(\n'
              r'(\s+)MountImpactItemModel\(\n'
              r'(\s+)text = "Different processes expose different mount tables to the isolated observer, which can indicate selective mount hiding\.",\n'
              r'(\s+)status = DetectorStatus\.warning\(\),'
          )
          def impact_repl(match):
              return (
                  '} else if (report.procMountViewDivergent && report.procMountViewSemanticDrift) {\n'
                  f'{match.group(1)}add(\n'
                  f'{match.group(2)}MountImpactItemModel(\n'
                  f'{match.group(3)}text = "Different processes expose different mount tables and consistency checks corroborate semantic mount drift.",\n'
                  f'{match.group(4)}status = DetectorStatus.warning(),'
              )
          text, impact_count = impact_pattern.subn(impact_repl, text)
          if impact_count != 2:
              raise SystemExit(f"MOUNT_IMPACT: expected 2 matches, found {impact_count}")

          row_pattern = re.compile(
              r'(\s+)report\.procMountViewTokenHit -> DetectorStatus\.danger\(\)\n'
              r'(\s+)report\.procMountViewDivergent -> DetectorStatus\.warning\(\)\n'
              r'(\s+)report\.procMountViewProbeAvailable -> DetectorStatus\.allClear\(\)'
          )
          def row_repl(match):
              indent = match.group(1)
              return (
                  f'{indent}report.procMountViewTokenHit -> DetectorStatus.danger()\n'
                  f'{indent}report.procMountViewDivergent && report.procMountViewSemanticDrift -> DetectorStatus.warning()\n'
                  f'{indent}report.procMountViewDivergent -> DetectorStatus.info(InfoKind.SUPPORT)\n'
                  f'{indent}report.procMountViewProbeAvailable -> DetectorStatus.allClear()'
              )
          text, row_count = row_pattern.subn(row_repl, text, count=1)
          if row_count != 1:
              raise SystemExit(f"MOUNT_ROW_STATUS: expected 1 match, found {row_count}")
          p.write_text(text, encoding="utf-8")
          print("MOUNT_MAPPER=PASS")

          # Static post-checks.
          dangerous = Path("app/src/main/java/com/eltavine/duckdetector/features/dangerousapps/data/repository/DangerousAppsRepository.kt").read_text()
          verify_body = dangerous.split("private fun verifyPocFile(path: String): Boolean {", 1)[1].split("\n    private fun probeAccess", 1)[0]
          if "probeCreate(path)" in verify_body or "CreateProbeOutcome" in verify_body:
              raise SystemExit("Scene verifier still contains an active create probe")
          print("SCENE_POSTCHECK=PASS")

          selinux = Path("app/src/main/java/com/eltavine/duckdetector/features/selinux/data/repository/SelinuxRepository.kt").read_text()
          for required in (
              "effectiveNativeAllowed != null -> effectiveNativeAllowed",
              "effectiveJavaAllowed != null -> null",
              "Java-only app_zygote verdict is supporting evidence only",
          ):
              if required not in selinux:
                  raise SystemExit(f"SELinux post-check missing: {required}")
          print("SELINUX_POSTCHECK=PASS")

          mount = Path("app/src/main/java/com/eltavine/duckdetector/features/mount/domain/MountReport.kt").read_text()
          if "val procMountViewSemanticDrift: Boolean" not in mount:
              raise SystemExit("Mount semantic drift property missing")
          print("MOUNT_POSTCHECK=PASS")
          PY

      - name: Add focused regression tests
        shell: bash
        working-directory: duck
        run: |
          set -euo pipefail
          mkdir -p app/src/test/java/com/eltavine/duckdetector/features/selinux/data/repository
          cat > app/src/test/java/com/eltavine/duckdetector/features/selinux/data/repository/ConservativeDirtyPolicyOracleTest.kt <<'EOF'
          package com.eltavine.duckdetector.features.selinux.data.repository

          import com.eltavine.duckdetector.features.selinux.data.native.SelinuxContextValiditySnapshot
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertNull
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class ConservativeDirtyPolicyOracleTest {
              private val repository = SelinuxRepository()

              @Test
              fun `java only allowed is supporting evidence not authoritative`() {
                  val methods = repository.buildDirtyPolicyMethods(
                      SelinuxContextValiditySnapshot(
                          javaDirtyPolicyAvailable = true,
                          javaDirtyPolicyProbeAttempted = true,
                          javaDirtyPolicyCarrierContext = "u:r:app_zygote:s0:c1,c2",
                          javaDirtyPolicyCarrierMatchesExpected = true,
                          javaDirtyPolicyControlsPassed = true,
                          javaDirtyPolicyStable = true,
                          javaDirtyPolicyQueryMethod = "android.os.SELinux.checkSELinuxAccess",
                          javaDirtyPolicyAccessControlAllowed = true,
                          javaDirtyPolicyNegativeControlRejected = true,
                          javaDirtyPolicyFsckSysAdminAllowed = true,
                      ),
                  )
                  val row = methods.single { it.method == "Dirty sepolicy rule: fsck_untrusted sys_admin" }
                  assertEquals("Unavailable", row.status)
                  assertNull(row.isSecure)
                  assertFalse(row.dirtyPolicyTrusted)
                  assertTrue(row.details.orEmpty().contains("supporting evidence only"))
              }

              @Test
              fun `native allowed remains authoritative when trusted`() {
                  val methods = repository.buildDirtyPolicyMethods(
                      SelinuxContextValiditySnapshot(
                          dirtyPolicyAvailable = true,
                          dirtyPolicyProbeAttempted = true,
                          dirtyPolicyCarrierContext = "u:r:app_zygote:s0:c1,c2",
                          dirtyPolicyCarrierMatchesExpected = true,
                          dirtyPolicyControlsPassed = true,
                          dirtyPolicyStable = true,
                          dirtyPolicyQueryMethod = "selinux_check_access",
                          dirtyPolicyAccessControlAllowed = true,
                          dirtyPolicyNegativeControlRejected = true,
                          dirtyPolicyFsckSysAdminAllowed = true,
                      ),
                  )
                  val row = methods.single { it.method == "Dirty sepolicy rule: fsck_untrusted sys_admin" }
                  assertEquals("Allowed", row.status)
                  assertEquals(false, row.isSecure)
                  assertTrue(row.dirtyPolicyTrusted)
              }
          }
          EOF

          mkdir -p app/src/test/java/com/eltavine/duckdetector/features/mount/domain
          cat > app/src/test/java/com/eltavine/duckdetector/features/mount/domain/MountReportSemanticDriftTest.kt <<'EOF'
          package com.eltavine.duckdetector.features.mount.domain

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class MountReportSemanticDriftTest {
              private fun report(findings: List<MountFinding> = emptyList()) = MountReport(
                  stage = MountStage.READY,
                  nativeAvailable = true,
                  mountsReadable = true,
                  mountInfoReadable = true,
                  mapsReadable = true,
                  filesystemsReadable = true,
                  initNamespaceReadable = false,
                  statxSupported = true,
                  permissionTotal = 20,
                  permissionDenied = 0,
                  permissionAccessible = 20,
                  mountEntryCount = 30,
                  mountInfoEntryCount = 30,
                  mapLineCount = 30,
                  earlyPreloadAvailable = true,
                  earlyPreloadDetected = false,
                  earlyPreloadContextValid = true,
                  earlyPreloadFindingCount = 0,
                  findings = findings,
                  impacts = emptyList(),
                  methods = emptyList(),
                  procMountViewProbeAvailable = true,
                  procMountViewDistinctCount = 2,
                  procMountViewExpectedCount = 1,
                  procMountViewPidCount = 20,
                  procMountViewDivergent = true,
                  procMountViewTokenHit = false,
              )

              @Test
              fun `raw process table divergence alone is informational`() {
                  val report = report()
                  assertFalse(report.procMountViewSemanticDrift)
                  assertEquals(0, report.warningSignalCount)
              }

              @Test
              fun `consistency warning corroborates semantic drift`() {
                  val finding = MountFinding(
                      id = "semantic_consistency_test",
                      label = "Semantic mount drift",
                      value = "Divergent",
                      group = MountFindingGroup.CONSISTENCY,
                      severity = MountFindingSeverity.WARNING,
                  )
                  val report = report(listOf(finding))
                  assertTrue(report.procMountViewSemanticDrift)
                  assertEquals(2, report.warningSignalCount)
              }
          }
          EOF

      - name: Make Gradle wrapper executable
        shell: bash
        working-directory: duck
        run: chmod +x gradlew

      - name: Run focused regression tests
        shell: bash
        working-directory: duck
        run: |
          set -euo pipefail
          ./gradlew \
            :app:testDebugUnitTest \
            --tests 'com.eltavine.duckdetector.features.selinux.data.repository.SelinuxRepositoryDirtyPolicyMethodsTest' \
            --tests 'com.eltavine.duckdetector.features.selinux.data.repository.ConservativeDirtyPolicyOracleTest' \
            --tests 'com.eltavine.duckdetector.features.mount.domain.MountReportSemanticDriftTest' \
            -x :app:generateGithubContributorsAsset \
            --stacktrace

      - name: Build debug APK
        shell: bash
        working-directory: duck
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug -x :app:generateGithubContributorsAsset --stacktrace

      - name: Validate and package APK
        shell: bash
        working-directory: duck
        run: |
          set -euo pipefail
          src="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$src"
          mkdir -p ../out
          dst="../out/DuckDetector-f74b706-v2-conservative-oracles.apk"
          cp "$src" "$dst"
          sha256sum "$dst" | tee ../out/SHA256SUMS.txt
          echo "APK_PACKAGE=PASS"

      - name: Upload patched APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DuckDetector-f74b706-v2-conservative-oracles
          path: |
            out/DuckDetector-f74b706-v2-conservative-oracles.apk
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
