name: VEUX R32 - Pinned Image DTB and Six Module Static Gate - NO FLASH

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veux-r32-static-${{ github.ref }}
  cancel-in-progress: false

env:
  R32_ZIP: VEUX_R32_IMAGE_DTB_ABI_MAIN.zip
  R32_SHA256: 5a809f730f53c8696719820cab215fbc694f9ff99e36bb83cba41e0195e8a8f6
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  pinned-static-audit:
    name: R32 pinned kernel image, DTB and six modules - NO FLASH
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository in read-only mode
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify immutable root ZIP and safe unpack
        shell: bash
        run: |
          set -euo pipefail
          test -f "$R32_ZIP"
          printf '%s  %s\n' "$R32_SHA256" "$R32_ZIP" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/r32-input"
          python3 - "$R32_ZIP" "$RUNNER_TEMP/r32-input" <<'PY_R32_EXTRACT'
          import pathlib,sys,zipfile,stat
          archive=pathlib.Path(sys.argv[1]); target=pathlib.Path(sys.argv[2]); total=0
          with zipfile.ZipFile(archive) as z:
              names=[i.filename for i in z.infolist() if not i.is_dir()]
              if len(names)!=len(set(names)) or len(names)!=27:
                  raise SystemExit('R32_DUPLICATE_OR_WRONG_MEMBER_COUNT')
              for i in z.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  if p.is_absolute() or '..' in p.parts or '\\' in i.filename or stat.S_ISLNK(i.external_attr >> 16):
                      raise SystemExit('R32_UNSAFE_ZIP_PATH')
                  total+=i.file_size
                  if i.file_size>48_000_000 or total>86_000_000:
                      raise SystemExit('R32_ZIP_TOO_LARGE')
              z.extractall(target)
          print('R32_SAFE_EXTRACTION=PASS')
          PY_R32_EXTRACT

      - name: Authenticate bundled original evidence before execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/r32-input" <<'PY_R32_HASH'
          import pathlib,json,hashlib,sys
          base=pathlib.Path(sys.argv[1]); manifest=json.loads((base/'MANIFEST_SHA256.json').read_text())
          expected=set(manifest['files'])|{'MANIFEST_SHA256.json'}
          found={str(p.relative_to(base)) for p in base.rglob('*') if p.is_file()}
          if expected!=found:raise SystemExit('R32_UNEXPECTED_FILES')
          for rel,info in manifest['files'].items():
              blob=(base/rel).read_bytes()
              if len(blob)!=info['bytes'] or hashlib.sha256(blob).hexdigest()!=info['sha256']:
                  raise SystemExit('R32_INPUT_HASH_FAIL:'+rel)
          print('R32_ORIGINAL_FILES_AND_SHA256=PASS')
          PY_R32_HASH

      - name: Static Green gate with pinned actionlint and ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/r32-input/tools/actionlint"
          "$RUNNER_TEMP/r32-input/tools/actionlint" -version | grep -Fx '1.7.12'
          "$RUNNER_TEMP/r32-input/tools/actionlint" -shellcheck "$(command -v shellcheck)" ".github/workflows/VEUX_R32_IMAGE_DTB_ABI_GATE.yml"
          python3 - "$RUNNER_TEMP/r32-input" <<'PY_R32_PYTHON'
          import pathlib,sys
          base=pathlib.Path(sys.argv[1]);
          for p in ['scripts/r32_gate.py','tests/test_r32.py']:
              compile((base/p).read_bytes(),str(base/p),'exec')
          print('R32_PYTHON_SYNTAX=PASS')
          PY_R32_PYTHON

      - name: Run 46 guarded regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -v -s "$RUNNER_TEMP/r32-input/tests" -p 'test_r32.py'
          echo 'R32_REGRESSIONS=PASS'

      - name: Produce read-only R32 ABI and DTB report
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$RUNNER_TEMP/r32-input/scripts/r32_gate.py" --bundle "$RUNNER_TEMP/r32-input" --out "$RUNNER_TEMP/r32-results"
          python3 - "$RUNNER_TEMP/r32-results/R32_RESULT.json" <<'PY_R32_GUARD'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j['r20_matching_imports']==307
          assert j['r20_all_six_module_imports']==307
          assert j['kernel_built_in_r32'] is False
          assert j.get('flash_allowed',False) is False
          print('R32_GATE=PASS; MODULE_IMPORTS=307/307; FLASH=NO')
          PY_R32_GUARD
          cat "$RUNNER_TEMP/r32-results/R32_BERICHT_DE.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-flashable report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VEUX-R32-STATIC-ABI-REPORT-${{ github.run_id }}
          path: ${{ runner.temp }}/r32-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify workspace unchanged and forbid flash payloads
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          if find "$RUNNER_TEMP/r32-results" -type f \( -name '*.img' -o -name '*.ko' -o -name '*.dtb' \) | grep -q .; then
            echo 'R32_FORBIDDEN_BINARY_OUTPUT' >&2
            exit 1
          fi
          echo 'R32_WORKTREE_CLEAN=YES; KERNEL_BUILT=NO; FLASH=NO'
