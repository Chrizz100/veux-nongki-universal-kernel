    - name: Strict actionlint YAML parser and ShellCheck gate
      run: |
        set -euo pipefail
        archive='project/VEUX_R39_R2_MEMORY_ABI_MAIN.zip'
        printf '%s  %s\n' '745d80b8502a9beea513a2e7a58bb59272539b7508920d235ce2e79741bda528' "$archive" | sha256sum -c -
        unzip -p "$archive" tools/actionlint > "$R55_STAGE/actionlint"
        chmod 0755 "$R55_STAGE/actionlint"
        "$R55_STAGE/actionlint" -version | grep -Fx '1.7.12'
        "$R55_STAGE/actionlint" -color=false -shellcheck='' 'project/.github/workflows/VEUX_R55D1_SUSFS54_TASK_MMU_SUSMAP_SOURCE_ONLY.yml' > "$R55_STAGE/R55D1_ACTIONLINT.log"
        printf 'R55D1_ACTIONLINT=PASS\n' >> "$R55_STAGE/R55D1_ACTIONLINT.log"
        python3 -B - <<'PY_R55D1_YAML_AUDIT'
        import pathlib,hashlib,subprocess,yaml
        class Unique(yaml.SafeLoader): pass
        def mapping(loader,node):
            result={}
            for kn,vn in node.value:
                k=loader.construct_object(kn)
                if k in result:raise RuntimeError('DUPLICATE_KEY:'+str(k))
                result[k]=loader.construct_object(vn)
            return result
        Unique.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,mapping)
        w=yaml.load(pathlib.Path('project/.github/workflows/VEUX_R55D1_SUSFS54_TASK_MMU_SUSMAP_SOURCE_ONLY.yml').read_text('utf-8'),Loader=Unique)
        assert list(w['on'])==['workflow_dispatch']
        assert w['permissions']=={'contents':'read'}
        assert set(w['jobs'])=={'r55d1_source'}
        j=w['jobs']['r55d1_source'];s=j['steps']
        assert j['runs-on']=='ubuntu-24.04'
        assert j['timeout-minutes']==35
        expected_if=chr(36)+chr(123)+chr(123)+" github.repository == 'Chrizz100/veux-nongki-universal-kernel' && github.ref == 'refs/heads/main' "+chr(125)+chr(125)
        assert j['if']==expected_if
        assert len(s)==9
        for i in (0,1):
            assert s[i]['uses']=='actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683'
            assert s[i]['with']['persist-credentials'] is False
        assert s[1]['with']['repository']=='dereference23/kernel_xiaomi_sm6375'
        assert s[1]['with']['ref']=='b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'
        assert s[8]['uses']=='actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02'
        assert s[8]['with']['if-no-files-found']=='error'
        logs=[]
        for step in s:
            if 'run' not in step:continue
            body=step['run']
            if chr(36)+chr(123) in body:raise RuntimeError('GITHUB_INTERPOLATION_INSIDE_RUN_BODY')
            for cmd in (['bash','-n','-'],['shellcheck','--shell=bash','--severity=warning','-']):
                q=subprocess.run(cmd,input=body,text=True,capture_output=True)
                if q.returncode:raise RuntimeError('SHELL_FAIL:'+step['name']+':'+q.stdout+q.stderr)
            logs.append(step['name']+' BASH_SHELLCHECK_PASS SHA256='+hashlib.sha256(body.encode()).hexdigest())
        pathlib.Path('/tmp/veux-r55d1/R55D1_SHELLCHECK.log').write_text('\n'.join(logs)+'\n')
        print('R55D1_STRICT_YAML_ACTIONS_INPUTS_SHELLCHECK=PASS')
        PY_R55D1_YAML_AUDIT
    - name: 31 positive negative compiled C and synthetic 17-file Git regression tests
      run: |
        set -euo pipefail
        python3 -B - <<'PY_R55D1_AST'
        import pathlib,ast
        s=pathlib.Path('/tmp/veux-r55d1')
        for name in ('scripts/r55d1_task_mmu.py','tests/test_r55d1_task_mmu.py'):
            ast.parse((s/name).read_text('utf-8'))
        print('R55D1_PYTHON_AST=PASS')
        PY_R55D1_AST
        python3 -B -m unittest discover -v -s "$R55_STAGE/tests" -p 'test_*.py' 2>&1 | tee "$R55_STAGE/R55D1_TESTS.log"
        grep -Eq '^Ran 31 tests in [0-9.]+s$' "$R55_STAGE/R55D1_TESTS.log"
        grep -Fx 'OK' "$R55_STAGE/R55D1_TESTS.log"
        echo 'R55D1_31_POSITIVE_NEGATIVE_C_AND_SYNTHETIC_17FILE_TESTS=PASS'
    - name: Replay real R55C2-R2 and port pinned task_mmu SUS_MAP hooks
      run: |
        set -euo pipefail
        python3 -B "$R55_STAGE/scripts/r55d1_task_mmu.py"   --source kernel   --base "$R55_STAGE/inputs/R55C2_R2_AUTHENTIC_16FILES.patch"   --out "$R55_STAGE/out" 2>&1 | tee "$R55_STAGE/R55D1_REAL_SOURCE.log"
        python3 -B - <<'PY_R55D1_POST'
        import pathlib,json,hashlib
        out=pathlib.Path('/tmp/veux-r55d1/out')
        r=json.loads((out/'R55D1_RESULT.json').read_text('utf-8'))
        assert r['files_total']==17 and not r['kernel_compiled'] and not r['flash_allowed']
        assert r['r55c2_r2_input_sha256']=='e9f26685f5e7f266706bcee29caf4947e7caff27776e15a136e81eedb526dcb7'
        p=out/'VEUX_R55D1_SUSFS54_17_FILES_TASK_MMU_SUSMAP_NOFLASH.patch'
        assert hashlib.sha256(p.read_bytes()).hexdigest()==r['complete_17_file_patch_sha256']
        print('R55D1_REAL_PINNED_SOURCE_POSTCHECK=PASS')
        PY_R55D1_POST
    - name: Independent clean exact 17-file source replay
      run: |
        set -euo pipefail
        git -C kernel worktree add --detach "$R55_STAGE/replay" b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
        total="$R55_STAGE/out/VEUX_R55D1_SUSFS54_17_FILES_TASK_MMU_SUSMAP_NOFLASH.patch"
        git -C "$R55_STAGE/replay" apply --check --whitespace=error "$total"
        git -C "$R55_STAGE/replay" apply --whitespace=error "$total"
        git -C "$R55_STAGE/replay" add -N -- fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h
        git -C "$R55_STAGE/replay" diff --check
        git -C "$R55_STAGE/replay" apply --reverse --check "$total"
        python3 -B - <<'PY_R55D1_REPLAY'
        import pathlib,subprocess,hashlib,json,sys
        stage=pathlib.Path('/tmp/veux-r55d1');src=pathlib.Path('kernel');check=stage/'replay';out=stage/'out'
        sys.path.insert(0,str(stage/'scripts'))
        import r55d1_task_mmu as port
        def cmd(*args):return subprocess.run(args,capture_output=True,check=True).stdout
        scope=set(cmd('git','-C',str(check),'diff','--name-only').decode().splitlines())
        assert scope==port.EXPECTED,('WRONG_17_FILE_SCOPE',sorted(scope^port.EXPECTED))
        for f in sorted(scope):
            assert hashlib.sha256((src/f).read_bytes()).digest()==hashlib.sha256((check/f).read_bytes()).digest(),f
        replayed=cmd('git','-C',str(check),'diff','--binary','--no-ext-diff')
        assert replayed==(out/port.TOTAL_NAME).read_bytes(),'PATCH_BYTES_DIFFER_AFTER_INDEPENDENT_REPLAY'
        r=json.loads((out/port.RESULT_NAME).read_text('utf-8'))
        assert r['files_total']==17 and not r['flash_allowed']
        r['source_replay_verified']=True
        (out/port.RESULT_NAME).write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
        print('R55D1_INDEPENDENT_17_FILE_BYTE_IDENTICAL_REPLAY=PASS')
        PY_R55D1_REPLAY
    - name: Final 17-file scope checksums and NOFLASH gate
      run: |
        set -euo pipefail
        cp "$R55_STAGE/R55D1_ACTIONLINT.log" "$R55_STAGE/R55D1_SHELLCHECK.log"    "$R55_STAGE/R55D1_TESTS.log" "$R55_STAGE/R55D1_REAL_SOURCE.log" "$R55_STAGE/out/"
        python3 -B - <<'PY_R55D1_FINAL'
        import pathlib,json,hashlib
        out=pathlib.Path('/tmp/veux-r55d1/out')
        r=json.loads((out/'R55D1_RESULT.json').read_text())
        assert r['source_replay_verified'] is True and r['files_total']==17
        for key in ('kernel_compiled','full_susfs_port','baka_su_uapi6_integrated',
                    'nomount_v22_integrated','device_tested','brene_changed',
                    'vendor_changed','boot_ready','flash_allowed','user_repo_modified',
                    'sus_map_task_mmu_pagemap_staged','task_mmu_open_redirect_staged',
                    'task_mmu_kstat_staged'):
            assert r[key] is False,key
        assert len(list(p for p in out.iterdir() if p.is_file()))==8
        (out/'SHA256SUMS.txt').write_text(''.join(
            hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n'
            for p in sorted(out.iterdir()) if p.is_file()))
        print('R55D1_FINAL_17_FILE_SCOPE_SHA256_NOFLASH=PASS')
        PY_R55D1_FINAL
        (cd "$R55_STAGE/out" && sha256sum -c SHA256SUMS.txt)
        test -z "$(git -C project status --porcelain --untracked-files=all)"
        echo 'R55D1_PROJECT_UNCHANGED; BUILD=NO; FLASH_ALLOWED=NO'
    - name: Upload only source patches and audit evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: VEUX-R55D1-TASK-MMU-SUSMAP-17FILES-NOFLASH-${{ github.run_id }}
        path: /tmp/veux-r55d1/out/
        retention-days: 14
        if-no-files-found: error
