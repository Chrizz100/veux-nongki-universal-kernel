---
name: VEUX All-in-One Updater V4 - Publish and update sources
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: veux-all-in-one-publish-main
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  update:
    name: Build, publish each kernel, update validated sources
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - name: Checkout exact project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 1
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Use exact main snapshot
      shell: bash
      run: |
        set -euo pipefail
        git checkout -B main "${GITHUB_SHA}"
    - name: Install build dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends bc binutils bison build-essential ca-certificates curl dwarves file flex git jq libelf-dev libncurses-dev libssl-dev perl python3 python3-venv python3-yaml rsync unzip zip xz-utils zstd
        python3 -m venv "$RUNNER_TEMP/veux-python"
        "$RUNNER_TEMP/veux-python/bin/python" -m pip install ruamel.yaml==0.19.1 PyYAML==6.0.3
    - name: Verify engine and source contracts
      shell: bash
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/veux-python/bin/python" common/scripts/test_veux_update_engine.py
        "$RUNNER_TEMP/veux-python/bin/python" common/scripts/test_veux_release.py
    - name: Resolve and authenticate upstreams once
      shell: bash
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/veux-python/bin/python" -u common/scripts/veux_update_engine.py resolve --work "$RUNNER_TEMP/veux-targets"
    - name: Build and validate 5.4.274
      id: kernel_5_4_274
      shell: bash
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/veux-python/bin/python" -u common/scripts/veux_release.py worker --kernel 5.4.274 --bundle "$RUNNER_TEMP/veux-targets" --work "$RUNNER_TEMP/veux-builds/5.4.274" --public "$RUNNER_TEMP/veux-public/5.4.274" --overlays "$RUNNER_TEMP/veux-overlays" --jobs "$(nproc)"
    - name: Publish 5.4.274
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.kernel_5_4_274.outputs.artifact_name }}
        path: ${{ runner.temp }}/veux-public/5.4.274/
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
    - name: Build and validate 5.4.292
      id: kernel_5_4_292
      shell: bash
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/veux-python/bin/python" -u common/scripts/veux_release.py worker --kernel 5.4.292 --bundle "$RUNNER_TEMP/veux-targets" --work "$RUNNER_TEMP/veux-builds/5.4.292" --public "$RUNNER_TEMP/veux-public/5.4.292" --overlays "$RUNNER_TEMP/veux-overlays" --jobs "$(nproc)"
    - name: Publish 5.4.292
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.kernel_5_4_292.outputs.artifact_name }}
        path: ${{ runner.temp }}/veux-public/5.4.292/
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
    - name: Build and validate 5.4.293
      id: kernel_5_4_293
      shell: bash
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/veux-python/bin/python" -u common/scripts/veux_release.py worker --kernel 5.4.293 --bundle "$RUNNER_TEMP/veux-targets" --work "$RUNNER_TEMP/veux-builds/5.4.293" --public "$RUNNER_TEMP/veux-public/5.4.293" --overlays "$RUNNER_TEMP/veux-overlays" --jobs "$(nproc)"
    - name: Publish 5.4.293
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.kernel_5_4_293.outputs.artifact_name }}
        path: ${{ runner.temp }}/veux-public/5.4.293/
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
    - name: Build and validate 5.4.300
      id: kernel_5_4_300
      shell: bash
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/veux-python/bin/python" -u common/scripts/veux_release.py worker --kernel 5.4.300 --bundle "$RUNNER_TEMP/veux-targets" --work "$RUNNER_TEMP/veux-builds/5.4.300" --public "$RUNNER_TEMP/veux-public/5.4.300" --overlays "$RUNNER_TEMP/veux-overlays" --jobs "$(nproc)"
    - name: Publish 5.4.300
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.kernel_5_4_300.outputs.artifact_name }}
        path: ${{ runner.temp }}/veux-public/5.4.300/
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
    - name: Build and validate 5.4.301
      id: kernel_5_4_301
      shell: bash
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/veux-python/bin/python" -u common/scripts/veux_release.py worker --kernel 5.4.301 --bundle "$RUNNER_TEMP/veux-targets" --work "$RUNNER_TEMP/veux-builds/5.4.301" --public "$RUNNER_TEMP/veux-public/5.4.301" --overlays "$RUNNER_TEMP/veux-overlays" --jobs "$(nproc)"
    - name: Publish 5.4.301
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.kernel_5_4_301.outputs.artifact_name }}
        path: ${{ runner.temp }}/veux-public/5.4.301/
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
    - name: Build and validate 5.4.302
      id: kernel_5_4_302
      shell: bash
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/veux-python/bin/python" -u common/scripts/veux_release.py worker --kernel 5.4.302 --bundle "$RUNNER_TEMP/veux-targets" --work "$RUNNER_TEMP/veux-builds/5.4.302" --public "$RUNNER_TEMP/veux-public/5.4.302" --overlays "$RUNNER_TEMP/veux-overlays" --jobs "$(nproc)"
    - name: Publish 5.4.302
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.kernel_5_4_302.outputs.artifact_name }}
        path: ${{ runner.temp }}/veux-public/5.4.302/
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
    - name: Verify repository before promotion
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        test -z "$(git status --porcelain --untracked-files=all)"
    - name: Commit validated sources to main
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        echo "::add-mask::$AUTH_HEADER"
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH_HEADER"
        "$RUNNER_TEMP/veux-python/bin/python" -u common/scripts/veux_release.py promote --bundle "$RUNNER_TEMP/veux-targets" --artifacts "$RUNNER_TEMP/veux-public" --overlays "$RUNNER_TEMP/veux-overlays" --output "$RUNNER_TEMP/veux-promotion"
    - name: Publish failure diagnostics
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: VEUX-Updater-Diagnostics-${{ github.run_id }}
        path: ${{ runner.temp }}/veux-builds/diagnostics/
        if-no-files-found: warn
        retention-days: 7
    if: ${{ github.ref == 'refs/heads/main' }}
