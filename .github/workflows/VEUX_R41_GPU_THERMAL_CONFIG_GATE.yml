              def test_no_runtime_or_boot_false_positive(self):
                  stock={g.GFX_PATH:node(g.REG_COMPAT,81),g.GFX_DISABLED_PATH:node('',0,'disabled'),
                         '/soc/thermal-zones/zeroc-0-step/cooling-maps/gfx':{'cooling-device':struct.pack('>III',81,2,2)},
                         '/soc/thermal-zones/zeroc-1-step/cooling-maps/gfx':{'cooling-device':struct.pack('>III',81,2,2)}}
                  r20={'/soc/devfreq-vdd-cdev':node(g.DEV_COMPAT,81),
                       '/soc/thermal-zones/zeroc-0-step/cooling-maps/dev':{'cooling-device':struct.pack('>III',81,2,2)},
                       '/soc/thermal-zones/zeroc-1-step/cooling-maps/dev':{'cooling-device':struct.pack('>III',81,2,2)}}
                  cfg={'r20_devfreq':'n','stock_devfreq':'y','r20_regulator':'y','stock_regulator':'y'}
                  report=g.summary(stock,r20,cfg)
                  for k in ('boot_ready','vendor_abi_proven','flash_allowed','runtime_driver_probe_proven'):
