          python3 -B - "$R41_STAGE" <<'PY_R41_COMPILE'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1])
          for p in (root/'r41_gate.py',root/'tests/test_r41_gate.py'):
              compile(p.read_bytes(),str(p),'exec')
          print('R41_PYTHON_SYNTAX=PASS')
          PY_R41_COMPILE

      - name: Check this EXACT workflow with actionlint 1.7.12 and genuine ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          command -v shellcheck
          test -f '.github/workflows/VEUX_R41_GPU_THERMAL_CONFIG_GATE.yml'
          unzip -p VEUX_R39_R2_MEMORY_ABI_MAIN.zip tools/actionlint > "$R41_STAGE/actionlint"
          chmod 0755 "$R41_STAGE/actionlint"
          "$R41_STAGE/actionlint" -version | grep -Fx '1.7.12'
          "$R41_STAGE/actionlint" -color=false -shellcheck="$(command -v shellcheck)" \
            .github/workflows/VEUX_R41_GPU_THERMAL_CONFIG_GATE.yml
          echo 'R41_ACTIONLINT_SHELLCHECK=PASS'

      - name: Run 14 new regression/negative cases and pin real R20 input
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -W error::ResourceWarning -m unittest discover \
            -v -s "$R41_STAGE/tests" -p 'test_r41_gate.py' 2>&1 \
            | tee "$R41_REPORT/R41_TESTS.log"
          python3 -B "$R41_STAGE/r41_gate.py" \
            --r39-zip VEUX_R39_R2_MEMORY_ABI_MAIN.zip \
            --r26-zip VEUX_OEM_WALT_R26_R2_SYMVERS_SEMANTIC_PROOF_MAIN.zip \
            --preflight
          echo 'R41_PINNED_CONFIG_AND_REAL_RAW_R20_DTB=PASS'

      - name: Audit actual pinned Stock and R20 GPU cooling maps offline
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v fdtoverlay >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends device-tree-compiler
          fi
          command -v fdtoverlay
          python3 -B "$R41_STAGE/r41_gate.py" \
            --r39-zip VEUX_R39_R2_MEMORY_ABI_MAIN.zip \
            --r26-zip VEUX_OEM_WALT_R26_R2_SYMVERS_SEMANTIC_PROOF_MAIN.zip \
            --r37-zip VEUX_R37_DEVICE_EVIDENCE.zip \
            --out "$R41_REPORT"
          cat "$R41_REPORT/R41_BERICHT_DE.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Strict result guards, SHA256 and no changes or flashable files
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$R41_REPORT" <<'PY_R41_GUARD'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);r=json.loads((p/'R41_RESULT.json').read_text(encoding='utf-8'))
          expected={'R41_RESULT.json','R41_COOLING_PHANDLES.csv','R41_KERNEL_CONFIG.csv',
                    'R41_BERICHT_DE.txt','R41_TESTS.log','SHA256SUMS.txt'}
          if {q.name for q in p.iterdir()} != expected or not all((p/x).stat().st_size>0 for x in expected):
              raise SystemExit('R41_OUTPUT_MANIFEST_MISMATCH')
          if (r.get('schema')!='VEUX_R41_GPU_THERMAL_BUILD_CONFIG_PINNED_V1' or
              r.get('result')!='GPU_DT_CONFIG_MISMATCH_CONFIRMED_OFFLINE' or
              r['config']['r20_devfreq']!='n' or r['config']['stock_devfreq']!='y' or
              len(r['stock_active_regulator_gfx']['references'])!=2 or
              len(r['r20_devfreq_gpu']['references'])!=2 or
              not r['r20_devfreq_node_has_two_cooling_maps_but_config_disables_driver']):
              raise SystemExit('R41_ORIGINAL_EVIDENCE_UNEXPECTED')
          for k in ('boot_ready','vendor_abi_proven','flash_allowed',
                    'build_performed','runtime_driver_probe_proven','brene_modified',
                    'r20_sources_modified','bootloader_dtbo0_choice_proven'):
              if r.get(k) is not False:raise SystemExit('R41_UNSAFE_SUCCESS_FLAG:'+k)
          print('R41_RESULT_GUARDS=PASS; RUNTIME_NOT_PROVEN; BOOT_READY=NO; FLASH=NO')
          PY_R41_GUARD
          (cd "$R41_REPORT" && sha256sum -c SHA256SUMS.txt)
          if find "$R41_REPORT" -type f \( -name '*.ko' -o -name '*.img' -o -name '*.dtb' \
              -o -name '*.dtbo' -o -name '*.zip' -o -name '*.sh' \) | grep -q .; then
            echo 'R41_FORBIDDEN_FLASHABLE_OUTPUT' >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo 'R41_REPOSITORY_UNCHANGED=YES; KERNEL_BUILT=NO; FLASH_ALLOWED=NO'

      - name: Upload only non-flashable R41 evidence and logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VEUX-R41-THERMAL-CONFIG-${{ github.run_id }}
          path: ${{ env.R41_REPORT }}
          retention-days: 14
          if-no-files-found: error
