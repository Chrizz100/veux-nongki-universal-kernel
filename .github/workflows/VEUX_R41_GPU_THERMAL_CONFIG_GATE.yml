                      self.assertEqual(len(list(pathlib.Path(temp).glob('*.csv'))),2)
                      self.assertTrue((pathlib.Path(temp)/'SHA256SUMS.txt').exists())
          
              def test_no_false_config_mismatch_when_driver_enabled(self):
                  stock={g.GFX_PATH:node(g.REG_COMPAT,81),g.GFX_DISABLED_PATH:node('',0,'disabled'),
