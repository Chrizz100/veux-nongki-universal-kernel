name: 03 - VEUX 5.4.292 Native Baseline V3 Runner Fix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veux-5.4.292-native-baseline-v3-runner-fix
  cancel-in-progress: false

jobs:
  baseline:
    name: Native 5.4.292 baseline V3
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Initialize workflow diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit/workflow-03
          {
            echo "WORKFLOW=03"
            echo "PURPOSE=RUN_UNCHANGED_BASELINE_BUILD_V3"
            echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "DEVICE_PASS=NO"
          } > .audit/workflow-03/runner.txt

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             bc             bison             build-essential             ca-certificates             curl             dwarves             flex             git             libelf-dev             libncurses-dev             libssl-dev             perl             python3             rsync             xz-utils             zstd

      - name: Verify unchanged V3 baseline script
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="lineages/5.4.292/BASELINE_BUILD_V3.sh"
          EXPECTED_SHA256="22068e1b4504d14df1271e77465b0e662c4f4119199566878f48fbd9de8db0c2"

          test -f "$SCRIPT"
          bash -n "$SCRIPT"

          actual="$(sha256sum "$SCRIPT" | awk '{print $1}')"
          {
            echo "EXPECTED_SHA256=$EXPECTED_SHA256"
            echo "ACTUAL_SHA256=$actual"
          } | tee .audit/workflow-03/script-sha256.txt

          test "$actual" = "$EXPECTED_SHA256"

          echo "BASELINE_V3_SCRIPT_GATE=PASS" | tee -a .audit/workflow-03/runner.txt

      - name: Run native 5.4.292 baseline V3
        shell: bash
        run: |
          set -euo pipefail
          bash lineages/5.4.292/BASELINE_BUILD_V3.sh

      - name: Verify V3 baseline result
        shell: bash
        run: |
          set -euo pipefail

          RESULT=".work/5.4.292-baseline-v3/results/BASELINE_RESULT.txt"
          IMAGE=".work/5.4.292-baseline-v3/out/arch/arm64/boot/Image"

          test -s "$RESULT"
          test -s "$IMAGE"

          grep -Fxq 'BASELINE_COMPILE=PASS' "$RESULT"
          grep -Fxq 'BASELINE_TARGET=Image' "$RESULT"
          grep -Fxq 'DEFAULT_ALL_DTBO_TARGET=INTENTIONALLY_NOT_USED' "$RESULT"
          grep -Fxq 'SOURCE_PIN=PASS' "$RESULT"
          grep -Fxq 'EXISTING_INTEGRATION_AUDIT=PASS' "$RESULT"
          grep -Fxq 'DEFCONFIG=PASS' "$RESULT"
          grep -Fxq 'IMAGE_PRESENT=PASS' "$RESULT"
          grep -Fxq 'KERNELRELEASE_NATIVE_5_4_292=PASS' "$RESULT"
          grep -Fxq 'IDENTITY_GUARD=PASS' "$RESULT"
          grep -Fxq 'RESUKISU=NOT_PRESENT' "$RESULT"
          grep -Fxq 'SUSFS=NOT_PRESENT' "$RESULT"
          grep -Fxq 'LINEAGE_PATCHES=NONE' "$RESULT"
          grep -Fxq 'PACKAGE=NOT_CREATED' "$RESULT"
          grep -Fxq 'STATIC_BOOT_PATH=NOT_RUN' "$RESULT"
          grep -Fxq 'DEVICE_PASS=NO' "$RESULT"

          cat "$RESULT"
          sha256sum "$IMAGE"

          echo "RESULT_GATE=PASS" | tee -a .audit/workflow-03/runner.txt

      - name: Capture failure context
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo "WORKFLOW_RESULT=FAIL"
            echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
            echo
            echo "=== files ==="
            find .work/5.4.292-baseline-v3 -maxdepth 4 -type f -printf '%p %s bytes
' 2>/dev/null | sort
            echo
            echo "=== build.log tail ==="
            tail -n 250 .work/5.4.292-baseline-v3/results/build.log 2>/dev/null
            echo
            echo "=== baseline result ==="
            cat .work/5.4.292-baseline-v3/results/BASELINE_RESULT.txt 2>/dev/null
          } > .audit/workflow-03/failure-context.txt 2>&1

      - name: Upload V3 baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VEUX-5.4.292-native-baseline-v3-runner-fix-${{ github.run_id }}
          path: |
            .audit/workflow-03/
            .work/5.4.292-baseline-v3/results/
            .work/5.4.292-baseline-v3/out/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
