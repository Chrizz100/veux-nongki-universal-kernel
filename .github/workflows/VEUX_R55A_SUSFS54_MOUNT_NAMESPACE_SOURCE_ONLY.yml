            def test_stage_full_git_patch_round_trip_mock_repo(self):
                with tempfile.TemporaryDirectory(prefix='r55atests-') as t:
                    root=Path(t);repo=root/'kernel';repo.mkdir()
                    git(repo,'init','-q');git(repo,'config','user.name','R55 Test');git(repo,'config','user.email','r55@localhost')
                    for name in sorted(r55.R54_FILES-{ 'fs/susfs.c','include/linux/susfs.h','include/linux/susfs_def.h'}):
                        p=repo/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text('baseline '+name+'\n')
                    for name,content in [('fs/namespace.c',fixture_namespace()),('include/linux/mount.h',fixture_mount())]:
                        p=repo/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content)
                    git(repo,'add','-A');git(repo,'commit','-qm','Fixture pinned ancestor')
                    head=git(repo,'rev-parse','HEAD')
                    # Synthesize the same structural R54 12-file diff; test override pins
                    # remain strictly confined to this one unittest context.
                    for name in sorted(r55.R54_FILES):
                        p=repo/name;p.parent.mkdir(parents=True,exist_ok=True)
                        if p.exists():p.write_text(p.read_text()+'R54 hook\n')
                        else:p.write_text('new R54 file\n')
                    for name in ('fs/susfs.c','include/linux/susfs.h','include/linux/susfs_def.h'):
                        git(repo,'add','-N','--',name)
                    patch=git(repo,'diff','--binary','--no-ext-diff')+'\n'
                    if not patch.startswith('diff --git'):
                        self.fail('Fake patch invalid')
                    # git strip trailing blank; test must use exact bytes.
                    patch=git(repo,'diff','--binary','--no-ext-diff')
                    # git() strips and drops terminal LF; add it back deliberately.
                    patch+='\n'
                    fakepatch=root/'R54.patch';fakepatch.write_text(patch)
                    git(repo,'reset','--hard','HEAD');git(repo,'clean','-fd')
                    preimages={n:r55.gitblob((repo/n).read_bytes()) for n in r55.R55_FILES}
                    output=root/'out'
                    with mock.patch.object(r55,'PIN_SOURCE',head),mock.patch.object(r55,'PIN_R54_PATCH',r55.sha256(fakepatch.read_bytes())),mock.patch.object(r55,'PREIMAGE',preimages):
                        rc=r55.main(['--source',str(repo),'--r54',str(fakepatch),'--out',str(output)])
                    self.assertEqual(rc,0)
                    report=json.loads((output/r55.OUT_RESULT).read_text())
                    self.assertEqual(report['source_files_total'],14)
                    self.assertFalse(report['flash_allowed'])
                    self.assertFalse(report['build_performed'])
                    self.assertEqual(len(r55.expected_diff_filenames((output/r55.OUT_PATCH).read_text())),14)
                    # Reapply full produced patch against the exact clean ancestor.
                    git(repo,'reset','--hard','HEAD');git(repo,'clean','-fd')
                    git(repo,'apply','--check',str(output/r55.OUT_PATCH))
                    git(repo,'apply',str(output/r55.OUT_PATCH))
                    self.assertIn('susfs_alloc_ksu_vfsmnt(', (repo/'fs/namespace.c').read_text())
                    self.assertIn('ANDROID_KABI_USE(4,', (repo/'include/linux/mount.h').read_text())

        if __name__=='__main__':unittest.main(verbosity=2)
