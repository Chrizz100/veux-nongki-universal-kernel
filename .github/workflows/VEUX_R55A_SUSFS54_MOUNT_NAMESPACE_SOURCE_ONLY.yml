    - name: Strict actionlint and ShellCheck full gate
      shell: bash
      run: |
        set -euo pipefail
        archive=project/VEUX_R39_R2_MEMORY_ABI_MAIN.zip
        test -s "$archive"
        printf '%s  %s\n' \
          '745d80b8502a9beea513a2e7a58bb59272539b7508920d235ce2e79741bda528' "$archive" | sha256sum -c -
        unzip -p "$archive" tools/actionlint > "$R55_STAGE/actionlint"
        chmod 0755 "$R55_STAGE/actionlint"
        "$R55_STAGE/actionlint" -version | grep -Fx '1.7.12'
        "$R55_STAGE/actionlint" -color=false -shellcheck='' \
          project/.github/workflows/VEUX_R55A_SUSFS54_MOUNT_NAMESPACE_SOURCE_ONLY.yml \
          | tee "$R55_STAGE/R55_ACTIONLINT.log"
        printf 'R55_ACTIONLINT_V1_7_12=PASS\n' >> "$R55_STAGE/R55_ACTIONLINT.log"
        python3 -B - "$R55_STAGE" <<'PY_R55_YAML_AUDIT'
        import hashlib, pathlib, subprocess, sys, yaml
        stage=pathlib.Path(sys.argv[1])
        w=pathlib.Path('project/.github/workflows/VEUX_R55A_SUSFS54_MOUNT_NAMESPACE_SOURCE_ONLY.yml')
        class Strict(yaml.SafeLoader): pass
        def unique(loader,node):
            out={}
            for kn,vn in node.value:
                k=loader.construct_object(kn)
                if k in out: raise ValueError('DUPLICATE_YAML_KEY:'+str(k))
                out[k]=loader.construct_object(vn)
            return out
        Strict.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,unique)
        y=yaml.load(w.read_text('utf-8'),Loader=Strict)
        assert list(y['on'])==['workflow_dispatch']
        assert y['permissions']=={'contents':'read'}
        assert set(y['jobs'])=={'r55_mount_source'}
        j=y['jobs']['r55_mount_source']
        assert j['runs-on']=='ubuntu-24.04'
        assert j['if']=="${{ github.repository == 'Chrizz100/veux-nongki-universal-kernel' && github.ref == 'refs/heads/main' }}"
        s=j['steps']
        assert len(s)==8
        for idx in (0,1):
            assert s[idx]['uses']=='actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683'
            assert s[idx]['with']['persist-credentials'] is False
        assert s[1]['with']['repository']=='dereference23/kernel_xiaomi_sm6375'
        assert s[1]['with']['ref']=='b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'
        assert s[7]['uses']=='actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02'
        assert s[7]['with']['if-no-files-found']=='error'
        logs=[]
        for step in s:
            if 'run' not in step:continue
            body=step['run']
            for cmd in (['bash','-n','-'],['shellcheck','--shell=bash','--severity=warning','-']):
                result=subprocess.run(cmd,input=body,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                if result.returncode:
                    raise SystemExit('SHELL_ERROR:'+step['name']+':'+result.stdout+result.stderr)
            logs.append(step['name']+' bash-n shellcheck PASS '+hashlib.sha256(body.encode()).hexdigest())
        (stage/'R55_SHELLCHECK.log').write_text('\n'.join(logs)+'\n')
        print('R55A_DUPLICATE_YAML_KEYS_ALL_RUN_BLOCKS_SHELLCHECK=PASS')
        PY_R55_YAML_AUDIT
    - name: Run 13 source and negative scenario regressions
      shell: bash
      run: |
        set -euo pipefail
        export PYTHONPATH="$R55_STAGE/scripts"
        python3 -B -W error::ResourceWarning -m unittest discover -s "$R55_STAGE/tests" -p 'test_r55_mount_stage.py' -v 2>&1 \
            | tee "$R55_STAGE/R55_TESTS.log"
        grep -F 'Ran 13 tests' "$R55_STAGE/R55_TESTS.log"
        grep -Fx 'OK' "$R55_STAGE/R55_TESTS.log"
        if grep -E 'skipped|FAIL|ERROR' "$R55_STAGE/R55_TESTS.log"; then
          echo 'R55A_TEST_INCOMPLETE_OR_FAILED' >&2
          exit 1
        fi
        printf 'R55A_13_REAL_R54_AND_NEGATIVE_TESTS=PASS\n'
    - name: Replay R54 original and apply real R55A mount source port
      shell: bash
      run: |
        set -euo pipefail
        python3 -B "$R55_SOURCE_SCRIPT" \
          --source kernel --r54 "$R55_R54_PATCH_FOR_TESTS" --out "$R55_STAGE/out" \
          | tee "$R55_STAGE/R55A_RUN.log"
        grep -F 'R55A_14_SOURCE_FILES_PATCHED_NO_BUILD_NO_FLASH=PASS' "$R55_STAGE/R55A_RUN.log"
    - name: Final source scope rollback check, SHA256, no-flash gates
      shell: bash
      run: |
        set -euo pipefail
        python3 -B - "$R55_STAGE" <<'PY_R55_FINAL'
        import hashlib,json,pathlib,subprocess,sys
        root=pathlib.Path(sys.argv[1]);out=root/'out'
        result=json.loads((out/'R55A_RESULT.json').read_text())
        if result.get('schema')!='VEUX_R55A_SUSFS54_MOUNT_NAMESPACE_STAGE1_V1':
            raise SystemExit('R55A_RESULT_SCHEMA_INVALID')
        if result.get('kernel_source_sha')!='b2b7a3bbc36d120ee523ebc8d68e0f13a97df632':
            raise SystemExit('R55A_SOURCE_PIN_CHANGED')
        if result.get('r54_patch_sha256')!='b689f6c15a1a42390ff5a85cb585b64950453740676aa54186303fe2c4bad05e':
            raise SystemExit('R55A_R54_BASE_PIN_CHANGED')
        if result.get('source_files_total')!=14 or result.get('r54_file_count')!=12 or set(result['r55_files'])!={'fs/namespace.c','include/linux/mount.h'}:
            raise SystemExit('R55A_CHANGED_FILE_SCOPE_WRONG')
        for name in ('source_changes_committed','susfs_complete','baka_su_uapi6_integrated',
                     'nomount_v22_integrated','r44_walt_recomposed','build_performed',
                     'device_tested','boot_ready','flash_allowed','brene_changed'):
            if result.get(name) is not False: raise SystemExit('R55A_UNSAFE_FLAG:'+name)
        for name in ('r54_source_patch_replayed','r55_source_port_applied'):
            if result.get(name) is not True: raise SystemExit('R55A_MISSING_SOURCE_PROOF:'+name)
        pfile=out/'VEUX_R55A_SUSFS54_MOUNT_NAMESPACE_14_FILES_NOFLASH.patch'
        if hashlib.sha256(pfile.read_bytes()).hexdigest()!=result['patch_sha256']:
            raise SystemExit('R55A_GENERATED_PATCH_SHA_MISMATCH')
        for name in ('R55_ACTIONLINT.log','R55_SHELLCHECK.log','R55_TESTS.log','R55A_RUN.log'):
            b=(root/name).read_bytes()
            if not b: raise SystemExit('R55A_REQUIRED_QA_LOG_EMPTY:'+name)
            (out/name).write_bytes(b)
        (out/'START_HIER_NOFLASH.txt').write_text(
            'VEUX R55A: 14-Dateien-Quellpatch = R54 12 + Mount/Namespace 2.\n'
            'NO KERNEL BUILD. NO DEVICE TEST. NO FLASH. BRENE UNCHANGED.\n'
            'Next: inspect upstream overlap, resolve namei UAF and remaining 8 hooks.\n')
        allowed={'R55A_RESULT.json',pfile.name,'R55_ACTIONLINT.log','R55_SHELLCHECK.log',
                 'R55_TESTS.log','R55A_RUN.log','START_HIER_NOFLASH.txt'}
        found={p.name for p in out.iterdir() if p.is_file()}
        if found!=allowed: raise SystemExit('R55A_ARTIFACT_WRONG_SCOPE:'+str(found^allowed))
        for f in out.iterdir():
            if f.is_symlink() or f.name.lower().endswith(('.ko','.img','.dtb','.dtbo','.bin','.elf')):
                raise SystemExit('R55A_FLASHABLE_OR_SYMLINK_ARTIFACT_FORBIDDEN')
        checks=[hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in sorted(out.iterdir())]
        (out/'SHA256SUMS.txt').write_text('\n'.join(checks)+'\n')
        print('R55A_STATIC_OUTPUTS_AND_NO_FLASH_GATES=PASS')
        PY_R55_FINAL
        (cd "$R55_STAGE/out" && sha256sum -c SHA256SUMS.txt)
        git -C kernel apply --reverse --check "$R55_STAGE/out/VEUX_R55A_SUSFS54_MOUNT_NAMESPACE_14_FILES_NOFLASH.patch"
        test -z "$(git -C project status --porcelain --untracked-files=all)"
        echo 'R55A_R54_PLUS_TWO_KERNEL_SOURCE_FILES=PASS; PROJECT_REPO_UNCHANGED=YES; NO_FLASH=YES'
    - name: Upload source patch and audit artifacts only
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: VEUX-R55A-SUSFS54-MOUNT-NAMESPACE-14FILES-NOFLASH-${{ github.run_id }}
        path: /tmp/veux-r55a/out/
        retention-days: 14
        compression-level: 6
        if-no-files-found: error
