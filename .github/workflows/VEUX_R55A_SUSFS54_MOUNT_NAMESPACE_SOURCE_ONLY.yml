name: VEUX R55A SUSFS 5.4 Mount + Namespace source gate - NO BUILD NO FLASH
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: veux-r55a-susfs54-${{ github.ref }}
  cancel-in-progress: false
jobs:
  r55_mount_source:
    name: Recompose pinned R54 and safely port two Xiaomi 5.4 Mount files
    if: ${{ github.repository == 'Chrizz100/veux-nongki-universal-kernel' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      R55_STAGE: /tmp/veux-r55a
      R55_SOURCE_SCRIPT: /tmp/veux-r55a/scripts/r55_mount_stage.py
      R55_R54_PATCH_FOR_TESTS: /tmp/veux-r55a/inputs/R54_AUTHENTIC.patch
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Read-only project checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
        fetch-depth: 1
        path: project
    - name: Detached verified stock-near 5.4.274 source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: dereference23/kernel_xiaomi_sm6375
        ref: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
        persist-credentials: false
        fetch-depth: 1
        path: kernel
    - name: Restore original R54 patch and two R55 source-auditor scripts
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$R55_STAGE/scripts" "$R55_STAGE/tests" "$R55_STAGE/inputs" "$R55_STAGE/out"
        cat > "$R55_SOURCE_SCRIPT" <<'PY_R55_PORTER'
        #!/usr/bin/env python3
        """VEUX R55A – deterministic source-only SUSFS 5.4 mount/namespace port.

        This is *not* a complete SUSFS port, kernel build, device test or flash release.
        Fail closed on pinned kernel source, R54 base patch, malformed Git state,
        missing anchors, and unexpected file scopes. No mutation of owner's project repo.
        """
        from __future__ import annotations

        import argparse
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import subprocess
        import sys

        PIN_SOURCE = 'b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'
        PIN_R54_PATCH = 'b689f6c15a1a42390ff5a85cb585b64950453740676aa54186303fe2c4bad05e'
        PREIMAGE = {
            'include/linux/mount.h': '40714c6040e457678e1a7a3b0274e2bfdbfa2029',
            'fs/namespace.c': '4b2110e3e20ad01a3aeeb045fca9bb27cf66e61a',
        }
        R54_FILES = {
            'block/ioprio.c', 'fs/Makefile', 'fs/notify/fdinfo.c', 'fs/proc/cmdline.c',
            'fs/proc/fd.c', 'fs/proc_namespace.c', 'fs/readdir.c', 'fs/statfs.c',
            'fs/susfs.c', 'include/linux/susfs.h', 'include/linux/susfs_def.h',
            'kernel/kallsyms.c',
        }
        R55_FILES = set(PREIMAGE)
        OUT_PATCH = 'VEUX_R55A_SUSFS54_MOUNT_NAMESPACE_14_FILES_NOFLASH.patch'
        OUT_RESULT = 'R55A_RESULT.json'

        class PortError(Exception):
            pass


        def run(*cmd: str, cwd: Path, input: str | None = None) -> str:
            p = subprocess.run(cmd, cwd=cwd, input=input, text=True,
                               stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
            if p.returncode:
                raise PortError('COMMAND_FAILED '+repr(cmd)+' '+(p.stderr or p.stdout)[-1200:])
            return p.stdout


        def sha256(data: bytes) -> str:
            return hashlib.sha256(data).hexdigest()


        def gitblob(data: bytes) -> str:
            return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()


        def exactly_once(s: str, old: str, new: str, label: str) -> str:
            count=s.count(old)
            if count != 1:
                raise PortError(f'ANCHOR_{label}_EXPECTED_ONCE_FOUND_{count}')
            return s.replace(old, new, 1)


        def port_mount_h(s: str) -> str:
            s = exactly_once(s,
                '\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tvoid *data;\n',
                '\tANDROID_KABI_RESERVE(3);\n'
                '#ifdef CONFIG_KSU_SUSFS\n'
                '\tANDROID_KABI_USE(4, u64 susfs_mnt_id_backup);\n'
                '#else\n'
                '\tANDROID_KABI_RESERVE(4);\n'
                '#endif\n'
                '\tvoid *data;\n',
                'MOUNT_KABI_RESERVED_FOUR')
            return s


        def port_namespace(s: str) -> str:
            # The pinned Xiaomi source has no FASTUH_KDP branch and uses 5.4 IDA APIs.
            s = exactly_once(s, '#include <linux/shmem_fs.h>\n',
                '#include <linux/shmem_fs.h>\n'
                '#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif\n'
                '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n#include <linux/jump_label.h>\n#endif\n',
                'NAMESPACE_SUSFS_INCLUDE')
            s = exactly_once(s, '#include "pnode.h"\n#include "internal.h"\n',
                '#include "pnode.h"\n#include "internal.h"\n\n'
                '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                'extern bool susfs_is_current_ksu_domain(void);\n'
                'extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n'
                '/* Reserved R55-only flag; all stock CL_* flags <= 0x40. */\n'
                '#define CL_COPY_MNT_NS BIT(25)\n'
                '#endif\n',
                'NAMESPACE_PRIVATE_COPY_FLAG')

            s = exactly_once(s,
                'static void mnt_free_id(struct mount *mnt)\n{\n\tida_free(&mnt_id_ida, mnt->mnt_id);\n}\n',
                'static void mnt_free_id(struct mount *mnt)\n{\n'
                '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                '\t/* A borrowed ID remains owned by the original mount. */\n'
                '\tif (mnt->mnt.mnt_flags & VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT)\n'
                '\t\treturn;\n'
                '#endif\n'
                '\tida_free(&mnt_id_ida, mnt->mnt_id);\n}\n',
                'BORROWED_ID_FREE_GUARD')
            s = exactly_once(s,
                'static int mnt_alloc_group_id(struct mount *mnt)\n{\n'
                '\tint res = ida_alloc_min(&mnt_group_ida, 1, GFP_KERNEL);\n',
                'static int mnt_alloc_group_id(struct mount *mnt)\n{\n'
                '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                '\tint res = ida_alloc_min(&mnt_group_ida,\n'
                '\t\tsusfs_is_current_ksu_domain() ? DEFAULT_KSU_MNT_GROUP_ID : 1,\n'
                '\t\tGFP_KERNEL);\n'
                '#else\n'
                '\tint res = ida_alloc_min(&mnt_group_ida, 1, GFP_KERNEL);\n'
                '#endif\n',
                'GROUP_IDA_ALLOCATION')

            # Avoid duplicating vendor alloc_vfsmnt, KABI data and its cleanup logic.
            helper = '''#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
        /*
         * Reuse exactly the existing 5.4 allocator and initialization. When borrowing
         * an ID for a copied namespace, mark ownership *before* clone_mnt() error
         * paths can invoke mnt_free_id(), otherwise the original ID is freed early.
         * When allocating a fresh synthetic ID, release the temporary normal ID.
         */
        static struct mount *susfs_alloc_ksu_vfsmnt(const char *name,
                                                     bool borrow_id, int original_id)
        {
            struct mount *mnt = alloc_vfsmnt(name);
            int synthetic_id;

            if (!mnt)
                return NULL;

            if (borrow_id) {
                ida_free(&mnt_id_ida, mnt->mnt_id);
                mnt->mnt_id = original_id;
                mnt->mnt.mnt_flags |= VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT;
                return mnt;
            }

            synthetic_id = ida_alloc_min(&mnt_id_ida, DEFAULT_KSU_MNT_ID, GFP_KERNEL);
            if (synthetic_id < 0) {
                mnt_free_id(mnt);
                free_vfsmnt(mnt);
                return NULL;
            }
            ida_free(&mnt_id_ida, mnt->mnt_id);
            mnt->mnt_id = synthetic_id;
            return mnt;
        }
        #endif /* CONFIG_KSU_SUSFS_SUS_MOUNT */

        '''
            s = exactly_once(s,
                'static void free_vfsmnt(struct mount *mnt)\n{\n'
                '\tkfree(mnt->mnt.data);\n\tkfree_const(mnt->mnt_devname);\n'
                '#ifdef CONFIG_SMP\n\tfree_percpu(mnt->mnt_pcp);\n#endif\n'
                '\tkmem_cache_free(mnt_cache, mnt);\n}\n\n'
                'static void delayed_free_vfsmnt',
                'static void free_vfsmnt(struct mount *mnt)\n{\n'
                '\tkfree(mnt->mnt.data);\n\tkfree_const(mnt->mnt_devname);\n'
                '#ifdef CONFIG_SMP\n\tfree_percpu(mnt->mnt_pcp);\n#endif\n'
                '\tkmem_cache_free(mnt_cache, mnt);\n}\n\n'
                + helper + 'static void delayed_free_vfsmnt',
                'MOUNT_HELPER_AFTER_FREE')

            s = exactly_once(s,
                '\tstruct mount *p;\n\n\thlist_for_each_entry_rcu(p, head, mnt_hash)\n'
                '\t\tif (&p->mnt_parent->mnt == mnt && p->mnt_mountpoint == dentry)\n',
                '\tstruct mount *p;\n\n'
                '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                '\tif (susfs_is_current_proc_umounted()) {\n'
                '\t\thlist_for_each_entry_rcu(p, head, mnt_hash)\n'
                '\t\t\tif (p->mnt_id < DEFAULT_KSU_MNT_ID &&\n'
                '\t\t\t    &p->mnt_parent->mnt == mnt &&\n'
                '\t\t\t    p->mnt_mountpoint == dentry)\n'
                '\t\t\t\treturn p;\n'
                '\t\treturn NULL;\n'
                '\t}\n'
                '#endif\n'
                '\thlist_for_each_entry_rcu(p, head, mnt_hash)\n'
                '\t\tif (&p->mnt_parent->mnt == mnt && p->mnt_mountpoint == dentry)\n',
                'FILTER_MOUNT_LOOKUP')

            s = exactly_once(s,
                '\tsb = fc->root->d_sb;\n\n'
                '\tmnt = alloc_vfsmnt(fc->source ?: "none");\n'
                '\tif (!mnt)\n',
                '\tsb = fc->root->d_sb;\n\n'
                '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                '\tif (static_branch_unlikely(&susfs_is_sdcard_android_data_not_decrypted) &&\n'
                '\t    susfs_is_current_ksu_domain())\n'
                '\t\tmnt = susfs_alloc_ksu_vfsmnt(fc->source ?: "none", false, 0);\n'
                '\telse\n'
                '#endif\n'
                '\t\tmnt = alloc_vfsmnt(fc->source ?: "none");\n'
                '\tif (!mnt)\n',
                'CREATE_MOUNT_KSU_ID')

            s = exactly_once(s,
                '\tstruct mount *mnt;\n\tint err;\n\n'
                '\tmnt = alloc_vfsmnt(old->mnt_devname);\n'
                '\tif (!mnt)\n',
                '\tstruct mount *mnt;\n\tint err;\n'
                '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                '\tbool id_borrowed = false;\n\n'
                '\tif (static_branch_unlikely(&susfs_is_sdcard_android_data_not_decrypted) &&\n'
                '\t    susfs_is_current_ksu_domain()) {\n'
                '\t\tid_borrowed = !!(flag & CL_COPY_MNT_NS);\n'
                '\t\tmnt = susfs_alloc_ksu_vfsmnt(old->mnt_devname,\n'
                '\t\t\tid_borrowed, old->mnt_id);\n'
                '\t} else if (old->mnt_id >= DEFAULT_KSU_MNT_ID) {\n'
                '\t\tmnt = susfs_alloc_ksu_vfsmnt(old->mnt_devname, false, 0);\n'
                '\t} else {\n'
                '\t\tmnt = alloc_vfsmnt(old->mnt_devname);\n'
                '\t}\n'
                '#else\n\n'
                '\tmnt = alloc_vfsmnt(old->mnt_devname);\n'
                '#endif\n'
                '\tif (!mnt)\n',
                'CLONE_MOUNT_SAFE_ID')

            s = exactly_once(s,
                '\tmnt->mnt.mnt_flags = old->mnt.mnt_flags;\n'
                '\tmnt->mnt.mnt_flags &= ~(MNT_WRITE_HOLD|MNT_MARKED|MNT_INTERNAL);\n\n'
                '\tatomic_inc(&sb->s_active);\n',
                '\tmnt->mnt.mnt_flags = old->mnt.mnt_flags;\n'
                '\tmnt->mnt.mnt_flags &= ~(MNT_WRITE_HOLD|MNT_MARKED|MNT_INTERNAL);\n'
                '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                '\t/* Never inherit the borrowed-ID marker onto an IDA-owned ID. */\n'
                '\tmnt->mnt.mnt_flags &= ~VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT;\n'
                '\tif (id_borrowed)\n'
                '\t\tmnt->mnt.mnt_flags |= VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT;\n'
                '#endif\n\n'
                '\tatomic_inc(&sb->s_active);\n',
                'CLONE_FLAGS_NO_BORROW_INHERIT')

            s = exactly_once(s,
                '\tcopy_flags = CL_COPY_UNBINDABLE | CL_EXPIRE;\n'
                '\tif (user_ns != ns->user_ns)\n',
                '\tcopy_flags = CL_COPY_UNBINDABLE | CL_EXPIRE;\n'
                '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
                '\tcopy_flags |= CL_COPY_MNT_NS;\n'
                '#endif\n'
                '\tif (user_ns != ns->user_ns)\n',
                'COPY_NAMESPACE_MARKER')

            helpers = '''#ifdef CONFIG_KSU_SUSFS
        /* Caller keeps orig_mnt live; mount parents are read under mount_lock. */
        int susfs_get_non_sus_mnt_id_from_mnt(struct mount *orig_mnt)
        {
            struct mount *mnt = orig_mnt;
            int id;

            if (mnt->mnt_id < DEFAULT_KSU_MNT_ID)
                return mnt->mnt_id;
            lock_mount_hash();
            while (mnt->mnt_id >= DEFAULT_KSU_MNT_ID && mnt->mnt_parent &&
                   mnt != mnt->mnt_parent)
                mnt = mnt->mnt_parent;
            id = mnt->mnt_id;
            unlock_mount_hash();
            return id;
        }

        /*
         * Each return carries BOTH a mount and a dentry reference. R54 statfs.c
         * depends on this exact ownership rule and releases both on all paths.
         */
        struct vfsmount *susfs_get_non_sus_vfsmnt_from_vfsmnt(struct vfsmount *vfsmnt)
        {
            struct mount *mnt = real_mount(vfsmnt);

            lock_mount_hash();
            while (mnt->mnt_id >= DEFAULT_KSU_MNT_ID && mnt->mnt_parent &&
                   mnt != mnt->mnt_parent)
                mnt = mnt->mnt_parent;
            mntget(&mnt->mnt);
            dget(mnt->mnt.mnt_root);
            unlock_mount_hash();
            return &mnt->mnt;
        }
        #endif /* CONFIG_KSU_SUSFS */

        '''
            s = exactly_once(s,
                'const struct proc_ns_operations mntns_operations = {\n',
                helpers + 'const struct proc_ns_operations mntns_operations = {\n',
                'MOUNT_ID_AND_PATH_HELPERS')

            # Safety invariants - no side effects for CONFIG_KSU_SUSFS=n beyond conditional branches.
            if 'CONFIG_FASTUH_KDP' in s:
                raise PortError('UNREVIEWED_FASTUH_KERNEL_SOURCE')
            if 'BReNE' in s or 'brene' in s:
                raise PortError('UNEXPECTED_BRENE_TOUCHED')
            return s


        def expected_diff_filenames(diff: str) -> set[str]:
            found = re.findall(r'^diff --git a/(\S+) b/\1$',diff,re.M)
            if len(found) != len(set(found)):
                raise PortError('DUPLICATE_DIFF_HEADER')
            return set(found)


        def check_patch_guard(patch: bytes) -> None:
            if sha256(patch) != PIN_R54_PATCH:
                raise PortError('R54_AUTHENTIC_PATCH_SHA_MISMATCH')
            try:
                s = patch.decode('utf-8')
            except UnicodeError as e:
                raise PortError('R54_PATCH_NOT_UTF8') from e
            if expected_diff_filenames(s) != R54_FILES:
                raise PortError('R54_PATCH_SCOPE_CHANGED')
            if '\nBinary files ' in s or '\nGIT binary patch' in s:
                raise PortError('BINARY_SOURCE_PATCH_NOT_ALLOWED')


        def validate_preimages(source: Path) -> None:
            for f,sha in PREIMAGE.items():
                p = source / f
                if not p.is_file() or p.is_symlink() or gitblob(p.read_bytes()) != sha:
                    raise PortError('PINNED_SOURCE_GIT_BLOB_MISMATCH:' + f)


        def encode_transform(filename: str, content: bytes) -> bytes:
            if b'\r' in content or not content.endswith(b'\n'):
                raise PortError('SOURCE_LINE_ENDINGS_CHANGED:'+filename)
            s = content.decode('utf-8')
            ported = port_mount_h(s) if filename == 'include/linux/mount.h' else port_namespace(s)
            if ported == s:
                raise PortError('SOURCE_UNCHANGED:'+filename)
            return ported.encode('utf-8')


        def main(argv: list[str] | None = None) -> int:
            p = argparse.ArgumentParser()
            p.add_argument('--source',type=Path,required=True)
            p.add_argument('--r54',type=Path,required=True)
            p.add_argument('--out',type=Path,required=True)
            args = p.parse_args(argv)
            source = args.source.resolve()
            if run('git','rev-parse','HEAD',cwd=source).strip() != PIN_SOURCE:
                raise PortError('WRONG_5_4_KERNEL_REVISION')
            if run('git','status','--porcelain','--untracked-files=all',cwd=source).strip():
                raise PortError('DIRTY_BASE_KERNEL_CHECKOUT')
            validate_preimages(source)
            patch = args.r54.resolve().read_bytes()
            check_patch_guard(patch)
            run('git','apply','--check','--whitespace=error',str(args.r54.resolve()),cwd=source)
            run('git','apply','--whitespace=error',str(args.r54.resolve()),cwd=source)
            observed = set(run('git','diff','--name-only',cwd=source).splitlines())
            observed |= set(run('git','ls-files','--others','--exclude-standard',cwd=source).splitlines())
            if observed != R54_FILES:
                raise PortError('R54_APPLIED_WRONG_FILES')

            final = {}
            for filename in sorted(R55_FILES):
                file = source / filename
                data = file.read_bytes()
                if gitblob(data) != PREIMAGE[filename]:
                    raise PortError('PREIMAGE_CHANGED_AFTER_R54:'+filename)
                replacement = encode_transform(filename, data)
                file.write_bytes(replacement)
                final[filename] = {'old_blob':PREIMAGE[filename],
                                   'new_blob':gitblob(replacement),
                                   'new_sha256':sha256(replacement)}
            observed = set(run('git','diff','--name-only',cwd=source).splitlines())
            observed |= set(run('git','ls-files','--others','--exclude-standard',cwd=source).splitlines())
            if observed != (R54_FILES | R55_FILES):
                raise PortError('R55_WRONG_FINAL_SCOPE')
            run('git','diff','--check',cwd=source)
            staged_patch = run('git','diff','--binary','--no-ext-diff',cwd=source)
            # git diff omits untracked files (R54 adds three); emit a *verified* patch
            # against the original pinned ancestor via git add -N (intent-to-add).
            for f in ('fs/susfs.c','include/linux/susfs.h','include/linux/susfs_def.h'):
                run('git','add','-N','--',f,cwd=source)
            staged_patch = run('git','diff','--binary','--no-ext-diff',cwd=source)
            if expected_diff_filenames(staged_patch) != R54_FILES | R55_FILES:
                raise PortError('R55_FINAL_DIFF_HAS_WRONG_FILES')
            run('git','diff','--check',cwd=source)
            out = args.out.resolve()
            out.mkdir(parents=True,exist_ok=True)
            if any(out.iterdir()):
                raise PortError('OUT_NOT_EMPTY')
            patch_data=staged_patch.encode('utf-8')
            (out / OUT_PATCH).write_bytes(patch_data)
            report={
                'schema':'VEUX_R55A_SUSFS54_MOUNT_NAMESPACE_STAGE1_V1',
                'kernel_source_sha':PIN_SOURCE,
                'r54_patch_sha256':PIN_R54_PATCH,
                'stage':'R55A_TWO_ADDITIONAL_FILES',
                'source_files_total':14,
                'r54_file_count':12,
                'r55_files':final,
                'patch_sha256':sha256(patch_data),
                'r54_source_patch_replayed':True,
                'r55_source_port_applied':True,
                'source_changes_committed':False,
                'susfs_complete':False,
                'baka_su_uapi6_integrated':False,
                'nomount_v22_integrated':False,
                'r44_walt_recomposed':False,
                'build_performed':False,
                'device_tested':False,
                'boot_ready':False,
                'flash_allowed':False,
                'brene_changed':False,
            }
            (out / OUT_RESULT).write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
            print('R55A_14_SOURCE_FILES_PATCHED_NO_BUILD_NO_FLASH=PASS; SHA256='+sha256(patch_data))
            return 0

        if __name__ == '__main__':
            try:
                sys.exit(main())
            except (PortError,OSError,UnicodeError) as exc:
                print('R55A_STOP='+str(exc),file=sys.stderr)
                sys.exit(1)
        PY_R55_PORTER
        cat > "$R55_STAGE/tests/test_r55_mount_stage.py" <<'PY_R55_TESTS'
        #!/usr/bin/env python3
        """R55A source-only, adversarial, IDA-lifetime and end-to-end synthetic tests."""
        from __future__ import annotations
        import ast
        from contextlib import contextmanager
        import importlib.util
        import json
        import os
        from pathlib import Path
        import subprocess
        import sys
        import tempfile
        import unittest
        from unittest import mock

        FILE = Path(os.environ.get('R55_SOURCE_SCRIPT', str(Path(__file__).with_name('r55_mount_stage.py'))))
        spec=importlib.util.spec_from_file_location('r55',FILE)
        r55=importlib.util.module_from_spec(spec)
        spec.loader.exec_module(r55)


        def extract_source_anchors(function_name):
            mod = ast.parse(FILE.read_text())
            fn=next(n for n in mod.body if isinstance(n,ast.FunctionDef) and n.name==function_name)
            values=[]
            for expr in ast.walk(fn):
                if isinstance(expr,ast.Call) and isinstance(expr.func,ast.Name) and expr.func.id=='exactly_once':
                    values.append(ast.literal_eval(expr.args[1]))
            return values

        NS_ANCHORS=extract_source_anchors('port_namespace')
        MOUNT_ANCHORS=extract_source_anchors('port_mount_h')


        def fixture_namespace():
            # Independently concatenate each pinned-anchor preimage once; no hidden
            # test-only fallback in the real stage. CI exercises full source directly.
            return '// pinned Xiaomi source anchor fixture\n\n'+ '\n\n'.join(NS_ANCHORS)


        def fixture_mount():
            return '/* include/linux/mount.h fragment */\n' + ''.join(MOUNT_ANCHORS)


        def git(repo, *cmd):
            p=subprocess.run(['git','-C',str(repo),*cmd],text=True,capture_output=True,check=False)
            if p.returncode:
                raise AssertionError('GIT '+repr(cmd)+' '+p.stdout+' '+p.stderr)
            return p.stdout.strip()


        class TestSourcePort(unittest.TestCase):
            def test_mount_reserved_kabi_slot_4_only(self):
                old=fixture_mount(); new=r55.port_mount_h(old)
                self.assertIn('ANDROID_KABI_USE(4, u64 susfs_mnt_id_backup);',new)
                self.assertIn('#else\n\tANDROID_KABI_RESERVE(4);\n#endif',new)
                self.assertIn('ANDROID_KABI_RESERVE(3)',new)
                self.assertNotIn('ANDROID_KABI_USE(3,',new)
                self.assertEqual(new.replace('#ifdef CONFIG_KSU_SUSFS\n\tANDROID_KABI_USE(4, u64 susfs_mnt_id_backup);\n#else\n\tANDROID_KABI_RESERVE(4);\n#endif','\tANDROID_KABI_RESERVE(4);').replace('\n\t\tANDROID_KABI','\n\tANDROID_KABI'),old)

            def test_namespace_all_pinned_anchors(self):
                new=r55.port_namespace(fixture_namespace())
                self.assertGreater(len(new),len(fixture_namespace()))
                self.assertIn('susfs_get_non_sus_vfsmnt_from_vfsmnt(',new)
                self.assertIn('susfs_get_non_sus_mnt_id_from_mnt(',new)
                self.assertIn('#define CL_COPY_MNT_NS BIT(25)',new)

            def test_id_reuse_marked_prior_clone_error_path(self):
                new=r55.port_namespace(fixture_namespace())
                self.assertLess(new.index('mnt->mnt.mnt_flags |= VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT;'),new.index('if (sb->s_op->clone_mnt_data)') if 'if (sb->s_op->clone_mnt_data)' in new else new.index('static void delayed_free_vfsmnt'))
                self.assertIn('if (mnt->mnt.mnt_flags & VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT)\n\t\treturn;',new)
                self.assertIn('ida_free(&mnt_id_ida, mnt->mnt_id);\n        mnt->mnt_id = original_id;',new)
                self.assertIn('mnt_free_id(mnt);\n        free_vfsmnt(mnt);',new)

            def test_normal_clone_clears_unshared_id_flag(self):
                new=r55.port_namespace(fixture_namespace())
                tail=new[new.index('/* Never inherit the borrowed-ID marker'):]
                self.assertLess(tail.index(' &= ~VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT'),tail.index('if (id_borrowed)'))
                self.assertIn('if (id_borrowed)\n\t\tmnt->mnt.mnt_flags |=',tail)

            def test_group_id_allocator_without_double_allocation(self):
                new=r55.port_namespace(fixture_namespace())
                a=new[new.index('static int mnt_alloc_group_id'):new.index('static int mnt_alloc_group_id')+370]
                self.assertIn('DEFAULT_KSU_MNT_GROUP_ID : 1',a)
                self.assertNotIn('ida_free(&mnt_group_ida',a)
                self.assertIn('#else\n\tint res = ida_alloc_min(&mnt_group_ida, 1, GFP_KERNEL);',a)

            def test_mount_get_pair_balances_references(self):
                new=r55.port_namespace(fixture_namespace())
                fn=new[new.index('struct vfsmount *susfs_get_non_sus_vfsmnt_from_vfsmnt('):]
                self.assertEqual(fn.count('mntget(&mnt->mnt);'),1)
                self.assertEqual(fn.count('dget(mnt->mnt.mnt_root);'),1)
                self.assertIn('lock_mount_hash();',fn)
                self.assertIn('unlock_mount_hash();',fn)
                self.assertLess(fn.index('dget('),fn.index('unlock_mount_hash();'))

            def test_no_fastuh_or_brene(self):
                for token in ('CONFIG_FASTUH_KDP','BReNE','brene'):
                    with self.assertRaises(r55.PortError):r55.port_namespace(fixture_namespace()+'\n// '+token+'\n')

