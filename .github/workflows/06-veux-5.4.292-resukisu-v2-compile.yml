name: 06 - VEUX 5.4.292 ReSukiSU V2 Compile

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veux-5.4.292-resukisu-v2-compile
  cancel-in-progress: false

jobs:
  compile:
    name: ReSukiSU V2 compile
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Initialize diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .audit/workflow-06
          {
            echo "WORKFLOW=06"
            echo "PURPOSE=VEUX_5_4_292_RESUKISU_V2_COMPILE"
            echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "PACKAGE_PASS=NO"
            echo "STATIC_BOOT_PATH_PASS=NO"
            echo "DEVICE_PASS=NO"
          } > .audit/workflow-06/runner.txt

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            curl \
            dwarves \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            perl \
            python3 \
            rsync \
            xz-utils \
            zstd

      - name: Verify pinned V2 integration files
        shell: bash
        run: |
          set -euo pipefail

          BUILD="lineages/5.4.292/RESUKISU_BUILD_V2.sh"
          INTEGRATOR="lineages/5.4.292/RESUKISU_INTEGRATE_V2.py"

          BUILD_SHA256="f9ad7e68217f9e71c30736c3bb370bb57923bc3421437e3e7e5b2c6538c38c16"
          INTEGRATOR_SHA256="6f75a36d540fcef818d5c49ee0ed1b8fc322431d702fab08cd0a07804cfb3780"

          test -f "$BUILD"
          test -f "$INTEGRATOR"

          bash -n "$BUILD"
          python3 -m py_compile "$INTEGRATOR"

          actual_build="$(sha256sum "$BUILD" | awk '{print $1}')"
          actual_integrator="$(sha256sum "$INTEGRATOR" | awk '{print $1}')"

          test "$actual_build" = "$BUILD_SHA256"
          test "$actual_integrator" = "$INTEGRATOR_SHA256"

          {
            echo "BUILD_SHA256=$actual_build"
            echo "INTEGRATOR_SHA256=$actual_integrator"
            echo "PINNED_FILE_GATE=PASS"
          } | tee .audit/workflow-06/pinned-files.txt

      - name: Run V2 integrator self-test
        shell: bash
        run: |
          set -euo pipefail
          python3 lineages/5.4.292/RESUKISU_INTEGRATE_V2.py --selftest \
            | tee .audit/workflow-06/integrator-selftest.txt

          grep -Fxq 'RESUKISU_GIT_WORKTREE_LAYOUT=PASS' .audit/workflow-06/integrator-selftest.txt
          grep -Fxq 'FIXTURE_TRANSFORM=PASS' .audit/workflow-06/integrator-selftest.txt
          grep -Fxq 'MODULE_LOAD_FILTER_EXCLUSION=PASS' .audit/workflow-06/integrator-selftest.txt
          grep -Fxq 'DUPLICATE_GUARD=PASS' .audit/workflow-06/integrator-selftest.txt
          grep -Fxq 'SELFTEST=PASS' .audit/workflow-06/integrator-selftest.txt

      - name: Run ReSukiSU V2 compile
        shell: bash
        run: |
          set -euo pipefail
          bash lineages/5.4.292/RESUKISU_BUILD_V2.sh

      - name: Verify V2 compile result
        shell: bash
        run: |
          set -euo pipefail

          ROOT=".work/5.4.292-resukisu-v2"
          RESULT="$ROOT/results/RESUKISU_RESULT.txt"
          SUMS="$ROOT/results/SHA256SUMS.txt"
          IMAGE="$ROOT/out/arch/arm64/boot/Image"

          test -s "$RESULT"
          test -s "$SUMS"
          test -s "$IMAGE"

          grep -Fxq 'RESUKISU_COMPILE=PASS' "$RESULT"
          grep -Fxq 'HOST_INTEGRATION=PASS' "$RESULT"
          grep -Fxq 'RESUKISU_GIT_WORKTREE_LAYOUT=PASS' "$RESULT"
          grep -Fxq 'HOST_DELTA_GUARD=PASS' "$RESULT"
          grep -Fxq 'RESUKISU_DELTA_GUARD=PASS' "$RESULT"
          grep -Fxq 'MODULE_LOAD_FILTER=EXCLUDED' "$RESULT"
          grep -Fxq 'HOOK_MODE=MANUAL' "$RESULT"
          grep -Fxq 'SUSFS=NOT_PRESENT' "$RESULT"
          grep -Fxq 'PACKAGE_PASS=NO' "$RESULT"
          grep -Fxq 'STATIC_BOOT_PATH_PASS=NO' "$RESULT"
          grep -Fxq 'DEVICE_PASS=NO' "$RESULT"

          grep -Fxq 'MODULE_LOAD_FILTER_SCAN=PASS' \
            "$ROOT/results/module-filter-scan.txt"
          grep -Fxq 'IDENTITY_GUARD=PASS' \
            "$ROOT/results/identity-after-build.txt"

          (
            cd "$ROOT/results"
            sha256sum -c SHA256SUMS.txt
          )

          sha256sum "$IMAGE" | tee .audit/workflow-06/image-sha256.txt
          cat "$RESULT" | tee .audit/workflow-06/result.txt
          echo "WORKFLOW_RESULT_GATE=PASS" | tee -a .audit/workflow-06/runner.txt

      - name: Capture failure context
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p .audit/workflow-06
          {
            echo "WORKFLOW_RESULT=FAIL"
            echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
            echo
            echo "=== integration.log tail ==="
            tail -n 220 .work/5.4.292-resukisu-v2/results/integration.log 2>/dev/null
            echo
            echo "=== ksu config ==="
            cat .work/5.4.292-resukisu-v2/results/ksu-config.txt 2>/dev/null
            echo
            echo "=== build.log tail ==="
            tail -n 350 .work/5.4.292-resukisu-v2/results/build.log 2>/dev/null
            echo
            echo "=== result ==="
            cat .work/5.4.292-resukisu-v2/results/RESUKISU_RESULT.txt 2>/dev/null
          } > .audit/workflow-06/failure-context.txt 2>&1

      - name: Upload ReSukiSU V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VEUX-5.4.292-ReSukiSU-V2-${{ github.run_id }}
          path: |
            .audit/workflow-06/
            .work/5.4.292-resukisu-v2/results/
            .work/5.4.292-resukisu-v2/out/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
