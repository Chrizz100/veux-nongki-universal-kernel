    - name: Publish authenticated P3 source and compatibility report (no build)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: VEUX-SUSFS54-P3-R4-PREFLIGHT-SOURCE-${{ github.run_id }}
        path: ${{ runner.temp }}/veux-susfs54-p3-source/
        if-no-files-found: error
        retention-days: 14
        compression-level: 6
    - name: Assert repository unchanged and never change boot or release state
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = "$EXPECTED_REPO"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test -z "$(git status --porcelain --untracked-files=all)"
        echo 'R5S2_GENUINE_GIT_VERSION_CANDIDATE_REPOSITORY_UNMODIFIED=PASS'
        echo 'R5S2_SUSFS_5_10_HOST_PATCH_NOT_FORCED=YES'
        echo 'R5S2_MANAGER_KSUD_USERLAND_522_NOT_CLAIMED=YES'
        echo 'R5S2_VERSION_35234_PURE_GIT_COMMIT_ONLY=YES'
        echo 'R5S2_NOMOUNT_DEV8175_NOT_A_STABLE_RELEASE=YES'
        echo 'R5S2_VINTF_ATTESTATION_NOT_MODIFIED=YES'
        echo 'R5S2_NO_FLASH_OR_PROMOTION=YES'

        echo 'P3_FAST_PREBUILD_NO_KERNEL_BUILD=YES; NO_FLASH=YES'
