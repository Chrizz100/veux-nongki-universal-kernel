name: Build Duck Detector Scene Fix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duck-scene-fix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Patch, validate and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact Duck Detector base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: eltavine/Duck-Detector-Refactoring
          ref: ff782645d466f8ad80648704502f0df0572efe7f
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable base
        shell: bash
        run: |
          set -euo pipefail
          expected="ff782645d466f8ad80648704502f0df0572efe7f"
          actual="$(git rev-parse HEAD)"
          echo "Expected: $expected"
          echo "Actual:   $actual"
          test "$actual" = "$expected"

      - name: Apply Scene broadcast false-positive fix
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/eltavine/duckdetector/features/"
              "dangerousapps/data/repository/DangerousAppsRepository.kt"
          )
          text = path.read_text(encoding="utf-8")

          old_verify = """\
              private fun verifyPocFile(path: String): Boolean {
                  val accessOutcome = probeAccess(path)
                  val statOutcome = probeStat(path)
                  val openOutcome = probeOpen(path)
                  val createOutcome = probeCreate(path)

                  if (listOf(accessOutcome, statOutcome, openOutcome).any { it == PathProbeOutcome.MISSING }) {
                      return false
                  }

                  runCatching { Os.getxattr(path, "security.selinux") }

                  return createOutcome == CreateProbeOutcome.ALREADY_EXISTS ||
                      listOf(accessOutcome, statOutcome, openOutcome).any { it == PathProbeOutcome.EXISTS }
              }
          """

          new_verify = """\
              private fun verifyPocFile(path: String): Boolean {
                  val accessOutcome = probeAccess(path)
                  val statOutcome = probeStat(path)
                  val openOutcome = probeOpen(path)

                  if (listOf(accessOutcome, statOutcome, openOutcome).any { it == PathProbeOutcome.MISSING }) {
                      return false
                  }

                  runCatching { Os.getxattr(path, "security.selinux") }

                  // Verification must stay passive. Creating the PoC marker here can
                  // manufacture the very evidence this function is trying to observe.
                  return listOf(accessOutcome, statOutcome, openOutcome)
                      .any { it == PathProbeOutcome.EXISTS }
              }
          """

          old_probe_create = """\
              private fun probeCreate(path: String): CreateProbeOutcome {
                  return try {
                      val fd = Os.open(path, OsConstants.O_CREAT or OsConstants.O_EXCL or OsConstants.O_WRONLY, 0)
                      Os.close(fd)
                      runCatching { Os.remove(path) }
                      CreateProbeOutcome.CREATED_BY_US
                  } catch (e: ErrnoException) {
                      when (e.errno) {
                          OsConstants.EEXIST -> CreateProbeOutcome.ALREADY_EXISTS
                          OsConstants.EACCES, OsConstants.EPERM -> CreateProbeOutcome.BLOCKED
                          OsConstants.ENOENT -> CreateProbeOutcome.MISSING
                          else -> CreateProbeOutcome.UNKNOWN
                      }
                  }
              }

          """

          old_enum = """\
              private enum class CreateProbeOutcome {
                  ALREADY_EXISTS,
                  CREATED_BY_US,
                  MISSING,
                  BLOCKED,
                  UNKNOWN,
              }

          """

          replacements = (
              ("verifyPocFile", old_verify, new_verify),
              ("probeCreate", old_probe_create, ""),
              ("CreateProbeOutcome", old_enum, ""),
          )

          for label, old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one source block, found {count}. "
                      "Refusing to patch an unexpected source tree."
                  )
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          git diff --check

          source="app/src/main/java/com/eltavine/duckdetector/features/dangerousapps/data/repository/DangerousAppsRepository.kt"

          if grep -q 'val createOutcome = probeCreate(path)' "$source"; then
            echo "ERROR: active Scene verifier still calls probeCreate()." >&2
            exit 1
          fi

          if grep -q 'private fun probeCreate(path: String)' "$source"; then
            echo "ERROR: probeCreate() was not removed." >&2
            exit 1
          fi

          if grep -q 'private enum class CreateProbeOutcome' "$source"; then
            echo "ERROR: obsolete CreateProbeOutcome enum was not removed." >&2
            exit 1
          fi

          grep -Fq 'Verification must stay passive.' "$source"

          git diff -- "$source" | tee scene-fix.diff
          test -s scene-fix.diff

      - name: Read Android toolchain settings
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path

          properties = {}
          for raw_line in Path("gradle.properties").read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              properties[key.strip()] = value.strip()

          mapping = {
              "build_tools": "duckdetector.android.buildTools",
              "cmake": "duckdetector.android.cmake",
              "compile_sdk": "duckdetector.android.compileSdk",
              "compile_sdk_minor": "duckdetector.android.compileSdkMinor",
              "ndk": "duckdetector.android.ndk",
          }

          for output_name, property_name in mapping.items():
              value = properties.get(property_name)
              if not value:
                  raise SystemExit(f"Missing required Gradle property: {property_name}")
              print(f"{output_name}={value}")
          PY

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x gradlew

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install exact Android SDK packages
        shell: bash
        env:
          BUILD_TOOLS: ${{ steps.toolchain.outputs.build_tools }}
          CMAKE: ${{ steps.toolchain.outputs.cmake }}
          COMPILE_SDK: ${{ steps.toolchain.outputs.compile_sdk }}
          COMPILE_SDK_MINOR: ${{ steps.toolchain.outputs.compile_sdk_minor }}
          NDK: ${{ steps.toolchain.outputs.ndk }}
        run: |
          set -euo pipefail

          packages=(
            "platform-tools"
            "platforms;android-${COMPILE_SDK}.${COMPILE_SDK_MINOR}"
            "build-tools;${BUILD_TOOLS}"
            "cmake;${CMAKE}"
            "ndk;${NDK}"
          )

          for attempt in 1 2 3; do
            if sdkmanager --install "${packages[@]}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android SDK package installation failed after 3 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Build patched release APK
        id: build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_time_utc="$(date -u +%Y%m%d%H%M%S)"

          ./gradlew \
            --stacktrace \
            -Pduckdetector.buildTimeUtc="$build_time_utc" \
            :app:assembleRelease

      - name: Verify APK and prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import shutil
          from pathlib import Path

          candidates = [
              Path("app/build/outputs/apk/release/output-metadata.json"),
              Path("app/release/output-metadata.json"),
          ]
          metadata_path = next((p for p in candidates if p.is_file()), None)
          if metadata_path is None:
              raise SystemExit("Release output-metadata.json not found.")

          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          elements = [
              e for e in (metadata.get("elements") or [])
              if str(e.get("outputFile", "")).endswith(".apk")
          ]
          if not elements:
              raise SystemExit("No release APK listed in output-metadata.json.")

          universal = [
              e for e in elements
              if str(e.get("type", "")).upper() == "UNIVERSAL"
              or str(e.get("outputFile", "")).endswith("-Universal.apk")
          ]

          if len(universal) == 1:
              selected = universal[0]
          elif len(elements) == 1:
              selected = elements[0]
          else:
              raise SystemExit(
                  "Ambiguous APK outputs: "
                  + ", ".join(str(e.get("outputFile")) for e in elements)
              )

          output_name = str(selected["outputFile"])
          source_apk = metadata_path.parent / output_name
          if not source_apk.is_file() or source_apk.stat().st_size <= 0:
              raise SystemExit(f"APK missing or empty: {source_apk}")

          out = Path("out")
          out.mkdir(exist_ok=True)
          target = out / "DuckDetector-SceneFix-ff782645d466.apk"
          shutil.copy2(source_apk, target)

          print(f"apk={target}")
          PY

          apk="out/DuckDetector-SceneFix-ff782645d466.apk"
          test -s "$apk"

          sha256sum "$apk" | tee out/SHA256SUMS.txt
          cp scene-fix.diff out/scene-fix.diff

          unzip -t "$apk" >/dev/null

          {
            echo "UPSTREAM_COMMIT=ff782645d466f8ad80648704502f0df0572efe7f"
            echo "PATCH=Scene broadcast verifier made passive"
            echo "SIGNING=release variant using upstream debug-signing fallback"
            echo "SHA256=$(sha256sum "$apk" | awk '{print $1}')"
          } > out/BUILD_INFO.txt

      - name: Upload patched APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DuckDetector-SceneFix-ff782645d466
          path: |
            out/DuckDetector-SceneFix-ff782645d466.apk
            out/SHA256SUMS.txt
            out/BUILD_INFO.txt
            out/scene-fix.diff
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
