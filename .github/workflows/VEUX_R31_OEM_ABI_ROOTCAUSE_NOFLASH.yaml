# VEUX R31 OEM ABI source-conditional investigation.
# Research-only. No kernel compilation, boot images, flashing or module writes.
name: VEUX R31 OEM Source and ABI Rootcause - NO FLASH
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: veux-r31-oem-source-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  EXPECTED_REPO: Chrizz100/veux-nongki-universal-kernel
  R31_MAIN: VEUX_R31_OEM_ABI_ROOTCAUSE_MAIN.zip
  R31_MAIN_SHA256: 7e0a14ed43a90e39a3b3c253f2b5ee9845a14a6965a5507484d19f49eeb42062
  R30_R2_MAIN: VEUX_R30_R2_OEM_CRC_MAIN.zip
  R30_R2_MAIN_SHA256: ec1104a695a96db2515104fad6c0bf2a178b693c66a651ccca511aded146768b
jobs:
  source_rootcause_audit:
    if: ${{ github.repository == 'Chrizz100/veux-nongki-universal-kernel' && github.ref == 'refs/heads/main' }}
    name: Pinned source and OEM import analysis (NO BUILD, NO FLASH)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact repository revision without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify both original archives and extract only audited R31 scripts to runner temp
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPO"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -f "$GITHUB_WORKSPACE/$R31_MAIN"
          test -f "$GITHUB_WORKSPACE/$R30_R2_MAIN"
          printf '%s  %s\n' "$R31_MAIN_SHA256" "$GITHUB_WORKSPACE/$R31_MAIN" | sha256sum -c --strict
          printf '%s  %s\n' "$R30_R2_MAIN_SHA256" "$GITHUB_WORKSPACE/$R30_R2_MAIN" | sha256sum -c --strict
          python3 -B - <<'PY_R31_UNZIP'
          import hashlib, json, os, pathlib, stat, zipfile
          source=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/os.environ['R31_MAIN']
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'veux-r31-readonly'
          if dest.exists() or dest.is_symlink():
              raise SystemExit('R31_UNEXPECTED_DESTINATION_EXISTS')
          with zipfile.ZipFile(source) as z:
              infos=z.infolist()
              names=[i.filename for i in infos]
              if len(infos)>32 or len(set(names))!=len(infos) or z.testzip() is not None:
                  raise SystemExit('R31_CORRUPT_DUPLICATE_OR_EXCESS_FILES')
              if sum(i.file_size for i in infos)>300000:
                  raise SystemExit('R31_DECOMPRESS_LIMIT')
              manifest=json.loads(z.read('MANIFEST_SHA256.json'))
              if manifest.get('schema')!=1 or manifest.get('description')!='VEUX_R31_OEM_SOURCE_CONDITIONAL_ROOTCAUSE_NOFLASH':
                  raise SystemExit('R31_MANIFEST_IDENTITY')
              if manifest.get('flash_allowed') is not False or manifest.get('kernel_build') is not False:
                  raise SystemExit('R31_BAD_SAFETY_MODE')
              if manifest.get('r30_r2_sha256')!=os.environ['R30_R2_MAIN_SHA256']:
                  raise SystemExit('R31_INPUT_PIN_CHANGED')
              if set(manifest['files'])|{'MANIFEST_SHA256.json'}!=set(names):
                  raise SystemExit('R31_MANIFEST_CONTENTS_CHANGED')
              data={}
              for info in infos:
                  name=info.filename
                  path=pathlib.PurePosixPath(name)
                  kind=stat.S_IFMT(info.external_attr>>16)
                  if (not name or path.is_absolute() or '..' in path.parts or '\\' in name or info.is_dir() or
                      kind not in (0,stat.S_IFREG) or info.file_size>150000):
                      raise SystemExit('R31_UNSAFE_ZIP_MEMBER')
                  payload=z.read(info)
                  if name!='MANIFEST_SHA256.json':
                      if hashlib.sha256(payload).hexdigest()!=manifest['files'][name]:
                          raise SystemExit('R31_MEMBER_SHA256_CHANGED:'+name)
                  data[name]=payload
              dest.mkdir(mode=0o700)
              for name,payload in data.items():
                  path=dest/name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(payload)
          print('R31_ARCHIVE_AND_MANIFEST=PASS; R30_INPUT=SHA_PINNED; FLASH=NO')
          PY_R31_UNZIP
      - name: Run 41 regression and negative tests, reconstruct the OEM-ABI provenance report
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/veux-r31-readonly"
          export R30R2_ARCHIVE="$GITHUB_WORKSPACE/$R30_R2_MAIN"
          python3 -B "$root/src/r31_abi_audit.py" --selftest
          python3 -B -m unittest discover -s "$root/tests" -p 'test_r31.py' -v
          python3 -B "$root/src/r31_abi_audit.py" --input "$R30R2_ARCHIVE" --out "$root/results"
          python3 -B - "$root" <<'PY_R31_COMPARE'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          expected={p.name for p in (root/'preview').iterdir() if p.is_file()}
          actual={p.name for p in (root/'results').iterdir() if p.is_file()}
          if expected!=actual:
              raise SystemExit('R31_REPORT_FILE_SET_CHANGED')
          for name in sorted(expected):
              a=hashlib.sha256((root/'preview'/name).read_bytes()).digest()
              b=hashlib.sha256((root/'results'/name).read_bytes()).digest()
              if a!=b:
                  raise SystemExit('R31_NONREPRODUCIBLE_REPORT:'+name)
          r=json.loads((root/'results/R31_FINDINGS.json').read_text())
          if r['status']!='OFFLINE_ROOT_CAUSE_CLUES_PASS__VENDOR_ABI_AND_LOADER_PATH_BLOCKED__NO_FLASH':
              raise SystemExit('R31_UNEXPECTED_ABI_STATUS')
          if r['flash_allowed'] is not False or r['priority_module_paths_fully_compatible_A']!=0:
              raise SystemExit('R31_INVALID_RELEASE_GATE')
          print('R31_OFFLINE_REPORT_BYTE_IDENTICAL=PASS; OEM_MODULE_ABI=BLOCKED; FLASH=NO')
          PY_R31_COMPARE
      - name: Fetch and verify pinned public source blob identities and code conditionals
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/veux-r31-readonly"
          python3 -B "$root/src/r31_abi_audit.py" --sources --out "$root/results"
          python3 -B - "$root/results/R31_PINNED_SOURCE_AUDIT.json" <<'PY_R31_PROVENANCE'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          if data['status']!='PINNED_SOURCE_BLOBS_VERIFIED' or len(data['source_records'])!=10:
              raise SystemExit('R31_UNEXPECTED_SOURCE_VERIFICATION')
          if data['same_blob_count']!=3 or data['exact_5_4_274_Xiaomi_source_unavailable'] is not True:
              raise SystemExit('R31_FALSE_OEM_PROVENANCE')
          print('R31_GITHUB_SOURCE_PROVENANCE=PASS; SAME_CORE_FILES=3; EXACT_STOCK_SOURCE=NOT_AVAILABLE')
          PY_R31_PROVENANCE
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'R31_SOURCE_AND_PROTECTED_R13_CHECKOUT=UNCHANGED'
      - name: Print the source-based diagnosis and explicit ABI blockade
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/veux-r31-readonly/results"
          cat "$root/R31_PRUEFBERICHT_DE.txt"
          {
            echo '## VEUX R31 – Quellen-/ABI-Ursachenpruefung (NO FLASH)'
            echo 'Hash- und Manifest-Prüfung: PASS. Pinned Git BLOB source conditionals: PASS.'
            echo 'Stock CONFIG_NR_CPUS=32; R13/A/B=8; QGKI/GKI cpumask extern-import contradiction identified.'
            echo 'Trace-Allocator: R13 missing, R30-A exported but CRC mismatched.'
            echo '9/9 priority OEM module paths still ABI-blocked. No kernel build, no flash.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload R31 source/ABI diagnostic reports only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VEUX_R31_OEM_SOURCE_ROOTCAUSE_NOFLASH
          path: ${{ runner.temp }}/veux-r31-readonly/results/*
          if-no-files-found: error
          retention-days: 21
          compression-level: 8
