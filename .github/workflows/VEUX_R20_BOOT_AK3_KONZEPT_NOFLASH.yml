    - name: Lint complete workflow and shell programs
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends python3-yaml shellcheck
        curl --fail --location --silent --show-error --retry 3 --max-time 180   https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz   --output "$RUNNER_TEMP/r20-actionlint.tar.gz"
        printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/r20-actionlint.tar.gz" | sha256sum -c --strict -
        tar -xzf "$RUNNER_TEMP/r20-actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
        "$RUNNER_TEMP/actionlint" -shellcheck= -color=false .github/workflows/VEUX_R20_BOOT_AK3_KONZEPT_NOFLASH.yml
        python3 -B - <<'PY_LINT'
        import ast,os,pathlib,re,subprocess,yaml
        data=yaml.safe_load(pathlib.Path('.github/workflows/VEUX_R20_BOOT_AK3_KONZEPT_NOFLASH.yml').read_text())
        count=0
        for step in data['jobs']['audit']['steps']:
            if 'run' not in step:continue
            body=step['run'];p=pathlib.Path(os.environ['RUNNER_TEMP'])/('r20-shell-'+str(count)+'.sh')
            p.write_text(body)
            subprocess.run(['bash','-n',str(p)],check=True,timeout=30)
            subprocess.run(['shellcheck','--norc','--shell=bash',str(p)],check=True,timeout=60)
            lines=body.splitlines();i=0
            while i<len(lines):
                m=re.search(r"python3\b.*<<'([A-Z_]+)'",lines[i])
                if not m:i+=1;continue
                tag=m[1];start=i+1;i=start
                while i<len(lines) and lines[i]!=tag:i+=1
                assert i<len(lines)
                ast.parse('\n'.join(lines[start:i]));i+=1
            count+=1
        print('ALL_WORKFLOW_SHELL_AND_EMBEDDED_PYTHON_CHECKS_PASSED',count)
        PY_LINT
    - name: Authenticate green R19 run and download exact artifact
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Chrizz100/veux-nongki-universal-kernel
        gh api repos/Chrizz100/veux-nongki-universal-kernel/actions/runs/43471009003 > "$R20_INPUT/run.json"
        gh api repos/Chrizz100/veux-nongki-universal-kernel/actions/artifacts/14065321969 > "$R20_INPUT/artifact.json"
        python3 -B - <<'PY_AUTH'
        import json,os,pathlib
        p=json.loads((pathlib.Path(os.environ['R20_MAIN'])/'References/PROFILE.json').read_text())
        root=pathlib.Path(os.environ['R20_INPUT'])
        r=json.loads((root/'run.json').read_text());a=json.loads((root/'artifact.json').read_text())
        assert r['id']==p['source_run'] and r['head_sha']==p['source_commit']
        assert r['status']=='completed' and r['conclusion']=='success'
        assert a['id']==p['artifact_id'] and a['name']==p['artifact_name'] and not a['expired']
        assert a['size_in_bytes']==p['artifact_size'] and a['digest']=='sha256:'+p['artifact_sha256']
        assert a['workflow_run']['id']==p['source_run'] and a['workflow_run']['head_sha']==p['source_commit']
        print('R19_SOURCE_RUN_COMMIT_AND_ARTIFACT_AUTHENTICATED')
        PY_AUTH
        gh api repos/Chrizz100/veux-nongki-universal-kernel/actions/artifacts/14065321969/zip > "$R20_INPUT/candidate.zip"
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Authenticate proven 5.4.274 boot AK3 and unpacking tool
      shell: bash
      run: |
        set -euo pipefail
        python3 -B - <<'PY_INPUTS'
        import hashlib,json,os,pathlib,tempfile,urllib.request,zipfile
        p=json.loads((pathlib.Path(os.environ['R20_MAIN'])/'References/PROFILE.json').read_text())
        root=pathlib.Path(os.environ['R20_INPUT'])
        for key,name in [('reference_ak3','reference-AK3.zip'),('reference_boot','reference-boot.img'),('magisk_apk','Magisk.apk')]:
            for attempt in range(3):
                try:
                    h=hashlib.sha256()
                    with urllib.request.urlopen(p[key+'_url'],timeout=60) as response,(root/(name+'.part')).open('wb') as f:
                        for b in iter(lambda:response.read(1024*1024),b''):f.write(b);h.update(b)
                    assert h.hexdigest()==p[key+'_sha256'], 'REFERENCE_HASH_MISMATCH:'+name
                    (root/(name+'.part')).replace(root/name)
                    break
                except (OSError,TimeoutError):
                    if attempt==2:raise
        with zipfile.ZipFile(root/'Magisk.apk') as z:
            names=[n for n in z.namelist() if n.startswith('lib/x86_64/') and 'magiskboot' in n]
            assert len(names)==1
            b=z.read(names[0]);assert hashlib.sha256(b).hexdigest()==p['host_magiskboot_sha256']
            tool=root/'magiskboot';tool.write_bytes(b);tool.chmod(0o755)
        print('PROVEN_REFERENCE_BOOT_AK3_AND_HOST_UNPACKER_AUTHENTICATED')
        PY_INPUTS
    - name: Run eight packaging and negative safety regressions
      shell: bash
      run: |
        set -euo pipefail
        R20_REFERENCE_AK3="$R20_INPUT/reference-AK3.zip" python3 -B -m unittest discover -s "$R20_MAIN/Tests" -v
    - name: Verify real kernel and reference boot path gate new artifacts
      shell: bash
      run: |
        set -euo pipefail
        python3 -B "$R20_MAIN/Tools/boot_ak3_plan.py" run   --candidate "$R20_INPUT/candidate.zip"   --reference-ak3 "$R20_INPUT/reference-AK3.zip"   --reference-boot "$R20_INPUT/reference-boot.img"   --magiskboot "$R20_INPUT/magiskboot"   --output "$RUNNER_TEMP/r20-out" --work "$RUNNER_TEMP/r20-work"
      id: plan
    - name: Summarize readiness without inferring a Device Pass
      shell: bash
      run: |
        set -euo pipefail
        python3 -B - <<'PY_SUMMARY'
        import json,os,pathlib
        r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'r20-out/R20_BOOT_AK3_RESULT.json').read_text())
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('### VEUX R20 Boot-/AK3-Pruefung\n\n')
            f.write('Status: **'+r['status']+'**\n\n')
            f.write('Kernel: `'+r['actual_release']+'`; Ziel: `'+r['expected_release']+'`\n\n')
            f.write('Passende OEM-CRCs: '+str(r['qgki_counts']['MATCH'])+'/1423; Module: '+str(r['fully_matching_modules'])+'/37.\n\n')
            f.write('Referenz-Repack geprueft: '+str(r['reference_pair_static_boot_pass'])+'. Neuer Kernel Static Boot Pass: '+str(r['new_kernel_static_boot_pass'])+'.\n\n')
            f.write('Device Pass: **NEIN**. Flashfreigabe: **NEIN**.\n\n')
            for reason in r['blocking_reasons']:f.write('- '+reason+'\n')
        print('WORKFLOW_GREEN_MEANS_AUDIT_COMPLETED; DEVICE_PASS=NO FLASH=NO')
        PY_SUMMARY
    - name: Preserve completed audit and only fully validated NOFLASH products
      if: ${{ success() && steps.plan.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: VEUX-R20-BOOT-AK3-AUDIT-NOFLASH-${{ github.run_id }}
        path: ${{ runner.temp }}/r20-out/
        if-no-files-found: error
        retention-days: 30
        compression-level: 6
    - name: Preserve text diagnostics on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: VEUX-R20-TEXT-DIAGNOSTICS-${{ github.run_id }}
        path: ${{ runner.temp }}/r20-work/**/*.log
        if-no-files-found: warn
        retention-days: 14
