name: VEUX R6 SUSFS SELinux 5.4 R4 - Experimental Build - NO FLASH

'on':
  workflow_dispatch:
    inputs:
      enable_build:
        description: 'Compile experimental VEUX 5.4.274 R6 with NoMount 2.1.1; NO
          FLASH approval'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: veux-r6-susfs-selinux54-r4-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_TERMINAL_PROMPT: '0'
  VEUX_EXPECTED_REPOSITORY: Chrizz100/veux-nongki-universal-kernel
  VEUX_MAIN_ZIP: VEUX_R6_SUSFS_SELINUX54_R4_MAIN.zip
  VEUX_MAIN_SHA256: 
    05a5fe60a643b64a9a9f427b40215ae5634984660c57391d411c25a1d8e4432f

jobs:
  experimental_r4:
    name: VEUX R6 NoMount211 plus R3 SELinux port R4 isolated compile - NO FLASH
    if: ${{ github.repository == 'Chrizz100/veux-nongki-universal-kernel' && 
      github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
    - name: Checkout exact main SHA read only
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false

    - name: Verify immutable ZIP, main SHA and repository identity
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = "$VEUX_EXPECTED_REPOSITORY"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test -z "$(git status --porcelain --untracked-files=all)"
        test -f "$GITHUB_WORKSPACE/$VEUX_MAIN_ZIP"
        printf '%s  %s\n' "$VEUX_MAIN_SHA256" "$GITHUB_WORKSPACE/$VEUX_MAIN_ZIP" | sha256sum --check --status
        echo 'R2_REPO_AND_ZIP_SHA256=PASS'

    - name: Checksum-pinned actionlint 1.7.12 verifies R4 YAML
      shell: bash
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
        curl --fail --location --silent --show-error --retry 3 --max-time 120 \
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
          --output "$archive"
        printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check --status
        mkdir -p "$RUNNER_TEMP/veux-nm211-r2-actionlint"
        tar -xzf "$archive" -C "$RUNNER_TEMP/veux-nm211-r2-actionlint" actionlint
        "$RUNNER_TEMP/veux-nm211-r2-actionlint/actionlint" -oneline \
          .github/workflows/VEUX_R6_SUSFS_SELINUX54_R4_EXPERIMENTAL_BUILD.yml
        echo 'R2_ACTIONLINT=PASS'

    - name: Safely verify R4 ZIP, green R3 audit and nested proven R2 ZIP
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib, json, os, stat, zipfile
        from pathlib import Path, PurePosixPath
        main=Path(os.environ['GITHUB_WORKSPACE'])/os.environ['VEUX_MAIN_ZIP']
        base=Path(os.environ['RUNNER_TEMP'])
        overlay=base/'veux-r6-selinux54-r4-overlay'
        r2=base/'veux-r6-selinux54-r4-r2-overlay'
        main_names={
            'MANIFEST_SHA256.json', 'README_START_HIER_DE.txt',
            'baseline/VEUX_R6_NM211_R2_MAIN.zip',
            'common/scripts/veux_r6_susfs_selinux54_port_r3.py',
            'common/scripts/veux_r6_susfs_selinux54_build_r4.py',
            'Tests/test_susfs_selinux54_r3.py',
            'Tests/test_veux_r6_susfs_selinux54_build_r4.py',
            'evidence/R3_GITHUB_AUDIT_39004860053.zip',
        }
        r2_names={
         'README_START_HIER_DE.txt','MANIFEST_SHA256.json',
         'common/r6_nm211/pinned_nomount_7046c7ad_source.tar.gz',
         'common/r6_nm211/SUSFS_R2_NACHPRUEFUNG.json',
         'common/scripts/veux_r6_nomount211_preflight_r1.py',
         'common/scripts/veux_r6_nomount211_build_r2.py',
         'Tests/test_veux_r6_nomount211_preflight_r1.py',
         'Tests/test_veux_r6_nomount211_build_r2.py',
        }
        def extract_exact(src, dest, expected, schema):
            if dest.exists() or dest.is_symlink():
                raise SystemExit('R4_TEMP_DEST_ALREADY_EXISTS')
            with zipfile.ZipFile(src) as z:
                entries=z.infolist()
                if (z.testzip() is not None or len(entries)!=len(expected)
                    or set(z.namelist())!=expected):
                    raise SystemExit('R4_ZIP_MEMBER_CRC_OR_SCOPE_CHANGED')
                manifest=json.loads(z.read('MANIFEST_SHA256.json'))
                if manifest.get('schema')!=schema or manifest.get('approved_for_flash') is not False:
                    raise SystemExit('R4_MANIFEST_SCHEMA_OR_FLASH_CHANGED')
                if set(manifest.get('files',{}))!=expected-{'MANIFEST_SHA256.json'}:
                    raise SystemExit('R4_MANIFEST_MEMBER_SCOPE_CHANGED')
                dest.mkdir(parents=True)
                for entry in entries:
                    rel=PurePosixPath(entry.filename)
                    mode=entry.external_attr>>16
                    if (rel.is_absolute() or '..' in rel.parts or '\\' in entry.filename
                        or not stat.S_ISREG(mode)):
                        raise SystemExit('R4_UNSAFE_FILE_IN_ZIP:'+entry.filename)
                    data=z.read(entry.filename)
                    if entry.filename!='MANIFEST_SHA256.json':
                        if hashlib.sha256(data).hexdigest()!=manifest['files'][entry.filename]:
                            raise SystemExit('R4_MEMBER_SHA_CHANGED:'+entry.filename)
                    target=dest.joinpath(*rel.parts)
                    target.parent.mkdir(parents=True,exist_ok=True)
                    if target.exists() or target.is_symlink():
                        raise SystemExit('R4_DUPLICATE_MEMBER')
                    target.write_bytes(data)
                return manifest
        r4=extract_exact(main,overlay,main_names,4)
        if (r4.get('r2_green_kernel_run')!=38965488864
            or r4.get('r3_green_source_only_run')!=39004860053
            or r4.get('no_full_susfs_510_port') is not True
            or r4.get('no_promotion') is not True
            or r4.get('susfs_component_pin')!='5326e21a7eb232f9e21debdd5164e99bee3d1e2f'
            or r4.get('nomount_candidate')!='7046c7ad3ee0bf4ae66e80f6b93b1e30db0cb4e3'):
            raise SystemExit('R4_COMPONENT_PROVENANCE_DRIFT')
        r2zip=overlay/'baseline/VEUX_R6_NM211_R2_MAIN.zip'
        if hashlib.sha256(r2zip.read_bytes()).hexdigest()!=r4['r2_zip_sha256'] or r4['r2_zip_sha256']!='ac70b8203ddc9978847b819413cc239cd2b3aab22ef60277fa8f0b2adb8ebda3':
            raise SystemExit('R4_R2_PROVEN_ZIP_MISMATCH')
        r2manifest=extract_exact(r2zip,r2,r2_names,2)
        if (r2manifest.get('last_source_pass_run')!=38960694902
            or r2manifest.get('reference_run')!=38530535344
            or r2manifest.get('nomount_candidate')!=r4['nomount_candidate']):
            raise SystemExit('R4_R2_BASELINE_MANIFEST_DRIFT')
        r3zip=overlay/'evidence/R3_GITHUB_AUDIT_39004860053.zip'
        if (hashlib.sha256(r3zip.read_bytes()).hexdigest()!=r4['r3_github_artifact_sha256']
            or r4['r3_github_artifact_sha256']!='70603805a9b0a7f374df245166441615d28d0a2f5328d7c29edf38be78868850'):
            raise SystemExit('R4_R3_GREEN_EVIDENCE_SHA_DRIFT')
        with zipfile.ZipFile(r3zip) as z:
            if z.testzip() is not None: raise SystemExit('R4_R3_AUDIT_ZIP_CRC_FAILED')
            j=json.loads(z.read('report/SUSFS_SELINUX54_R3/RESULT.json'))
            candidate=z.read('report/SUSFS_SELINUX54_R3/SELINUX_5_4_PORT_R3_STAGED.c')
        if (j.get('status')!='TARGETED_5_4_SELINUX_SOURCE_STAGED_NOT_COMPILED'
            or j.get('reference_success_run')!=38965488864
            or j.get('full_upstream_susfs_integration_applied') is not False
            or j.get('bakasu_status_guard',{}).get('after_sha256')!=r4['r3_source_one_change_sha256']
            or hashlib.sha256(candidate).hexdigest()!=r4['r3_source_one_change_sha256']):
            raise SystemExit('R4_R3_EXACT_REVIEWED_SOURCE_NOT_FOUND')
        print('R4_IMMUTABLE_PACKAGES_R2_AND_R3_EVIDENCE=PASS')
        PY
        echo "R4_OVERLAY=$RUNNER_TEMP/veux-r6-selinux54-r4-overlay" >> "$GITHUB_ENV"
        echo "NM211_R2_OVERLAY=$RUNNER_TEMP/veux-r6-selinux54-r4-r2-overlay" >> "$GITHUB_ENV"

    - name: Offline R1-R4 regression and negative tests for R6 code
      shell: bash
      run: |
        set -euo pipefail
        export PYTHONPATH="$R4_OVERLAY/common/scripts:$NM211_R2_OVERLAY/common/scripts${PYTHONPATH:+:$PYTHONPATH}"
        python3 - <<'PY'
        import ast,os
        from pathlib import Path
        root=Path(os.environ['NM211_R2_OVERLAY'])
        for rel in (
            'common/scripts/veux_r6_nomount211_preflight_r1.py',
            'common/scripts/veux_r6_nomount211_build_r2.py',
            'Tests/test_veux_r6_nomount211_preflight_r1.py',
            'Tests/test_veux_r6_nomount211_build_r2.py',
        ):
            ast.parse((root/rel).read_text(),filename=rel)
        print('R2_PYTHON_AST=PASS')
        PY
        python3 -m unittest discover -s "$NM211_R2_OVERLAY/Tests" -p 'test_veux_r6_nomount211_preflight_r1.py' -v
        python3 -m unittest discover -s "$NM211_R2_OVERLAY/Tests" -p 'test_veux_r6_nomount211_build_r2.py' -v
        for n in common/scripts/veux_r6_susfs_selinux54_port_r3.py \
          common/scripts/veux_r6_susfs_selinux54_build_r4.py \
          Tests/test_susfs_selinux54_r3.py \
          Tests/test_veux_r6_susfs_selinux54_build_r4.py; do
            test -s "$R4_OVERLAY/$n"
        done
        python3 -m unittest discover -s "$R4_OVERLAY/Tests" -p 'test_susfs_selinux54_r3.py' -v
        python3 -m unittest discover -s "$R4_OVERLAY/Tests" -p 'test_veux_r6_susfs_selinux54_build_r4.py' -v
        test -z "$(git status --porcelain --untracked-files=all)"
        echo 'R4_R1_TO_R4_HOST_GATES=PASS'

    - name: Install pinned R6 build dependencies unchanged
      shell: bash
      run: |
        set -euo pipefail
        for p in common/scripts/veux_fleet_35222_selinux_r3.py \
          common/scripts/veux_bakasu_official_selinux_r6.py \
          common/scripts/veux_update_engine.py \
          common/scripts/veux_source_transport.py \
          common/scripts/veux_susfs_54_port_probe_r3.py \
          common/scripts/veux_release_device.py \
          common/contracts/CURRENT_BUILD.json; do test -f "$p"; done
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc binutils bison build-essential ca-certificates curl dwarves file flex \
          git jq libelf-dev libncurses-dev libssl-dev perl python3 \
          python3-venv python3-yaml rsync unzip zip xz-utils zstd
        python3 -m venv "$RUNNER_TEMP/veux-nm211-r2-venv"
        "$RUNNER_TEMP/veux-nm211-r2-venv/bin/python" -m pip install \
          --disable-pip-version-check --retries 2 --timeout 30 \
          ruamel.yaml==0.19.1 PyYAML==6.0.3
        echo "NM211_R2_PY=$RUNNER_TEMP/veux-nm211-r2-venv/bin/python" >> "$GITHUB_ENV"

    - name: Prepare immutable R6 donors with NoMount 2.1.1 only
      shell: bash
      run: |
        set -euo pipefail
        "$NM211_R2_PY" -u "$NM211_R2_OVERLAY/common/scripts/veux_r6_nomount211_preflight_r1.py" \
          prepare --repo "$GITHUB_WORKSPACE" \
          --work "$RUNNER_TEMP/veux-r6-selinux54-r4-work" --kernel 5.4.274

    - name: Full R6 source preflight, SUSFS review remains blocked
      shell: bash
      run: |
        set -euo pipefail
        "$NM211_R2_PY" -u "$NM211_R2_OVERLAY/common/scripts/veux_r6_nomount211_preflight_r1.py" \
          preflight --repo "$GITHUB_WORKSPACE" \
          --work "$RUNNER_TEMP/veux-r6-selinux54-r4-work" --kernel 5.4.274
        "$NM211_R2_PY" - <<'PY'
        import json,os
        from pathlib import Path
        work=Path(os.environ['RUNNER_TEMP'])/'veux-r6-selinux54-r4-work'
        data=json.loads((work/'report/NOMOUNT211_R6_SOURCE_ONLY.json').read_text())
        if data.get('status')!='SOURCE_PREFLIGHT_ONLY_PASS' or data.get('source_preflight') is not True:
            raise SystemExit('R2_R1_PRECHECK_NOT_GREEN')
        if data.get('bakasu_or_susfs_upgraded') is not False:
            raise SystemExit('BAKASU_OR_SUSFS_UNEXPECTED_UPGRADE')
        if data.get('nomount_stack_protector_review_required') is not True:
            raise SystemExit('STACK_REVIEW_WAS_SUPPRESSED')
        print('R2_FULL_R6_SOURCE_AND_STABILITY_PRECHECK=PASS')
        PY

    - name: Reproduce reviewed R3 one-line SELinux port in temporary kernel 
        source
      shell: bash
      run: |
        set -euo pipefail
        export PYTHONPATH="$R4_OVERLAY/common/scripts:$NM211_R2_OVERLAY/common/scripts${PYTHONPATH:+:$PYTHONPATH}"
        "$NM211_R2_PY" -u "$R4_OVERLAY/common/scripts/veux_r6_susfs_selinux54_port_r3.py" \
          stage --repo "$GITHUB_WORKSPACE" \
          --work "$RUNNER_TEMP/veux-r6-selinux54-r4-work"
        "$NM211_R2_PY" - <<'PY'
        import json,os
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])/'veux-r6-selinux54-r4-work'
        r=json.loads((root/'report/SUSFS_SELINUX54_R3/RESULT.json').read_text())
        if (r.get('status')!='TARGETED_5_4_SELINUX_SOURCE_STAGED_NOT_COMPILED'
            or r.get('bakasu_status_guard',{}).get('after_sha256')!='3cb110f10df3f552620dbd7592d15270b8c45a0179c2bc0e34210ad6120bf0d6'
            or r.get('kernel_built') is not False or r.get('flash_permission') is not False):
            raise SystemExit('R4_REQUIRED_R3_SOURCE_IDENTITY_UNPROVEN')
        print('R4_R3_SOURCE_PREFLIGHT=PASS; COMPILE_NEXT_ONLY_IF_ENABLED')
        PY
    - name: Compile exact R3 SELinux port plus proven R2 NoMount on R6
      if: ${{ inputs.enable_build }}
      shell: bash
      run: |
        set -euo pipefail
        export PYTHONPATH="$R4_OVERLAY/common/scripts:$NM211_R2_OVERLAY/common/scripts${PYTHONPATH:+:$PYTHONPATH}"
        "$NM211_R2_PY" -u "$R4_OVERLAY/common/scripts/veux_r6_susfs_selinux54_build_r4.py" \
          build --repo "$GITHUB_WORKSPACE" \
          --work "$RUNNER_TEMP/veux-r6-selinux54-r4-work" --jobs 4
        echo 'R4_R6_NOMOUNT211_ONE_CHANGE_SELINUX54_KERNEL_BUILD=PASS; DEVICE_PASS=NO'

    - name: Verify compiled BakaSU, NoMount stack protection and R4 AK3 identity
      if: ${{ inputs.enable_build && success() }}
      shell: bash
      run: |
        set -euo pipefail
        "$NM211_R2_PY" - <<'PY'
        import hashlib,json,os,zipfile
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])/'veux-r6-selinux54-r4-work'
        pub=root/'public/5.4.274'
        summary=json.loads((root/'report/SELINUX54_R4_FINAL.json').read_text())
        row=json.loads((pub/'RESULT.json').read_text())
        r4=row.get('selinux54_r4') or {}
        nm=row.get('nomount211_r2') or {}
        if (summary.get('status')!='EXPERIMENTAL_R4_COMPILE_GATES_PASS_DEVICE_UNTESTED'
            or summary.get('flash_release') is not False or summary.get('device_pass') is not False):
            raise SystemExit('R4_FINAL_STATUS_OR_SAFETY_MISMATCH')
        if (r4.get('status')!='COMPILED_R3_REVIEWED_SELINUX_STATUS_PORT'
            or r4.get('source_sha256')!='3cb110f10df3f552620dbd7592d15270b8c45a0179c2bc0e34210ad6120bf0d6'
            or r4.get('source_change_count')!=1
            or r4.get('R6_BakaSU_official_d726_byte_identical_in_compiled_kernel') is not False):
            raise SystemExit('R4_COMPILED_EXACT_SOURCE_EVIDENCE_MISSING')
        if (nm.get('strong_stack_protector_on_nomount_object') is not True
            or nm.get('thinlto_on_nomount_object') is not True
            or row.get('targets',{}).get('nomount',{}).get('commit')!='7046c7ad3ee0bf4ae66e80f6b93b1e30db0cb4e3'
            or row.get('targets',{}).get('susfs',{}).get('commit')!='5326e21a7eb232f9e21debdd5164e99bee3d1e2f'):
            raise SystemExit('R4_R2_BASE_COMPONENT_OR_STACK_REGRESSION')
        if not all(row.get(k) is True for k in ('compile','package','static_boot')) or row.get('device') is not False:
            raise SystemExit('R4_INCOMPLETE_BUILD_GATES_OR_FALSE_DEVICE_PASS')
        artifacts=list(pub.glob('*_AnyKernel_RMNET.zip'))
        if len(artifacts)!=1:raise SystemExit('R4_AK3_MISSING_OR_MULTIPLE')
        with zipfile.ZipFile(artifacts[0]) as z:
            if z.testzip() is not None:raise SystemExit('R4_AK3_CORRUPT')
            image=z.read('Image')
        if hashlib.sha256(image).hexdigest()!=row['image_sha256']:
            raise SystemExit('R4_IMAGE_SHA256_MISMATCH')
        if row['image_sha256']=='2de30e4990ac789d6176f0416b197904fb45365e05323567e88c51a2f576a3ef':
            raise SystemExit('R4_IMAGE_IDENTICAL_TO_R2_NOT_A_NEW_BUILD')
        print('R4_EXPERIMENTAL_BINARY_AND_SOURCE_AUDIT=PASS; FLASH_PERMISSION=NO')
        PY

    - name: Preserve complete R4 source and build audit even when blocked
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: VEUX-R6-SUSFS-SELINUX54-R4-AUDIT-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/veux-nm211-r2-work/prepare.json
          ${{ runner.temp }}/veux-nm211-r2-work/report/
          ${{ runner.temp }}/veux-nm211-r2-work/builds/diagnostics/5.4.274/
          ${{ runner.temp }}/veux-nm211-r2-work/source-audit/5.4.274/integration.json
        if-no-files-found: warn
        retention-days: 21
        compression-level: 6

    - name: Publish R4 experimental kernel only after complete gates
      if: ${{ inputs.enable_build && success() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: VEUX-R6-SUSFS-SELINUX54-R4-EXPERIMENTAL-NO-FLASH-${{ github.run_id
          }}
        path: ${{ runner.temp }}/veux-nm211-r2-work/public/5.4.274/
        if-no-files-found: error
        retention-days: 21
        compression-level: 0

    - name: Prove unchanged repository and source pins, without promotion
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = "$VEUX_EXPECTED_REPOSITORY"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test -z "$(git status --porcelain --untracked-files=all)"
        echo 'R4_GITHUB_REPOSITORY_UNCHANGED=PASS'
        echo 'R4_SUSFS_UPSTREAM_CORE=UNCHANGED'
        echo 'R4_BAKASU_UPSTREAM_BLOCKER=NOT_BYPASSED'
        echo 'NO_MAIN_PROMOTION=YES'
        echo 'NO_DEVICE_PASS_INFERRED=YES'
        echo 'NO_FLASH_RELEASE=YES'
