    - name: Strict actionlint duplicate YAML keys Actions inputs ShellCheck
      run: |
        set -euo pipefail
        archive='project/VEUX_R39_R2_MEMORY_ABI_MAIN.zip'
        printf '%s  %s\n' '745d80b8502a9beea513a2e7a58bb59272539b7508920d235ce2e79741bda528' "$archive" | sha256sum -c -
        unzip -p "$archive" tools/actionlint > "$R55_STAGE/actionlint"
        chmod 0755 "$R55_STAGE/actionlint"
        "$R55_STAGE/actionlint" -version | grep -Fx '1.7.12'
        "$R55_STAGE/actionlint" -color=false -shellcheck='' 'project/.github/workflows/VEUX_R55D3_SUSFS54_TASK_MMU_MAPS_REDIRECT_SOURCE_ONLY.yml' > "$R55_STAGE/R55D3_ACTIONLINT.log"
        printf 'R55D3_ACTIONLINT=PASS\n' >> "$R55_STAGE/R55D3_ACTIONLINT.log"
        python3 -B - <<'PY_R55D3_YAML_AUDIT'
        import pathlib,hashlib,subprocess,yaml
        class Unique(yaml.SafeLoader):pass
        def unique(loader,node):
            mapping={}
            for kn,vn in node.value:
                k=loader.construct_object(kn)
                if k in mapping:raise RuntimeError('DUPLICATE_YAML_KEY:'+str(k))
                mapping[k]=loader.construct_object(vn)
            return mapping
        Unique.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,unique)
        w=yaml.load(pathlib.Path('project/.github/workflows/VEUX_R55D3_SUSFS54_TASK_MMU_MAPS_REDIRECT_SOURCE_ONLY.yml').read_text('utf-8'),Loader=Unique)
        assert list(w['on'])==['workflow_dispatch']
        assert w['permissions']=={'contents':'read'}
        assert set(w['jobs'])=={'r55d3_source'}
        j=w['jobs']['r55d3_source'];s=j['steps']
        assert j['runs-on']=='ubuntu-24.04' and j['timeout-minutes']==35
        expected=chr(36)+chr(123)+chr(123)+" github.repository == 'Chrizz100/veux-nongki-universal-kernel' && github.ref == 'refs/heads/main' "+chr(125)+chr(125)
        assert j['if']==expected
        assert len(s)==9
        for i in (0,1):
            assert s[i]['uses']=='actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683'
            assert s[i]['with']['persist-credentials'] is False
        assert s[1]['with']['repository']=='dereference23/kernel_xiaomi_sm6375'
        assert s[1]['with']['ref']=='b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'
        assert s[8]['uses']=='actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02'
        assert s[8]['with']['if-no-files-found']=='error'
        assert s[8]['with']['path']=='/tmp/veux-r55d3/out/'
        logs=[]
        for step in s:
            if 'run' not in step:continue
            body=step['run']
            if chr(36)+chr(123) in body:raise RuntimeError('UNSAFE_GITHUB_INTERPOLATION_IN_RUN')
            for command in (['bash','-n','-'],['shellcheck','--shell=bash','--severity=warning','-']):
                r=subprocess.run(command,input=body,text=True,capture_output=True)
                if r.returncode:raise RuntimeError('SHELL_SYNTAX_OR_SHELLCHECK:'+step['name']+':'+r.stdout+r.stderr)
            logs.append(step['name']+' BASH_SHELLCHECK_PASS SHA256='+hashlib.sha256(body.encode()).hexdigest())
        pathlib.Path('/tmp/veux-r55d3/R55D3_SHELLCHECK.log').write_text('\n'.join(logs)+'\n')
        print('R55D3_YAML_UNIQUE_KEYS_ACTIONS_INPUTS_SHELLCHECK=PASS')
        PY_R55D3_YAML_AUDIT
    - name: 33 SRCU ownership / output / C harness and 17-file Git tests
      run: |
        set -euo pipefail
        python3 -B - <<'PY_R55D3_AST'
        import ast,pathlib
        base=pathlib.Path('/tmp/veux-r55d3')
        for name in ('scripts/r55d3_maps_redirect.py','tests/test_r55d3_maps_redirect.py'):
            ast.parse((base/name).read_text('utf-8'))
        print('R55D3_PYTHON_AST_PASS')
        PY_R55D3_AST
        python3 -B -m unittest discover -v -s "$R55_STAGE/tests" -p 'test_r55d3_maps_redirect.py' 2>&1 | tee "$R55_STAGE/R55D3_TESTS.log"
        grep -Eq '^Ran 33 tests in [0-9.]+s$' "$R55_STAGE/R55D3_TESTS.log"
        grep -Fx 'OK' "$R55_STAGE/R55D3_TESTS.log"
        echo 'R55D3_33_POSITIVE_NEGATIVE_C_AND_GIT_TESTS=PASS'
    - name: Replay pinned R55D2 and port task_mmu maps redirect on real kernel source
      run: |
        set -euo pipefail
        python3 -B "$R55_STAGE/scripts/r55d3_maps_redirect.py" \
          --source kernel --base "$R55_STAGE/inputs/R55D2_AUTHENTIC_17FILES.patch" \
          --out "$R55_STAGE/out" 2>&1 | tee "$R55_STAGE/R55D3_REAL_SOURCE.log"
        python3 -B - <<'PY_R55D3_POST'
        import pathlib,json,hashlib
        out=pathlib.Path('/tmp/veux-r55d3/out')
        r=json.loads((out/'R55D3_RESULT.json').read_text())
        assert r['r55d2_input_sha256']=='6dc99dc8613a2b45be835c4684fa4fe5688cc9e949aef24c6b39ba77d66d2119'
        assert r['files_total']==17 and r['task_mmu_maps_open_redirect_staged'] is True
        assert not r['kernel_compiled'] and not r['flash_allowed']
        p=out/'VEUX_R55D3_SUSFS54_17_FILES_MAPS_REDIRECT_NOFLASH.patch'
        assert hashlib.sha256(p.read_bytes()).hexdigest()==r['complete_17_file_patch_sha256']
        print('R55D3_REAL_PINNED_SOURCE_POSTCHECK_PASS')
        PY_R55D3_POST
    - name: Independent clean exact 17-file Git replay
      run: |
        set -euo pipefail
        git -C kernel worktree add --detach "$R55_STAGE/replay" b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
        patch="$R55_STAGE/out/VEUX_R55D3_SUSFS54_17_FILES_MAPS_REDIRECT_NOFLASH.patch"
        git -C "$R55_STAGE/replay" apply --check --whitespace=error "$patch"
        git -C "$R55_STAGE/replay" apply --whitespace=error "$patch"
        git -C "$R55_STAGE/replay" add -N -- fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h
        git -C "$R55_STAGE/replay" diff --check
        git -C "$R55_STAGE/replay" apply --reverse --check "$patch"
        python3 -B - <<'PY_R55D3_REPLAY'
        import pathlib,subprocess,hashlib,json,sys
        stage=pathlib.Path('/tmp/veux-r55d3');repo=pathlib.Path('kernel');replay=stage/'replay';out=stage/'out'
        sys.path.insert(0,str(stage/'scripts'))
        import r55d3_maps_redirect as port
        def cmd(*argv):return subprocess.run(argv,capture_output=True,check=True).stdout
        files=set(cmd('git','-C',str(replay),'diff','--name-only').decode().splitlines())
        assert files==port.EXPECTED,('SCOPE_MISMATCH',sorted(files^port.EXPECTED))
        for f in sorted(files):
            assert hashlib.sha256((repo/f).read_bytes()).digest()==hashlib.sha256((replay/f).read_bytes()).digest(),f
        assert cmd('git','-C',str(replay),'diff','--binary','--no-ext-diff')==(out/port.TOTAL_NAME).read_bytes(),'DIFF_BYTES_NOT_IDENTICAL'
        r=json.loads((out/port.RESULT_NAME).read_text('utf-8'))
        r['source_replay_verified']=True
        (out/port.RESULT_NAME).write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
        print('R55D3_REAL_INDEPENDENT_17_FILE_BYTE_IDENTICAL_REPLAY=PASS')
        PY_R55D3_REPLAY
    - name: Final 17-file source SHA256 scope and NOFLASH gate
      run: |
        set -euo pipefail
        cp "$R55_STAGE/R55D3_ACTIONLINT.log" "$R55_STAGE/R55D3_SHELLCHECK.log" \
           "$R55_STAGE/R55D3_TESTS.log" "$R55_STAGE/R55D3_REAL_SOURCE.log" "$R55_STAGE/out/"
        python3 -B - <<'PY_R55D3_FINAL'
        import pathlib,json,hashlib
        out=pathlib.Path('/tmp/veux-r55d3/out')
        r=json.loads((out/'R55D3_RESULT.json').read_text('utf-8'))
        assert r['source_replay_verified'] is True and r['files_total']==17
        assert r['task_mmu_maps_open_redirect_staged'] is True
        for key in ('kernel_compiled','full_susfs_port','baka_su_uapi6_integrated',
                    'nomount_v22_integrated','device_tested','brene_changed',
                    'vendor_changed','boot_ready','flash_allowed','user_repo_modified',
                    'task_mmu_pagemap_staged'):
            assert r[key] is False,key
        assert len([p for p in out.iterdir() if p.is_file()])==8
        (out/'SHA256SUMS.txt').write_text(''.join(
            hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n'
            for p in sorted(out.iterdir()) if p.is_file()))
        print('R55D3_FINAL_SCOPE_SHA256_NOFLASH=PASS')
        PY_R55D3_FINAL
        (cd "$R55_STAGE/out" && sha256sum -c SHA256SUMS.txt)
        test -z "$(git -C project status --porcelain --untracked-files=all)"
        echo 'R55D3_USER_REPO_UNCHANGED; NO_KERNEL_BUILD; NO_FLASH'
    - name: Upload source patches and audit reports only
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: VEUX-R55D3-TASK-MMU-MAPS-REDIRECT-17FILES-NOFLASH-${{ github.run_id }}
        path: /tmp/veux-r55d3/out/
        retention-days: 14
        if-no-files-found: error
