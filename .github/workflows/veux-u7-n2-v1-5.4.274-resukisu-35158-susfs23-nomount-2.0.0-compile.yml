name: VEUX U7-N2 v1 5.4.274 ReSukiSU 35158 + SUSFS 2.3 + NoMount 2.0.0 Compile

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: veux-u7-n2-v1-274-nomount-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: Chrizz100/veux-nongki-universal-kernel
  O51_AUTHORITY: .github/workflows/veux-u6-o51-v3-resukisu-35158-repair-274-293-complete-all-six.yml
  O51_AUTHORITY_BLOB: 6413bd99fa38a5aa030403bb60a5935980dca32d
  RESUKISU_COMMIT: 6d18926ae6eeb571a04c1ce7552c324d606fa9d8
  RESUKISU_VERSION: '35158'
  RESUKISU_UAPI: '4'
  SUSFS_COMMIT: 04a9d713106191ba98be680bd7ad9547ab1de964
  SUSFS_VERSION: v2.3.0
  NOMOUNT_REPO: https://github.com/maxsteeel/NoMount.git
  NOMOUNT_COMMIT: b8d268353b4e7ecc53c67d1816a626b7d6579201
  NOMOUNT_TAG: v2.0.0

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout exact project state
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install controller dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-yaml git ca-certificates
          python3 - <<'PY'
          import yaml
          print('PYYAML_IMPORT=PASS')
          PY

      - name: Authenticate O51 v3 authority and derive N2 replayer
        shell: bash
        run: |
          set -euo pipefail
          test -f "$O51_AUTHORITY"
          actual="$(git hash-object "$O51_AUTHORITY")"
          echo "O51_AUTHORITY_BLOB_ACTUAL=$actual"
          test "$actual" = "$O51_AUTHORITY_BLOB"

          python3 - "$O51_AUTHORITY" "$RUNNER_TEMP/n2_replay.py" <<'PY'
          from pathlib import Path
          import sys, yaml
          src=Path(sys.argv[1]); out=Path(sys.argv[2])
          doc=yaml.safe_load(src.read_text())
          steps=next(iter(doc['jobs'].values()))['steps']
          step=next(s for s in steps if s.get('name')=='Write and self-test fail-closed authority replayer')
          run=step['run']
          start="cat > \"$RUNNER_TEMP/o51_replay.py\" <<'PY'\n"
          a=run.index(start)+len(start)
          b=run.find('\n          PY\n',a)
          if b < 0:
              b=run.index('\nPY\n',a)
          code=run[a:b]
          # YAML block indentation is already removed by parser; heredoc body still has 10 spaces.
          lines=code.splitlines()
          if lines and all((not x.strip()) or x.startswith('          ') for x in lines):
              code='\n'.join(x[10:] if x.startswith('          ') else x for x in lines)+'\n'

          marker='          def patch_293_integrator(workspace: Path, doc: dict[str, Any]) -> str:\n'
          if marker not in code:
              marker='def patch_293_integrator(workspace: Path, doc: dict[str, Any]) -> str:\n'
          inject=r'''def adapt_274_nomount(job: dict[str, Any]) -> None:
              steps = job.get("steps") or []
              compile_name = "Compile P14R1 and enforce P14 warning/DTB regression gates"
              compile_idx = next((i for i,s in enumerate(steps) if s.get("name") == compile_name), None)
              if compile_idx is None:
                  die("5.4.274 compile step not found for NoMount injection")

              integration = {
                  "name": "N2 integrate pinned NoMount 2.0.0",
                  "shell": "bash",
                  "run": r"""set -euo pipefail
          nm="$RUNNER_TEMP/nomount-v2.0.0"
          rm -rf "$nm"
          git init -q "$nm"
          git -C "$nm" remote add origin "${NOMOUNT_REPO}"
          git -C "$nm" fetch -q --depth=1 origin "${NOMOUNT_COMMIT}"
          git -C "$nm" checkout -q --detach FETCH_HEAD
          test "$(git -C "$nm" rev-parse HEAD)" = "${NOMOUNT_COMMIT}"

          test -d kernel/fs
          test -d kernel/arch/arm64/configs
          test ! -e kernel/fs/nomount
          test -d "$nm/kernel/src"

          mkdir -p kernel/fs/nomount
          cp -a "$nm/kernel/src/." kernel/fs/nomount/
          grep -Fqx 'source "fs/nomount/Kconfig"' kernel/fs/Kconfig || printf '\nsource "fs/nomount/Kconfig"\n' >> kernel/fs/Kconfig
          grep -Fqx 'obj-$(CONFIG_NOMOUNT) += nomount/' kernel/fs/Makefile || printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> kernel/fs/Makefile

          defconfig=kernel/arch/arm64/configs/veux_defconfig
          if grep -Eq '^# CONFIG_NOMOUNT is not set$|^CONFIG_NOMOUNT=' "$defconfig"; then
            sed -i -E 's/^# CONFIG_NOMOUNT is not set$|^CONFIG_NOMOUNT=.*/CONFIG_NOMOUNT=y/' "$defconfig"
          else
            printf '\nCONFIG_NOMOUNT=y\n' >> "$defconfig"
          fi

          grep -Fxq 'CONFIG_NOMOUNT=y' "$defconfig"
          grep -Fxq 'CONFIG_KEYS=y' "$defconfig"
          grep -Fxq 'CONFIG_KSU=y' "$defconfig"
          grep -Fxq 'CONFIG_KSU_SUSFS=y' "$defconfig"
          grep -Fxq 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' "$defconfig"

          test -f kernel/fs/nomount/Kconfig
          test -f kernel/fs/nomount/Makefile
          test -f kernel/fs/nomount/nomount.c
          test -f kernel/fs/nomount/nomount.h
          grep -Fq 'register_key_type(&nm_key_type)' kernel/fs/nomount/nomount.c
          grep -Fq 'LINUX_VERSION_CODE < KERNEL_VERSION(5, 12, 0)' kernel/fs/nomount/nomount.h

          # P13/P14 integration files must remain byte-identical across the NoMount step.
          sha256sum kernel/fs/exec.c kernel/include/linux/ksu_hook_contract.h kernel/fs/susfs.c > "$RUNNER_TEMP/n2-frozen-after.sha256"

          # Fail closed: only the four intended NoMount integration areas may be new/edited.
          python3 - <<'PY2'
          from pathlib import Path
          import subprocess
          root=Path('kernel')
          p=subprocess.run(['git','-C',str(root),'status','--porcelain','--untracked-files=all'],text=True,stdout=subprocess.PIPE,check=True)
          allowed_exact={'fs/exec.c','include/linux/ksu_hook_contract.h','fs/Kconfig','fs/Makefile','arch/arm64/configs/veux_defconfig'}
          bad=[]
          seen_nomount=False
          for line in p.stdout.splitlines():
              path=line[3:]
              if path.startswith('fs/nomount/'):
                  seen_nomount=True; continue
              if path in allowed_exact: continue
              bad.append(line)
          if bad:
              raise SystemExit('unexpected N2 source delta: '+repr(bad))
          if not seen_nomount:
              raise SystemExit('NoMount source not visible in git status')
          print('N2_SOURCE_DELTA_WHITELIST=PASS')
          PY2

          echo 'NOMOUNT_SOURCE_INTEGRATION=PASS'
          """
              }

              # Add the integration immediately before the proven compile step.
              steps.insert(compile_idx, integration)
              compile_idx += 1
              crun = str(steps[compile_idx]["run"])
              needle="grep -Fxq 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' \"$OUT_DIR/.config\""
              if crun.count(needle) != 1:
                  die("NoMount config-gate insertion preimage mismatch")
              crun=crun.replace(needle, needle+"\n          grep -Fxq 'CONFIG_NOMOUNT=y' \"$OUT_DIR/.config\"",1)
              steps[compile_idx]["run"] = crun

              verify = {
                  "name": "N2 verify NoMount compile result",
                  "shell": "bash",
                  "run": r"""set -euo pipefail
          test -s "$OUT_DIR/arch/arm64/boot/Image"
          test -s "$OUT_DIR/fs/nomount/nomount.o"
          grep -Fxq 'CONFIG_NOMOUNT=y' "$OUT_DIR/.config"
          grep -Fxq 'CONFIG_KEYS=y' "$OUT_DIR/.config"
          grep -Fxq 'CONFIG_KSU=y' "$OUT_DIR/.config"
          grep -Fxq 'CONFIG_KSU_SUSFS=y' "$OUT_DIR/.config"
          grep -Fxq 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' "$OUT_DIR/.config"
          test "$(make -s -C kernel kernelversion)" = '5.4.274'
          {
           echo 'NOMOUNT_COMPILE_OBJECT=PASS'
           echo 'CONFIG_NOMOUNT=YES'
           echo 'KERNEL_VERSION=5.4.274'
           echo 'COMPILE_PASS=YES'
           echo 'PACKAGE_PASS=NO'
           echo 'STATIC_BOOT_PATH_PASS=NO'
           echo 'DEVICE_PASS=NO'
          } | tee "$AUDIT_DIR/11-nomount-compile-result.txt"
          """
              }
              # N2 is compile-only. Drop the old P14R1 packaging/final-gate steps.
              job["steps"] = steps[:compile_idx+1] + [verify]

          '''
          if marker not in code:
              raise SystemExit('patch_293 marker missing')
          code=code.replace(marker,inject+marker,1)
          old='''              if kernel == "5.4.274":\n                  adapt_274_manager_only_target(job)\n'''
          new='''              if kernel == "5.4.274":\n                  adapt_274_manager_only_target(job)\n                  adapt_274_nomount(job)\n'''
          if code.count(old)!=1:
              raise SystemExit('274 adaptation call preimage mismatch')
          code=code.replace(old,new,1)
          out.write_text(code)
          compile(code,str(out),'exec')
          print('N2_REPLAYER_DERIVATION=PASS')
          PY

          python3 -m py_compile "$RUNNER_TEMP/n2_replay.py"
          python3 "$RUNNER_TEMP/n2_replay.py" --selftest

      - name: Reconstruct 5.4.274 authority, integrate NoMount and compile
        id: n2
        continue-on-error: true
        shell: bash
        env:
          NOMOUNT_REPO: ${{ env.NOMOUNT_REPO }}
          NOMOUNT_COMMIT: ${{ env.NOMOUNT_COMMIT }}
        run: |
          set -euo pipefail
          agg="$GITHUB_WORKSPACE/n2-aggregate"
          state="$RUNNER_TEMP/n2-state"
          rm -rf "$agg" "$state"
          mkdir -p "$agg" "$state"
          python3 "$RUNNER_TEMP/n2_replay.py" \
            --kernel 5.4.274 \
            --project-root "$GITHUB_WORKSPACE" \
            --aggregate "$agg" \
            --state-root "$state" \
            --sha "$GITHUB_SHA"

      - name: Finalize N2 evidence
        if: always()
        shell: bash
        env:
          N2_OUTCOME: ${{ steps.n2.outcome }}
        run: |
          set -euo pipefail
          agg="$GITHUB_WORKSPACE/n2-aggregate"
          out="$agg/5.4.274"
          mkdir -p "$out"
          status="$out/BUILD-STATUS.txt"
          image="$out/Image"
          result="$agg/FINAL-RESULT.txt"

          pass=1
          [ "$N2_OUTCOME" = success ] || pass=0
          [ -s "$status" ] || pass=0
          [ -s "$image" ] || pass=0
          if [ "$pass" = 1 ]; then
            grep -Fxq 'COMPILE_PASS=YES' "$status" || pass=0
            grep -Fxq "RESUKISU_COMMIT=$RESUKISU_COMMIT" "$status" || pass=0
            grep -Fxq "RESUKISU_VERSION=$RESUKISU_VERSION" "$status" || pass=0
            grep -Fxq 'UAPI=4' "$status" || pass=0
            grep -Fxq 'SUSFS_VERSION=v2.3.0' "$status" || pass=0
            grep -Fxq "SUSFS_COMMIT=$SUSFS_COMMIT" "$status" || pass=0
            grep -Fxq 'MODULE_LOAD_FILTER=EXCLUDED' "$status" || pass=0
            test "$(sha256sum "$image" | awk '{print $1}')" = "$(sed -n 's/^IMAGE_SHA256=//p' "$status")" || pass=0
          fi

          {
            echo "N2_STEP_OUTCOME=$N2_OUTCOME"
            echo 'KERNEL=5.4.274'
            echo "RESUKISU_COMMIT=$RESUKISU_COMMIT"
            echo "RESUKISU_VERSION=$RESUKISU_VERSION"
            echo "UAPI=$RESUKISU_UAPI"
            echo "SUSFS_COMMIT=$SUSFS_COMMIT"
            echo "SUSFS_VERSION=$SUSFS_VERSION"
            echo "NOMOUNT_COMMIT=$NOMOUNT_COMMIT"
            echo "NOMOUNT_TAG=$NOMOUNT_TAG"
            echo 'MODULE_LOAD_FILTER=EXCLUDED'
            if [ "$pass" = 1 ]; then
              echo 'VEUX_U7_N2_NOMOUNT_COMPILE=PASS'
              echo 'COMPILE_PASS=YES'
            else
              echo 'VEUX_U7_N2_NOMOUNT_COMPILE=FAIL'
              echo 'COMPILE_PASS=NO'
            fi
            echo 'PACKAGE_PASS=NO'
            echo 'STATIC_BOOT_PATH_PASS=NO'
            echo 'DEVICE_PASS=NO'
          } > "$result"

          (cd "$agg" && find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt)

      - name: Upload N2 compile evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VEUX-U7-N2V1-5.4.274-ReSukiSU-35158-NoMount-2.0.0-COMPILE-${{ github.run_id }}
          path: n2-aggregate/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Final real N2 GREEN gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          agg="$GITHUB_WORKSPACE/n2-aggregate"
          grep -Fxq 'VEUX_U7_N2_NOMOUNT_COMPILE=PASS' "$agg/FINAL-RESULT.txt"
          grep -Fxq 'COMPILE_PASS=YES' "$agg/FINAL-RESULT.txt"
          grep -Fxq 'PACKAGE_PASS=NO' "$agg/FINAL-RESULT.txt"
          grep -Fxq 'STATIC_BOOT_PATH_PASS=NO' "$agg/FINAL-RESULT.txt"
          grep -Fxq 'DEVICE_PASS=NO' "$agg/FINAL-RESULT.txt"
          (cd "$agg" && sha256sum -c SHA256SUMS.txt)
          echo 'N2_REAL_GREEN_GATE=PASS'
