        payload='#!/usr/bin/env python3\n"""Build an isolated IKCONFIG correction on cumulative Diag08 and pinned sources."""\nimport argparse\nimport json\nimport os\nfrom pathlib import Path\nimport shutil\nimport sys\nimport veux_update_engine as e\nimport veux_release as r\nimport veux_release_device as d\nimport veux_device_fixes as f\nimport config_audit as audit\n\nKERNEL = \'5.4.274\'\nFOLDER = \'common/diagnostics/config-5.4.274-diag09\'\nPINS = {\'common/scripts/veux_update_engine.py\': \'4f9ed7edfd19c802850039c654a5331f653d6fe07460c4680735534808b58b8d\', \'common/scripts/veux_release.py\': \'d8ab6d1724d25bc77b65e201eaac34d0f35bd0ac70b59b4eb822faa377c2a258\', \'common/scripts/veux_release_device.py\': \'6b0bb0c8815c2544461f42af621b523162fe674821561b5c5c7e09315ac67926\', \'common/scripts/veux_source_transport.py\': \'238a1d3c3c4b49b99b91c468942af28cad8f67401cdba8ea704b5d9a898fc3e7\', \'common/diagnostics/config-5.4.274-diag09/manifest.json\': \'5b9c1a89d8414f7a4f0038a1677c650421bd4ed3ba634a8158bf478a7eea530c\', \'common/diagnostics/config-5.4.274-diag09/embed-real-config.patch\': \'e59ea6e82044671f52b9a3df310cbb8b0919d337aafa4cbe080881e7022e3598\', \'common/diagnostics/config-5.4.274-diag09/baseline-evidence.json\': \'cde1f9c73d28425b26d95e53140413dac148f9440ce7c81278eb36add0a63602\', \'common/diagnostics/config-5.4.274-diag09/config_audit.py\': \'961e6b78be6ba467e0fb832c292a389973c100c9da10a7fe7e50a08a0a4617b3\', \'common/diagnostics/config-5.4.274-diag09/test_config_audit.py\': \'ef0624793aac7e5939bc4ef8493e55745f6812bb3cadcb227c3cbd38d5785636\', \'common/diagnostics/config-5.4.274-diag09/test_pipeline.py\': \'a7693a3e5bcb0fbf089102e2f23b35d4e495570efdf2bb3961811f91023d6ba3\', \'common/diagnostics/config-5.4.274-diag09/source/arch/arm64/configs/stock_defconfig\': \'722bcc5a40b5998f147b7e40712fb230be3f8549a593b9c538763324987469de\', \'common/diagnostics/config-5.4.274-diag09/source/arch/arm64/configs/veux_defconfig\': \'77906c4876f1fff5fd65411757be85a99c6e