# Save as: .github/workflows/veux-config-diag09-5.4.274.yml
# Single-kernel diagnostic, preserving all regular Diag08 driver patches.
# Corrects one IKCONFIG dependency; audits real build options without enabling CFI.
# No upstream update, promotion, permanent diagnostic code or device PASS claim.
name: VEUX 5.4.274 Config Diagnostic 09 - Real IKCONFIG and CFI audit
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: veux-config-diag09-5.4.274
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  diagnostic:
    name: Build cumulative Diag08 with real embedded configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - name: Checkout exact project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 1
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Install build dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends bc binutils bison build-essential ca-certificates curl dwarves file flex git jq libelf-dev libncurses-dev libssl-dev perl python3 python3-venv python3-yaml rsync unzip zip xz-utils zstd
        python3 -m venv "$RUNNER_TEMP/veux-python"
        "$RUNNER_TEMP/veux-python/bin/python" -m pip install ruamel.yaml==0.19.1 PyYAML==6.0.3
    - name: Verify regular release regression tests
      shell: bash
      run: |
        set -euo pipefail
        for test in test_veux_update_engine.py test_veux_release.py test_veux_device_fixes.py test_veux_source_transport.py; do
          "$RUNNER_TEMP/veux-python/bin/python" "common/scripts/$test"
        done
    - name: Prepare isolated configuration correction and run regression tests
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/veux-diag09-reports"
        exec > >(tee "$RUNNER_TEMP/veux-diag09-reports/preparation.log") 2>&1
        git clone --quiet --no-hardlinks . "$RUNNER_TEMP/veux-diag09-project"
        cd "$RUNNER_TEMP/veux-diag09-project"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        "$RUNNER_TEMP/veux-python/bin/python" - <<'PY_DIAG09'
        from pathlib import Path
        import hashlib
        repo=Path.cwd()
        def require(ok,message):
            if not ok: raise SystemExit('BLOCKED: '+message)
        def digest(path):
            require(path.is_file() and not path.is_symlink(),'missing or linked input: '+str(path))
            return hashlib.sha256(path.read_bytes()).hexdigest()
        pins={'common/scripts/veux_update_engine.py': '4f9ed7edfd19c802850039c654a5331f653d6fe07460c4680735534808b58b8d', 'common/scripts/veux_release.py': 'd8ab6d1724d25bc77b65e201eaac34d0f35bd0ac70b59b4eb822faa377c2a258', 'common/scripts/veux_release_device.py': '6b0bb0c8815c2544461f42af621b523162fe674821561b5c5c7e09315ac67926', 'common/scripts/veux_source_transport.py': '238a1d3c3c4b49b99b91c468942af28cad8f67401cdba8ea704b5d9a898fc3e7'}
        baselines={'4b8d6ac79448065bdeb27b778d0f70b85686b3b5d75917ee510e74a1a3d87e4e': {'id': 'charger-diag08', 'path': 'common/device-fixes/5.4.274/charger-diag08/manifest.json', 'manifest_sha256': 'efafa9d4436cdd0649de051eb364037763c8681b0aea76e28bae08227cec2551'}}
        for name,expected in pins.items():
            require(digest(repo/name)==expected,'baseline drift: '+name)
        baseline=baselines.get(digest(repo/'common/scripts/veux_device_fixes.py'))
        require(baseline is not None,'regular cumulative Diag08 required')
        require(digest(repo/baseline['path'])==baseline['manifest_sha256'],'regular manifest drift')
        folder=repo/'common/diagnostics/config-5.4.274-diag09'
        folder.mkdir(parents=True,exist_ok=False)
        payload='{\n  "id": "ConfigDiag09",\n  "source_commit": "b2b7a3bbc36d120ee523ebc8d68e0f13a97df632",\n  "path": "kernel/Makefile",\n  "before_sha256": "f27b67d514325559eade0530c2bb3265ecd25ece0c3e3fedd89e56b3507d2744",\n  "after_sha256": "49921ac5eee19f52c1623963951a7ac0fceb8297f4736aff3cad7641672c032f",\n  "purpose": "Embed the actual KCONFIG_CONFIG; do not change config options",\n  "regular_patchset": "charger-diag08"\n}\n'
        require(hashlib.sha256(payload.encode()).hexdigest()=='5b9c1a89d8414f7a4f0038a1677c650421bd4ed3ba634a8158bf478a7eea530c','payload drift: manifest.json')
        path=folder/'manifest.json'
        path.parent.mkdir(parents=True,exist_ok=True)
        path.write_text(payload)
        payload='--- a/kernel/Makefile\n+++ b/kernel/Makefile\n@@ -128,7 +128,7 @@\n $(obj)/configs.o: $(obj)/config_data.gz\n \n targets += config_data config_data.gz\n-$(obj)/config_data.gz: arch/arm64/configs/stock_defconfig FORCE\n+$(obj)/config_data.gz: $(KCONFIG_CONFIG) FORCE\n \t$(call if_changed,gzip)\n \n filechk_cat = cat $<\n'
        require(hashlib.sha256(payload.encode()).hexdigest()=='e59ea6e82044671f52b9a3df310cbb8b0919d337aafa4cbe080881e7022e3598','payload drift: embed-real-config.patch')
        path=folder/'embed-real-config.patch'
        path.parent.mkdir(parents=True,exist_ok=True)
        path.write_text(payload)
        payload='{\n  "diag08_image_sha256": "6b903f52b8139bf8a6f1c033581c4a6b0a93e6674b2e9f4be3453499f85d0603",\n  "embedded_config_sha256": "722bcc5a40b5998f147b7e40712fb230be3f8549a593b9c538763324987469de",\n  "stock_defconfig_sha256": "722bcc5a40b5998f147b7e40712fb230be3f8549a593b9c538763324987469de",\n  "embedded_equals_stock_defconfig": true,\n  "makefile_gitblob": "9a579d108574c26c24fa75aaa5a6b1ff0000a038"\n}\n'
        require(hashlib.sha256(payload.encode()).hexdigest()=='cde1f9c73d28425b26d95e53140413dac148f9440ce7c81278eb36add0a63602','payload drift: baseline-evidence.json')
        path=folder/'baseline-evidence.json'
        path.parent.mkdir(parents=True,exist_ok=True)
        path.write_text(payload)
        payload='#!/usr/bin/env python3\n"""Correct IKCONFIG provenance and audit it without changing Kconfig options."""\nfrom contextlib import contextmanager\nimport difflib\nimport gzip\nimport hashlib\nimport json\nfrom pathlib import Path\nimport re\nimport shutil\nimport zlib\nimport veux_update_engine as e\n\nHERE = Path(__file__).resolve().parent\nKEYS = (\'IKCONFIG\', \'IKCONFIG_PROC\', \'LTO\', \'LTO_CLANG\', \'THINLTO\',\n        \'CFI_CLANG\', \'CFI_CLANG_SHADOW\', \'CFI_PERMISSIVE\')\n\n\ndef sha(data):\n    return hashlib.sha256(data).hexdigest()\n\n\ndef options(data):\n    result = {}\n    for line in data.decode().splitlines():\n        if line.startswith(\'CONFIG_\') and \'=\' in line:\n            key, value = line.split(\'=\', 1)\n        elif line.startswith(\'# CONFIG_\') and line.endswith(\' is not set\'):\n            key, value = line[2:-11], \'n\'\n        else:\n            continue\n        e.require(key not in result, \'duplicate config option: \' + key)\n        result[key] = value\n    return result\n\n\ndef extract(image):\n    """Require exactly one complete, CRC-checked IKCONFIG gzip member."""\n    matches = []\n    pos = 0\n    while True:\n        pos = image.find(b\'IKCFG_ST\', pos)\n        if pos < 0:\n            break\n        pos += 8\n        if image[pos:pos+3] != b\'\\x1f\\x8b\\x08\':\n            continue\n        try:\n            stream = zlib.decompressobj(31)\n            data = stream.decompress(image[pos:], 2*1024*1024)\n            if stream.eof and stream.unused_data.startswith(b\'IKCFG_ED\'):\n                matches.append(data)\n        except zlib.error:\n            continue\n    e.require(len(matches) == 1, \'require one valid embedded kernel config\')\n    return matches[0]\n\n\ndef apply(src):\n    manifest = json.loads((HERE/\'manifest.json\').read_text())\n    path = e.inside(src/manifest[\'path\'], src)\n    e.require(path.is_file() and not path.is_symlink(), \'invalid kernel Makefile\')\n    before = path.read_bytes()\n    e.require(sha(before) == manifest[\'before_sha256\'], \'kernel Makefile baseline drift\')\n    old = b\'$(obj)/config_data.gz: arch/arm64/configs/stock_defconfig FORCE\'\n    new = b\'$(obj)/config_data.gz: $(KCONFIG_CONFIG) FORCE\'\n    e.require(before.count(old) == 1, \'IKCONFIG rule changed\')\n    after = before.replace(old, new)\n    e.require(sha(after) == manifest[\'after_sha256\'], \'kernel Makefile postimage drift\')\n    path.write_bytes(after)\n    return manifest\n\n\ndef verify_build(src, out, image, expected_config, reports, manifest):\n    actual = (out/\'.config\').read_bytes()\n    e.require(actual == expected_config, \'configuration changed during compile\')\n    embedded = extract(image.read_bytes())\n    (reports/\'embedded.config\').write_bytes(embedded)\n    e.require(embedded == actual, \'Image embedded config differs from actual build config\')\n    compressed = gzip.decompress((out/\'kernel/config_data.gz\').read_bytes())\n    e.require(compressed == actual, \'config_data.gz differs from actual build config\')\n    e.require(e.digest(src/manifest[\'path\']) == manifest[\'after_sha256\'], \'IKCONFIG rule changed during compile\')\n    values = options(actual)\n    auto_data = (out/\'include/config/auto.conf\').read_bytes()\n    (reports/\'auto.conf\').write_bytes(auto_data)\n    auto = options(auto_data)\n    e.require(all(values.get(\'CONFIG_\'+k, \'n\') == auto.get(\'CONFIG_\'+k, \'n\') for k in KEYS),\n              \'generated build options disagree with .config\')\n    e.require(values.get(\'CONFIG_IKCONFIG\') == \'y\' and values.get(\'CONFIG_IKCONFIG_PROC\') == \'y\',\n              \'kernel config interface must remain enabled\')\n    commands = {}\n    # A normal core translation unit provides evidence independent of the\n    # embedded text. Do not infer runtime CFI protection from text markers.\n    for rel in (\'kernel/.fork.o.cmd\', \'kernel/.configs.o.cmd\', \'kernel/.cfi.o.cmd\'):\n        path = out/rel\n        if path.is_file():\n            text = path.read_text()\n            (reports/path.name.lstrip(\'.\')).write_text(text)\n            commands[rel] = {\'sha256\': e.digest(path),\n                \'cfi_flag\': bool(re.search(r\'-fsanitize=[^\\s;]*\\bcfi\\b\', text)),\n                \'lto_flag\': bool(re.search(r\'(?<!\\S)-flto(?:=\\S+)?(?:\\s|$)\', text))}\n    core = commands.get(\'kernel/.fork.o.cmd\')\n    e.require(core is not None, \'core compile command missing for CFI audit\')\n    configured_cfi = values.get(\'CONFIG_CFI_CLANG\', \'n\') == \'y\'\n    e.require(core[\'cfi_flag\'] == configured_cfi, \'CFI option and core compiler flag disagree\')\n    stock = (src/\'arch/arm64/configs/stock_defconfig\').read_bytes()\n    (reports/\'stock-to-actual.diff\').write_text(\'\'.join(difflib.unified_diff(\n        stock.decode().splitlines(True), actual.decode().splitlines(True),\n        fromfile=\'previously-embedded-stock_defconfig\', tofile=\'actual-build.config\')))\n    report = {\'id\': \'ConfigDiag09\', \'status\': \'PASS\',\n        \'actual_config_sha256\': sha(actual), \'embedded_config_sha256\': sha(embedded),\n        \'image_sha256\': e.digest(image), \'source_patch\': manifest,\n        \'configuration_unchanged_during_compile\': True,\n        \'options\': {k: values.get(\'CONFIG_\'+k, \'n\') for k in KEYS},\n        \'core_compile_commands\': commands,\n        \'cfi\': \'configured-and-core-instrumented\' if configured_cfi else \'disabled\',\n        \'cfi_runtime_test\': \'not-performed\', \'device\': False}\n    e.write_json(reports/\'CONFIG-AUDIT.json\', report)\n    print(\'CONFIG_DIAG09=PASS; embedded=actual; CFI=\'+report[\'cfi\'], flush=True)\n    return report\n\n\n@contextmanager\ndef compiler_audit(reports):\n    original_compile, original_run = e.compile_kernel, e.run\n    reports.mkdir(parents=True, exist_ok=False)\n\n    def compile_checked(label, state, targets, work, jobs):\n        e.require(label == \'5.4.274\', \'unreviewed config diagnostic lineage\')\n        src, out = Path(state[\'source\']), work/\'build\'\n        values = dict(v.split(\'=\', 1) for v in state[\'variables\'])\n        old_config = e.inside((src/values[\'O\']).resolve(), work)/\'.config\'\n        old_hash = e.digest(old_config)\n        manifest = apply(src)\n        e.require(e.digest(old_config) == old_hash, \'patch changed input configuration\')\n        e.write_json(reports/\'SOURCE-PATCH.json\', manifest)\n        snapshot = []\n\n        def observe(argv, *args, **kwargs):\n            if kwargs.get(\'log\') == work/\'compile.log\':\n                e.require(not snapshot, \'duplicate compile invocation\')\n                config = (out/\'.config\').read_bytes()\n                snapshot.append(config)\n                (reports/\'actual-build.config\').write_bytes(config)\n            return original_run(argv, *args, **kwargs)\n\n        try:\n            e.run = observe\n            image, result = original_compile(label, state, targets, work, jobs)\n            e.require(len(snapshot) == 1, \'actual build config was not captured\')\n            report = verify_build(src, out, image, snapshot[0], reports, manifest)\n            result[\'config_audit\'] = report\n            e.write_json(work/\'build-result.json\', result)\n            return image, result\n        finally:\n            e.run = original_run\n            # Preserve real options and partial evidence even on failed builds.\n            if (out/\'.config\').is_file():\n                shutil.copy2(out/\'.config\', reports/\'final-build.config\')\n\n    try:\n        e.compile_kernel = compile_checked\n        yield\n    finally:\n        e.compile_kernel, e.run = original_compile, original_run\n'
        require(hashlib.sha256(payload.encode()).hexdigest()=='961e6b78be6ba467e0fb832c292a389973c100c9da10a7fe7e50a08a0a4617b3','payload drift: config_audit.py')
        path=folder/'config_audit.py'
        path.parent.mkdir(parents=True,exist_ok=True)
        path.write_text(payload)
        payload='#!/usr/bin/env python3\n"""Exercise real pinned Kbuild gzip rules and fail-closed binary/config checks."""\nimport gzip\nimport json\nfrom pathlib import Path\nimport shutil\nimport subprocess\nimport tempfile\nimport unittest\nfrom unittest import mock\nimport config_audit as a\n\nSOURCE = Path(__file__).parent/\'source\'\nREAL = b\'CONFIG_IKCONFIG=y\\nCONFIG_IKCONFIG_PROC=y\\nCONFIG_LTO_CLANG=y\\n# CONFIG_CFI_CLANG is not set\\n\'\n\n\nclass ConfigTests(unittest.TestCase):\n    def setup_tree(self, root):\n        src, out = root/\'src\', root/\'out\'\n        shutil.copytree(SOURCE, src)\n        (out/\'kernel\').mkdir(parents=True)\n        (out/\'include/config\').mkdir(parents=True)\n        (out/\'.config\').write_bytes(REAL)\n        (out/\'include/config/auto.conf\').write_bytes(b\'CONFIG_IKCONFIG=y\\nCONFIG_IKCONFIG_PROC=y\\nCONFIG_LTO_CLANG=y\\n\')\n        (out/\'kernel/.fork.o.cmd\').write_text(\'cmd_kernel/fork.o := clang -flto=thin -c kernel/fork.c -o kernel/fork.o\\n\')\n        (out/\'Makefile\').write_text(f\'\'\'srctree := {src}\nobj := kernel\nKCONFIG_CONFIG ?= .config\nKGZIP := gzip\nPHONY += FORCE\nVPATH := {src}\n.DEFAULT_GOAL := kernel/config_data.gz\ninclude {src}/scripts/Kbuild.include\ninclude {src}/kernel/Makefile\ninclude {src}/scripts/Makefile.lib\n-include kernel/.config_data.gz.cmd\n.PHONY: FORCE\nFORCE:\n\'\'\')\n        return src, out\n\n    def make(self, out, *args, success=True):\n        p = subprocess.run([\'make\', \'--no-print-directory\', *args], cwd=out,\n                           text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)\n        if success:\n            self.assertEqual(p.returncode, 0, p.stdout)\n            return gzip.decompress((out/\'kernel/config_data.gz\').read_bytes())\n        self.assertNotEqual(p.returncode, 0, p.stdout)\n\n    def test_original_fault_and_corrected_actual_kbuild_out_of_tree(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            src, out = self.setup_tree(Path(tmp))\n            old = self.make(out)\n            self.assertEqual(old, (src/\'arch/arm64/configs/stock_defconfig\').read_bytes())\n            self.assertNotEqual(old, REAL)\n            a.apply(src)\n            self.assertEqual(self.make(out), REAL)\n            self.assertEqual((out/\'.config\').read_bytes(), REAL)\n            # The dependency follows subsequent configuration changes.\n            updated = REAL+b\'CONFIG_TEST_NEW=y\\n\'\n            (out/\'.config\').write_bytes(updated)\n            self.assertEqual(self.make(out), updated)\n\n    def test_custom_kconfig_path_and_missing_input(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            src, out = self.setup_tree(Path(tmp)); a.apply(src)\n            alternate = out/\'custom.config\'; alternate.write_bytes(REAL+b\'CONFIG_CUSTOM=y\\n\')\n            self.assertEqual(self.make(out, \'KCONFIG_CONFIG=\'+str(alternate)), alternate.read_bytes())\n            alternate.unlink()\n            self.make(out, \'KCONFIG_CONFIG=\'+str(alternate), success=False)\n\n    def test_patch_changes_one_line_and_rejects_unreviewed_source(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            src, out = self.setup_tree(Path(tmp))\n            before = {p.relative_to(src):p.read_bytes() for p in src.rglob(\'*\') if p.is_file()}\n            a.apply(src)\n            changed = [p for p, data in before.items() if (src/p).read_bytes() != data]\n            self.assertEqual(changed, [Path(\'kernel/Makefile\')])\n            old, new = before[changed[0]].splitlines(), (src/changed[0]).read_bytes().splitlines()\n            self.assertEqual(len(old), len(new))\n            self.assertEqual(sum(x != y for x,y in zip(old,new)), 1)\n            with self.assertRaisesRegex(a.e.Blocked, \'baseline drift\'):\n                a.apply(src)\n\n    def test_image_extraction_rejects_truncated_corrupt_duplicate_and_missing_data(self):\n        good = b\'prefixIKCFG_ST\'+gzip.compress(REAL)+b\'IKCFG_EDsuffix\'\n        self.assertEqual(a.extract(good), REAL)\n        for data in (b\'no config\', good[:-15], good+good,\n                     b\'IKCFG_ST\'+gzip.compress(REAL)[:-6]+b\'BADCRC\'+b\'IKCFG_ED\'):\n            with self.subTest(data=data[:15]), self.assertRaises(a.e.Blocked):\n                a.extract(data)\n\n    def audit_fixture(self, root):\n        src, out = self.setup_tree(root); manifest = a.apply(src); self.make(out)\n        image = out/\'Image\'\n        image.write_bytes(b\'IKCFG_ST\'+(out/\'kernel/config_data.gz\').read_bytes()+b\'IKCFG_ED\')\n        reports = root/\'reports\'; reports.mkdir()\n        return src, out, image, reports, manifest\n\n    def test_consistent_config_image_and_core_flags_pass(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            src,out,image,reports,manifest = self.audit_fixture(Path(tmp))\n            result = a.verify_build(src,out,image,REAL,reports,manifest)\n            self.assertEqual(result[\'cfi\'], \'disabled\')\n            self.assertEqual(result[\'actual_config_sha256\'], result[\'embedded_config_sha256\'])\n            self.assertEqual(result[\'options\'][\'CFI_CLANG\'], \'n\')\n            self.assertFalse(result[\'device\'])\n\n    def test_bad_config_image_auto_or_compiler_evidence_blocks(self):\n        for fault in (\'changed-config\',\'wrong-image\',\'wrong-gzip\',\'auto-conf\',\'cfi-flag\',\'missing-command\',\'makefile\'):\n            with self.subTest(fault=fault), tempfile.TemporaryDirectory() as tmp:\n                src,out,image,reports,manifest = self.audit_fixture(Path(tmp))\n                if fault == \'changed-config\': (out/\'.config\').write_bytes(REAL+b\'CONFIG_NEW=y\\n\')\n                if fault == \'wrong-image\': image.write_bytes(b\'IKCFG_ST\'+gzip.compress(b\'wrong\')+b\'IKCFG_ED\')\n                if fault == \'wrong-gzip\': (out/\'kernel/config_data.gz\').write_bytes(gzip.compress(b\'wrong\'))\n                if fault == \'auto-conf\': (out/\'include/config/auto.conf\').write_text(\'CONFIG_CFI_CLANG=y\\n\')\n                if fault == \'cfi-flag\': (out/\'kernel/.fork.o.cmd\').write_text(\'clang -fsanitize=cfi -c fork.c\')\n                if fault == \'missing-command\': (out/\'kernel/.fork.o.cmd\').unlink()\n                if fault == \'makefile\': (src/\'kernel/Makefile\').write_text(\'wrong\')\n                with self.assertRaises((a.e.Blocked, OSError)):\n                    a.verify_build(src,out,image,REAL,reports,manifest)\n\n    def test_compile_wrapper_captures_real_config_and_restores_engine(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            root = Path(tmp); src,out = self.setup_tree(root)\n            work=root; state={\'source\':str(src),\'variables\':[\'O=\'+str(out)]}\n            reports=root/\'reports\'; orig_run=a.e.run\n            def compile_fixture(label,state,targets,work,jobs):\n                build=work/\'build\'; shutil.copytree(out,build)\n                a.e.run([\'true\'],log=work/\'compile.log\')\n                self.make(build)\n                image=build/\'Image\'; image.write_bytes(b\'IKCFG_ST\'+(build/\'kernel/config_data.gz\').read_bytes()+b\'IKCFG_ED\')\n                return image, {}\n            with mock.patch.object(a.e, \'compile_kernel\', side_effect=compile_fixture) as original:\n                with a.compiler_audit(reports):\n                    _,result=a.e.compile_kernel(\'5.4.274\',state,{},work,1)\n                    self.assertEqual(result[\'config_audit\'][\'status\'],\'PASS\')\n                self.assertIs(a.e.compile_kernel,original)\n            self.assertIs(a.e.run,orig_run)\n            self.assertEqual((reports/\'actual-build.config\').read_bytes(),REAL)\n\n    def test_compile_failure_preserves_config_and_restores_engine(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            root=Path(tmp);src,out=self.setup_tree(root)\n            original_run=a.e.run\n            def fail(label,state,targets,work,jobs):\n                shutil.copytree(out,root/\'build\')\n                a.e.run([\'false\'],log=work/\'compile.log\')\n            with mock.patch.object(a.e,\'compile_kernel\',side_effect=fail) as original:\n                with self.assertRaises(a.e.Blocked):\n                    with a.compiler_audit(root/\'reports\'):\n                        a.e.compile_kernel(\'5.4.274\',{\'source\':str(src),\'variables\':[\'O=\'+str(out)]},{},root,1)\n                self.assertIs(a.e.compile_kernel,original)\n            self.assertIs(a.e.run,original_run)\n            self.assertEqual((root/\'reports/final-build.config\').read_bytes(),REAL)\n\n\nif __name__ == \'__main__\':\n    unittest.main()\n'
        require(hashlib.sha256(payload.encode()).hexdigest()=='ef0624793aac7e5939bc4ef8493e55745f6812bb3cadcb227c3cbd38d5785636','payload drift: test_config_audit.py')
        path=folder/'test_config_audit.py'
