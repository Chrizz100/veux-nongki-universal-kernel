      - name: Actionlint 1.7.12, strict YAML parser and actual six Bash blocks ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          unzip -p VEUX_R39_R2_MEMORY_ABI_MAIN.zip tools/actionlint > "$R49_STAGE/actionlint"
          chmod 0755 "$R49_STAGE/actionlint"
          "$R49_STAGE/actionlint" -version | grep -Fx '1.7.12'
          "$R49_STAGE/actionlint" -color=false -shellcheck='' .github/workflows/VEUX_R49_EARLY_RMNET_RECOVERY_PREFLIGHT_GATE.yml | tee "$R49_STAGE/out/R49_ACTIONLINT.log"
          python3 -B - "$R49_STAGE" <<'PY_R49_LINT'
          import hashlib,pathlib,subprocess,sys,yaml
          root=pathlib.Path(sys.argv[1]);file=pathlib.Path('.github/workflows/VEUX_R49_EARLY_RMNET_RECOVERY_PREFLIGHT_GATE.yml')
          class Strict(yaml.SafeLoader):pass
          def unique(loader,node):
              out={}
              for k,v in node.value:
                  key=loader.construct_object(k)
                  if key in out:raise ValueError('DUPLICATE_YAML_KEY:'+str(key))
                  out[key]=loader.construct_object(v)
              return out
          Strict.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,unique)
          doc=yaml.load(file.read_text(),Loader=Strict)
          if list(doc['jobs'])!=['r49']:raise SystemExit('R49_WRONG_JOB_LIST')
          steps=doc['jobs']['r49']['steps']
          expected=[
          'Checkout pinned project evidence read-only',
          'Authenticate historical vendor_boot proof and materialize independent auditor',
          'Actionlint 1.7.12, strict YAML parser and actual six Bash blocks ShellCheck',
          'Verify original R48-R2 run and fetch exact SHA256-pinned GitHub artifact',
          'Run 34 genuine R30/R48 and adversarial regressions',
          'Evaluate early vendor loader constraints and recovery gates read-only',
          'Strict result guards, SHA256 manifest and no-flash enforcement',
          'Upload R49 public text results with fail-if-missing']
          if [x['name'] for x in steps]!=expected:raise SystemExit('R49_STEP_LIST_CHANGED')
          blocks=[x['run'] for x in steps if 'run' in x]
          if len(blocks)!=6:raise SystemExit('R49_BASH_BLOCK_COUNT_DRIFT')
          checks=[]
          for i,script in enumerate(blocks,1):
              for cmd in (['bash','-n','-'],['shellcheck','--shell=bash','--severity=warning','-']):
                  p=subprocess.run(cmd,input=script,text=True,capture_output=True)
                  if p.returncode:raise SystemExit('R49_BASH_OR_SHELLCHECK_FAIL:'+str(i)+':'+p.stdout+p.stderr)
              checks.append(str(i)+' bash-n=PASS shellcheck=PASS sha256='+hashlib.sha256(script.encode()).hexdigest())
          (root/'out/R49_BASH_SHELLCHECK.log').write_text('\n'.join(checks)+'\n')
          print('R49_STRICT_YAML_AND_ALL_SIX_SHELLCHECK_BASH_RUN_BLOCKS=PASS')
          PY_R49_LINT
      - name: Verify original R48-R2 run and fetch exact SHA256-pinned GitHub artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          api_get() {
            suffix="$1"
            output="$2"
            curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 120 \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/${suffix}" --output "$output"
            test -s "$output"
          }
          api_get 'actions/runs/40193017462' "$R49_STAGE/inputs/R48_RUN.json"
          api_get 'actions/artifacts/12599285054' "$R49_STAGE/inputs/R48_META.json"
          python3 -B - "$R49_STAGE/inputs" <<'PY_R49_META'
          import json,pathlib,sys
          folder=pathlib.Path(sys.argv[1]);run=json.loads((folder/'R48_RUN.json').read_text());art=json.loads((folder/'R48_META.json').read_text())
          if not (run.get('id')==40193017462 and run.get('head_sha')=='3f64fbb2aa6b924c142dbdcc80a2ba4b45df3285' and run.get('head_branch')=='main' and run.get('status')=='completed' and run.get('conclusion')=='success'):
              raise SystemExit('R49_R48_ORIGINAL_RUN_NOT_SUCCESS_OR_SHA_MISMATCH')
          if not (art.get('id')==12599285054 and art.get('name')=='VEUX-R48-LOADER-DECISION-40193017462' and art.get('expired') is False and art.get('digest')=='sha256:5c75f909a99ab584a715ded54d0ad9b7451d1c5d21fbb50aabe1caf91a70c0cc'):
              raise SystemExit('R49_R48_ARTIFACT_PIN_INVALID')
          print('R49_ORIGINAL_R48_SUCCESS_AND_SHA256_METADATA=PASS')
          PY_R49_META
          api_get 'actions/artifacts/12599285054/zip' "$R49_STAGE/inputs/R48_ORIGINAL.zip"
          printf '%s  %s\n' '5c75f909a99ab584a715ded54d0ad9b7451d1c5d21fbb50aabe1caf91a70c0cc' "$R49_STAGE/inputs/R48_ORIGINAL.zip" | sha256sum -c -
          echo 'R49_R48_OFFICIAL_ARTIFACT_DOWNLOADED_SHA256_PINNED=PASS' 
      - name: Run 34 genuine R30/R48 and adversarial regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$R49_STAGE/src"
          export R49_R39="$GITHUB_WORKSPACE/VEUX_R39_R2_MEMORY_ABI_MAIN.zip"
          export R49_R48="$R49_STAGE/inputs/R48_ORIGINAL.zip"
          python3 -B -W error::ResourceWarning -m unittest discover -s "$R49_STAGE/tests" -p 'test_r49_gate.py' -v 2>&1 | tee "$R49_STAGE/out/R49_TESTS.log"
          grep -F 'Ran 34 tests' "$R49_STAGE/out/R49_TESTS.log"
