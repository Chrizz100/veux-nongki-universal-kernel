      - name: Evaluate early vendor loader constraints and recovery gates read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$R49_STAGE/src/r49_gate.py" \
            --r39 "$GITHUB_WORKSPACE/VEUX_R39_R2_MEMORY_ABI_MAIN.zip" \
            --r48 "$R49_STAGE/inputs/R48_ORIGINAL.zip" \
            --out "$R49_STAGE/out" | tee "$R49_STAGE/out/R49_EXECUTION.log"
          cat "$R49_STAGE/out/R49_BERICHT_DE.txt" >> "$GITHUB_STEP_SUMMARY"
          echo 'R49_HISTORICAL_BOOT_PROVENANCE_AUDITED=PASS' 
      - name: Strict result guards, SHA256 manifest and no-flash enforcement
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - "$R49_STAGE/out" <<'PY_R49_FINAL'
          import hashlib,json,pathlib,sys
          out=pathlib.Path(sys.argv[1]);result=json.loads((out/'R49_RESULT.json').read_text())
          expected={'R49_ACTIONLINT.log','R49_BASH_SHELLCHECK.log','R49_TESTS.log','R49_EXECUTION.log','R49_RESULT.json','R49_BERICHT_DE.txt','R49_SICHERE_NAECHSTE_SCHRITTE.md'}
          files={p.name for p in out.iterdir() if p.is_file()}
          if files!=expected:raise SystemExit('R49_ARTIFACT_FILE_LIST_MISMATCH:'+str(files^expected))
          if result.get('schema')!='VEUX_R49_EARLY_LOADER_RECOVERY_READONLY_V1' or result.get('r48_source_run')!=40193017462:
              raise SystemExit('R49_RESULT_SCHEMA_OR_SOURCE')
          if result.get('vendor_boot_a_and_b_ramdisk_sha_identical_in_historical_capture') is not True or result.get('vendor_boot_ramdisk_rmnet_candidates_in_historical_capture')!=0:
              raise SystemExit('R49_HISTORICAL_VENDOR_BOOT_UNVERIFIED')
          for key in ('boot_ready','flash_allowed','backup_restore_tested','safe_early_vendor_loader_interception_implemented',
                      'safe_vendor_module_replacement_implemented','current_device_boot_partition_sha256_proven',
                      'october19_backup_file_physically_verified_this_run','host_fastboot_recovery_available_proven',
                      'device_tested_with_r44','private_r46_input_included','repo_or_device_modified'):
              if result.get(key) is not False:raise SystemExit('R49_UNSAFE_SUCCESS_FLAG:'+key)
          for p in out.iterdir():
              if p.suffix in ('.ko','.img','.dtb','.dtbo','.elf','.bin') or p.name in ('Image','vmlinux'):
                  raise SystemExit('R49_FLASH_OR_BINARY_OUTPUT_FORBIDDEN')
              content=p.read_text(encoding='utf8')
              for private in ('R46_DEVICE_REPORT.txt','/data/adb/veux-rmnet/','KERNEL_NOTES_SHA256='):
                  if private in content:raise SystemExit('R49_PRIVATE_DEVICE_EVIDENCE_LEAK')
          checks=[hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in sorted(out.iterdir()) if p.is_file()]
          (out/'SHA256SUMS.txt').write_text('\n'.join(checks)+'\n')
          print('R49_OUTPUT_SCOPE_SHA256_AND_FAIL_CLOSED_GATES=PASS; BOOT_READY=NO; FLASH_ALLOWED=NO')
          PY_R49_FINAL
          (cd "$R49_STAGE/out" && sha256sum -c SHA256SUMS.txt)
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'R49_NO_REPO_CHANGE_NO_DEVICE_CHANGE_NO_FLASH=PASS' 
