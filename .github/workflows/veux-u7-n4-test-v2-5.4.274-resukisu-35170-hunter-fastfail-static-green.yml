        grep -Fxq 'COMPILE_PASS=YES' "$result"
        grep -Fxq 'PACKAGE_PASS=YES' "$result"
        grep -Fxq 'STATIC_BOOT_PATH_PASS=NO' "$result"
        grep -Fxq 'DEVICE_PASS=NO' "$result"
        test -d "$dist"
        test -s "$dist/FINAL-RESULT.txt"
        test -s "$dist/AK3-RESULT.txt"
        test -s "$dist/SHA256SUMS.txt"
        test -s "$dist/STATIC-GREEN.txt"
        grep -Fxq 'STATIC_GREEN_PASS=YES' "$dist/STATIC-GREEN.txt"
        grep -Fxq 'AK3_IMAGE_ONLY=PASS' "$dist/AK3-RESULT.txt"
        grep -Fxq 'AK3_ACTIVE_SLOT_UPPERCASE_CONTRACT=PASS' "$dist/AK3-RESULT.txt"
        grep -Fxq 'U7_N4_LATENCY_FASTFAIL_PATCH=PASS' "$dist/12-u7n4-latency-fastfail.txt"
        (
          cd "$dist"
          sha256sum -c SHA256SUMS.txt
        )
        echo 'U7_N4_REAL_GREEN_GATE=PASS'
