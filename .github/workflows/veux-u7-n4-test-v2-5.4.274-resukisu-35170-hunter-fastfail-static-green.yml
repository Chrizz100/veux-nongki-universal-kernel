name: VEUX U7-N4 TEST v2 5.4.274 ReSukiSU 35170 Hunter latency fast-fail + STATIC GREEN
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - .github/workflows/veux-u7-n4-test-v2-5.4.274-resukisu-35170-hunter-fastfail-static-green.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: veux-u7-n4-hunter-fastfail-${{ github.ref }}
  cancel-in-progress: false
env:
  EXPECTED_REPOSITORY: Chrizz100/veux-nongki-universal-kernel
  SELF_WORKFLOW: .github/workflows/veux-u7-n4-test-v2-5.4.274-resukisu-35170-hunter-fastfail-static-green.yml
  U7N3_AUTHORITY: .github/workflows/veux-u7-n3-v4-5.4.274-resukisu-35170-susfs23-nomount-2.0.0-compile.yml
  U7N3_AUTHORITY_BLOB: d5accb592400412b025c6e67c473ed420c0d2494
  O51_AUTHORITY: .github/workflows/veux-u6-o51-v3-resukisu-35158-repair-274-293-complete-all-six.yml
  O51_AUTHORITY_BLOB: 6413bd99fa38a5aa030403bb60a5935980dca32d
  U7_AUTHORITY: .github/workflows/veux-u7-n2-v3-5.4.274-resukisu-35158-susfs23-nomount-2.0.0-compile.yml
  U7_AUTHORITY_BLOB: de2db0a53fb3d5458b48fe710882b6eb6ce780c7
  RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
  RESUKISU_BASE_COMMIT: 6d18926ae6eeb571a04c1ce7552c324d606fa9d8
  RESUKISU_BASE_VERSION: '35158'
  RESUKISU_COMMIT: 9be0f347f38e790c846915bd5f9c24b337f85c4e
  RESUKISU_VERSION: '35170'
  RESUKISU_UAPI: '4'
  RESUKISU_EXPECTED_BASE_DELTA_COMMITS: '12'
  RESUKISU_EXPECTED_P14_DELTA_COMMITS: '16'
  RESUKISU_MANAGER_TARGET_BLOB: 793469e587bfdb92a6b60c1126b14da560317340
  SUSFS_COMMIT: 04a9d713106191ba98be680bd7ad9547ab1de964
  SUSFS_VERSION: v2.3.0
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_MIRROR: https://github.com/ShirkNeko/susfs4ksu.git
  SUSFS_BRANCH: gki-android13-5.10
  NOMOUNT_REPO: https://github.com/maxsteeel/NoMount.git
  NOMOUNT_COMMIT: b8d268353b4e7ecc53c67d1816a626b7d6579201
  NOMOUNT_TAG: v2.0.0
  AK3_REPO: https://github.com/osm0sis/AnyKernel3.git
  AK3_COMMIT: af770f7b16cf8f8eb7c68614b2a693b3b361c90c
jobs:
  static-green:
    name: U7-N4 controller STATIC GREEN
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      status: ${{ steps.static.outputs.status }}
      workflow_sha256: ${{ steps.static.outputs.workflow_sha256 }}
      authority_blob: ${{ steps.static.outputs.authority_blob }}
      patch_selftest: ${{ steps.static.outputs.patch_selftest }}
    steps:
    - name: Checkout exact project state
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Static fail-closed workflow and patch self-test
      id: static
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
        test -f "$SELF_WORKFLOW"
        test -f "$U7N3_AUTHORITY"
        test -f "$O51_AUTHORITY"
        test -f "$U7_AUTHORITY"
        test "$(git hash-object "$U7N3_AUTHORITY")" = "$U7N3_AUTHORITY_BLOB"
        test "$(git hash-object "$O51_AUTHORITY")" = "$O51_AUTHORITY_BLOB"
        test "$(git hash-object "$U7_AUTHORITY")" = "$U7_AUTHORITY_BLOB"

        python3 - <<'PY'
        import yaml
        print('PYYAML_IMPORT=PASS')
        PY

        audit="$RUNNER_TEMP/u7n4-static-green.txt"
        : > "$audit"

        python3 - "$SELF_WORKFLOW" "$U7N3_AUTHORITY" "$audit" <<'PYSTATIC'
        from __future__ import annotations

        import base64
        import os
        from pathlib import Path
        import re
        import subprocess
        import sys
        import tempfile
        from typing import Any

        import yaml

        self_path = Path(sys.argv[1])
        authority_path = Path(sys.argv[2])
        audit_path = Path(sys.argv[3])

        EXPECTED_SELF = ".github/workflows/veux-u7-n4-test-v2-5.4.274-resukisu-35170-hunter-fastfail-static-green.yml"
        EXPECTED_AUTHORITY = ".github/workflows/veux-u7-n3-v4-5.4.274-resukisu-35170-susfs23-nomount-2.0.0-compile.yml"
        EXPECTED_AUTHORITY_BLOB = "d5accb592400412b025c6e67c473ed420c0d2494"
        EXPECTED = {
            "RESUKISU_COMMIT": "9be0f347f38e790c846915bd5f9c24b337f85c4e",
            "RESUKISU_VERSION": "35170",
            "RESUKISU_UAPI": "4",
            "SUSFS_COMMIT": "04a9d713106191ba98be680bd7ad9547ab1de964",
            "SUSFS_VERSION": "v2.3.0",
            "NOMOUNT_COMMIT": "b8d268353b4e7ecc53c67d1816a626b7d6579201",
            "NOMOUNT_TAG": "v2.0.0",
        }

        def die(msg: str) -> None:
            raise SystemExit(msg)

        def record(line: str) -> None:
            with audit_path.open("a", encoding="utf-8") as f:
                f.write(line + "\n")
            print(line)

        if self_path.as_posix() != EXPECTED_SELF:
            die(f"self path mismatch: {self_path}")
        if authority_path.as_posix() != EXPECTED_AUTHORITY:
            die(f"authority path mismatch: {authority_path}")

        doc = yaml.safe_load(self_path.read_text(encoding="utf-8"))
        authority = yaml.safe_load(authority_path.read_text(encoding="utf-8"))
        if not isinstance(doc, dict) or not isinstance(authority, dict):
            die("workflow YAML root must be a mapping")

        if doc.get("permissions") != {"contents": "read", "actions": "read"}:
            die(f"permissions drift: {doc.get('permissions')!r}")

        trigger = doc.get("on") or {}
        if "workflow_dispatch" not in trigger:
            die("workflow_dispatch missing")
        push = trigger.get("push") or {}
        if push.get("branches") != ["main"]:
            die(f"push branch mismatch: {push.get('branches')!r}")
        if push.get("paths") != [EXPECTED_SELF]:
            die(f"push path mismatch: {push.get('paths')!r}")

        env = doc.get("env") or {}
        if env.get("SELF_WORKFLOW") != EXPECTED_SELF:
            die("SELF_WORKFLOW mismatch")
        for key, value in EXPECTED.items():
            if str(env.get(key)) != value:
                die(f"workflow env mismatch {key}: {env.get(key)!r}")

        aenv = authority.get("env") or {}
        for key, value in EXPECTED.items():
            if key == "NOMOUNT_TAG":
                continue
            if str(aenv.get(key)) != value:
                die(f"authority env mismatch {key}: {aenv.get(key)!r}")
        if str(aenv.get("NOMOUNT_TAG")) != EXPECTED["NOMOUNT_TAG"]:
            die("authority NoMount tag mismatch")

        jobs = doc.get("jobs") or {}
        if set(jobs) != {"static-green", "compile-test"}:
            die(f"unexpected job set: {sorted(jobs)}")
        compile_job = jobs["compile-test"]
        if compile_job.get("needs") != "static-green":
            die(f"compile-test needs drift: {compile_job.get('needs')!r}")

        def step_names(job: dict[str, Any]) -> list[str]:
            return [str(s.get("name", "")) for s in (job.get("steps") or [])]

        c_names = step_names(compile_job)
        required_compile_steps = [
            "Checkout exact test branch",
            "Bind STATIC GREEN evidence",
            "Install controller dependencies",
            "Authenticate frozen U7-N3 authority",
            "Derive U7-N4 fast-fail test from exact U7-N3 and compile",
            "Finalize U7-N4 compile evidence",
            "Build U7-N4 CLEAN AnyKernel3 test package",
            "Upload U7-N4 test kernel",
            "Final real U7-N4 GREEN gate",
        ]
        for name in required_compile_steps:
            if c_names.count(name) != 1:
                die(f"compile step mismatch {name!r}: {c_names.count(name)}")
        if "Re-run U7-N3 upstream authentication" in c_names:
            die("obsolete redundant upstream-auth re-run still present")
        if c_names.index("Upload U7-N4 test kernel") > c_names.index("Final real U7-N4 GREEN gate"):
            die("artifact upload must precede final GREEN gate")

        uses = []
        for job in jobs.values():
            for step in job.get("steps") or []:
                if "uses" in step:
                    uses.append(str(step["uses"]))
        allowed_uses = {"actions/checkout@v7", "actions/upload-artifact@v7"}
        if not uses or any(u not in allowed_uses for u in uses):
            die(f"unexpected action use: {uses!r}")
        if uses.count("actions/checkout@v7") != 2:
            die(f"checkout action count mismatch: {uses.count('actions/checkout@v7')}")
        if uses.count("actions/upload-artifact@v7") != 1:
            die(f"upload action count mismatch: {uses.count('actions/upload-artifact@v7')}")

        authority_steps = next(iter(authority["jobs"].values()))["steps"]
        authority_names = [str(s.get("name", "")) for s in authority_steps]
        for name in [
            "Authenticate frozen authorities and 35158 to 35170 upstream contract",
            "Derive fail-closed U7-N3 replayer and compile",
            "Final real U7-N3 GREEN gate",
        ]:
            if authority_names.count(name) != 1:
                die(f"authority step mismatch {name!r}: {authority_names.count(name)}")

        build_steps = [
            s for s in compile_job.get("steps") or []
            if s.get("name") == "Derive U7-N4 fast-fail test from exact U7-N3 and compile"
        ]
        if len(build_steps) != 1:
            die("U7-N4 build step not unique")
        build_run = str(build_steps[0].get("run", ""))
        authority_build = next(
            s for s in authority_steps
            if s.get("name") == "Derive fail-closed U7-N3 replayer and compile"
        )
        authority_run = str(authority_build.get("run", ""))
        anchor = 'PYDERIVE\n\npython3 -m py_compile "$RUNNER_TEMP/n3_replay.py"\n'
        if authority_run.count(anchor) != 1:
            die(f"authority PYDERIVE anchor count={authority_run.count(anchor)}")
        if build_run.count("U7_N4_REPLAYER_PATCH=PASS") != 1:
            die("U7-N4 replayer patch marker count mismatch")

        # Every shell run block must parse. This catches broken heredocs/quoting before build.
        with tempfile.TemporaryDirectory(prefix="u7n4-static-shell-") as td:
            root = Path(td)
            idx = 0
            for job_name, job in jobs.items():
                for step in job.get("steps") or []:
                    if str(step.get("shell", "")) != "bash" or "run" not in step:
                        continue
                    idx += 1
                    p = root / f"{idx:02d}-{job_name}.sh"
                    p.write_text(str(step["run"]) + "\n", encoding="utf-8")
                    subprocess.run(["bash", "-n", str(p)], check=True)
        record("BASH_SYNTAX_ALL_RUN_BLOCKS=PASS")

        # Compile top-level Python heredocs in shell blocks. Nested heredocs are inside
        # the outer Python source and are validated separately below.
        py_start = re.compile(r"^\s*python3(?:\s+.*?)?\s+<<'([A-Za-z0-9_]+)'\s*$")
        py_count = 0
        for job in jobs.values():
            for step in job.get("steps") or []:
                run = str(step.get("run", ""))
                lines = run.splitlines()
                i = 0
                while i < len(lines):
                    m = py_start.match(lines[i])
                    if not m:
                        i += 1
                        continue
                    marker = m.group(1)
                    j = i + 1
                    while j < len(lines) and lines[j].strip() != marker:
                        j += 1
                    if j >= len(lines):
                        die(f"unterminated Python heredoc {marker}")
                    code = "\n".join(lines[i + 1:j]) + "\n"
                    compile(code, f"<{marker}>", "exec")
                    py_count += 1
                    i = j + 1
        if py_count < 3:
            die(f"too few Python heredocs checked: {py_count}")
        record(f"PYTHON_HEREDOC_COMPILE_COUNT={py_count}")
        record("PYTHON_HEREDOC_SYNTAX=PASS")

        # Decode the exact embedded U7-N4 adaptation payload and validate it directly.
        payloads = re.findall(
            r'base64\.b64decode\("([A-Za-z0-9+/=]+)"\)\.decode\("utf-8"\)',
            build_run,
        )
        if len(payloads) != 1:
            die(f"embedded adaptation payload count={len(payloads)}")
        payload = base64.b64decode(payloads[0], validate=True).decode("utf-8")
        compile(payload, "<U7-N4-adaptation>", "exec")

        ns: dict[str, Any] = {
            "Any": Any,
            "die": die,
        }
        exec(payload, ns)
        fn = ns.get("adapt_274_latency_fastfail")
        if not callable(fn):
            die("adapt_274_latency_fastfail missing after payload exec")

        compile_name = "Compile P14R1 and enforce P14 warning/DTB regression gates"
        synthetic_job: dict[str, Any] = {
            "steps": [
                {"name": compile_name, "shell": "bash", "run": "echo COMPILE"},
            ]
        }
        fn(synthetic_job)
        ssteps = synthetic_job["steps"]
        if len(ssteps) != 2 or ssteps[0].get("name") != "U7-N4 move invalid-argument validation before KSU hooks":
            die("adaptation did not inject exactly one patch step before compile")
        patch_run = str(ssteps[0].get("run", ""))

        with tempfile.TemporaryDirectory(prefix="u7n4-patch-syntax-") as td:
            patch_sh = Path(td) / "patch.sh"
            patch_sh.write_text(patch_run + "\n", encoding="utf-8")
            subprocess.run(["bash", "-n", str(patch_sh)], check=True)
        record("EMBEDDED_PATCH_BASH_SYNTAX=PASS")

        pyfast_start = "python3 - <<'PYFAST'\n"
        if patch_run.count(pyfast_start) != 1 or patch_run.count("\nPYFAST\n") != 1:
            die("PYFAST heredoc structure mismatch")
        a = patch_run.index(pyfast_start) + len(pyfast_start)
        b = patch_run.index("\nPYFAST\n", a)
        pyfast = patch_run[a:b] + "\n"
        compile(pyfast, "<PYFAST>", "exec")
        record("EMBEDDED_PATCH_PYTHON_SYNTAX=PASS")

        # Execute the exact patch step against a synthetic preimage that mirrors the
        # only ordering contract this test is allowed to change.
        with tempfile.TemporaryDirectory(prefix="u7n4-patch-selftest-") as td:
            root = Path(td)
            kernel = root / "kernel"
            fs = kernel / "fs"
            audit = root / "audit"
            fs.mkdir(parents=True)
            audit.mkdir()

            (fs / "open.c").write_text(
                "#include <linux/fs.h>\n"
                "static long do_faccessat(int dfd, const char __user *filename, int mode)\n"
                "{\n"
                "#ifdef CONFIG_KSU\n"
                "    ksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
                "#endif\n"
                "    if (mode & ~S_IRWXO)\n"
                "        return -EINVAL;\n"
                "    return 0;\n"
                "}\n",
                encoding="utf-8",
            )
            (fs / "stat.c").write_text(
                "#include <linux/fs.h>\n"
                "int vfs_statx(int dfd, const char __user *filename, int flags)\n"
                "{\n"
                "#ifdef CONFIG_KSU\n"
                "    ksu_handle_stat(&dfd, &filename, &flags);\n"
                "#endif\n"
                "    if (flags & ~(AT_SYMLINK_NOFOLLOW | AT_NO_AUTOMOUNT))\n"
                "        return -EINVAL;\n"
                "    return 0;\n"
                "}\n",
                encoding="utf-8",
            )

            subprocess.run(["git", "init", "-q", str(kernel)], check=True)
            subprocess.run(["git", "-C", str(kernel), "config", "user.email", "static-green@example.invalid"], check=True)
            subprocess.run(["git", "-C", str(kernel), "config", "user.name", "U7-N4 Static Green"], check=True)
            subprocess.run(["git", "-C", str(kernel), "add", "fs/open.c", "fs/stat.c"], check=True)
            subprocess.run(["git", "-C", str(kernel), "commit", "-q", "-m", "synthetic preimage"], check=True)

            patch_sh = root / "patch.sh"
            patch_sh.write_text(patch_run + "\n", encoding="utf-8")
            penv = os.environ.copy()
            penv["AUDIT_DIR"] = str(audit)
            subprocess.run(["bash", str(patch_sh)], cwd=root, env=penv, check=True)

            evidence = audit / "12-u7n4-latency-fastfail.txt"
            patch = audit / "12-u7n4-latency-fastfail.patch"
            if not evidence.is_file() or not patch.is_file() or patch.stat().st_size == 0:
                die("patch self-test evidence missing")
            et = evidence.read_text(encoding="utf-8")
            for token in [
                "U7_N4_LATENCY_FASTFAIL_PATCH=PASS",
                "PATCH_SCOPE=fs/open.c,fs/stat.c",
                "HYPOTHESIS=invalid_argument_validation_before_KSU_hook",
                "DEVICE_PASS=NO",
            ]:
                if token not in et.splitlines():
                    die(f"patch self-test evidence token missing: {token}")

            open_post = (fs / "open.c").read_text(encoding="utf-8")
            stat_post = (fs / "stat.c").read_text(encoding="utf-8")
            if open_post.index("if (mode & ~S_IRWXO)") > open_post.index("ksu_handle_faccessat"):
                die("open.c self-test ordering failed")
            if stat_post.index("if (flags & ~(") > stat_post.index("ksu_handle_stat"):
                die("stat.c self-test ordering failed")

        record("U7_N4_PATCH_SYNTHETIC_SELFTEST=PASS")

        final_step = next(
            s for s in compile_job["steps"]
            if s.get("name") == "Final real U7-N4 GREEN gate"
        )
        final_run = str(final_step.get("run", ""))
        for token in [
            "STATIC_GREEN_PASS=YES",
            "VEUX_U7_N4_LATENCY_FASTFAIL_COMPILE=PASS",
            "COMPILE_PASS=YES",
            "PACKAGE_PASS=YES",
            "STATIC_BOOT_PATH_PASS=NO",
            "DEVICE_PASS=NO",
            "U7_N4_REAL_GREEN_GATE=PASS",
        ]:
            if token not in final_run:
                die(f"final GREEN gate token missing: {token}")

        record("WORKFLOW_SCHEMA=PASS")
        record("AUTHORITY_SCHEMA=PASS")
        record(f"AUTHORITY_BLOB={EXPECTED_AUTHORITY_BLOB}")
        record("READ_ONLY_PERMISSIONS=PASS")
        record("ACTION_ALLOWLIST=PASS")
        record("REDUNDANT_UPSTREAM_AUTH_RERUN=ABSENT")
        record("STATIC_GREEN_PASS=YES")
        PYSTATIC

        grep -Fxq 'BASH_SYNTAX_ALL_RUN_BLOCKS=PASS' "$audit"
        grep -Fxq 'PYTHON_HEREDOC_SYNTAX=PASS' "$audit"
        grep -Fxq 'EMBEDDED_PATCH_BASH_SYNTAX=PASS' "$audit"
        grep -Fxq 'EMBEDDED_PATCH_PYTHON_SYNTAX=PASS' "$audit"
        grep -Fxq 'U7_N4_PATCH_SYNTHETIC_SELFTEST=PASS' "$audit"
        grep -Fxq 'WORKFLOW_SCHEMA=PASS' "$audit"
        grep -Fxq 'AUTHORITY_SCHEMA=PASS' "$audit"
        grep -Fxq 'READ_ONLY_PERMISSIONS=PASS' "$audit"
        grep -Fxq 'ACTION_ALLOWLIST=PASS' "$audit"
        grep -Fxq 'REDUNDANT_UPSTREAM_AUTH_RERUN=ABSENT' "$audit"
        grep -Fxq 'STATIC_GREEN_PASS=YES' "$audit"

        workflow_sha256="$(sha256sum "$SELF_WORKFLOW" | awk '{print $1}')"
        authority_blob="$(git hash-object "$U7N3_AUTHORITY")"
        echo "status=PASS" >> "$GITHUB_OUTPUT"
        echo "workflow_sha256=$workflow_sha256" >> "$GITHUB_OUTPUT"
        echo "authority_blob=$authority_blob" >> "$GITHUB_OUTPUT"
        echo "patch_selftest=PASS" >> "$GITHUB_OUTPUT"

        echo "STATIC_GREEN_WORKFLOW_SHA256=$workflow_sha256"
        echo "STATIC_GREEN_AUTHORITY_BLOB=$authority_blob"
        echo 'U7_N4_STATIC_GREEN=PASS'
  compile-test:
    needs: static-green
    runs-on: ubuntu-24.04
    timeout-minutes: 280
    steps:
    - name: Checkout exact test branch
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Bind STATIC GREEN evidence
      shell: bash
      env:
        STATIC_STATUS: ${{ needs.static-green.outputs.status }}
        STATIC_WORKFLOW_SHA256: ${{ needs.static-green.outputs.workflow_sha256 }}
        STATIC_AUTHORITY_BLOB: ${{ needs.static-green.outputs.authority_blob }}
        STATIC_PATCH_SELFTEST: ${{ needs.static-green.outputs.patch_selftest }}
      run: |
        set -euo pipefail
        test "$STATIC_STATUS" = PASS
        test "$STATIC_PATCH_SELFTEST" = PASS
        test "$STATIC_AUTHORITY_BLOB" = "$U7N3_AUTHORITY_BLOB"
        [[ "$STATIC_WORKFLOW_SHA256" =~ ^[0-9a-f]{64}$ ]]
        cat > "$GITHUB_WORKSPACE/U7-N4-STATIC-GREEN.txt" <<EOF
        U7_N4_STATIC_GREEN=PASS
        STATIC_GREEN_PASS=YES
        WORKFLOW_SHA256=$STATIC_WORKFLOW_SHA256
        U7N3_AUTHORITY_BLOB=$STATIC_AUTHORITY_BLOB
        PATCH_SYNTHETIC_SELFTEST=PASS
        DEVICE_PASS=NO
        EOF
    - name: Install controller dependencies
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ca-certificates git python3 python3-yaml unzip zip
        python3 - <<'PY'
        import yaml
        print("PYYAML_IMPORT=PASS")
        PY
    - name: Authenticate frozen U7-N3 authority
      shell: bash
      run: |
        set -euo pipefail
        test -f "$U7N3_AUTHORITY"
        actual="$(git hash-object "$U7N3_AUTHORITY")"
        test "$actual" = "$U7N3_AUTHORITY_BLOB"
        python3 - "$U7N3_AUTHORITY" <<'PY'
        from pathlib import Path
        import sys, yaml
        p = Path(sys.argv[1])
        doc = yaml.safe_load(p.read_text(encoding="utf-8"))
        env = doc.get("env") or {}
        expected = {
            "RESUKISU_COMMIT": "9be0f347f38e790c846915bd5f9c24b337f85c4e",
            "RESUKISU_VERSION": "35170",
            "RESUKISU_UAPI": "4",
            "SUSFS_COMMIT": "04a9d713106191ba98be680bd7ad9547ab1de964",
            "NOMOUNT_COMMIT": "b8d268353b4e7ecc53c67d1816a626b7d6579201",
        }
        for key, value in expected.items():
            if str(env.get(key)) != value:
                raise SystemExit(f"U7-N3 authority env mismatch {key}: {env.get(key)!r}")
        steps = next(iter(doc["jobs"].values()))["steps"]
        names = [str(s.get("name", "")) for s in steps]
        required = [
            "Authenticate frozen authorities and 35158 to 35170 upstream contract",
            "Derive fail-closed U7-N3 replayer and compile",
            "Final real U7-N3 GREEN gate",
        ]
        for name in required:
            if names.count(name) != 1:
                raise SystemExit(f"U7-N3 authority step mismatch {name!r}: {names.count(name)}")
        print("U7_N3_AUTHORITY_SCHEMA=PASS")
        PY
        echo "U7_N3_AUTHORITY_BLOB=$actual"
        echo "U7_N3_AUTHORITY_AUTH=PASS"
    - name: Derive U7-N4 fast-fail test from exact U7-N3 and compile
      id: n4
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail

        python3 - "$U7N3_AUTHORITY" "$RUNNER_TEMP/u7n4-build.sh" <<'PYOUTER'
        from pathlib import Path
        import sys
        import yaml

        src = Path(sys.argv[1])
        out = Path(sys.argv[2])
        doc = yaml.safe_load(src.read_text(encoding="utf-8"))
        steps = next(iter(doc["jobs"].values()))["steps"]

        matches = [
            s for s in steps
            if s.get("name") == "Derive fail-closed U7-N3 replayer and compile"
        ]
        if len(matches) != 1:
            raise SystemExit(f"U7-N3 build step count={len(matches)}")

        run = str(matches[0].get("run", ""))
        anchor = (
            'PYDERIVE\n\n'
            'python3 -m py_compile "$RUNNER_TEMP/n3_replay.py"\n'
        )
        if run.count(anchor) != 1:
            raise SystemExit(
                f"U7-N3 PYDERIVE insertion anchor count={run.count(anchor)}"
            )

        injection = r'''PYDERIVE

        python3 - "$RUNNER_TEMP/n3_replay.py" <<'PYN4PATCH'
        from pathlib import Path
        import base64
        import sys

        path = Path(sys.argv[1])
        code = path.read_text(encoding="utf-8")

        marker = (
            "def patch_293_integrator("
            "workspace: Path, doc: dict[str, Any]) -> str:\n"
        )
        if code.count(marker) != 1:
            raise SystemExit(
                f"U7-N4 replayer injection marker count={code.count(marker)}"
            )

        inject = base64.b64decode("").decode("utf-8")
        compile(inject, "<U7-N4-inject>", "exec")
        code = code.replace(marker, inject + marker, 1)

        lines = code.splitlines()
        hits = [
            i for i, line in enumerate(lines)
            if line.strip() == "adapt_274_nomount(job)"
        ]
        if len(hits) != 1:
            raise SystemExit(
                f"U7-N4 NoMount call structural match count={len(hits)}"
            )

        i = hits[0]
        indent = lines[i][:-len(lines[i].lstrip())]
        lines.insert(i + 1, indent + "adapt_274_latency_fastfail(job)")
        code = "\n".join(lines) + "\n"

        if code.count("adapt_274_latency_fastfail(job)") != 1:
            raise SystemExit("U7-N4 fast-fail adaptation call count mismatch")
        if code.count("def adapt_274_latency_fastfail(") != 1:
            raise SystemExit("U7-N4 fast-fail adaptation definition count mismatch")

        path.write_text(code, encoding="utf-8")
        compile(code, str(path), "exec")
        print("U7_N4_REPLAYER_PATCH=PASS")
        PYN4PATCH

        python3 -m py_compile "$RUNNER_TEMP/n3_replay.py"
        '''

        run = run.replace(anchor, injection, 1)
        out.write_text(run + "\n", encoding="utf-8")
        PYOUTER

        bash -n "$RUNNER_TEMP/u7n4-build.sh"
        bash "$RUNNER_TEMP/u7n4-build.sh"
    - name: Finalize U7-N4 compile evidence
      if: always()
      shell: bash
      env:
        N4_OUTCOME: ${{ steps.n4.outcome }}
      run: |
        set -euo pipefail
        agg="$GITHUB_WORKSPACE/n3-aggregate"
        out="$agg/5.4.274"
        result="$GITHUB_WORKSPACE/U7-N4-FINAL-RESULT.txt"
        static="$GITHUB_WORKSPACE/U7-N4-STATIC-GREEN.txt"
        pass=1
        static_pass=NO
        if [ -s "$static" ] && grep -Fxq 'STATIC_GREEN_PASS=YES' "$static"; then
          static_pass=YES
        else
          pass=0
        fi
        [ "$N4_OUTCOME" = success ] || pass=0
        [ -s "$out/Image" ] || pass=0
        [ -s "$out/BUILD-STATUS.txt" ] || pass=0
        latency="$out/evidence/clean-gen1-p14r1-audit/12-u7n4-latency-fastfail.txt"
        patch="$out/evidence/clean-gen1-p14r1-audit/12-u7n4-latency-fastfail.patch"
        if [ "$pass" = 1 ]; then
          grep -Fxq 'COMPILE_PASS=YES' "$out/BUILD-STATUS.txt" || pass=0
          grep -Fxq "RESUKISU_COMMIT=$RESUKISU_COMMIT" "$out/BUILD-STATUS.txt" || pass=0
          grep -Fxq "RESUKISU_VERSION=$RESUKISU_VERSION" "$out/BUILD-STATUS.txt" || pass=0
          grep -Fxq 'UAPI=4' "$out/BUILD-STATUS.txt" || pass=0
          grep -Fxq "SUSFS_COMMIT=$SUSFS_COMMIT" "$out/BUILD-STATUS.txt" || pass=0
          grep -Fxq 'SUSFS_VERSION=v2.3.0' "$out/BUILD-STATUS.txt" || pass=0
          [ -s "$latency" ] || pass=0
          [ -s "$patch" ] || pass=0
          if [ "$pass" = 1 ]; then
            grep -Fxq 'U7_N4_LATENCY_FASTFAIL_PATCH=PASS' "$latency" || pass=0
            grep -Fxq 'PATCH_SCOPE=fs/open.c,fs/stat.c' "$latency" || pass=0
          fi
        fi
        {
          echo "N4_STEP_OUTCOME=$N4_OUTCOME"
          echo "KERNEL=5.4.274"
          echo "RESUKISU_COMMIT=$RESUKISU_COMMIT"
          echo "RESUKISU_VERSION=$RESUKISU_VERSION"
          echo "UAPI=$RESUKISU_UAPI"
          echo "SUSFS_COMMIT=$SUSFS_COMMIT"
          echo "SUSFS_VERSION=$SUSFS_VERSION"
          echo "NOMOUNT_COMMIT=$NOMOUNT_COMMIT"
          echo "NOMOUNT_TAG=$NOMOUNT_TAG"
          echo "TEST_DELTA=fs/open.c,fs/stat.c"
          echo "STATIC_GREEN_PASS=$static_pass"
          if [ "$pass" = 1 ]; then
            echo "VEUX_U7_N4_LATENCY_FASTFAIL_COMPILE=PASS"
            echo "COMPILE_PASS=YES"
          else
            echo "VEUX_U7_N4_LATENCY_FASTFAIL_COMPILE=FAIL"
            echo "COMPILE_PASS=NO"
          fi
          echo "PACKAGE_PASS=NO"
          echo "STATIC_BOOT_PATH_PASS=NO"
          echo "DEVICE_PASS=NO"
        } > "$result"
    - name: Build U7-N4 CLEAN AnyKernel3 test package
      if: steps.n4.outcome == 'success'
      shell: bash
      run: |
        set -euo pipefail
        agg="$GITHUB_WORKSPACE/n3-aggregate"
        image="$agg/5.4.274/Image"
        result="$GITHUB_WORKSPACE/U7-N4-FINAL-RESULT.txt"
        latency="$agg/5.4.274/evidence/clean-gen1-p14r1-audit/12-u7n4-latency-fastfail.txt"
        test -s "$image"
        test -s "$result"
        test -s "$latency"
        test -s "$GITHUB_WORKSPACE/U7-N4-STATIC-GREEN.txt"
        grep -Fxq 'STATIC_GREEN_PASS=YES' "$GITHUB_WORKSPACE/U7-N4-STATIC-GREEN.txt"
        grep -Fxq 'STATIC_GREEN_PASS=YES' "$result"
        grep -Fxq 'VEUX_U7_N4_LATENCY_FASTFAIL_COMPILE=PASS' "$result"
        grep -Fxq 'U7_N4_LATENCY_FASTFAIL_PATCH=PASS' "$latency"
        dist="$GITHUB_WORKSPACE/u7-n4-dist"
        ak3="$RUNNER_TEMP/AnyKernel3-U7N4"
        rm -rf "$dist" "$ak3"
        mkdir -p "$dist"
        git clone -q "$AK3_REPO" "$ak3"
        git -C "$ak3" checkout -q --detach "$AK3_COMMIT"
        test "$(git -C "$ak3" rev-parse HEAD)" = "$AK3_COMMIT"
        rm -f "$ak3/Image" "$ak3/Image.gz" "$ak3/Image.gz-dtb" "$ak3/dtb" "$ak3/dtbo.img"
        cp "$image" "$ak3/Image"
        cat > "$ak3/anykernel.sh" <<EOF
        # AnyKernel3 Ramdisk Mod Script
        # osm0sis @ xda-developers

        properties() { '
        kernel.string=VEUX U7-N4 TEST Linux 5.4.274 ReSukiSU 35170 UAPI4 + SUSFS 2.3 + NoMount 2.0.0
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=veux
        supported.versions=13
        supported.patchlevels=
        '; }

        BLOCK=boot;
        IS_SLOT_DEVICE=1;
        SLOT_SELECT=active;
        RAMDISK_COMPRESSION=auto;
        PATCH_VBMETA_FLAG=0;

        . tools/ak3-core.sh;
        dump_boot;
        write_boot;
        EOF
        chmod 0755 "$ak3/anykernel.sh"
        rm -rf "$ak3/.git" "$ak3/.github"
        rm -f "$ak3/README.md"
        find "$ak3" -type f -name '*placeholder' -delete
        find "$ak3" -maxdepth 1 -type f -name '*.txt' -delete
        zip_name="VEUX-5.4.274-U7-N4-TEST-ReSukiSU-35170-SUSFS2.3-NoMount2.0.0-LatencyFastFail-AK3.zip"
        (
          cd "$ak3"
          zip -r9 "$dist/$zip_name" . -x '.github/*' 'README.md' '*placeholder' '*.txt'
        )
        zip_path="$dist/$zip_name"
        test -s "$zip_path"
        unzip -t "$zip_path" >/dev/null
        for required in anykernel.sh tools/ak3-core.sh Image META-INF/com/google/android/update-binary META-INF/com/google/android/updater-script; do
          unzip -Z1 "$zip_path" | grep -Fxq "$required"
        done
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        unzip -p "$zip_path" Image > "$tmp/Image"
        cmp -s "$image" "$tmp/Image"
        unzip -p "$zip_path" anykernel.sh > "$tmp/anykernel.sh"
        bash -n "$tmp/anykernel.sh"
        grep -Fqx 'device.name1=veux' "$tmp/anykernel.sh"
        grep -Fqx 'supported.versions=13' "$tmp/anykernel.sh"
        grep -Fqx 'BLOCK=boot;' "$tmp/anykernel.sh"
        grep -Fqx 'IS_SLOT_DEVICE=1;' "$tmp/anykernel.sh"
        grep -Fqx 'SLOT_SELECT=active;' "$tmp/anykernel.sh"
        grep -Fqx 'RAMDISK_COMPRESSION=auto;' "$tmp/anykernel.sh"
        grep -Fqx 'PATCH_VBMETA_FLAG=0;' "$tmp/anykernel.sh"
        ! unzip -Z1 "$zip_path" | grep -Eq '(^|/)(boot\.img|rollback_stock_boot\.img(\.gz)?|dtb|dtbo\.img|Image\.gz|Image\.gz-dtb)$'
        sha256sum "$zip_path" > "$zip_path.sha256"
        cp "$image" "$dist/Image"
        cp "$latency" "$dist/12-u7n4-latency-fastfail.txt"
        cp "$agg/5.4.274/evidence/clean-gen1-p14r1-audit/12-u7n4-latency-fastfail.patch" "$dist/12-u7n4-latency-fastfail.patch"
        sed -i 's/^PACKAGE_PASS=NO$/PACKAGE_PASS=YES/' "$result"
        cp "$result" "$dist/FINAL-RESULT.txt"
        cp "$GITHUB_WORKSPACE/U7-N4-STATIC-GREEN.txt" "$dist/STATIC-GREEN.txt"
        {
          echo "AK3_PIN=$AK3_COMMIT"
          echo "AK3_IMAGE_ONLY=PASS"
          echo "AK3_ACTIVE_SLOT_UPPERCASE_CONTRACT=PASS"
          echo "AK3_ZIP=$zip_name"
          echo "AK3_SHA256=$(sha256sum "$zip_path" | awk '{print $1}')"
        } > "$dist/AK3-RESULT.txt"
        (
          cd "$dist"
          find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
        )
    - name: Upload U7-N4 test kernel
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: VEUX-U7-N4-TEST-35170-LatencyFastFail-${{ github.run_id }}
        path: |
          u7-n4-dist/
