          test "$(sha256sum "$rpmh_patch" | awk '{print $1}')" = "$EXPECTED_RPMH_O40_PATCH_SHA256"
          git -C "$TARGET_DIR" apply --check --whitespace=error "$rpmh_patch"
          git -C "$TARGET_DIR" apply --whitespace=error "$rpmh_patch"
          test "$(sha256sum "$rpmh" | awk '{print $1}')" = "$EXPECTED_RPMH_301_SHA256"

          ! grep -RFn --include='*.c' --include='*.h' --include='Makefile' \
            -e '<<<<<<<' -e '=======' -e '>>>>>>>' "$TARGET_DIR"
          test "$(make -s -C "$TARGET_DIR" kernelversion)" = '5.4.301'
          grep -Fq '#define ARM_CPU_PART_NEOVERSE_V3AE' "$TARGET_DIR/arch/arm64/include/asm/cputype.h"
          grep -Fq '#define MIDR_NEOVERSE_V3AE' "$TARGET_DIR/arch/arm64/include/asm/cputype.h"
          grep -Fq 'target_list && list_empty(&node->work.entry)' "$TARGET_DIR/drivers/android/binder.c"
          ! grep -Fq 'PCI_DMA_FROMDEVICE' "$ivtv"
          ! grep -Fq 'PCI_DMA_TODEVICE' "$ivtv"
          ! grep -Fq 'PCI_DMA_NONE' "$ivtv"
          grep -Fq '__tcs_trigger(drv, i, false);' "$rpmh"
          grep -Fq 'USB_DEVICE(0x12d1, 0x15c1)' "$TARGET_DIR/drivers/usb/core/quirks.c"
          grep -Fq 'ksu_handle_post_execve' "$TARGET_DIR/fs/exec.c"
