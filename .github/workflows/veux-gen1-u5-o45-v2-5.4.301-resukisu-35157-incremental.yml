           	else
           		s->dma = ivtv_stream_info[type].dma;
           	s->buf_size = itv->stream_buf_size[type];
          @@ -217,7 +217,7 @@
           
           	/* User explicitly selected 0 buffers for these streams, so don't
           	   create them. */
          -	if (ivtv_stream_info[type].dma != PCI_DMA_NONE &&
          +	if (ivtv_stream_info[type].dma != DMA_NONE &&
           	    itv->options.kilobytes[type] == 0) {
           		IVTV_INFO("Disabled %s device\n", ivtv_stream_info[type].name);
           		return 0;
          PATCH
          # Patch bytes are frozen to the O40 evidence.
          test "$(sha256sum "$ivtv_patch" | awk '{print $1}')" = "$EXPECTED_IVTV_O40_PATCH_SHA256"
          git -C "$TARGET_DIR" apply --check --whitespace=error "$ivtv_patch"
          git -C "$TARGET_DIR" apply --whitespace=error "$ivtv_patch"
          test "$(sha256sum "$ivtv" | awk '{print $1}')" = "$EXPECTED_IVTV_301_SHA256"

          # Conflict 3: exact O40 RPMH unconditional-trigger + vendor IRQ union.
          rpmh="$TARGET_DIR/drivers/soc/qcom/rpmh-rsc.c"
          test "$(sha256sum "$rpmh" | awk '{print $1}')" = "$EXPECTED_RPMH_300_SHA256"
          rpmh_patch="$tmp/o40-rpmh-301.patch"
          cat > "$rpmh_patch" <<'PATCH'
          diff --git a/drivers/soc/qcom/rpmh-rsc.c b/drivers/soc/qcom/rpmh-rsc.c
          --- a/drivers/soc/qcom/rpmh-rsc.c
          +++ b/drivers/soc/qcom/rpmh-rsc.c
          @@ -294,13 +294,11 @@
           		ipc_log_string(drv->ipc_log_ctx,
