name: VEUX GEN1 U5-O48 v2 5.4.301 Static Boot Audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: veux-gen1-u5-o48-v2-5.4.301-static-boot
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: Chrizz100/veux-nongki-universal-kernel

  O47_RUN_ID: '35462028634'
  O47_HEAD_SHA: 7a8f82bd6eba92a2a03ea61415974752c640d454
  O47_ARTIFACT_NAME: VEUX-5.4.301-ReSukiSU-35157-P14R1-O47V1-PACKAGE-35462028634
  O47_ARTIFACT_DIGEST: sha256:eee992c758880cc09aef13c12665835021994ff688522065eef2affa5984009f
  O47_IMAGE_SHA256: d331865930fd6544bb7457d6d6e0241fc3b181f1f831a6c9ae921a57f79b8c82
  O47_AK3_NAME: VEUX-5.4.301-ReSukiSU-35157-UAPI4-SUSFS-2.3.0-AK3.zip
  O47_AK3_SHA256: 05f7125d7bf66eb43edf03112912dd060e2b5a6f3bee460c295044675929ddbb

  BASE_BOOT_URL: https://github.com/Chrizz100/veux-nongki-universal-kernel/releases/download/v1.0.0-beta1/VEUX-5.4.302-ReSukiSU-35157-UAPI4-SUSFS-2.3.0-BOOTTEST.img
  BASE_BOOT_SHA256: b79d121003e9abb12962eaf44ff56aa4c66588d2245ed09d8325e3c39fe67e65
  BASE_KERNEL_SHA256: 67807748edd57e9fa714d444a39fccf54d88b95c92d54de029b4c12bc868345a
  STOCK_RAMDISK_SHA256: 0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a
  BOOT_PARTITION_SIZE: '134217728'
  EXPECTED_HEADER_VERSION: '3'
  EXPECTED_KERNEL_BYTES: '29911552'

  MAGISK_APK_URL: https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk
  MAGISK_APK_SHA256: e0d32d2123532860f97123d927b1bb86c4e08e6fd8a48bfc6b5bee0afae9ebd5

  AVB_REPO: https://android.googlesource.com/platform/external/avb
  AVB_COMMIT: de53827b226bccef7407e4c253b0152e8d9f8e04

  WORK_DIR: ${{ github.workspace }}/o48-work
  AUDIT_DIR: ${{ github.workspace }}/u5-o48-audit
  DIST_DIR: ${{ github.workspace }}/u5-o48-dist
  O47_DIR: ${{ github.workspace }}/o47-package

jobs:
  static-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Repository and immutable plan gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          rm -rf "$WORK_DIR" "$AUDIT_DIR" "$DIST_DIR" "$O47_DIR"
          mkdir -p "$WORK_DIR" "$AUDIT_DIR" "$DIST_DIR" "$O47_DIR"
          cat > "$AUDIT_DIR/00-plan.txt" <<'EOF'
          U5-O48 v2: create and statically validate VEUX 5.4.301 boot.img.
          Upstream package authority: O47 v1 GREEN package run.
          Boot layout authority: published VEUX 5.4.302 BOOTTEST image from the same Android-13 boot-v3 path.
          Kernel payload only is replaced.
          Raw stock ramdisk identity is pinned; decoded ramdisk identity is compared reference-to-final.
          AVB footer/hash descriptor is regenerated with pinned AOSP avbtool and verified.
          PACKAGE_PASS=YES is inherited only after authenticating O47.
          STATIC_BOOT_PATH_PASS=PASS is set only after re-extract and AVB verification.
          DEVICE_PASS=NO remains mandatory until a real VEUX device test.
          EOF

      - name: Authenticate O47 GREEN run and artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')

          curl --fail --silent --show-error --location "${auth[@]}" \
            "$api/actions/runs/$O47_RUN_ID" > "$AUDIT_DIR/01-o47-run.json"
          jq -e --arg sha "$O47_HEAD_SHA" \
            '.status == "completed" and .conclusion == "success" and .head_sha == $sha' \
            "$AUDIT_DIR/01-o47-run.json" >/dev/null

          curl --fail --silent --show-error --location "${auth[@]}" \
            "$api/actions/runs/$O47_RUN_ID/artifacts?per_page=100" > "$AUDIT_DIR/01-o47-artifacts.json"

          count="$(jq --arg n "$O47_ARTIFACT_NAME" '[.artifacts[] | select(.name == $n and .expired == false)] | length' "$AUDIT_DIR/01-o47-artifacts.json")"
          test "$count" = '1'
          digest="$(jq -r --arg n "$O47_ARTIFACT_NAME" '.artifacts[] | select(.name == $n and .expired == false) | .digest' "$AUDIT_DIR/01-o47-artifacts.json")"
          test "$digest" = "$O47_ARTIFACT_DIGEST"

          {
            echo 'O47_RUN_AUTH=PASS'
            echo 'O47_ARTIFACT_METADATA_AUTH=PASS'
            echo "O47_ARTIFACT_DIGEST=$digest"
          } | tee "$AUDIT_DIR/01-o47-auth.txt"

      - name: Download authenticated O47 package artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.O47_ARTIFACT_NAME }}
          path: ${{ env.O47_DIR }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.O47_RUN_ID }}

      - name: Validate O47 Image and AK3 payload
        shell: bash
        run: |
          set -euo pipefail
          image="$O47_DIR/Image"
          ak3="$O47_DIR/$O47_AK3_NAME"
          test -s "$image"
          test -s "$ak3"
          test "$(stat -c '%s' "$image")" = "$EXPECTED_KERNEL_BYTES"
          test "$(sha256sum "$image" | awk '{print $1}')" = "$O47_IMAGE_SHA256"
          test "$(sha256sum "$ak3" | awk '{print $1}')" = "$O47_AK3_SHA256"
          unzip -t "$ak3" > "$AUDIT_DIR/02-ak3-test.txt"
          unzip -p "$ak3" Image > "$WORK_DIR/ak3-Image"
          cmp -s "$image" "$WORK_DIR/ak3-Image"
          echo 'O47_PACKAGE_PAYLOAD_AUTH=PASS' | tee "$AUDIT_DIR/02-o47-package.txt"

      - name: Install host tools and pinned MagiskBoot v30.7
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl file git jq python3 unzip

          apk="$WORK_DIR/Magisk-v30.7.apk"
          curl --fail --location --retry 3 "$MAGISK_APK_URL" -o "$apk"
          test "$(sha256sum "$apk" | awk '{print $1}')" = "$MAGISK_APK_SHA256"
          mapfile -t mb_candidates < <(zipinfo -1 "$apk" | grep -E '^lib/x86_64/(lib)?magiskboot(\.so)?$')
          test "${#mb_candidates[@]}" -eq 1
          unzip -p "$apk" "${mb_candidates[0]}" > "$WORK_DIR/magiskboot"
          chmod 0755 "$WORK_DIR/magiskboot"
          echo "MAGISKBOOT_APK_PATH=${mb_candidates[0]}" | tee "$AUDIT_DIR/03-magiskboot-apk-path.txt"
          file "$WORK_DIR/magiskboot" | tee "$AUDIT_DIR/03-magiskboot-file.txt"
          file "$WORK_DIR/magiskboot" | grep -Eq 'ELF 64-bit.*x86-64|ELF 64-bit.*x86_64'
          "$WORK_DIR/magiskboot" 2>&1 | head -80 > "$AUDIT_DIR/03-magiskboot-help.txt" || true
          grep -Fq 'MagiskBoot' "$AUDIT_DIR/03-magiskboot-help.txt"
          echo 'MAGISKBOOT_V30_7_PIN=PASS' | tee "$AUDIT_DIR/03-magiskboot.txt"

      - name: Install pinned AOSP avbtool
        shell: bash
        run: |
          set -euo pipefail
          avb="$WORK_DIR/avb"
          rm -rf "$avb"
          git init -q "$avb"
          git -C "$avb" remote add origin "$AVB_REPO"
          git -C "$avb" fetch -q --depth=1 origin "$AVB_COMMIT"
          git -C "$avb" checkout -q --detach FETCH_HEAD
          test "$(git -C "$avb" rev-parse HEAD)" = "$AVB_COMMIT"
          test -s "$avb/avbtool.py"
          python3 "$avb/avbtool.py" version | tee "$AUDIT_DIR/04-avbtool-version.txt"
          echo 'AOSP_AVBTOOL_PIN=PASS' | tee "$AUDIT_DIR/04-avbtool.txt"

      - name: Download and authenticate VEUX boot-v3 reference
        shell: bash
        run: |
          set -euo pipefail
          base="$WORK_DIR/base-5.4.302-BOOTTEST.img"
          curl --fail --location --retry 3 "$BASE_BOOT_URL" -o "$base"
          test "$(stat -c '%s' "$base")" = "$BOOT_PARTITION_SIZE"
          test "$(sha256sum "$base" | awk '{print $1}')" = "$BASE_BOOT_SHA256"

          python3 - "$base" "$EXPECTED_HEADER_VERSION" "$EXPECTED_KERNEL_BYTES" <<'PY'
          import struct, sys
          p, expected_ver, expected_kernel = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          b = open(p, 'rb').read(4096)
          if b[:8] != b'ANDROID!':
              raise SystemExit('ANDROID boot magic missing')
          kernel_size = struct.unpack_from('<I', b, 8)[0]
          ramdisk_size = struct.unpack_from('<I', b, 12)[0]
          header_size = struct.unpack_from('<I', b, 20)[0]
          header_version = struct.unpack_from('<I', b, 40)[0]
          print(f'BOOT_MAGIC=PASS')
          print(f'HEADER_VERSION={header_version}')
          print(f'HEADER_SIZE={header_size}')
          print(f'KERNEL_SIZE={kernel_size}')
          print(f'RAMDISK_SIZE={ramdisk_size}')
          if header_version != expected_ver:
              raise SystemExit(f'expected header v{expected_ver}, got v{header_version}')
          if kernel_size != expected_kernel:
              raise SystemExit(f'expected kernel bytes {expected_kernel}, got {kernel_size}')
          if header_size <= 0 or ramdisk_size <= 0:
              raise SystemExit('invalid boot-v3 header sizes')
          PY
          python3 - "$base" "$EXPECTED_HEADER_VERSION" "$EXPECTED_KERNEL_BYTES" \
            <<'PY' > "$AUDIT_DIR/05-base-header.txt"
          import struct, sys
          p, expected_ver, expected_kernel = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          b = open(p, 'rb').read(4096)
          print('BOOT_MAGIC=' + ('PASS' if b[:8] == b'ANDROID!' else 'FAIL'))
          print('HEADER_VERSION=' + str(struct.unpack_from('<I', b, 40)[0]))
          print('HEADER_SIZE=' + str(struct.unpack_from('<I', b, 20)[0]))
          print('KERNEL_SIZE=' + str(struct.unpack_from('<I', b, 8)[0]))
          print('RAMDISK_SIZE=' + str(struct.unpack_from('<I', b, 12)[0]))
          PY

          python3 "$WORK_DIR/avb/avbtool.py" info_image --image "$base" > "$AUDIT_DIR/05-base-avb.txt"
          grep -Eq '^Algorithm:[[:space:]]+NONE$' "$AUDIT_DIR/05-base-avb.txt"
          grep -Eq '^[[:space:]]*Partition Name:[[:space:]]+boot$' "$AUDIT_DIR/05-base-avb.txt"
          grep -Eq '^[[:space:]]*Hash Algorithm:[[:space:]]+sha256$' "$AUDIT_DIR/05-base-avb.txt"
          salt="$(sed -n 's/^[[:space:]]*Salt:[[:space:]]*//p' "$AUDIT_DIR/05-base-avb.txt" | head -1 | tr 'A-F' 'a-f')"
          original_size="$(sed -n 's/^Original image size:[[:space:]]*\([0-9][0-9]*\) bytes$/\1/p' "$AUDIT_DIR/05-base-avb.txt" | head -1)"
          test -n "$salt"
          [[ "$salt" =~ ^[0-9a-f]+$ ]]
          test -n "$original_size"
          [[ "$original_size" =~ ^[0-9]+$ ]]
          test "$original_size" -gt 30000000
          test "$original_size" -lt "$BOOT_PARTITION_SIZE"

          python3 - "$AUDIT_DIR/05-base-avb.txt" "$AUDIT_DIR/05-base-avb-props.txt" <<'PY'
          import re, sys
          src, dst = sys.argv[1:3]
          props = []
          for line in open(src, encoding='utf-8'):
              m = re.match(r"\s*Prop:\s+(.+?)\s+->\s+'(.*)'\s*$", line.rstrip('\n'))
              if m:
                  props.append((m.group(1), m.group(2)))
          if not props:
              raise SystemExit('reference AVB properties missing')
          with open(dst, 'w', encoding='utf-8') as f:
              for key, value in sorted(props):
                  f.write(f'{key}\t{value}\n')
          print(f'BASE_AVB_PROPERTIES={len(props)}')
          PY

          echo "AVB_SALT=$salt" >> "$GITHUB_ENV"
          echo "BASE_ORIGINAL_IMAGE_SIZE=$original_size" >> "$GITHUB_ENV"
          echo 'BOOT_V3_REFERENCE_AUTH=PASS' | tee "$AUDIT_DIR/05-base-gate.txt"

      - name: Unpack reference and prove kernel plus stock ramdisk identity
        shell: bash
        run: |
          set -euo pipefail
          mb="$WORK_DIR/magiskboot"
          base="$WORK_DIR/base-5.4.302-BOOTTEST.img"

          raw="$WORK_DIR/base-raw"
          dec="$WORK_DIR/base-decoded"
          mkdir -p "$raw" "$dec"

          (
            cd "$raw"
            "$mb" unpack -n -h "$base" > "$AUDIT_DIR/06-base-raw-unpack.txt" 2>&1
          )
          test -s "$raw/kernel"
          test -s "$raw/ramdisk.cpio"
          test "$(sha256sum "$raw/kernel" | awk '{print $1}')" = "$BASE_KERNEL_SHA256"
          test "$(stat -c '%s' "$raw/kernel")" = "$EXPECTED_KERNEL_BYTES"
          raw_ramdisk_sha="$(sha256sum "$raw/ramdisk.cpio" | awk '{print $1}')"
          test "$raw_ramdisk_sha" = "$STOCK_RAMDISK_SHA256"
          echo "$raw_ramdisk_sha  $raw/ramdisk.cpio" > "$AUDIT_DIR/06-base-raw-ramdisk.sha256"

          (
            cd "$dec"
            "$mb" unpack -h "$base" > "$AUDIT_DIR/06-base-decoded-unpack.txt" 2>&1
          )
          test -s "$dec/kernel"
          test -s "$dec/ramdisk.cpio"
          test "$(sha256sum "$dec/kernel" | awk '{print $1}')" = "$BASE_KERNEL_SHA256"
          decoded_ramdisk_sha="$(sha256sum "$dec/ramdisk.cpio" | awk '{print $1}')"
          test -n "$decoded_ramdisk_sha"
          echo "DECODED_RAMDISK_SHA256=$decoded_ramdisk_sha" >> "$GITHUB_ENV"
          echo "$decoded_ramdisk_sha  $dec/ramdisk.cpio" > "$AUDIT_DIR/06-base-decoded-ramdisk.sha256"

          {
            echo 'BASE_KERNEL_IDENTITY=PASS'
            echo 'STOCK_RAMDISK_RAW_IDENTITY=PASS'
            echo 'REFERENCE_DECODED_RAMDISK_CAPTURE=PASS'
            echo "RAW_RAMDISK_SHA256=$raw_ramdisk_sha"
            echo "DECODED_RAMDISK_SHA256=$decoded_ramdisk_sha"
          } | tee "$AUDIT_DIR/06-reference-components.txt"

      - name: Repack 5.4.301 kernel and regenerate AVB hash footer
        shell: bash
        run: |
          set -euo pipefail
          mb="$WORK_DIR/magiskboot"
          avb="$WORK_DIR/avb/avbtool.py"
          base="$WORK_DIR/base-5.4.302-BOOTTEST.img"
          build="$WORK_DIR/repack"
          mkdir -p "$build"

          cp -a "$WORK_DIR/base-raw/." "$build/"
          cp "$O47_DIR/Image" "$build/kernel"
          test "$(sha256sum "$build/kernel" | awk '{print $1}')" = "$O47_IMAGE_SHA256"

          (
            cd "$build"
            "$mb" repack -n "$base" "$WORK_DIR/pre-avb.img" > "$AUDIT_DIR/07-repack.txt" 2>&1
          )
          test -s "$WORK_DIR/pre-avb.img"

          python3 "$avb" erase_footer --image "$WORK_DIR/pre-avb.img"
          aosp_size="$(stat -c '%s' "$WORK_DIR/pre-avb.img")"
          test "$aosp_size" = "$BASE_ORIGINAL_IMAGE_SIZE"

          prop_args=()
          while IFS=$'\t' read -r key value; do
            test -n "$key"
            prop_args+=(--prop "$key:$value")
          done < "$AUDIT_DIR/05-base-avb-props.txt"
          test "${#prop_args[@]}" -gt 0

          python3 "$avb" add_hash_footer \
            --image "$WORK_DIR/pre-avb.img" \
            --partition_name boot \
            --partition_size "$BOOT_PARTITION_SIZE" \
            --hash_algorithm sha256 \
            --algorithm NONE \
            --salt "$AVB_SALT" \
            "${prop_args[@]}"

          mv "$WORK_DIR/pre-avb.img" "$DIST_DIR/boot.img"
          test "$(stat -c '%s' "$DIST_DIR/boot.img")" = "$BOOT_PARTITION_SIZE"

          python3 "$avb" info_image --image "$DIST_DIR/boot.img" > "$AUDIT_DIR/07-final-avb.txt"
          python3 "$avb" verify_image --image "$DIST_DIR/boot.img" > "$AUDIT_DIR/07-final-avb-verify.txt"
          grep -Eq '^Algorithm:[[:space:]]+NONE$' "$AUDIT_DIR/07-final-avb.txt"
          grep -Eq '^[[:space:]]*Partition Name:[[:space:]]+boot$' "$AUDIT_DIR/07-final-avb.txt"
          grep -Eq '^[[:space:]]*Hash Algorithm:[[:space:]]+sha256$' "$AUDIT_DIR/07-final-avb.txt"
          final_salt="$(sed -n 's/^[[:space:]]*Salt:[[:space:]]*//p' "$AUDIT_DIR/07-final-avb.txt" | head -1 | tr 'A-F' 'a-f')"
          final_original_size="$(sed -n 's/^Original image size:[[:space:]]*\([0-9][0-9]*\) bytes$/\1/p' "$AUDIT_DIR/07-final-avb.txt" | head -1)"
          test "$final_salt" = "$AVB_SALT"
          test "$final_original_size" = "$BASE_ORIGINAL_IMAGE_SIZE"

          python3 - "$AUDIT_DIR/07-final-avb.txt" "$AUDIT_DIR/07-final-avb-props.txt" <<'PY'
          import re, sys
          src, dst = sys.argv[1:3]
          props = []
          for line in open(src, encoding='utf-8'):
              m = re.match(r"\s*Prop:\s+(.+?)\s+->\s+'(.*)'\s*$", line.rstrip('\n'))
              if m:
                  props.append((m.group(1), m.group(2)))
          with open(dst, 'w', encoding='utf-8') as f:
              for key, value in sorted(props):
                  f.write(f'{key}\t{value}\n')
          print(f'FINAL_AVB_PROPERTIES={len(props)}')
          PY
          cmp -s "$AUDIT_DIR/05-base-avb-props.txt" "$AUDIT_DIR/07-final-avb-props.txt"

          python3 "$avb" calculate_vbmeta_digest --image "$DIST_DIR/boot.img" --hash_algorithm sha256 \
            | tee "$AUDIT_DIR/07-vbmeta-digest.txt"
          echo "AOSP_IMAGE_BYTES_BEFORE_AVB=$aosp_size" | tee "$AUDIT_DIR/07-aosp-size.txt"
          {
            echo 'AVB_HASH_FOOTER_REGENERATED=PASS'
            echo 'AVB_PROPERTIES_PRESERVED=PASS'
            echo 'AVB_ORIGINAL_IMAGE_SIZE_PRESERVED=PASS'
          } | tee "$AUDIT_DIR/07-avb-gate.txt"

      - name: Independent static boot re-extract and byte-identity gates
        shell: bash
        run: |
          set -euo pipefail
          mb="$WORK_DIR/magiskboot"
          final="$DIST_DIR/boot.img"
          base="$WORK_DIR/base-5.4.302-BOOTTEST.img"

          final_raw="$WORK_DIR/final-raw"
          final_dec="$WORK_DIR/final-decoded"
          mkdir -p "$final_raw" "$final_dec"

          (
            cd "$final_raw"
            "$mb" unpack -n -h "$final" > "$AUDIT_DIR/08-final-raw-unpack.txt" 2>&1
          )
          test -s "$final_raw/kernel"
          test -s "$final_raw/ramdisk.cpio"
          test "$(sha256sum "$final_raw/kernel" | awk '{print $1}')" = "$O47_IMAGE_SHA256"
          test "$(sha256sum "$final_raw/ramdisk.cpio" | awk '{print $1}')" = "$STOCK_RAMDISK_SHA256"
          cmp -s "$WORK_DIR/base-raw/ramdisk.cpio" "$final_raw/ramdisk.cpio"

          (
            cd "$final_dec"
            "$mb" unpack -h "$final" > "$AUDIT_DIR/08-final-decoded-unpack.txt" 2>&1
          )
          test -s "$final_dec/kernel"
          test -s "$final_dec/ramdisk.cpio"
          test "$(sha256sum "$final_dec/kernel" | awk '{print $1}')" = "$O47_IMAGE_SHA256"
          test "$(sha256sum "$final_dec/ramdisk.cpio" | awk '{print $1}')" = "$DECODED_RAMDISK_SHA256"
          cmp -s "$WORK_DIR/base-decoded/ramdisk.cpio" "$final_dec/ramdisk.cpio"

          dd if="$base" of="$WORK_DIR/base-header-page.bin" bs=4096 count=1 status=none
          dd if="$final" of="$WORK_DIR/final-header-page.bin" bs=4096 count=1 status=none
          cmp -s "$WORK_DIR/base-header-page.bin" "$WORK_DIR/final-header-page.bin"

          python3 - "$final" "$EXPECTED_HEADER_VERSION" "$EXPECTED_KERNEL_BYTES" <<'PY' > "$AUDIT_DIR/08-final-header.txt"
          import struct, sys
          p, expected_ver, expected_kernel = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          b = open(p, 'rb').read(4096)
          assert b[:8] == b'ANDROID!'
          kernel_size = struct.unpack_from('<I', b, 8)[0]
          ramdisk_size = struct.unpack_from('<I', b, 12)[0]
          header_size = struct.unpack_from('<I', b, 20)[0]
          header_version = struct.unpack_from('<I', b, 40)[0]
          assert header_version == expected_ver, (header_version, expected_ver)
          assert kernel_size == expected_kernel, (kernel_size, expected_kernel)
          assert ramdisk_size > 0 and header_size > 0
          print('BOOT_MAGIC=PASS')
          print(f'HEADER_VERSION={header_version}')
          print(f'HEADER_SIZE={header_size}')
          print(f'KERNEL_SIZE={kernel_size}')
          print(f'RAMDISK_SIZE={ramdisk_size}')
          PY

          strings -a "$final_raw/kernel" > "$AUDIT_DIR/08-final-kernel-strings.txt"
          grep -Fq 'Linux version 5.4.301-qgki-g82179e362f33' "$AUDIT_DIR/08-final-kernel-strings.txt"
          grep -Fq 'v4.2.0-rc2-3d1185d8-p14r1@ReSukiSU' "$AUDIT_DIR/08-final-kernel-strings.txt"

          {
            echo 'FINAL_KERNEL_REEXTRACT=PASS'
            echo 'RAW_RAMDISK_BYTE_IDENTITY=PASS'
            echo 'DECODED_RAMDISK_BYTE_IDENTITY=PASS'
            echo 'BOOT_HEADER_PAGE_IDENTITY=PASS'
            echo 'BOOT_HEADER_V3=PASS'
            echo 'KERNEL_IDENTITY_STRINGS=PASS'
          } | tee "$AUDIT_DIR/08-static-reextract.txt"

      - name: Write final STATIC BOOT PASS result
        shell: bash
        run: |
          set -euo pipefail
          boot="$DIST_DIR/boot.img"
          test -s "$boot"
          boot_sha="$(sha256sum "$boot" | awk '{print $1}')"
          vbmeta_digest="$(tr -d '\r\n' < "$AUDIT_DIR/07-vbmeta-digest.txt")"
          raw_ramdisk_sha="$(sha256sum "$WORK_DIR/final-raw/ramdisk.cpio" | awk '{print $1}')"

          {
            echo 'VEUX_5.4.301_O48_STATIC_BOOT=PASS'
            echo 'DEVICE=veux'
            echo 'ANDROID_BOOT_HEADER=3'
            echo "BOOT_BYTES=$BOOT_PARTITION_SIZE"
            echo "BOOT_SHA256=$boot_sha"
            echo "KERNEL_SHA256=$O47_IMAGE_SHA256"
            echo "RAW_STOCK_RAMDISK_SHA256=$STOCK_RAMDISK_SHA256"
            echo "DECODED_REFERENCE_RAMDISK_SHA256=$DECODED_RAMDISK_SHA256"
            echo "AVB_ORIGINAL_IMAGE_SIZE=$BASE_ORIGINAL_IMAGE_SIZE"
            echo "AVB_VBMETA_DIGEST_SHA256=$vbmeta_digest"
            echo 'AVB_ALGORITHM=NONE'
            echo 'AVB_HASH_ALGORITHM=sha256'
            echo 'AVB_PARTITION_NAME=boot'
            echo 'AVB_VERIFY_IMAGE=PASS'
            echo 'AVB_PROPERTIES_PRESERVED=PASS'
            echo 'PACKAGE_PASS=YES'
            echo 'STATIC_BOOT_PATH_PASS=PASS'
            echo 'DEVICE_PASS=NO'
          } | tee "$DIST_DIR/FINAL-RESULT.txt"

          (
            cd "$DIST_DIR"
            sha256sum boot.img FINAL-RESULT.txt > SHA256SUMS.txt
          )
          (
            cd "$AUDIT_DIR"
            sha256sum ./* | LC_ALL=C sort > SHA256SUMS.txt
          )

      - name: Upload 5.4.301 boot.img
        uses: actions/upload-artifact@v7
        with:
          name: VEUX-5.4.301-ReSukiSU-35157-O48V2-STATIC-BOOT-${{ github.run_id }}
          path: u5-o48-dist/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Record failure diagnostic
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo 'O48V2_STATIC_BOOT=FAIL'
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "HEAD_SHA=$GITHUB_SHA"
            echo "PACKAGE_PASS=YES"
            echo "STATIC_BOOT_PATH_PASS=NO"
            echo "DEVICE_PASS=NO"
          } > "$AUDIT_DIR/99-failure.txt"

      - name: Upload O48 static boot audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VEUX-5.4.301-O48V2-AUDIT-${{ github.run_id }}
          path: u5-o48-audit/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

      - name: Final real STATIC BOOT GREEN gate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          result="$DIST_DIR/FINAL-RESULT.txt"
          test -s "$result"
          grep -Fxq 'VEUX_5.4.301_O48_STATIC_BOOT=PASS' "$result"
          grep -Fxq 'DEVICE=veux' "$result"
          grep -Fxq 'ANDROID_BOOT_HEADER=3' "$result"
          grep -Fxq 'AVB_VERIFY_IMAGE=PASS' "$result"
          grep -Fxq 'AVB_PROPERTIES_PRESERVED=PASS' "$result"
          grep -Fxq 'PACKAGE_PASS=YES' "$result"
          grep -Fxq 'STATIC_BOOT_PATH_PASS=PASS' "$result"
          grep -Fxq 'DEVICE_PASS=NO' "$result"
          test -s "$DIST_DIR/boot.img"
          test "$(stat -c '%s' "$DIST_DIR/boot.img")" = "$BOOT_PARTITION_SIZE"
          echo 'O48V2_REAL_STATIC_BOOT_GREEN_GATE=PASS'
