        logs=[]
        for step in s:
            if 'run' not in step:continue
            body=step['run']
            if chr(36)+chr(123) in body:raise RuntimeError('UNSAFE_GITHUB_INTERPOLATION_IN_RUN')
            for command in (['bash','-n','-'],['shellcheck','--shell=bash','--severity=warning','-']):
                r=subprocess.run(command,input=body,text=True,capture_output=True)
                if r.returncode:raise RuntimeError('SHELL_SYNTAX_OR_SHELLCHECK:'+step['name']+':'+r.stdout+r.stderr)
            logs.append(step['name']+' BASH_SHELLCHECK_PASS SHA256='+hashlib.sha256(body.encode()).hexdigest())
        pathlib.Path('/tmp/veux-r55d4/R55D4_SHELLCHECK.log').write_text('\n'.join(logs)+'\n')
        print('R55D4_YAML_UNIQUE_KEYS_ACTIONS_INPUTS_SHELLCHECK=PASS')
        PY_R55D4_YAML_AUDIT
    - name: 29 pagemap entry-count / C harness / 17-file Git tests
      run: |
        set -euo pipefail
        python3 -B - <<'PY_R55D4_AST'
        import ast,pathlib
        base=pathlib.Path('/tmp/veux-r55d4')
        for name in ('scripts/r55d4_pagemap.py','tests/test_r55d4_pagemap.py'):
            ast.parse((base/name).read_text('utf-8'))
        print('R55D4_PYTHON_AST_PASS')
        PY_R55D4_AST
        python3 -B -m unittest discover -v -s "$R55_STAGE/tests" -p 'test_r55d4_pagemap.py' 2>&1 | tee "$R55_STAGE/R55D4_TESTS.log"
        grep -Eq '^Ran 29 tests in [0-9.]+s$' "$R55_STAGE/R55D4_TESTS.log"
        grep -Fx 'OK' "$R55_STAGE/R55D4_TESTS.log"
        echo 'R55D4_29_POSITIVE_NEGATIVE_C_AND_GIT_TESTS=PASS'
    - name: Replay pinned R55D3 and port task_mmu pagemap zero-entry on real kernel source
      run: |
        set -euo pipefail
        python3 -B "$R55_STAGE/scripts/r55d4_pagemap.py" \
          --source kernel --base "$R55_STAGE/inputs/R55D3_AUTHENTIC_17FILES.patch" \
          --out "$R55_STAGE/out" 2>&1 | tee "$R55_STAGE/R55D4_REAL_SOURCE.log"
        python3 -B - <<'PY_R55D4_POST'
        import pathlib,json,hashlib
        out=pathlib.Path('/tmp/veux-r55d4/out')
        r=json.loads((out/'R55D4_RESULT.json').read_text())
        assert r['r55d3_input_sha256']=='3218f394c91ca210aaeef8c54d16d628d6a0ba645423cc1828fc635006e03e16'
        assert r['files_total']==17 and r['task_mmu_pagemap_staged'] is True
        assert not r['kernel_compiled'] and not r['flash_allowed']
        p=out/'VEUX_R55D4_SUSFS54_17_FILES_PAGEMAP_NOFLASH.patch'
        assert hashlib.sha256(p.read_bytes()).hexdigest()==r['complete_17_file_patch_sha256']
        print('R55D4_REAL_PINNED_SOURCE_POSTCHECK_PASS')
        PY_R55D4_POST
    - name: Independent clean exact 17-file Git replay
      run: |
        set -euo pipefail
        git -C kernel worktree add --detach "$R55_STAGE/replay" b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
        patch="$R55_STAGE/out/VEUX_R55D4_SUSFS54_17_FILES_PAGEMAP_NOFLASH.patch"
        git -C "$R55_STAGE/replay" apply --check --whitespace=error "$patch"
        git -C "$R55_STAGE/replay" apply --whitespace=error "$patch"
        git -C "$R55_STAGE/replay" add -N -- fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h
        git -C "$R55_STAGE/replay" diff --check
        git -C "$R55_STAGE/replay" apply --reverse --check "$patch"
        python3 -B - <<'PY_R55D4_REPLAY'
        import pathlib,subprocess,hashlib,json,sys
        stage=pathlib.Path('/tmp/veux-r55d4');repo=pathlib.Path('kernel');replay=stage/'replay';out=stage/'out'
        sys.path.insert(0,str(stage/'scripts'))
        import r55d4_pagemap as port
        def cmd(*argv):return subprocess.run(argv,capture_output=True,check=True).stdout
        files=set(cmd('git','-C',str(replay),'diff','--name-only').decode().splitlines())
        assert files==port.EXPECTED,('SCOPE_MISMATCH',sorted(files^port.EXPECTED))
        for f in sorted(files):
            assert hashlib.sha256((repo/f).read_bytes()).digest()==hashlib.sha256((replay/f).read_bytes()).digest(),f
        assert cmd('git','-C',str(replay),'diff','--binary','--no-ext-diff')==(out/port.TOTAL_NAME).read_bytes(),'DIFF_BYTES_NOT_IDENTICAL'
        r=json.loads((out/port.RESULT_NAME).read_text('utf-8'))
        r['source_replay_verified']=True
        (out/port.RESULT_NAME).write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
        print('R55D4_REAL_INDEPENDENT_17_FILE_BYTE_IDENTICAL_REPLAY=PASS')
        PY_R55D4_REPLAY
    - name: Final 17-file source SHA256 scope and NOFLASH gate
      run: |
        set -euo pipefail
        cp "$R55_STAGE/R55D4_ACTIONLINT.log" "$R55_STAGE/R55D4_SHELLCHECK.log" \
           "$R55_STAGE/R55D4_TESTS.log" "$R55_STAGE/R55D4_REAL_SOURCE.log" "$R55_STAGE/out/"
        python3 -B - <<'PY_R55D4_FINAL'
        import pathlib,json,hashlib
        out=pathlib.Path('/tmp/veux-r55d4/out')
        r=json.loads((out/'R55D4_RESULT.json').read_text('utf-8'))
        assert r['source_replay_verified'] is True and r['files_total']==17
        assert r['task_mmu_pagemap_staged'] is True
        for key in ('kernel_compiled','full_susfs_port','baka_su_uapi6_integrated',
                    'nomount_v22_integrated','device_tested','brene_changed',
                    'vendor_changed','boot_ready','flash_allowed','user_repo_modified',
                    'runtime_semantics_review_complete'):
            assert r[key] is False,key
        assert len([p for p in out.iterdir() if p.is_file()])==8
        (out/'SHA256SUMS.txt').write_text(''.join(
            hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n'
            for p in sorted(out.iterdir()) if p.is_file()))
        print('R55D4_FINAL_SCOPE_SHA256_NOFLASH=PASS')
        PY_R55D4_FINAL
        (cd "$R55_STAGE/out" && sha256sum -c SHA256SUMS.txt)
        test -z "$(git -C project status --porcelain --untracked-files=all)"
        echo 'R55D4_USER_REPO_UNCHANGED; NO_KERNEL_BUILD; NO_FLASH'
    - name: Upload source patches and audit reports only
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: VEUX-R55D4-TASK-MMU-PAGEMAP-17FILES-NOFLASH-${{ github.run_id }}
        path: /tmp/veux-r55d4/out/
        retention-days: 14
        if-no-files-found: error
