    - name: Strict actionlint duplicate YAML keys Actions inputs ShellCheck
      run: |
        set -euo pipefail
        archive='project/VEUX_R39_R2_MEMORY_ABI_MAIN.zip'
        printf '%s  %s\n' '745d80b8502a9beea513a2e7a58bb59272539b7508920d235ce2e79741bda528' "$archive" | sha256sum -c -
        unzip -p "$archive" tools/actionlint > "$R55_STAGE/actionlint"
        chmod 0755 "$R55_STAGE/actionlint"
        "$R55_STAGE/actionlint" -version | grep -Fx '1.7.12'
        "$R55_STAGE/actionlint" -color=false -shellcheck='' 'project/.github/workflows/VEUX_R55D4_SUSFS54_TASK_MMU_PAGEMAP_SOURCE_ONLY.yml' > "$R55_STAGE/R55D4_ACTIONLINT.log"
        printf 'R55D4_ACTIONLINT=PASS\n' >> "$R55_STAGE/R55D4_ACTIONLINT.log"
        python3 -B - <<'PY_R55D4_YAML_AUDIT'
        import pathlib,hashlib,subprocess,yaml
        class Unique(yaml.SafeLoader):pass
        def unique(loader,node):
            mapping={}
            for kn,vn in node.value:
                k=loader.construct_object(kn)
                if k in mapping:raise RuntimeError('DUPLICATE_YAML_KEY:'+str(k))
                mapping[k]=loader.construct_object(vn)
            return mapping
        Unique.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,unique)
        w=yaml.load(pathlib.Path('project/.github/workflows/VEUX_R55D4_SUSFS54_TASK_MMU_PAGEMAP_SOURCE_ONLY.yml').read_text('utf-8'),Loader=Unique)
