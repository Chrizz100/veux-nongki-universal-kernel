    if: ${{ github.repository == 'Chrizz100/veux-nongki-universal-kernel' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      R20_MAIN: VEUX_STOCK_54274_SOURCE_RECON_R20_R9_MAIN.zip
      R20_R8_PARENT: VEUX_STOCK_54274_SOURCE_RECON_R20_R8_MAIN.zip
      R20_R8_PARENT_SHA256: c6aed967069096f4ad6f28aae7840ac1e9671e989792e3d6bb849a979cdfdf0d
      R20_R7_PARENT: VEUX_STOCK_54274_SOURCE_RECON_R20_R7_MAIN.zip
      R20_R7_PARENT_SHA256: f6f41961770d54c5e09c90bfdd7ace726308b1b0d2eb7de83a6bb5a03e31021b
      R20_R6_PARENT: VEUX_STOCK_54274_SOURCE_RECON_R20_R6_MAIN.zip
