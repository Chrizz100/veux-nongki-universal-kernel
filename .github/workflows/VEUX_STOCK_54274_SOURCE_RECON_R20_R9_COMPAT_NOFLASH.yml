      PAIR_SHA: 01cb3a8824b7b4caf3e3540274e71abba5ade538
      DONOR_URL: https://github.com/dereference23/kernel_xiaomi_sm6375.git
      DONOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
      CLANG_BRANCH: android11-qpr2-release
      CLANG_TREE: 1c7dcc2e7095197f7a05dff22a875b6b02ed7117
    steps:
      - name: Checkout exact MAIN without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate pinned R20 archive, R19 immutable parent, actionlint and offline tests
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          REPORTS="$RUNNER_TEMP/veux-r20/reports"
          ROOT="$RUNNER_TEMP/veux-r20/main"
          mkdir -p "$REPORTS" "$ROOT"
          printf '%s  %s\n' "$R20_MAIN_SHA256" "$GITHUB_WORKSPACE/$R20_MAIN" | sha256sum --check --strict
          printf '%s  %s\n' "$R20_R8_PARENT_SHA256" "$GITHUB_WORKSPACE/$R20_R8_PARENT" | sha256sum --check --strict
          printf '%s  %s\n' "$R20_R7_PARENT_SHA256" "$GITHUB_WORKSPACE/$R20_R7_PARENT" | sha256sum --check --strict
          printf '%s  %s\n' "$R20_R6_PARENT_SHA256" "$GITHUB_WORKSPACE/$R20_R6_PARENT" | sha256sum --check --strict
          printf '%s  %s\n' "$R20_R5_PARENT_SHA256" "$GITHUB_WORKSPACE/$R20_R5_PARENT" | sha256sum --check --strict
          printf '%s  %s\n' "$R20_R4_PARENT_SHA256" "$GITHUB_WORKSPACE/$R20_R4_PARENT" | sha256sum --check --strict
          printf '%s  %s\n' "$R20_R3_PARENT_SHA256" "$GITHUB_WORKSPACE/$R20_R3_PARENT" | sha256sum --check --strict
          printf '%s  %s\n' "$R20_R2_PARENT_SHA256" "$GITHUB_WORKSPACE/$R20_R2_PARENT" | sha256sum --check --strict
          printf '%s  %s\n' "$R19_MAIN_SHA256" "$GITHUB_WORKSPACE/$R19_MAIN" | sha256sum --check --strict
          python3 -I - "$GITHUB_WORKSPACE/$R20_MAIN" "$ROOT" <<'PY_R20_ARCHIVE'
          import hashlib,json,stat,sys
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          archive,target=map(Path,sys.argv[1:]);
          if not archive.is_file() or archive.is_symlink() or any(target.iterdir()):
              raise ValueError('R20_INVALID_ARCHIVE_OR_DEST')
          with ZipFile(archive) as z:
              entries=z.infolist(); names=[x.filename for x in entries]
              if len(entries)<4 or len(entries)>45 or len(names)!=len(set(names)) or z.testzip() or sum(x.file_size for x in entries)>3_500_000:
                  raise ValueError('R20_CORRUPT_OR_OVERSIZED_ARCHIVE')
              manifest=json.loads(z.read('MANIFEST_SHA256.json'))
              if (manifest.get('schema')!='VEUX_R20_R9_ORIGINAL_QUALCOMM_SCHEDUTIL_NOFLASH' or
                  manifest.get('r19_parent_sha256')!='ac894f380411d0df694688cb108daed98d7bcf3330262c051af09705b7b7fdaa' or
                  manifest.get('r20_r2_parent_sha256')!='338b6f4aedd5fbfb0b4e5559b3b4cc37cc73348532aeff8f5ccc50cc1bc031e6' or
                  manifest.get('r20_r3_parent_sha256')!='a1e60f69678bac02add2a954d29dc91a95e1f92979347b09409e13072ebe1778' or
                  manifest.get('r20_r4_original_idle_header_git_blob')!='22873d276be60e5d4200e7acfd5b7015191005a3' or
                  manifest.get('r20_r4_parent_sha256')!='4d26417eba494a4531a2a5775715d5a30117f28a54edd3b33c1b72d07357d6d7' or
                  manifest.get('r20_r4_run_artifact_sha256')!='0dabbaf2f4303e85b92db8e9155ef870edf3483473e56f97eafb95b2bad23e7b' or
                  manifest.get('upstream_r19_git_blob')!='bd8d4b47ecfa6779279d5ebc6e3bd3203777fca5' or
                  manifest.get('r20_r5_real_compiler_success_not_yet_verified') is not True or
                  manifest.get('r20_r5_affected_scheduler_callbacks')!=['select_task_rq_idle','select_task_rq_dl','select_task_rq_stop'] or
                  manifest.get('r20_r5_parent_sha256')!='a3ff127c59035d3c237ed17f2ba0214b3fec77c5605779bc2fda46683cbe3e3d' or
                  manifest.get('r20_r5_run_artifact_sha256')!='753bdd310c0441559e51129aa734ed28e78e7c2b10814ca5bad575a755c62d56' or
                  manifest.get('r20_r6_sched_header_pair_blob')!='79b175a65e0ebda59a5ccc13691b454b347e7701' or
                  manifest.get('r20_r6_sched_header_donor_blob')!='15e50442697e1e0e655cb970130d9c14af56b049' or
                  manifest.get('r20_r6_exact_macro')!='#define SCHED_DL_FLAGS (SCHED_FLAG_RECLAIM | SCHED_FLAG_DL_OVERRUN | SCHED_FLAG_SUGOV)' or
                  manifest.get('r20_r6_real_compiler_success_not_yet_verified') is not True or
                  manifest.get('r20_r6_parent_sha256')!='82d8e381b891a9cbf586005c579354ac69869b1ad7087fc99ec005779c567ffa' or
                  manifest.get('r20_r6_artifact_sha256')!='f2de0b692ab93ed8a22b47fee98ccf3609027e077f051e8dec96d6278add04ed' or
                  manifest.get('r20_r6_targets_8_of_8_github_pass') is not True or
                  manifest.get('r20_r6_regression_12_of_12_github_pass') is not True or
                  manifest.get('r20_r7_pair_topology_git_blob')!='d2b122897c7e473fb837cc9629dba6ca4197f463' or
                  manifest.get('r20_r7_donor_topology_git_blob')!='571adb2ded0abd2013569d01be797df45b59db76' or
                  manifest.get('r20_r7_modified_function_names')!=['build_perf_domains','init_sched_groups_capacity'] or
                  manifest.get('r20_r7_target_count')!=9 or
                  manifest.get('r20_r7_compiler_green_not_yet_verified') is not True or
                  manifest.get('r20_r7_parent_sha256')!='f6f41961770d54c5e09c90bfdd7ace726308b1b0d2eb7de83a6bb5a03e31021b' or
                  manifest.get('r20_r7_artifact_sha256')!='afac89999c535228028b446a2234ff354c4c4b529af2b83411911f4807bcb355' or
                  manifest.get('r20_r7_objects_9_of_9_github_pass') is not True or
                  manifest.get('r20_r7_regressions_12_of_12_github_pass') is not True or
                  manifest.get('r20_r8_donor_debug_git_blob')!='76f74c238a5a2dada979f0e779ba31dcf1c49b0f' or
                  manifest.get('r20_r8_pair_debug_git_blob')!='5bf8939658bf46022e0dcaae3f600c7526ff77ba' or
                  manifest.get('r20_r8_target_count')!=10 or
                  manifest.get('r20_r8_parent_sha256')!='c6aed967069096f4ad6f28aae7840ac1e9671e989792e3d6bb849a979cdfdf0d' or
                  manifest.get('r20_r8_artifact_sha256')!='6fa5dd6685ac14777ee5b2ff87164c65fa4630e8e07a6885618e01c141c18e4d' or
                  manifest.get('r20_r8_objects_10_of_10_github_pass') is not True or
                  manifest.get('r20_r8_regressions_12_of_12_github_pass') is not True or
                  manifest.get('r20_r9_donor_schedutil_git_blob')!='6373d2b03dd6a1b6c993d462e463336ca9ce4f8d' or
                  manifest.get('r20_r9_pair_schedutil_git_blob')!='70de343383847cabf05d6a5f1773d494c32af0bd' or
                  manifest.get('r20_r9_target_count')!=11 or
                  manifest.get('r20_r9_offline_only') is not True or
                  manifest.get('r20_r9_keep_going_diagnostic_enabled') is not True or
                  manifest.get('r20_r8_offline_only') is not True or
                  any(manifest.get(x) is not False for x in ('flash_allowed','boot_verified','oem_abi_verified','production_patch_approved','stock_kernel_reproduced'))):
                  raise ValueError('R20_UNSAFE_OR_UNPINNED_MANIFEST')
              if hashlib.sha256(z.read('reference/R20_R4_MAIN_ORIGINAL.zip')).hexdigest()!='4d26417eba494a4531a2a5775715d5a30117f28a54edd3b33c1b72d07357d6d7':
                  raise ValueError('R20_R5_PINNED_R4_ARCHIVE_MISMATCH')
              if hashlib.sha256(z.read('reference/R20_R4_RUN_42180147079_ORIGINALREPORTS.zip')).hexdigest()!='0dabbaf2f4303e85b92db8e9155ef870edf3483473e56f97eafb95b2bad23e7b':
                  raise ValueError('R20_R5_PINNED_R4_ORIGINAL_LOGS_MISMATCH')
              if hashlib.sha256(z.read('reference/R20_R5_MAIN_ORIGINAL.zip')).hexdigest()!='a3ff127c59035d3c237ed17f2ba0214b3fec77c5605779bc2fda46683cbe3e3d':
                  raise ValueError('R20_R6_PINNED_R5_ARCHIVE_MISMATCH')
              if hashlib.sha256(z.read('reference/R20_R5_RUN_42183004964_ORIGINALREPORTS.zip')).hexdigest()!='753bdd310c0441559e51129aa734ed28e78e7c2b10814ca5bad575a755c62d56':
                  raise ValueError('R20_R6_PINNED_R5_ORIGINAL_LOGS_MISMATCH')
              if hashlib.sha256(z.read('reference/R20_R6_MAIN_ORIGINAL.zip')).hexdigest()!='82d8e381b891a9cbf586005c579354ac69869b1ad7087fc99ec005779c567ffa':
                  raise ValueError('R20_R7_PINNED_R6_ARCHIVE_MISMATCH')
              if hashlib.sha256(z.read('reference/R20_R6_RUN_42184977509_ORIGINALREPORTS.zip')).hexdigest()!='f2de0b692ab93ed8a22b47fee98ccf3609027e077f051e8dec96d6278add04ed':
                  raise ValueError('R20_R7_PINNED_R6_ORIGINAL_LOGS_MISMATCH')
              if hashlib.sha256(z.read('reference/R20_R7_MAIN_ORIGINAL.zip')).hexdigest()!='f6f41961770d54c5e09c90bfdd7ace726308b1b0d2eb7de83a6bb5a03e31021b':
                  raise ValueError('R20_R8_PINNED_R7_PARENT_MISMATCH')
              if hashlib.sha256(z.read('reference/R20_R7_RUN_42187535839_ORIGINALREPORTS.zip')).hexdigest()!='afac89999c535228028b446a2234ff354c4c4b529af2b83411911f4807bcb355':
                  raise ValueError('R20_R8_PINNED_R7_LOG_MISMATCH')
              if hashlib.sha256(z.read('reference/R20_R8_MAIN_ORIGINAL.zip')).hexdigest()!='c6aed967069096f4ad6f28aae7840ac1e9671e989792e3d6bb849a979cdfdf0d':
                  raise ValueError('R20_R9_PINNED_R8_PARENT_MISMATCH')
              if hashlib.sha256(z.read('reference/R20_R8_RUN_42191232502_ORIGINALREPORTS.zip')).hexdigest()!='6fa5dd6685ac14777ee5b2ff87164c65fa4630e8e07a6885618e01c141c18e4d':
                  raise ValueError('R20_R9_PINNED_R8_LOG_MISMATCH')
              if set(names) != set(manifest['files'])|{'MANIFEST_SHA256.json'}:
                  raise ValueError('R20_UNEXPECTED_FILESET')
              for entry in entries:
                  name=entry.filename; rel=PurePosixPath(name)
                  if (entry.is_dir() or rel.is_absolute() or '..' in rel.parts or
                      str(rel)!=name or '\\' in name or stat.S_IFMT(entry.external_attr>>16) not in (0,stat.S_IFREG)):
                      raise ValueError('R20_UNSAFE_ARCHIVE_MEMBER:'+name)
                  data=z.read(name)
                  if name!='MANIFEST_SHA256.json' and hashlib.sha256(data).hexdigest()!=manifest['files'][name]:
                      raise ValueError('R20_FILE_HASH_MISMATCH:'+name)
                  path=target.joinpath(*rel.parts);path.parent.mkdir(exist_ok=True,parents=True);path.write_bytes(data)
          print('R20_MANIFEST_AND_PINNED_R19_PARENT=PASS; FLASH=NO')
          PY_R20_ARCHIVE
          python3 -B -m unittest discover -s "$ROOT/tools" -p 'test_r20_*.py' -v 2>&1 | tee "$REPORTS/R20_OFFLINE_TESTS.log"
          export GOBIN="$RUNNER_TEMP/veux-r20-actionlint"
          mkdir -p "$GOBIN"
          GOTOOLCHAIN=local go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$GOBIN/actionlint" .github/workflows/VEUX_STOCK_54274_SOURCE_RECON_R20_R9_COMPAT_NOFLASH.yml
          echo 'R20_R9_ACTIONLINT=PASS; ONLY CI STATIC PREFLIGHT; NOT A KERNEL BUILD'

      - name: Replay the immutable R19 foundation and R17 twelve real object tests
        shell: bash
        timeout-minutes: 50
        run: |
          set -euo pipefail
          python3 -B "$RUNNER_TEMP/veux-r20/main/tools/r20_replay.py" \
            --phase foundations \
            --workflow "$GITHUB_WORKSPACE/.github/workflows/VEUX_STOCK_54274_SOURCE_RECON_R19_NOFLASH.yml" \
            --workspace "$GITHUB_WORKSPACE" \
            --reports "$RUNNER_TEMP/veux-r20/reports"
          echo 'R20_R17_BASELINE_RECOMPILED_IN_R19_REPLAY=YES; NO FLASH'

      - name: Stage R19 pinned whole-file inputs and R20 source-coherent trial only in disposable source tree
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-r15"
          PAIR="$ROOT/header-source"
          DONOR="$ROOT/donor"
          TRIAL="$ROOT/walt-trial"
          R19="$RUNNER_TEMP/veux-r19/main"
          R20="$RUNNER_TEMP/veux-r20/main"
          REPORTS19="$RUNNER_TEMP/veux-r18/reports"
          REPORTS20="$RUNNER_TEMP/veux-r20/reports"
          mkdir -p "$REPORTS19" "$REPORTS20"
          python3 -B "$R19/tools/r19_qualcomm_surface.py" verify --root "$R19"
          git -C "$PAIR" sparse-checkout add '/kernel/sched/core.c' '/kernel/sched/pelt.h' '/kernel/sched/cpufreq_schedutil.c' '/mm/vmscan.c'
          test "$(git -C "$PAIR" rev-parse HEAD)" = "$PAIR_SHA"
          test -z "$(git -C "$PAIR" status --porcelain)"
          python3 -B "$R19/tools/r19_qualcomm_surface.py" stage --root "$R19" --donor "$DONOR" --pair "$PAIR" --trial "$TRIAL" --reports "$REPORTS19"
          python3 -B "$R20/tools/r20_compat.py" stage \
            --pair "$PAIR" --donor "$DONOR" --trial "$TRIAL" --reports "$REPORTS20"
          test -z "$(git -C "$DONOR" status --porcelain)"
          test -z "$(git -C "$PAIR" status --porcelain)"
          echo 'R20_TRUE_UPSTREAM_BLOBS_IN_ISOLATED_TRIAL=STAGED; FLASH=NO'

      - name: Compile eleven real scheduler MM WALT Schedutil objects (Clang)
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-r15"
          export PATH="$ROOT/aosp-clang/clang-r383902b1/bin:$PATH"
          python3 -B "$RUNNER_TEMP/veux-r20/main/tools/r20_compat.py" compile \
            --phase targets --trial "$ROOT/walt-trial" --build "$ROOT/build" \
            --reports "$RUNNER_TEMP/veux-r20/reports"

      - name: Recompile all 12 R17 component and runtime objects against R20 headers
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-r15"
          export PATH="$ROOT/aosp-clang/clang-r383902b1/bin:$PATH"
          python3 -B "$RUNNER_TEMP/veux-r20/main/tools/r20_compat.py" compile \
            --phase r17-regression --trial "$ROOT/walt-trial" --build "$ROOT/build" \
            --reports "$RUNNER_TEMP/veux-r20/reports"

      - name: Attempt full Image dtbs build and OEM ABI only after all 23 object compiles passed
        shell: bash
        timeout-minutes: 65
        run: |
          set -euo pipefail
          python3 -B "$RUNNER_TEMP/veux-r20/main/tools/r20_replay.py" \
            --phase full \
            --workflow "$GITHUB_WORKSPACE/.github/workflows/VEUX_STOCK_54274_SOURCE_RECON_R19_NOFLASH.yml" \
            --workspace "$GITHUB_WORKSPACE" \
            --reports "$RUNNER_TEMP/veux-r20/reports"
          echo 'R20_FULL_LINK_ABI_TRIAL_REACHED=YES; FLASH_AND_DEVICE_BOOT=NOT_VERIFIED'

      - name: Collect wider compiler failures with GNU make keep-going after failed full build - NOFLASH
        if: failure()
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          REPORTS="$RUNNER_TEMP/veux-r20/reports"
          ROOT="$RUNNER_TEMP/veux-r15"
          mkdir -p "$REPORTS"
          # Do not attempt another build if foundational compiler prerequisites failed.
          if ! python3 -I - "$REPORTS" <<'PY_R9_DIAG_GATE'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          try:
              good=all(json.loads((p/n).read_text()).get('success') is True for n in
                  ('R20_TARGET_COMPILERS.json','R20_R17_REGRESSION_COMPILERS.json'))
          except (OSError,ValueError):
              good=False
          if not good:
              print('R20_R9_KEEPGOING=SKIPPED_BAD_OR_MISSING_PREREQUISITE')
              raise SystemExit(1)
          print('R20_R9_KEEPGOING_PREREQUISITES=PASS; DIAGNOSTIC_ONLY')
          PY_R9_DIAG_GATE
          then
            exit 0
          fi
          export PATH="$ROOT/aosp-clang/clang-r383902b1/bin:$PATH"
          set +e
          timeout 650s make -k -C "$ROOT/walt-trial" O="$ROOT/build" ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 -j2 Image dtbs \
            > "$REPORTS/R20_R9_KEEPGOING_BUILD.log" 2>&1
          RC=$?
          set -e
          printf '%s\n' "$RC" > "$REPORTS/R20_R9_KEEPGOING_RC.txt"
          grep -Ei 'error:|fatal error:|undefined reference|no rule to make target|ld.lld: error:' \
            "$REPORTS/R20_R9_KEEPGOING_BUILD.log" > "$REPORTS/R20_R9_KEEPGOING_ALL_ERRORS.txt" || true
          echo "R20_R9_KEEPGOING_DIAGNOSTIC_RC=$RC; ORIGINAL_FULL_BUILD_GATE_REMAINS_FAILED; NOFLASH"
          tail -n 110 "$REPORTS/R20_R9_KEEPGOING_ALL_ERRORS.txt" || true

      - name: Always publish R20 gate status without any kernel Image, boot img, module or flashing ZIP
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPORTS="$RUNNER_TEMP/veux-r20/reports"
          mkdir -p "$REPORTS"
          python3 -I - "$REPORTS" <<'PY_R20_SUMMARY'
          import json,sys
          from pathlib import Path
          r=Path(sys.argv[1]); output={
              'schema':'VEUX_R20_FAIL_CLOSED_GATE',
              'stock_kernel_reproduced':False,'flash_allowed':False,
              'boot_verified':False,'device_verified':False,
              'oem_abi_verified':False,'production_patch_approved':False,
              'compiler_11_of_11_verified':False,'r17_12_of_12_regression_verified':False,
              'full_link_attempt_verified':False,'full_link_proven':False,
          }
          for key, name in [('compiler_11_of_11_verified','R20_TARGET_COMPILERS.json'),('r17_12_of_12_regression_verified','R20_R17_REGRESSION_COMPILERS.json')]:
              p=r/name
              if p.exists():
                  try:output[key]=json.loads(p.read_text()).get('success') is True
                  except (OSError,ValueError):pass
          p=r/'R20_FULL_LINK_EXECUTION.json'
          if p.exists():
              try:output['full_link_attempt_verified']=len(json.loads(p.read_text()).get('steps',[]))==1
              except (OSError,ValueError):pass
          q=r.parent.parent/'veux-r18/reports/R18_FULL_LINK_AND_ABI.json'
          if q.exists():
              try:output['full_link_proven']=json.loads(q.read_text()).get('linked_image_and_vmlinux') is True
              except (OSError,ValueError):pass
          (r/'R20_GATE_STATUS_NOFLASH.json').write_text(json.dumps(output,indent=2,sort_keys=True)+'\n')
          print('R20_GATES='+json.dumps(output,sort_keys=True))
          PY_R20_SUMMARY
          for f in "$RUNNER_TEMP/veux-r15/reports/R17_PINNED_HRTIMER_COMPILER_SUMMARY.json" "$RUNNER_TEMP/veux-r15/reports/R15_TWELVE_OBJECTS_SUMMARY.json"; do
            if [ -s "$f" ]; then cp "$f" "$REPORTS/ORIGINAL_$(basename "$f")"; fi
          done

      - name: Upload only logs and JSON provenance NOFLASH
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VEUX-STOCK-54274-R20-R9-SOURCE-AND-ABI-TRIAL-NOFLASH-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/veux-r20/reports/
            ${{ runner.temp }}/veux-r18/reports/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
