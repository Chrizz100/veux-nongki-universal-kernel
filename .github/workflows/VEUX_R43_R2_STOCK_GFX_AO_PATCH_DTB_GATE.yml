              if f.is_file() and f.name!='SHA256SUMS.txt':
                  lines.append(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name)
          (p/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as summary:
              summary.write('## R43-R2 AO: '+state+'\n\n')
              report=p/'R43_BERICHT_DE.txt'
              if state=='success' and report.is_file():summary.write(report.read_text())
              else:
