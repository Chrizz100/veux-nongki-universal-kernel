name: VEUX - CPU frequency interface repair - 5.4.274
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: veux-v4-daily-upstream-candidate-main
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  LC_ALL: C.UTF-8
jobs:
  integrate:
    name: Restore CPU-limit driver and validate kernel plus RMNET
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
    - name: Checkout current main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: main
        fetch-depth: 1
        persist-credentials: false
    - name: Validate repository and bounded dependency setup
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Chrizz100/veux-nongki-universal-kernel
        test "$GITHUB_REF" = refs/heads/main
        test -z "$(git status --porcelain --untracked-files=all)"
        git checkout -B main "$(git rev-parse HEAD)"
        echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        missing=()
        for package in bc binutils bison build-essential ca-certificates curl dwarves file flex git jq libelf-dev libncurses-dev libssl-dev perl python3 python3-venv rsync unzip zip xz-utils zstd; do
          if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -qx 'install ok installed'; then
            missing+=("$package")
          fi
        done
        if ((${#missing[@]})); then
          timeout --kill-after=15s 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          timeout --kill-after=15s 240s sudo apt-get -o DPkg::Lock::Timeout=60 install -y --no-install-recommends "${missing[@]}"
        fi
        python3 -m venv "$RUNNER_TEMP/veux-python"
        PY="$RUNNER_TEMP/veux-python/bin/python"
        timeout --kill-after=10s 180s "$PY" -m pip install --disable-pip-version-check --retries 2 --timeout 30 ruamel.yaml==0.19.1 PyYAML==6.0.3
        "$PY" -c 'import ruamel.yaml, yaml'
        echo "PY=$PY" >> "$GITHUB_ENV"
        echo "TOOLS=$RUNNER_TEMP/veux-performance-implementation/tooling" >> "$GITHUB_ENV"
        echo "PAYLOAD=$RUNNER_TEMP/veux-performance-implementation/payload" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/veux-performance-report"
      timeout-minutes: 12
    - name: Unpack reviewed CPU-limit implementation outside repository
      shell: bash
      run: |
        set -euo pipefail
        "$PY" - <<'PYCODE'
        import base64,gzip,json,os
        from pathlib import Path,PurePosixPath
        encoded = ''
        raw=gzip.decompress(base64.b64decode(encoded,validate=True))
        if len(raw)>500000:raise ValueError('implementation payload exceeds limit')
        data=json.loads(raw)
        expected={
         'payload/common/scripts/veux_perf_compat.py',
         'payload/common/scripts/test_veux_perf_compat.py',
         'tooling/migrate.py','tooling/test_migrate.py','tooling/ci.py'}
        if data.get('format')!=1 or set(data.get('files',{}))!=expected:raise ValueError('implementation file set changed')
        root=Path(os.environ['RUNNER_TEMP'])/'veux-performance-implementation'
        root.mkdir(exist_ok=False)
        for name,content in data['files'].items():
         rel=PurePosixPath(name)
         if rel.is_absolute() or '..' in rel.parts or '\\' in name:raise ValueError('unsafe path')
         blob=base64.b64decode(content,validate=True)
         p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(blob)
        print('IMPLEMENTATION_UNPACKED=YES; REPOSITORY_CHANGED=NO')
        PYCODE
    - name: Run eight existing suites and structural migration tests before edits
      shell: bash
      run: |
        set -euo pipefail
        "$PY" "$TOOLS/ci.py" tests 2>&1 | tee "$RUNNER_TEMP/veux-performance-report/baseline-tests.log"
        "$PY" "$TOOLS/test_migrate.py" "$GITHUB_WORKSPACE" "$PAYLOAD" 2>&1 | tee "$RUNNER_TEMP/veux-performance-report/migration-tests.log"
        test -z "$(git status --porcelain --untracked-files=all)"
    - name: Apply four-file integration and prove repeatability and exact scope
      shell: bash
      run: |
        set -euo pipefail
        "$PY" "$TOOLS/migrate.py" "$GITHUB_WORKSPACE" "$PAYLOAD" > "$RUNNER_TEMP/veux-performance-files.txt"
        "$PY" "$TOOLS/ci.py" syntax
        "$PY" - <<'PY'
        import hashlib,os,sys
        from pathlib import Path
        sys.path.insert(0,os.environ['TOOLS'])
        import migrate
        root=Path.cwd();payload=Path(os.environ['PAYLOAD'])
        names=(Path(os.environ['RUNNER_TEMP'])/'veux-performance-files.txt').read_text().splitlines()
        before={n:(root/n).read_bytes() for n in names}
        if migrate.apply(root,payload)!=names:raise ValueError('migration scope drift')
        if before!={n:(root/n).read_bytes() for n in names}:raise ValueError('repeated migration changed files')
        print('MIGRATION_REPEAT=IDENTICAL; APPROVED_PATHS='+str(len(names)))
        PY
        git diff --check
        "$PY" - <<'PY'
        import os,subprocess
        from pathlib import Path
        expected=set((Path(os.environ['RUNNER_TEMP'])/'veux-performance-files.txt').read_text().splitlines())
        changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
        changed.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
        if not changed<=expected:raise ValueError('unexpected file scope: '+str(changed-expected))
        if any(not Path(n).is_file() for n in expected):raise ValueError('required source missing')
        print('SCOPE=4_APPROVED_FILES; NO_WORKFLOW_WRITE; NO_DELETIONS')
        PY
    - name: Run existing and new regression suites twice
      shell: bash
      run: |
        set -euo pipefail
        for pass in 1 2; do
          "$PY" "$TOOLS/ci.py" tests perf 2>&1 | tee "$RUNNER_TEMP/veux-performance-report/updated-tests-$pass.log"
        done
    - name: Create local tested source commit - do not push yet
      shell: bash
      run: |
        set -euo pipefail
        mapfile -t paths < "$RUNNER_TEMP/veux-performance-files.txt"
        git add -- "${paths[@]}"
        git diff --cached --check
        test "$(git diff --cached --name-only | wc -l)" -le 4
        if ! git diff --cached --quiet; then
        git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Restore built-in MSM CPU limits with targeted precompile and same-build proof [skip ci]'
        fi
        echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        git diff "$BASE_SHA" HEAD -- "${paths[@]}" > "$RUNNER_TEMP/veux-performance-report/SOURCE.patch"
        test -z "$(git status --porcelain --untracked-files=all)"
    - name: Reconstruct saved candidate using the existing production stages
      shell: bash
      run: |
        set -euo pipefail
        "$PY" "$TOOLS/ci.py" bundle 2>&1 | tee "$RUNNER_TEMP/veux-performance-report/candidate-bundle.log"
      timeout-minutes: 15
    - name: Precompile CPU-limit driver then build and validate 5.4.274 with RMNET
      shell: bash
      run: |
        set -euo pipefail
        "$PY" -u common/scripts/veux_release_device.py worker \
          --kernel 5.4.274 --bundle "$RUNNER_TEMP/veux-targets" \
          --work "$RUNNER_TEMP/veux-builds/5.4.274" \
          --public "$RUNNER_TEMP/veux-public/5.4.274" \
          --overlays "$RUNNER_TEMP/veux-overlays" --jobs "$(nproc)" \
          2>&1 | tee "$RUNNER_TEMP/veux-performance-report/build.log"
        "$PY" "$TOOLS/ci.py" verify
        test -z "$(git status --porcelain --untracked-files=all)"
      id: kernel
      timeout-minutes: 65
    - name: Retain validated 5.4.274 candidate before source push
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.kernel.outputs.artifact_name }}_CPUlimits_${{ github.run_id }}
        path: ${{ runner.temp }}/veux-public/5.4.274/
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
    - name: Push four source files only after all compile and package gates
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$BUILD_SHA"
        test -z "$(git status --porcelain --untracked-files=all)"
        remote_head="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
        if [ "$remote_head" != "$BASE_SHA" ]; then
          echo '::error::main changed during validation; candidate artifacts retained, no repository push'
          exit 1
        fi
        AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
        echo "::add-mask::$AUTH_HEADER"
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
        export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH_HEADER"
        git push origin HEAD:refs/heads/main
        printf 'CPU_LIMITS_REPAIR_COMMIT=%s\nCI_PASS=YES\nDEVICE_PASS=NO\nCURRENT_PROMOTION=NO\n' "$BUILD_SHA" | tee "$RUNNER_TEMP/veux-performance-report/FINAL.txt"
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Preserve test and build evidence on success or failure
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: VEUX-CPUlimits-Evidence-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/veux-performance-report/
          ${{ runner.temp }}/veux-builds/diagnostics/5.4.274/
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 30
