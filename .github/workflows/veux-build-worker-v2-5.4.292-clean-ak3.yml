name: VEUX Build Worker V2 - 5.4.292 Compile + Clean AK3

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: veux-build-worker-v2-292-ak3-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: Chrizz100/veux-nongki-universal-kernel
  KERNEL: '5.4.292'
  PROFILE: lineages/5.4.292/build.yml
  O51_AUTHORITY: .github/workflows/veux-u6-o51-v3-resukisu-35158-repair-274-293-complete-all-six.yml
  O51_AUTHORITY_BLOB: 6413bd99fa38a5aa030403bb60a5935980dca32d
  PORT_HELPER: lineages/5.4.292/GOLDEN_PORT_V1.py
  PORT_HELPER_SHA256: c26e488c0f97f7bc1e46ae1fb5329c06f18ca48dd1ecc56bc3c2da01eb2bfcc5
  LOCAL_STAGE: lineages/5.4.292/LOCAL_TARGET_V1.py
  LOCAL_STAGE_SHA256: feb932bb50728702fc5edd6a8a701eea2dc3bf9b2179173244e9be57874a57c9

  SOURCE_COMMIT: fb3bbb10bc0480282c01b88ccaf39c0145cd9f51
  RESUKISU_BASE_COMMIT: 6d18926ae6eeb571a04c1ce7552c324d606fa9d8
  RESUKISU_BASE_VERSION: '35158'
  RESUKISU_COMMIT: 9be0f347f38e790c846915bd5f9c24b337f85c4e
  RESUKISU_VERSION: '35170'
  RESUKISU_UAPI: '4'
  SUSFS_COMMIT: 04a9d713106191ba98be680bd7ad9547ab1de964
  SUSFS_VERSION: v2.3.0
  NOMOUNT_COMMIT: b8d268353b4e7ecc53c67d1816a626b7d6579201
  NOMOUNT_VERSION: 2.0.0
  AK3_REPO: https://github.com/osm0sis/AnyKernel3.git
  AK3_COMMIT: af770f7b16cf8f8eb7c68614b2a693b3b361c90c
  RELEASE_NAME: VEUX-5.4.292-ReSukiSU35170-SUSFS2.3-NoMount2.0-AK3.zip

jobs:
  preflight:
    name: 5.4.292 local-target preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      status: ${{ steps.gate.outputs.status }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install parser
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' || python3 -m pip install --user PyYAML
          import yaml
          print(f"PyYAML={yaml.__version__}")
          PY

      - name: Validate local snapshots and candidate profile
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test -f "$PROFILE"
          test -f "$O51_AUTHORITY"
          test -f "$PORT_HELPER"
          test -f "$LOCAL_STAGE"
          test "$(git hash-object "$O51_AUTHORITY")" = "$O51_AUTHORITY_BLOB"
          test "$(sha256sum "$PORT_HELPER" | awk '{print $1}')" = "$PORT_HELPER_SHA256"
          test "$(sha256sum "$LOCAL_STAGE" | awk '{print $1}')" = "$LOCAL_STAGE_SHA256"

          python3 -m py_compile "$LOCAL_STAGE"
          python3 "$LOCAL_STAGE" selftest
          python3 common/scripts/verify_local_snapshots.py --repo-root "$GITHUB_WORKSPACE"

          python3 - "$PROFILE" <<'PY'
          from pathlib import Path
          import sys, yaml
          p = yaml.safe_load(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert p["kernel"] == "5.4.292"
          assert p["enabled"] is True
          assert p["baseline"]["port_status"] == "candidate"
          rs = p["features"]["resukisu"]
          sf = p["features"]["susfs"]
          nm = p["features"]["nomount"]
          assert rs == {
              "enabled": True,
              "version": "35170",
              "commit": "9be0f347f38e790c846915bd5f9c24b337f85c4e",
              "uapi": 4,
          }
          assert sf["enabled"] is True
          assert str(sf["version"]) == "2.3.0"
          assert sf["commit"] == "04a9d713106191ba98be680bd7ad9547ab1de964"
          assert nm["enabled"] is True
          assert str(nm["version"]) == "2.0.0"
          assert nm["commit"] == "b8d268353b4e7ecc53c67d1816a626b7d6579201"
          assert p["validation"]["compile"] is True
          assert p["validation"]["device"] is False
          print("PROFILE_292_LOCAL_TARGET=PASS")
          PY

          python3 -m py_compile "$PORT_HELPER"
          python3 "$PORT_HELPER" selftest
          echo "status=PASS" >> "$GITHUB_OUTPUT"
          echo "LOCAL_292_PREFLIGHT=PASS"

  compile:
    name: Build real 5.4.292 Image
    needs: preflight
    if: needs.preflight.outputs.status == 'PASS'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl dwarves flex git \
            libelf-dev libncurses-dev libssl-dev perl python3 python3-yaml \
            rsync unzip zip xz-utils zstd
          test "$(sha256sum "$LOCAL_STAGE" | awk '{print $1}')" = "$LOCAL_STAGE_SHA256"
          python3 common/scripts/verify_local_snapshots.py --repo-root "$GITHUB_WORKSPACE"

      - name: Extract exact O51 baseline replayer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$O51_AUTHORITY")" = "$O51_AUTHORITY_BLOB"

          python3 - "$O51_AUTHORITY" "$RUNNER_TEMP/o51_replay.py" <<'PY'
          from pathlib import Path
          import sys, yaml
          src = Path(sys.argv[1])
          out = Path(sys.argv[2])
          doc = yaml.safe_load(src.read_text(encoding="utf-8"))
          steps = next(iter(doc["jobs"].values()))["steps"]
          step = next(
              s for s in steps
              if s.get("name") == "Write and self-test fail-closed authority replayer"
          )
          run = str(step["run"])
          start = 'cat > "$RUNNER_TEMP/o51_replay.py" <<\'PY\'\n'
          if run.count(start) != 1:
              raise SystemExit(f"O51 replayer start marker count={run.count(start)}")
          a = run.index(start) + len(start)
          ends = [x for x in (run.find("\n          PY\n", a), run.find("\nPY\n", a)) if x >= 0]
          if not ends:
              raise SystemExit("O51 replayer end marker missing")
          b = min(ends)
          code = run[a:b]
          lines = code.splitlines()
          if lines and all((not x.strip()) or x.startswith("          ") for x in lines):
              code = "\n".join(x[10:] if x.startswith("          ") else x for x in lines) + "\n"
          compile(code, str(out), "exec")
          out.write_text(code, encoding="utf-8")
          print("O51_REPLAYER_EXTRACTION=PASS")
          PY

          python3 -m py_compile "$RUNNER_TEMP/o51_replay.py"
          python3 "$RUNNER_TEMP/o51_replay.py" --selftest

      - name: Reconstruct proven 5.4.292 baseline workspace
        shell: bash
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/worker-292-baseline"
          STATE="$RUNNER_TEMP/worker-292-state"
          rm -rf "$BASE" "$STATE"
          mkdir -p "$BASE" "$STATE"

          python3 "$RUNNER_TEMP/o51_replay.py" \
            --kernel 5.4.292 \
            --project-root "$GITHUB_WORKSPACE" \
            --aggregate "$BASE" \
            --state-root "$STATE" \
            --sha "$GITHUB_SHA"

          test -s "$BASE/5.4.292/Image"
          test -s "$BASE/5.4.292/BUILD-STATUS.txt"
          grep -Fxq 'KERNEL=5.4.292' "$BASE/5.4.292/BUILD-STATUS.txt"
          grep -Fxq "RESUKISU_COMMIT=$RESUKISU_BASE_COMMIT" "$BASE/5.4.292/BUILD-STATUS.txt"
          grep -Fxq "RESUKISU_VERSION=$RESUKISU_BASE_VERSION" "$BASE/5.4.292/BUILD-STATUS.txt"
          grep -Fxq 'COMPILE_PASS=YES' "$BASE/5.4.292/BUILD-STATUS.txt"

          SRC="$STATE/workspace-5.4.292/.work/5.4.292-update-r1/kernel"
          test -d "$SRC/.git"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(make -s -C "$SRC" kernelversion)" = '5.4.292'
          python3 "$PORT_HELPER" verify-pre --src "$SRC"
          echo "WORKER_292_BASELINE_RECONSTRUCTION=PASS"

      - name: Stage local 35170 and NoMount then compile
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/worker-292-state"
          WORK="$STATE/workspace-5.4.292/.work/5.4.292-update-r1"
          SRC="$WORK/kernel"
          TC="$WORK/clang-r547379"
          OUT="$WORK/out-local-target"
          EVID="$GITHUB_WORKSPACE/worker-292-evidence"
          rm -rf "$OUT" "$EVID"
          mkdir -p "$EVID"
          exec > >(tee "$EVID/build-worker.log") 2>&1

          test -d "$SRC/.resukisu/.git"
          test -x "$TC/bin/clang"
          test -x "$TC/bin/ld.lld"
          grep -Fq '"bid": "13065274"' "$TC/BUILD_INFO"
          grep -Fq '"branch": "aosp-llvm-r547379-release"' "$TC/BUILD_INFO"

          python3 "$LOCAL_STAGE" stage \
            --src "$SRC" \
            --resukisu "$GITHUB_WORKSPACE/third_party/resukisu" \
            --nomount "$GITHUB_WORKSPACE/third_party/nomount" \
            | tee "$EVID/local-target-stage.txt"

          python3 "$PORT_HELPER" fastfail --src "$SRC" \
            | tee "$EVID/fastfail-contract.txt"

          bash common/scripts/identity_guard.sh \
            snapshot "$SRC" veux_defconfig "$EVID/identity-before-build.sha256"

          export PATH="$TC/bin:$PATH"
          export ARCH=arm64
          clang --version | tee "$EVID/clang-version.txt"
          ld.lld --version | tee "$EVID/lld-version.txt"

          make -C "$SRC" O="$OUT" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            veux_defconfig 2>&1 | tee "$EVID/defconfig.log"
          test -f "$OUT/.config"
          test -x "$SRC/scripts/config"

          "$SRC/scripts/config" --file "$OUT/.config" \
            --enable KSU \
            --disable KSU_TRACEPOINT_HOOK \
            --disable KSU_MANUAL_HOOK \
            --disable KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
            --disable KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
            --disable KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
            --enable KSU_SUSFS \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SUS_MAP \
            --enable THREAD_INFO_IN_TASK \
            --enable NOMOUNT

          make -C "$SRC" O="$OUT" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            olddefconfig 2>&1 | tee "$EVID/olddefconfig.log"

          for expected in \
            'CONFIG_KSU=y' \
            'CONFIG_KSU_SUSFS=y' \
            'CONFIG_KSU_SUSFS_SUS_PATH=y' \
            'CONFIG_KSU_SUSFS_SUS_MOUNT=y' \
            'CONFIG_KSU_SUSFS_SUS_KSTAT=y' \
            'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' \
            'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' \
            'CONFIG_KSU_SUSFS_SUS_MAP=y' \
            'CONFIG_THREAD_INFO_IN_TASK=y' \
            'CONFIG_NOMOUNT=y' \
            'CONFIG_64BIT=y'
          do
            grep -Fxq "$expected" "$OUT/.config"
          done
          grep -Fxq '# CONFIG_KSU_TRACEPOINT_HOOK is not set' "$OUT/.config"
          grep -Fxq '# CONFIG_KSU_MANUAL_HOOK is not set' "$OUT/.config"

          make -C "$SRC" -j"$(nproc)" O="$OUT" \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            Image \
            2>&1 | tee "$EVID/compile.log"

          IMAGE="$OUT/arch/arm64/boot/Image"
          test -s "$IMAGE"
          test -s "$OUT/fs/susfs.o"
          test -s "$OUT/fs/nomount/nomount.o"

          if find "$SRC" -type f \( -name '*.rej' -o -name '*.orig' \) -print -quit | grep -q .; then
            echo 'reject/orig files found' >&2
            exit 71
          fi

          bash common/scripts/audit_existing_integration.sh "$SRC" \
            | tee "$EVID/post-build-integration-audit.txt"
          bash common/scripts/identity_guard.sh \
            verify "$SRC" veux_defconfig "$EVID/identity-before-build.sha256" \
            | tee "$EVID/identity-after-build.txt"
          python3 "$PORT_HELPER" fastfail --src "$SRC" \
            | tee "$EVID/fastfail-post-build.txt"

          kernelrelease="$(
            make -s -C "$SRC" O="$OUT" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 kernelrelease
          )"
          case "$kernelrelease" in 5.4.292*) ;; *) exit 72;; esac

          warnings="$(grep -Ec '(^|[[:space:]])warning:' "$EVID/compile.log" || true)"
          errors="$(
            grep -Eic '(^|[[:space:]])error:|undefined reference|fatal error:|make(\[[0-9]+\])?: \*\*\*' \
              "$EVID/compile.log" || true
          )"
          test "$errors" = 0

          cp "$IMAGE" "$EVID/Image"
          image_sha="$(sha256sum "$EVID/Image" | awk '{print $1}')"
          image_bytes="$(wc -c < "$EVID/Image" | tr -d ' ')"

          {
            echo 'KERNEL=5.4.292'
            echo "SOURCE_COMMIT=$SOURCE_COMMIT"
            echo "RESUKISU_COMMIT=$RESUKISU_COMMIT"
            echo "RESUKISU_VERSION=$RESUKISU_VERSION"
            echo "UAPI=$RESUKISU_UAPI"
            echo 'RESUKISU_SOURCE=LOCAL_SNAPSHOT'
            echo "SUSFS_COMMIT=$SUSFS_COMMIT"
            echo "SUSFS_VERSION=$SUSFS_VERSION"
            echo "NOMOUNT_COMMIT=$NOMOUNT_COMMIT"
            echo "NOMOUNT_VERSION=$NOMOUNT_VERSION"
            echo 'NOMOUNT_SOURCE=LOCAL_SNAPSHOT'
            echo 'MODULE_LOAD_FILTER=EXCLUDED'
            echo 'U7_N4_FASTFAIL_BEHAVIORAL_CONTRACT=PASS'
            echo 'NOMOUNT_COMPILE_OBJECT=PASS'
            echo "KERNELRELEASE=$kernelrelease"
            echo "WARNINGS=$warnings"
            echo "ERROR_SIGNATURES=$errors"
            echo "IMAGE_BYTES=$image_bytes"
            echo "IMAGE_SHA256=$image_sha"
            echo 'COMPILE_PASS=YES'
            echo 'PACKAGE_PASS=NO'
            echo 'STATIC_BOOT_PATH_PASS=NO'
            echo 'DEVICE_PASS=NO'
            echo 'VEUX_5_4_292_REAL_LOCAL_TARGET_BUILD=PASS'
          } | tee "$EVID/BUILD-RESULT.txt"

      - name: Build CLEAN AnyKernel3 package
        id: package
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          EVID="$GITHUB_WORKSPACE/worker-292-evidence"
          IMAGE="$EVID/Image"
          RELEASE="$GITHUB_WORKSPACE/release"
          SRC_AK3="$RUNNER_TEMP/AnyKernel3-pinned"
          STAGE="$RUNNER_TEMP/AnyKernel3-clean"
          ZIP_PATH="$RELEASE/$RELEASE_NAME"

          test -s "$IMAGE"
          test "$AK3_COMMIT" = 'af770f7b16cf8f8eb7c68614b2a693b3b361c90c'
          rm -rf "$RELEASE" "$SRC_AK3" "$STAGE"
          mkdir -p "$RELEASE"

          git clone -q "$AK3_REPO" "$SRC_AK3"
          git -C "$SRC_AK3" checkout -q --detach "$AK3_COMMIT"
          test "$(git -C "$SRC_AK3" rev-parse HEAD)" = "$AK3_COMMIT"

          test -f "$SRC_AK3/tools/ak3-core.sh"
          test -e "$SRC_AK3/META-INF/com/google/android/update-binary"
          test -f "$SRC_AK3/META-INF/com/google/android/updater-script"

          mkdir -p "$STAGE"
          cp -a "$SRC_AK3/tools" "$STAGE/tools"
          cp -a "$SRC_AK3/META-INF" "$STAGE/META-INF"
          cp "$IMAGE" "$STAGE/Image"

          cat > "$STAGE/anykernel.sh" <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers

          properties() { '
          kernel.string=VEUX Linux 5.4.292 ReSukiSU35170 UAPI4 SUSFS2.3 NoMount2.0.0
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=veux
          supported.versions=13
          supported.patchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          SLOT_SELECT=active;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=0;

          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF

          bash -n "$STAGE/anykernel.sh"

          # The clean release stage is a whitelist, not a cleaned source clone.
          # Therefore .git, docs, CI metadata and source-state files cannot leak in.
          find "$STAGE" -type f -name '*placeholder' -delete
          if find "$STAGE" \( -name '.git' -o -name '.github' -o -name '*.rej' -o -name '*.orig' \
              -o -name '*.patch' -o -name '*.diff' -o -name '*.yml' -o -name '*.yaml' \
              -o -name '*.log' \) -print -quit | grep -q .; then
            echo 'forbidden metadata/evidence file in clean AK3 stage' >&2
            exit 81
          fi

          (
            cd "$STAGE"
            zip -r9 "$ZIP_PATH" Image anykernel.sh tools META-INF >/dev/null
          )
          test -s "$ZIP_PATH"
          unzip -t "$ZIP_PATH" >/dev/null

          for required in \
            Image \
            anykernel.sh \
            tools/ak3-core.sh \
            META-INF/com/google/android/update-binary \
            META-INF/com/google/android/updater-script
          do
            unzip -Z1 "$ZIP_PATH" | grep -Fxq "$required"
          done

          while IFS= read -r entry; do
            case "$entry" in
              Image|anykernel.sh|tools/|tools/*|META-INF/|META-INF/*) ;;
              *)
                echo "unexpected AK3 entry: $entry" >&2
                exit 82
                ;;
            esac
          done < <(unzip -Z1 "$ZIP_PATH")

          if unzip -Z1 "$ZIP_PATH" | grep -Eiq \
            '(^|/)(\.git|\.github)(/|$)|\.(rej|orig|patch|diff|ya?ml|log)$|(^|/)(boot\.img|rollback_stock_boot\.img(\.gz)?|dtb|dtbo\.img|Image\.gz|Image\.gz-dtb)$'; then
            echo 'forbidden payload found in clean AK3 zip' >&2
            exit 83
          fi

          TMP_CHECK="$(mktemp -d)"
          trap 'rm -rf "$TMP_CHECK"' EXIT
          unzip -p "$ZIP_PATH" Image > "$TMP_CHECK/Image"
          cmp -s "$IMAGE" "$TMP_CHECK/Image"
          unzip -p "$ZIP_PATH" anykernel.sh > "$TMP_CHECK/anykernel.sh"
          bash -n "$TMP_CHECK/anykernel.sh"
          grep -Fqx 'device.name1=veux' "$TMP_CHECK/anykernel.sh"
          grep -Fqx 'supported.versions=13' "$TMP_CHECK/anykernel.sh"
          grep -Fqx 'BLOCK=boot;' "$TMP_CHECK/anykernel.sh"
          grep -Fqx 'IS_SLOT_DEVICE=1;' "$TMP_CHECK/anykernel.sh"
          grep -Fqx 'SLOT_SELECT=active;' "$TMP_CHECK/anykernel.sh"
          grep -Fqx 'RAMDISK_COMPRESSION=auto;' "$TMP_CHECK/anykernel.sh"
          grep -Fqx 'PATCH_VBMETA_FLAG=0;' "$TMP_CHECK/anykernel.sh"

          image_sha="$(sha256sum "$IMAGE" | awk '{print $1}')"
          packaged_image_sha="$(sha256sum "$TMP_CHECK/Image" | awk '{print $1}')"
          test "$packaged_image_sha" = "$image_sha"

          {
            echo "AK3_PIN=$AK3_COMMIT"
            echo 'AK3_IMAGE_ONLY=PASS'
            echo 'AK3_CLEAN_WHITELIST=PASS'
            echo 'AK3_ACTIVE_SLOT_CONTRACT=PASS'
            echo "AK3_FILE=$RELEASE_NAME"
            echo "AK3_SHA256=$(sha256sum "$ZIP_PATH" | awk '{print $1}')"
            echo "AK3_IMAGE_SHA256=$packaged_image_sha"
          } | tee "$EVID/AK3-RESULT.txt"

          echo 'VEUX_292_CLEAN_AK3_PACKAGE=PASS'

      - name: Finalize evidence
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        run: |
          set -euo pipefail
          EVID="$GITHUB_WORKSPACE/worker-292-evidence"
          mkdir -p "$EVID"

          if [ "$BUILD_OUTCOME" != success ] || [ ! -s "$EVID/BUILD-RESULT.txt" ]; then
            {
              echo "BUILD_STEP_OUTCOME=$BUILD_OUTCOME"
              echo "PACKAGE_STEP_OUTCOME=$PACKAGE_OUTCOME"
              echo 'COMPILE_PASS=NO'
              echo 'PACKAGE_PASS=NO'
              echo 'STATIC_BOOT_PATH_PASS=NO'
              echo 'DEVICE_PASS=NO'
              echo 'VEUX_5_4_292_REAL_LOCAL_TARGET_BUILD=FAIL'
            } > "$EVID/FINAL-RESULT.txt"
          else
            cp "$EVID/BUILD-RESULT.txt" "$EVID/FINAL-RESULT.txt"
            if [ "$PACKAGE_OUTCOME" = success ] && [ -s "$EVID/AK3-RESULT.txt" ]; then
              sed -i 's/^PACKAGE_PASS=NO$/PACKAGE_PASS=YES/' "$EVID/FINAL-RESULT.txt"
              cat "$EVID/AK3-RESULT.txt" >> "$EVID/FINAL-RESULT.txt"
            else
              echo "PACKAGE_STEP_OUTCOME=$PACKAGE_OUTCOME" >> "$EVID/FINAL-RESULT.txt"
            fi
          fi

          (
            cd "$EVID"
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 -r sha256sum > SHA256SUMS.txt
          )

      - name: Upload build evidence and Image
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VEUX-5.4.292-ReSukiSU35170-SUSFS2.3-NoMount2.0-Compile-${{ github.run_id }}
          path: worker-292-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Upload CLEAN AnyKernel3 release
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: VEUX-5.4.292-ReSukiSU35170-SUSFS2.3-NoMount2.0-AK3
          path: release/VEUX-5.4.292-ReSukiSU35170-SUSFS2.3-NoMount2.0-AK3.zip
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Final compile and CLEAN AK3 gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EVID="$GITHUB_WORKSPACE/worker-292-evidence"
          ZIP_PATH="$GITHUB_WORKSPACE/release/$RELEASE_NAME"

          test -s "$EVID/Image"
          test -s "$EVID/FINAL-RESULT.txt"
          test -s "$EVID/AK3-RESULT.txt"
          test -s "$ZIP_PATH"

          grep -Fxq 'KERNEL=5.4.292' "$EVID/FINAL-RESULT.txt"
          grep -Fxq "RESUKISU_COMMIT=$RESUKISU_COMMIT" "$EVID/FINAL-RESULT.txt"
          grep -Fxq 'RESUKISU_SOURCE=LOCAL_SNAPSHOT' "$EVID/FINAL-RESULT.txt"
          grep -Fxq "SUSFS_COMMIT=$SUSFS_COMMIT" "$EVID/FINAL-RESULT.txt"
          grep -Fxq "NOMOUNT_COMMIT=$NOMOUNT_COMMIT" "$EVID/FINAL-RESULT.txt"
          grep -Fxq 'NOMOUNT_SOURCE=LOCAL_SNAPSHOT' "$EVID/FINAL-RESULT.txt"
          grep -Fxq 'MODULE_LOAD_FILTER=EXCLUDED' "$EVID/FINAL-RESULT.txt"
          grep -Fxq 'NOMOUNT_COMPILE_OBJECT=PASS' "$EVID/FINAL-RESULT.txt"
          grep -Fxq 'COMPILE_PASS=YES' "$EVID/FINAL-RESULT.txt"
          grep -Fxq 'PACKAGE_PASS=YES' "$EVID/FINAL-RESULT.txt"
          grep -Fxq "AK3_PIN=$AK3_COMMIT" "$EVID/FINAL-RESULT.txt"
          grep -Fxq 'AK3_IMAGE_ONLY=PASS' "$EVID/FINAL-RESULT.txt"
          grep -Fxq 'AK3_CLEAN_WHITELIST=PASS' "$EVID/FINAL-RESULT.txt"
          grep -Fxq 'STATIC_BOOT_PATH_PASS=NO' "$EVID/FINAL-RESULT.txt"
          grep -Fxq 'DEVICE_PASS=NO' "$EVID/FINAL-RESULT.txt"
          grep -Fxq 'VEUX_5_4_292_REAL_LOCAL_TARGET_BUILD=PASS' "$EVID/FINAL-RESULT.txt"

          unzip -t "$ZIP_PATH" >/dev/null
          TMP_FINAL="$(mktemp -d)"
          trap 'rm -rf "$TMP_FINAL"' EXIT
          unzip -p "$ZIP_PATH" Image > "$TMP_FINAL/Image"
          cmp -s "$EVID/Image" "$TMP_FINAL/Image"

          (
            cd "$EVID"
            sha256sum -c SHA256SUMS.txt
          )
          echo 'VEUX_292_REAL_BUILD_WORKER_V2_CLEAN_AK3=PASS'
