name: VEUX R55B2 SUSFS 5.4 readlink ABI source-only gate - NO BUILD NO FLASH
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: veux-r55b2-susfs54-${{ github.ref }}
  cancel-in-progress: false
