    - name: actionlint duplicate-YAML-keys and ShellCheck full gate
      shell: bash
      run: "set -euo pipefail\narchive=project/VEUX_R39_R2_MEMORY_ABI_MAIN.zip\ntest -s \"$archive\"\nprintf '%s  %s\\n' '745d80b8502a9beea513a2e7a58bb59272539b7508920d235ce2e79741bda528'\
        \ \"$archive\" | sha256sum -c -\nunzip -p \"$archive\" tools/actionlint > \"$R55_STAGE/actionlint\"\nchmod 0755 \"$R55_STAGE/actionlint\"\
        \n\"$R55_STAGE/actionlint\" -version | grep -Fx '1.7.12'\n\"$R55_STAGE/actionlint\" -color=false -shellcheck='' \"project/.github/workflows/VEUX_R55B2_SUSFS54_READLINK_SOURCE_ONLY.yml\"\
        \ > \"$R55_STAGE/R55B2_ACTIONLINT.log\"\nprintf 'R55B2_ACTIONLINT_V1_7_12=PASS\\n' >> \"$R55_STAGE/R55B2_ACTIONLINT.log\"\n\
        python3 -B - <<'PY_R55B2_CHECK_YAML_AND_SHELL'\nimport hashlib,pathlib,subprocess,yaml\nclass Strict(yaml.SafeLoader): pass\n\
        def unique(loader,node):\n    out={}\n    for kn,vn in node.value:\n        k=loader.construct_object(kn)\n        if k in out:\
        \ raise RuntimeError('DUPLICATE_YAML_KEY:'+str(k))\n        out[k]=loader.construct_object(vn)\n    return out\nStrict.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,unique)\n\
        p=pathlib.Path('project/.github/workflows/VEUX_R55B2_SUSFS54_READLINK_SOURCE_ONLY.yml')\ny=yaml.load(p.read_text('utf-8'),Loader=Strict)\n\
        assert list(y['on'])==['workflow_dispatch']\nassert y['permissions']=={'contents':'read'}\nassert set(y['jobs'])=={'r55b2_source'}\n\
        j=y['jobs']['r55b2_source']\nassert j['runs-on']=='ubuntu-24.04'\nassert j['if'].startswith('$') and 'github.repository' in\
        \ j['if'] and 'refs/heads/main' in j['if']\nsteps=j['steps']\nassert len(steps)==9\nfor idx in (0,1):\n    assert steps[idx]['uses']=='actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683'\n\
        \    assert steps[idx]['with']['persist-credentials'] is False\nassert steps[1]['with']['repository']=='dereference23/kernel_xiaomi_sm6375'\n\
        assert steps[1]['with']['ref']=='b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'\nassert steps[8]['uses']=='actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02'\n\
        assert steps[8]['with']['if-no-files-found']=='error'\nrecords=[]\nfor step in steps:\n    if 'run' not in step: continue\n\
        \    script=step['run']\n    if '$'+'{' in script: raise SystemExit('GITHUB_EXPRESSION_INSIDE_RUN_BLOCK')\n    for cmd in (['bash','-n','-'],['shellcheck','--shell=bash','--severity=warning','-']):\n\
        \        checked=subprocess.run(cmd,input=script,text=True,capture_output=True)\n        if checked.returncode:\n          \
        \  raise SystemExit('SHELLCHECK_FAIL '+step['name']+' '+checked.stdout+checked.stderr)\n    records.append(step['name']+' SHA256='+hashlib.sha256(script.encode()).hexdigest()+'\
        \ BASH_SHELLCHECK_PASS')\npathlib.Path('/tmp/veux-r55b2/R55B2_SHELLCHECK.log').write_text('\\n'.join(records)+'\\n')\nprint('R55B2_YAML_PARSER_ACTION_INPUTS_ALL_RUN_BLOCKS=PASS')\n\
        PY_R55B2_CHECK_YAML_AND_SHELL\n"
    - name: Run 25 positive negative and executable C readlink ABI tests
      shell: bash
      run: "set -euo pipefail\npython3 -B - <<'PY_R55B2_AST'\nimport ast,pathlib\nfor name in ('scripts/r55b2_readlink.py','tests/test_r55b2_readlink.py'):\n\
        \    p=pathlib.Path('/tmp/veux-r55b2')/name\n    ast.parse(p.read_text('utf-8'),filename=str(p))\nprint('R55B2_EMBEDDED_PYTHON_AST=PASS')\n\
        PY_R55B2_AST\npython3 -B -m unittest discover -v -s \"$R55_STAGE/tests\" -p 'test_*.py' 2>&1 | tee \"$R55_STAGE/R55B2_REGRESSION_TESTS.log\"\
        \ngrep -Eq '^Ran 25 tests in [0-9.]+s$' \"$R55_STAGE/R55B2_REGRESSION_TESTS.log\"\ngrep -Fx 'OK' \"$R55_STAGE/R55B2_REGRESSION_TESTS.log\"\
        \necho 'R55B2_25_POSITIVE_NEGATIVE_C_ABI_GIT_TESTS=PASS'\n"
    - name: Apply real pinned R55B1 and correct readlink interface in two files
      shell: bash
      run: 'set -euo pipefail

        test "$(git -C kernel rev-parse HEAD)" = ''b2b7a3bbc36d120ee523ebc8d68e0f13a97df632''

        test "$(git -C kernel hash-object fs/namei.c)" = ''7c74159e29355e209b1cf4749aae23110f21a098''

        python3 -B "$R55_STAGE/scripts/r55b2_readlink.py"     --source kernel --base "$R55_STAGE/inputs/R55B1_AUTHENTIC_15FILES.patch"     --out
        "$R55_STAGE/out" 2>&1 | tee "$R55_STAGE/R55B2_REAL_SOURCE.log"

        (cd "$R55_STAGE/out" && sha256sum -c SHA256SUMS.txt)

        '
    - name: Independent clean 15-file full patch replay
      shell: bash
      run: "set -euo pipefail\ngit -C kernel worktree add --detach \"$R55_STAGE/replay\" b2b7a3bbc36d120ee523ebc8d68e0f13a97df632\n\
        git -C \"$R55_STAGE/replay\" apply --check --whitespace=error \"$R55_STAGE/out/VEUX_R55B2_SUSFS54_15_FILES_READLINK_NOFLASH.patch\"\
        \ngit -C \"$R55_STAGE/replay\" apply --whitespace=error \"$R55_STAGE/out/VEUX_R55B2_SUSFS54_15_FILES_READLINK_NOFLASH.patch\"\
        \ngit -C \"$R55_STAGE/replay\" diff --check\nfor f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do\n    git\
        \ -C \"$R55_STAGE/replay\" add -N -- \"$f\"\ndone\ngit -C \"$R55_STAGE/replay\" diff --binary --no-ext-diff > \"$R55_STAGE/replay.patch\"\
        \ncmp \"$R55_STAGE/replay.patch\" \"$R55_STAGE/out/VEUX_R55B2_SUSFS54_15_FILES_READLINK_NOFLASH.patch\"\npython3 -B - <<'PY_R55B2_REPLAY'\n\
        import hashlib,json,pathlib\np=pathlib.Path('/tmp/veux-r55b2')\nr=json.loads((p/'out/R55B2_RESULT.json').read_text())\nfor file,attr\
        \ in [('fs/namei.c','postimage_namei_gitblob'),('fs/susfs.c','postimage_susfs_gitblob')]:\n    data=(p/'replay'/file).read_bytes()\n\
        \    blob=hashlib.sha1(f'blob {len(data)}\\0'.encode('ascii')+data).hexdigest()\n    assert blob==r[attr],file\nassert r['source_file_count']==15\n\
        assert r['open_redirect_readlink_abi_corrected'] is True\nassert r['open_redirect_path_open_ported'] is False\nassert r['flash_allowed']\
        \ is False\nassert r['compile_performed'] is False\nassert r['brene_changed'] is False\nprint('R55B2_REAL_15FILE_REPLAY_EXACT_BYTES=PASS')\n\
        PY_R55B2_REPLAY\n"
    - name: Final scope checksum rollback and NOFLASH gate
      shell: bash
      run: "set -euo pipefail\npython3 -B - <<'PY_R55B2_FINAL'\nimport hashlib,json,pathlib,re\np=pathlib.Path('/tmp/veux-r55b2')\n\
        out=p/'out'\nr=json.loads((out/'R55B2_RESULT.json').read_text())\nassert r['kernel_source_sha']=='b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'\n\
        assert r['r55b1_base_sha256']=='9f591926dfc0445882799141e11b4af52be4ee8550c48bad59b35b27607cf0b7'\nassert r['r55b1_replayed']\
        \ and r['source_file_count']==15\nassert r['r55b2_modified_files']==['fs/namei.c','fs/susfs.c']\nassert r['open_redirect_readlink_abi_corrected']\
        \ is True\nfor prop in ('compile_performed','device_tested','flash_allowed','brene_changed',\n             'vendor_changed','open_redirect_path_open_ported','full_susfs_port',\n\
        \             'user_repo_modified','boot_ready','atomic_open_review_complete',\n             'r44_recomposed','baka_su_uapi6_integrated','nomount_v22_integrated'):\n\
        \    assert r[prop] is False,prop\nfull=(out/'VEUX_R55B2_SUSFS54_15_FILES_READLINK_NOFLASH.patch').read_text()\naddon=(out/'VEUX_R55B2_READLINK_2_FILES_ADDON_NOFLASH.patch').read_text()\n\
        def filepaths(text):\n    files=re.findall(r'^diff --git a/(\\S+) b/\\1$',text,re.M)\n    assert len(files)==len(set(files))\n\
        \    return files\nassert len(filepaths(full))==15\nassert set(filepaths(addon))=={'fs/namei.c','fs/susfs.c'}\nassert not any('brene'\
        \ in x.lower() or x.startswith('vendor/') or x.startswith('.github/') for x in filepaths(full))\nassert 'GIT binary patch' not\
        \ in full\nfor name in ('R55B2_ACTIONLINT.log','R55B2_SHELLCHECK.log','R55B2_REGRESSION_TESTS.log','R55B2_REAL_SOURCE.log'):\n\
        \    f=p/name\n    assert f.is_file() and f.stat().st_size>0,name\n    (out/name).write_bytes(f.read_bytes())\nchecks=[]\nfor\
        \ f in sorted(out.iterdir()):\n    if f.is_file() and f.name!='SHA256SUMS.txt':\n        checks.append(hashlib.sha256(f.read_bytes()).hexdigest()+'\
        \  '+f.name)\n(out/'SHA256SUMS.txt').write_text('\\n'.join(checks)+'\\n')\nprint('R55B2_OUTPUT_SCOPE_SHA256_NOFLASH=PASS')\n\
        PY_R55B2_FINAL\n(cd \"$R55_STAGE/out\" && sha256sum -c SHA256SUMS.txt)\ngit -C kernel apply --reverse --check \"$R55_STAGE/out/VEUX_R55B2_SUSFS54_15_FILES_READLINK_NOFLASH.patch\"\
        \ntest -z \"$(git -C project status --porcelain --untracked-files=all)\"\necho 'R55B2_PROJECT_REPO_UNCHANGED=YES; NO_BUILD=YES;\
        \ NO_FLASH=YES'\n"
    - name: Upload only source patches and audit proofs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: VEUX-R55B2-READLINK-15FILES-NOFLASH-${{ github.run_id }}
        path: /tmp/veux-r55b2/out/
        retention-days: 14
        if-no-files-found: error
