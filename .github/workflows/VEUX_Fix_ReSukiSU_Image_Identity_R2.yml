name: VEUX Fix - Dynamic ReSukiSU Image Identity R2

'on':
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  EXPECTED_ENGINE_BLOB: 3a086bea430c46ef5bf5c75b94becbd9010ab93d
  EXPECTED_TEST_BLOB: dcf4590486b730b5b2d7314d794cf90eea8db242

concurrency:
  group: veux-fix-resukisu-image-identity-main
  cancel-in-progress: false

jobs:
  patch:
    name: Patch dynamic ReSukiSU/BakaSU image identity
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact main snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Preflight exact source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Chrizz100/veux-nongki-universal-kernel"
          test "$(git hash-object common/scripts/veux_update_engine.py)" = "$EXPECTED_ENGINE_BLOB"
          test "$(git hash-object common/scripts/test_veux_update_engine.py)" = "$EXPECTED_TEST_BLOB"
          test -f third_party/candidate/resukisu/kernel/Kbuild
          grep -Fxq 'REPO_NAME := BakaSU' third_party/candidate/resukisu/kernel/Kbuild
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "PATCH_PREFLIGHT=PASS"

      - name: Apply exact validated patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/resukisu-image-identity.patch" <<'PATCH'
          diff --git a/common/scripts/veux_update_engine.py b/common/scripts/veux_update_engine.py
          --- a/common/scripts/veux_update_engine.py
          +++ b/common/scripts/veux_update_engine.py
          @@ -737,6 +737,56 @@
                       shutil.copy2(public / name, diag / name)


          +def resukisu_image_identity(kbuild_text, conf, component):
          +    names = re.findall(
          +        r"^REPO_NAME\s*:=\s*([A-Za-z0-9][A-Za-z0-9._-]*)\s*$",
          +        kbuild_text,
          +        re.M,
          +    )
          +    require(len(names) == 1, "ambiguous or missing ReSukiSU REPO_NAME")
          +
          +    prefix = "CONFIG_KSU_FULL_NAME_FORMAT="
          +    formats = [line[len(prefix):] for line in conf if line.startswith(prefix)]
          +    require(
          +        len(formats) == 1,
          +        "ambiguous or missing CONFIG_KSU_FULL_NAME_FORMAT",
          +    )
          +    raw = formats[0]
          +    require(
          +        len(raw) >= 2 and raw[0] == raw[-1] == '"',
          +        "invalid CONFIG_KSU_FULL_NAME_FORMAT quoting",
          +    )
          +    value = raw[1:-1]
          +    require(
          +        value and "\n" not in value and "\x00" not in value,
          +        "invalid CONFIG_KSU_FULL_NAME_FORMAT value",
          +    )
          +
          +    ref = str(component.get("ref", ""))
          +    branch = ref.removeprefix("refs/heads/") if ref.startswith("refs/heads/") else ref
          +    replacements = {
          +        "%TAG_NAME%": str(component.get("tag", "")),
          +        "%COMMIT_SHA%": str(component["commit"])[:8],
          +        "%REPO_NAME%": names[0],
          +        "%BRANCH_NAME%": branch,
          +        "%KSU_VERSION%": str(component.get("version", "")),
          +    }
          +    for token, replacement in replacements.items():
          +        if token in value:
          +            require(replacement, "missing ReSukiSU identity value for " + token)
          +            value = value.replace(token, replacement)
          +
          +    require(
          +        re.search(r"%[A-Z0-9_]+%", value) is None,
          +        "unresolved ReSukiSU full-name token: " + value,
          +    )
          +    require(
          +        str(component["commit"])[:8] in value,
          +        "configured ReSukiSU full name omits commit identity",
          +    )
          +    return value
          +
          +
           def compile_kernel(label, state, targets, work, jobs):
               src = Path(state["source"])
               values = dict(v.split("=", 1) for v in state["variables"])
          @@ -785,9 +785,23 @@
               for obj in ("fs/nomount/nomount.o", "fs/susfs.o", "drivers/kernelsu/core/init.o",
                           "drivers/kernelsu/built-in.a"):
                   require((out / obj).is_file(), f"required compiled object missing: {obj}")
          -    data = image.read_bytes()
          -    for marker in (b"@ReSukiSU", targets["components"]["resukisu"]["commit"][:8].encode(), b"susfs:", b"NoMount:"):
          -        require(marker in data, f"Image identity missing: {marker!r}")
          +    data = image.read_bytes()
          +    vendor, _ = topology(src)
          +    resukisu = targets["components"]["resukisu"]
          +    full_identity = resukisu_image_identity(
          +        (vendor / "kernel/Kbuild").read_text(),
          +        conf,
          +        resukisu,
          +    )
          +    markers = (
          +        full_identity.encode(),
          +        resukisu["commit"][:8].encode(),
          +        b"susfs:",
          +        b"NoMount:",
          +    )
          +    for marker in markers:
          +        require(marker in data, f"Image identity missing: {marker!r}")
          +    print(f"IMAGE_IDENTITY {label}=PASS resukisu={full_identity}", flush=True)
               release = run([*base, "-s", "kernelrelease"], env=env).splitlines()[-1]
               require(release.startswith(label + "-"), "kernelrelease identity changed")
               result = {"kernel": label, "kernelrelease": release, "image_sha256": digest(image),
          diff --git a/common/scripts/test_veux_update_engine.py b/common/scripts/test_veux_update_engine.py
          --- a/common/scripts/test_veux_update_engine.py
          +++ b/common/scripts/test_veux_update_engine.py
          @@ -349,6 +349,45 @@
                           e.prepare_promotion(bundle, arts, root / "out")


          +    def test_resukisu_image_identity_tracks_configured_repo_name(self):
          +        component = {
          +            "commit": "c9246641b9eee8b9986050e8bf1832f88da880c2",
          +            "tag": "v4.2.0-rc3",
          +            "ref": "refs/heads/main",
          +            "version": "35217",
          +        }
          +        conf = ['CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@%REPO_NAME%"']
          +        for repo_name in ("ReSukiSU", "BakaSU"):
          +            actual = e.resukisu_image_identity(
          +                f"REPO_NAME := {repo_name}\n", conf, component
          +            )
          +            self.assertEqual(actual, f"v4.2.0-rc3-c9246641@{repo_name}")
          +
          +    def test_resukisu_image_identity_blocks_unsafe_identity_inputs(self):
          +        component = {
          +            "commit": "c9246641b9eee8b9986050e8bf1832f88da880c2",
          +            "tag": "v4.2.0-rc3",
          +            "ref": "refs/heads/main",
          +            "version": "35217",
          +        }
          +        good = 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@%REPO_NAME%"'
          +        with self.assertRaises(e.Blocked):
          +            e.resukisu_image_identity(
          +                "REPO_NAME := BakaSU\nREPO_NAME := Other\n", [good], component
          +            )
          +        with self.assertRaises(e.Blocked):
          +            e.resukisu_image_identity(
          +                "REPO_NAME := BakaSU\n",
          +                ['CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%UNKNOWN%"'],
          +                component,
          +            )
          +        with self.assertRaises(e.Blocked):
          +            e.resukisu_image_identity(
          +                "REPO_NAME := BakaSU\n",
          +                ['CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%@%REPO_NAME%"'],
          +                component,
          +            )
          +
           if __name__ == "__main__":
               unittest.main(verbosity=2)
          PATCH
          git apply --check "$RUNNER_TEMP/resukisu-image-identity.patch"
          git apply "$RUNNER_TEMP/resukisu-image-identity.patch"
          git diff --check
          echo "PATCH_APPLY=PASS"

      - name: Validate Python and host tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            common/scripts/veux_update_engine.py \
            common/scripts/test_veux_update_engine.py

          python3 common/scripts/test_veux_update_engine.py

          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("common/scripts").resolve()))
          import veux_update_engine as e

          component = {
              "commit": "c9246641b9eee8b9986050e8bf1832f88da880c2",
              "tag": "v4.2.0-rc3",
              "ref": "refs/heads/main",
              "version": "35217",
          }
          conf = ['CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@%REPO_NAME%"']

          got = e.resukisu_image_identity("REPO_NAME := BakaSU\n", conf, component)
          assert got == "v4.2.0-rc3-c9246641@BakaSU", got

          legacy = e.resukisu_image_identity("REPO_NAME := ReSukiSU\n", conf, component)
          assert legacy == "v4.2.0-rc3-c9246641@ReSukiSU", legacy

          print("CURRENT_BAKASU_IDENTITY=PASS")
          print("LEGACY_RESUKISU_IDENTITY=PASS")
          print("DYNAMIC_IMAGE_IDENTITY=PASS")
          PY

          echo "PYTHON_AND_HOST_TESTS=PASS"

      - name: Prove exact patch scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 2
          printf '%s\n' "$changed" | grep -Fxq 'common/scripts/veux_update_engine.py'
          printf '%s\n' "$changed" | grep -Fxq 'common/scripts/test_veux_update_engine.py'
          ! grep -Fq 'for marker in (b"@ReSukiSU"' common/scripts/veux_update_engine.py
          echo "PATCH_SCOPE=PASS"

      - name: Commit validated fix to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          remote_head="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$remote_head"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "main moved during validation; refusing commit" >&2
            exit 1
          fi

          git add -- \
            common/scripts/veux_update_engine.py \
            common/scripts/test_veux_update_engine.py

          staged="$(git diff --cached --name-only)"
          test "$(printf '%s\n' "$staged" | sed '/^$/d' | wc -l)" -eq 2

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix dynamic ReSukiSU image identity validation [skip ci]"

          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH_HEADER"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH_HEADER"

          git push origin HEAD:refs/heads/main
          echo "REPOSITORY_FIX=PASS"
