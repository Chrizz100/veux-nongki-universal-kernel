        \    with Path(path).open('rb') as f:\n        while True:\n            data=f.read(1048576)\n            if not data:break\n\
        \            h.update(data)\n    return h.hexdigest()\n\n\ndef parse_config(text):\n    out={}\n    for line in text.splitlines():\n\
        \        if line.startswith('CONFIG_') and '=' in line:\n            key,val=line.split('=',1)\n        elif line.startswith('#\
        \ CONFIG_') and line.endswith(' is not set'):\n            key,val=line[2:].split(' is not set',1)[0],'n'\n      \
        \  else:continue\n        if key in out:raise ValueError('DUPLICATE_CONFIG_KEY:'+key)\n        out[key]=val\n    return\
        \ out\n\n\ndef parse_symvers(text):\n    out={}\n    for line in text.splitlines():\n        parts=line.split()\n\
        \        if len(parts)<4:raise ValueError('MALFORMED_SYMVERS_LINE:'+line[:60])\n        crc,name=parts[:2]\n     \
        \   if not crc.startswith('0x'):raise ValueError('SYMVERS_MISSING_CRC:'+name)\n        crc=f'0x{int(crc,16):08x}'\n\
        \        if name in out and out[name]!=crc:raise ValueError('SYMVERS_DUPLICATE_DIFFERENT_CRC:'+name)\n        out[name]=crc\n\
        \    return out\n\n\ndef audit(config_file, symvers_file, release, dtb_sha256=None, require_config_sha=True):\n  \
        \  failures=[]\n    conf_path=Path(config_file)\n    cfg=parse_config(conf_path.read_text(encoding='utf-8'))\n   \
        \ sym=parse_symvers(Path(symvers_file).read_text(encoding='utf-8'))\n    for key,expected in FEATURES.items():\n \
        \       if cfg.get(key,'n')!=expected:\n            failures.append(f'CONFIG_MISMATCH:{key}:expected={expected}:got={cfg.get(key,\"\
        n\")}')\n    actual_cfg_sha=sha256(conf_path)\n    if require_config_sha and actual_cfg_sha!=CONFIG_SHA256:\n    \
        \    failures.append('FULL_REFERENCE_CONFIG_SHA_MISMATCH')\n    if release.strip()!=EXPECTED_RELEASE:\n        failures.append('KERNEL_RELEASE_MISMATCH')\n\
        \    if dtb_sha256 is not None and dtb_sha256.lower()!=EXPECTED_DTB_SHA256:\n        failures.append('VEUX_DTB_SHA_MISMATCH')\n\
        \    crc_rows=[]\n    for mod,name,expected in REFERENCE:\n        actual=sym.get(name)\n        status='MATCH' if\
        \ actual==expected else ('MISSING' if actual is None else 'CRC_MISMATCH')\n        crc_rows.append({'module':mod,'symbol':name,'original_module_crc':expected,'candidate_crc':actual\
        \ or '', 'status':status})\n        if status!='MATCH':failures.append(f'RMNET_{status}:{mod}:{name}')\n    report={\n\
        \        'schema':1, 'stage':'R55H17_R1_CASS_1TO1_REFERENCE_GATE',\n        'status':'CASS_REFERENCE_STATIC_PASS_NOFLASH'\
        \ if not failures else 'BLOCKED_CASS_REFERENCE_OR_VENDOR_ABI',\n        'kernel_release':release.strip(), 'config_sha256':actual_cfg_sha,\n\
        \        'config_reference_sha256':CONFIG_SHA256,\n        'dtb_sha256_reported':dtb_sha256,\n        'critical_config':{k:cfg.get(k,'n')\
        \ for k in FEATURES},\n        'rmnet_imports_count':len(crc_rows),\n        'rmnet_imports_matched':sum(x['status']=='MATCH'\
        \ for x in crc_rows),\n        'rmnet_module_layout_crc':sym.get('module_layout'),\n        'failures':failures, 'flash_allowed':False,\n\
        \        'device_test':False,\n        'new_bakasu_35252_integrated':False,\n        'new_nomount_v22_integrated':False,\n\
        \        'walt_porting_in_this_stage':False,\n    }\n    return report,crc_rows\n\n\ndef main():\n    ap=argparse.ArgumentParser()\n\
        \    ap.add_argument('--config',required=True)\n    ap.add_argument('--symvers',required=True)\n    ap.add_argument('--release-file',required=True)\n\
        \    ap.add_argument('--dtb-sha256')\n    ap.add_argument('--report-dir',required=True)\n    ns=ap.parse_args()\n\
        \    report,rows=audit(ns.config,ns.symvers,Path(ns.release_file).read_text(),ns.dtb_sha256)\n    d=Path(ns.report_dir)\n\
        \    d.mkdir(parents=True,exist_ok=True)\n    (d/'R55H17_R1_CASS_RESULT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\\\
        n',encoding='utf-8')\n    with (d/'R55H17_R1_RMNET_132_ABI.csv').open('w',newline='',encoding='utf-8') as f:\n   \
        \     w=csv.DictWriter(f,fieldnames=list(rows[0]),delimiter=';');w.writeheader();w.writerows(rows)\n    print(f'R55H17_R1_CASS_GATE={report[\"\
        status\"]}; RMNET={report[\"rmnet_imports_matched\"]}/{len(rows)}; NO_FLASH')\n    if report['failures']:\n      \
        \  for msg in report['failures'][:24]:print('BLOCKER:',msg)\n        raise SystemExit(26)\n\nif __name__=='__main__':main()\n\
        PY_R55H17_GATE\npython3 -m py_compile \"$RUNNER_TEMP/veux-r55h17-cass-gate.py\"\nbuild=\"$RUNNER_TEMP/veux-r5s2-work/builds/diagnostics/5.4.274\"\
        \ntest -s \"$build/config-reports/actual-build.config\"\ntest -s \"$build/build/Module.symvers\"\ntest -s \"$build/build/include/config/kernel.release\"\
        \ntest -s \"$build/DTB-CHECK.json\"\ntest -s \"$build/build-result.json\"\npython3 -B - \"$build/DTB-CHECK.json\"\
        \ \"$build/build-result.json\" <<'PY_DTB_GATE'\nimport json,sys\nx=json.load(open(sys.argv[1]));b=json.load(open(sys.argv[2]))\n\
        sha='42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37'\nassert x['match'] is True and x['actual_sha256']==sha\
