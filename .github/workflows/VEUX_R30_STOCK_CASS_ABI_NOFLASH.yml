# VEUX R30-R1 – Stock-QGKI 5.4.274 vs validated R13 CASS research.
# Fixes an observed Kconfig integer default (IPC_LOG_MINIDUMP_BUFFERS=n -> 0).
# Maintains strict blocking for all other unapproved config drift.
# Adds preservation/printing of the baseline kernel-worker failure log.
# Compiles original R13 plus two separately configured research variants.
# No firmware writes, no R13 tracked-source modifications and no flashable R30 release.
# Before a run: upload the exact pinned R30 MAIN ZIP to repo root; main must retain R13 MAIN.
# A: IPC_LOGGING=y. B: IPC_LOGGING/FTRACE/KPROBES/STACKTRACE=y.
# Strict gates may abort if Kconfig changes unreviewed flags or a driver/DTB changes.
# Not guaranteed to reproduce full stock ABI or to boot. NO FLASH / NO DEVICE PASS.
name: VEUX R30-R1 Stock-CASS Config and OEM ABI - NO FLASH
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: veux-r30-stock-cass-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_TERMINAL_PROMPT: '0'
  EXPECTED_REPO: Chrizz100/veux-nongki-universal-kernel
  R5S2_MAIN_ZIP: VEUX_R5S2_BAKASU522_MAIN.zip
  R5S2_MAIN_SHA256: 37a85d967df5cd9fa4dd3302e2073bc3b9ce461a6e03cd0ef51914fa5f5358b8
  BAKASU_522: 522081c5b1c58587c4c743242eecf445ccebed5d
  VERSION_MAIN_ZIP: VEUX_R5S2_GENUINE_BAKASU35234_MAIN.zip
  VERSION_MAIN_SHA256: d3c0b0da02af4355d1cc0b77b14320c0e8a32fd15995dee7bfbe9acd263e2457
  BAKASU_SYNC: f308ed0936bdd31163cb53da3f42bc7a698f5512
  R4_PACKAGE_NAME: VEUX_R55H17_R4_CASS_UPDATE_MAIN.zip
  R4_MANIFEST_SHA256: 5222d47522356998c6141908af436c23e3731b04ce1a3376f04e12527eed6311
  REPRO_PACKAGE: VEUX_R13_CASS_MAIN.zip
  REPRO_ARCHIVE_SHA256: 15770d93410c01ed9ad149ffc82b93d54a3ea73e6c53a274bd767b249cc975c1
  REPRO_MANIFEST_SHA256: 7f5a75c88736534aab25c7e503e1acd2f21ecf8249bbfbea22f0e6c0a2841d75
  R4_ARCHIVE_SHA256: 88907c8f1bd0a39826092edcd3bf824c05a40bb70d894a53437e001927f75380
  VEUX_EXECUTION_MODE: ci
  R30_PKG_NAME: VEUX_R30_STOCK_CASS_ABI_MAIN.zip
  R30_PKG_SHA256: 64a8a7dc17e6681d617474e494ef4017a312c46dadb85462826a06c4e9f196c4
jobs:
  r5s2_bakasu_522:
    if: ${{ github.repository == 'Chrizz100/veux-nongki-universal-kernel' && github.ref == 'refs/heads/main' }}
    name: Rebuild R13 + isolated stock-near config candidates (NO FLASH)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - name: Checkout exact git commit, no stored credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Verify exact repository and checked-out commit
      id: r12_repository
      shell: bash
      run: 'set -euo pipefail

        test "$GITHUB_REPOSITORY" = "$EXPECTED_REPO"

        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

        test -z "$(git status --porcelain --untracked-files=all)"

        echo ''R12_IMMUTABLE_REPOSITORY=PASS''

        '
    - name: 01 Authenticate the complete R13 MAIN before executing any payload
      id: r12_auth
      shell: bash
      run: "set -euo pipefail\ntest -f \"$GITHUB_WORKSPACE/$REPRO_PACKAGE\"\ncat > \"$RUNNER_TEMP/r12-bootstrap.py\" <<'PY_R11_BOOTSTRAP'\n\
        #!/usr/bin/env python3\n\"\"\"Authenticate every executable payload byte before extracting a new directory.\"\"\"\n\
        import argparse\nimport hashlib\nimport json\nfrom pathlib import Path, PurePosixPath\nimport re\nimport stat\nimport\
        \ zipfile\n\n\ndef extract(archive, destination, archive_sha, manifest_sha):\n    archive, destination = Path(archive),\
        \ Path(destination)\n    if destination.exists() or destination.is_symlink():\n        raise ValueError('PAYLOAD_DESTINATION_EXISTS')\n\
        \    if hashlib.sha256(archive.read_bytes()).hexdigest() != archive_sha:\n        raise ValueError('PAYLOAD_ARCHIVE_SHA_CHANGED')\n\
        \    with zipfile.ZipFile(archive) as source:\n        items = source.infolist()\n        names = [item.filename for\
        \ item in items]\n        if len(names) != len(set(names)):\n            raise ValueError('DUPLICATE_ZIP_ENTRY')\n\
        \        if sum(item.file_size for item in items) > 100 * 1024 * 1024:\n            raise ValueError('PAYLOAD_TOO_LARGE')\n\
        \        for item in items:\n            path = PurePosixPath(item.filename)\n            if (path.is_absolute() or\
        \ '..' in path.parts or '.' in path.parts\n                    or str(path) != item.filename or '\\\\' in item.filename\n\
        \                    or item.is_dir() or '\\x00' in item.filename\n                    or stat.S_ISLNK(item.external_attr\
        \ >> 16)):\n                raise ValueError('UNSAFE_PAYLOAD_PATH')\n        if source.testzip() is not None:\n  \
        \          raise ValueError('PAYLOAD_ZIP_CRC_FAILED')\n        raw = source.read('PAYLOAD_MANIFEST.json')\n      \
        \  if hashlib.sha256(raw).hexdigest() != manifest_sha:\n            raise ValueError('PAYLOAD_MANIFEST_SHA_CHANGED')\n\
        \        manifest = json.loads(raw)\n        if manifest.get('schema') != 1 or manifest.get('automatic_flash') is\
        \ not False:\n            raise ValueError('UNTRUSTED_MANIFEST_SCHEMA')\n        files = manifest.get('files')\n \
        \       if (not isinstance(files, dict) or not files\n                or not all(isinstance(k, str) and isinstance(v,\
        \ str)\n                           and re.fullmatch('[0-9a-f]{64}', v) for k, v in files.items())):\n            raise\
        \ ValueError('INVALID_PAYLOAD_HASH_MAP')\n        if set(names) != set(files) | {'PAYLOAD_MANIFEST.json'}:\n     \
        \       raise ValueError('UNMANIFESTED_OR_MISSING_ENTRY')\n        for name, expected in files.items():\n        \
        \    if hashlib.sha256(source.read(name)).hexdigest() != expected:\n                raise ValueError('PAYLOAD_FILE_SHA_CHANGED:'\
        \ + name)\n        destination.mkdir(parents=True)\n        for name in sorted(names):\n            target = destination\
        \ / name\n            target.parent.mkdir(parents=True, exist_ok=True)\n            target.write_bytes(source.read(name))\n\
        \    return {'status': 'AUTHENTICATED', 'files': len(files),\n            'archive_sha256': archive_sha, 'manifest_sha256':\
        \ manifest_sha,\n            'automatic_flash': False}\n\n\ndef main():\n    p = argparse.ArgumentParser(description=__doc__)\n\
        \    p.add_argument('--archive', required=True)\n    p.add_argument('--out', required=True)\n    p.add_argument('--archive-sha256',\
        \ required=True)\n    p.add_argument('--manifest-sha256', required=True)\n    a = p.parse_args()\n    print(json.dumps(extract(a.archive,\
        \ a.out, a.archive_sha256, a.manifest_sha256)))\n\n\nif __name__ == '__main__':\n    main()\nPY_R11_BOOTSTRAP\npython3\
        \ -B \"$RUNNER_TEMP/r12-bootstrap.py\" \\\n  --archive \"$GITHUB_WORKSPACE/$REPRO_PACKAGE\" \\\n  --out \"$RUNNER_TEMP/veux-r12-payload\"\
        \ \\\n  --archive-sha256 \"$REPRO_ARCHIVE_SHA256\" \\\n  --manifest-sha256 \"$REPRO_MANIFEST_SHA256\"\nprintf 'REPRO_PAYLOAD=%s\\\
        n' \"$RUNNER_TEMP/veux-r12-payload\" >> \"$GITHUB_ENV\"\n"
    - name: 02 Verify all historical build inputs included inside MAIN
      id: r12_legacy_inputs
      shell: bash
      run: "set -euo pipefail\ninputs=\"$REPRO_PAYLOAD/reference/root_inputs\"\nprintf '%s  %s\\n' \\\n  \"$R5S2_MAIN_SHA256\"\
        \ \"$inputs/$R5S2_MAIN_ZIP\" \\\n  \"$VERSION_MAIN_SHA256\" \"$inputs/$VERSION_MAIN_ZIP\" \\\n  \"$R4_ARCHIVE_SHA256\"\
        \ \"$inputs/$R4_PACKAGE_NAME\" | sha256sum --check --status\n{\n  printf 'R5S2_ARCHIVE=%s\\n' \"$inputs/$R5S2_MAIN_ZIP\"\
        \n  printf 'VERSION_ARCHIVE=%s\\n' \"$inputs/$VERSION_MAIN_ZIP\"\n  printf 'R4_ARCHIVE=%s\\n' \"$inputs/$R4_PACKAGE_NAME\"\
        \n} >> \"$GITHUB_ENV\"\necho 'R12_ALL_LEGACY_ARCHIVES_AUTHENTICATED_INSIDE_MAIN=PASS'\n"
    - name: R4 authenticate source-port payload and run isolation negative tests before baseline build
      shell: bash
      run: "set -euo pipefail\ntest -f \"$R4_ARCHIVE\"\ncat > \"$RUNNER_TEMP/r4-extract-payload.py\" <<'PY_R4_EXTRACT'\n#!/usr/bin/env\
        \ python3\n\"\"\"Extract a SHA-pinned executable payload, refusing unsafe ZIP entries.\"\"\"\nimport argparse\nimport\
        \ hashlib\nimport json\nfrom pathlib import Path, PurePosixPath\nimport stat\nimport zipfile\n\n\ndef extract(archive:\
        \ Path, destination: Path, manifest_sha: str) -> dict:\n    if destination.exists() or destination.is_symlink():\n\
        \        raise ValueError('R4_PAYLOAD_DESTINATION_EXISTS')\n    with zipfile.ZipFile(archive) as source:\n       \
        \ if source.testzip() is not None:\n            raise ValueError('R4_PAYLOAD_ZIP_CRC_FAILED')\n        names = source.namelist()\n\
        \        if len(names) != len(set(names)):\n            raise ValueError('R4_DUPLICATE_ZIP_ENTRY')\n        raw =\
        \ source.read('PAYLOAD_MANIFEST.json')\n        if hashlib.sha256(raw).hexdigest() != manifest_sha:\n            raise\
        \ ValueError('R4_PAYLOAD_MANIFEST_HASH_CHANGED')\n        manifest = json.loads(raw)\n        if manifest.get('schema')\
        \ != 1 or manifest.get('flash_allowed') is not False:\n            raise ValueError('R4_UNTRUSTED_MANIFEST_SCHEMA')\n\
        \        files = manifest.get('files', {})\n        if not files or not all(isinstance(k, str) and isinstance(v, str)\
        \ for k, v in files.items()):\n            raise ValueError('R4_INVALID_PAYLOAD_HASH_MAP')\n        # The final workflow\
        \ and human-facing checksum wrapper are optional ZIP\n        # companions. They are not executed from this extracted\
        \ payload.\n        companions = {'R55H17_R4_CASS_UPDATE_BUILD_NOFLASH.yml', 'SHA256SUMS', 'README.txt'}\n       \
        \ extras = set(names) - set(files) - {'PAYLOAD_MANIFEST.json'}\n        if not extras <= companions:\n           \
        \ raise ValueError('R4_UNMANIFESTED_PAYLOAD_ENTRY')\n        for item in source.infolist():\n            path = PurePosixPath(item.filename)\n\
        \            if (path.is_absolute() or '..' in path.parts or '\\\\' in item.filename\n                    or item.filename.endswith('/')\
        \ or '\\x00' in item.filename\n                    or stat.S_ISLNK(item.external_attr >> 16)):\n                raise\
        \ ValueError('R4_UNSAFE_PAYLOAD_PATH')\n        for name, expected in files.items():\n            data = source.read(name)\n\
        \            if hashlib.sha256(data).hexdigest() != expected:\n                raise ValueError('R4_PAYLOAD_FILE_HASH_CHANGED:'\
        \ + name)\n        destination.mkdir(parents=True)\n        for name in ['PAYLOAD_MANIFEST.json', *sorted(files)]:\n\
        \            target = destination / name\n            target.parent.mkdir(parents=True, exist_ok=True)\n         \
        \   target.write_bytes(source.read(name))\n    return {'status': 'R4_PAYLOAD_AUTHENTICATED', 'files': len(files),\n\
        \            'manifest_sha256': manifest_sha, 'flash_allowed': False}\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n\
        \    parser.add_argument('--archive', type=Path, required=True)\n    parser.add_argument('--out', type=Path, required=True)\n\
        \    parser.add_argument('--manifest-sha256', required=True)\n    args = parser.parse_args()\n    print(json.dumps(extract(args.archive,\
        \ args.out, args.manifest_sha256), sort_keys=True))\n\n\nif __name__ == '__main__':\n    main()\nPY_R4_EXTRACT\npython3\
        \ -B \"$RUNNER_TEMP/r4-extract-payload.py\" --archive \"$R4_ARCHIVE\" --out \"$RUNNER_TEMP/veux-r55h17-r4-payload\"\
        \ --manifest-sha256 \"$R4_MANIFEST_SHA256\"\nprintf 'R4_PAYLOAD=%s\\n' \"$RUNNER_TEMP/veux-r55h17-r4-payload\" >>\
        \ \"$GITHUB_ENV\"\npython3 -B -m unittest discover -s \"$RUNNER_TEMP/veux-r55h17-r4-payload/workflow\" -p test_cass_r4.py\
        \ -v\npython3 -B - \"$RUNNER_TEMP/veux-r55h17-r4-payload\" <<'PY_R4_AST'\nimport ast,sys\nfrom pathlib import Path\n\
        for path in Path(sys.argv[1]).rglob('*.py'):\n    ast.parse(path.read_text(),filename=str(path))\nprint('R4_AUTHENTICATED_PYTHON_SYNTAX=PASS')\n\
        PY_R4_AST\n"
    - name: Activate the pinned ShellCheck 0.11.0 included in MAIN
      id: r12_shellcheck
      shell: bash
      run: 'set -euo pipefail

        tool="$REPRO_PAYLOAD/r12/host-tools/shellcheck"

        printf ''%s  %s\n'' ''4da528ddb3a4d1b7b24a59d4e16eb2f5fd960f4bd9a3708a15baddbdf1d5a55b'' "$tool" | sha256sum --check
        --status

        chmod 0755 "$tool"

        printf ''%s\n'' "$REPRO_PAYLOAD/r12/host-tools" >> "$GITHUB_PATH"

        "$tool" --version

        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

        echo ''R12_PINNED_SHELLCHECK=PASS''

        '
    - name: Verify this workflow using pinned actionlint and runner ShellCheck
      shell: bash
      run: "set -euo pipefail\narchive=\"$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz\"\ncurl --fail --location --silent\
        \ --show-error --retry 3 --max-time 120 \\\n  https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz\
        \ \\\n  --output \"$archive\"\nprintf '%s  %s\\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'\
        \ \"$archive\" | sha256sum --check --status\nmkdir -p \"$RUNNER_TEMP/veux-r5s2-actionlint\"\ntar -xzf \"$archive\"\
        \ -C \"$RUNNER_TEMP/veux-r5s2-actionlint\" actionlint\ncommand -v shellcheck\n\"$RUNNER_TEMP/veux-r5s2-actionlint/actionlint\"\
        \ -oneline .github/workflows/VEUX_R13_CASS_BUILD.yml\necho 'R5S2_ACTIONLINT_AND_SHELLCHECK=PASS'\n\"$RUNNER_TEMP/veux-r5s2-actionlint/actionlint\"\
        \ -oneline .github/workflows/VEUX_R30_STOCK_CASS_ABI_NOFLASH.yml\necho \"R30_OWN_ACTIONLINT_PASS\"\n"
    - name: Authenticate R5S2 archive and full original R5S1 nested CI chain
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nfrom pathlib import Path\nimport hashlib,json,os,stat,zipfile\nf=Path(os.environ['R5S2_ARCHIVE'])\n\
        if hashlib.sha256(f.read_bytes()).hexdigest()!=os.environ['R5S2_MAIN_SHA256']:\n    raise SystemExit('R5S2_ROOT_ARCHIVE_CHANGED')\n\
        with zipfile.ZipFile(f) as z:\n    if z.testzip() is not None:raise SystemExit('R5S2_ARCHIVE_CRC_ERROR')\n    m=json.loads(z.read('MANIFEST_SHA256.json'))\n\
        \    p='common/scripts/veux_r5s2_unpack.py'\n    raw=z.read(p)\n    if m.get('schema')!=1 or m.get('flash_approved')\
        \ is not False or hashlib.sha256(raw).hexdigest()!=m['files'][p]:\n        raise SystemExit('R5S2_BOOTSTRAP_UNVERIFIED')\n\
        output=Path(os.environ['RUNNER_TEMP'])/'veux-r5s2-bootstrap-authenticated.py'\nif output.exists():raise SystemExit('BOOTSTRAP_COLLISION')\n\
        output.write_bytes(raw)\nPY\npython3 \"$RUNNER_TEMP/veux-r5s2-bootstrap-authenticated.py\" \\\n  --main \"$R5S2_ARCHIVE\"\
        \ \\\n  --out \"$RUNNER_TEMP/veux-r5s2-overlay\"\n{\n  printf 'R5S2_OVERLAY=%s\\n' \"$RUNNER_TEMP/veux-r5s2-overlay\"\
        \n  printf 'R5S1_OVERLAY=%s\\n' \"$RUNNER_TEMP/veux-r5s2-overlay/verified-r5s1\"\n  printf 'R5_OVERLAY=%s\\n' \"$RUNNER_TEMP/veux-r5s2-overlay/verified-r5s1/nested_r5_r4_r2/r5\"\
        \n  printf 'R4_OVERLAY=%s\\n' \"$RUNNER_TEMP/veux-r5s2-overlay/verified-r5s1/nested_r5_r4_r2/r4\"\n  printf 'NM211_R2_OVERLAY=%s\\\
        n' \"$RUNNER_TEMP/veux-r5s2-overlay/verified-r5s1/nested_r5_r4_r2/r2\"\n  printf 'R5S1_REFERENCE=%s\\n' \"$RUNNER_TEMP/veux-r5s2-overlay/verified-r5s1/common/sync/VEUX_SYNC_F308_D726_R5_HOOK.c\"\
        \n  printf 'R5_R4_SOURCE=%s\\n' \"$RUNNER_TEMP/veux-r5s2-overlay/verified-r5s1/evidence/R4_COMPILED_REFERENCE_SELINUX.c\"\
        \n  printf 'R5_D726_SOURCE=%s\\n' \"$RUNNER_TEMP/veux-r5s2-overlay/verified-r5s1/evidence/D726_ORIGINAL_REFERENCE_SELINUX.c\"\
        \n  printf 'R5_R4_SOURCE=%s\\n' \"$RUNNER_TEMP/veux-r5s2-overlay/verified-r5s1/nested_r5_r4_r2/R4_COMPILED_REFERENCE_SELINUX.c\"\
        \n  printf 'R5_D726_SOURCE=%s\\n' \"$RUNNER_TEMP/veux-r5s2-overlay/verified-r5s1/nested_r5_r4_r2/D726_ORIGINAL_REFERENCE_SELINUX.c\"\
        \n} >> \"$GITHUB_ENV\"\necho 'R5S2_FULL_ARCHIVE_CHAIN=PASS'\n"
    - name: Authenticate isolated BakaSU version module and full R5S2 source chain
      shell: bash
      run: "set -euo pipefail\npython3 - <<'PY'\nfrom pathlib import Path\nimport hashlib,json,os,stat,zipfile\narchive=Path(os.environ['VERSION_ARCHIVE'])\n\
        if hashlib.sha256(archive.read_bytes()).hexdigest()!=os.environ['VERSION_MAIN_SHA256']:\n    raise SystemExit('GENUINE_VERSION_ARCHIVE_SHA256_MISMATCH')\n\
        dst=Path(os.environ['RUNNER_TEMP'])/'veux-real-version-overlay'\nif dst.exists():raise SystemExit('VERSION_OVERLAY_ALREADY_EXISTS')\n\
        with zipfile.ZipFile(archive) as z:\n    if z.testzip() is not None:raise SystemExit('VERSION_OVERLAY_CRC_FAILED')\n\
        \    m=json.loads(z.read('MANIFEST_SHA256.json'))\n    if (m.get('schema')!=1 or m.get('flash_approved') is not False\n\
        \        or m.get('expected_real_version')!=35234):\n        raise SystemExit('VERSION_MANIFEST_UNTRUSTED')\n    expected=set(m['files'])|{'MANIFEST_SHA256.json'}\n\
        \    if set(z.namelist())!=expected:raise SystemExit('VERSION_OVERLAY_FILES_CHANGED')\n    for item in z.infolist():\n\
        \        name=item.filename\n        p=Path(name)\n        if (p.is_absolute() or '..' in p.parts or (len(p.parts)<2\
        \ and name!='MANIFEST_SHA256.json')\n            or (item.external_attr>>16)&0o170000==0o120000):\n            raise\
        \ SystemExit('UNSAFE_VERSION_OVERLAY_PATH')\n        data=z.read(name)\n        if name!='MANIFEST_SHA256.json' and\
        \ hashlib.sha256(data).hexdigest()!=m['files'][name]:\n            raise SystemExit('VERSION_OVERLAY_FILE_SHA_FAILED:'+name)\n\
        \    dst.mkdir(parents=True)\n    for item in z.infolist():\n        target=dst/item.filename\n        target.parent.mkdir(parents=True,exist_ok=True)\n\
        \        target.write_bytes(z.read(item.filename))\nprint('VEUX_TRUE_VERSION_HASH_PINNED_BOOTSTRAP=PASS')\nPY\nprintf\
        \ 'VERSION_OVERLAY=%s\\n' \"$RUNNER_TEMP/veux-real-version-overlay\" >> \"$GITHUB_ENV\"\necho 'R5S2_REAL_VERSION_SOURCE_OVERLAY=PASS'\n"
    - name: Run R1-R5S1 regression tests and all new R5S2 negative tests
      shell: bash
      run: 'set -euo pipefail

        export PYTHONPATH="$R5S2_OVERLAY/common/scripts:$R5S1_OVERLAY/common/scripts:$R5_OVERLAY/common/scripts:$R4_OVERLAY/common/scripts:$NM211_R2_OVERLAY/common/scripts${PYTHONPATH:+:$PYTHONPATH}"

        python3 -m unittest discover -s "$NM211_R2_OVERLAY/Tests" -p test_veux_r6_nomount211_preflight_r1.py -v

        python3 -m unittest discover -s "$NM211_R2_OVERLAY/Tests" -p test_veux_r6_nomount211_build_r2.py -v

        python3 -m unittest discover -s "$R4_OVERLAY/Tests" -p test_susfs_selinux54_r3.py -v

        python3 -m unittest discover -s "$R4_OVERLAY/Tests" -p test_veux_r6_susfs_selinux54_build_r4.py -v

        python3 -m unittest discover -s "$R5_OVERLAY/Tests" -p test_veux_r5_susfs_selinux.py -v

        python3 -m unittest discover -s "$R5S1_OVERLAY/Tests" -p test_veux_sync_susfs_r1.py -v

        python3 -m unittest discover -s "$R5S2_OVERLAY/Tests" -p test_veux_r5s2_522.py -v

        export PYTHONPATH="$VERSION_OVERLAY/common/scripts:$PYTHONPATH"

        python3 -m unittest discover -s "$VERSION_OVERLAY/Tests" -p test_veux_r5s2_true_version.py -v

        test -z "$(git status --porcelain --untracked-files=all)"

        echo ''R5S2_HISTORICAL_AND_REAL_GIT_VERSION_TESTS=PASS''

        '
    - name: Install documented build dependencies and pinned Python packages
      shell: bash
      run: "set -euo pipefail\nsudo apt-get update\nsudo apt-get install -y --no-install-recommends \\\n  bc binutils binutils-aarch64-linux-gnu\
        \ bison build-essential ca-certificates curl dwarves file flex \\\n  git jq libelf-dev libncurses-dev libssl-dev openssl\
        \ perl python3 \\\n  python3-venv python3-yaml rsync unzip zip xz-utils zstd\npython3 -m venv \"$RUNNER_TEMP/veux-r5s2-venv\"\
        \n\"$RUNNER_TEMP/veux-r5s2-venv/bin/python\" -m pip install \\\n  --disable-pip-version-check --retries 2 --timeout\
        \ 30 \\\n  ruamel.yaml==0.19.1 PyYAML==6.0.3\nprintf 'R5S2_PY=%s\\n' \"$RUNNER_TEMP/veux-r5s2-venv/bin/python\" >>\
        \ \"$GITHUB_ENV\"\n"
    - name: R4 verify every Bash stage and embedded Python before kernel compilation
      shell: bash
      run: "set -euo pipefail\ncommand -v shellcheck\nmkdir -p \"$RUNNER_TEMP/r55h17-r4-shellcheck\"\npython3 - \".github/workflows/VEUX_R13_CASS_BUILD.yml\"\
        \ \"$RUNNER_TEMP/r55h17-r4-shellcheck\" <<'PY_R4_SC'\nimport ast,re,sys\nfrom pathlib import Path\nimport yaml\nsource=Path(sys.argv[1]);\
        \ destination=Path(sys.argv[2])\ndocument=yaml.safe_load(source.read_text())\nfor i,step in enumerate(document['jobs']['r5s2_bakasu_522']['steps']):\n\
        \    if 'run' in step:\n        if step.get('shell')!='bash':raise SystemExit('UNREVIEWED_RUN_SHELL')\n        (destination\
