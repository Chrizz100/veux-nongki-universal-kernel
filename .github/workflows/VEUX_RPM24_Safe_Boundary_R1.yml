name: VEUX - RPM24 safe boundary repair R2 - 5.4.274
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: veux-v4-daily-upstream-candidate-main
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  integrate:
    name: Fix RPM24, test, compile and publish only after PASS
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    - name: Checkout current main
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Verify repository and bounded dependencies
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_REPOSITORY\" = Chrizz100/veux-nongki-universal-kernel\ntest \"$GITHUB_REF\" = refs/heads/main\ntest -z \"$(git status --porcelain --untracked-files=all)\"\ngit checkout -B main \"$(git rev-parse HEAD)\"\necho \"BASE_SHA=$(git rev-parse HEAD)\" >> \"$GITHUB_ENV\"\nmissing=()\nfor package in bc binutils bison build-essential ca-certificates curl dwarves file flex git jq libelf-dev libncurses-dev libssl-dev perl python3 python3-venv rsync unzip zip xz-utils zstd; do\n  if ! dpkg-query -W -f='${Status}' \"$package\" 2>/dev/null | grep -qx 'install ok installed'; then\n    missing+=(\"$package\")\n  fi\ndone\nif ((${#missing[@]})); then\n  timeout --kill-after=15s 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update\n  timeout --kill-after=15s 240s sudo apt-get -o DPkg::Lock::Timeout=60 install -y --no-install-recommends \"${missing[@]}\"\nfi\npython3 -m venv \"$RUNNER_TEMP/veux-python\"\nPY=\"$RUNNER_TEMP/veux-python/bin/python\"\ntimeout --kill-after=10s 180s \"$PY\" -m pip install --disable-pip-version-check --retries 2 --timeout 30 ruamel.yaml==0.19.1 PyYAML==6.0.3\n\"$PY\" -c 'import ruamel.yaml, yaml'\necho \"PY=$PY\" >> \"$GITHUB_ENV\"\necho \"TOOLS=$RUNNER_TEMP/veux-rpm24-implementation\" >> \"$GITHUB_ENV\"\necho \"PAYLOAD=$RUNNER_TEMP/veux-rpm24-implementation\" >> \"$GITHUB_ENV\"\nmkdir -p \"$RUNNER_TEMP/veux-rpm24-report\"\n"
    - name: Unpack hash-authenticated RPM24 payload
      shell: bash
      run: "set -euo pipefail\n\"$PY\" - <<'PYCODE'\nimport base64,gzip,hashlib,json,os\nfrom pathlib import Path,PurePosixPath\nblob=base64.b64decode(\"\",validate=True)\nraw=gzip.decompress(blob)\nif len(raw)>200000:raise ValueError('payload too large')\nif hashlib.sha256(raw).hexdigest()!=\"cbe8c09c18a4cbe121fbe062ed22faa610834ab8cf7438b9fbf63ddde7cd139d\":raise ValueError('payload SHA256 mismatch')\ndata=json.loads(raw)\nexpected={'common/scripts/veux_rpm24.py','common/scripts/test_veux_rpm24.py',\n          'install_rpm24.py','ci_rpm24.py','targets-reviewed-35217.json'}\nif data.get('schema')!=1 or set(data.get('files',{}))!=expected:raise ValueError('payload file list drift')\nroot=Path(os.environ['RUNNER_TEMP'])/'veux-rpm24-implementation'\nroot.mkdir(exist_ok=False)\nfor name,content in data['files'].items():\n    rel=PurePosixPath(name)\n    if rel.is_absolute() or '..' in rel.parts or '\\\\' in name:raise ValueError('unsafe payload name')\n    p=root/name;p.parent.mkdir(parents=True,exist_ok=True)\n    p.write_bytes(base64.b64decode(content,validate=True))\nfor p in root.rglob('*.py'):\n    compile(p.read_bytes(),str(p),'exec')\nprint('RPM24_PAYLOAD=AUTHENTICATED; NO_REPOSITORY_MUTATION')\nPYCODE\n"
    - name: Require old release tests before any changes
      shell: bash
      run: "set -euo pipefail\n\"$PY\" \"$TOOLS/ci_rpm24.py\" pretests 2>&1 | tee \"$RUNNER_TEMP/veux-rpm24-report/pretests.log\"\ntest -z \"$(git status --porcelain --untracked-files=all)\"\n"
    - name: Apply RPM24 integration idempotently to current source
      shell: bash
      run: "set -euo pipefail\n\"$PY\" \"$TOOLS/install_rpm24.py\" \"$GITHUB_WORKSPACE\" \"$TOOLS\" 2>&1 | tee \"$RUNNER_TEMP/veux-rpm24-report/install.log\"\n\"$PY\" \"$TOOLS/install_rpm24.py\" \"$GITHUB_WORKSPACE\" \"$TOOLS\" | grep -q 'RPM24_INSTALL=PASS'\ntest -z \"$(git diff --check)\"\n"
    - name: Run all release and RPM24 C host tests twice
      shell: bash
      run: "set -euo pipefail\nfor pass in 1 2; do\n  \"$PY\" \"$TOOLS/ci_rpm24.py\" tests 2>&1 | tee \"$RUNNER_TEMP/veux-rpm24-report/tests-$pass.log\"\ndone\n"
    - name: Commit only four reviewed source files locally
      shell: bash
      run: "set -euo pipefail\npaths=(common/scripts/veux_rpm24.py common/scripts/test_veux_rpm24.py common/scripts/veux_release_device.py common/scripts/test_veux_device_fixes.py)\ngit add -- \"${paths[@]}\"\ngit diff --cached --check\ntest \"$(git diff --cached --name-only | wc -l)\" -le 4\n\"$PY\" - <<'PYCODE'\nimport subprocess\nallowed={'common/scripts/veux_rpm24.py','common/scripts/test_veux_rpm24.py',\n         'common/scripts/veux_release_device.py','common/scripts/test_veux_device_fixes.py'}\nchanged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())\nif not changed or not changed<=allowed:raise ValueError('wrong RPM24 commit file scope')\nprint('RPM24_SOURCE_CHANGE_SCOPE=PASS')\nPYCODE\ngit -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Repair RPM24 false boundary result without exceeding SMD capacity [skip ci]'\necho \"BUILD_SHA=$(git rev-parse HEAD)\" >> \"$GITHUB_ENV\"\ntest -z \"$(git status --porcelain --untracked-files=all)\"\n"
    - name: Reconstruct exact previously tested 35217 UAPI5 target
      shell: bash
      run: "set -euo pipefail\n\"$PY\" \"$TOOLS/ci_rpm24.py\" bundle 2>&1 | tee \"$RUNNER_TEMP/veux-rpm24-report/bundle.log\"\ntest -z \"$(git status --porcelain --untracked-files=all)\"\n"
    - name: Build 5.4.274, RMNET, CPU limits and new RPM24 guard
      id: kernel
      shell: bash
      run: "set -euo pipefail\n\"$PY\" -u common/scripts/veux_release_device.py worker \\\n  --kernel 5.4.274 --bundle \"$RUNNER_TEMP/veux-targets\" \\\n  --work \"$RUNNER_TEMP/veux-builds/5.4.274\" \\\n  --public \"$RUNNER_TEMP/veux-public/5.4.274\" \\\n  --overlays \"$RUNNER_TEMP/veux-overlays\" --jobs 4 \\\n  2>&1 | tee \"$RUNNER_TEMP/veux-rpm24-report/build.log\"\n\"$PY\" \"$TOOLS/ci_rpm24.py\" verify\ntest -z \"$(git status --porcelain --untracked-files=all)\"\n"
    - name: Retain validated candidate even if push subsequently conflicts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.kernel.outputs.artifact_name }}_RPM24_${{ github.run_id }}
        path: ${{ runner.temp }}/veux-public/5.4.274/
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
    - name: Push only if original main is unchanged and all checks green
      shell: bash
      run: "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"$BUILD_SHA\"\ntest -z \"$(git status --porcelain --untracked-files=all)\"\nremote_head=\"$(git ls-remote origin refs/heads/main | awk '{print $1}')\"\nif [ \"$remote_head\" != \"$BASE_SHA\" ]; then\n  echo '::error::main changed during validation; candidate artifacts retained, no repository push'\n  exit 1\nfi\nAUTH_HEADER=\"$(printf 'x-access-token:%s' \"$GH_TOKEN\" | base64 -w0)\"\necho \"::add-mask::$AUTH_HEADER\"\nexport GIT_CONFIG_COUNT=1\nexport GIT_CONFIG_KEY_0=http.https://github.com/.extraheader\nexport GIT_CONFIG_VALUE_0=\"AUTHORIZATION: basic $AUTH_HEADER\"\ngit push origin HEAD:refs/heads/main\nprintf 'RPM24_REPAIR_COMMIT=%s\\nCI_PASS=YES\\nDEVICE_PASS=NO\\nCURRENT_PROMOTION=NO\\n' \"$BUILD_SHA\" | tee \"$RUNNER_TEMP/veux-rpm24-report/FINAL.txt\"\n"
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Preserve complete build and host diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: VEUX-RPM24-Evidence-${{ github.run_id }}
        path: "${{ runner.temp }}/veux-rpm24-report/\n${{ runner.temp }}/veux-builds/diagnostics/5.4.274/"
        if-no-files-found: warn
        retention-days: 30
        compression-level: 6
