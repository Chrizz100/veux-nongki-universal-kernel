# VEUX Stock 5.4.274 source ABI-reconstruction R2 - pinned stock Clang, NOFLASH
# Reuses the immutable, previously proven R1 source reference.
name: VEUX STOCK 5.4.274 source ABI reconstruction R2 - NOFLASH
on:
  workflow_dispatch:
    inputs:
      compile_probe:
        description: "Optional donor 5.4.268 diagnostic compile only (NOFLASH)"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: stock-54274-recon-r2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stock_source_abi_r2:
    if: ${{ github.repository == 'Chrizz100/veux-nongki-universal-kernel' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      R1_ARCHIVE: VEUX_STOCK_54274_SOURCE_RECON_R1_MAIN.zip
      R1_SHA256: 04a8bc015abd2a8b9c5adf17b63f97f75e9cd06fb038480d695ff0263e758789
      R2_ARCHIVE: VEUX_STOCK_54274_SOURCE_RECON_R2_MAIN.zip
      R2_SHA256: fdf72f74fc9f2ca219d80d726387c7e9c2ba917c74761331d4906ae9ee022f68
      DONOR_SHA: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
      DONOR_URL: https://github.com/dereference23/kernel_xiaomi_sm6375.git
      CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
      CLANG_BRANCH: android11-qpr2-release
      CLANG_TREE: 1c7dcc2e7095197f7a05dff22a875b6b02ed7117
    steps:
      - name: Checkout exact main revision read only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: actionlint syntax and GitHub workflow semantics - pinned tool
        shell: bash
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/veux-stock-r2-tools"
          mkdir -p "$GOBIN"
          GOTOOLCHAIN=local go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$GOBIN/actionlint" ".github/workflows/VEUX_STOCK_54274_SOURCE_RECON_R2_NOFLASH.yml"
          echo 'R2_WORKFLOW_ACTIONLINT=PASS'

      - name: Authenticate both MAIN ZIPs and safely extract exact paths
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-stock-r2"
          mkdir -p "$ROOT/reports"
          printf '%s  %s\n' "$R1_SHA256" "$GITHUB_WORKSPACE/$R1_ARCHIVE" | sha256sum --check --strict
          printf '%s  %s\n' "$R2_SHA256" "$GITHUB_WORKSPACE/$R2_ARCHIVE" | sha256sum --check --strict
          python3 -I - "$GITHUB_WORKSPACE/$R2_ARCHIVE" "$GITHUB_WORKSPACE/$R1_ARCHIVE" "$ROOT" <<'PY_AUTH'
          import hashlib,json,stat,sys
          from pathlib import Path,PurePosixPath
          from zipfile import ZipFile
          r2,r1,root=map(Path,sys.argv[1:]); sha=lambda x:hashlib.sha256(x).hexdigest()
          for path,folder,size_limit in ((r1,root/'r1',12_000_000),(r2,root/'r2',2_000_000)):
              if path.is_symlink() or not path.is_file():raise RuntimeError('MAIN_ZIP_NOT_REGULAR')
              with ZipFile(path) as z:
                  infos=z.infolist();names=[i.filename for i in infos]
                  if not names or len(names)!=len(set(names)) or z.testzip() is not None:
                      raise RuntimeError('MAIN_DUPLICATE_OR_CORRUPT')
                  if sum(i.file_size for i in infos)>size_limit:raise RuntimeError('MAIN_SIZE_LIMIT')
                  manifest=json.loads(z.read('MANIFEST_SHA256.json'))
                  schema=('VEUX_STOCK_54274_REFERENCE_MAIN_R1' if folder.name=='r1'
                          else 'VEUX_STOCK_54274_SOURCE_RECON_MAIN_R2')
                  if manifest['schema']!=schema or manifest['flash_allowed'] is not False:
                      raise RuntimeError('MANIFEST_SCHEMA_OR_FLASH_DRIFT')
                  if manifest['donor_commit']!='b2b7a3bbc36d120ee523ebc8d68e0f13a97df632':
                      raise RuntimeError('DONOR_COMMIT_DRIFT')
                  if set(names)!=(set(manifest['files'])|{'MANIFEST_SHA256.json'}):
                      raise RuntimeError('MAIN_PATH_DRIFT')
                  folder.mkdir(parents=True,exist_ok=False)
                  for i in infos:
                      rel=PurePosixPath(i.filename)
                      if rel.is_absolute() or '..' in rel.parts or str(rel)!=i.filename or '\\' in i.filename:
                          raise RuntimeError('UNSAFE_PATH')
                      if i.is_dir() or stat.S_IFMT(i.external_attr>>16) not in (0,stat.S_IFREG):
                          raise RuntimeError('UNSAFE_FILE_TYPE')
                      raw=z.read(i.filename)
                      if i.filename!='MANIFEST_SHA256.json' and sha(raw)!=manifest['files'][i.filename]:
                          raise RuntimeError('BAD_INNER_SHA:'+i.filename)
                      target=folder.joinpath(*rel.parts)
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(raw)
                  (root/'reports'/('R1_MAIN_VERIFIED.txt' if folder.name=='r1' else 'R2_MAIN_VERIFIED.txt')).write_text('PINNED_ARCHIVE_AND_CONTENT_HASH_PASS\n')
          print('R1_AND_R2_MAIN_HASH_PATH_GUARD=PASS')
          PY_AUTH

      - name: Verify stock kernel config and all original embedded headers; R2 tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-stock-r2"
          python3 -B "$ROOT/r1/tools/verify_reference.py" --main "$ROOT/r1" \
            --out "$ROOT/reports/R1_STOCK_REFERENCE_VERIFIED.json"
          python3 -B -m unittest discover -s "$ROOT/r1/tools" -p 'test_*.py' -v 2>&1 | \
            tee "$ROOT/reports/R1_TESTS.log"
          python3 -B -m unittest discover -s "$ROOT/r2/tools" -p 'test_*.py' -v 2>&1 | \
            tee "$ROOT/reports/R2_TESTS.log"

      - name: Checkout exact pinned donor source in isolated temporary folder
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-stock-r2"
          SRC="$ROOT/donor"
          mkdir -p "$SRC"
          git -C "$SRC" init -q
          git -C "$SRC" remote add origin "$DONOR_URL"
          git -C "$SRC" -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=120 \
            fetch --no-tags --filter=blob:none --depth=1 origin "$DONOR_SHA"
          git -C "$SRC" checkout --detach -q FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$DONOR_SHA"
          test -z "$(git -C "$SRC" status --porcelain)"
          git -C "$SRC" rev-parse HEAD > "$ROOT/reports/DONOR_COMMIT.txt"

      - name: Fetch exact AOSP stock compiler tree (no replacement by GCC)
        shell: bash
        timeout-minutes: 40
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-stock-r2"
          CLANG_GIT="$ROOT/aosp-clang"
          git init -q "$CLANG_GIT"
          git -C "$CLANG_GIT" remote add origin "$CLANG_URL"
          git -C "$CLANG_GIT" sparse-checkout init --cone
          git -C "$CLANG_GIT" sparse-checkout set clang-r383902b1
          git -C "$CLANG_GIT" -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=180 \
            fetch --no-tags --depth=1 --filter=blob:none origin "refs/heads/$CLANG_BRANCH" \
            2>&1 | tee "$ROOT/reports/AOSP_CLANG_FETCH.log"
          git -C "$CLANG_GIT" checkout --detach -q FETCH_HEAD
          TREE_ACTUAL="$(git -C "$CLANG_GIT" rev-parse HEAD:clang-r383902b1)"
          test "$TREE_ACTUAL" = "$CLANG_TREE"
          CLANG_DIR="$CLANG_GIT/clang-r383902b1/bin"
          test -x "$CLANG_DIR/clang"
          "$CLANG_DIR/clang" --version > "$ROOT/reports/CLANG_VERSION.txt"
          grep -F 'Android (6877366 based on r383902b1) clang version 11.0.2' \
            "$ROOT/reports/CLANG_VERSION.txt"
          printf 'AOSP_CLANG_GIT_TREE=%s\n' "$TREE_ACTUAL" > "$ROOT/reports/AOSP_TOOLCHAIN_PROVENANCE.txt"
          echo 'AOSP_STOCK_CLANG=PINNED_AND_VERIFIED'

      - name: Resolve original stock configuration using exact Android Clang 11
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-stock-r2"
          BIN="$ROOT/aosp-clang/clang-r383902b1/bin"
          export PATH="$BIN:$PATH"
          OUT="$ROOT/stock-config-out"
          mkdir -p "$OUT"
          cp "$ROOT/r1/reference/stock.config" "$OUT/.config"
          make -C "$ROOT/donor" O="$OUT" ARCH=arm64 \
            CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 olddefconfig \
            2>&1 | tee "$ROOT/reports/CLANG11_OLDDEFCONFIG.log"
          cp "$OUT/.config" "$ROOT/reports/Donor_olddefconfig.config"
          grep -F 'CONFIG_CC_IS_CLANG=y' "$OUT/.config"
          grep -F 'CONFIG_CLANG_VERSION=110002' "$OUT/.config"

      - name: Independently classify generated headers and actual source gaps
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-stock-r2"
          python3 -B "$ROOT/r1/tools/compare_candidate.py" \
            --main "$ROOT/r1" --source "$ROOT/donor" \
            --out "$ROOT/reports" --resolved-config "$ROOT/stock-config-out/.config"
          python3 -B "$ROOT/r2/tools/stock_source_r2.py" \
            --r1-main "$ROOT/r1" --r1-reports "$ROOT/reports" \
            --clang-version-file "$ROOT/reports/CLANG_VERSION.txt" \
            --out "$ROOT/reports"
          echo 'R2_STOCK_HEADER_AND_CONFIG_DIAGNOSTIC=PASS; OEM_ABI_GREEN=FALSE; FLASH=NO'

      - name: Optional donor compile probe for next source-gap diagnosis - NOFLASH
        if: ${{ inputs.compile_probe }}
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/veux-stock-r2"
          export PATH="$ROOT/aosp-clang/clang-r383902b1/bin:$PATH"
          set +e
          timeout 1800s make -C "$ROOT/donor" O="$ROOT/stock-config-out" \
            ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            -j2 Image dtbs > "$ROOT/reports/OPTIONAL_DONOR_54268_BUILD.log" 2>&1
          RC=$?
          set -e
          printf '%s\n' "$RC" > "$ROOT/reports/OPTIONAL_DONOR_BUILD_RETURN_CODE.txt"
          tail -n 100 "$ROOT/reports/OPTIONAL_DONOR_54268_BUILD.log"
          python3 -B - "$ROOT/reports/OPTIONAL_DONOR_BUILD_RETURN_CODE.txt" "$ROOT/reports/OPTIONAL_DONOR_BUILD_SUMMARY.json" <<'PY_PROBE'
          import json,sys
          from pathlib import Path
          rc=int(Path(sys.argv[1]).read_text().strip())
          Path(sys.argv[2]).write_text(json.dumps({'donor_version':'5.4.268',
            'diagnostic_compile_exit_code':rc,'image_flashable':False,
            'stock_source_5_4_274_recovered':False,'oem_abi_green':False,
            'purpose':'compiler blockers only; not a stock rebuild'},indent=2)+'\n')
          print('DONOR_5_4_268_COMPILE_DIAGNOSTIC_EXIT',rc,'FLASH=NO')
          PY_PROBE

      - name: Always publish R2 text diagnostics only - no binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VEUX-STOCK-54274-R2-SOURCE-ABI-NOFLASH-${{ github.run_id }}
          path: ${{ runner.temp }}/veux-stock-r2/reports/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
