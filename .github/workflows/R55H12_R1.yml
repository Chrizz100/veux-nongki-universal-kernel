        path: project
        fetch-depth: 1
        persist-credentials: false
    - name: Require exact unchanged P11 R4, R6, and R7 root ZIPs
      id: package
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_REPOSITORY\" = 'Chrizz100/veux-nongki-universal-kernel'\n test\
        \ \"$GITHUB_REF\" = 'refs/heads/main'\n test \"$(git -C project rev-parse HEAD)\" = \"$GITHUB_SHA\"\n\
        \ test -f \"project/$PACKAGE_NAME\" && test ! -L \"project/$PACKAGE_NAME\"\n test -f \"project/$R6_PACKAGE_NAME\"\
        \ && test ! -L \"project/$R6_PACKAGE_NAME\"\n printf '%s  %s\\n' \"$PACKAGE_SHA256\" \"project/$PACKAGE_NAME\"\
        \ | sha256sum -c -\n printf '%s  %s\\n' \"$R6_PACKAGE_SHA256\" \"project/$R6_PACKAGE_NAME\" | sha256sum\
        \ -c -\n echo 'present=true' >> \"$GITHUB_OUTPUT\"\n echo 'R6_ROOT_INPUTS=PASS'\n\ntest -f \"project/$R7_PACKAGE_NAME\"\
        \ && test ! -L \"project/$R7_PACKAGE_NAME\"\nprintf '%s  %s\\n' \"$R7_PACKAGE_SHA256\" \"project/$R7_PACKAGE_NAME\"\
        \ | sha256sum -c -\necho 'R7_ROOT_INPUT=PASS'\n"
    - name: R44-R2 pin all sources, run 23 adversarial regressions and lint exact workflow
      shell: bash
      run: "set -euo pipefail\ntest \"$GITHUB_REPOSITORY\" = 'Chrizz100/veux-nongki-universal-kernel'\ntest\
        \ \"$GITHUB_REF\" = 'refs/heads/main'\ntest \"$(git -C project rev-parse HEAD)\" = \"$GITHUB_SHA\"\n\
        mkdir -p \"$R44_DIR\" \"$R44_OUT\" \"$R44_WORK\"\nprintf '%s  %s\\n' '745d80b8502a9beea513a2e7a58bb59272539b7508920d235ce2e79741bda528'\
        \ project/VEUX_R39_R2_MEMORY_ABI_MAIN.zip \\\n '15491bbb02140204a1e3e278d279668edb66ef7fe8052d0decd80f47b1e9a32f'\
        \ project/VEUX_R37_DEVICE_EVIDENCE.zip \\\n '1eb9edcf361e2c5ada4316768ddf3b70e9a4a853fec81b99c8d92d0f10f198eb'\
        \ project/VEUX_OEM_WALT_R26_R2_SYMVERS_SEMANTIC_PROOF_MAIN.zip | sha256sum -c -\ncat > \"$R44_DIR/r42_stock_capture.py\"\
        \ <<'R44_PAYLOAD_r42_stock_capture_py'\n#!/usr/bin/env python3\n\"\"\"R42-R2: read-only capture of Stock\
        \ VEUX GPU cooling node and references.\n\nAll input binaries remain untouched. The output is evidence,\
        \ NOT an applicable patch.\n\"\"\"\nimport argparse\nimport hashlib\nimport io\nimport json\nimport\
        \ pathlib\nimport stat\nimport struct\nimport subprocess\nimport tempfile\nimport zipfile\n\nR39_SHA256\
        \ = '745d80b8502a9beea513a2e7a58bb59272539b7508920d235ce2e79741bda528'\nR20_DTB_SHA256 = '42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37'\n\
        STOCK_GFX = '/soc/qcom,rpm-smd/rpm-regulator-smpa8/gfx-cdev'\nR20_GFX = '/soc/devfreq-vdd-cdev'\n\n\n\
        def require(condition, label):\n    if not condition:\n        raise ValueError(label)\n\n\ndef digest(data):\n\
        \    return hashlib.sha256(data).hexdigest()\n\n\ndef members(archive, required):\n    \"\"\"Return\
        \ selected members after checking archive integrity and safe boundaries.\"\"\"\n    with zipfile.ZipFile(archive)\
        \ as z:\n        infos = z.infolist()\n        names = [x.filename for x in infos]\n        require(len(names)\
        \ == len(set(names)), 'ZIP_DUPLICATE_MEMBERS')\n        require(z.testzip() is None, 'ZIP_BAD_CRC')\n\
        \        require(len(infos) <= 35, 'ZIP_TOO_MANY_MEMBERS')\n        require(sum(x.file_size for x in\
        \ infos) < 20_000_000, 'ZIP_TOTAL_TOO_LARGE')\n        for info in infos:\n            path = pathlib.PurePosixPath(info.filename)\n\
        \            require(not path.is_absolute() and '..' not in path.parts, 'ZIP_UNSAFE_PATH')\n       \
        \     require(not stat.S_ISLNK(info.external_attr >> 16), 'ZIP_UNSAFE_SYMLINK')\n            require(info.file_size\
        \ < 8_000_000, 'ZIP_MEMBER_TOO_LARGE')\n        require(set(required) <= set(names), 'ZIP_REQUIRED_MISSING')\n\
        \        return {name: z.read(name) for name in required}\n\n\ndef merge(dtb, overlay):\n    with tempfile.TemporaryDirectory(prefix='veux-r42-dtbo-')\
        \ as tmp:\n        tmp = pathlib.Path(tmp)\n        base = tmp / 'base.dtb'\n        over = tmp / 'candidate.dtbo'\n\
        \        merged = tmp / 'merged.dtb'\n        base.write_bytes(dtb)\n        over.write_bytes(overlay)\n\
        \        p = subprocess.run(['fdtoverlay', '-i', str(base), '-o', str(merged), str(over)],\n       \
        \                    capture_output=True, timeout=45, check=False)\n        require(p.returncode ==\
        \ 0, 'FDTOVERLAY_FAILED:' + p.stderr[:100].decode(errors='replace'))\n        return merged.read_bytes()\n\
        \n\ndef fdt_properties(data):\n    \"\"\"Parse FDT nodes and raw properties, with strict header and\
        \ bounds checks.\"\"\"\n    require(len(data) >= 40 and len(data) < 8_000_000, 'FDT_SIZE')\n    hdr\
        \ = struct.unpack_from('>10I', data)\n    magic, total, offset_struct, offset_strings, _off_mem, _ver,\
        \ _last, _boot, size_strings, size_struct = hdr\n    require(magic == 0xd00dfeed and 40 <= total <=\
        \ len(data), 'FDT_HEADER')\n    require(offset_struct >= 40 and offset_struct + size_struct <= total,\
        \ 'FDT_STRUCT_BOUNDS')\n    require(offset_strings >= 40 and offset_strings + size_strings <= total,\
        \ 'FDT_STRING_BOUNDS')\n    nodes = {}\n    stack = []\n    pos = offset_struct\n    end = offset_struct\
        \ + size_struct\n    while pos + 4 <= end:\n        token = struct.unpack_from('>I', data, pos)[0]\n\
        \        pos += 4\n        if token == 1:  # BEGIN_NODE\n            require(b'\\0' in data[pos:end],\
        \ 'FDT_UNTERMINATED_NODE')\n            finish = data.index(b'\\0', pos, end)\n            name = data[pos:finish].decode('utf-8')\n\
        \            pos = (finish + 4) & ~3\n            path = stack[-1].rstrip('/') + '/' + name if stack\
        \ else '/'\n            require(path not in nodes, 'FDT_DUPLICATE_NODE')\n            nodes[path] =\
        \ {}\n            stack.append(path)\n        elif token == 2:  # END_NODE\n            require(bool(stack),\
        \ 'FDT_UNBALANCED_END')\n            stack.pop()\n        elif token == 3:  # PROP\n            require(bool(stack)\
        \ and pos + 8 <= end, 'FDT_INVALID_PROPERTY_HEADER')\n            length, off = struct.unpack_from('>II',\
        \ data, pos)\n            pos += 8\n            require(length < 1_000_000 and pos + length <= end,\
        \ 'FDT_PROPERTY_BOUNDS')\n            require(off < size_strings, 'FDT_PROPERTY_STRING_OFFSET')\n  \
        \          name_start = offset_strings + off\n            require(b'\\0' in data[name_start:offset_strings\
        \ + size_strings], 'FDT_UNTERMINATED_KEY')\n            key_end = data.index(b'\\0', name_start, offset_strings\
        \ + size_strings)\n            key = data[name_start:key_end].decode('utf-8')\n            require(key\
        \ not in nodes[stack[-1]], 'FDT_DUPLICATE_PROPERTY')\n            nodes[stack[-1]][key] = data[pos:pos\
        \ + length]\n            pos = (pos + length + 3) & ~3\n        elif token == 4:  # NOP\n          \
        \  continue\n        elif token == 9:  # END\n            require(not stack, 'FDT_UNCLOSED_NODES')\n\
        \            return nodes\n        else:\n            raise ValueError('FDT_UNKNOWN_TOKEN')\n    raise\
        \ ValueError('FDT_NO_END')\n\n\ndef status(props):\n    return props.get('status', b'okay\\0').rstrip(b'\\\
        0').decode('ascii')\n\n\ndef phandle(props):\n    val = props.get('phandle') or props.get('linux,phandle')\n\
        \    require(val is not None and len(val) == 4, 'INVALID_PROVIDER_PHANDLE')\n    ident = int.from_bytes(val,\
        \ 'big')\n    require(ident != 0, 'INVALID_PROVIDER_PHANDLE_ZERO')\n    return ident\n\n\ndef cooling_maps(tree,\
        \ provider_path, tree_name):\n    ident = phandle(tree[provider_path])\n    rows = []\n    for path,\
        \ props in sorted(tree.items()):\n        if '/thermal-zones/' not in path or '/cooling-maps/' not in\
        \ path:\n            continue\n        cells = props.get('cooling-device', b'')\n        require(len(cells)\
        \ % 4 == 0, 'COOLING_CELLS_UNALIGNED')\n        if len(cells) >= 4 and int.from_bytes(cells[:4], 'big')\
        \ == ident:\n            # The original R41 evidence identifies single entries with two cells.\n   \
        \         require(len(cells) == 12, 'COOLING_CELLS_AMBIGUOUS')\n            rows.append({'tree': tree_name,\
        \ 'map_path': path, 'provider_path': provider_path,\n                         'phandle': ident, 'min_state':\
        \ int.from_bytes(cells[4:8], 'big'),\n                         'max_state': int.from_bytes(cells[8:12],\
        \ 'big')})\n    require(len(rows) == 2, 'COOLING_REFERENCES_NOT_TWO:' + tree_name)\n    return rows\n\
        \n\ndef format_comment(key, value):\n    if value and value.endswith(b'\\0') and all(i == 0 or 32 <=\
        \ i <= 126 for i in value):\n        rendered = ', '.join(json.dumps(s.decode('ascii')) for s in value.rstrip(b'\\\
        0').split(b'\\0'))\n    elif not value:\n        rendered = ''\n    elif len(value) % 4 == 0:\n    \
        \    rendered = '<' + ' '.join(f'0x{int.from_bytes(value[i:i + 4], \"big\"):08x}' for i in range(0,\
