    - name: R55H12 export SHA-authenticated Built-in ARM64 Image and VEUX DTB NO FLASH
      shell: bash
      run: |
        set -euo pipefail
        test -s "$H7_OUT/H7_BUILD_RESULT.json"
        dist="$RUNNER_TEMP/veux-h12-raw"
        test ! -e "$dist"
        python3 -B - "$H7_OBJOUT" "$H7_OUT" "$dist" <<'PY_H12_EXPORT'
        import hashlib
        import json
        import os
        import pathlib
        import shutil
        import struct
        import sys

        obj = pathlib.Path(sys.argv[1]).resolve(strict=True)
        evidence = pathlib.Path(sys.argv[2]).resolve(strict=True)
        dist = pathlib.Path(sys.argv[3]).resolve()

        # Never repackage a failed build, or an unproven/disabled RMNET variant.
        result = json.loads((evidence / 'H7_BUILD_RESULT.json').read_text())
        source = json.loads((evidence / 'H11_SOURCE_BUILTIN_EXPERIMENT.json').read_text())
        archive = json.loads((evidence / 'H11_ARCHIVE_EVIDENCE.json').read_text())
        cfg = result.get('config', {})
        expected_y = ('CONFIG_SCHED_WALT', 'CONFIG_KSU', 'CONFIG_KSU_SUSFS',
                      'CONFIG_NOMOUNT', 'CONFIG_MODULES', 'CONFIG_KALLSYMS_ALL')
        if not all(cfg.get(x) == 'y' for x in expected_y):
            raise SystemExit('BLOCKED: critical Kconfig disabled')
        if not (result.get('status') == 'PASS' and result.get('build_exit') == 0
                and result.get('rmnet_builtins_verified') is True
                and result.get('image_arm64') is True and result.get('vmlinux_elf64') is True
                and result.get('dtb_magic') is True
                and result.get('rmnet_initcalls_linked') == {'shs': True, 'offload': True}
                and result.get('linked_providers', {}).get('nomount_init') is True
                and result.get('linked_providers', {}).get('susfs_spoof_uname') is True
                and result.get('linked_providers', {}).get('ksu_handle_setuid') is True
                and source.get('status') == 'PINNED_RMNET_BUILTIN_KBUILD_STAGED_ONLY'
                and source.get('source_files_modified') == 2
                and all(archive.get(k, {}).get('status') == 'PASS'
                        and archive[k].get('thin_archive') is True for k in ('shs', 'offload'))
            ):
            raise SystemExit('BLOCKED: RMNET built-in proof absent')
        if not (result.get('flash_allowed') is False and result.get('device_tested') is False
                and result.get('boot_img_generated') is False and result.get('ak3_created') is False):
            raise SystemExit('BLOCKED: no-flash status corrupted')
        if (evidence / 'H7_MAKE_EXIT_CODE.txt').read_text().strip() != '0':
            raise SystemExit('BLOCKED: kernel make status not zero')

        required = {
            'Image': 'arch/arm64/boot/Image',
            'veux.dtb': 'arch/arm64/boot/dts/vendor/xiaomi/veux.dtb',
            'Module.symvers': 'Module.symvers',
            'System.map': 'System.map',
            'kernel.config': '.config',
        }
        checks = {}
        for name, rel in required.items():
            src = obj / rel
            if not src.is_file() or src.stat().st_size < 64:
                raise SystemExit('BLOCKED: missing output ' + rel)
            if src.is_symlink():
                raise SystemExit('BLOCKED: symlink output ' + rel)
            h = hashlib.sha256()
            with src.open('rb') as f:
                for chunk in iter(lambda: f.read(1024 * 1024), b''):
                    h.update(chunk)
            meta = {'bytes': src.stat().st_size, 'sha256': h.hexdigest()}
            prior = result.get('outputs', {}).get(name)
            if prior is not None and prior != meta:
                raise SystemExit('BLOCKED: build-result digest disagreement ' + name)
            checks[name] = meta

        with (obj / required['Image']).open('rb') as f:
            f.seek(56)
            if f.read(4) != b'ARMd':
                raise SystemExit('BLOCKED: invalid ARM64 Image magic')
        with (obj / required['veux.dtb']).open('rb') as f:
            if f.read(4) != b'\xd0\x0d\xfe\xed':
                raise SystemExit('BLOCKED: invalid DTB magic')
        with (obj / 'vmlinux').open('rb') as f:
            if f.read(5) != b'\x7fELF\x02':
                raise SystemExit('BLOCKED: invalid vmlinux ELF64')

        for name in ('rmnet_shs', 'rmnet_offload'):
            if list(obj.rglob(name + '.ko')):
                raise SystemExit('BLOCKED: unexpected external RMNET .ko')
        if dist.exists() and any(dist.iterdir()):
            raise SystemExit('BLOCKED: nonempty destination')
        dist.mkdir(parents=True, exist_ok=True)
        for name, rel in required.items():
            shutil.copyfile(obj / rel, dist / name)

        for name, rel in [('modules.builtin', 'modules.builtin'),
                          ('modules.builtin.modinfo', 'modules.builtin.modinfo')]:
            src = obj / rel
            if src.is_file() and not src.is_symlink():
                shutil.copyfile(src, dist / name)
                checks[name] = {'bytes': src.stat().st_size,
                                'sha256': hashlib.sha256(src.read_bytes()).hexdigest()}

        metadata = {
            'status': 'PASS_RAW_IMAGE_EXPORT_NOFLASH',
            'source_run': 40615029886,
            'source_commit': '9c147d0be0ea41fdec120e7edd493bade7b8aefe',
            'current_run': os.environ.get('GITHUB_RUN_ID', 'local-static-test'),
            'reference_image_sha256': '3dcb8bf1fd019faf90d725ff6842eeeb87122c0d4c7bb7118e9d7316cd05e3b3',
            'image_matches_reference': checks['Image']['sha256'] == '3dcb8bf1fd019faf90d725ff6842eeeb87122c0d4c7bb7118e9d7316cd05e3b3',
            'files': checks,
            'rmnet_builtins_verified': True,
            'rmnet_initcalls_linked': True,
            'walt': True, 'bakasu': True, 'susfs': True, 'nomount_v22': True,
            'ak3_created': False, 'boot_img_created': False,
            'flash_allowed': False, 'boot_ready': False, 'device_pass': False,
            'vendor_init_runtime_proven': False,
        }
        (dist / 'H12_EXPORT_PROVENANCE.json').write_text(json.dumps(metadata, indent=2, sort_keys=True) + '\n')
        (dist / 'NO_FLASH_README.txt').write_text(
            'R55H12-R1: Raw Image and VEUX DTB for offline static audit only.\n'
            'Not an AK3 or boot.img. Boot/runtime/vendor integration unproven.\n'
            'FLASH_ALLOWED=NO\n')
        paths = sorted(p for p in dist.iterdir() if p.is_file() and p.name != 'SHA256SUMS.txt')
        lines = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name for p in paths]
        (dist / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n')
        print('R55H12_RAW_IMAGE_EXPORT=PASS; FILES=' + str(len(paths)) + '; FLASH_ALLOWED=NO')
        PY_H12_EXPORT
        (cd "$dist" && sha256sum -c SHA256SUMS.txt)
        printf 'H12_DIST=%s\n' "$dist" >> "$GITHUB_ENV"
    - name: Write manifest for no-flash compiler proof
      if: ${{ always() }}
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$H7_OUT\" \"$H7_SRCOUT\"\npython3 -B - <<'PY_H7_MANIFEST'\nimport\
        \ hashlib,json,os,pathlib\nout=pathlib.Path(os.environ['H7_OUT']);src=pathlib.Path(os.environ['H7_SRCOUT'])\n\
        files=sorted([p for base in (out,src) for p in base.iterdir() if p.is_file() and p.name!='SHA256SUMS.txt'])\n\
        lines=[]\nfor p in files:\n lines.append(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p.resolve()))\n\
        (out/'SHA256SUMS.txt').write_text('\\n'.join(lines)+'\\n')\nprint('R55H7_EVIDENCE_FILE_COUNT='+str(len(files))+';\
        \ FLASH_ALLOWED=NO')\nPY_H7_MANIFEST\nsha256sum -c \"$H7_OUT/SHA256SUMS.txt\"\n"
    - name: Upload R55H11 compiler and pinned Kbuild source proofs only - NO FLASH
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: VEUX-R55H11-R2-RMNET-THIN-ARCHIVE-PROOF-NOFLASH-${{ github.run_id }}
        path: '${{ env.H7_OUT }}/

          ${{ env.H7_SRCOUT }}/H7_PATCH_PRECHECK.json

          ${{ env.H7_SRCOUT }}/H7_PATCH_FAILURE.txt

          '
        if-no-files-found: warn
        retention-days: 14
    - name: Upload R55H12 raw built-in Image and DTB for private static audit only
      if: ${{ success() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: VEUX-R55H12-R1-RMNET-BUILTIN-RAW-IMAGE-NOFLASH-${{ github.run_id }}
        path: ${{ env.H12_DIST }}/
        if-no-files-found: error
        retention-days: 14
        compression-level: 6
