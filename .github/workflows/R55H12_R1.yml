        \ 'WALT_object':'kernel/sched/walt/walt.o','SUSFS_object':'fs/susfs.o',\n 'NoMount_object':'fs/nomount/nomount.o','BakaSU_core_init':'drivers/kernelsu/core/init.o',\n\
