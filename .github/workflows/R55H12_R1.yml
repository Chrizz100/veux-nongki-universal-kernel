        if not j['real_arm64_make_attempted'] or len(j['objects'])!=15:\n raise SystemExit('R18_REAL_KBUILD_NOT_ATTEMPTED')\n\
        if j['object_success_count']!=sum(i['compiled'] is True for i in j['objects'].values()):\n raise SystemExit('R18_OBJECT_COUNT_FALSE')\n\
        if j['status']=='R18_ALL_FIFTEEN_OBJECTS_AND_REAL_PROVIDERS_COMPILED_NO_LINK' and (\n    j['object_success_count']!=15\
        \ or j['prior_eleven_preserved']!=11 or\n    not j['symbol_evidence']['all_verified']):\n raise SystemExit('R18_FALSE_OBJECT_SUCCESS')\n\
        for k in ('flash_allowed','vendor_abi_proven','kernel_image_built','vmlinux_linked',\n          'brene_changed','bakasusu_nomount_changed','runtime_tested'):\n\
        \ if j[k] is not False:raise SystemExit('R18_UNSAFE_RESULT:'+k)\nif j['object_success_count']<15:\n\
        \ print('::warning::R18 recorded actual Kbuild errors: inspect all 15 compiler logs')\nprint('R18_ACTUAL_ARM64='+str(j['object_success_count'])+'/15;\
        \ PRIOR='+str(j['prior_eleven_preserved'])+\n      '/11; QC_VAS='+str(j['qc_vas_compiled'])+'; SUPPORT='+str(j['three_support_objects_compiled'])+\n\
        \      '/3; OEM_PROVIDERS='+str(j['symbol_evidence']['count_verified'])+'/13; IMAGE=NO; ABI=OPEN; FLASH=NO')\n\
        PY_R18_RESULT\n"
    - name: R19 independent llvm-nm 13 typed providers on 15 genuine ARM64 objects
      shell: bash
      run: "set -euo pipefail\npython3 \"$R19_DIR/r19_provider_gate.py\" \\\n  --r18-report \"$R18_REPORT/R18_COMPILER_RESULT.json\"\
        \ \\\n  --snapshot \"$R9_SNAPSHOT\" --objout \"$R13_OBJOUT\" \\\n  --toolchain \"$R9_TOOLCHAIN\" --output\
        \ \"$R19_REPORT\"\npython3 - <<'PY_R19_GATE_RESULT'\nimport json,os,pathlib\nreport=pathlib.Path(os.environ['R19_REPORT'])/'R19_PROVIDER_RESULT.json'\n\
        j=json.loads(report.read_text())\nvalid=('R19_15_OBJECTS_AND_13_TYPED_PROVIDERS_PROVEN_NO_LINK',\n \
        \      'R19_TYPED_PROVIDER_DIAGNOSTICS_RECORDED')\nif j['status'] not in valid or j['r18_real_arm64_compiled']!=15\
        \ or j['r18_objects_sha_verified']!=15:\n raise SystemExit('R19_COMPILER_NOT_REPRODUCED')\nif j['r18_eight_source_postimages_verified']!=8\
        \ or j['llvm_nm_invocations']!=9:\n raise SystemExit('R19_INCOMPLETE_REAL_NM_CHECK')\nif j['status']==valid[0]\
        \ and (j['type_aware_symbol_count']!=13 or\n                              j['qc_vas_undefined_cpu_mask_reference_proven']\
        \ is not True or\n                              j['all_verified'] is not True):\n raise SystemExit('R19_FALSE_FULL_PROVIDER_CLAIM')\n\
        if any(j[k] is not False for k in ('kernel_image_built','vmlinux_linked',\n      'vendor_abi_proven','flash_allowed','brene_changed',\n\
        \      'bakasusu_nomount_changed','runtime_tested','r19_changed_kernel_source')):\n raise SystemExit('R19_UNSAFE_RELEASE_CLAIM')\n\
        if not j['all_verified']:\n print('::warning::R19 typed-provider proof incomplete; see R19_PROVIDER_RESULT.json')\n\
        print('R19_ACTUAL_ARM64=15/15; REAL_PROVIDER_SYMBOLS='+str(j['type_aware_symbol_count'])+\n      '/13;\
        \ VERIFIED='+str(j['all_verified'])+'; IMAGE=NO; ABI=OPEN; FLASH=NO')\nPY_R19_GATE_RESULT\n"
