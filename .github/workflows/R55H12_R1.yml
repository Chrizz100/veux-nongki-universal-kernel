        \ bison build-essential ca-certificates cpio curl flex git libelf-dev \\\n  libncurses-dev libssl-dev\
        \ patch python3 python-is-python3 rsync xz-utils zstd\n# R19 run 39698934163: real Android Clang 12.0.5,\
        \ based on r416183b.\n# Fail-closed: try exact SHA256 of the successful R19 Gitiles archive.\n# On server-side\
        \ HTTP 503 or archive mismatch, fetch precisely the same\n# AOSP commit and clang sub-tree from Microsoft's\
        \ read-only AOSP git mirror.\nclang_commit='aa2e4a514a6c85eebcc4a27149eaf9244e951a1e'\nclang_root_tree='2fdc995c25e58c0206ff32d5dd46a200431912fa'\n\
        clang_subtree='0a90693130898d6f98a76538086247b374d4a57f'\nclang_archive_sha='f6d76f9a7dfafe63363b0ba5398513eff6c6b650d3e15351751afdedc4fd7d37'\n\
        clang_src='https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/aa2e4a514a6c85eebcc4a27149eaf9244e951a1e/clang-r416183b.tar.gz'\n\
        clang_mirror='https://github.com/msft-mirror-aosp/platform.prebuilts.clang.host.linux-x86.git'\narchive=\"\
        $RUNNER_TEMP/veux-r9-clang-r416183b.tar.gz\"\nmkdir -p \"$R9_TOOLCHAIN\" \"$R9_REPORT\"\ntest -z \"\
        $(find \"$R9_TOOLCHAIN\" -mindepth 1 -print -quit)\"\nif curl --fail --location --retry 4 --connect-timeout\
        \ 30 --max-time 420 \\\n    \"$clang_src\" --output \"$archive\" && \\\n    printf '%s  %s\\n' \"$clang_archive_sha\"\
        \ \"$archive\" | sha256sum -c - && \\\n    tar -tzf \"$archive\" > /dev/null; then\n  tar -xzf \"$archive\"\
        \ -C \"$R9_TOOLCHAIN\"\n  printf '%s  %s\\n' \"$clang_archive_sha\" \"$archive\" > \"$R9_REPORT/R9_PINNED_TOOLCHAIN_ARCHIVE.sha256\"\
        \n  printf 'source=GOOGLE_GITILES_ARCHIVE\\ncommit=%s\\nsubtree=%s\\narchive_sha256=%s\\n' \\\n    \"\
        $clang_commit\" \"$clang_subtree\" \"$clang_archive_sha\" > \"$R9_REPORT/R9_TOOLCHAIN_PROVENANCE.txt\"\
        \nelse\n  echo '::warning::Official Google archive unavailable or rejected; trying exact AOSP commit\
        \ on GitHub mirror'\n  rm -f \"$archive\"\n  backup=$(mktemp -d \"$RUNNER_TEMP/veux-r9-gitmirror.XXXXXXXX\"\
        )\n  trap 'rm -rf \"$backup\"' EXIT\n  git -C \"$backup\" init -q\n  git -C \"$backup\" remote add origin\
        \ \"$clang_mirror\"\n  git -C \"$backup\" sparse-checkout init --cone\n  git -C \"$backup\" sparse-checkout\
        \ set clang-r416183b\n  git -C \"$backup\" -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none\
        \ origin \"$clang_commit\"\n  git -C \"$backup\" -c advice.detachedHead=false checkout --detach --quiet\
        \ FETCH_HEAD\n  test \"$(git -C \"$backup\" rev-parse HEAD)\" = \"$clang_commit\"\n  test \"$(git -C\
        \ \"$backup\" rev-parse 'HEAD^{tree}')\" = \"$clang_root_tree\"\n  test \"$(git -C \"$backup\" rev-parse\
        \ 'HEAD:clang-r416183b')\" = \"$clang_subtree\"\n  test -x \"$backup/clang-r416183b/bin/clang\"\n  cp\
        \ -a \"$backup/clang-r416183b/.\" \"$R9_TOOLCHAIN/\"\n  printf 'source=MICROSOFT_AOSP_GIT_MIRROR\\ncommit=%s\\\
        nroot_tree=%s\\nsubtree=%s\\n' \\\n    \"$clang_commit\" \"$clang_root_tree\" \"$clang_subtree\" > \"\
        $R9_REPORT/R9_TOOLCHAIN_PROVENANCE.txt\"\nfi\ntest -x \"$R9_TOOLCHAIN/bin/clang\"\ntest -x \"$R9_TOOLCHAIN/bin/llvm-nm\"\
        \ntest -x \"$R9_TOOLCHAIN/bin/ld.lld\"\n\"$R9_TOOLCHAIN/bin/clang\" --version | grep -F 'r416183b'\n\
        \"$R9_TOOLCHAIN/bin/clang\" --version | grep -F '12.0.5'\n\"$R9_TOOLCHAIN/bin/llvm-nm\" --version |\
        \ grep -E 'LLVM|llvm|12.0.5' > /dev/null\ncat \"$R9_REPORT/R9_TOOLCHAIN_PROVENANCE.txt\"\necho 'R9_HISTORICAL_ANDROID_CLANG=AVAILABLE;\
