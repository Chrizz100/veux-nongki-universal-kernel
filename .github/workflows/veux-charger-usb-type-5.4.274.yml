        # This worker applies all Diag05 fixes and the candidate before compiling.\n            d.worker(args)\n        result_path = args.public / \'RESULT.json\'\n        result = json.loads(result_path.read_text())\n        e.require(all(result[k] for k in (\'compile\', \'package\', \'static_boot\')), \'release gate failed\')\n        with candidate_patches():\n            e.require(result[\'device_fixes\'] == f.expected(KERNEL), \'candidate proof missing\')\n        stem = result[\'artifact_name\'] + \'_ChargerDiag06\'\n        for key, suffix in ((\'package_file\',\'_AnyKernel.zip\'), (\'boot_file\',\'_boot.img\')):\n            (args.public/result[key]).rename(args.public/(stem+suffix))\n            result[key] = stem+suffix\n        e.require(e.digest(args.public/result[\'package_file\']) == result[\'package_sha256\'], \'AK3 drift\')\n        r.verify_boot(result, args.public)\n        result.update(artifact_name=stem, diagnostic_id=\'ChargerDiag06\',\n            baseline_diag05_run=\'36518512103\', base_repository_sha=os.environ.get(\'GITHUB_SHA\', \'\'),\n            repository_mutation=False, device=False)\n        e.write_json(result_path, result)\n        (args.public/\'SHA256SUMS.txt\').write_text(\'\'.join(\n            f\'{e.digest(p)}  {p.name}\\n\' for p in sorted(args.public.iterdir())\n            if p.is_file() and p.name != \'SHA256SUMS.txt\'))\n        authenticate()\n        e.require(e.digest(e.REPO/r.CURRENT) == current_hash, \'build reference changed\')\n        e.require(not e.git(e.REPO, \'status\', \'--porcelain\'), \'temporary project changed during build\')\n        shutil.move(str(args.public), root/\'public\')\n        if output:\n            with open(output, \'a\') as out:\n                out.write(\'artifact_name=\' + stem + \'\\n\')\n        print(\'CHARGER_DIAG06=COMPILE_PACKAGE_STATIC_PASS; DEVICE_PASS=NO\', flush=True)\n    except Exception as exc:\n        e.write_json(root/\'builds/diagnostics/BLOCKED.json\', {\'reason\': str(exc), \'device\': False})\n        raise\n    finally:\n        if output:\n            os.environ[\'GITHUB_OUTPUT\'] = output\n\n\ndef main():\n    p=argparse.ArgumentParser(description=__doc__)\n    p.add_argument(\'command\', choices=(\'check\',\'build\'))\n    p.add_argument(\'--root\',type=Path)\n    p.add_argument(\'--jobs\',type=int,default=4)\n    a=p.parse_args()\n    if a.command==\'check\':\n        authenticate()\n        print(\'DIAG06_AUTHENTICATION=PASS; pinned components; cumulative Diag05\')\n    else:\n        if a.root is None:p.error(\'--root is required for build\')\n        run(a.root,a.jobs)\n\nif __name__==\'__main__\':\n    main()\n'
