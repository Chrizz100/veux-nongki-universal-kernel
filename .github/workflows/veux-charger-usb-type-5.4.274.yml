# Save as: .github/workflows/veux-charger-usb-type-5.4.274.yml
# Manual diagnostic: cumulative Diag05 plus USB_TYPE reporting.
# Embedded payloads; no companion upload required. No upstream update or promotion.
# Candidate requires a successful build and device validation.
name: VEUX 5.4.274 Charger Diagnostic 06 - USB type
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: veux-charger-usb-type-5.4.274
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  diagnostic:
    name: Build Diag05 plus USB_TYPE correction
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - name: Checkout exact project
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 1
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Install build dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends bc binutils bison build-essential ca-certificates curl dwarves file flex git jq libelf-dev libncurses-dev libssl-dev perl python3 python3-venv python3-yaml rsync unzip zip xz-utils zstd
        python3 -m venv "$RUNNER_TEMP/veux-python"
        "$RUNNER_TEMP/veux-python/bin/python" -m pip install ruamel.yaml==0.19.1 PyYAML==6.0.3
    - name: Verify Diag05 and release regression tests
      shell: bash
      run: |
        set -euo pipefail
        for test in test_veux_update_engine.py test_veux_release.py test_veux_device_fixes.py test_veux_source_transport.py; do
          "$RUNNER_TEMP/veux-python/bin/python" "common/scripts/$test"
        done
    - name: Prepare isolated USB_TYPE candidate
      shell: bash
      run: |
        set -euo pipefail
        git clone --quiet --no-hardlinks . "$RUNNER_TEMP/veux-diag06-project"
        cd "$RUNNER_TEMP/veux-diag06-project"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        "$RUNNER_TEMP/veux-python/bin/python" - <<'PY_DIAG06'
        from pathlib import Path
        import hashlib,json
        repo=Path.cwd()
        def require(ok,message):
            if not ok:raise SystemExit('BLOCKED: '+message)
        pins={'common/scripts/veux_update_engine.py': '4f9ed7edfd19c802850039c654a5331f653d6fe07460c4680735534808b58b8d', 'common/scripts/veux_release.py': 'd8ab6d1724d25bc77b65e201eaac34d0f35bd0ac70b59b4eb822faa377c2a258', 'common/scripts/veux_release_device.py': '6b0bb0c8815c2544461f42af621b523162fe674821561b5c5c7e09315ac67926', 'common/scripts/veux_device_fixes.py': '1de4c7919cbf99125dc3fb0792311455fdb22b57619ace87da7c58ba78ec8a97', 'common/scripts/veux_source_transport.py': '238a1d3c3c4b49b99b91c468942af28cad8f67401cdba8ea704b5d9a898fc3e7'}
        for name,digest in pins.items():
            require(hashlib.sha256((repo/name).read_bytes()).hexdigest()==digest,'baseline drift: '+name)
        base=repo/'common/device-fixes/5.4.274/charger-diag05/manifest.json'
        require(hashlib.sha256(base.read_bytes()).hexdigest()=='a8f927756bf8983ee982ea0a50e79d0c4fbdfbec2a23c203c638b6ab6eee41e4','Diag05 baseline changed')
        folder=repo/'common/diagnostics/charger-5.4.274-usb-type'
        folder.mkdir(parents=True,exist_ok=False)
