        payload='#!/usr/bin/env python3\n"""Check candidate scope and fail-closed build/publication behavior."""\nimport importlib.util\nimport json\nimport os\nfrom pathlib import Path\nimport tempfile\nimport unittest\nfrom unittest import mock\nimport veux_update_engine as e\nimport veux_device_fixes as f\nspec=importlib.util.spec_from_file_location(\'diag06\',Path(__file__).with_name(\'run_diag06.py\'))\nx=importlib.util.module_from_spec(spec);spec.loader.exec_module(x)\n\nclass CandidateTests(unittest.TestCase):\n    def test_candidate_retains_diag05_bq_and_upstreams(self):\n        targets=x.authenticate()\n        old=json.loads((e.REPO/x.BASE_MANIFEST).read_text())\n        with x.candidate_patches():\n            _,candidate,proof=f.load(x.KERNEL)\n            self.assertEqual(candidate[\'files\'][0],old[\'files\'][0])\n            self.assertEqual(candidate[\'files\'][1][\'before_sha256\'],old[\'files\'][1][\'before_sha256\'])\n            self.assertEqual(candidate[\'files\'][1][\'after_sha256\'],\n                \'e75f5c793d74311da59343eb46410563750b642e63fd70e1e1f2cabaad3d3e08\')\n            self.assertEqual(proof[\'id\'],\'charger-diag06\')\n        self.assertEqual(f.expected(x.KERNEL)[0][\'id\'],\'charger-diag05\')\n        self.assertEqual(targets[\'lineages\'],[\'5.4.274\'])\n        self.assertEqual({k:v[\'commit\'] for k,v in targets[\'components\'].items()},x.COMMITS)\n\n    def test_candidate_selection_restored_after_failure(self):\n        original=f.PATCHSETS\n        with self.assertRaises(RuntimeError):\n            with x.candidate_patches():raise RuntimeError(\'injected\')\n        self.assertIs(f.PATCHSETS,original)\n\n    def test_driver_or_compile_failure_cannot_publish(self):\n        for reason in (\'driver drift\',\'host test failure\',\'compile failure\',\'static boot failure\'):\n            with self.subTest(reason=reason),tempfile.TemporaryDirectory() as tmp:\n                root=Path(tmp)/\'diag\'\n                with mock.patch.object(x.d,\'worker\',side_effect=e.Blocked(reason)):\n                    with self.assertRaisesRegex(e.Blocked,reason):x.run(root,1)\n                self.assertFalse((root/\'public\').exists())\n                self.assertIn(reason,(root/\'builds/diagnostics/BLOCKED.json\').read_text())\n                self.assertEqual(f.expected(x.KERNEL)[0][\'id\'],\'charger-diag05\')\n\n    def test_authentication_failure_stops_before_worker(self):\n        with tempfile.TemporaryDirectory() as tmp,mock.patch.object(x,\'PINS\',dict(x.PINS,**{x.BASE_MANIFEST:\'0\'*64})),mock.patch.object(x.d,\'worker\') as worker:\n            with self.assertRaisesRegex(e.Blocked,\'baseline drift\'):\n                x.run(Path(tmp)/\'diag\',1)\n            worker.assert_not_called()\n\n    def test_success_publishes_only_named_package_boot_and_verified_records(self):\n        def worker(args):\n            args.public.mkdir()\n            (args.public/\'kernel.zip\').write_bytes(b\'fixture-package\')\n            (args.public/\'boot.img\').write_bytes(b\'fixture-boot\')\n            stem=\'Kernel_5.4.274_ReSukiSU_35184_SUSFS_2.3.0_NoMount_20\'\n            row=dict(artifact_name=stem, compile=True, package=True, static_boot=True,\n                package_file=\'kernel.zip\', package_sha256=e.digest(args.public/\'kernel.zip\'),\n                boot_file=\'boot.img\', static_boot_sha256=e.digest(args.public/\'boot.img\'),\n                device_fixes=f.expected(x.KERNEL))\n            e.write_json(args.public/\'RESULT.json\',row)\n        with tempfile.TemporaryDirectory() as tmp:\n            root=Path(tmp)/\'diag\'; output=Path(tmp)/\'outputs\'\n            with mock.patch.object(x.d,\'worker\',side_effect=worker), \\\n                 mock.patch.dict(os.environ,{\'GITHUB_OUTPUT\':str(output)}):\n                x.run(root,1)\n            row=json.loads((root/\'public/RESULT.json\').read_text())\n            self.assertEqual(row[\'diagnostic_id\'],\'ChargerDiag06\')\n            self.assertFalse(row[\'device\'])\n            self.assertFalse(row[\'repository_mutation\'])\n            self.assertTrue(row[\'package_file\'].endswith(\'_ChargerDiag06_AnyKernel.zip\'))\n            self.assertTrue(row[\'boot_file\'].endswith(\'_ChargerDiag06_boot.img\'))\n            self.assertEqual(set(p.name for p in (root/\'public\').iterdir()),\n                {row[\'package_file\'],row[\'boot_file\'],\'RESULT.json\',\'SHA256SUMS.txt\'})\n            for line in (root/\'public/SHA256SUMS.txt\').read_text().splitlines():\n                digest,name=line.split(\'  \',1)\n                self.assertEqual(e.digest(root/\'public\'/name),digest)\n            self.assertEqual(output.read_text(),\'artifact_name=\'+row[\'artifact_name\']+\'\\n\')\n\nif __name__==\'__main__\':unittest.main()\n'
