        payload='--- a/drivers/power/supply/qcom/wt_chg.c\n+++ b/drivers/power/supply/qcom/wt_chg.c\n@@ -1782,7 +1782,83 @@\n /************************\n  * USB PSY REGISTRATION *\n  ************************/\n+/* USB_TYPE uses its own enum; do not expose power_supply_type values here. */\n+static int wt_get_usb_type(struct batt_chg *chg, int *usb_type)\n+{\n+\tint rc, type, pd_active;\n+\n+\t*usb_type = POWER_SUPPLY_USB_TYPE_UNKNOWN;\n+\t/* Reporting this property must not run get_real_type()\'s charging policy. */\n+\tif (READ_ONCE(chg->otg_enable) || READ_ONCE(chg->mishow_flag) ||\n+\t    READ_ONCE(chg->vbus_cnt) > 3)\n+\t\treturn 0;\n+\n+\tpd_active = READ_ONCE(chg->pd_active);\n+\tif (pd_active == QTI_POWER_SUPPLY_PD_PPS_ACTIVE) {\n+\t\t*usb_type = POWER_SUPPLY_USB_TYPE_PD_PPS;\n+\t\treturn 0;\n+\t}\n+\tif (pd_active == QTI_POWER_SUPPLY_PD_ACTIVE) {\n+\t\t*usb_type = POWER_SUPPLY_USB_TYPE_PD;\n+\t\treturn 0;\n+\t}\n+\n+\trc = batt_get_iio_channel(chg, MAIN, MAIN_CHARGER_TYPE, &type);\n+\tif (rc < 0)\n+\t\treturn rc;\n+\n+\tswitch (type) {\n+\tcase POWER_SUPPLY_TYPE_USB:\n+\t\t*usb_type = POWER_SUPPLY_USB_TYPE_SDP;\n+\t\tbreak;\n+\tcase POWER_SUPPLY_TYPE_USB_DCP:\n+\tcase POWER_SUPPLY_TYPE_USB_HVDCP:\n+\tcase POWER_SUPPLY_TYPE_USB_HVDCP_3:\n+\tcase POWER_SUPPLY_TYPE_USB_HVDCP_3P5:\n+\t\t/* The standard USB_TYPE enum has no Quick Charge subtype. */\n+\t\t*usb_type = POWER_SUPPLY_USB_TYPE_DCP;\n+\t\tbreak;\n+\tcase POWER_SUPPLY_TYPE_USB_CDP:\n+\t\t*usb_type = POWER_SUPPLY_USB_TYPE_CDP;\n+\t\tbreak;\n+\tcase POWER_SUPPLY_TYPE_USB_ACA:\n+\t\t*usb_type = POWER_SUPPLY_USB_TYPE_ACA;\n+\t\tbreak;\n+\tcase POWER_SUPPLY_TYPE_USB_TYPE_C:\n+\t\t*usb_type = POWER_SUPPLY_USB_TYPE_C;\n+\t\tbreak;\n+\tcase POWER_SUPPLY_TYPE_USB_PD:\n+\t\t*usb_type = POWER_SUPPLY_USB_TYPE_PD;\n+\t\tbreak;\n+\tcase POWER_SUPPLY_TYPE_USB_PD_DRP:\n+\t\t*usb_type = POWER_SUPPLY_USB_TYPE_PD_DRP;\n+\t\tbreak;\n+\tcase POWER_SUPPLY_TYPE_APPLE_BRICK_ID:\n+\t\t*usb_type = POWER_SUPPLY_USB_TYPE_APPLE_BRICK_ID;\n+\t\tbreak;\n+\tdefault:\n+\t\t/* Unknown and floating sources must not be advertised as SDP. */\n+\t\tbreak;\n+\t}\n+\n+\treturn 0;\n+}\n+\n+static enum power_supply_usb_type wt_usb_types[] = {\n+\tPOWER_SUPPLY_USB_TYPE_UNKNOWN,\n+\tPOWER_SUPPLY_USB_TYPE_SDP,\n+\tPOWER_SUPPLY_USB_TYPE_DCP,\n+\tPOWER_SUPPLY_USB_TYPE_CDP,\n+\tPOWER_SUPPLY_USB_TYPE_ACA,\n+\tPOWER_SUPPLY_USB_TYPE_C,\n+\tPOWER_SUPPLY_USB_TYPE_PD,\n+\tPOWER_SUPPLY_USB_TYPE_PD_DRP,\n+\tPOWER_SUPPLY_USB_TYPE_PD_PPS,\n+\tPOWER_SUPPLY_USB_TYPE_APPLE_BRICK_ID,\n+};\n+\n static enum power_supply_property usb_psy_props[] = {\n+\tPOWER_SUPPLY_PROP_USB_TYPE,\n \tPOWER_SUPPLY_PROP_PRESENT,\n \tPOWER_SUPPLY_PROP_ONLINE,\n \tPOWER_SUPPLY_PROP_VOLTAGE_NOW,\n@@ -1801,10 +1877,14 @@\n \t\tunion power_supply_propval *val)\n {\n \tint rc = 0, type = 0;\n+\tint vbus_mv;\n \tstruct batt_chg *chg = power_supply_get_drvdata(psy);\n \tval->intval = 0;\n \n \tswitch (psp) {\n+\tcase POWER_SUPPLY_PROP_USB_TYPE:\n+\t\trc = wt_get_usb_type(chg, &val->intval);\n+\t\tbreak;\n \tcase POWER_SUPPLY_PROP_PRESENT:\n \t\trc = batt_get_iio_channel(chg, BMS, BATT_QG_PRESENT, &val->intval);\n \t\tbreak;\n@@ -1821,7 +1901,16 @@\n \t\tval->intval = chg->charge_voltage_max;\n \t\tbreak;\n \tcase POWER_SUPPLY_PROP_VOLTAGE_NOW:\n-\t\trc = batt_get_iio_channel(chg, BMS, BATT_QG_VOLTAGE_NOW, &chg->batt_voltage_now);\n+\t\t/* The charge-pump ADC reports VBUS in mV; power_supply uses uV. */\n+\t\trc = batt_get_iio_channel(chg, CP_MASTER,\n+\t\t\t\tCHARGE_PUMP_SC_BUS_VOLTAGE, &vbus_mv);\n+\t\tif (rc < 0)\n+\t\t\tbreak;\n+\t\tif (vbus_mv < 0 || vbus_mv > INT_MAX / 1000) {\n+\t\t\trc = -ERANGE;\n+\t\t\tbreak;\n+\t\t}\n+\t\tval->intval = vbus_mv * 1000;\n \t\tbreak;\n \tcase POWER_SUPPLY_PROP_CURRENT_NOW:\n \t\trc = batt_get_iio_channel(chg, BMS, BATT_QG_CURRENT_NOW, &chg->batt_current_now);\n@@ -1902,6 +1991,8 @@\n static const struct power_supply_desc usb_psy_desc = {\n \t.name = "usb",\n \t.type = POWER_SUPPLY_TYPE_USB_PD,\n+\t.usb_types = wt_usb_types,\n+\t.num_usb_types = ARRAY_SIZE(wt_usb_types),\n \t.properties = usb_psy_props,\n \t.num_properties = ARRAY_SIZE(usb_psy_props),\n \t.get_property = usb_psy_get_prop,\n'
