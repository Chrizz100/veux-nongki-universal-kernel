name: VEUX M58 – zRAM-Seitenzustände und Kompressionsgrenze, QGKI 5.4.274
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  m58:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      SOURCE_DATE_EPOCH: '1794009600'
      KBUILD_BUILD_TIMESTAMP: Sat Nov 7 00:00:00 UTC 2026
      KBUILD_BUILD_USER: veux-ci
      KBUILD_BUILD_HOST: github-actions
      KBUILD_BUILD_VERSION: '1'
    steps:
      - name: M58-Paket aus dem gewählten Commit laden
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /VEUX_M58_MAIN.zip
          persist-credentials: false
      - name: M57-Quellstand und Xiaomi-Referenz prüfen, Reparatur anwenden
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '972b5b77648aef37db185d5b6681adf14f54341cf2a7eb1b0065cfa9c811697b  VEUX_M58_MAIN.zip' | sha256sum -c -
          unzip -q VEUX_M58_MAIN.zip -d "$RUNNER_TEMP/m58-tools"
          cd "$RUNNER_TEMP"
          mkdir -p m58/evidence
          for item in 'm57:14762106015' 'm46:14706022228'; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/${item#*:}/zip" > "m58/${item%:*}.zip"
          done
          python3 -B m58-tools/inputs.py m58
          python3 -B m58-tools/test_stock_zram.py m58/src | tee m58/evidence/zRAM-Seitentests.txt
          python3 -B m58-tools/test_zram.py m58/src | tee m58/evidence/zRAM-Tests.txt
          python3 -B m58-tools/test_thermal.py m58/src | tee m58/evidence/Thermik-Test.txt
          python3 -B m58-tools/test.py m58/src | tee m58/evidence/M51-Bootinfo-Test.txt
      - name: Geprüfte Android-Werkzeugkette bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bc bison build-essential cpio flex libelf-dev liburcu-dev libncurses-dev libssl-dev rsync xz-utils zstd qemu-user
          bash "$RUNNER_TEMP/m58-tools/toolchain.sh" "$RUNNER_TEMP/m58/clang"
      - name: zRAM, Thermik, Speicherverwaltung, Atomics, F2FS und VEUX-DTB vor dem Vollbau prüfen
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/m58"
          tools="$RUNNER_TEMP/m58-tools"
          python3 -B "$tools/test_f2fs.py" src | tee evidence/F2FS-Tests.txt
          bash "$tools/kbuild.sh" src out clang olddefconfig > evidence/olddefconfig.log 2>&1 || { tail -80 evidence/olddefconfig.log; exit 1; }
          python3 -B "$tools/check.py" config --out out --baseline baseline.config --stock boot.img --result evidence
          python3 -B "$tools/zram_image.py" stock boot.img evidence/Xiaomi-zRAM.json --inventory evidence/Xiaomi-zRAM-Dateien.txt
          python3 -B "$tools/zram_paths.py" stock clang/bin boot.img evidence/Xiaomi-zRAM-Pfade.json
          python3 -B "$tools/zram_image.py" stock boot.img evidence/Xiaomi-zRAM-ABI.json --full
          python3 -B "$tools/ratio_contract.py" stock clang/bin boot.img evidence/Xiaomi-Seitenmodell.json
          bash "$tools/test_zram_variants.sh" > evidence/zRAM-Kbuild.log 2>&1 || { tail -100 evidence/zRAM-Kbuild.log; exit 1; }
          bash "$tools/kbuild.sh" src out clang drivers/thermal/qcom/cpu_isolate.o kernel/sched/walt/qc_vas.o dtbs > evidence/Thermik-Kbuild.log 2>&1 || { tail -100 evidence/Thermik-Kbuild.log; exit 1; }
          clang/bin/ld.lld -r out/drivers/thermal/qcom/cpu_isolate.o -o evidence/Thermik-arm64.o
          python3 -B "$tools/thermal_object.py" clang/bin/llvm-readelf evidence/Thermik-arm64.o evidence/Thermik-Objekt.json
          python3 -B "$tools/thermal_dtb.py" out/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb evidence/VEUX-Kuehlgeraete.json
          python3 -B "$tools/thermal_image.py" stock clang/bin boot.img evidence/Xiaomi-Thermik.json
          bash "$tools/verify_memory.sh" > evidence/Speicher-Vorpruefung.log 2>&1 || { tail -110 evidence/Speicher-Vorpruefung.log; exit 1; }
          bash "$tools/test_variants.sh" > evidence/Atomics-Vorpruefung.log 2>&1 || { tail -100 evidence/Atomics-Vorpruefung.log; exit 1; }
          bash "$tools/kbuild.sh" src out clang lib/radix-tree.o fs/f2fs/ drivers/power/supply/qcom/bq2589x_charger.o dtbs > evidence/F2FS-Kbuild.log 2>&1 || { tail -100 evidence/F2FS-Kbuild.log; exit 1; }
          clang/bin/ld.lld -r --whole-archive out/fs/f2fs/built-in.a --no-whole-archive -o evidence/F2FS-arm64.o
          python3 -B "$tools/arm_proof.py" clang/bin/llvm-readelf evidence/F2FS-arm64.o evidence/F2FS-Aufrufe.json
          echo '4b7fa9ac17c325234bc4ba75f65aefa42fdd32647b40e9bd3f616c9d9a6c2a96  out/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb' | sha256sum -c -
      - name: Vollständigen Kernel und Module aus M58-Quellen bauen
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/m58"
          for goal in Image modules; do
            bash "$RUNNER_TEMP/m58-tools/kbuild.sh" src out clang "$goal" > "evidence/$goal.log" 2>&1 || { tail -120 "evidence/$goal.log"; exit 1; }
          done
      - name: Kernel, Modulschnittstellen, Stock-Konfiguration und Boot-Layout nachprüfen
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/m58"
          python3 -B "$RUNNER_TEMP/m58-tools/check.py" final --out out --baseline baseline.config --stock boot.img --result evidence
          python3 -B "$RUNNER_TEMP/m58-tools/atomics.py" image clang/bin out/arch/arm64/boot/Image evidence/M58-Image-Atomics.json --system-map out/System.map
          cmp evidence/Xiaomi-Atomics.json evidence/M58-Image-Atomics.json
          python3 -B "$RUNNER_TEMP/m58-tools/memory_image.py" candidate clang/bin out/arch/arm64/boot/Image evidence/M58-Image-Speicher.json --map out/System.map
          cmp evidence/Xiaomi-Speicher.json evidence/M58-Image-Speicher.json
          python3 -B "$RUNNER_TEMP/m58-tools/reaper_image.py" candidate clang/bin out/arch/arm64/boot/Image evidence/M58-Image-Reaper.json --map out/System.map
          cmp evidence/Xiaomi-Reaper.json evidence/M58-Image-Reaper.json
          python3 -B "$RUNNER_TEMP/m58-tools/thermal_image.py" candidate clang/bin out/arch/arm64/boot/Image evidence/M58-Image-Thermik.json --map out/System.map
          cmp evidence/Xiaomi-Thermik.json evidence/M58-Image-Thermik.json
          python3 -B "$RUNNER_TEMP/m58-tools/zram_image.py" candidate out/arch/arm64/boot/Image evidence/M58-Image-zRAM.json --map out/System.map --inventory evidence/M58-zRAM-Dateien.txt
          cmp evidence/Xiaomi-zRAM.json evidence/M58-Image-zRAM.json
          python3 -B "$RUNNER_TEMP/m58-tools/zram_paths.py" candidate clang/bin out/arch/arm64/boot/Image evidence/M58-Image-zRAM-Pfade.json --map out/System.map
          cmp evidence/Xiaomi-zRAM-Pfade.json evidence/M58-Image-zRAM-Pfade.json
          python3 -B "$RUNNER_TEMP/m58-tools/zram_image.py" candidate out/arch/arm64/boot/Image evidence/M58-zRAM-ABI.json --map out/System.map --full
          cmp evidence/Xiaomi-zRAM-ABI.json evidence/M58-zRAM-ABI.json
          cmp evidence/Xiaomi-zRAM-Dateien.txt evidence/M58-zRAM-Dateien.txt
          python3 -B "$RUNNER_TEMP/m58-tools/ratio_contract.py" candidate clang/bin out/arch/arm64/boot/Image evidence/M58-Seitenmodell.json --map out/System.map
          cmp evidence/Xiaomi-Seitenmodell.json evidence/M58-Seitenmodell.json
          python3 -B "$RUNNER_TEMP/m58-tools/restgruppen.py" evidence boot.img out/System.map clang/bin
          cat evidence/M58_KERNEL.json >> "$GITHUB_STEP_SUMMARY"
      - name: Vorhandene Bauprodukte und Diagnosen sichern
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir -p m58/evidence
          cd m58
          for item in .config Module.symvers System.map arch/arm64/boot/Image vmlinux; do
            if [[ -s "out/$item" ]]; then
              target=${item##*/}
              if [[ "$target" = .config ]]; then target=kernel.config; fi
              cp "out/$item" "evidence/$target"
            fi
          done
      - name: M58-Kernelnachweise
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: VEUX-M58-KERNEL-NACHWEISE-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m58/evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Erfolgreichen Quellstand für die Folgereparatur sichern
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/m58"
          mkdir quelle
          tar --exclude=.git -C src -cf - . | gzip -1 > quelle/M58-kernel-source.tar.gz
          cp evidence/{M58_KERNEL.json,kernel.config} quelle/
          cd quelle
          sha256sum M58-kernel-source.tar.gz > SHA256SUMS
      - name: M58-Quellstand
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: VEUX-M58-QUELLSTAND-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m58/quelle/
          if-no-files-found: error
          retention-days: 30
