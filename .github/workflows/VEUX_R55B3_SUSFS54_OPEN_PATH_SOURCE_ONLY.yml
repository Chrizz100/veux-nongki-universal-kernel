    - name: Strict actionlint duplicate YAML keys ShellCheck gate
      shell: bash
      run: "set -euo pipefail\narchive=project/VEUX_R39_R2_MEMORY_ABI_MAIN.zip\ntest -s \"$archive\"\nprintf '%s  %s\\n' '745d80b8502a9beea513a2e7a58bb59272539b7508920d235ce2e79741bda528'\
        \ \"$archive\" | sha256sum -c -\nunzip -p \"$archive\" tools/actionlint > \"$R55_STAGE/actionlint\"\nchmod 0755 \"$R55_STAGE/actionlint\"\
        \n\"$R55_STAGE/actionlint\" -version | grep -Fx '1.7.12'\n\"$R55_STAGE/actionlint\" -color=false -shellcheck='' \"project/.github/workflows/VEUX_R55B3_SUSFS54_OPEN_PATH_SOURCE_ONLY.yml\"\
        \ > \"$R55_STAGE/R55B3_ACTIONLINT.log\"\nprintf 'R55B3_ACTIONLINT_1.7.12=PASS\\n' >> \"$R55_STAGE/R55B3_ACTIONLINT.log\"\n\
        python3 -B - <<'PY_R55B3_VERIFY_STRUCTURE'\nimport hashlib,pathlib,subprocess,yaml\nclass Unique(yaml.SafeLoader): pass\n\
        def mapping(l,n):\n  output={}\n  for kn,vn in n.value:\n    key=l.construct_object(kn)\n    if key in output:raise RuntimeError('DUPLICATE_YAML_KEY:'+str(key))\n\
        \    output[key]=l.construct_object(vn)\n  return output\nUnique.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,mapping)\n\
        p=pathlib.Path('project/.github/workflows/VEUX_R55B3_SUSFS54_OPEN_PATH_SOURCE_ONLY.yml')\ny=yaml.load(p.read_text(),Loader=Unique)\n\
        assert list(y['on'])==['workflow_dispatch']\nassert y['permissions']=={'contents':'read'}\nassert set(y['jobs'])=={'r55b3_source'}\n\
        j=y['jobs']['r55b3_source']\nassert j['runs-on']=='ubuntu-24.04'\nassert j['if'].startswith('$') and 'github.repository' in\
        \ j['if'] and 'refs/heads/main' in j['if']\nsteps=j['steps']\nassert len(steps)==9\nfor i in (0,1):\n  assert steps[i]['uses']=='actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683'\n\
        \  assert steps[i]['with']['persist-credentials'] is False\nassert steps[1]['with']['repository']=='dereference23/kernel_xiaomi_sm6375'\n\
        assert steps[1]['with']['ref']=='b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'\nassert steps[-1]['uses']=='actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02'\n\
        assert steps[-1]['with']['if-no-files-found']=='error'\nlines=[]\nfor step in steps:\n  if 'run' not in step:continue\n  body=step['run']\n\
        \  if '$'+'{' in body:raise RuntimeError('EVALUABLE_EXPRESSION_IN_SCRIPT')\n  for cmd in (['bash','-n','-'],['shellcheck','--shell=bash','--severity=warning','-']):\n\
        \    check=subprocess.run(cmd,input=body,text=True,capture_output=True)\n    if check.returncode:raise RuntimeError('BAD_SHELL\
        \ '+step['name']+' '+check.stdout+check.stderr)\n  lines.append(step['name']+' SHA256='+hashlib.sha256(body.encode()).hexdigest()+'\
        \ BASH_SHELLCHECK_PASS')\npathlib.Path('/tmp/veux-r55b3/R55B3_SHELLCHECK.log').write_text('\\n'.join(lines)+'\\n')\nprint('R55B3_ACTION_INPUTS_DUPLICATES_ALL_SHELL=PASS')\n\
        PY_R55B3_VERIFY_STRUCTURE\n"
    - name: 21 positive and negative tests including executable C helper
      shell: bash
      run: "set -euo pipefail\npython3 -B - <<'PY_R55B3_AST'\nimport ast,pathlib\nfor name in ('scripts/r55b3_port.py','tests/test_r55b3_port.py'):\n\
        \    p=pathlib.Path('/tmp/veux-r55b3')/name\n    ast.parse(p.read_text('utf-8'),filename=str(p))\nprint('R55B3_PYTHON_AST=PASS')\n\
        PY_R55B3_AST\npython3 -B -m unittest discover -v -s \"$R55_STAGE/tests\" -p 'test_*.py' 2>&1 | tee \"$R55_STAGE/R55B3_REGRESSIONS.log\"\
        \ngrep -Eq '^Ran 21 tests in [0-9.]+s$' \"$R55_STAGE/R55B3_REGRESSIONS.log\"\ngrep -Fx 'OK' \"$R55_STAGE/R55B3_REGRESSIONS.log\"\
        \necho 'R55B3_21_LIFETIME_NEGATIVE_C_COMPILED_TESTS=PASS'\n"
    - name: Replay real R55B2 then port O_PATH and O_TMPFILE in namei
      shell: bash
      run: "set -euo pipefail\ntest \"$(git -C kernel rev-parse HEAD)\" = 'b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'\ntest \"$(git\
        \ -C kernel hash-object fs/namei.c)\" = '7c74159e29355e209b1cf4749aae23110f21a098'\npython3 -B \"$R55_STAGE/scripts/r55b3_port.py\"\
        \ \\\n  --source kernel --base \"$R55_STAGE/inputs/R55B2_AUTHENTIC_15FILES.patch\" \\\n  --out \"$R55_STAGE/out\" 2>&1 | tee\
        \ \"$R55_STAGE/R55B3_REAL_SOURCE.log\"\n(cd \"$R55_STAGE/out\" && sha256sum -c SHA256SUMS.txt)\n"
    - name: Independent clean 15-file Git replay byte check
      shell: bash
      run: "set -euo pipefail\ngit -C kernel worktree add --detach \"$R55_STAGE/replay\" b2b7a3bbc36d120ee523ebc8d68e0f13a97df632\n\
        git -C \"$R55_STAGE/replay\" apply --check --whitespace=error \"$R55_STAGE/out/VEUX_R55B3_SUSFS54_15_FILES_OPEN_PATH_NOFLASH.patch\"\
        \ngit -C \"$R55_STAGE/replay\" apply --whitespace=error \"$R55_STAGE/out/VEUX_R55B3_SUSFS54_15_FILES_OPEN_PATH_NOFLASH.patch\"\
        \ngit -C \"$R55_STAGE/replay\" diff --check\nfor f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do\n  git\
        \ -C \"$R55_STAGE/replay\" add -N -- \"$f\"\ndone\ngit -C \"$R55_STAGE/replay\" diff --binary --no-ext-diff > \"$R55_STAGE/replay_full.patch\"\
        \ncmp \"$R55_STAGE/replay_full.patch\" \"$R55_STAGE/out/VEUX_R55B3_SUSFS54_15_FILES_OPEN_PATH_NOFLASH.patch\"\npython3 -B\
        \ - <<'PY_R55B3_REPLAY'\nimport hashlib,json,pathlib\nroot=pathlib.Path('/tmp/veux-r55b3')\nr=json.loads((root/'out/R55B3_RESULT.json').read_text())\n\
        for fn,field in [('fs/namei.c','postimage_namei_gitblob'),('fs/susfs.c','postimage_susfs_gitblob')]:\n  b=(root/'replay'/fn).read_bytes()\n\
        \  blob=hashlib.sha1(('blob '+str(len(b))+'\\0').encode('ascii')+b).hexdigest()\n  assert blob==r[field],fn\nassert r['files_total']==15\n\
        assert r['o_path_redirect_ported'] is True and r['o_tmpfile_redirect_ported'] is True\nassert r['ordinary_open_redirect_ported']\
        \ is False\nassert r['compile_performed'] is False and r['flash_allowed'] is False\nprint('R55B3_FULL_15_FILE_REPLAY_BYTE_IDENTICAL=PASS')\n\
        PY_R55B3_REPLAY\n"
    - name: Final source scope integrity and NOFLASH gate
      shell: bash
      run: "set -euo pipefail\npython3 -B - <<'PY_R55B3_FINAL'\nimport hashlib,json,pathlib,re\nroot=pathlib.Path('/tmp/veux-r55b3')\n\
        out=root/'out';r=json.loads((out/'R55B3_RESULT.json').read_text())\nassert r['source_commit']=='b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'\n\
        assert r['r55b2_source_patch_sha256']=='a46ce59951937edd962b62ed2d202fcc3b01e8e79ebb2eef2d28f1b82f2b8ba3'\nassert r['files_total']==15\
        \ and r['base_replayed'] is True\nassert r['additional_edited_files']==['fs/namei.c']\nassert r['o_path_redirect_ported']\
        \ and r['o_tmpfile_redirect_ported']\nassert r['open_redirect_readlink_abi_corrected']\nfor flag in ('ordinary_open_redirect_ported','atomic_open_review_complete','full_susfs_port',\n\
        \             'compile_performed','boot_ready','device_tested','flash_allowed',\n             'brene_changed','vendor_changed','user_repo_modified',\n\
        \             'r44_recomposed','baka_su_uapi6_integrated','nomount_v22_integrated'):\n    assert r[flag] is False,flag\nfull=(out/'VEUX_R55B3_SUSFS54_15_FILES_OPEN_PATH_NOFLASH.patch').read_text()\n\
        addon=(out/'VEUX_R55B3_OPEN_PATH_1_FILE_ADDON_NOFLASH.patch').read_text()\ndef paths(txt):\n    a=re.findall(r'^diff --git\
        \ a/(\\S+) b/\\1$',txt,re.M)\n    assert len(a)==len(set(a))\n    return set(a)\nassert paths(addon)=={'fs/namei.c'}\nassert\
        \ len(paths(full))==15\nassert not any('brene' in p.lower() or p.startswith('vendor/') or p.startswith('.github/') for p in\
        \ paths(full))\nassert 'GIT binary patch' not in full\nfor name in ('R55B3_ACTIONLINT.log','R55B3_SHELLCHECK.log','R55B3_REGRESSIONS.log','R55B3_REAL_SOURCE.log'):\n\
        \  f=root/name\n  assert f.is_file() and f.stat().st_size>0,name\n  (out/name).write_bytes(f.read_bytes())\nfiles=sorted(p\
        \ for p in out.iterdir() if p.is_file() and p.name!='SHA256SUMS.txt')\n(out/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'\
        \  '+p.name+'\\n' for p in files))\nprint('R55B3_OUTPUT_FILE_SCOPE_CHECKSUM_NOFLASH=PASS')\nPY_R55B3_FINAL\n(cd \"$R55_STAGE/out\"\
        \ && sha256sum -c SHA256SUMS.txt)\ngit -C kernel apply --reverse --check \"$R55_STAGE/out/VEUX_R55B3_SUSFS54_15_FILES_OPEN_PATH_NOFLASH.patch\"\
        \ntest -z \"$(git -C project status --porcelain --untracked-files=all)\"\necho 'R55B3_ORIGINAL_PROJECT_UNMODIFIED=PASS; NO_KERNEL_BUILD;\
        \ NO_FLASH'\n"
    - name: Upload patch and audit artifact only
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: VEUX-R55B3-OPENPATH-15FILES-NOFLASH-${{ github.run_id }}
        path: /tmp/veux-r55b3/out/
        retention-days: 14
        if-no-files-found: error
