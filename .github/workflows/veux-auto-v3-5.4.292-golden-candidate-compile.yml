name: VEUX Auto V3 - 5.4.292 Golden Candidate Compile

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: veux-auto-v3-292-golden-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: Chrizz100/veux-nongki-universal-kernel
  O51_AUTHORITY: .github/workflows/veux-u6-o51-v3-resukisu-35158-repair-274-293-complete-all-six.yml
  O51_AUTHORITY_BLOB: 6413bd99fa38a5aa030403bb60a5935980dca32d
  GOLDEN_MANIFEST: common/contracts/GOLDEN_BASELINE.yml
  PROFILE_292: lineages/5.4.292/build.yml
  PORT_HELPER: lineages/5.4.292/GOLDEN_PORT_V1.py
  PORT_HELPER_SHA256: c26e488c0f97f7bc1e46ae1fb5329c06f18ca48dd1ecc56bc3c2da01eb2bfcc5

  SOURCE_COMMIT: fb3bbb10bc0480282c01b88ccaf39c0145cd9f51

  O51V2_RUN_ID: '35474699541'
  O51V2_ARTIFACT_ID: '10594504130'
  O51V2_ARTIFACT_SHA256: 76d744ef6010678ebd551ffe0393dd8e154e01a44b2955d43bdd85939cad50ec
  O51V2_IMAGE_292_SHA256: cebdc135d154e88f8f8c08b3e44181470c56a45f054537e96a5d1b6dbcca952a

  RESUKISU_BASE_COMMIT: 6d18926ae6eeb571a04c1ce7552c324d606fa9d8
  RESUKISU_BASE_VERSION: '35158'
  RESUKISU_COMMIT: 9be0f347f38e790c846915bd5f9c24b337f85c4e
  RESUKISU_VERSION: '35170'
  RESUKISU_UAPI: '4'

  SUSFS_COMMIT: 04a9d713106191ba98be680bd7ad9547ab1de964
  SUSFS_VERSION: v2.3.0

  NOMOUNT_REPO: https://github.com/maxsteeel/NoMount.git
  NOMOUNT_COMMIT: b8d268353b4e7ecc53c67d1816a626b7d6579201
  NOMOUNT_TAG: v2.0.0

jobs:
  static-green:
    name: V3 5.4.292 static candidate gate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      status: ${{ steps.static.outputs.status }}
    steps:
      - name: Checkout exact project state
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install static parser dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' || python3 -m pip install --user PyYAML
          import yaml
          print(f"PyYAML={yaml.__version__}")
          PY

      - name: Authenticate Golden V2, O51 authority and 5.4.292 profile
        id: static
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test -f "$O51_AUTHORITY"
          test -f "$GOLDEN_MANIFEST"
          test -f "$PROFILE_292"
          test -f "$PORT_HELPER"
          test "$(git hash-object "$O51_AUTHORITY")" = "$O51_AUTHORITY_BLOB"
          test "$(sha256sum "$PORT_HELPER" | awk '{print $1}')" = "$PORT_HELPER_SHA256"

          python3 common/scripts/verify_golden_baseline.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "$GOLDEN_MANIFEST" \
            --online

          python3 - "$PROFILE_292" "$O51_AUTHORITY" <<'PY'
          from pathlib import Path
          import sys
          import yaml

          profile = yaml.safe_load(Path(sys.argv[1]).read_text(encoding="utf-8"))
          authority = sys.argv[2]
          assert profile["schema"] == 1
          assert profile["kernel"] == "5.4.292"
          assert profile["enabled"] is True
          assert profile["device"] == "veux"
          assert profile["platform"].lower() == "sm6375"
          assert profile["target"] == "android13-stock-vendor"
          assert profile["baseline"]["role"] == "derive"
          assert profile["baseline"]["port_status"] == "pending"
          assert profile["baseline"]["from_kernel"] == "5.4.274"
          assert profile["legacy_authority"]["workflow"] == authority
          rs = profile["features"]["resukisu"]
          assert rs["enabled"] is True
          assert str(rs["version"]) == "35158"
          assert rs["commit"] == "6d18926ae6eeb571a04c1ce7552c324d606fa9d8"
          assert rs["uapi"] == 4
          sf = profile["features"]["susfs"]
          assert sf["enabled"] is True
          assert str(sf["version"]) == "2.3.0"
          assert sf["commit"] == "04a9d713106191ba98be680bd7ad9547ab1de964"
          nm = profile["features"]["nomount"]
          assert nm["enabled"] is False
          assert profile["validation"]["device"] is False
          print("PROFILE_292_PENDING_BASELINE=PASS")
          PY

          python3 -m py_compile "$PORT_HELPER"
          python3 "$PORT_HELPER" selftest

          python3 - "$O51_AUTHORITY" "$RUNNER_TEMP/o51_replay_static.py" <<'PY'
          from pathlib import Path
          import sys
          import yaml

          src = Path(sys.argv[1])
          out = Path(sys.argv[2])
          doc = yaml.safe_load(src.read_text(encoding="utf-8"))
          steps = next(iter(doc["jobs"].values()))["steps"]
          step = next(
              s for s in steps
              if s.get("name") == "Write and self-test fail-closed authority replayer"
          )
          run = str(step["run"])
          start = 'cat > "$RUNNER_TEMP/o51_replay.py" <<\'PY\'\n'
          if run.count(start) != 1:
              raise SystemExit(f"O51 replayer start marker count={run.count(start)}")
          a = run.index(start) + len(start)
          ends = [x for x in (run.find("\n          PY\n", a), run.find("\nPY\n", a)) if x >= 0]
          if not ends:
              raise SystemExit("O51 replayer end marker missing")
          b = min(ends)
          code = run[a:b]
          lines = code.splitlines()
          if lines and all((not x.strip()) or x.startswith("          ") for x in lines):
              code = "\n".join(x[10:] if x.startswith("          ") else x for x in lines) + "\n"
          compile(code, str(out), "exec")
          out.write_text(code, encoding="utf-8")
          print("O51_REPLAYER_EXTRACTION=PASS")
          PY

          python3 -m py_compile "$RUNNER_TEMP/o51_replay_static.py"
          python3 "$RUNNER_TEMP/o51_replay_static.py" --selftest

          echo "status=PASS" >> "$GITHUB_OUTPUT"
          echo "V3_292_STATIC_GREEN=PASS"

  compile-candidate:
    name: Compile 5.4.292 Golden candidate
    needs: static-green
    if: needs.static-green.outputs.status == 'PASS'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact project state
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install controller dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl dwarves flex git \
            libelf-dev libncurses-dev libssl-dev perl python3 python3-yaml \
            rsync unzip xz-utils zstd
          test "$(sha256sum "$PORT_HELPER" | awk '{print $1}')" = "$PORT_HELPER_SHA256"
          python3 -m py_compile "$PORT_HELPER"
          python3 "$PORT_HELPER" selftest

      - name: Authenticate historical O51-v2 5.4.292 compile pass
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prior_zip="$RUNNER_TEMP/o51v2-292.zip"
          prior_dir="$RUNNER_TEMP/o51v2-292"
          rm -rf "$prior_dir"
          rm -f "$prior_zip"
          mkdir -p "$prior_dir"

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_READ_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$O51V2_ARTIFACT_ID/zip" \
            -o "$prior_zip"

          test -s "$prior_zip"
          test "$(sha256sum "$prior_zip" | awk '{print $1}')" = "$O51V2_ARTIFACT_SHA256"
          unzip -q "$prior_zip" -d "$prior_dir"

          test -s "$prior_dir/5.4.292/Image"
          test -s "$prior_dir/5.4.292/BUILD-STATUS.txt"
          test "$(sha256sum "$prior_dir/5.4.292/Image" | awk '{print $1}')" = "$O51V2_IMAGE_292_SHA256"
          grep -Fxq 'KERNEL=5.4.292' "$prior_dir/5.4.292/BUILD-STATUS.txt"
          grep -Fxq "RESUKISU_COMMIT=$RESUKISU_BASE_COMMIT" "$prior_dir/5.4.292/BUILD-STATUS.txt"
          grep -Fxq "RESUKISU_VERSION=$RESUKISU_BASE_VERSION" "$prior_dir/5.4.292/BUILD-STATUS.txt"
          grep -Fxq 'UAPI=4' "$prior_dir/5.4.292/BUILD-STATUS.txt"
          grep -Fxq 'SUSFS_VERSION=v2.3.0' "$prior_dir/5.4.292/BUILD-STATUS.txt"
          grep -Fxq "SUSFS_COMMIT=$SUSFS_COMMIT" "$prior_dir/5.4.292/BUILD-STATUS.txt"
          grep -Fxq 'MODULE_LOAD_FILTER=EXCLUDED' "$prior_dir/5.4.292/BUILD-STATUS.txt"
          grep -Fxq 'COMPILE_PASS=YES' "$prior_dir/5.4.292/BUILD-STATUS.txt"
          grep -Fxq 'DEVICE_PASS=NO' "$prior_dir/5.4.292/BUILD-STATUS.txt"

          echo 'O51V2_292_HISTORICAL_COMPILE_AUTH=PASS'

      - name: Extract exact O51 fail-closed replayer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$O51_AUTHORITY")" = "$O51_AUTHORITY_BLOB"

          python3 - "$O51_AUTHORITY" "$RUNNER_TEMP/o51_replay.py" <<'PY'
          from pathlib import Path
          import sys
          import yaml

          src = Path(sys.argv[1])
          out = Path(sys.argv[2])
          doc = yaml.safe_load(src.read_text(encoding="utf-8"))
          steps = next(iter(doc["jobs"].values()))["steps"]
          step = next(
              s for s in steps
              if s.get("name") == "Write and self-test fail-closed authority replayer"
          )
          run = str(step["run"])
          start = 'cat > "$RUNNER_TEMP/o51_replay.py" <<\'PY\'\n'
          if run.count(start) != 1:
              raise SystemExit(f"O51 replayer start marker count={run.count(start)}")
          a = run.index(start) + len(start)
          ends = [x for x in (run.find("\n          PY\n", a), run.find("\nPY\n", a)) if x >= 0]
          if not ends:
              raise SystemExit("O51 replayer end marker missing")
          b = min(ends)
          code = run[a:b]
          lines = code.splitlines()
          if lines and all((not x.strip()) or x.startswith("          ") for x in lines):
              code = "\n".join(x[10:] if x.startswith("          ") else x for x in lines) + "\n"
          compile(code, str(out), "exec")
          out.write_text(code, encoding="utf-8")
          print("O51_REPLAYER_EXTRACTION=PASS")
          PY

          python3 -m py_compile "$RUNNER_TEMP/o51_replay.py"
          python3 "$RUNNER_TEMP/o51_replay.py" --selftest

      - name: Reconstruct current 5.4.292 ReSukiSU 35158 baseline tree
        shell: bash
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/v3-292-baseline"
          STATE="$RUNNER_TEMP/v3-292-state"
          rm -rf "$BASE" "$STATE"
          mkdir -p "$BASE" "$STATE"

          python3 "$RUNNER_TEMP/o51_replay.py" \
            --kernel 5.4.292 \
            --project-root "$GITHUB_WORKSPACE" \
            --aggregate "$BASE" \
            --state-root "$STATE" \
            --sha "$GITHUB_SHA"

          test -s "$BASE/5.4.292/Image"
          test -s "$BASE/5.4.292/BUILD-STATUS.txt"
          grep -Fxq 'KERNEL=5.4.292' "$BASE/5.4.292/BUILD-STATUS.txt"
          grep -Fxq "RESUKISU_COMMIT=$RESUKISU_BASE_COMMIT" "$BASE/5.4.292/BUILD-STATUS.txt"
          grep -Fxq "RESUKISU_VERSION=$RESUKISU_BASE_VERSION" "$BASE/5.4.292/BUILD-STATUS.txt"
          grep -Fxq 'UAPI=4' "$BASE/5.4.292/BUILD-STATUS.txt"
          grep -Fxq 'SUSFS_VERSION=v2.3.0' "$BASE/5.4.292/BUILD-STATUS.txt"
          grep -Fxq "SUSFS_COMMIT=$SUSFS_COMMIT" "$BASE/5.4.292/BUILD-STATUS.txt"
          grep -Fxq 'MODULE_LOAD_FILTER=EXCLUDED' "$BASE/5.4.292/BUILD-STATUS.txt"
          grep -Fxq 'COMPILE_PASS=YES' "$BASE/5.4.292/BUILD-STATUS.txt"

          WS="$STATE/workspace-5.4.292"
          SRC="$WS/.work/5.4.292-update-r1/kernel"
          test -d "$SRC/.git"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(make -s -C "$SRC" kernelversion)" = '5.4.292'
          python3 "$PORT_HELPER" verify-pre --src "$SRC"

          regenerated_sha="$(sha256sum "$BASE/5.4.292/Image" | awk '{print $1}')"
          echo "REGENERATED_35158_IMAGE_SHA256=$regenerated_sha"
          if [ "$regenerated_sha" = "$O51V2_IMAGE_292_SHA256" ]; then
            echo 'O51_35158_REPRODUCIBLE_IMAGE=YES'
          else
            echo 'O51_35158_REPRODUCIBLE_IMAGE=NO_TIMESTAMP_OR_BUILD_METADATA_DIFFERENCE_ALLOWED'
          fi
          echo 'O51_35158_BASELINE_TREE_RECONSTRUCTED=PASS'

      - name: Port 5.4.292 to Golden 35170 + NoMount and compile
        id: candidate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          CAND="$GITHUB_WORKSPACE/v3-292-candidate"
          STATE="$RUNNER_TEMP/v3-292-state"
          WS="$STATE/workspace-5.4.292"
          WORK="$WS/.work/5.4.292-update-r1"
          SRC="$WORK/kernel"
          BASE_OUT="$WORK/out"
          OUT="$WORK/out-golden-candidate"
          BASE_RESULTS="$WORK/results"
          TC="$WORK/clang-r547379"
          NM="$RUNNER_TEMP/nomount-v2.0.0"

          rm -rf "$CAND" "$OUT" "$NM"
          mkdir -p "$CAND"
          exec > >(tee "$CAND/PORT-COMPILE.log") 2>&1

          test -d "$SRC/.git"
          test -d "$SRC/.resukisu/.git"
          test -s "$BASE_OUT/arch/arm64/boot/Image"
          test -x "$TC/bin/clang"
          test -x "$TC/bin/ld.lld"
          test -f "$TC/BUILD_INFO"
          grep -Fq '"bid": "13065274"' "$TC/BUILD_INFO"
          grep -Fq '"branch": "aosp-llvm-r547379-release"' "$TC/BUILD_INFO"

          if [ -s "$BASE_RESULTS/build.log" ]; then
            base_warnings="$(grep -Ec '(^|[[:space:]])warning:' "$BASE_RESULTS/build.log" || true)"
          else
            base_warnings='UNKNOWN'
          fi
          echo "BASELINE_WARNING_COUNT=$base_warnings" | tee "$CAND/01-baseline-warning-count.txt"

          (
            cd "$SRC"
            sha256sum fs/open.c fs/stat.c fs/exec.c fs/susfs.c include/linux/susfs.h \
              > "$CAND/02-host-before-resukisu.sha256"
          )

          python3 "$PORT_HELPER" upgrade-resukisu --src "$SRC" \
            | tee "$CAND/03-resukisu-35170-port.txt"

          (
            cd "$SRC"
            sha256sum -c "$CAND/02-host-before-resukisu.sha256"
          ) | tee "$CAND/04-host-after-resukisu-check.txt"

          git init -q "$NM"
          git -C "$NM" remote add origin "$NOMOUNT_REPO"
          git -C "$NM" fetch -q --depth=1 origin "$NOMOUNT_COMMIT"
          git -C "$NM" checkout -q --detach FETCH_HEAD
          test "$(git -C "$NM" rev-parse HEAD)" = "$NOMOUNT_COMMIT"
          tag_head="$(git ls-remote "$NOMOUNT_REPO" "refs/tags/$NOMOUNT_TAG" | awk '{print $1}')"
          test "$tag_head" = "$NOMOUNT_COMMIT"

          python3 "$PORT_HELPER" integrate-nomount --src "$SRC" --nomount "$NM" \
            | tee "$CAND/05-nomount-integration.txt"
          python3 "$PORT_HELPER" verify-target --src "$SRC" \
            | tee "$CAND/06-target-contract.txt"
          python3 "$PORT_HELPER" fastfail --src "$SRC" \
            | tee "$CAND/07-fastfail-contract.txt"

          bash common/scripts/identity_guard.sh \
            snapshot "$SRC" veux_defconfig "$CAND/08-identity-before-build.sha256"

          export PATH="$TC/bin:$PATH"
          export ARCH=arm64
          clang --version | tee "$CAND/09-clang-version.txt"
          ld.lld --version | tee "$CAND/10-lld-version.txt"

          make -C "$SRC" O="$OUT" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            veux_defconfig 2>&1 | tee "$CAND/11-defconfig.log"
          test -f "$OUT/.config"
          test -x "$SRC/scripts/config"

          "$SRC/scripts/config" --file "$OUT/.config" \
            --enable KSU \
            --disable KSU_TRACEPOINT_HOOK \
            --disable KSU_MANUAL_HOOK \
            --disable KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
            --disable KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
            --disable KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
            --enable KSU_SUSFS \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SUS_MAP \
            --enable THREAD_INFO_IN_TASK \
            --enable NOMOUNT

          make -C "$SRC" O="$OUT" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 \
            olddefconfig 2>&1 | tee "$CAND/12-olddefconfig.log"

          for expected in \
            'CONFIG_KSU=y' \
            'CONFIG_KSU_SUSFS=y' \
            'CONFIG_KSU_SUSFS_SUS_PATH=y' \
            'CONFIG_KSU_SUSFS_SUS_MOUNT=y' \
            'CONFIG_KSU_SUSFS_SUS_KSTAT=y' \
            'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' \
            'CONFIG_KSU_SUSFS_ENABLE_LOG=y' \
            'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y' \
            'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y' \
            'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y' \
            'CONFIG_KSU_SUSFS_SUS_MAP=y' \
            'CONFIG_THREAD_INFO_IN_TASK=y' \
            'CONFIG_NOMOUNT=y' \
            'CONFIG_64BIT=y'
          do
            grep -Fxq "$expected" "$OUT/.config"
          done
          grep -Fxq '# CONFIG_KSU_TRACEPOINT_HOOK is not set' "$OUT/.config"
          grep -Fxq '# CONFIG_KSU_MANUAL_HOOK is not set' "$OUT/.config"

          sha256sum "$OUT/.config" | tee "$CAND/13-generated-config.sha256"
          grep -E '^CONFIG_KSU|^# CONFIG_KSU|^CONFIG_NOMOUNT|^# CONFIG_NOMOUNT' \
            "$OUT/.config" | tee "$CAND/14-feature-config.txt"

          test "$(make -s -C "$SRC" kernelversion)" = '5.4.292'
          kernelrelease_pre="$(
            make -s -C "$SRC" O="$OUT" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 kernelrelease
          )"
          case "$kernelrelease_pre" in 5.4.292*) ;; *) exit 70;; esac
          echo "KERNELRELEASE_PRE=$kernelrelease_pre" | tee "$CAND/15-kernelrelease-pre.txt"

          make -C "$SRC" -j"$(nproc)" O="$OUT" \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            Image \
            2>&1 | tee "$CAND/16-build.log"

          IMAGE="$OUT/arch/arm64/boot/Image"
          test -s "$IMAGE"
          test -s "$OUT/fs/susfs.o"
          test -s "$OUT/fs/nomount/nomount.o"

          git -C "$SRC" diff --check
          git -C "$SRC/.resukisu" diff --check
          if find "$SRC" -type f \( -name '*.rej' -o -name '*.orig' \) -print -quit | grep -q .; then
            echo 'reject/orig files found' >&2
            exit 71
          fi

          bash common/scripts/audit_existing_integration.sh "$SRC" \
            | tee "$CAND/17-post-build-integration-audit.txt"
          bash common/scripts/identity_guard.sh \
            verify "$SRC" veux_defconfig "$CAND/08-identity-before-build.sha256" \
            | tee "$CAND/18-identity-after-build.txt"

          python3 "$PORT_HELPER" verify-target --src "$SRC" \
            | tee "$CAND/19-target-post-build.txt"
          python3 "$PORT_HELPER" fastfail --src "$SRC" \
            | tee "$CAND/20-fastfail-post-build.txt"

          kernelrelease="$(
            make -s -C "$SRC" O="$OUT" ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 kernelrelease
          )"
          case "$kernelrelease" in 5.4.292*) ;; *) exit 72;; esac

          warnings="$(grep -Ec '(^|[[:space:]])warning:' "$CAND/16-build.log" || true)"
          errors="$(
            grep -Eic '(^|[[:space:]])error:|undefined reference|fatal error:|make(\[[0-9]+\])?: \*\*\*' \
              "$CAND/16-build.log" || true
          )"
          test "$errors" = 0
          if [[ "$base_warnings" =~ ^[0-9]+$ ]]; then
            test "$warnings" -le "$base_warnings"
            echo "WARNING_REGRESSION_GATE=PASS baseline=$base_warnings candidate=$warnings" \
              | tee "$CAND/21-warning-regression.txt"
          else
            echo 'WARNING_REGRESSION_GATE=UNAVAILABLE_BASELINE_COUNT' \
              | tee "$CAND/21-warning-regression.txt"
          fi

          cp "$IMAGE" "$CAND/Image"
          image_sha="$(sha256sum "$CAND/Image" | awk '{print $1}')"
          image_bytes="$(wc -c < "$CAND/Image" | tr -d ' ')"

          {
            echo 'KERNEL=5.4.292'
            echo "SOURCE_COMMIT=$SOURCE_COMMIT"
            echo "RESUKISU_BASE_COMMIT=$RESUKISU_BASE_COMMIT"
            echo "RESUKISU_BASE_VERSION=$RESUKISU_BASE_VERSION"
            echo "RESUKISU_COMMIT=$RESUKISU_COMMIT"
            echo "RESUKISU_VERSION=$RESUKISU_VERSION"
            echo "UAPI=$RESUKISU_UAPI"
            echo "SUSFS_COMMIT=$SUSFS_COMMIT"
            echo "SUSFS_VERSION=$SUSFS_VERSION"
            echo "NOMOUNT_COMMIT=$NOMOUNT_COMMIT"
            echo "NOMOUNT_TAG=$NOMOUNT_TAG"
            echo 'MODULE_LOAD_FILTER=EXCLUDED'
            echo 'U7_N4_FASTFAIL_BEHAVIORAL_CONTRACT=PASS'
            echo 'NOMOUNT_COMPILE_OBJECT=PASS'
            echo "KERNELRELEASE=$kernelrelease"
            echo "WARNINGS=$warnings"
            echo "ERROR_SIGNATURES=$errors"
            echo "IMAGE_BYTES=$image_bytes"
            echo "IMAGE_SHA256=$image_sha"
            echo 'COMPILE_PASS=YES'
            echo 'PACKAGE_PASS=NO'
            echo 'STATIC_BOOT_PATH_PASS=NO'
            echo 'DEVICE_PASS=NO'
            echo 'VEUX_5_4_292_GOLDEN_CANDIDATE_COMPILE=PASS'
          } | tee "$CAND/CANDIDATE-RESULT.txt"

      - name: Finalize V3 candidate evidence
        if: always()
        shell: bash
        env:
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
        run: |
          set -euo pipefail
          CAND="$GITHUB_WORKSPACE/v3-292-candidate"
          BASE="$GITHUB_WORKSPACE/v3-292-baseline"
          mkdir -p "$CAND"

          if [ -s "$BASE/5.4.292/BUILD-STATUS.txt" ]; then
            cp "$BASE/5.4.292/BUILD-STATUS.txt" "$CAND/00-REGENERATED-BASELINE-BUILD-STATUS.txt"
          fi
          if [ -s "$BASE/5.4.292/REPLAY.log" ]; then
            cp "$BASE/5.4.292/REPLAY.log" "$CAND/00-REGENERATED-BASELINE-REPLAY.log"
          fi

          {
            echo "CANDIDATE_STEP_OUTCOME=$CANDIDATE_OUTCOME"
            echo "GITHUB_RUN_ID=$GITHUB_RUN_ID"
            echo "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "O51V2_RUN_ID=$O51V2_RUN_ID"
            echo "O51V2_ARTIFACT_ID=$O51V2_ARTIFACT_ID"
            echo "O51V2_IMAGE_292_SHA256=$O51V2_IMAGE_292_SHA256"
            echo "RESUKISU_TARGET=$RESUKISU_COMMIT"
            echo "RESUKISU_VERSION=$RESUKISU_VERSION"
            echo "SUSFS_COMMIT=$SUSFS_COMMIT"
            echo "NOMOUNT_COMMIT=$NOMOUNT_COMMIT"
            echo 'PACKAGE_PASS=NO'
            echo 'STATIC_BOOT_PATH_PASS=NO'
            echo 'DEVICE_PASS=NO'
          } > "$CAND/RUN-METADATA.txt"

          if [ "$CANDIDATE_OUTCOME" != success ] || [ ! -s "$CAND/CANDIDATE-RESULT.txt" ]; then
            {
              echo 'COMPILE_PASS=NO'
              echo 'PACKAGE_PASS=NO'
              echo 'STATIC_BOOT_PATH_PASS=NO'
              echo 'DEVICE_PASS=NO'
              echo 'VEUX_5_4_292_GOLDEN_CANDIDATE_COMPILE=FAIL'
            } > "$CAND/FINAL-RESULT.txt"
          else
            cp "$CAND/CANDIDATE-RESULT.txt" "$CAND/FINAL-RESULT.txt"
          fi

          (
            cd "$CAND"
            find . -type f ! -name SHA256SUMS.txt -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 -r sha256sum > SHA256SUMS.txt
          )

      - name: Upload V3 5.4.292 candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VEUX-V3-5.4.292-GOLDEN-CANDIDATE-COMPILE-${{ github.run_id }}
          path: v3-292-candidate/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Final V3 real green gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CAND="$GITHUB_WORKSPACE/v3-292-candidate"
          test -s "$CAND/FINAL-RESULT.txt"
          test -s "$CAND/Image"
          grep -Fxq 'KERNEL=5.4.292' "$CAND/FINAL-RESULT.txt"
          grep -Fxq "RESUKISU_COMMIT=$RESUKISU_COMMIT" "$CAND/FINAL-RESULT.txt"
          grep -Fxq "RESUKISU_VERSION=$RESUKISU_VERSION" "$CAND/FINAL-RESULT.txt"
          grep -Fxq 'UAPI=4' "$CAND/FINAL-RESULT.txt"
          grep -Fxq 'SUSFS_VERSION=v2.3.0' "$CAND/FINAL-RESULT.txt"
          grep -Fxq "SUSFS_COMMIT=$SUSFS_COMMIT" "$CAND/FINAL-RESULT.txt"
          grep -Fxq "NOMOUNT_COMMIT=$NOMOUNT_COMMIT" "$CAND/FINAL-RESULT.txt"
          grep -Fxq 'MODULE_LOAD_FILTER=EXCLUDED' "$CAND/FINAL-RESULT.txt"
          grep -Fxq 'U7_N4_FASTFAIL_BEHAVIORAL_CONTRACT=PASS' "$CAND/FINAL-RESULT.txt"
          grep -Fxq 'NOMOUNT_COMPILE_OBJECT=PASS' "$CAND/FINAL-RESULT.txt"
          grep -Fxq 'COMPILE_PASS=YES' "$CAND/FINAL-RESULT.txt"
          grep -Fxq 'PACKAGE_PASS=NO' "$CAND/FINAL-RESULT.txt"
          grep -Fxq 'STATIC_BOOT_PATH_PASS=NO' "$CAND/FINAL-RESULT.txt"
          grep -Fxq 'DEVICE_PASS=NO' "$CAND/FINAL-RESULT.txt"
          grep -Fxq 'VEUX_5_4_292_GOLDEN_CANDIDATE_COMPILE=PASS' "$CAND/FINAL-RESULT.txt"

          (
            cd "$CAND"
            sha256sum -c SHA256SUMS.txt
          )

          echo 'V3_5_4_292_REAL_GREEN_GATE=PASS'
