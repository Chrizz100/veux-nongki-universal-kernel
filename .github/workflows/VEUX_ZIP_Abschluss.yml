name: VEUX 5.4.274 - ZIP Abschluss

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veux-5.4.274-finalize-diag10
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  prove:
    name: Prove regular 5.4.274 release with permanent ConfigDiag10
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Restore verified VEUX integration payload
        shell: bash
        run: |
          set -euo pipefail
          payload="VEUX_Diag10_Integration.zip"
          if [[ ! -f "$payload" ]]; then
            echo "::error::VEUX_Diag10_Integration.zip fehlt im Hauptverzeichnis der Repo. ZIP unveraendert hochladen, dann diesen Workflow erneut starten."
            exit 1
          fi
          printf '%s  %s\n' \
            '6479e3ad458e68e0b3b01065ea18f5df288597114a24bf07a1b8c59fb9247b8f' \
            "$payload" | sha256sum -c -
          python3 - "$payload" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          payload = Path(sys.argv[1])
          with zipfile.ZipFile(payload) as archive:
              assert archive.testzip() is None
              for member in archive.infolist():
                  target = Path(member.filename)
                  assert not target.is_absolute()
                  assert ".." not in target.parts
                  assert target.parts[0] in {"common", "docs"}
                  assert "sweet" not in member.filename.lower()
              archive.extractall(".")
          print("VEUX_PAYLOAD=PASS")
          PY

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc binutils bison build-essential ca-certificates curl dwarves file flex git jq libelf-dev libncurses-dev libssl-dev perl python3 python3-venv python3-yaml rsync unzip zip xz-utils zstd
          python3 -m venv "$RUNNER_TEMP/veux-python"
          "$RUNNER_TEMP/veux-python/bin/python" -m pip install ruamel.yaml==0.19.1 PyYAML==6.0.3

      - name: Verify regular release and ConfigDiag10 contracts
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/veux-python/bin/python" common/scripts/test_veux_update_engine.py
          "$RUNNER_TEMP/veux-python/bin/python" common/scripts/test_veux_release.py
          "$RUNNER_TEMP/veux-python/bin/python" common/scripts/test_veux_device_fixes.py
          "$RUNNER_TEMP/veux-python/bin/python" common/scripts/test_veux_config_compat.py
          "$RUNNER_TEMP/veux-python/bin/python" common/scripts/test_veux_source_transport.py

      - name: Bind exact validated 5.4.274 component pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/veux-targets"
          "$RUNNER_TEMP/veux-python/bin/python" - "$RUNNER_TEMP/veux-targets/targets.json" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          current = json.loads(Path("common/contracts/CURRENT_BUILD.json").read_text())
          assert current["status"] == "compile-package-static-validated"
          assert current["lineages"]["5.4.274"]["compile"] is True
          assert current["lineages"]["5.4.274"]["package"] is True
          assert current["lineages"]["5.4.274"]["static_boot"] is True
          expected = {
              "resukisu": "94dd3c93c2053a84fd752df6eb85db99b7d70ab8",
              "susfs": "5326e21a7eb232f9e21debdd5164e99bee3d1e2f",
              "nomount": "6b1be186322d4e0bdc465cf27f6fc0d3679087c6",
          }
          assert {key: value["commit"] for key, value in current["targets"].items()} == expected
          golden = Path("common/contracts/GOLDEN_BASELINE.yml")
          targets = {
              "repository_sha": os.environ["GITHUB_SHA"],
              "golden_sha256": hashlib.sha256(golden.read_bytes()).hexdigest(),
              "lineages": ["5.4.274"],
              "components": current["targets"],
          }
          Path(sys.argv[1]).write_text(json.dumps(targets, sort_keys=True, indent=2) + "\n")
          print("CURRENT_274_PINS=PASS; ReSukiSU=35187; SUSFS=2.3.0; NoMount=20")
          PY

      - name: Build regular 5.4.274 release
        id: kernel
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/veux-python/bin/python" -u common/scripts/veux_release_device.py worker \
            --kernel 5.4.274 \
            --bundle "$RUNNER_TEMP/veux-targets" \
            --work "$RUNNER_TEMP/veux-builds/5.4.274" \
            --public "$RUNNER_TEMP/veux-public/5.4.274" \
            --overlays "$RUNNER_TEMP/veux-overlays" \
            --jobs "$(nproc)"
          "$RUNNER_TEMP/veux-python/bin/python" - "$RUNNER_TEMP/veux-public/5.4.274/RESULT.json" <<'PY'
          import json
          import sys

          row = json.load(open(sys.argv[1]))
          assert row["kernel"] == "5.4.274"
          assert row["compile"] is True
          assert row["package"] is True
          assert row["static_boot"] is True
          assert row["device"] is False
          assert row["config_compat"]["id"] == "ConfigDiag10"
          assert row["config_compat"]["reference_run"] == "36738661110"
          assert row["config_compat"]["actual_config_sha256"] == "5904f8d2439e2cb05ef3db7edbe653d269e070b0e28d7e131a44600d61bab229"
          assert row["config_audit"]["vintf_kernel"]["status"] == "PASS"
          assert row["config_audit"]["vintf_kernel"]["requirements"] == 261
          assert row["config_audit"]["vintf_kernel"]["passed"] == 261
          assert row["config_audit"]["cfi"] == "configured-and-core-instrumented"
          assert row["config_audit"]["stack_protector"] == "strong-configured-and-core-instrumented"
          print("VEUX_274_CONFIGDIAG10_REGULAR_RELEASE=PASS")
          PY

      - name: Publish validated 5.4.274 candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.kernel.outputs.artifact_name }}_ConfigDiag10Final
          path: ${{ runner.temp }}/veux-public/5.4.274/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Save verified VEUX integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- common/diagnostics/config-5.4.274-diag10/baseline-evidence.json common/diagnostics/config-5.4.274-diag10/config_audit.py common/diagnostics/config-5.4.274-diag10/diag09-actual.config common/diagnostics/config-5.4.274-diag10/embed-real-config.patch common/diagnostics/config-5.4.274-diag10/manifest.json common/diagnostics/config-5.4.274-diag10/rom-evidence.json common/diagnostics/config-5.4.274-diag10/rom-kernel-requirements.xml common/diagnostics/config-5.4.274-diag10/sched-debug-manifest.json common/diagnostics/config-5.4.274-diag10/sched-debug-pm.patch common/diagnostics/config-5.4.274-diag10/source/arch/arm64/configs/stock_defconfig common/diagnostics/config-5.4.274-diag10/source/arch/arm64/configs/veux_defconfig common/diagnostics/config-5.4.274-diag10/source/kernel/Makefile common/diagnostics/config-5.4.274-diag10/source/kernel/configs.c common/diagnostics/config-5.4.274-diag10/source/kernel/sched/debug.c common/diagnostics/config-5.4.274-diag10/source/lib/Kconfig.debug common/diagnostics/config-5.4.274-diag10/source/scripts/Kbuild.include common/diagnostics/config-5.4.274-diag10/source/scripts/Makefile.lib common/diagnostics/config-5.4.274-diag10/test_config_audit.py common/diagnostics/config-5.4.274-diag10/test_sched_debug.py common/diagnostics/config-5.4.274-diag10/test_vintf_kernel.py common/diagnostics/config-5.4.274-diag10/vintf_kernel.py common/scripts/test_veux_config_compat.py common/scripts/test_veux_device_fixes.py common/scripts/veux_config_compat.py common/scripts/veux_release_device.py docs/VEUX_DIAG10_FINALISIERUNG_2026-10-04.txt docs/VEUX_Diag10_Final_Integration.diff
          if git diff --cached --quiet; then
            echo 'VEUX integration already saved'
            exit 0
          fi
          git commit -m 'Integrate validated VEUX 5.4.274 ConfigDiag10 from ZIP [skip ci]'
          git push origin HEAD:main

      - name: Publish failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: VEUX-274-ConfigDiag10-Final-Diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/veux-builds/diagnostics/5.4.274/
          if-no-files-found: warn
          retention-days: 7
