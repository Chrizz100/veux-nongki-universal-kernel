          ${{ runner.temp }}/r12-kernel/SHA256SUMS
          ${{ runner.temp }}/r12-kernel/BUILD_OUTPUTS.json
          ${{ runner.temp }}/r12-kernel/BUILD_PACKAGE_CHECK.json
          ${{ runner.temp }}/r12-kernel/PACKAGE_RESULT.json
          ${{ runner.temp }}/r12-kernel/ANYKERNEL_PACKAGE_CHECK.json
          ${{ runner.temp }}/r12-kernel/README.txt
          ${{ runner.temp }}/r12-kernel/BakaSU_v4.2.0-rc3_35252-arm64-v8a-spoofed-release.apk
          ${{ runner.temp }}/r12-kernel/NoMount-v2.2.0-release-bf1847f-605.zip
        if-no-files-found: error
        compression-level: 0
        retention-days: 21
    - name: Preserve build and failure reports
      id: r12_reports_upload
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: VEUX_R12_PRUEFBERICHTE
        path: |
          ${{ runner.temp }}/r12-reports/
          ${{ runner.temp }}/r11-reports/
          ${{ runner.temp }}/veux-r55h17-r4/evidence/
          ${{ runner.temp }}/veux-r55h17-r1-audit/
          ${{ runner.temp }}/veux-r5s2-overlay/ZIP_VALIDATION.json
          ${{ runner.temp }}/veux-real-version-overlay/MANIFEST_SHA256.json
          ${{ runner.temp }}/veux-r5s2-work/prepare.json
          ${{ runner.temp }}/veux-r5s2-work/report/*.json
          ${{ runner.temp }}/veux-r5s2-work/builds/diagnostics/5.4.274/**/*.json
          ${{ runner.temp }}/veux-r5s2-work/builds/diagnostics/5.4.274/**/*.log
          ${{ runner.temp }}/veux-r5s2-work/builds/diagnostics/5.4.274/**/*.config
          ${{ runner.temp }}/veux-r5s2-work/builds/diagnostics/5.4.274/**/Module.symvers
          ${{ runner.temp }}/veux-r5s2-work/builds/diagnostics/5.4.274/**/System.map
          ${{ runner.temp }}/r12-flat-build/*.json
          ${{ runner.temp }}/r12-flat-build/provenance/
          ${{ runner.temp }}/r12-kernel/*.json
        if-no-files-found: warn
        include-hidden-files: true
        compression-level: 6
        retention-days: 21
    - name: 10 Verify full result and publish the download location
      id: r12_complete
      if: ${{ always() }}
      env:
        STATIC_RESULT: ${{ steps.r12_static.conclusion }}
        COMPILE_RESULT: ${{ steps.r12_compile.conclusion }}
        R4_RESULT: ${{ steps.r4_verify.conclusion }}
        BUILTIN_RESULT: ${{ steps.r12_builtin.conclusion }}
        PACKAGE_RESULT: ${{ steps.r12_package.conclusion }}
        DIAGNOSTICS_RESULT: ${{ steps.r12_diagnostics.conclusion }}
        REPO_RESULT: ${{ steps.r12_repo_unchanged.conclusion }}
        KERNEL_UPLOAD_RESULT: ${{ steps.r12_kernel_upload.conclusion }}
        JOB_RESULT_BEFORE_SUMMARY: ${{ job.status }}
      shell: bash
      run: |
        set -euo pipefail
        python3 -B - <<'PY_R12_COMPLETE'
        import json, os
        from pathlib import Path
        required = ['STATIC_RESULT', 'COMPILE_RESULT', 'R4_RESULT', 'BUILTIN_RESULT',
                    'PACKAGE_RESULT', 'DIAGNOSTICS_RESULT', 'REPO_RESULT', 'KERNEL_UPLOAD_RESULT']
        failed = [name for name in required if os.environ.get(name) != 'success']
        complete = not failed and os.environ['JOB_RESULT_BEFORE_SUMMARY'] == 'success'
        status = 'KERNEL_ZIP_BUILD_AND_UPLOAD_PASS_DEVICE_UNTESTED' if complete else 'KERNEL_BUILD_OR_PACKAGE_INCOMPLETE'
        lines = ['## VEUX R12', '', '**Ergebnis:** `' + status + '`', '']
        if complete:
            lines += ['Download: Artefakt **VEUX_R12_KERNEL**.',
                      'Die aeussere GitHub-Artefakt-ZIP entpacken. Darin liegt **VEUX_R12_CASS_KERNEL.zip**.',
                      'Diagnose: `VEUX_R12_GERAETEDIAGNOSE_R2.sh`; Pruefsummen: `SHA256SUMS`.',
                      'Vollstaendiger Build und Paketpruefung bestanden; ein Geraetetest wurde nicht durchgefuehrt.', '']
        else:
            lines += ['Der Kernel wurde nicht als vollstaendig geprueftes Ergebnis bereitgestellt.',
                      'Fehlgeschlagene Pflichtstufen: ' + ', '.join(failed),
                      'Details stehen in der ersten fehlgeschlagenen Stufe und im Artefakt **VEUX_R12_PRUEFBERICHTE**.', '']
        with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
            summary.write('\n'.join(lines))
        print(json.dumps({'status': status, 'failed_required_stages': failed,
                          'device_test': False, 'automatic_flash': False}))
        if not complete:
            raise SystemExit(1)
        PY_R12_COMPLETE
