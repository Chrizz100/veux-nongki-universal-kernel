# VEUX R12 CI-R3: one YAML + one MAIN ZIP; no user secrets or extra parameters.
# Verify the original compiler hashes while its files still exist, before worker cleanup.
# Bind the saved compiler evidence to this run, attempt, commit and actual build command.
# Kernel sources, original compiler pins, ABI/CRC and packaging gates are preserved.
name: VEUX R12 CASS - Kernel bauen
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: veux-r12-cass-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_TERMINAL_PROMPT: '0'
  EXPECTED_REPO: Chrizz100/veux-nongki-universal-kernel
  R5S2_MAIN_ZIP: VEUX_R5S2_BAKASU522_MAIN.zip
  R5S2_MAIN_SHA256: 37a85d967df5cd9fa4dd3302e2073bc3b9ce461a6e03cd0ef51914fa5f5358b8
  BAKASU_522: 522081c5b1c58587c4c743242eecf445ccebed5d
  VERSION_MAIN_ZIP: VEUX_R5S2_GENUINE_BAKASU35234_MAIN.zip
  VERSION_MAIN_SHA256: d3c0b0da02af4355d1cc0b77b14320c0e8a32fd15995dee7bfbe9acd263e2457
  BAKASU_SYNC: f308ed0936bdd31163cb53da3f42bc7a698f5512
  R4_PACKAGE_NAME: VEUX_R55H17_R4_CASS_UPDATE_MAIN.zip
  R4_MANIFEST_SHA256: 5222d47522356998c6141908af436c23e3731b04ce1a3376f04e12527eed6311
  REPRO_PACKAGE: VEUX_R12_CASS_MAIN.zip
  REPRO_ARCHIVE_SHA256: c14ed9641a61fbda798a19fb3caf2943238fab1cf7633b3a6c6fb7bd6ebd3379
  REPRO_MANIFEST_SHA256: 7999787f31ed173d85e7b5b63ff0d0075d59207fcf42a1b298ffe3f2b2efaf54
  R4_ARCHIVE_SHA256: 88907c8f1bd0a39826092edcd3bf824c05a40bb70d894a53437e001927f75380
jobs:
  r5s2_bakasu_522:
    if: ${{ github.repository == 'Chrizz100/veux-nongki-universal-kernel' && github.ref == 'refs/heads/main' }}
    name: CASS Kernel mit BakaSU, SUSFS und NoMount bauen
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - name: Checkout exact git commit, no stored credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Verify exact repository and checked-out commit
      id: r12_repository
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = "$EXPECTED_REPO"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test -z "$(git status --porcelain --untracked-files=all)"
        echo 'R12_IMMUTABLE_REPOSITORY=PASS'
    - name: 01 Authenticate the complete R12 MAIN before executing any payload
      id: r12_auth
      shell: bash
      run: |
        set -euo pipefail
        test -f "$GITHUB_WORKSPACE/$REPRO_PACKAGE"
        cat > "$RUNNER_TEMP/r12-bootstrap.py" <<'PY_R11_BOOTSTRAP'
        #!/usr/bin/env python3
        """Authenticate every executable payload byte before extracting a new directory."""
        import argparse
        import hashlib
        import json
        from pathlib import Path, PurePosixPath
        import re
        import stat
        import zipfile


        def extract(archive, destination, archive_sha, manifest_sha):
            archive, destination = Path(archive), Path(destination)
            if destination.exists() or destination.is_symlink():
                raise ValueError('PAYLOAD_DESTINATION_EXISTS')
            if hashlib.sha256(archive.read_bytes()).hexdigest() != archive_sha:
                raise ValueError('PAYLOAD_ARCHIVE_SHA_CHANGED')
            with zipfile.ZipFile(archive) as source:
                items = source.infolist()
                names = [item.filename for item in items]
                if len(names) != len(set(names)):
                    raise ValueError('DUPLICATE_ZIP_ENTRY')
                if sum(item.file_size for item in items) > 100 * 1024 * 1024:
                    raise ValueError('PAYLOAD_TOO_LARGE')
                for item in items:
                    path = PurePosixPath(item.filename)
                    if (path.is_absolute() or '..' in path.parts or '.' in path.parts
                            or str(path) != item.filename or '\\' in item.filename
                            or item.is_dir() or '\x00' in item.filename
                            or stat.S_ISLNK(item.external_attr >> 16)):
                        raise ValueError('UNSAFE_PAYLOAD_PATH')
                if source.testzip() is not None:
                    raise ValueError('PAYLOAD_ZIP_CRC_FAILED')
                raw = source.read('PAYLOAD_MANIFEST.json')
                if hashlib.sha256(raw).hexdigest() != manifest_sha:
                    raise ValueError('PAYLOAD_MANIFEST_SHA_CHANGED')
                manifest = json.loads(raw)
                if manifest.get('schema') != 1 or manifest.get('automatic_flash') is not False:
                    raise ValueError('UNTRUSTED_MANIFEST_SCHEMA')
                files = manifest.get('files')
                if (not isinstance(files, dict) or not files
                        or not all(isinstance(k, str) and isinstance(v, str)
                                   and re.fullmatch('[0-9a-f]{64}', v) for k, v in files.items())):
                    raise ValueError('INVALID_PAYLOAD_HASH_MAP')
                if set(names) != set(files) | {'PAYLOAD_MANIFEST.json'}:
                    raise ValueError('UNMANIFESTED_OR_MISSING_ENTRY')
                for name, expected in files.items():
                    if hashlib.sha256(source.read(name)).hexdigest() != expected:
                        raise ValueError('PAYLOAD_FILE_SHA_CHANGED:' + name)
                destination.mkdir(parents=True)
                for name in sorted(names):
                    target = destination / name
                    target.parent.mkdir(parents=True, exist_ok=True)
                    target.write_bytes(source.read(name))
            return {'status': 'AUTHENTICATED', 'files': len(files),
                    'archive_sha256': archive_sha, 'manifest_sha256': manifest_sha,
                    'automatic_flash': False}


        def main():
            p = argparse.ArgumentParser(description=__doc__)
            p.add_argument('--archive', required=True)
            p.add_argument('--out', required=True)
            p.add_argument('--archive-sha256', required=True)
            p.add_argument('--manifest-sha256', required=True)
            a = p.parse_args()
            print(json.dumps(extract(a.archive, a.out, a.archive_sha256, a.manifest_sha256)))


        if __name__ == '__main__':
            main()
        PY_R11_BOOTSTRAP
        python3 -B "$RUNNER_TEMP/r12-bootstrap.py" \
          --archive "$GITHUB_WORKSPACE/$REPRO_PACKAGE" \
          --out "$RUNNER_TEMP/veux-r12-payload" \
          --archive-sha256 "$REPRO_ARCHIVE_SHA256" \
          --manifest-sha256 "$REPRO_MANIFEST_SHA256"
        printf 'REPRO_PAYLOAD=%s\n' "$RUNNER_TEMP/veux-r12-payload" >> "$GITHUB_ENV"
    - name: 02 Verify all historical build inputs included inside MAIN
      id: r12_legacy_inputs
      shell: bash
      run: |
        set -euo pipefail
        inputs="$REPRO_PAYLOAD/reference/root_inputs"
        printf '%s  %s\n' \
          "$R5S2_MAIN_SHA256" "$inputs/$R5S2_MAIN_ZIP" \
          "$VERSION_MAIN_SHA256" "$inputs/$VERSION_MAIN_ZIP" \
          "$R4_ARCHIVE_SHA256" "$inputs/$R4_PACKAGE_NAME" | sha256sum --check --status
        {
          printf 'R5S2_ARCHIVE=%s\n' "$inputs/$R5S2_MAIN_ZIP"
          printf 'VERSION_ARCHIVE=%s\n' "$inputs/$VERSION_MAIN_ZIP"
          printf 'R4_ARCHIVE=%s\n' "$inputs/$R4_PACKAGE_NAME"
        } >> "$GITHUB_ENV"
        echo 'R12_ALL_LEGACY_ARCHIVES_AUTHENTICATED_INSIDE_MAIN=PASS'
    - name: R4 authenticate source-port payload and run isolation negative tests before baseline build
      shell: bash
      run: |
        set -euo pipefail
        test -f "$R4_ARCHIVE"
        cat > "$RUNNER_TEMP/r4-extract-payload.py" <<'PY_R4_EXTRACT'
        #!/usr/bin/env python3
        """Extract a SHA-pinned executable payload, refusing unsafe ZIP entries."""
        import argparse
        import hashlib
        import json
        from pathlib import Path, PurePosixPath
        import stat
        import zipfile


        def extract(archive: Path, destination: Path, manifest_sha: str) -> dict:
            if destination.exists() or destination.is_symlink():
                raise ValueError('R4_PAYLOAD_DESTINATION_EXISTS')
            with zipfile.ZipFile(archive) as source:
                if source.testzip() is not None:
                    raise ValueError('R4_PAYLOAD_ZIP_CRC_FAILED')
                names = source.namelist()
                if len(names) != len(set(names)):
                    raise ValueError('R4_DUPLICATE_ZIP_ENTRY')
                raw = source.read('PAYLOAD_MANIFEST.json')
                if hashlib.sha256(raw).hexdigest() != manifest_sha:
                    raise ValueError('R4_PAYLOAD_MANIFEST_HASH_CHANGED')
                manifest = json.loads(raw)
                if manifest.get('schema') != 1 or manifest.get('flash_allowed') is not False:
                    raise ValueError('R4_UNTRUSTED_MANIFEST_SCHEMA')
                files = manifest.get('files', {})
                if not files or not all(isinstance(k, str) and isinstance(v, str) for k, v in files.items()):
                    raise ValueError('R4_INVALID_PAYLOAD_HASH_MAP')
                # The final workflow and human-facing checksum wrapper are optional ZIP
                # companions. They are not executed from this extracted payload.
                companions = {'R55H17_R4_CASS_UPDATE_BUILD_NOFLASH.yml', 'SHA256SUMS', 'README.txt'}
                extras = set(names) - set(files) - {'PAYLOAD_MANIFEST.json'}
                if not extras <= companions:
                    raise ValueError('R4_UNMANIFESTED_PAYLOAD_ENTRY')
                for item in source.infolist():
                    path = PurePosixPath(item.filename)
                    if (path.is_absolute() or '..' in path.parts or '\\' in item.filename
                            or item.filename.endswith('/') or '\x00' in item.filename
                            or stat.S_ISLNK(item.external_attr >> 16)):
                        raise ValueError('R4_UNSAFE_PAYLOAD_PATH')
                for name, expected in files.items():
                    data = source.read(name)
                    if hashlib.sha256(data).hexdigest() != expected:
                        raise ValueError('R4_PAYLOAD_FILE_HASH_CHANGED:' + name)
                destination.mkdir(parents=True)
                for name in ['PAYLOAD_MANIFEST.json', *sorted(files)]:
                    target = destination / name
                    target.parent.mkdir(parents=True, exist_ok=True)
                    target.write_bytes(source.read(name))
            return {'status': 'R4_PAYLOAD_AUTHENTICATED', 'files': len(files),
                    'manifest_sha256': manifest_sha, 'flash_allowed': False}


        def main():
            parser = argparse.ArgumentParser()
            parser.add_argument('--archive', type=Path, required=True)
            parser.add_argument('--out', type=Path, required=True)
            parser.add_argument('--manifest-sha256', required=True)
            args = parser.parse_args()
            print(json.dumps(extract(args.archive, args.out, args.manifest_sha256), sort_keys=True))


        if __name__ == '__main__':
            main()
        PY_R4_EXTRACT
        python3 -B "$RUNNER_TEMP/r4-extract-payload.py" --archive "$R4_ARCHIVE" --out "$RUNNER_TEMP/veux-r55h17-r4-payload" --manifest-sha256 "$R4_MANIFEST_SHA256"
        printf 'R4_PAYLOAD=%s\n' "$RUNNER_TEMP/veux-r55h17-r4-payload" >> "$GITHUB_ENV"
        python3 -B -m unittest discover -s "$RUNNER_TEMP/veux-r55h17-r4-payload/workflow" -p test_cass_r4.py -v
        python3 -B - "$RUNNER_TEMP/veux-r55h17-r4-payload" <<'PY_R4_AST'
        import ast,sys
        from pathlib import Path
        for path in Path(sys.argv[1]).rglob('*.py'):
            ast.parse(path.read_text(),filename=str(path))
        print('R4_AUTHENTICATED_PYTHON_SYNTAX=PASS')
        PY_R4_AST
    - name: Activate the pinned ShellCheck 0.11.0 included in MAIN
      id: r12_shellcheck
      shell: bash
      run: |
        set -euo pipefail
        tool="$REPRO_PAYLOAD/r12/host-tools/shellcheck"
        printf '%s  %s\n' '4da528ddb3a4d1b7b24a59d4e16eb2f5fd960f4bd9a3708a15baddbdf1d5a55b' "$tool" | sha256sum --check --status
        chmod 0755 "$tool"
        printf '%s\n' "$REPRO_PAYLOAD/r12/host-tools" >> "$GITHUB_PATH"
        "$tool" --version
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        echo 'R12_PINNED_SHELLCHECK=PASS'
    - name: Verify this workflow using pinned actionlint and runner ShellCheck
      shell: bash
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
        curl --fail --location --silent --show-error --retry 3 --max-time 120 \
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
          --output "$archive"
        printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check --status
        mkdir -p "$RUNNER_TEMP/veux-r5s2-actionlint"
        tar -xzf "$archive" -C "$RUNNER_TEMP/veux-r5s2-actionlint" actionlint
        command -v shellcheck
        "$RUNNER_TEMP/veux-r5s2-actionlint/actionlint" -oneline .github/workflows/VEUX_R12_CASS_BUILD.yml
        echo 'R5S2_ACTIONLINT_AND_SHELLCHECK=PASS'
    - name: Authenticate R5S2 archive and full original R5S1 nested CI chain
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path
        import hashlib,json,os,stat,zipfile
        f=Path(os.environ['R5S2_ARCHIVE'])
        if hashlib.sha256(f.read_bytes()).hexdigest()!=os.environ['R5S2_MAIN_SHA256']:
            raise SystemExit('R5S2_ROOT_ARCHIVE_CHANGED')
        with zipfile.ZipFile(f) as z:
            if z.testzip() is not None:raise SystemExit('R5S2_ARCHIVE_CRC_ERROR')
            m=json.loads(z.read('MANIFEST_SHA256.json'))
            p='common/scripts/veux_r5s2_unpack.py'
            raw=z.read(p)
            if m.get('schema')!=1 or m.get('flash_approved') is not False or hashlib.sha256(raw).hexdigest()!=m['files'][p]:
                raise SystemExit('R5S2_BOOTSTRAP_UNVERIFIED')
        output=Path(os.environ['RUNNER_TEMP'])/'veux-r5s2-bootstrap-authenticated.py'
        if output.exists():raise SystemExit('BOOTSTRAP_COLLISION')
        output.write_bytes(raw)
        PY
        python3 "$RUNNER_TEMP/veux-r5s2-bootstrap-authenticated.py" \
          --main "$R5S2_ARCHIVE" \
          --out "$RUNNER_TEMP/veux-r5s2-overlay"
        {
          printf 'R5S2_OVERLAY=%s\n' "$RUNNER_TEMP/veux-r5s2-overlay"
          printf 'R5S1_OVERLAY=%s\n' "$RUNNER_TEMP/veux-r5s2-overlay/verified-r5s1"
          printf 'R5_OVERLAY=%s\n' "$RUNNER_TEMP/veux-r5s2-overlay/verified-r5s1/nested_r5_r4_r2/r5"
          printf 'R4_OVERLAY=%s\n' "$RUNNER_TEMP/veux-r5s2-overlay/verified-r5s1/nested_r5_r4_r2/r4"
          printf 'NM211_R2_OVERLAY=%s\n' "$RUNNER_TEMP/veux-r5s2-overlay/verified-r5s1/nested_r5_r4_r2/r2"
          printf 'R5S1_REFERENCE=%s\n' "$RUNNER_TEMP/veux-r5s2-overlay/verified-r5s1/common/sync/VEUX_SYNC_F308_D726_R5_HOOK.c"
          printf 'R5_R4_SOURCE=%s\n' "$RUNNER_TEMP/veux-r5s2-overlay/verified-r5s1/evidence/R4_COMPILED_REFERENCE_SELINUX.c"
          printf 'R5_D726_SOURCE=%s\n' "$RUNNER_TEMP/veux-r5s2-overlay/verified-r5s1/evidence/D726_ORIGINAL_REFERENCE_SELINUX.c"
          printf 'R5_R4_SOURCE=%s\n' "$RUNNER_TEMP/veux-r5s2-overlay/verified-r5s1/nested_r5_r4_r2/R4_COMPILED_REFERENCE_SELINUX.c"
          printf 'R5_D726_SOURCE=%s\n' "$RUNNER_TEMP/veux-r5s2-overlay/verified-r5s1/nested_r5_r4_r2/D726_ORIGINAL_REFERENCE_SELINUX.c"
        } >> "$GITHUB_ENV"
        echo 'R5S2_FULL_ARCHIVE_CHAIN=PASS'
    - name: Authenticate isolated BakaSU version module and full R5S2 source chain
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path
        import hashlib,json,os,stat,zipfile
        archive=Path(os.environ['VERSION_ARCHIVE'])
        if hashlib.sha256(archive.read_bytes()).hexdigest()!=os.environ['VERSION_MAIN_SHA256']:
            raise SystemExit('GENUINE_VERSION_ARCHIVE_SHA256_MISMATCH')
        dst=Path(os.environ['RUNNER_TEMP'])/'veux-real-version-overlay'
        if dst.exists():raise SystemExit('VERSION_OVERLAY_ALREADY_EXISTS')
        with zipfile.ZipFile(archive) as z:
            if z.testzip() is not None:raise SystemExit('VERSION_OVERLAY_CRC_FAILED')
            m=json.loads(z.read('MANIFEST_SHA256.json'))
            if (m.get('schema')!=1 or m.get('flash_approved') is not False
                or m.get('expected_real_version')!=35234):
                raise SystemExit('VERSION_MANIFEST_UNTRUSTED')
            expected=set(m['files'])|{'MANIFEST_SHA256.json'}
            if set(z.namelist())!=expected:raise SystemExit('VERSION_OVERLAY_FILES_CHANGED')
            for item in z.infolist():
                name=item.filename
                p=Path(name)
                if (p.is_absolute() or '..' in p.parts or (len(p.parts)<2 and name!='MANIFEST_SHA256.json')
                    or (item.external_attr>>16)&0o170000==0o120000):
                    raise SystemExit('UNSAFE_VERSION_OVERLAY_PATH')
                data=z.read(name)
                if name!='MANIFEST_SHA256.json' and hashlib.sha256(data).hexdigest()!=m['files'][name]:
                    raise SystemExit('VERSION_OVERLAY_FILE_SHA_FAILED:'+name)
            dst.mkdir(parents=True)
            for item in z.infolist():
                target=dst/item.filename
                target.parent.mkdir(parents=True,exist_ok=True)
                target.write_bytes(z.read(item.filename))
        print('VEUX_TRUE_VERSION_HASH_PINNED_BOOTSTRAP=PASS')
        PY
        printf 'VERSION_OVERLAY=%s\n' "$RUNNER_TEMP/veux-real-version-overlay" >> "$GITHUB_ENV"
        echo 'R5S2_REAL_VERSION_SOURCE_OVERLAY=PASS'
    - name: Run R1-R5S1 regression tests and all new R5S2 negative tests
      shell: bash
      run: |
        set -euo pipefail
        export PYTHONPATH="$R5S2_OVERLAY/common/scripts:$R5S1_OVERLAY/common/scripts:$R5_OVERLAY/common/scripts:$R4_OVERLAY/common/scripts:$NM211_R2_OVERLAY/common/scripts${PYTHONPATH:+:$PYTHONPATH}"
        python3 -m unittest discover -s "$NM211_R2_OVERLAY/Tests" -p test_veux_r6_nomount211_preflight_r1.py -v
        python3 -m unittest discover -s "$NM211_R2_OVERLAY/Tests" -p test_veux_r6_nomount211_build_r2.py -v
        python3 -m unittest discover -s "$R4_OVERLAY/Tests" -p test_susfs_selinux54_r3.py -v
        python3 -m unittest discover -s "$R4_OVERLAY/Tests" -p test_veux_r6_susfs_selinux54_build_r4.py -v
        python3 -m unittest discover -s "$R5_OVERLAY/Tests" -p test_veux_r5_susfs_selinux.py -v
        python3 -m unittest discover -s "$R5S1_OVERLAY/Tests" -p test_veux_sync_susfs_r1.py -v
        python3 -m unittest discover -s "$R5S2_OVERLAY/Tests" -p test_veux_r5s2_522.py -v
        export PYTHONPATH="$VERSION_OVERLAY/common/scripts:$PYTHONPATH"
        python3 -m unittest discover -s "$VERSION_OVERLAY/Tests" -p test_veux_r5s2_true_version.py -v
        test -z "$(git status --porcelain --untracked-files=all)"
        echo 'R5S2_HISTORICAL_AND_REAL_GIT_VERSION_TESTS=PASS'
    - name: Install documented build dependencies and pinned Python packages
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc binutils binutils-aarch64-linux-gnu bison build-essential ca-certificates curl dwarves file flex \
          git jq libelf-dev libncurses-dev libssl-dev openssl perl python3 \
          python3-venv python3-yaml rsync unzip zip xz-utils zstd
        python3 -m venv "$RUNNER_TEMP/veux-r5s2-venv"
        "$RUNNER_TEMP/veux-r5s2-venv/bin/python" -m pip install \
          --disable-pip-version-check --retries 2 --timeout 30 \
          ruamel.yaml==0.19.1 PyYAML==6.0.3
        printf 'R5S2_PY=%s\n' "$RUNNER_TEMP/veux-r5s2-venv/bin/python" >> "$GITHUB_ENV"
    - name: R4 verify every Bash stage and embedded Python before kernel compilation
      shell: bash
      run: |
        set -euo pipefail
        command -v shellcheck
        mkdir -p "$RUNNER_TEMP/r55h17-r4-shellcheck"
        python3 - ".github/workflows/VEUX_R12_CASS_BUILD.yml" "$RUNNER_TEMP/r55h17-r4-shellcheck" <<'PY_R4_SC'
        import ast,re,sys
        from pathlib import Path
        import yaml
        source=Path(sys.argv[1]); destination=Path(sys.argv[2])
        document=yaml.safe_load(source.read_text())
        for i,step in enumerate(document['jobs']['r5s2_bakasu_522']['steps']):
            if 'run' in step:
                if step.get('shell')!='bash':raise SystemExit('UNREVIEWED_RUN_SHELL')
                (destination / (str(i)+'-step.sh')).write_text(step['run'])
                lines=step['run'].splitlines()
                for j,line in enumerate(lines):
                    match=re.search(r"<<'(PY[A-Za-z0-9_]*)'",line)
                    if match:
                        delimiter=match.group(1)
                        end=next(k for k in range(j+1,len(lines)) if lines[k]==delimiter)
                        ast.parse('\n'.join(lines[j+1:end])+'\n')
        PY_R4_SC
        for script in "$RUNNER_TEMP"/r55h17-r4-shellcheck/*-step.sh; do
          bash -n "$script"
          shellcheck --shell=bash --severity=error "$script"
        done
        echo 'R55H17_R4_ALL_BASH_STAGES=PASS; NO_FLASH'
    - name: 03 Static Green Pass and packaging regression checks before compilation
      id: r12_static
      shell: bash
      run: |
        set -euo pipefail
        python3 -B "$REPRO_PAYLOAD/r12/static_green.py" \
          --payload "$REPRO_PAYLOAD" \
          --workflow "$GITHUB_WORKSPACE/.github/workflows/VEUX_R12_CASS_BUILD.yml" \
          --actionlint "$RUNNER_TEMP/veux-r5s2-actionlint/actionlint" \
          --out "$RUNNER_TEMP/r12-reports/static"
        python3 -B -m unittest discover -s "$REPRO_PAYLOAD/pipeline" -p test_pipeline_contract.py -v \
          2>&1 | tee "$RUNNER_TEMP/r12-reports/PIPELINE_NEGATIVE_TESTS.log"
        python3 -B -m unittest discover -s "$REPRO_PAYLOAD/r11" -p test_source_update.py -v \
          2>&1 | tee "$RUNNER_TEMP/r12-reports/SOURCE_UPDATE_TESTS.log"
        python3 -B "$REPRO_PAYLOAD/r11/packaging/test_builtin_contract.py" \
          --reference-pipeline "$REPRO_PAYLOAD/pipeline" \
          --output "$RUNNER_TEMP/r12-reports/ORIGINAL_INSTALLER_CONTRACT_TESTS.json"
        python3 -B "$REPRO_PAYLOAD/r12/tests/runhostcheck.py" \
          --payload "$REPRO_PAYLOAD" \
          --out "$RUNNER_TEMP/r12-reports/HOST_REGRESSION.json"
