    - name: R55H17-R1 require unchanged CASS config and 132 loaded RMNET CRC imports - NO FLASH
      shell: bash
      run: |
        set -euo pipefail
        report_dir="$RUNNER_TEMP/veux-r55h17-r1-audit"
        mkdir -p "$report_dir"
        cat > "$RUNNER_TEMP/veux-r55h17-cass-gate.py" <<'PY_R55H17_GATE'
        #!/usr/bin/env python3
        """VEUX R55H17 offline proof: CASS baseline, unchanged module ABI, no flash.
        Strict audit only; cannot attest to device boot or sign an image.
        """
        import argparse
        import base64
        import csv
        import hashlib
        import json
        from pathlib import Path
        import sys
        import zlib

        CONFIG_SHA256 = '405a4b3384212aa693ca2ce19f4c1ebef74f9cfc2568ce5da2107efe84fc0ff4'
        EXPECTED_RELEASE = '5.4.274-qgki-g82179e362f33'
        EXPECTED_DTB_SHA256 = '42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37'
        REFERENCE = json.loads(zlib.decompress(base64.b64decode('')).decode('utf-8'))
        FEATURES = {
            'CONFIG_SCHED_CASS': 'y', 'CONFIG_SCHED_WALT': 'n',
            'CONFIG_NR_CPUS': '8', 'CONFIG_MODULES': 'y',
            'CONFIG_MODVERSIONS': 'y', 'CONFIG_CFI_CLANG': 'y',
            'CONFIG_LTO_CLANG': 'y', 'CONFIG_LOCALVERSION': '"-qgki"',
            'CONFIG_KSU': 'y', 'CONFIG_KSU_SUSFS': 'y',
        }


        def sha256(path):
            h=hashlib.sha256()
            with Path(path).open('rb') as f:
                while True:
                    data=f.read(1048576)
                    if not data:break
                    h.update(data)
            return h.hexdigest()


        def parse_config(text):
            out={}
            for line in text.splitlines():
                if line.startswith('CONFIG_') and '=' in line:
                    key,val=line.split('=',1)
                elif line.startswith('# CONFIG_') and line.endswith(' is not set'):
                    key,val=line[2:].split(' is not set',1)[0],'n'
                else:continue
                if key in out:raise ValueError('DUPLICATE_CONFIG_KEY:'+key)
                out[key]=val
            return out


        def parse_symvers(text):
            out={}
            for line in text.splitlines():
                parts=line.split()
                if len(parts)<4:raise ValueError('MALFORMED_SYMVERS_LINE:'+line[:60])
                crc,name=parts[:2]
                if not crc.startswith('0x'):raise ValueError('SYMVERS_MISSING_CRC:'+name)
                crc=f'0x{int(crc,16):08x}'
                if name in out and out[name]!=crc:raise ValueError('SYMVERS_DUPLICATE_DIFFERENT_CRC:'+name)
                out[name]=crc
            return out


        def audit(config_file, symvers_file, release, dtb_sha256=None, require_config_sha=True):
            failures=[]
            conf_path=Path(config_file)
            cfg=parse_config(conf_path.read_text(encoding='utf-8'))
            sym=parse_symvers(Path(symvers_file).read_text(encoding='utf-8'))
            for key,expected in FEATURES.items():
                if cfg.get(key,'n')!=expected:
                    failures.append(f'CONFIG_MISMATCH:{key}:expected={expected}:got={cfg.get(key,"n")}')
            actual_cfg_sha=sha256(conf_path)
            if require_config_sha and actual_cfg_sha!=CONFIG_SHA256:
                failures.append('FULL_REFERENCE_CONFIG_SHA_MISMATCH')
            if release.strip()!=EXPECTED_RELEASE:
                failures.append('KERNEL_RELEASE_MISMATCH')
            if dtb_sha256 is not None and dtb_sha256.lower()!=EXPECTED_DTB_SHA256:
                failures.append('VEUX_DTB_SHA_MISMATCH')
            crc_rows=[]
            for mod,name,expected in REFERENCE:
                actual=sym.get(name)
                status='MATCH' if actual==expected else ('MISSING' if actual is None else 'CRC_MISMATCH')
                crc_rows.append({'module':mod,'symbol':name,'original_module_crc':expected,'candidate_crc':actual or '', 'status':status})
                if status!='MATCH':failures.append(f'RMNET_{status}:{mod}:{name}')
            report={
                'schema':1, 'stage':'R55H17_R1_CASS_1TO1_REFERENCE_GATE',
                'status':'CASS_REFERENCE_STATIC_PASS_NOFLASH' if not failures else 'BLOCKED_CASS_REFERENCE_OR_VENDOR_ABI',
                'kernel_release':release.strip(), 'config_sha256':actual_cfg_sha,
                'config_reference_sha256':CONFIG_SHA256,
                'dtb_sha256_reported':dtb_sha256,
                'critical_config':{k:cfg.get(k,'n') for k in FEATURES},
                'rmnet_imports_count':len(crc_rows),
                'rmnet_imports_matched':sum(x['status']=='MATCH' for x in crc_rows),
                'rmnet_module_layout_crc':sym.get('module_layout'),
                'failures':failures, 'flash_allowed':False,
                'device_test':False,
                'new_bakasu_35252_integrated':False,
                'new_nomount_v22_integrated':False,
                'walt_porting_in_this_stage':False,
            }
            return report,crc_rows


        def main():
            ap=argparse.ArgumentParser()
            ap.add_argument('--config',required=True)
            ap.add_argument('--symvers',required=True)
            ap.add_argument('--release-file',required=True)
            ap.add_argument('--dtb-sha256')
            ap.add_argument('--report-dir',required=True)
            ns=ap.parse_args()
            report,rows=audit(ns.config,ns.symvers,Path(ns.release_file).read_text(),ns.dtb_sha256)
            d=Path(ns.report_dir)
            d.mkdir(parents=True,exist_ok=True)
            (d/'R55H17_R1_CASS_RESULT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8')
            with (d/'R55H17_R1_RMNET_132_ABI.csv').open('w',newline='',encoding='utf-8') as f:
                w=csv.DictWriter(f,fieldnames=list(rows[0]),delimiter=';');w.writeheader();w.writerows(rows)
            print(f'R55H17_R1_CASS_GATE={report["status"]}; RMNET={report["rmnet_imports_matched"]}/{len(rows)}; NO_FLASH')
            if report['failures']:
                for msg in report['failures'][:24]:print('BLOCKER:',msg)
                raise SystemExit(26)

        if __name__=='__main__':main()
        PY_R55H17_GATE
        python3 -m py_compile "$RUNNER_TEMP/veux-r55h17-cass-gate.py"
        build="$RUNNER_TEMP/veux-r5s2-work/builds/diagnostics/5.4.274"
        test -s "$build/config-reports/actual-build.config"
        test -s "$build/build/Module.symvers"
        test -s "$build/build/include/config/kernel.release"
        test -s "$build/DTB-CHECK.json"
        test -s "$build/build-result.json"
        python3 -B - "$build/DTB-CHECK.json" "$build/build-result.json" <<'PY_DTB_GATE'
        import json,sys
        x=json.load(open(sys.argv[1]));b=json.load(open(sys.argv[2]))
        sha='42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37'
        assert x['match'] is True and x['actual_sha256']==sha and b['dtb_sha256']==sha
        assert b['compile'] is True and b['kernelrelease']=='5.4.274-qgki-g82179e362f33'
        PY_DTB_GATE
        python3 -B "$RUNNER_TEMP/veux-r55h17-cass-gate.py" \
          --config "$build/config-reports/actual-build.config" \
          --symvers "$build/build/Module.symvers" \
          --release-file "$build/build/include/config/kernel.release" \
          --dtb-sha256 42728a6f3d48ae35ac6be4b14ea51bc8a323e77baec2ee544827487378f99d37 \
          --report-dir "$report_dir"
        python3 -B - "$report_dir/R55H17_R1_CASS_RESULT.json" <<'PY_FINAL_R55H17'
        import json,sys
        x=json.load(open(sys.argv[1]));assert x['status']=='CASS_REFERENCE_STATIC_PASS_NOFLASH'
        assert x['rmnet_imports_matched']==132 and x['rmnet_imports_count']==132
        assert x['flash_allowed'] is False and x['device_test'] is False
        assert x['new_bakasu_35252_integrated'] is False and x['new_nomount_v22_integrated'] is False
        print('R55H17_R1_BASELINE_CASS_132_132_ABI_AND_STATIC_GATES=PASS; UPDATES=NEXT_STAGE; FLASH=NO')
        PY_FINAL_R55H17
    - name: R4 require genuine candidate build CASS config DTB version preinit and 132 RMNET proofs
