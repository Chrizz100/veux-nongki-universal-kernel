    - name: Strict actionlint YAML and ShellCheck gate
      shell: bash
      run: "set -euo pipefail\narchive=project/VEUX_R39_R2_MEMORY_ABI_MAIN.zip\ntest -s \"$archive\"\nprintf '%s  %s\\n' '745d80b8502a9beea513a2e7a58bb59272539b7508920d235ce2e79741bda528'\
        \ \"$archive\" | sha256sum -c -\nunzip -p \"$archive\" tools/actionlint > \"$R55_STAGE/actionlint\"\nchmod 0755 \"$R55_STAGE/actionlint\"\
        \n\"$R55_STAGE/actionlint\" -version | grep -Fx '1.7.12'\n\"$R55_STAGE/actionlint\" -color=false -shellcheck='' \"project/.github/workflows/VEUX_R55B1_SUSFS54_NAMEI_SOURCE_ONLY.yml\"\
        \ > \"$R55_STAGE/R55B1_ACTIONLINT.log\"\nprintf 'R55B1_ACTIONLINT=PASS\\n' >> \"$R55_STAGE/R55B1_ACTIONLINT.log\"\npython3 -B\
        \ - <<'PY_R55B1_YAML_AND_SHELL_AUDIT'\nimport hashlib,pathlib,subprocess,yaml\nclass Strict(yaml.SafeLoader): pass\ndef no_duplicates(loader,node):\n\
        \    out={}\n    for key,value in node.value:\n        k=loader.construct_object(key)\n        if k in out: raise RuntimeError('DUPLICATE_YAML_KEY:'+str(k))\n\
        \        out[k]=loader.construct_object(value)\n    return out\nStrict.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,no_duplicates)\n\
        path=pathlib.Path('project/.github/workflows/VEUX_R55B1_SUSFS54_NAMEI_SOURCE_ONLY.yml')\ny=yaml.load(path.read_text('utf-8'),Loader=Strict)\n\
        assert list(y['on'])==['workflow_dispatch']\nassert y['permissions']=={'contents':'read'}\nassert set(y['jobs'])=={'r55b_source'}\n\
        j=y['jobs']['r55b_source']\nassert j['runs-on']=='ubuntu-24.04'\nassert j['if'].startswith('$') and 'github.repository' in j['if']\
        \ and 'refs/heads/main' in j['if']\nsteps=j['steps']\nassert len(steps)==9\nfor index in (0,1):\n    assert steps[index]['uses']=='actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683'\n\
        \    assert steps[index]['with']['persist-credentials'] is False\nassert steps[1]['with']['repository']=='dereference23/kernel_xiaomi_sm6375'\n\
        assert steps[1]['with']['ref']=='b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'\nassert steps[8]['uses']=='actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02'\n\
        assert steps[8]['with']['if-no-files-found']=='error'\nlog=[]\nfor step in steps:\n    if 'run' not in step: continue\n    body=step['run']\n\
        \    # GitHub expressions must not expand inside Python heredocs.\n    if '$'+'{' in body: raise SystemExit('GITHUB_TEMPLATE_EXPRESSION_IN_RUN')\n\
        \    for cmd in (['bash','-n','-'],['shellcheck','--shell=bash','--severity=warning','-']):\n        done=subprocess.run(cmd,input=body,text=True,capture_output=True)\n\
        \        if done.returncode:\n            raise SystemExit('RUN_BLOCK_SHELL_ERROR:'+step['name']+'\\n'+done.stdout+done.stderr)\n\
        \    log.append(step['name']+' SHA256='+hashlib.sha256(body.encode()).hexdigest()+' BASH_SHELLCHECK_PASS')\npathlib.Path('/tmp/veux-r55b1/R55B1_SHELLCHECK.log').write_text('\\\
        n'.join(log)+'\\n')\nprint('R55B1_YAML_DUPLICATE_KEYS_ACTIONS_INPUTS_ALL_RUN_BLOCKS=PASS')\nPY_R55B1_YAML_AND_SHELL_AUDIT\n"
    - name: 19 positive and negative lifetime and RCU regression tests
      shell: bash
      run: "set -euo pipefail\npython3 -B - <<'PY_R55B1_AST'\nimport ast, pathlib\nfor path in (pathlib.Path('/tmp/veux-r55b1/scripts/r55b_stage.py'),\
        \ pathlib.Path('/tmp/veux-r55b1/tests/test_r55b_stage.py')):\n    ast.parse(path.read_text('utf-8'),filename=str(path))\nprint('R55B1_PYTHON_AST=PASS')\n\
        PY_R55B1_AST\npython3 -B -m unittest discover -v -s \"$R55_STAGE/tests\" -p 'test_*.py' 2>&1 | tee \"$R55_STAGE/R55B1_REGRESSION_TESTS.log\"\
        \ngrep -Eq '^Ran 19 tests in [0-9.]+s$' \"$R55_STAGE/R55B1_REGRESSION_TESTS.log\"\ngrep -Fx 'OK' \"$R55_STAGE/R55B1_REGRESSION_TESTS.log\"\
        \necho 'R55B1_19_POSITIVE_NEGATIVE_AND_SYNTHETIC_GIT_REPLAY=PASS'\n"
    - name: Replay real R55A and port pinned fs/namei.c on detached source
      shell: bash
      run: 'set -euo pipefail

        test "$(git -C kernel rev-parse HEAD)" = ''b2b7a3bbc36d120ee523ebc8d68e0f13a97df632''

        test "$(git -C kernel hash-object fs/namei.c)" = ''7c74159e29355e209b1cf4749aae23110f21a098''

        python3 -B "$R55_STAGE/scripts/r55b_stage.py"     --source kernel --base "$R55_STAGE/inputs/R55A_AUTHENTIC_14FILES.patch"     --out
        "$R55_STAGE/out" 2>&1 | tee "$R55_STAGE/R55B1_REAL_SOURCE.log"

        test "$(git -C kernel diff --name-only | wc -l)" -ge 12

        (cd "$R55_STAGE/out" && sha256sum -c SHA256SUMS.txt)

        '
    - name: Independent full 15-file patch replay on a clean kernel worktree
      shell: bash
      run: "set -euo pipefail\ngit -C kernel worktree add --detach \"$R55_STAGE/replay\" b2b7a3bbc36d120ee523ebc8d68e0f13a97df632\n\
        git -C \"$R55_STAGE/replay\" apply --check --whitespace=error \"$R55_STAGE/out/VEUX_R55B1_SUSFS54_15_FILES_NOFLASH.patch\"\n\
        git -C \"$R55_STAGE/replay\" apply --whitespace=error \"$R55_STAGE/out/VEUX_R55B1_SUSFS54_15_FILES_NOFLASH.patch\"\ngit -C \"\
        $R55_STAGE/replay\" diff --check\nfor file in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do\n    git -C \"\
        $R55_STAGE/replay\" add -N -- \"$file\"\ndone\ngit -C \"$R55_STAGE/replay\" diff --binary --no-ext-diff > \"$R55_STAGE/replay.patch\"\
        \ncmp \"$R55_STAGE/replay.patch\" \"$R55_STAGE/out/VEUX_R55B1_SUSFS54_15_FILES_NOFLASH.patch\"\npython3 -B - <<'PY_R55B1_REPLAY'\n\
        import hashlib,json,pathlib\np=pathlib.Path('/tmp/veux-r55b1')\nresult=json.loads((p/'out/R55B1_RESULT.json').read_text())\n\
        s=(p/'replay/fs/namei.c').read_bytes()\nh=hashlib.sha256(s).hexdigest()\nassert h==result['postimage_namei_sha256']\nassert\
        \ result['source_file_count']==15\nassert result['open_redirect_ported'] is False\nassert result['flash_allowed'] is False\n\
        assert result['compile_performed'] is False\nassert result['brene_changed'] is False\nprint('R55B1_FULL_15FILE_REPLAY_EXACT_BYTES=PASS')\n\
        PY_R55B1_REPLAY\n"
    - name: Final no-flash scope source and result integrity gates
      shell: bash
      run: "set -euo pipefail\npython3 -B - <<'PY_R55B1_FINAL'\nimport json,pathlib,re\np=pathlib.Path('/tmp/veux-r55b1')\nout=p/'out'\n\
        r=json.loads((out/'R55B1_RESULT.json').read_text())\nassert r['kernel_source_sha']=='b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'\n\
        assert r['r55a_base_sha256']=='79c4586ef440944006982adc3eff2215d4bf484ce39c5799ab18a8402c65b989'\nassert r['r55a_replayed']\
        \ and r['source_file_count']==15\nfor prop in ('compile_performed','device_tested','flash_allowed','brene_changed',\n      \
        \       'open_redirect_ported','full_susfs_port','user_repo_modified','boot_ready',\n             'r44_recomposed','baka_su_uapi6_integrated','nomount_v22_integrated'):\n\
        \    assert r[prop] is False,prop\nsource=(out/'VEUX_R55B1_SUSFS54_15_FILES_NOFLASH.patch').read_text()\nfiles=re.findall(r'^diff\
        \ --git a/(\\S+) b/\\1$',source,re.M)\nassert len(files)==15 and len(set(files))==15\nassert 'fs/namei.c' in files\nassert not\
        \ any('brene' in x.lower() or x.startswith('vendor/') or x.startswith('.github/') for x in files)\nassert not any(re.search(r'(^|/)boot(\\\
        .img)?$',x) for x in files)\nassert 'GIT binary patch' not in source\nfor name in ('R55B1_ACTIONLINT.log','R55B1_SHELLCHECK.log','R55B1_REGRESSION_TESTS.log','R55B1_REAL_SOURCE.log'):\n\
        \    f=p/name\n    assert f.is_file() and f.stat().st_size>0,name\n    (out/name).write_bytes(f.read_bytes())\nimport hashlib\n\
        checks=[]\nfor f in sorted(out.iterdir()):\n    if f.is_file() and f.name!='SHA256SUMS.txt':\n        checks.append(hashlib.sha256(f.read_bytes()).hexdigest()+'\
        \  '+f.name)\n(out/'SHA256SUMS.txt').write_text('\\n'.join(checks)+'\\n')\nprint('R55B1_FINAL_SCOPE_NO_BUILD_NOFLASH_INTEGRITY=PASS')\n\
        PY_R55B1_FINAL\n(cd \"$R55_STAGE/out\" && sha256sum -c SHA256SUMS.txt)\ngit -C kernel apply --reverse --check \"$R55_STAGE/out/VEUX_R55B1_SUSFS54_15_FILES_NOFLASH.patch\"\
        \ntest -z \"$(git -C project status --porcelain --untracked-files=all)\"\necho 'R55B1_PROJECT_SOURCE_UNCHANGED=PASS; FLASH_ALLOWED=NO'\n"
    - name: Upload source-only 15-file patch and audit logs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: VEUX-R55B1-NAMEI-SUSPATH-15FILES-NOFLASH-${{ github.run_id }}
