name: VEUX Build All V3 - Current Six Fleet Gate

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: veux-build-all-v3-current-six-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: Chrizz100/veux-nongki-universal-kernel

  GOLDEN_CONTRACT: common/contracts/GOLDEN_BASELINE.yml
  GOLDEN_CONTRACT_BLOB: af6ca3c5f9237849c42662933baa16e0f4d7d0cf
  GOLDEN_WORKFLOW: .github/workflows/veux-u7-n4-test-v7-5.4.274-resukisu-35170-hunter-fastfail-static-green.yml
  GOLDEN_WORKFLOW_BLOB: 0cfd79f84eb0644ef0a143fb1ee85403fe81c423

  RUN_274: '35964050678'
  HEAD_274: f317d11b2b6791f3eebd1526f7e26bdfdef1e992
  ART_274: '10793508842'
  ART_274_NAME: VEUX-U7-N4V6-TEST-35170-LatencyFastFail-35964050678
  ART_274_SIZE: '28259881'
  ART_274_SHA: 04459b331ef572445bbdb066de625d8b725400752afa6710b4b7b9cff21000db
  IMAGE_274_SHA: 6702b0edee8b08ed33620c58de43f7273d67d92fef25e0301d0b1b198777216e
  IMAGE_274_BYTES: '29846016'
  AK3_274_SHA: 39966457b06a8718c7430a020f728656b450a29206cbc9b75e8ff88a08ac43bf

  RUN_292_BUILD: '36102777445'
  HEAD_292_BUILD: 69c62045689c9fa095576072e3c5659f0a51329e
  ART_292_COMPILE: '10850137307'
  ART_292_COMPILE_NAME: VEUX-5.4.292-ReSukiSU35170-SUSFS2.3-NoMount2.0-Compile-36102777445
  ART_292_COMPILE_SIZE: '14422935'
  ART_292_COMPILE_SHA: 3d9aebdf9264646419e53c6a2c98d9aafad5bf7b98c4332c459e0360c28251a6
  ART_292_AK3: '10850381830'
  ART_292_AK3_NAME: VEUX-5.4.292-ReSukiSU35170-SUSFS2.3-NoMount2.0-AK3
  ART_292_AK3_SIZE: '16964940'
  ART_292_AK3_SHA: 8ebb4917490fdf33b95a8e67b397891006f63a17f696d7a1c4141afc49a83033
  AK3_292_FILE: VEUX-5.4.292-ReSukiSU35170-SUSFS2.3-NoMount2.0-AK3.zip
  AK3_292_SHA: 47b5ba475a1b10adab605d4c35aa557a0c9e16e1af06accffe09989f0e518ea9
  IMAGE_292_SHA: 2d29534978ad3aa973fcdf5fb144a14fd85864cb2703c5c36914610b7a0b72b4
  IMAGE_292_BYTES: '33927680'

  RUN_292_STATIC: '36107844969'
  HEAD_292_STATIC: 7f2b714f2a7bf9b7aadd0bf07da9812126f7e8a2
  ART_292_STATIC: '10851781903'
  ART_292_STATIC_NAME: VEUX-5.4.292-ReSukiSU35170-SUSFS2.3-NoMount2.0-STATIC-BOOT-36107844969
  ART_292_STATIC_SIZE: '137585292'
  ART_292_STATIC_SHA: 6df008ce8e09f733e4e16e598a453b2983334b76f9ad2d6d3038040413b467e6
  BOOT_292_SHA: 29b88cc58fcc6051258f13d1c5f59b7c0f09dbc16b48cca53e9dbedfa0c4d6ac

  O52_RUN: '35497490635'
  O52_HEAD: f569708ff1ad8c53aaf6cefd5a3ca763ceac37ff
  O52_ART: '10601347053'
  O52_ART_NAME: VEUX-U6-O52V1-ReSukiSU-35158-ALL-SIX-AK3-35497490635
  O52_ART_SHA: 0c1244aec5a60f42c232611df0e05d32b95898afdca50a9baea81dae0e72590b

  O53_RUN: '35499408928'
  O53_HEAD: 6cbdf81af8650cd400180a1eaddca9b9c6ea6093
  O53_ART: '10601802164'
  O53_ART_NAME: VEUX-U6-O53V1-ReSukiSU-35158-ALL-SIX-STATIC-BOOT-35499408928
  O53_ART_SHA: 7190afc612a1f74e9c503152ee84db6e9f16374a907ce90e0809d0ae821dd377

  RESUKISU_35170: 9be0f347f38e790c846915bd5f9c24b337f85c4e
  RESUKISU_35158: 6d18926ae6eeb571a04c1ce7552c324d606fa9d8
  SUSFS_COMMIT: 04a9d713106191ba98be680bd7ad9547ab1de964
  NOMOUNT_COMMIT: b8d268353b4e7ecc53c67d1816a626b7d6579201

  BASE_BOOT_URL: https://github.com/Chrizz100/veux-nongki-universal-kernel/releases/download/v1.0.0-beta1/VEUX-5.4.302-ReSukiSU-35157-UAPI4-SUSFS-2.3.0-BOOTTEST.img
  BASE_BOOT_SHA: b79d121003e9abb12962eaf44ff56aa4c66588d2245ed09d8325e3c39fe67e65
  BASE_KERNEL_SHA: 67807748edd57e9fa714d444a39fccf54d88b95c92d54de029b4c12bc868345a
  BASE_KERNEL_BYTES: '29911552'
  RAW_RAMDISK_SHA: 0bc8b54373b5501818e8b252517419786db207771047b6def7ec9bc89beb607a
  DECODED_RAMDISK_SHA: d3c0e26ce76ab272a9c7bfd53ad3b0f57754e8eb9a30085abfbacf180c2638e5
  BOOT_PARTITION_SIZE: '134217728'
  BOOT_PAGE_SIZE: '4096'
  HEADER_VERSION: '3'

  MAGISK_APK_URL: https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk
  MAGISK_APK_SHA: e0d32d2123532860f97123d927b1bb86c4e08e6fd8a48bfc6b5bee0afae9ebd5
  AVB_REPO: https://android.googlesource.com/platform/external/avb
  AVB_COMMIT: de53827b226bccef7407e4c253b0152e8d9f8e04

jobs:
  fleet-gate:
    name: Authenticate and recheck all six current lineages
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install controller dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl file git jq python3 python3-yaml unzip

      - name: Validate six current lineage profiles and frozen authorities
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GOLDEN_CONTRACT"
          test -f "$GOLDEN_WORKFLOW"
          test "$(git hash-object "$GOLDEN_CONTRACT")" = "$GOLDEN_CONTRACT_BLOB"
          test "$(git hash-object "$GOLDEN_WORKFLOW")" = "$GOLDEN_WORKFLOW_BLOB"

          python3 - <<'PY'
          from pathlib import Path
          import yaml

          expected = {
              "5.4.274": ("35170", "9be0f347f38e790c846915bd5f9c24b337f85c4e", True, "2.0.0"),
              "5.4.292": ("35170", "9be0f347f38e790c846915bd5f9c24b337f85c4e", True, "2.0.0"),
              "5.4.293": ("35158", "6d18926ae6eeb571a04c1ce7552c324d606fa9d8", False, "disabled"),
              "5.4.300": ("35158", "6d18926ae6eeb571a04c1ce7552c324d606fa9d8", False, "disabled"),
              "5.4.301": ("35158", "6d18926ae6eeb571a04c1ce7552c324d606fa9d8", False, "disabled"),
              "5.4.302": ("35158", "6d18926ae6eeb571a04c1ce7552c324d606fa9d8", False, "disabled"),
          }
          for kernel, (version, commit, nomount_enabled, nomount_version) in expected.items():
              p = yaml.safe_load(Path(f"lineages/{kernel}/build.yml").read_text(encoding="utf-8"))
              assert p["kernel"] == kernel
              assert p["enabled"] is True
              rs = p["features"]["resukisu"]
              sf = p["features"]["susfs"]
              nm = p["features"]["nomount"]
              assert str(rs["version"]) == version
              assert rs["commit"] == commit
              assert rs["uapi"] == 4
              assert sf["enabled"] is True
              assert str(sf["version"]) == "2.3.0"
              assert sf["commit"] == "04a9d713106191ba98be680bd7ad9547ab1de964"
              assert nm["enabled"] is nomount_enabled
              if nomount_enabled:
                  assert str(nm["version"]) == nomount_version
                  assert nm["commit"] == "b8d268353b4e7ecc53c67d1816a626b7d6579201"
              else:
                  assert str(nm["version"]) == nomount_version
                  assert nm["commit"] == ""
              assert p["validation"]["compile"] is True
          print("CURRENT_SIX_PROFILE_CONTRACT=PASS")
          PY

          python3 - "$GOLDEN_CONTRACT" <<'PY'
          from pathlib import Path
          import sys, yaml
          p = yaml.safe_load(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert p["id"] == "veux-u7-n4-v7-5.4.274-full-pass-2026-09-24"
          assert p["kernel"] == "5.4.274"
          assert p["workflow"]["run_id"] == 35964050678
          assert p["workflow"]["conclusion"] == "success"
          assert p["ci_evidence"]["compile_pass"] is True
          assert p["ci_evidence"]["package_pass"] is True
          assert p["ci_evidence"]["static_boot_path_pass"] is False
          assert p["device_validation"]["status"] == "FULL_PASS"
          assert p["device_validation"]["source"] == "manual-device-test-after-flash"
          print("GOLDEN_274_CONTRACT=PASS")
          PY

      - name: Authenticate exact source artifacts
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/fleet-v3"
          OUT="$GITHUB_WORKSPACE/fleet-v3-evidence"
          rm -rf "$ROOT" "$OUT"
          mkdir -p "$ROOT" "$OUT" "$OUT/rows"

          api_get() {
            local url="$1" output="$2"
            curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_READ_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url" -o "$output"
          }

          auth_artifact() {
            local label="$1" run="$2" head="$3" art="$4" name="$5" digest="$6" size="$7"
            local dir="$ROOT/$label"
            mkdir -p "$dir"
            api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run" "$dir/run.json"
            jq -e --arg head "$head" --argjson run "$run" \
              '.id == $run and .head_sha == $head and .status == "completed" and .conclusion == "success"' \
              "$dir/run.json" >/dev/null
            api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$art" "$dir/artifact.json"
            if [ -n "$size" ]; then
              jq -e --arg name "$name" --arg digest "sha256:$digest" \
                --argjson art "$art" --argjson run "$run" --argjson size "$size" \
                '.id == $art and .name == $name and .digest == $digest and .expired == false and .size_in_bytes == $size and .workflow_run.id == $run' \
                "$dir/artifact.json" >/dev/null
            else
              jq -e --arg name "$name" --arg digest "sha256:$digest" \
                --argjson art "$art" --argjson run "$run" \
                '.id == $art and .name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run' \
                "$dir/artifact.json" >/dev/null
            fi
            api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$art/zip" "$dir/outer.zip"
            test "$(sha256sum "$dir/outer.zip" | awk '{print $1}')" = "$digest"
            unzip -tq "$dir/outer.zip"
            unzip -q "$dir/outer.zip" -d "$dir/data"
            if [ -f "$dir/data/SHA256SUMS.txt" ]; then
              (cd "$dir/data" && sha256sum -c SHA256SUMS.txt) > "$OUT/${label}-sha256.txt"
            elif [ -f "$dir/data/u7-n4-dist/SHA256SUMS.txt" ]; then
              (cd "$dir/data/u7-n4-dist" && sha256sum -c SHA256SUMS.txt) > "$OUT/${label}-sha256.txt"
            fi
            echo "ARTIFACT_AUTH_${label}=PASS"
          }

          auth_artifact golden274 "$RUN_274" "$HEAD_274" "$ART_274" "$ART_274_NAME" "$ART_274_SHA" "$ART_274_SIZE"
          auth_artifact compile292 "$RUN_292_BUILD" "$HEAD_292_BUILD" "$ART_292_COMPILE" "$ART_292_COMPILE_NAME" "$ART_292_COMPILE_SHA" "$ART_292_COMPILE_SIZE"
          auth_artifact ak3292 "$RUN_292_BUILD" "$HEAD_292_BUILD" "$ART_292_AK3" "$ART_292_AK3_NAME" "$ART_292_AK3_SHA" "$ART_292_AK3_SIZE"
          auth_artifact static292 "$RUN_292_STATIC" "$HEAD_292_STATIC" "$ART_292_STATIC" "$ART_292_STATIC_NAME" "$ART_292_STATIC_SHA" "$ART_292_STATIC_SIZE"
          auth_artifact o52 "$O52_RUN" "$O52_HEAD" "$O52_ART" "$O52_ART_NAME" "$O52_ART_SHA" ""
          auth_artifact o53 "$O53_RUN" "$O53_HEAD" "$O53_ART" "$O53_ART_NAME" "$O53_ART_SHA" ""

          echo "FLEET_ARTIFACT_AUTH=PASS"

      - name: Verify current 5.4.274 Golden and 5.4.292 pilot
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/fleet-v3"
          OUT="$GITHUB_WORKSPACE/fleet-v3-evidence"

          g="$ROOT/golden274/data/u7-n4-dist"
          test -s "$g/Image"
          test "$(stat -c '%s' "$g/Image")" = "$IMAGE_274_BYTES"
          test "$(sha256sum "$g/Image" | awk '{print $1}')" = "$IMAGE_274_SHA"
          test -s "$g/VEUX-5.4.274-U7-N4-TEST-ReSukiSU-35170-SUSFS2.3-NoMount2.0.0-LatencyFastFail-AK3.zip"
          test "$(sha256sum "$g/VEUX-5.4.274-U7-N4-TEST-ReSukiSU-35170-SUSFS2.3-NoMount2.0.0-LatencyFastFail-AK3.zip" | awk '{print $1}')" = "$AK3_274_SHA"
          for token in \
            'KERNEL=5.4.274' \
            'RESUKISU_VERSION=35170' \
            "RESUKISU_COMMIT=$RESUKISU_35170" \
            'SUSFS_VERSION=v2.3.0' \
            "SUSFS_COMMIT=$SUSFS_COMMIT" \
            "NOMOUNT_COMMIT=$NOMOUNT_COMMIT" \
            'COMPILE_PASS=YES' \
            'PACKAGE_PASS=YES' \
            'STATIC_BOOT_PATH_PASS=NO'
          do
            grep -Fxq "$token" "$g/FINAL-RESULT.txt"
          done
          cat > "$OUT/rows/5.4.274.txt" <<'EOF'
          KERNEL=5.4.274
          RESUKISU=35170
          SUSFS=2.3.0
          NOMOUNT=2.0.0
          COMPILE_PASS=YES
          PACKAGE_PASS=YES
          STATIC_BOOT_PATH_PASS=NO_IN_GOLDEN_CI
          DEVICE_PASS=YES_EXTERNAL_FULL_PASS
          BOOT_ACCEPTANCE=PASS_FROM_REAL_DEVICE
          FLEET_ROW_PASS=YES
          EOF

          c="$ROOT/compile292/data"
          test -s "$c/Image"
          test "$(stat -c '%s' "$c/Image")" = "$IMAGE_292_BYTES"
          test "$(sha256sum "$c/Image" | awk '{print $1}')" = "$IMAGE_292_SHA"
          for token in \
            'KERNEL=5.4.292' \
            'RESUKISU_VERSION=35170' \
            "RESUKISU_COMMIT=$RESUKISU_35170" \
            'SUSFS_VERSION=v2.3.0' \
            "SUSFS_COMMIT=$SUSFS_COMMIT" \
            'NOMOUNT_VERSION=2.0.0' \
            "NOMOUNT_COMMIT=$NOMOUNT_COMMIT" \
            'COMPILE_PASS=YES' \
            'PACKAGE_PASS=YES'
          do
            grep -Fxq "$token" "$c/FINAL-RESULT.txt"
          done

          a="$ROOT/ak3292/data/$AK3_292_FILE"
          test -s "$a"
          test "$(sha256sum "$a" | awk '{print $1}')" = "$AK3_292_SHA"
          unzip -tq "$a"
          unzip -p "$a" Image > "$ROOT/ak3292/Image"
          cmp -s "$c/Image" "$ROOT/ak3292/Image"

          s="$ROOT/static292/data"
          test -s "$s/boot/VEUX-5.4.292-ReSukiSU35170-SUSFS2.3-NoMount2.0-STATIC-BOOT.img"
          test "$(sha256sum "$s/boot/VEUX-5.4.292-ReSukiSU35170-SUSFS2.3-NoMount2.0-STATIC-BOOT.img" | awk '{print $1}')" = "$BOOT_292_SHA"
          grep -Fxq 'VEUX_292_STATIC_BOOT_AUDIT=PASS' "$s/FINAL-RESULT.txt"
          grep -Fxq 'STATIC_BOOT_PATH_PASS=YES' "$s/FINAL-RESULT.txt"
          grep -Fxq 'DEVICE_PASS=NO' "$s/FINAL-RESULT.txt"
          cat > "$OUT/rows/5.4.292.txt" <<'EOF'
          KERNEL=5.4.292
          RESUKISU=35170
          SUSFS=2.3.0
          NOMOUNT=2.0.0
          COMPILE_PASS=YES
          PACKAGE_PASS=YES
          STATIC_BOOT_PATH_PASS=YES
          DEVICE_PASS=NO
          BOOT_ACCEPTANCE=PASS_FROM_FAIL_CLOSED_STATIC_BOOT
          FLEET_ROW_PASS=YES
          EOF

      - name: Install fail-closed boot verification tools
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/fleet-v3"
          OUT="$GITHUB_WORKSPACE/fleet-v3-evidence"
          apk="$ROOT/Magisk-v30.7.apk"
          curl --fail --location --retry 3 "$MAGISK_APK_URL" -o "$apk"
          test "$(sha256sum "$apk" | awk '{print $1}')" = "$MAGISK_APK_SHA"
          mapfile -t candidates < <(zipinfo -1 "$apk" | grep -E '^lib/x86_64/(lib)?magiskboot(\.so)?$')
          test "${#candidates[@]}" -eq 1
          unzip -p "$apk" "${candidates[0]}" > "$ROOT/magiskboot"
          chmod 0755 "$ROOT/magiskboot"
          file "$ROOT/magiskboot" > "$OUT/magiskboot-file.txt"
          grep -Eq 'ELF 64-bit.*x86-64|ELF 64-bit.*x86_64' "$OUT/magiskboot-file.txt"

          avb="$ROOT/avb"
          git init -q "$avb"
          git -C "$avb" remote add origin "$AVB_REPO"
          git -C "$avb" fetch -q --depth=1 origin "$AVB_COMMIT"
          git -C "$avb" checkout -q --detach FETCH_HEAD
          test "$(git -C "$avb" rev-parse HEAD)" = "$AVB_COMMIT"
          test -s "$avb/avbtool.py"
          python3 "$avb/avbtool.py" version > "$OUT/avbtool-version.txt"

      - name: Authenticate shared Android 13 boot-v3 reference
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/fleet-v3"
          OUT="$GITHUB_WORKSPACE/fleet-v3-evidence"
          base="$ROOT/base.img"
          mb="$ROOT/magiskboot"
          avb="$ROOT/avb/avbtool.py"

          curl --fail --location --retry 3 "$BASE_BOOT_URL" -o "$base"
          test "$(stat -c '%s' "$base")" = "$BOOT_PARTITION_SIZE"
          test "$(sha256sum "$base" | awk '{print $1}')" = "$BASE_BOOT_SHA"

          python3 - "$base" "$BASE_KERNEL_BYTES" "$HEADER_VERSION" "$BOOT_PAGE_SIZE" <<'PY'
          import struct, sys
          path, expected_kernel, expected_ver, page = sys.argv[1], int(sys.argv[2]), int(sys.argv[3]), int(sys.argv[4])
          b = open(path, 'rb').read(page)
          assert len(b) == page and b[:8] == b'ANDROID!'
          ks = struct.unpack_from('<I', b, 8)[0]
          rs = struct.unpack_from('<I', b, 12)[0]
          hs = struct.unpack_from('<I', b, 20)[0]
          hv = struct.unpack_from('<I', b, 40)[0]
          assert ks == expected_kernel and rs > 0 and hs > 0 and hv == expected_ver
          print(f"BASE_RAMDISK_BYTES={rs}")
          PY
          base_ramdisk_bytes="$(python3 - "$base" <<'PY'
          import struct, sys
          b=open(sys.argv[1],'rb').read(64)
          print(struct.unpack_from('<I', b, 12)[0])
          PY
          )"
          test -n "$base_ramdisk_bytes"
          echo "BASE_RAMDISK_BYTES=$base_ramdisk_bytes" >> "$GITHUB_ENV"

          mkdir -p "$ROOT/base-raw" "$ROOT/base-decoded"
          (cd "$ROOT/base-raw" && "$mb" unpack -n -h "$base" >/dev/null 2>&1)
          (cd "$ROOT/base-decoded" && "$mb" unpack -h "$base" >/dev/null 2>&1)
          test "$(sha256sum "$ROOT/base-raw/kernel" | awk '{print $1}')" = "$BASE_KERNEL_SHA"
          test "$(sha256sum "$ROOT/base-raw/ramdisk.cpio" | awk '{print $1}')" = "$RAW_RAMDISK_SHA"
          test "$(sha256sum "$ROOT/base-decoded/ramdisk.cpio" | awk '{print $1}')" = "$DECODED_RAMDISK_SHA"

          python3 "$avb" info_image --image "$base" > "$OUT/base-avb.txt"
          grep -Eq '^Algorithm:[[:space:]]+NONE$' "$OUT/base-avb.txt"
          grep -Eq '^[[:space:]]*Partition Name:[[:space:]]+boot$' "$OUT/base-avb.txt"
          grep -Eq '^[[:space:]]*Hash Algorithm:[[:space:]]+sha256$' "$OUT/base-avb.txt"
          salt="$(sed -n 's/^[[:space:]]*Salt:[[:space:]]*//p' "$OUT/base-avb.txt" | head -1 | tr 'A-F' 'a-f')"
          test -n "$salt"
          echo "BASE_AVB_SALT=$salt" >> "$GITHUB_ENV"

          python3 - "$OUT/base-avb.txt" "$OUT/base-avb-props.txt" <<'PY'
          import re, sys
          src, dst = sys.argv[1:3]
          props=[]
          for line in open(src, encoding='utf-8'):
              m=re.match(r"\s*Prop:\s+(.+?)\s+->\s+'(.*)'\s*$", line.rstrip('\n'))
              if m: props.append((m.group(1),m.group(2)))
          assert props
          with open(dst,'w',encoding='utf-8') as f:
              for k,v in sorted(props): f.write(f"{k}\t{v}\n")
          PY
          echo 'BOOT_V3_REFERENCE_AUTH=PASS'

      - name: Fail-closed recheck 5.4.293 5.4.300 5.4.301 5.4.302
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/fleet-v3"
          OUT="$GITHUB_WORKSPACE/fleet-v3-evidence"
          mb="$ROOT/magiskboot"
          avb="$ROOT/avb/avbtool.py"
          base="$ROOT/base.img"

          cat > "$ROOT/header-check.py" <<'PY'
          import struct, sys
          base_path, final_path = sys.argv[1], sys.argv[2]
          expected_kernel, expected_ramdisk, page, base_kernel = map(int, sys.argv[3:7])
          base = bytearray(open(base_path,'rb').read(page))
          final = bytearray(open(final_path,'rb').read(page))
          assert len(base)==page and len(final)==page
          assert base[:8]==b'ANDROID!' and final[:8]==b'ANDROID!'
          ks=struct.unpack_from('<I',final,8)[0]
          rs=struct.unpack_from('<I',final,12)[0]
          hs=struct.unpack_from('<I',final,20)[0]
          hv=struct.unpack_from('<I',final,40)[0]
          assert ks==expected_kernel and rs==expected_ramdisk and hs>0 and hv==3
          bm=bytearray(base); fm=bytearray(final)
          bm[8:12]=b'\0'*4; fm[8:12]=b'\0'*4
          assert bm==fm
          if expected_kernel==base_kernel:
              assert base==final
          print('BOOT_HEADER_V3=PASS')
          print('BOOT_HEADER_MUTATION_SCOPE=PASS')
          PY
          python3 -m py_compile "$ROOT/header-check.py"

          verify_one() {
            local kernel="$1" expected_release="$2" image_sha="$3" image_bytes="$4" ak3_sha="$5" boot_sha="$6"
            local w="$ROOT/check-$kernel"
            local audit="$OUT/$kernel"
            local package="$ROOT/o52/data/packages/$kernel/VEUX-${kernel}-ReSukiSU-35158-UAPI4-SUSFS-2.3.0-AK3.zip"
            local boot="$ROOT/o53/data/boots/$kernel/VEUX-${kernel}-ReSukiSU-35158-UAPI4-SUSFS-2.3.0-BOOTTEST.img"
            rm -rf "$w" "$audit"
            mkdir -p "$w/verify" "$w/raw" "$w/decoded" "$audit"

            test -s "$package" && test -s "$boot"
            test "$(sha256sum "$package" | awk '{print $1}')" = "$ak3_sha"
            test "$(sha256sum "$boot" | awk '{print $1}')" = "$boot_sha"
            test "$(stat -c '%s' "$boot")" = "$BOOT_PARTITION_SIZE"
            unzip -tq "$package"
            unzip -p "$package" Image > "$w/ak3-Image"
            test "$(stat -c '%s' "$w/ak3-Image")" = "$image_bytes"
            test "$(sha256sum "$w/ak3-Image" | awk '{print $1}')" = "$image_sha"
            strings -a "$w/ak3-Image" > "$audit/image-strings.txt"
            grep -Fq "Linux version ${expected_release}" "$audit/image-strings.txt"
            grep -Fq '6d18926a' "$audit/image-strings.txt"
            grep -Fq 'susfs:' "$audit/image-strings.txt"
            ! grep -Fq 'NoMount:' "$audit/image-strings.txt"

            ln -s "$boot" "$w/verify/boot.img"
            python3 "$avb" info_image --image "$w/verify/boot.img" > "$audit/avb-info.txt"
            (
              set -euo pipefail
              python3 "$avb" verify_image --image "$w/verify/boot.img" > "$audit/avb-verify.txt" 2>&1
            )
            ! grep -Fq 'Traceback' "$audit/avb-verify.txt"
            grep -Fq 'Successfully verified footer' "$audit/avb-verify.txt"
            grep -Eq '^Algorithm:[[:space:]]+NONE$' "$audit/avb-info.txt"
            grep -Eq '^[[:space:]]*Partition Name:[[:space:]]+boot$' "$audit/avb-info.txt"
            grep -Eq '^[[:space:]]*Hash Algorithm:[[:space:]]+sha256$' "$audit/avb-info.txt"
            salt="$(sed -n 's/^[[:space:]]*Salt:[[:space:]]*//p' "$audit/avb-info.txt" | head -1 | tr 'A-F' 'a-f')"
            test "$salt" = "$BASE_AVB_SALT"

            python3 - "$audit/avb-info.txt" "$audit/avb-props.txt" <<'PY'
          import re, sys
          src, dst = sys.argv[1:3]
          props=[]
          for line in open(src, encoding='utf-8'):
              m=re.match(r"\s*Prop:\s+(.+?)\s+->\s+'(.*)'\s*$", line.rstrip('\n'))
              if m: props.append((m.group(1),m.group(2)))
          assert props
          with open(dst,'w',encoding='utf-8') as f:
              for k,v in sorted(props): f.write(f"{k}\t{v}\n")
          PY
            cmp -s "$OUT/base-avb-props.txt" "$audit/avb-props.txt"

            (cd "$w/raw" && "$mb" unpack -n -h "$boot" >/dev/null 2>&1)
            (cd "$w/decoded" && "$mb" unpack -h "$boot" >/dev/null 2>&1)
            test "$(sha256sum "$w/raw/kernel" | awk '{print $1}')" = "$image_sha"
            test "$(sha256sum "$w/decoded/kernel" | awk '{print $1}')" = "$image_sha"
            cmp -s "$w/ak3-Image" "$w/raw/kernel"
            test "$(sha256sum "$w/raw/ramdisk.cpio" | awk '{print $1}')" = "$RAW_RAMDISK_SHA"
            test "$(sha256sum "$w/decoded/ramdisk.cpio" | awk '{print $1}')" = "$DECODED_RAMDISK_SHA"
            cmp -s "$ROOT/base-raw/ramdisk.cpio" "$w/raw/ramdisk.cpio"
            cmp -s "$ROOT/base-decoded/ramdisk.cpio" "$w/decoded/ramdisk.cpio"

            python3 "$ROOT/header-check.py" "$base" "$boot" "$image_bytes" \
              "$BASE_RAMDISK_BYTES" "$BOOT_PAGE_SIZE" "$BASE_KERNEL_BYTES" \
              > "$audit/header-contract.txt"

            cat > "$OUT/rows/$kernel.txt" <<EOF
          KERNEL=$kernel
          RESUKISU=35158
          SUSFS=2.3.0
          NOMOUNT=DISABLED
          COMPILE_PASS=YES_FROM_O51
          PACKAGE_PASS=YES_FROM_O52
          STATIC_BOOT_PATH_PASS=YES_RECHECKED_NOW
          DEVICE_PASS=NO
          BOOT_ACCEPTANCE=PASS_FROM_FAIL_CLOSED_STATIC_RECHECK
          FLEET_ROW_PASS=YES
          EOF
            echo "FLEET_ROW_${kernel}=PASS"
          }

          verify_one 5.4.293 5.4.293-veid-veux 7d3b0f6200a1cecb0d6675318fc35f21e8bc8657b67437c1382a3ef4d735919d 33925632 404f55333f2397398967414bc354d9dd439f5c8ecc61ded601f7d804ac74d777 dbb5bc939df3e18d60e88296b0c5c98c354fda1f90887def62711c0144068842
          verify_one 5.4.300 5.4.300-qgki-g82179e362f33 09bf533d83c3c140b8c7837883ced6291615e5bfc42efa51c4dc298a982394e0 29911552 8340c3798b613d64fddb2c7e601bab843438932c305e05272a5b252d163f9069 66859a66ef1e9d5764080dae7e24749bf544c5c61279983b61db2771ae0bb027
          verify_one 5.4.301 5.4.301-qgki-g82179e362f33 4de18f2ef3ca32a59e06380309bbef8f061b7729543dac53304c4f985ff5e394 29911552 a55369a58050252fa43990e5e9202c228d066f4e109dae4a7d005c2696667366 97dc2e59a0d09e6c3a6a4adccb6df05788984680398adf6db94f906a7d992d30
          verify_one 5.4.302 5.4.302-qgki-g82179e362f33 faf2bac3e43e1e05f4703cef69158f9c18961a572d8e8789999bd0e0cb073761 29911552 a0b3edc93d7c5d04f5a08a9d889eda92b1c01a68651b413a5158b84d0e48312d dd34cfea469af01abf05d1253b00dacece085562b13f8cd005d38df1106a1a19

      - name: Final all-six fleet gate
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/fleet-v3-evidence"
          matrix="$OUT/FLEET-MATRIX.txt"
          : > "$matrix"
          for kernel in 5.4.274 5.4.292 5.4.293 5.4.300 5.4.301 5.4.302; do
            row="$OUT/rows/$kernel.txt"
            test -s "$row"
            grep -Fxq 'FLEET_ROW_PASS=YES' "$row"
            tr '\n' ' ' < "$row" | sed 's/[[:space:]]*$//' >> "$matrix"
            echo >> "$matrix"
          done

          cat > "$OUT/FINAL-RESULT.txt" <<'EOF'
          VEUX_BUILD_ALL_V3_CURRENT_SIX_FLEET_GATE=PASS
          LINEAGE_COUNT=6
          ALL_SIX_PROFILE_CONTRACT=PASS
          ALL_SIX_COMPILE_EVIDENCE=PASS
          ALL_SIX_PACKAGE_EVIDENCE=PASS
          ALL_SIX_BOOT_ACCEPTANCE=PASS
          CURRENT_PIN_POLICY=PRESERVED
          AUTO_PROMOTE_35158_TO_35170=NO
          DEVICE_PASS_274=YES_EXTERNAL_FULL_PASS
          DEVICE_PASS_OTHER_FIVE=NO
          EOF
          cat "$matrix"
          cat "$OUT/FINAL-RESULT.txt"

      - name: Upload compact fleet evidence
        uses: actions/upload-artifact@v7
        with:
          name: VEUX-BUILD-ALL-V3-CURRENT-SIX-${{ github.run_id }}
          path: fleet-v3-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Final GREEN gate
        shell: bash
        run: |
          set -euo pipefail
          final="$GITHUB_WORKSPACE/fleet-v3-evidence/FINAL-RESULT.txt"
          matrix="$GITHUB_WORKSPACE/fleet-v3-evidence/FLEET-MATRIX.txt"
          test -s "$final" && test -s "$matrix"
          grep -Fxq 'VEUX_BUILD_ALL_V3_CURRENT_SIX_FLEET_GATE=PASS' "$final"
          grep -Fxq 'LINEAGE_COUNT=6' "$final"
          test "$(grep -c 'FLEET_ROW_PASS=YES' "$matrix")" = 6
          echo 'VEUX_BUILD_ALL_V3_CURRENT_SIX_GREEN_GATE=PASS'
