          ('source-replay',root/'veux-r56-real-source-proof'),
          ('R55H17-evidence',root/'veux-r55h17-r4/evidence'),
          ('R55H17-rmnet',root/'veux-r55h17-r1-audit'),
        ]
        dirs += [('R54-source', p) for p in sorted(root.glob('veux-r54-no-flash-*')) if p.is_dir() and not p.is_symlink()]
        manifest=[]; files_seen=set(); total=0
        for label,directory in dirs:
            if not directory.is_dir() or directory.is_symlink():continue
            for p in sorted(directory.iterdir()):
                if p.suffix.lower() not in accepted or not p.is_file() or p.is_symlink():continue
                if p.name in files_seen and label=='steps':raise ValueError('STEP_LOG_COLLISION')
                real=p.resolve(strict=True)
                if not real.is_relative_to(root):raise ValueError('LOG_SOURCE_ESCAPES_RUNNER_TEMP')
                size=p.stat().st_size
                if len(manifest)>=500 or total>=90_000_000:
                    break
                target=out/label/p.name
                target.parent.mkdir(parents=True,exist_ok=True)
                # Truncate only huge text logs, retaining last 16 MiB.
                with p.open('rb') as f:
                    if size>16_000_000:f.seek(-16_000_000,2)
                    data=f.read(16_000_000)
                target.write_bytes(data)
                total+=len(data)
                manifest.append({'path':str(target.relative_to(out)),'source':label,
                                 'original_bytes':size,'stored_bytes':len(data),
                                 'truncated':size>len(data),
                                 'sha256':hashlib.sha256(data).hexdigest()})
                if label=='steps':files_seen.add(p.name)
        # Status file is always present, even if no compiler ever started.
        native=root/'veux-r58/R59_FULL_INTEGRATION_EVIDENCE.json'
        compiled=False
        if native.is_file() and not native.is_symlink():
            try:
                report=json.loads(native.read_text())
                compiled=(report.get('schema')=='VEUX_R59_FULL_COMPONENTS_BUILD_EVIDENCE_V1'
                          and report.get('source_and_compiler_pass') is True
                          and report.get('rmnet_132_all_match') is True
                          and report.get('flash_allowed') is False)
            except (OSError,ValueError):pass
        summary={'schema':'VEUX_R60_LOG_ONLY_VERDICT_V1',
                 'run_id':os.environ.get('GITHUB_RUN_ID'),
                 'commit':os.environ.get('GITHUB_SHA'),
                 'baseline_step':os.environ.get('R60_BASELINE_OUTCOME'),
                 'updated_compile_step':os.environ.get('R60_UPDATED_OUTCOME'),
                 'oem_review_step':os.environ.get('R60_OEM_REVIEW_OUTCOME'),
                 'repository_check':os.environ.get('R60_REPO_CHECK_OUTCOME'),
                 'native54_compile_evidence_present':compiled,
                 'oem_release_approved':False,'kernel_artifact_published':False,
                 'flash_allowed':False,'artifact_kind':'LOGS_ONLY',
                 'collected_files':len(manifest)}
        (out/'01_FINAL_STATUS.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
        (out/'02_LOG_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
        print('R60_LOG_BUNDLE_FILES=',len(manifest),'BYTES=',total,
              'NATIVE54_COMPILED=',compiled,'OEM_APPROVED=NO','FLASH=NO')
        PY_R60_BUNDLE
        collector_exit=$?
        set -e
        if [[ "$collector_exit" -ne 0 ]]; then
          printf 'R60_LOG_COLLECTOR_FAILED_EXIT=%s\n' "$collector_exit" > "$dest/99_LOG_COLLECTOR_FAILED.txt"
          exit "$collector_exit"
        fi
        test -s "$dest/00_RUN_STATUS.txt"
    - name: Always upload R60 diagnostic logs only - no binaries or kernel package
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: VEUX-R60-LOGS-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/veux-r60-logpack/
        retention-days: 21
        if-no-files-found: error
        compression-level: 8
        include-hidden-files: false
