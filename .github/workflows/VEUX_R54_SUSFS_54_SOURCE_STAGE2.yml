        \ -c -\necho 'R54_AUTHENTIC_R53_ORIGINAL_SOURCE_ARTIFACT=PASS'\n"
    - name: Run real-artifact and adversarial 5.4 source regressions
      shell: bash
      run: 'set -euo pipefail

        export PYTHONPATH="$R54_STAGE/scripts" R54_REAL_R53="$R54_STAGE/inputs/R53_ORIGINAL.zip"

        python3 -B -W error::ResourceWarning -m unittest discover -s "$R54_STAGE/tests" -p ''test_r54_stage2.py'' -v 2>&1
        | tee "$R54_STAGE/out/R54_TESTS.log"

        grep -F ''Ran 21 tests'' "$R54_STAGE/out/R54_TESTS.log"

        grep -Fx ''OK'' "$R54_STAGE/out/R54_TESTS.log"

        echo ''R54_21_SOURCE_AND_ARTIFACT_REGRESSIONS=PASS''

        '
    - name: Replay R53 source patch and add exactly 3 pinned SUSFS 5.4 source files
      shell: bash
      run: "set -euo pipefail\npython3 -B \"$R54_STAGE/scripts/r54_stage2.py\" \\\n  --source kernel --midori midori \\\n\
        \  --r53 \"$R54_STAGE/inputs/R53_ORIGINAL.zip\" \\\n  --out \"$R54_STAGE/out\" | tee \"$R54_STAGE/out/R54_STAGE.log\"\
        \ngrep -F 'R54_SUSFS54_STAGE2_REAL_12_FILE_PATCH=PASS;' \"$R54_STAGE/out/R54_STAGE.log\"\ncat \"$R54_STAGE/out/START_HIER_NOFLASH.txt\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Final scope and no-flash checks with SHA256
      shell: bash
      run: "set -euo pipefail\npython3 -B - \"$R54_STAGE/out\" <<'PY_R54_FINAL'\nimport hashlib,json,pathlib,re,sys\nout=pathlib.Path(sys.argv[1]);r=json.loads((out/'R54_RESULT.json').read_text(encoding='utf8'))\n\
        expected={'R54_ACTIONLINT.log','R54_SHELLCHECK.log','R54_TESTS.log','R54_STAGE.log',\n          'R54_RESULT.json','START_HIER_NOFLASH.txt','VEUX_R54_SUSFS54_STAGE2_12_FILES_NOFLASH.patch'}\n\
        actual={x.name for x in out.iterdir() if x.is_file()}\nif actual!=expected:raise SystemExit('R54_WRONG_OUTPUT_SET:'+str(actual^expected))\n\
        if not (r.get('schema')=='VEUX_R54_SUSFS54_STAGE2_SOURCE_COMPOSITION_V1' and\n        r.get('files_changed')==12 and\
        \ r.get('upstream_whitespace_corrections_exact')==5 and\n        r.get('r53_run')==40224649799 and r.get('r53_nine_file_postimages_verified')\
        \ is True and\n        len(r.get('new_files',[]))==3 and r.get('source_commit')=='b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'):\n\
        \    raise SystemExit('R54_PINNED_12_FILE_SOURCE_PROOF_FAILED')\nfor key in ('source_changes_committed','r44_walt_recomposed','susfs_complete','baka_su_uapi6_integrated',\n\
        \            'nomount_v22_integrated','build_performed','device_tested','boot_ready','flash_allowed'):\n    if r.get(key)\
        \ is not False:raise SystemExit('R54_UNSAFE_SUCCESS_FLAG:'+key)\npatch=(out/'VEUX_R54_SUSFS54_STAGE2_12_FILES_NOFLASH.patch').read_bytes()\n\
        if hashlib.sha256(patch).hexdigest()!=r.get('patch_sha256'):\n    raise SystemExit('R54_PATCH_HASH_MISMATCH')\nfor\
        \ filename in out.iterdir():\n    if filename.is_file() and (filename.suffix in ('.ko','.bin','.elf','.dtb','.dtbo','.img')\
        \ or filename.name in ('Image','vmlinux')):\n        raise SystemExit('R54_FLASHABLE_OUTPUT_FORBIDDEN')\nchecks=[]\n\
        for item in sorted(out.iterdir()):\n    if item.is_file():checks.append(hashlib.sha256(item.read_bytes()).hexdigest()+'\
        \  '+item.name)\n(out/'SHA256SUMS.txt').write_text('\\n'.join(checks)+'\\n',encoding='utf8')\nprint('R54_COMPLETE_12_FILE_SOURCE_PATCH_AND_NO_FLASH_GATES=PASS')\n\
        PY_R54_FINAL\n(cd \"$R54_STAGE/out\" && sha256sum -c SHA256SUMS.txt)\nstatus=$(git -C project status --porcelain --untracked-files=all)\n\
        test -z \"$status\"\necho 'R54_REPOSITORY_UNCHANGED=YES; NO_KERNEL_BUILD=YES; NO_FLASH=YES'\n"
    - name: Upload R54 source patch ONLY
