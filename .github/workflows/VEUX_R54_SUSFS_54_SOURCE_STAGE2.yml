    - name: Strict actionlint 1.7.12 and independent ShellCheck
      shell: bash
      run: "set -euo pipefail\nzipfile=project/VEUX_R39_R2_MEMORY_ABI_MAIN.zip\ntest -s \"$zipfile\"\nprintf '%s  %s\\n' '745d80b8502a9beea513a2e7a58bb59272539b7508920d235ce2e79741bda528'\
        \ \"$zipfile\" | sha256sum -c -\nunzip -p \"$zipfile\" tools/actionlint > \"$R54_STAGE/actionlint\"\nchmod 0755 \"\
        $R54_STAGE/actionlint\"\n\"$R54_STAGE/actionlint\" -version | grep -Fx '1.7.12'\n\"$R54_STAGE/actionlint\" -color=false\
        \ -shellcheck='' project/.github/workflows/VEUX_R54_SUSFS_54_SOURCE_STAGE2.yml | tee \"$R54_STAGE/out/R54_ACTIONLINT.log\"\
        \npython3 -B - \"$R54_STAGE\" <<'PY_R54_LINT'\nimport pathlib,subprocess,sys,yaml,hashlib\nstage=pathlib.Path(sys.argv[1]);wf=pathlib.Path('project/.github/workflows/VEUX_R54_SUSFS_54_SOURCE_STAGE2.yml')\n\
        class Strict(yaml.SafeLoader):pass\ndef unique(loader,node):\n    output={}\n    for k,v in node.value:\n        key=loader.construct_object(k)\n\
        \        if key in output:raise ValueError('DUPLICATE_YAML_KEY:'+str(key))\n        output[key]=loader.construct_object(v)\n\
        \    return output\nStrict.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,unique)\na=yaml.load(wf.read_text(encoding='utf8'),Loader=Strict)\n\
        assert isinstance(a,dict) and 'on' in a and list(a['on'])==['workflow_dispatch']\nsteps=a['jobs']['source_stage2']['steps']\n\
        expected=['Checkout project evidence read-only','Checkout pinned original VEUX 5.4.274 source',\n 'Checkout pinned\
        \ Midori SUSFS 5.4 source','Materialize and pin complete R54 auditor with tests',\n 'Strict actionlint 1.7.12 and\
        \ independent ShellCheck','Authenticate R53 original and download artifact',\n 'Run real-artifact and adversarial\
        \ 5.4 source regressions',\n 'Replay R53 source patch and add exactly 3 pinned SUSFS 5.4 source files',\n 'Final scope\
        \ and no-flash checks with SHA256','Upload R54 source patch ONLY']\nif [s['name'] for s in steps]!=expected:raise\
        \ SystemExit('R54_STEPS_CHANGED')\nblocks=[(s['name'],s['run']) for s in steps if 'run' in s]\nif len(blocks)!=6:raise\
        \ SystemExit('R54_BASH_COUNT_NOT_SIX')\nlines=[]\nfor i,(name,body) in enumerate(blocks,1):\n    for command in (['bash','-n','-'],['shellcheck','--shell=bash','--severity=warning','-']):\n\
        \        r=subprocess.run(command,input=body,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)\n        if\
