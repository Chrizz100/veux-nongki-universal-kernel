      shell: bash
      env:
        GH_API_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\napi=\"https://api.github.com/repos/Chrizz100/veux-nongki-universal-kernel\"\napi_get() {\n\
        \  curl --fail --silent --show-error --location --retry 2 --retry-delay 2 \\\n    --connect-timeout 20 --max-time\
        \ 120 \\\n    -H \"Authorization: Bearer $GH_API_TOKEN\" \\\n    -H 'Accept: application/vnd.github+json' \\\n   \
        \ -H 'X-GitHub-Api-Version: 2022-11-28' \\\n    \"$api/$1\" --output \"$2\"\n}\napi_get 'actions/runs/40224649799'\
        \ \"$R54_STAGE/inputs/R53_RUN.json\"\napi_get 'actions/artifacts/12611060765' \"$R54_STAGE/inputs/R53_META.json\"\n\
        python3 -B - \"$R54_STAGE/inputs\" <<'PY_R54_API'\nimport json,pathlib,sys\np=pathlib.Path(sys.argv[1]);run=json.loads((p/'R53_RUN.json').read_text());meta=json.loads((p/'R53_META.json').read_text())\n\
        if not (run.get('id')==40224649799 and run.get('head_sha')=='e7c4ff01d06b96caad0dbcd2a19334241b4317a4'\n        and\
        \ run.get('head_branch')=='main' and run.get('status')=='completed' and run.get('conclusion')=='success'):\n    raise\
        \ SystemExit('R54_R53_RUN_PIN_INVALID')\nif not (meta.get('id')==12611060765 and meta.get('name')=='VEUX-R53-SUSFS54-STAGE1-PARTIAL-40224649799'\n\
        \        and meta.get('digest')=='sha256:e39cb10cc0ab5f532728b4126b538ca04eb0f6bb5f675dc9f88ff624dd3258ab'\n     \
        \   and meta.get('expired') is False and meta.get('workflow_run',{}).get('head_sha')=='e7c4ff01d06b96caad0dbcd2a19334241b4317a4'):\n\
        \    raise SystemExit('R54_R53_ARTIFACT_METADATA_PIN_INVALID')\nprint('R54_R53_RUN_AND_ARTIFACT_ID_AND_DIGEST=PASS')\n\
        PY_R54_API\napi_get 'actions/artifacts/12611060765/zip' \"$R54_STAGE/inputs/R53_ORIGINAL.zip\"\nprintf '%s  %s\\n'\
