name: VEUX R54 SUSFS 5.4 twelve-source stage2 - R53 ORIGINAL VERIFIED NO BUILD NO FLASH
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: veux-r54-stage2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source_stage2:
    name: Replay 9 R53 Git blobs and add pinned SUSFS 5.4 core/header trio
    if: ${{ github.repository == 'Chrizz100/veux-nongki-universal-kernel' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      R54_STAGE: /tmp/veux-r54
    steps:
    - name: Checkout project evidence read-only
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
        fetch-depth: 1
        path: project
    - name: Checkout pinned original VEUX 5.4.274 source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: dereference23/kernel_xiaomi_sm6375
        ref: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
        fetch-depth: 1
        persist-credentials: false
        path: kernel
    - name: Checkout pinned Midori SUSFS 5.4 source
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: midori01/susfs4ksu
        ref: cfde03eed16a39775a341d16d3f6601bed11b11a
        fetch-depth: 1
        persist-credentials: false
        path: midori
    - name: Materialize and pin complete R54 auditor with tests
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$R54_STAGE/scripts\" \"$R54_STAGE/tests\" \"$R54_STAGE/out\" \"$R54_STAGE/inputs\"\
        \ncat > \"$R54_STAGE/scripts/r54_stage2.py\" <<'PY_R54_SOURCE'\n#!/usr/bin/env python3\n\"\"\"R54: compose exact R53\
        \ stage1 patch and pinned SUSFS 5.4 auxiliary sources.\nRead-only to project and to device; writes only within isolated\
        \ checkout/out.\nNo complete SUSFS port, compiler, flashing or installation.\n\"\"\"\nfrom __future__ import annotations\n\
        import argparse\nimport hashlib\nimport io\nimport json\nfrom pathlib import Path, PurePosixPath\nimport re\nimport\
        \ stat\nimport subprocess\nimport sys\nimport zipfile\n\nSOURCE_SHA = 'b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'\n\
        MIDORI_SHA = 'cfde03eed16a39775a341d16d3f6601bed11b11a'\nR53_RUN_ID = 40224649799\nR53_COMMIT = 'e7c4ff01d06b96caad0dbcd2a19334241b4317a4'\n\
        R53_ARTIFACT_ID = 12611060765\nR53_ARTIFACT_NAME = 'VEUX-R53-SUSFS54-STAGE1-PARTIAL-40224649799'\nR53_ZIP_SHA256 =\
        \ 'e39cb10cc0ab5f532728b4126b538ca04eb0f6bb5f675dc9f88ff624dd3258ab'\nR53_PATCH_SHA256 = 'fddd2fe0cc309d1da32d1d3500b27a74ff93c79ae07243a67dea0f21691f389d'\n\
        R53_ARCHIVE_FILES = {'R53_ACTIONLINT.log','R53_PATCH_RESULT.json','R53_SHELLCHECK.log','R53_STAGE_RUN.log','R53_TESTS.log','SHA256SUMS.txt','START_HIER_NOFLASH.txt','VEUX_R53_SUSFS54_STAGE1_PARTIAL.patch'}\n\
        NEW_INPUTS = {\n 'fs/susfs.c': ('kernel_patches/fs/susfs.c','a29c4b03e63c4f1f351adee7efbfa66cf03012d2'),\n 'include/linux/susfs.h':\
        \ ('kernel_patches/include/linux/susfs.h','58128c796967308f412c0c9740253a1dce875f56'),\n 'include/linux/susfs_def.h':\
        \ ('kernel_patches/include/linux/susfs_def.h','b448edb9019bb10c7b65acf0806579dbe9e12323'),\n}\nR53_NAMES = {'block/ioprio.c','fs/Makefile','fs/notify/fdinfo.c','fs/proc/cmdline.c','fs/proc/fd.c','fs/proc_namespace.c','fs/readdir.c','fs/statfs.c','kernel/kallsyms.c'}\n\
        STAGE2_NAMES = R53_NAMES | set(NEW_INPUTS)\n# Literal line numbers in git-blob pinned Midori SUSFS c, checked independently.\n\
        SUSFS_C_WHITESPACE_LINES = {43,44,136,308,682}\n\nclass GateError(RuntimeError): pass\n\ndef run(argv: list[str],\
        \ cwd: Path, input: str|None=None, timeout=120) -> str:\n r=subprocess.run(argv,cwd=cwd,text=True,input=input,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=timeout,check=False)\n\
        \ if r.returncode: raise GateError(f'COMMAND_FAIL:{\" \".join(argv)}: {(r.stderr or r.stdout)[-1200:]}')\n return\
        \ r.stdout\n\ndef digest(blob:bytes)->str: return hashlib.sha256(blob).hexdigest()\n\ndef gitblob(source:Path,filename:Path|str)->str:\n\
        \ return run(['git','hash-object',str(Path(filename).resolve())],source).strip()\n\ndef hex64(x)->bool: return bool(re.fullmatch(r'[0-9a-f]{64}',x))\n\
        \ndef validate_r53_zip(data: bytes)->tuple[dict,str]:\n if digest(data)!=R53_ZIP_SHA256:raise GateError('R53_ORIGINAL_ZIP_SHA256_MISMATCH')\n\
        \ if len(data)>200000:raise GateError('R53_ZIP_OVERSIZED')\n try:\n  with zipfile.ZipFile(io.BytesIO(data)) as z:\n\
        \   members=z.infolist();names=[m.filename for m in members]\n   if len(set(names))!=len(names) or set(names)!=R53_ARCHIVE_FILES:\n\
        \    raise GateError('R53_ARCHIVE_MEMBER_SET_WRONG')\n   if any(m.file_size>220000 or stat.S_ISLNK(m.external_attr>>16)\
        \ or '/' in m.filename or '\\\\' in m.filename for m in members):\n    raise GateError('R53_ARCHIVE_MEMBER_UNSAFE')\n\
        \   if sum(m.file_size for m in members)>350000:raise GateError('R53_ARCHIVE_DECOMPRESS_SIZE_INVALID')\n   if z.testzip()\
        \ is not None:raise GateError('R53_ZIP_INTEGRITY_FAIL')\n   manifest=z.read('SHA256SUMS.txt').decode('utf-8')\n  \
        \ want={}\n   for ln in manifest.splitlines():\n    if '  ' not in ln: raise GateError('R53_MANIFEST_MALFORMED')\n\
        \    val,name=ln.split('  ',1)\n    if name in want or not hex64(val):raise GateError('R53_MANIFEST_BAD_ENTRY')\n\
        \    want[name]=val\n   if set(want)!=R53_ARCHIVE_FILES-{'SHA256SUMS.txt'}:raise GateError('R53_MANIFEST_INCOMPLETE')\n\
        \   for name,val in want.items():\n    if digest(z.read(name))!=val:raise GateError('R53_MANIFEST_MISMATCH:'+name)\n\
        \   report=json.loads(z.read('R53_PATCH_RESULT.json'))\n   patch=z.read('VEUX_R53_SUSFS54_STAGE1_PARTIAL.patch').decode('utf-8')\n\
        \ except (zipfile.BadZipFile,UnicodeError,KeyError,json.JSONDecodeError) as e:\n  raise GateError('R53_ARCHIVE_INVALID:'+str(e))\
        \ from e\n validate_r53_report(report,patch)\n return report,patch\n\ndef validate_r53_report(report:dict,patch:str)->None:\n\
        \ if not isinstance(report,dict) or report.get('schema')!='VEUX_R53_SUSFS_5_4_STAGE1_V1' or report.get('status')!='PARTIAL_SOURCE_PATCH_APPLIED_TO_PINNED_ANCESTOR':\n\
        \  raise GateError('R53_RESULT_SCHEMA_INVALID')\n if (report.get('kernel_source_commit')!=SOURCE_SHA or report.get('midori_commit')!=MIDORI_SHA\
        \ or report.get('patch_sha256')!=R53_PATCH_SHA256):\n  raise GateError('R53_SOURCE_OR_PATCH_PIN_MISMATCH')\n if digest(patch.encode('utf-8'))!=R53_PATCH_SHA256\
        \ or report.get('patched_file_count')!=9:\n  raise GateError('R53_PARTIAL_PATCH_MISMATCH')\n rows=report.get('patched_files')\n\
        \ if not isinstance(rows,list) or {row.get('file') for row in rows}!=R53_NAMES or len(rows)!=9:\n  raise GateError('R53_PATCH_SCOPE_MISMATCH')\n\
        \ for row in rows:\n  if not re.fullmatch('[0-9a-f]{40}',row.get('old_git_blob','')) or not re.fullmatch('[0-9a-f]{40}',row.get('new_git_blob','')):\n\
        \   raise GateError('R53_GIT_BLOB_INVALID')\n for k in ('susfs_5_4_full_port_complete','susfs_c_and_headers_integrated','compile_performed','boot_ready','flash_allowed','r44_walt_recomposed'):\n\
        \  if report.get(k) is not False:raise GateError('R53_UNSAFE_CLAIM:'+k)\n if set(re.findall(r'(?m)^diff --git a/(\\\
        S+) b/\\1$',patch))!=R53_NAMES:\n  raise GateError('R53_PATCH_DIFF_SCOPE_INVALID')\n\ndef clean_pinned_susfs_c(data:bytes)->tuple[bytes,list[int]]:\n\
        \ try:txt=data.decode('utf-8')\n except UnicodeDecodeError as e:raise GateError('SUSFS_C_NOT_UTF8') from e\n if '\\\
        r' in txt or not txt.endswith('\\n'):raise GateError('SUSFS_C_LINE_ENDINGS_CHANGED')\n lines=txt.splitlines(keepends=True)\n\
        \ offending={i+1 for i,line in enumerate(lines) if line[:-1].endswith((' ','\\t'))}\n if offending!=SUSFS_C_WHITESPACE_LINES:\n\
        \  raise GateError('SUSFS_C_WHITESPACE_SCOPE_CHANGED:'+str(offending))\n # Normalize exactly 5 existing upstream trailing\
        \ whitespace issues, not other code.\n cleaned=''.join(line[:-1].rstrip(' \\t')+'\\n' for line in lines)\n return\
        \ cleaned.encode('utf-8'),sorted(offending)\n\ndef stage(source:Path,midori:Path,r53_zip:Path,out:Path)->dict:\n source,midori,r53_zip,out=source.resolve(),midori.resolve(),r53_zip.resolve(),out.resolve()\n\
        \ if run(['git','rev-parse','HEAD'],source).strip()!=SOURCE_SHA:raise GateError('WRONG_5_4_ANCESTOR')\n if run(['git','rev-parse','HEAD'],midori).strip()!=MIDORI_SHA:raise\
        \ GateError('WRONG_MIDORI_5_4')\n for directory in (source,midori):\n  if run(['git','status','--porcelain','--untracked-files=all'],directory).strip():raise\
        \ GateError('DIRTY_INPUT_GIT_REPO:'+str(directory))\n preexisting={'R54_ACTIONLINT.log','R54_SHELLCHECK.log','R54_TESTS.log','R54_STAGE.log'}\n\
        \ if out.exists() and any(p.name not in preexisting or not p.is_file() or p.is_symlink() for p in out.iterdir()):\n\
        \  raise GateError('OUTPUT_DIR_NOT_EMPTY')\n if not r53_zip.is_file() or r53_zip.is_symlink():raise GateError('R53_ZIP_MISSING_OR_SYMLINK')\n\
        \ report,patch=validate_r53_zip(r53_zip.read_bytes())\n for row in report['patched_files']:\n  p=source/row['file']\n\
        \  if not p.is_file() or p.is_symlink() or gitblob(source,p)!=row['old_git_blob']:\n   raise GateError('R53_SOURCE_PREIMAGE_DRIFT:'+row['file'])\n\
        \ for dst in NEW_INPUTS:\n  p=source/dst\n  if p.exists() or p.is_symlink():raise GateError('SUSFS_FILE_EXISTS_UNEXPECTEDLY:'+dst)\n\
        \ additions=[]\n for dest,(src,expected_blob) in NEW_INPUTS.items():\n  inp=midori/src\n  if not inp.is_file() or\
        \ inp.is_symlink() or gitblob(midori,inp)!=expected_blob:\n   raise GateError('SUSFS_5_4_UPSTREAM_BLOB_MISMATCH:'+src)\n\
        \  blob=inp.read_bytes()\n  if dest=='fs/susfs.c':cleaned,corrections=clean_pinned_susfs_c(blob)\n  else:\n   if b'\\\
        r' in blob or not blob.endswith(b'\\n') or any(line.endswith((b' ',b'\\t')) for line in blob.split(b'\\n')):\n   \
        \ raise GateError('SUSFS_HEADER_UNEXPECTED_WHITESPACE:'+src)\n   cleaned,corrections=blob,[]\n  additions.append((dest,expected_blob,cleaned,corrections))\n\
        \ # Both source and artifacts are now verified: perform isolated changes.\n run(['git','apply','--check','-'],source,input=patch)\n\
        \ run(['git','apply','-'],source,input=patch)\n for row in report['patched_files']:\n  if gitblob(source,source/row['file'])!=row['new_git_blob']:\n\
        \   raise GateError('R53_POSTIMAGE_WRONG:'+row['file'])\n for dest,prehash,cleaned,corrections in additions:\n  target=source/dest\n\
        \  target.parent.mkdir(parents=True,exist_ok=True)\n  with target.open('xb') as handle:handle.write(cleaned)\n  if\
        \ target.read_bytes()!=cleaned:raise GateError('SOURCE_FILE_WRITE_MISMATCH:'+dest)\n  if dest.endswith('susfs.h')\
        \ and b'#define SUSFS_VERSION \"v2.3.0\"' not in cleaned:raise GateError('SUSFS_VERSION_UNEXPECTED')\n # Show the\
        \ new files in the diff without staging any commits or mutating user repo.\n run(['git','add','-N','--',*sorted(NEW_INPUTS)],source)\n\
        \ run(['git','diff','--check'],source)\n modified=set(run(['git','diff','--name-only','--no-renames'],source).splitlines())\n\
        \ if modified!=STAGE2_NAMES:raise GateError('STAGE2_SCOPE_WRONG:'+str(modified^STAGE2_NAMES))\n diff=run(['git','diff','--binary','--no-ext-diff','--no-renames','--',*sorted(STAGE2_NAMES)],source)\n\
        \ if len(diff)<=len(patch) or len(diff)>350000 or not diff.startswith('diff --git '):raise GateError('STAGE2_PATCH_INVALID_SIZE')\n\
        \ if set(re.findall(r'(?m)^diff --git a/(\\S+) b/\\1$',diff))!=STAGE2_NAMES:\n  raise GateError('STAGE2_DIFF_INCORRECT_FILES')\n\
        \ for k in NEW_INPUTS:\n  segment=diff.split('diff --git a/'+k+' b/'+k,1)\n  if len(segment)!=2 or 'new file mode\
        \ 100644' not in segment[1].split('diff --git ',1)[0]:\n   raise GateError('SUSFS_ADDITION_NOT_INCLUDED:'+k)\n meta={\n\
        \  'schema':'VEUX_R54_SUSFS54_STAGE2_SOURCE_COMPOSITION_V1','status':'12_FILES_PATCHED_ON_5_4_ANCESTOR_NO_BUILD',\n\
        \  'source_commit':SOURCE_SHA,'midori_commit':MIDORI_SHA,'r53_run':R53_RUN_ID,\n  'r53_artifact_id':R53_ARTIFACT_ID,'r53_zip_sha256':R53_ZIP_SHA256,\n\
        \  'r53_patch_sha256':R53_PATCH_SHA256,'files_changed':12,\n  'r53_nine_file_postimages_verified':True,'new_files':[],\n\
        \  'patch_sha256':digest(diff.encode('utf-8')),\n  'upstream_whitespace_corrections_exact':sum(len(x[3]) for x in\
        \ additions),\n  'source_changes_committed':False,'r44_walt_recomposed':False,\n  'susfs_complete':False,'baka_su_uapi6_integrated':False,'nomount_v22_integrated':False,\n\
        \  'build_performed':False,'device_tested':False,'boot_ready':False,'flash_allowed':False,\n }\n for dst,upsha,contents,corrections\
        \ in additions:\n  meta['new_files'].append({'file':dst,'upstream_git_blob':upsha,'final_git_blob':gitblob(source,source/dst),\n\
        \                            'sha256':digest(contents),'whitespace_lines_corrected':corrections})\n out.mkdir(parents=True,exist_ok=True)\n\
        \ (out/'VEUX_R54_SUSFS54_STAGE2_12_FILES_NOFLASH.patch').write_text(diff,encoding='utf-8')\n (out/'R54_RESULT.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\\\
        n',encoding='utf-8')\n (out/'START_HIER_NOFLASH.txt').write_text(\n  'R54: Echtes SUSFS 5.4 Stage2-Quellpatch auf\
        \ gepinntem Ancestor. 9 R53-Aenderungen + 3 '\n  'Midori-5.4-Quelldateien. 5 upstream Whitespacekorrekturen an fs/susfs.c.\
        \ '\\\n  'Noch KEINE Integration komplexer VFS/Mount/SELinux/KernelSU Hooks. KEIN R44 WALT '\n  'Rebuild, KEIN Kernel-Build,\
        \ KEIN Flash. BReNE unveraendert. '\\\n  'NO BOOT RELEASE.\\n',encoding='utf-8')\n return meta\n\ndef main()->int:\n\
        \ p=argparse.ArgumentParser();p.add_argument('--source',required=True,type=Path);p.add_argument('--midori',required=True,type=Path);p.add_argument('--r53',required=True,type=Path);p.add_argument('--out',required=True,type=Path)\n\
        \ a=p.parse_args()\n try:res=stage(a.source,a.midori,a.r53,a.out)\n except (GateError,OSError,subprocess.TimeoutExpired,ValueError)\
        \ as e:\n  print('R54_STAGE2_BLOCKED:'+str(e),file=sys.stderr);return 2\n print('R54_SUSFS54_STAGE2_REAL_12_FILE_PATCH=PASS;\
        \ SUSFS_COMPLETE=NO; BOOT_READY=NO; FLASH_ALLOWED=NO')\n print('R54_PATCH_SHA256='+res['patch_sha256']);return 0\n\
        \nif __name__=='__main__':sys.exit(main())\nPY_R54_SOURCE\ncat > \"$R54_STAGE/tests/test_r54_stage2.py\" <<'PY_R54_TESTS'\n\
        #!/usr/bin/env python3\nfrom __future__ import annotations\nimport hashlib\nimport io\nimport json\nimport os\nimport\
        \ stat\nfrom pathlib import Path\nimport shutil\nimport subprocess\nimport sys\nimport tempfile\nimport unittest\n\
        from unittest import mock\nimport zipfile\nimport warnings\n\nimport r54_stage2 as g\n\n\ndef git(repo:Path,*args:str)->str:\n\
        \ r=subprocess.run(['git',*args],cwd=repo,capture_output=True,text=True,check=True)\n return r.stdout.strip()\n\n\
        class R54Tests(unittest.TestCase):\n @classmethod\n def setUpClass(cls):\n  cls.root=Path(tempfile.mkdtemp(prefix='r54_test_fixture_'))\n\
        \  cls.src=cls.root/'base';cls.src.mkdir()\n  cls.mid=cls.root/'upstream';cls.mid.mkdir()\n  for p in (cls.src,cls.mid):\n\
        \   git(p,'init','-q');git(p,'config','user.email','ci@example.invalid');git(p,'config','user.name','CI Fixture')\n\
        \  cls.old={};cls.new={}\n  for i,filename in enumerate(sorted(g.R53_NAMES)):\n   p=cls.src/filename;p.parent.mkdir(parents=True,exist_ok=True)\n\
        \   p.write_text(f'original line {i}\\nold value {i}\\n',encoding='utf-8')\n  git(cls.src,'add','.');git(cls.src,'commit','-qm','clean\
        \ synthetic ancestor')\n  cls.src_sha=git(cls.src,'rev-parse','HEAD')\n  for i,name in enumerate(sorted(g.R53_NAMES)):\n\
        \   p=cls.src/name\n   cls.old[name]=git(cls.src,'hash-object',name)\n   p.write_text(p.read_text().replace(f'old\
        \ value {i}',f'new value {i}'),encoding='utf-8')\n   cls.new[name]=git(cls.src,'hash-object',name)\n  cls.patch=git(cls.src,'diff','--binary','--no-ext-diff','--no-renames')+'\\\
        n'\n  git(cls.src,'restore','--worktree','.')\n  cls.blob_files={}\n  for dest,(origin,expected) in g.NEW_INPUTS.items():\n\
        \   p=cls.mid/origin;p.parent.mkdir(parents=True,exist_ok=True)\n   if dest=='fs/susfs.c':\n    p.write_text('source\
        \ start\\n'+''.join(f'line {i}' + ('  ' if i in (3,4,5,6,7) else '')+'\\n' for i in range(2,11)),encoding='utf8')\n\
        \   elif dest.endswith('/susfs.h'):\n    p.write_text('#define SUSFS_VERSION \"v2.3.0\"\\n',encoding='utf8')\n   else:p.write_text('#define\
        \ SUSFS_X 1\\n',encoding='utf8')\n   cls.blob_files[dest]=(origin,git(cls.mid,'hash-object',origin))\n  git(cls.mid,'add','.');git(cls.mid,'commit','-qm','synthetic\
        \ pinned upstream')\n  cls.mid_sha=git(cls.mid,'rev-parse','HEAD')\n  rows=[{'file':name,'old_git_blob':cls.old[name],'new_git_blob':cls.new[name]}\
        \ for name in sorted(g.R53_NAMES)]\n  cls.report={\n   'schema':'VEUX_R53_SUSFS_5_4_STAGE1_V1','status':'PARTIAL_SOURCE_PATCH_APPLIED_TO_PINNED_ANCESTOR',\n\
        \   'kernel_source_commit':cls.src_sha,'midori_commit':cls.mid_sha,\n   'patch_sha256':g.digest(cls.patch.encode()),'patched_file_count':9,'patched_files':rows,\n\
        \   'susfs_5_4_full_port_complete':False,'susfs_c_and_headers_integrated':False,\n   'compile_performed':False,'boot_ready':False,'flash_allowed':False,'r44_walt_recomposed':False,\n\
        \  }\n  names=g.R53_ARCHIVE_FILES\n  manifest={}\n  for k in names-{'SHA256SUMS.txt'}:\n   if k=='R53_PATCH_RESULT.json':blob=(json.dumps(cls.report)+'\\\
        n').encode()\n   elif k=='VEUX_R53_SUSFS54_STAGE1_PARTIAL.patch':blob=cls.patch.encode()\n   else:blob=(k+' synthetic\\\
        n').encode()\n   manifest[k]=blob\n  manifest['SHA256SUMS.txt']=''.join(g.digest(v)+'  '+k+'\\n' for k,v in sorted(manifest.items())).encode()\n\
        \  buf=io.BytesIO()\n  with zipfile.ZipFile(buf,'w',zipfile.ZIP_DEFLATED) as z:\n   for k,v in manifest.items():z.writestr(k,v)\n\
        \  cls.zipbytes=buf.getvalue()\n  cls.settings={\n   'SOURCE_SHA':cls.src_sha,'MIDORI_SHA':cls.mid_sha,\n   'R53_ZIP_SHA256':g.digest(cls.zipbytes),\n\
        \   'R53_PATCH_SHA256':g.digest(cls.patch.encode()),\n   'NEW_INPUTS':cls.blob_files,\n   'SUSFS_C_WHITESPACE_LINES':{3,4,5,6,7},\n\
        \  }\n\n @classmethod\n def tearDownClass(cls):shutil.rmtree(cls.root,ignore_errors=True)\n\n def setUp(self):\n \
        \ self.temp=Path(tempfile.mkdtemp(prefix='r54_case_'))\n  self.addCleanup(shutil.rmtree,self.temp,ignore_errors=True)\n\
        \  self.src=self.temp/'kernel';self.mid=self.temp/'midori'\n  shutil.copytree(type(self).src,self.src)\n  shutil.copytree(type(self).mid,self.mid)\n\
        \  self.arc=self.temp/'r53.zip';self.arc.write_bytes(type(self).zipbytes)\n  self.out=self.temp/'out';self.out.mkdir()\n\
        \  self.patches=[]\n  for k,v in type(self).settings.items():\n   p=mock.patch.object(g,k,v);p.start();self.addCleanup(p.stop)\n\
        \n def run_stage(self):return g.stage(self.src,self.mid,self.arc,self.out)\n\n def test_original_r53_artifact_real_integrity(self):\n\
        \  p=os.getenv('R54_REAL_R53')\n  if not p: self.skipTest('real R53 archive path unavailable')\n  with mock.patch.object(g,'R53_ZIP_SHA256','e39cb10cc0ab5f532728b4126b538ca04eb0f6bb5f675dc9f88ff624dd3258ab'),\\\
        \n       mock.patch.object(g,'R53_PATCH_SHA256','fddd2fe0cc309d1da32d1d3500b27a74ff93c79ae07243a67dea0f21691f389d'),\\\
        \n       mock.patch.object(g,'SOURCE_SHA','b2b7a3bbc36d120ee523ebc8d68e0f13a97df632'),\\\n       mock.patch.object(g,'MIDORI_SHA','cfde03eed16a39775a341d16d3f6601bed11b11a'):\n\
