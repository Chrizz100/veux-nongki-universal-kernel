                if item.is_dir() or '/' in item.filename or chr(92) in item.filename or item.filename.startswith('.') or stat.S_IFMT(item.external_attr>>16)==stat.S_IFLNK:
                    raise SystemExit('R6_UNSAFE_ZIP_MEMBER')
            pins={}
            for line in z.read('SHA256SUMS.txt').decode().splitlines():
                h,n=line.split('  ',1)
                if n in pins or len(h)!=64:raise SystemExit('R6_MANIFEST_INVALID')
                pins[n]=h
            if set(pins)!=expect:raise SystemExit('R6_MEMBER_MANIFEST_SCOPE_MISMATCH')
            for n in expect:
                if hashlib.sha256(z.read(n)).hexdigest()!=pins[n]:
                    raise SystemExit('R6_MEMBER_SHA_MISMATCH:'+n)
            out.mkdir()
            for n in expect:(out/n).write_bytes(z.read(n))
        for n in ('r6_exact_source_gate.py','test_r6_source_gate.py'):
            compile((out/n).read_bytes(),n,'exec')
        print('R6_SOURCE_PACKAGE_HASH_SCOPE_SYNTAX=PASS; NO_BUILD=YES')
        PY_R6_INPUT
