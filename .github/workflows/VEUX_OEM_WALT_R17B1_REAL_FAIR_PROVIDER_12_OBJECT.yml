name: VEUX OEM WALT R17-B1 Genuine Xiaomi Fair 12-Object Compiler – NO FLASH
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: veux-oem-walt-r17b1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  p11-exact-source:
    if: ${{ github.repository == 'Chrizz100/veux-nongki-universal-kernel' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PACKAGE_NAME: VEUX_STOCK274_P11_R4_MAIN.zip
      PACKAGE_SHA256: 46eef073d2418f0b64b66a0ff3ab33d788c485db3dcf8afa5cf56f89da27fb50
      P11_TOOL_DIR: ${{ github.workspace }}/p11-tools
      P10_TOOL_DIR: ${{ github.workspace }}/p11-tools/p10
      R4_TOOL_DIR: ${{ github.workspace }}/p11-tools/r4
      P11_BUNDLES_DIR: ${{ github.workspace }}/p11-bundles
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      R6_PACKAGE_NAME: VEUX_OEM_WALT_ABI_R6_MAIN.zip
      R6_PACKAGE_SHA256: 8c9963b23b5fce2b358c4151df83a58d68ed4b7c4884392bee871f02f65e6be2
      R6_DIR: ${{ github.workspace }}/veux-oem-walt-r6
      R6_OUT: ${{ github.workspace }}/veux-oem-walt-r6-source-only
      R7_PACKAGE_NAME: VEUX_OEM_WALT_R7_R2_PRECOMPILE_AUDIT_MAIN.zip
      R7_PACKAGE_SHA256: 84d2aea348a8181eadc712a8c4e9b1e66836650fb179e5632d403ff2f27dd051
      R7_DIR: ${{ github.workspace }}/veux-oem-walt-r7-tools
      R7_OUT: ${{ github.workspace }}/veux-oem-walt-r7-precompile-audit
      R8_PACKAGE_NAME: VEUX_OEM_WALT_R8_SOURCE_BRIDGE_MAIN.zip
      R8_PACKAGE_SHA256: e4d5c314d5ba8b090b3168175b35a80a254723c593240e2fbefcf52bf6e6ff43
      R8_DIR: ${{ github.workspace }}/veux-oem-walt-r8-tools
      R8_OUT: ${{ github.workspace }}/veux-oem-walt-r8-source-only
      R9_PACKAGE_NAME: VEUX_OEM_WALT_R9_REAL_OBJECT_COMPILE_MAIN.zip
      R9_PACKAGE_SHA256: 9ee5da65612fba59b857790843935d7e3effb4d6a0a489a989ddcc9bf8feb56d
      R9_DIR: ${{ github.workspace }}/veux-oem-walt-r9-tools
      R9_REPORT: ${{ github.workspace }}/veux-oem-walt-r9-compiler-audit
      R9_SNAPSHOT: ${{ github.workspace }}/veux-r9-kernel-copy
      R9_OBJOUT: ${{ github.workspace }}/veux-r9-out
      R9_TOOLCHAIN: ${{ github.workspace }}/toolchains/clang-r416183b
      R10_PACKAGE_NAME: VEUX_OEM_WALT_R10_OEM_API_COMPILER_MAIN.zip
      R10_PACKAGE_SHA256: ff3509dcb4bd8a5b51c3e6e1c9e201b286c0e5cb72bc88d4a4dd374de07e2c5e
      R10_DIR: ${{ github.workspace }}/veux-oem-walt-r10-tools
      R10_OUT: ${{ github.workspace }}/veux-oem-walt-r10-source-audit
      R11_PACKAGE_NAME: VEUX_OEM_WALT_R11_WALT_OBJECT_DIAGNOSTIC_MAIN.zip
      R11_PACKAGE_SHA256: 81e836e531b903f66477a88a2e3101a9e09dd6a1a051385d2d835f6072af92aa
      R11_DIR: ${{ github.workspace }}/veux-oem-walt-r11-tools
      R11_OUT: ${{ github.workspace }}/veux-oem-walt-r11-source-audit
      R11_REPORT: ${{ github.workspace }}/veux-oem-walt-r11-compiler-audit
      R12_PACKAGE_NAME: VEUX_OEM_WALT_R12_R3_RAVG_SYSCTL_MAIN.zip
      R12_PACKAGE_SHA256: 7ecc255d3eea1dca9dfa55f9726bbfe36ebc628a431a988ea44c9491ec7a8ad3
      R12_DIR: ${{ github.workspace }}/veux-oem-walt-r12-tools
      R12_OUT: ${{ github.workspace }}/veux-oem-walt-r12-source-audit
      R12_REPORT: ${{ github.workspace }}/veux-oem-walt-r12-compiler-audit
      R13_PACKAGE_NAME: VEUX_OEM_WALT_R13_SUBSYSTEM_DIAGNOSTIC_MAIN.zip
      R13_PACKAGE_SHA256: a458d99504800ebe10cb98ff0e250f83596011f0e4ba57280f99105fc855fe8b
      R13_DIR: ${{ github.workspace }}/veux-oem-walt-r13-tools
      R13_REPORT: ${{ github.workspace }}/veux-oem-walt-r13-subsystem-report
      R13_OBJOUT: ${{ github.workspace }}/veux-r12-objout
      R14_PACKAGE_NAME: VEUX_OEM_WALT_R14_AVG_TRACE_SOURCE_AND_COMPILER_MAIN.zip
      R14_PACKAGE_SHA256: 517bb81f7068cf6554f9431a6f3bb7dbc3795f9d820eabf0062083bd2b2d5def
      R14_DIR: ${{ github.workspace }}/veux-oem-walt-r14-tools
      R14_OUT: ${{ github.workspace }}/veux-oem-walt-r14-source-audit
      R14_REPORT: ${{ github.workspace }}/veux-oem-walt-r14-compiler-audit
      R15_PACKAGE_NAME: VEUX_OEM_WALT_R15_CPU_ISOLATION_FOUNDATION_MAIN.zip
      R15_PACKAGE_SHA256: 1ec7d6d06acc3862534d4a861410807ebc0db273b841efb9cce695b286e68f1f
      R15_DIR: ${{ github.workspace }}/veux-oem-walt-r15-tools
      R15_OUT: ${{ github.workspace }}/veux-oem-walt-r15-source-audit
      R15_REPORT: ${{ github.workspace }}/veux-oem-walt-r15-compiler-audit
      R16_PACKAGE_NAME: VEUX_OEM_WALT_R16_BOUNDED_API_COMPILER_MAIN.zip
      R16_PACKAGE_SHA256: df65c03fab163f08f551d4d5875ceed21463ed6043c0da0217445b0c2d238b0a
      R16_DIR: ${{ github.workspace }}/veux-oem-walt-r16-tools
      R16_OUT: ${{ github.workspace }}/veux-oem-walt-r16-source-audit
      R16_REPORT: ${{ github.workspace }}/veux-oem-walt-r16-compiler-audit
      R17A_PACKAGE_NAME: VEUX_OEM_WALT_R17A_REAL_PROVIDER_MAIN.zip
      R17A_PACKAGE_SHA256: 3e15ff497bce37100127565c81b8cd1992e8429569b58e3118f8a333d18dac7e
      R17A_DIR: ${{ github.workspace }}/veux-oem-walt-r17a-tools
      R17A_OUT: ${{ github.workspace }}/veux-oem-walt-r17a-source-audit
      R17A_REPORT: ${{ github.workspace }}/veux-oem-walt-r17a-compiler-audit
      R17B_PACKAGE_NAME: VEUX_OEM_WALT_R17B1_REAL_FAIR_PROVIDER_MAIN.zip
      R17B_PACKAGE_SHA256: 02776ccfd8beb41db70950f82ea207dc34cc6b6f66cf1c48d436d3e81b16e8f6
      R17B_DIR: ${{ github.workspace }}/veux-oem-walt-r17b-tools
      R17B_OUT: ${{ github.workspace }}/veux-oem-walt-r17b-source-audit
      R17B_REPORT: ${{ github.workspace }}/veux-oem-walt-r17b-compiler-audit
    steps:
    - name: Checkout exact repo source read-only
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: project
        fetch-depth: 1
        persist-credentials: false
    - name: Require exact unchanged P11 R4, R6, and R7 root ZIPs
      id: package
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = 'Chrizz100/veux-nongki-universal-kernel'
         test "$GITHUB_REF" = 'refs/heads/main'
         test "$(git -C project rev-parse HEAD)" = "$GITHUB_SHA"
         test -f "project/$PACKAGE_NAME" && test ! -L "project/$PACKAGE_NAME"
         test -f "project/$R6_PACKAGE_NAME" && test ! -L "project/$R6_PACKAGE_NAME"
         printf '%s  %s\n' "$PACKAGE_SHA256" "project/$PACKAGE_NAME" | sha256sum -c -
         printf '%s  %s\n' "$R6_PACKAGE_SHA256" "project/$R6_PACKAGE_NAME" | sha256sum -c -
         echo 'present=true' >> "$GITHUB_OUTPUT"
         echo 'R6_ROOT_INPUTS=PASS'

        test -f "project/$R7_PACKAGE_NAME" && test ! -L "project/$R7_PACKAGE_NAME"
        printf '%s  %s\n' "$R7_PACKAGE_SHA256" "project/$R7_PACKAGE_NAME" | sha256sum -c -
        echo 'R7_ROOT_INPUT=PASS'
    - name: Pin actionlint 1.7.12 and validate R6 YAML before replay
      if: ${{ steps.package.outputs.present == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        workflow='project/.github/workflows/VEUX_OEM_WALT_ABI_R6_EXACT_P3_SOURCE_BRIDGE.yml'
        test -s "$workflow"
        curl --fail --location --retry 3 --max-time 120 --silent --show-error \
          'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz' \
          -o "$RUNNER_TEMP/actionlint.tar.gz"
        printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/veux-p11-actionlint"
        tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/veux-p11-actionlint" actionlint
        "$RUNNER_TEMP/veux-p11-actionlint/actionlint" -oneline "$workflow"
        echo 'R6_ACTIONLINT=PASS'
    - name: Unpack and SHA-authenticate source-only dependencies
      if: ${{ steps.package.outputs.present == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import hashlib,json,os,pathlib,stat,zipfile
        base=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
        root=base/'project'/os.environ['PACKAGE_NAME']
        tools=pathlib.Path(os.environ['P11_TOOL_DIR'])
        bundles=pathlib.Path(os.environ['P11_BUNDLES_DIR'])
        if tools.exists() or bundles.exists():raise SystemExit('P11_TOOL_DIRECTORY_ALREADY_EXISTS')
        expected={'START_HIER.txt','P11_STATUS.json','P11_TESTS.log',
                  'P10_MASTER_ORIGINAL.zip','P3_R4_SOURCE_REPLAY.zip',
                  'p11_source_gate.py','p11_build_walt_off.sh','test_p11_source_gate.py',
                  'test_p11_build_dryrun.py','P11_BUILDRUNNER_DRYRUN_TESTS.log'}
        def load_valid(z,expected,manifest_name):
            info=z.infolist();names=[x.filename for x in info]
            if set(names)!=expected|{manifest_name} or len(names)!=len(set(names)):
                raise SystemExit('UNEXPECTED_ARCHIVE_MEMBERS')
            if z.testzip():raise SystemExit('CRC_FAILURE')
            for i in info:
                p=pathlib.PurePosixPath(i.filename)
                if p.is_absolute() or '..' in p.parts or '\\' in i.filename or i.is_dir() or stat.S_IFMT(i.external_attr>>16)==stat.S_IFLNK:
                    raise SystemExit('UNSAFE_ARCHIVE_MEMBER '+i.filename)
            manifest=json.loads(z.read(manifest_name))
            hashes=manifest.get('files') if manifest_name=='manifest.json' and 'files' in manifest else manifest.get('sha256')
            if set(hashes)!=expected:raise SystemExit('MANIFEST_SCOPE_DRIFT')
            for n,digest in hashes.items():
                if hashlib.sha256(z.read(n)).hexdigest()!=digest:raise SystemExit('HASH_MISMATCH '+n)
            return manifest
        with zipfile.ZipFile(root) as z:
            manifest=load_valid(z,expected,'manifest.json')
            if manifest.get('kernel')!='5.4.274' or manifest.get('flashable') is not False:raise SystemExit('WRONG_STAGE')
            tools.mkdir();bundles.mkdir()
            for name in ('p11_source_gate.py','p11_build_walt_off.sh','test_p11_source_gate.py','test_p11_build_dryrun.py'):
                (tools/name).write_bytes(z.read(name))
            nested={'P10_MASTER_ORIGINAL.zip':'VEUX_5_4_274_P10_WALT_KOMBI_PATCH_SAMMELPAKET.zip',
                    'P3_R4_SOURCE_REPLAY.zip':'VEUX_STOCK274_P3_GATE_R4.zip'}
            for old,new in nested.items():(bundles/new).write_bytes(z.read(old))
        for nested_file,out_folder in [(bundles/'VEUX_STOCK274_P3_GATE_R4.zip',tools/'r4'),
                                       (bundles/'VEUX_5_4_274_P10_WALT_KOMBI_PATCH_SAMMELPAKET.zip',tools/'p10')]:
            with zipfile.ZipFile(nested_file) as zi:
                if zi.testzip():raise SystemExit('NESTED_CRC_FAILURE')
                for item in zi.infolist():
                    p=pathlib.PurePosixPath(item.filename)
                    if p.is_absolute() or '..' in p.parts or '\\' in item.filename or stat.S_IFMT(item.external_attr>>16)==stat.S_IFLNK:
                        raise SystemExit('NESTED_UNSAFE_PATH')
                zi.extractall(out_folder)
        for path in tools.rglob('*.py'):compile(path.read_bytes(),str(path),'exec')
        print('P11_NESTED_PACKAGE_AND_PYTHON=PASS')
        PY
    - name: Source patch regressions before remote checkout
      if: ${{ steps.package.outputs.present == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        python3 -m unittest discover -s "$P11_TOOL_DIR" -p test_p11_source_gate.py -v
        python3 -m unittest discover -s "$P10_TOOL_DIR" -p test_compose_p10_source.py -v
        python3 -m unittest discover -s "$R4_TOOL_DIR" -p test_stage_stock274.py -v
        python3 project/common/stock274/source_only_r2/test_prepare_stock274_p3.py
        echo 'P11_SOURCE_REGRESSIONS=PASS'
    - name: Checkout pinned P2-v5 historical recipe
      if: ${{ steps.package.outputs.present == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: Chrizz100/veux-resukisu-builder
        ref: e58a67835f266620d4fdb86d816295e401a8858d
        fetch-depth: 1
        path: historical
        persist-credentials: false
    - name: Checkout pinned Positron vendor ancestor (will become exactly 5.4.274)
      if: ${{ steps.package.outputs.present == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: dereference23/kernel_xiaomi_sm6375
        ref: b2b7a3bbc36d120ee523ebc8d68e0f13a97df632
        fetch-depth: 0
        path: kernel
        persist-credentials: false
    - name: Install YAML parser for exact P2 reconstruction
      if: ${{ steps.package.outputs.present == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if ! python3 -c 'import yaml; assert hasattr(yaml,"safe_load")'; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml
        fi
        python3 -c 'import yaml; print("P11_YAML_PARSER=PASS")'
    - name: Independently ShellCheck each R6 YAML Bash run block
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v shellcheck >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
        fi
        python3 - <<'PY_R6_SHELLCHECK'
        import yaml,subprocess,pathlib
        doc=yaml.safe_load(pathlib.Path('project/.github/workflows/VEUX_OEM_WALT_ABI_R6_EXACT_P3_SOURCE_BRIDGE.yml').read_text())
        blocks=[s['run'] for j in doc['jobs'].values() for s in j['steps'] if isinstance(s,dict) and isinstance(s.get('run'),str)]
        if len(blocks)<9:raise SystemExit('R6_RUN_BLOCKS_MISSING')
        for i,script in enumerate(blocks,1):
            p=subprocess.run(['shellcheck','--shell=bash','--severity=warning','-'],input=script,text=True,capture_output=True)
            if p.returncode:raise SystemExit('SHELLCHECK_BLOCK_'+str(i)+'_FAIL\n'+p.stdout+p.stderr)
        print('R6_INDEPENDENT_SHELLCHECK=PASS; BLOCKS='+str(len(blocks)))
        PY_R6_SHELLCHECK
    - name: 'R7 R2 preflight: pinned package, actionlint, ShellCheck, Clang 14/17 test suites'
      shell: bash
      run: |
        set -euo pipefail
        r7_zip="project/$R7_PACKAGE_NAME"
        r7_yaml='project/.github/workflows/VEUX_OEM_WALT_R7_R2_EXACT_SOURCE_INTERFACE_PREFLIGHT.yml'
        test -f "$r7_zip" && test ! -L "$r7_zip"
        test -s "$r7_yaml" && test ! -L "$r7_yaml"
        printf '%s  %s\n' "$R7_PACKAGE_SHA256" "$r7_zip" | sha256sum -c -
        "$RUNNER_TEMP/veux-p11-actionlint/actionlint" -oneline "$r7_yaml"
        python3 - <<'PY_R7_SHELLCHECK'
        import pathlib,subprocess,yaml
        p=pathlib.Path('project/.github/workflows/VEUX_OEM_WALT_R7_R2_EXACT_SOURCE_INTERFACE_PREFLIGHT.yml')
        d=yaml.safe_load(p.read_text())
        blocks=[s['run'] for j in d['jobs'].values() for s in j['steps'] if isinstance(s.get('run'),str)]
        if len(blocks)<11: raise SystemExit('R7_YAML_RUN_BLOCKS_MISSING')
        for i,b in enumerate(blocks,1):
            r=subprocess.run(['shellcheck','--shell=bash','--severity=warning','-'],input=b,text=True,capture_output=True)
            if r.returncode: raise SystemExit(f'SHELLCHECK_BLOCK_{i}: '+r.stdout+r.stderr)
        print('R7_SELF_ACTIONLINT_AND_SHELLCHECK=PASS; blocks='+str(len(blocks)))
        PY_R7_SHELLCHECK
        python3 - <<'PY_R7_EXTRACT'
        from pathlib import Path
        import hashlib,os,stat,zipfile
        src=Path(os.environ['GITHUB_WORKSPACE'])/'project'/os.environ['R7_PACKAGE_NAME']
        out=Path(os.environ['R7_DIR'])
        expect={'r7_walt_interface_audit.py','test_r7_walt_interface_audit.py',
                'OEM_VEUX_5_4_274.config','R7_START_HIER_DE.txt','R7_TEST_LOG.txt'}
        if out.exists() or out.is_symlink():raise SystemExit('R7_WORK_DIR_EXISTS')
        with zipfile.ZipFile(src) as z:
            members=z.infolist(); names=[m.filename for m in members]
            if set(names)!=expect|{'SHA256SUMS.txt'} or len(names)!=len(set(names)):
                raise SystemExit('R7_ZIP_MEMBER_SCOPE_INVALID')
            if z.testzip():raise SystemExit('R7_ZIP_CRC_FAILED')
            for m in members:
                if m.is_dir() or '/' in m.filename or chr(92) in m.filename or m.filename.startswith('.') or stat.S_IFMT(m.external_attr>>16)==stat.S_IFLNK:
                    raise SystemExit('R7_UNSAFE_MEMBER:'+m.filename)
            pins={}
            for line in z.read('SHA256SUMS.txt').decode().splitlines():
                h,n=line.split('  ',1)
                if n in pins or len(h)!=64 or any(c not in '0123456789abcdef' for c in h):
                    raise SystemExit('R7_MANIFEST_FORMAT_ERROR')
                pins[n]=h
            if set(pins)!=expect:raise SystemExit('R7_MANIFEST_SCOPE_INVALID')
            for n in expect:
                if hashlib.sha256(z.read(n)).hexdigest()!=pins[n]:raise SystemExit('R7_SHA256_MISMATCH:'+n)
            out.mkdir()
            for n in expect:(out/n).write_bytes(z.read(n))
            for n in ('r7_walt_interface_audit.py','test_r7_walt_interface_audit.py'):
                compile(z.read(n),n,'exec')
        print('R7_ZIP_MANIFEST_SYNTAX=PASS')
        PY_R7_EXTRACT
        if ! command -v clang >/dev/null; then echo 'R7_CLANG_MISSING_NO_DIAGNOSTIC_APPROVAL' >&2; exit 2; fi
        python3 -m unittest discover -s "$R7_DIR" -p test_r7_walt_interface_audit.py -v
        echo 'R7_MODEL_NEGATIVE_TESTS=PASS'
    - name: 'R8 pinned OEM-source patch preflight: actionlint, ShellCheck, 30 negative and compiler regression tests'
      shell: bash
      timeout-minutes: 3
      run: |
        set -euo pipefail
        r8_zip="project/$R8_PACKAGE_NAME"
        r8_yaml='project/.github/workflows/VEUX_OEM_WALT_R8_EXACT_OEM_INTERFACE_BRIDGE.yml'
        test -s "$r8_zip" && test ! -L "$r8_zip"
        test -s "$r8_yaml" && test ! -L "$r8_yaml"
        printf '%s  %s\n' "$R8_PACKAGE_SHA256" "$r8_zip" | sha256sum -c -
        "$RUNNER_TEMP/veux-p11-actionlint/actionlint" -oneline "$r8_yaml"
        python3 - <<'PY_R8_SHELLCHECK'
        from pathlib import Path
        import yaml,subprocess
        p=Path('project/.github/workflows/VEUX_OEM_WALT_R8_EXACT_OEM_INTERFACE_BRIDGE.yml')
        y=yaml.safe_load(p.read_text())
        blocks=[s['run'] for j in y['jobs'].values() for s in j['steps'] if isinstance(s.get('run'),str)]
        if len(blocks)<15:raise SystemExit('R8_YAML_MISSING_SHELL_BLOCKS')
        for i,script in enumerate(blocks,1):
            r=subprocess.run(['shellcheck','--shell=bash','--severity=warning','-'],input=script,text=True,capture_output=True)
            if r.returncode:raise SystemExit('R8_SHELLCHECK_BLOCK_'+str(i)+': '+r.stdout+r.stderr)
        print('R8_SELF_ACTIONLINT_AND_SHELLCHECK=PASS; RUN_BLOCKS='+str(len(blocks)))
        PY_R8_SHELLCHECK
        python3 - <<'PY_R8_EXTRACT'
        from pathlib import Path,PurePosixPath
        import hashlib,os,stat,zipfile
        src=Path(os.environ['GITHUB_WORKSPACE'])/'project'/os.environ['R8_PACKAGE_NAME']
        out=Path(os.environ['R8_DIR'])
        expect={
         'r8_walt_oem_interface_gate.py','test_r8_walt_oem_interface_gate.py',
         'R8_WALT_OEM_INTERFACE_BRIDGE.patch','R8_START_HIER_DE.txt','R8_TEST_LOG.txt',
         'fixtures/r6/source/kernel/sched/sched.h','fixtures/r6/R6_SOURCE_GATE.json',
         'fixtures/r7/R7_WALT_INTERFACE_AUDIT.json','fixtures/OEM_VEUX_5_4_274.config',
        }
        if out.exists() or out.is_symlink():raise SystemExit('R8_OUTPUT_PATH_EXISTS')
        with zipfile.ZipFile(src) as z:
            members=z.infolist()
            names=[m.filename for m in members]
            if len(names)!=len(set(names)) or set(names)!=expect|{'SHA256SUMS.txt'}:
                raise SystemExit('R8_ZIP_MEMBERS_DRIFT')
            if z.testzip():raise SystemExit('R8_CRC_FAILURE')
            for m in members:
                p=PurePosixPath(m.filename)
                if p.is_absolute() or '..' in p.parts or chr(92) in m.filename or m.is_dir() or stat.S_IFMT(m.external_attr>>16)==stat.S_IFLNK:
                    raise SystemExit('R8_UNSAFE_ZIP_MEMBER:'+m.filename)
            pins={}
            for line in z.read('SHA256SUMS.txt').decode().splitlines():
                h,n=line.split('  ',1)
                if n in pins or len(h)!=64 or any(c not in '0123456789abcdef' for c in h):
                    raise SystemExit('R8_MANIFEST_FORMAT_DRIFT')
                pins[n]=h
