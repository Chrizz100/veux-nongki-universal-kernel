name: VEUX R13 CASS · SUSFS 2.4 R3 Binärabgleich · NOFLASH

'on':
  workflow_dispatch:
  push:
    branches:
      - audit/r13-r3-binaerabgleich-45865492011
    paths:
      - .github/workflows/VEUX_R13_CASS_SUSFS24_R3_BINAERVERGLEICH_NOFLASH.yml

permissions:
  contents: read

jobs:
  befehlsdiagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      KBUILD_JOBS: '4'
      LLDB: lldb-19
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: R3 MAIN auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: d1443e718169756c6b5a265a2648cb66399bbec1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /VEUX_R13_CASS_SUSFS24_R3_MAIN.zip
      - name: Basis des bestätigten GitHub-Baus auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 55908d3ae455e97fb3da22edaed82ecebdcd9e3b
          path: r13-basis
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /VEUX_R13_CASS_SUSFS24_MAIN.zip
      - name: Archive verifizieren und Diagnosekorrektur vorbereiten
        env:
          R3_MAIN_SHA256: '7b5f2bf93e56c06e94396830044daee89419d0530341fdacb7b06e58771e357c'
          BASE_MAIN_SHA256: '2d21261d1372dba8ebe9ace382987aecb63829ec42b4c830dde72e2eedf541e9'
        run: |
          set -euo pipefail
          baseline=r13-basis/VEUX_R13_CASS_SUSFS24_MAIN.zip
          delta=VEUX_R13_CASS_SUSFS24_R3_MAIN.zip
          printf '%s  %s\n' "$BASE_MAIN_SHA256" "$baseline" "$R3_MAIN_SHA256" "$delta" | sha256sum -c -
          kit="$RUNNER_TEMP/veux-kit"
          fix="$RUNNER_TEMP/veux-statuskorrektur"
          unzip -q "$baseline" -d "$kit"
          unzip -q "$delta" -d "$fix"
          git -C "$kit" apply "$fix/patches/Buildpruefung.patch"
          install -m 644 "$fix/patches/R13-SUSFS-Statusantwort.patch" "$kit/patches/"
          install -m 644 "$fix/referenz/Statuskorrektur.git-tree" "$kit/referenz/"
          install -m 644 "$fix/tools/status_response.py" "$kit/tools/"
          install -m 644 "$fix/patches/R13-SUSFS-Befehlsdiagnose.patch" "$kit/patches/"
          install -m 644 "$fix/referenz/Befehlsdiagnose.git-tree" "$kit/referenz/"
          install -m 644 "$fix/tools/dispatch_status.py" "$kit/tools/"
      - name: Bau- und Debugwerkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bc binutils-aarch64-linux-gnu bison build-essential cpio flex libelf-dev libssl-dev lldb-19 m4 zstd
      - name: Gepinnte Android-Toolchain wiederverwenden
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/veux-clang
          key: veux-r13-clang-r416183b-0a90693130898d6f98a76538086247b374d4a57f
      - name: Android-Clang laden und prüfen
        run: |
          set -euo pipefail
          clang="$RUNNER_TEMP/veux-clang"
          kit="$RUNNER_TEMP/veux-kit"
          if ! test -x "$clang/bin/clang"; then
            bash "$kit/tools/toolchain.sh" "$clang"
          fi
          python3 "$kit/tools/treehash.py" "$clang"
      - name: Befehlsdiagnose bauen und den gelinkten Kernel prüfen
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/veux-r13-statuskorrektur"
          mkdir -p "$work/evidence"
          bash "$RUNNER_TEMP/veux-kit/build.sh" "$work" "$RUNNER_TEMP/veux-clang" 2>&1 \
            | tee "$work/evidence/Bau-und-Tests.log"
          printf '%s\n' "SUSFS-Befehlsdiagnose und 10 Statuseinträge im gelinkten Kernel geprüft." >> "$GITHUB_STEP_SUMMARY"
      - name: Bauprotokoll und Prüfnachweise sichern
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: VEUX-R13-CASS-SUSFS24-R3-Pruefung-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/veux-r13-statuskorrektur/evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: ARM64-Image und Debug-ELF sichern
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/veux-r13-statuskorrektur/out"
          packed="$RUNNER_TEMP/veux-r3-binaerabgleich"
          mkdir -p "$packed"
          for file in "$out/arch/arm64/boot/Image" "$out/vmlinux" "$out/arch/arm64/boot/dts/vendor/xiaomi/veux.dtb"; do
            name=${file##*/}
            hash=$(sha256sum "$file")
            printf '%s  %s\n' "${hash%% *}" "$name" >> "$packed/SHA256SUMS"
            zstd -q -T2 -8 "$file" -o "$packed/$name.zst"
          done
          cp "$RUNNER_TEMP/veux-r13-statuskorrektur/evidence/R13-SUSFS24-Kernelpruefung.json" "$packed/"
          printf '%s\n' 'Source commit d1443e718169756c6b5a265a2648cb66399bbec1' \
            'Original GitHub run 45865492011' "Replay GitHub run $GITHUB_RUN_ID" > "$packed/Herkunft.txt"
      - name: Binärdateien als Prüfartefakt hochladen
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: VEUX-R13-CASS-SUSFS24-R3-Binaerabgleich-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/veux-r3-binaerabgleich/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
