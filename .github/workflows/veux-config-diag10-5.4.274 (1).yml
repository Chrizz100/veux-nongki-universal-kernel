tory\')\n    e.require(jobs > 0, \'jobs must be positive\')\n    targets = authenticate()\n    e.require(not e.git(e.REPO, \'status\', \'--porcelain\'), \'temporary project must be clean\')\n    current_hash = e.digest(e.REPO / r.CURRENT)\n    root.mkdir(parents=True)\n    e.write_json(root / \'bundle/targets.json\', targets)\n    args = argparse.Namespace(kernel=KERNEL, bundle=root/\'bundle\', work=root/\'builds\'/KERNEL,\n        public=root/\'candidate\', overlays=root/\'overlays\', jobs=jobs)\n    output = os.environ.pop(\'GITHUB_OUTPUT\', None)\n    try:\n        with audit.compiler_audit(root/\'config-reports\'):\n            d.worker(args)\n        result_path = args.public / \'RESULT.json\'\n        result = json.loads(result_path.read_text())\n        e.require(all(result[k] for k in (\'compile\', \'package\', \'static_boot\')), \'release gate failed\')\n        e.require(result[\'device_fixes\'] == f.expected(KERNEL), \'cumulative Diag08 proof missing\')\n        report = json.loads((root/\'config-reports/CONFIG-AUDIT.json\').read_text())\n        e.require(result.get(\'config_audit\') == report and report.get(\'status\') == \'PASS\', \'config audit missing\')\n        e.require(report.get(\'vintf_kernel\', {}).get(\'status\') == \'PASS\'\n                  and report[\'vintf_kernel\'].get(\'requirements\') == 261, \'ROM kernel compatibility proof missing\')\n        e.require(report.get(\'image_sha256\') == result[\'image_sha256\'], \'config audit image mismatch\')\n        stem = result[\'artifact_name\'] + \'_ConfigDiag10\'\n        for key, suffix in ((\'package_file\',\'_AnyKernel.zip\'), (\'boot_file\',\'_boot.img\')):\n            (args.public/result[key]).rename(args.public/(stem+suffix))\n            result[key] = stem+suffix\n        e.require(e.digest(args.public/result[\'package_file\']) == result[\'package_sha256\'], \'AK3 drift\')\n        r.verify_boot(result, args.public)\n        result.update(artifact_name=stem, diagnostic_id=\'ConfigDiag10\',\n            baseline_diag08_run=\'36698563062\', regular_patchset=regular_baseline()[\'id\'],\n            baseline_regular_run=json.loads((e.REPO/r.CURRENT).read_text())[\'run_id\'],\n            base_repository_sha=os.environ.get(\'GITHUB_SHA\', \'\'),\n            repository_mutation=False, device=False)\n        e.write_json(result_path, result)\n        (args.public/\'SHA256SUMS.txt\').write_text(\'\'.join(\n            f\'{e.digest(p)}  {p.name}\\n\' for p in sorted(args.public.iterdir())\n            if p.is_file() and p.name != \'SHA256SUMS.txt\'))\n        authenticate()\n        e.require(e.digest(e.REPO/r.CURRENT) == current_hash, \'build reference changed\')\n        e.require(not e.git(e.REPO, \'status\', \'--porcelain\'), \'temporary project changed during build\')\n        shutil.move(str(args.public), root/\'public\')\n        if output:\n            with open(output, \'a\') as out:\n                out.write(\'artifact_name=\' + stem + \'\\n\')\n        print(\'CONFIG_DIAG10=COMPILE_PACKAGE_STATIC_PASS; DEVICE_PASS=NO\', flush=True)\n    except Exception as exc:\n        e.write_json(root/\'builds/diagnostics/BLOCKED.json\', {\'reason\': str(exc), \'device\': False})\n        raise\n    finally:\n        if output:\n            os.environ[\'GITHUB_OUTPUT\'] = output\n\n\ndef main():\n    p=argparse.ArgumentParser(description=__doc__)\n    p.add_argument(\'command\', choices=(\'check\',\'build\'))\n    p.add_argument(\'--root\',type=Path)\n    p.add_argument(\'--jobs\',type=int,default=4)\n    a=p.parse_args()\n    if a.command==\'check\':\n        authenticate()\n        print(\'DIAG10_AUTHENTICATION=PASS; pinned components; cumulative Diag08; real embedded config; captured ROM requirements; enforcing CFI\')\n    else:\n        if a.root is None:p.error(\'--root is required for build\')\n        run(a.root,a.jobs)\n\nif __name__==\'__main__\':\n    main()\n'
