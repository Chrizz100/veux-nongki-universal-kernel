name: VEUX 5.4.274 Charger Diagnostic 03 - Driver hardening
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: veux-charger-hardening-5.4.274
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  diagnostic:
    name: Build and validate charger lifecycle and bus errors
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc binutils bison build-essential ca-certificates curl dwarves file flex git jq libelf-dev libncurses-dev libssl-dev perl python3 python3-venv python3-yaml rsync unzip zip xz-utils zstd
          python3 -m venv "$RUNNER_TEMP/veux-python"
          "$RUNNER_TEMP/veux-python/bin/python" -m pip install ruamel.yaml==0.19.1 PyYAML==6.0.3
      - name: Prepare and authenticate the charger corrections
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/veux-charger-project"
          git clone --quiet --no-hardlinks "$GITHUB_WORKSPACE" "$PROJECT"
          git -C "$PROJECT" checkout --quiet --detach "$GITHUB_SHA"
          cd "$PROJECT"
          "$RUNNER_TEMP/veux-python/bin/python" common/scripts/veux_charger_diagnostic.py check
          "$RUNNER_TEMP/veux-python/bin/python" - <<'PY_PREPARE'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          repo = Path.cwd()
          runner = repo / 'common/scripts/veux_charger_diagnostic.py'
          expected = '3e887ffc532064944376a69034e1216423d63274'
          actual = subprocess.check_output(['git', 'hash-object', str(runner)], text=True).strip()
          if actual != expected:
              raise SystemExit('BLOCKED: diagnostic runner differs from the reviewed baseline')
