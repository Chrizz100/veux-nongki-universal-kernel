                  expected='fake_status' if _elig(uid,running) and fake else 'stock_status'
                  check(actual[0]==expected,'STATUS_MODEL_INCONSISTENT')
                  entries.append({'group':'status','uid':uid,'running':running,'fake':fake,'stock_rc':rc,'model':actual[0]})
              access_difference=0
              for uid,running,seq,permission in itertools.product((0,9999,10000,12000),(False,True),(0,1,3,100),(0,-13)):
                  old=model_access(uid,running,permission,0,0,seq)
                  new=model_access(uid,running,permission,0,0,seq,native=True)
                  mismatched=old!=new
                  if mismatched: access_difference+=1
                  entries.append({'group':'access','uid':uid,'running':running,'computed_seq':seq,
                                  'permission_rc':permission,'legacy':old[0],
                                  'seqno_model_difference':mismatched})
              proc_difference=0
              for uid,running,name,fake_rc,real_rc in itertools.product((0,9999,10000,12000),(False,True),('current','exec'),(0,-22),(0,-22)):
                  old=model_setprocattr(uid,running,name,fake_rc,real_rc,0,True,123)
                  new=model_setprocattr(uid,running,name,fake_rc,real_rc,0,True,123,native=True)
                  mismatched=(old[0]!=new[0] and _elig(uid,running) and name=='current')
                  if mismatched:proc_difference+=1
                  entries.append({'group':'setprocattr','uid':uid,'running':running,'name':name,
                                  'fake_rc':fake_rc,'stock_rc':real_rc,
                                  'different_paths':mismatched})
              ctx_failures=0
              for uid,running,permission,conversion,too_big in itertools.product((0,9999,10000,12000),(False,True),(0,-13),(0,-22),(False,True)):
                  x=model_context(uid,running,permission,conversion,0,4097 if too_big else 33)
                  if x[0] not in ('stock_handoff','context_length'): ctx_failures+=1
                  entries.append({'group':'context','uid':uid,'running':running,'permission':permission,
                                  'conversion':conversion,'too_big':too_big,'model':x[0]})
              return entries,access_difference,proc_difference,ctx_failures
          
          
          def evaluate(mainzip,p5_zip,p5_json,host_bytes,ksu_bytes):
              check(p5_json.get('result')=='SOURCE_FUNCTIONAL_DELTA_MAPPED_WITH_UNPROVEN_RUNTIME_PARITY' and
                    p5_json.get('functional_equivalence_proven') is False and
                    p5_json.get('final_build_approved') is False and
                    p5_json.get('source_changes') is False and
                    p5_json.get('susfs_510_head')==p5.SUSFS510,
                    'P5_BASELINE_CONTRACT_DRIFT')
              check(p5.blob_sha1(host_bytes)==p5.EXPECTED['susfs_host_git_blob'] and
                    p5.blob_sha1(ksu_bytes)==p5.EXPECTED['susfs_ksu_git_blob'],
                    'SUSFS_UPSTREAM_GIT_BLOB_MISMATCH')
              legacy=p5.take(mainzip,LEGACY_FILE,p5.EXPECTED['r4_bakasu']).decode()
              hosts=host_bytes.decode()
              ksus=ksu_bytes.decode()
              anchors=verify_source_anchors(legacy,hosts,ksus)
              with p5_zip as z:
                  check(z.testzip() is None, 'P5_ARCHIVE_CORRUPT')
                  old=p5.load_json(p5.take(z,'P5_FUNCTIONAL_SOURCE_AUDIT.json'),'P5_ARCHIVED_JSON')
                  check(old==p5_json,'P5_ARCHIVED_REPORT_MISMATCH')
              rows,access_delta,proc_delta,context_errors=scenarios()
              check(len(rows)==224, 'P6_SCENARIO_COUNT_DRIFT')
              check(access_delta>0 and proc_delta>0, 'MODEL_EXPECTED_DIFFERENCES_MISSING')
              return {'schema':1,'mode':'P6_BOUNDED_CONTROL_FLOW_MODEL_NOT_KERNEL_EXECUTION',
                      'result':'P6_MODELS_AND_SOURCE_ANCHORS_VERIFIED_RUNTIME_UNPROVEN',
                      'kernel':'5.4.274','r4_commit':p5.R4,'p3_commit':p5.P3,
                      'susfs_510_head':p5.SUSFS510,'bakasu':'35234','nomount_dev':'8175c9dc',
                      'source_contracts':anchors,
                      'model_scenarios':{'total':len(rows),'status':32,'access':64,'setprocattr':64,'context':64,
                                         'access_seqno_differences':access_delta,
                                         'setprocattr_path_differences':proc_delta,
                                         'context_error_paths':context_errors},
                      'source_changes':False,'kernel_build':False,'device_tested':False,
                      'runtime_equivalence_proven':False,'safe_to_apply_native_510_patches':False,
                      'final_build_approved':False,'flash_approved':False,'brene_changed':False,
                      'limitations':['Control-flow models are inferred from pinned source anchors, not compiled code',
                                     'Kernel-side lock ordering, policy memory lifetime and races are unverified',
                                     'SELinux sequence/AVC outcomes and setprocattr transitions require real target tests',
                                     'P3 preflight export is not byte-identical to the complete final R4 source'],
                      'decision':'KEEP_R4_INTACT; FOLLOW_WITH_SEPARATE_NONFLASH_COMPILATION_ONLY_AFTER_IMPLEMENTATION_REVIEW'}
          
          
          def main(args=None):
              ap=argparse.ArgumentParser()
              for name in ('r4-main','p5-zip','p5-json','host','ksu','output'):
                  ap.add_argument('--'+name,required=True,type=Path)
              ns=ap.parse_args(args)
              try:
                  p5.read_file(ns.p5_zip,P5_ARCHIVE_SHA256,'P5_ARTIFACT')
                  with zipfile.ZipFile(ns.r4_main) as mainzip, zipfile.ZipFile(ns.p5_zip) as p5zip:
                      check(mainzip.testzip() is None,'R4_MAIN_CORRUPT')
                      p5.read_file(ns.r4_main,p5.EXPECTED['r4_main_zip'],'R4_MAIN')
                      report=evaluate(mainzip,p5zip,json.loads(ns.p5_json.read_text()),
                                      ns.host.read_bytes(),ns.ksu.read_bytes())
                  ns.output.parent.mkdir(parents=True,exist_ok=True)
                  ns.output.write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
                  print('P6_SOURCE_GUIDED_BEHAVIOR_MODELS=PASS; SCENARIOS=224; '
                        'KERNEL_BUILD=NO; RUNTIME_PARITY=UNPROVEN; FINAL_BUILD=BLOCKED; FLASH=NO')
                  return 0
              except (GateBlocked,p5.GateBlocked,ValueError,UnicodeError,FileNotFoundError,zipfile.BadZipFile) as exc:
                  print('P6_GUARD_BLOCKED:'+str(exc),file=sys.stderr)
                  return 1
          
          if __name__=='__main__':
              raise SystemExit(main())
