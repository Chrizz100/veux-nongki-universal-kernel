          LEGACY_FILE = 'evidence/BAKASU_R5S1_COMPILED_SELINUX_REFERENCE.c'
          
          class GateBlocked(ValueError):
              pass
          
          
          def check(cond, reason):
              if not cond:
                  raise GateBlocked(reason)
          
          
          def section(text, start, end, *, copies=1):
              check(text.count(start) == copies, 'SOURCE_ANCHOR_COUNT_DRIFT:'+start)
              i=text.index(start); j=text.find(end,i+len(start))
              check(j > i, 'SOURCE_END_ANCHOR_MISSING:'+end)
              return text[i:j]
          
          
          def contains_all(text, anchors, label):
              for anchor in anchors:
                  check(anchor in text,'SOURCE_SEMANTICS_DRIFT:'+label+':'+anchor)
          
          
          def _elig(uid, running):
              return uid >= 10000 and running
          
          
          def model_status(uid, running, fake_ready, stock_rc):
              if _elig(uid, running) and fake_ready:
                  return ('fake_status', 0)
              return ('stock_status', stock_rc)
          
          
          def model_context(uid, running, permission_rc, convert_rc, canonical_rc, canonical_len, limit=4096):
              if not _elig(uid,running): return ('stock_handoff', None)
              if permission_rc: return ('permission',permission_rc)
              if convert_rc: return ('backup_policy_sid',convert_rc)
              if canonical_rc: return ('backup_policy_context',canonical_rc)
              if canonical_len > limit: return ('too_long',-34)
              return ('context_length',canonical_len)
          
          
          def model_access(uid, running, permission_rc, first_sid_rc, second_sid_rc, computed_seqno, native=False):
              if not _elig(uid,running): return ('stock_handoff',None)
              if permission_rc: return ('permission',permission_rc)
              if first_sid_rc: return ('source_sid',first_sid_rc)
              if second_sid_rc: return ('target_sid',second_sid_rc)
              return ('avd_seqno',computed_seqno if native else 1)
          
          
          def model_setprocattr(uid, running, name, backup_rc, real_rc, permission_rc, can_alloc,
                                sid, bounded_rc=0, dyntransition_rc=0, ptrace_rc=0, native=False):
              if not _elig(uid,running) or name != 'current':
                  return ('stock_handoff', None)
              if native:
                  # This is ONLY the new 5.10 fake-policy precheck followed by the stock path.
                  if backup_rc: return ('fake_policy_reject',backup_rc)
                  if real_rc: return ('stock_policy_reject',real_rc)
                  return ('stock_continuation',None)
              if permission_rc: return ('legacy_permission',permission_rc)
              if backup_rc: return ('legacy_backup_policy',backup_rc)
              if not can_alloc: return ('legacy_allocation',-12)
              if sid == 0: return ('legacy_no_sid',-22)
              if bounded_rc: return ('legacy_bounded',bounded_rc)
              if dyntransition_rc: return ('legacy_dynamic',dyntransition_rc)
              if ptrace_rc: return ('legacy_ptrace',ptrace_rc)
              return ('legacy_commit_creds',0)
          
          
          def model_toggle(state, enable, install_rc=0):
              # Local source's ksu_selinux_hide_enabled assignment precedes enable attempt.
              enabled,running=state
              enabled=bool(enable)
