                                 'if (!ret)', 'ksu_selinux_hide_running = true;',
                                 'ksu_selinux_hide_disable();','ksu_selinux_hide_running = false;'], 'legacy_lifecycle')
              contains_all(unhook,['ksu_patch_text(context_write, &orig_context_write',
                                   'ksu_patch_text(access_write, &orig_access_write',
                                   'ksu_orig_setprocattr = NULL;'], 'legacy_unhook')
              contains_all(phase2,['initialize_fake_status();','if (fake_status)',
