          #!/usr/bin/env python3
          """VEUX P6: pinned-source guided, bounded deterministic models, no kernel execution.
          
          A model outcome is NOT equivalent to executing kernel C, proving SELinux safety,
          or establishing device/runtime or Flash-PASS. Never modify source trees.
