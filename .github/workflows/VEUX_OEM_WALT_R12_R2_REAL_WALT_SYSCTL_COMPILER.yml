      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_R12_R2_AST'
        import ast,os,pathlib,re,yaml
        workspace=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
        wf=workspace/'project/.github/workflows/VEUX_OEM_WALT_R12_R2_REAL_WALT_SYSCTL_COMPILER.yml'
        assert wf.is_file() and not wf.is_symlink()
        doc=yaml.safe_load(wf.read_text())
        pattern=re.compile(r"(?m)^python(?:3)?\s+-\s+<<-?\s*['\"]?([A-Za-z0-9_]+)['\"]?\s*$")
        checked=0
        for step in doc['jobs']['p11-exact-source']['steps']:
            body=step.get('run','')
            if not isinstance(body,str):
                continue
            for match in pattern.finditer(body):
                marker=match.group(1)
                tail=body[match.end():]
                end=re.search(r'(?m)^'+re.escape(marker)+r'\s*$',tail)
                if end is None:
                    raise SystemExit('R12_R2_PYTHON_HEREDOC_END_MISSING:'+step['name']+':'+marker)
                code=tail[:end.start()].lstrip('\n')
                try:
                    ast.parse(code,filename=step['name']+'/'+marker)
                except SyntaxError as exc:
                    raise SystemExit('R12_R2_PYTHON_SYNTAX_FAILURE:'+step['name']+':'+str(exc))
                checked+=1
        if checked<25:
            raise SystemExit('R12_R2_TOO_FEW_PYTHON_HEREDOCS:'+str(checked))
        print('R12_R2_EMBEDDED_PYTHON_AST=PASS; CHECKED='+str(checked))
        PY_R12_R2_AST
