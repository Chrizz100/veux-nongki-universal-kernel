        from pathlib import Path
        import json,os,hashlib
        root=Path(os.environ['R9_SNAPSHOT']);out=Path(os.environ['R10_OUT'])
        r=json.loads((out/'R10_SOURCE_GATE.json').read_text())
        if r['status']!='R10_OEM_WALT_SOURCE_API_STAGED_NOT_COMPILED':raise SystemExit('R10_NOT_STAGED')
        if r['modified_files']!=['include/linux/sched.h','kernel/sched/sched.h','kernel/sched/core.c']:
            raise SystemExit('R10_SCOPE_DRIFT')
        for path,digest in r['after_sha256'].items():
            if hashlib.sha256((root/path).read_bytes()).hexdigest()!=digest:raise SystemExit('R10_POSTIMAGE_DRIFT:'+path)
        if any(r[k] for k in ('flash_allowed','vendor_abi_proven','all_objects_compiled','kernel_image_built','brene_changed')):
            raise SystemExit('R10_FALSE_APPROVAL')
        print('R10_GENUINE_XIAOMI_API_SOURCE_STAGED=PASS; NO_COMPILE_YET; FLASH=NO')
        PY_R10_GATE
        # Run authentic original R6/R8 regression fixtures, only after their source gates passed.
        mkdir -p "$R10_DIR/fixtures"
        cp "$R6_OUT/source/include/linux/sched.h" "$R10_DIR/fixtures/R6_linux_sched.h"
        cp "$R8_OUT/source/kernel/sched/sched.h" "$R10_DIR/fixtures/R8_sched.h"
        python3 -m unittest discover -s "$R10_DIR" -p test_r10_oem_port.py -v
    - name: R9 install identical historical Android Clang r416183b toolchain
      shell: bash
      timeout-minutes: 12
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ca-certificates cpio curl flex git libelf-dev \
          libncurses-dev libssl-dev patch python3 python-is-python3 rsync xz-utils zstd
        # Same pinned Android clang-r416183b as successful P11 R4 build 38630203122.
        # Pinned Google git commit (not a moving branch); archive SHA is reported.
        mkdir -p "$R9_TOOLCHAIN"
        curl --fail --location --retry 4 --connect-timeout 30 --max-time 420 \
          'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/aa2e4a514a6c85eebcc4a27149eaf9244e951a1e/clang-r416183b.tar.gz' \
          --output "$RUNNER_TEMP/veux-r9-clang-r416183b.tar.gz"
        sha256sum "$RUNNER_TEMP/veux-r9-clang-r416183b.tar.gz" | tee "$R9_REPORT/R9_PINNED_TOOLCHAIN_ARCHIVE.sha256"
        tar -xzf "$RUNNER_TEMP/veux-r9-clang-r416183b.tar.gz" -C "$R9_TOOLCHAIN"
        "$R9_TOOLCHAIN/bin/clang" --version | grep -F 'r416183b'
        "$R9_TOOLCHAIN/bin/clang" --version | grep -F '12.0.5'
        echo 'R9_HISTORICAL_ANDROID_CLANG=AVAILABLE'
