    - name: R55H17-R2 pin and verify official BakaSU 35252 and NoMount 2.1.1/v22 source
      if: ${{ inputs.enable_build == true }}
      shell: bash
      run: |
        set -euo pipefail
        fetch_exact() {
          local url="$1" sha="$2" dest="$3"
          test ! -e "$dest"
          git clone --quiet "$url" "$dest"
          git -C "$dest" checkout --quiet --detach "$sha"
          test "$(git -C "$dest" rev-parse HEAD)" = "$sha"
          test -z "$(git -C "$dest" status --porcelain --untracked-files=all)"
        }
        fetch_exact https://github.com/Baka-SU/BakaSU.git d5e9e025b8b49155f8014684d64c91742b465f65 "$RUNNER_TEMP/BakaSU35252"
        fetch_exact https://github.com/maxsteeel/nomount.git bf1847f98fed382369c43bfd652cd93774b9b8e3 "$RUNNER_TEMP/NoMount22"
        fetch_exact https://github.com/maxsteeel/nomount.git 7046c7ad3ee0bf4ae66e80f6b93b1e30db0cb4e3 "$RUNNER_TEMP/NoMountR5S2"
        echo 'R55H17_R2_PINNED_OFFICIAL_SOURCES=PASS; NO_FLASH'
    - name: R55H17-R2 attempt authentic BakaSU 35252 3way source merge and NoMount v22 delta; preserve CASS ABI - NO FLASH
      if: ${{ inputs.enable_build == true }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/veux-r55h17-r2-evidence"
        cat > "$RUNNER_TEMP/veux-r55h17-r2-port.py" <<'PY_R55H17_PORT'
        #!/usr/bin/env python3
        """VEUX R55H17-R2: fail-closed BakaSU 35252 / NoMount v22 source-port attempt.

        Original R5S2 build tree is NEVER modified.  The actual BakaSU 35252 Git source
        and the authentic 5.4 VEUX customization are combined using Git
        cherry-pick --no-commit; if Git reports conflicts, the outcome is BLOCKED and no kernel is built.
        A successful source merge is NOT evidence of kernel compilation or safe boot.
        """
        from __future__ import annotations
        import argparse
        import hashlib
        import json
        import os
        from pathlib import Path
        import shutil
        import subprocess
        import sys

        R5S2_CONFIG = '405a4b3384212aa693ca2ce19f4c1ebef74f9cfc2568ce5da2107efe84fc0ff4'
        R5S2_SYMVERS = '6b660c141f99cbe5d45c4e84bfb83498553a5b5e68e273c26afa17b1fdeaf0ec'
        R5S2_RELEASE = '5.4.274-qgki-g82179e362f33'
        R5S2_BAKASU_BASE = 'f308ed0936bdd31163cb53da3f42bc7a698f5512'
        BAKASU35252 = 'd5e9e025b8b49155f8014684d64c91742b465f65'
        NOMOUNT_OLD = '7046c7ad3ee0bf4ae66e80f6b93b1e30db0cb4e3'
        NOMOUNT_V22 = 'bf1847f98fed382369c43bfd652cd93774b9b8e3'
        PINS = {'r5s2_cass_config_sha256':R5S2_CONFIG,'r5s2_module_symvers_sha256':R5S2_SYMVERS,
                'kernel_release':R5S2_RELEASE,'bakasu_original_upstream':R5S2_BAKASU_BASE,
                'bakasu_target_commit':BAKASU35252,'nomount_old_commit':NOMOUNT_OLD,
                'nomount_target_commit':NOMOUNT_V22,'susfs_version':'2.3.0','walt':False,
                'flash_allowed':False}

        class PortBlocked(RuntimeError): pass

        def need(condition:bool,why:str):
            if not condition: raise PortBlocked(why)

        def sha_file(path:Path):
            h=hashlib.sha256()
            with path.open('rb') as f:
                for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
            return h.hexdigest()

        def run(*args,cwd=None,ok=True,input_bytes=None):
            p=subprocess.run(args,cwd=cwd,input=input_bytes,capture_output=True,timeout=180)
            if ok and p.returncode:
                raise PortBlocked('CMD_FAIL='+repr(args[:4])+' '+p.stderr.decode(errors='replace')[-1000:])
            return p

        def g(path:Path,*args,ok=True,input_bytes=None):
            return run('git','-C',str(path),*args,ok=ok,input_bytes=input_bytes)

        def out(p):return p.stdout.decode('utf8',errors='replace').strip()

        def tree_hash(root:Path):
            h=hashlib.sha256()
            for rel in ('Makefile','fs/Kconfig','fs/Makefile','kernel/sched/fair.c'):
                p=root/rel;need(p.is_file(),'MISSING_KERNEL_FILE_'+rel)
                h.update(rel.encode()+b'\0'+sha_file(p).encode()+b'\n')
            return h.hexdigest()

        def audit_kernel(kernel:Path):
            need(kernel.name=='kernel' and kernel.parent.name=='source-work' and
                 kernel.parent.parent.name=='5.4.274' and (kernel/'Makefile').is_file(),
                 'NOT_EXACT_R5S2_COMPILED_SOURCE_LAYOUT')
            build=kernel.parent.parent/'build'
            cfg=build/'.config'; sym=build/'Module.symvers'; release=build/'include/config/kernel.release'
            for p in (cfg,sym,release):need(p.is_file() and not p.is_symlink(),'MISSING_R5S2_BUILD_PROOF_'+p.name)
            need(sha_file(cfg)==R5S2_CONFIG,'R5S2_CASS_CONFIG_HASH_CHANGED')
            need(sha_file(sym)==R5S2_SYMVERS,'R5S2_MODULE_ABI_HASH_CHANGED')
            need(release.read_text().strip()==R5S2_RELEASE,'R5S2_RELEASE_CHANGED')
            b=cfg.read_text()
            for token in ('CONFIG_SCHED_CASS=y','CONFIG_NR_CPUS=8','CONFIG_MODULES=y','CONFIG_MODVERSIONS=y'):
                need(token in b,'R5S2_CONFIG_GATE_'+token)
            need('CONFIG_SCHED_WALT=y' not in b,'WALT_MUST_REMAIN_DISABLED')
            need((kernel/'drivers/kernelsu').is_symlink(),'NO_ORIGINAL_KSU_LINK')
            old=kernel/'KernelSU';need(old.is_dir() and (old/'.git').is_dir(),'NO_GENUINE_R5S2_KSU_GIT')
            need((kernel/'drivers/kernelsu').resolve()==(old/'kernel').resolve(), 'R5S2_KSU_LINK_CHANGED')
            return {'config_sha256':sha_file(cfg),'symvers_sha256':sha_file(sym),
                    'release':release.read_text().strip(),'kernel_guard_sha256':tree_hash(kernel),
                    'original_kernel_source_path':str(kernel)}

        def validate_provider(path:Path,head:str):
            need((path/'.git').exists(),'SOURCE_PROVIDER_NOT_GIT_'+path.name)
            need(out(g(path,'rev-parse','HEAD'))==head,'PIN_MISMATCH_'+path.name)
            need(not out(g(path,'status','--porcelain','--untracked-files=all')),
                 'DIRTY_OFFICIAL_PROVIDER_'+path.name)

        def copy_donor(donor:Path,to:Path):
            need(not to.exists() and not to.is_symlink(),'CANDIDATE_EXISTS')
            shutil.copytree(donor,to,symlinks=True)
            need(out(g(to,'rev-parse','HEAD'))==BAKASU35252,'COPIED_UPSTREAM_HEAD_CHANGED')
            return to

        def path_list(raw:bytes):
            return sorted({p.strip() for p in raw.decode(errors='replace').splitlines() if p.strip()})

        def port_bakasu(legacy:Path,donor:Path,dst:Path,root:Path):
            need((legacy/'.git').is_dir(),'LEGACY_R5S2_GIT_NOT_FOUND')
            need(out(g(legacy,'rev-parse','HEAD^'))==R5S2_BAKASU_BASE,'LEGACY_R5S2_HISTORY_CHANGED')
            need(out(g(legacy,'rev-list','--count','HEAD'))=='4534','LEGACY_R5S2_HISTORY_COUNT_CHANGED')
            old_sha=out(g(legacy,'rev-parse','HEAD'))
            need(not out(g(legacy,'status','--porcelain','--untracked-files=all')),'LEGACY_DIRTY')
            preimage=path_list(g(legacy,'diff','--name-only',R5S2_BAKASU_BASE,'HEAD','--','kernel','uapi').stdout)
            need('kernel/feature/selinux_hide.c' in preimage and 'kernel/Kbuild' in preimage,
                 'MISSING_R5S2_REVIEWED_VEUX_DELTA')
            need(all(x.startswith(('kernel/','uapi/')) for x in preimage),'LEGACY_OUT_OF_SCOPE')
            patch=g(legacy,'diff','--binary',R5S2_BAKASU_BASE,'HEAD','--','kernel','uapi').stdout
            need(len(patch)>100,'INVALID_ORIGINAL_VEUX_PATCH')
            (root/'R5S2_ORIGINAL_VEUX_CUSTOMIZATION.patch').write_bytes(patch)
            need(out(g(legacy,'rev-parse','HEAD'))==old_sha,'LEGACY_GIT_CHANGED')
            candidate=copy_donor(donor,dst)
            # Obtain exactly the old upstream commit, including its original blob base,
            # for Git's genuine 3-way merging. Never use patch(1) fuzz or --reject.
            fetch=g(candidate,'fetch','--quiet','--no-tags','origin',R5S2_BAKASU_BASE,ok=False)
            need(fetch.returncode==0,'OLD_UPSTREAM_PREIMAGE_NOT_FETCHABLE:'+fetch.stderr.decode(errors='replace')[-400:])
            need(out(g(candidate,'rev-parse','FETCH_HEAD'))==R5S2_BAKASU_BASE,'OLD_UPSTREAM_FETCH_MOVED')
            theirs=path_list(g(candidate,'diff','--name-only',R5S2_BAKASU_BASE,BAKASU35252,'--','kernel','uapi').stdout)
            overlaps=sorted(set(preimage)&set(theirs))
            (root/'BAKASU_SCOPE.json').write_text(json.dumps({
                'legacy_veux_commit':old_sha,'legacy_veux_patch_sha256':hashlib.sha256(patch).hexdigest(),
                'legacy_modified_paths':preimage,'official_updated_paths':theirs,
                'overlap_paths_requiring_three_way_merge':overlaps,
                'upstream_old':R5S2_BAKASU_BASE,'upstream_new':BAKASU35252,
                'official_changes_must_not_be_dropped':True},indent=2,sort_keys=True)+'\n')
            # Cherry-pick the ONE actual VEUX integration commit. This is Git's native
            # 3-way operation against its original parent, not a textual fuzzy patch.
            local_fetch=g(candidate,'fetch','--quiet','--no-tags',str(legacy),old_sha,ok=False)
            need(local_fetch.returncode==0 and out(g(candidate,'rev-parse','FETCH_HEAD'))==old_sha,
                 'VEUX_ORIGINAL_COMMIT_NOT_IMPORTED')
            applied=g(candidate,'cherry-pick','--no-commit',old_sha,ok=False)
            (root/'BAKASU_THREEWAY_STDOUT.txt').write_bytes(applied.stdout)
            (root/'BAKASU_THREEWAY_STDERR.txt').write_bytes(applied.stderr)
            need(applied.returncode==0,'BAKASU_35252_THREEWAY_CONFLICT_NO_CODE_REPLACED')
            need(out(g(candidate,'diff','--cached','--name-only'))!='','NO_REAL_BAKASU_PATCH_APPLIED')
            staged=path_list(g(candidate,'diff','--cached','--name-only').stdout)
            need(all(x.startswith(('kernel/','uapi/')) for x in staged),'CANDIDATE_UNREVIEWED_PATH')
            if 'kernel/Kbuild' in staged:
                k=(candidate/'kernel/Kbuild').read_text(errors='replace')
                need('KSU_VERSION' in k,'NEW_BAKASU_DYNAMIC_VERSION_GONE')
            g(candidate,'-c','user.name=VEUX CI Source Audit','-c','user.email=veux-ci@users.noreply.github.com',
              'commit','--quiet','-m','veux: preserve R5S2 CASS adaptations on BakaSU 35252')
            new_sha=out(g(candidate,'rev-parse','HEAD'))
            need(out(g(candidate,'rev-parse','HEAD^'))==BAKASU35252,'NEW_BAKASU_NOT_REAL_PARENT')
            result_patch=g(candidate,'diff','--binary',BAKASU35252,'HEAD','--','kernel','uapi').stdout
            (root/'R55H17_R2_CANDIDATE_VEUX_DELTA.patch').write_bytes(result_patch)
            need(not out(g(candidate,'status','--porcelain','--untracked-files=all')),'DIRTY_MERGED_CANDIDATE')
            return {'status':'BAKASU_THREEWAY_SOURCE_STAGE_PASS','official_commit':BAKASU35252,
                    'real_local_port_commit':new_sha,'official_commit_is_parent':True,
                    'old_customization_changes':len(preimage),'upstream_update_paths':len(theirs),
                    'overlap_paths':len(overlaps),'merged_paths':len(staged),
                    'new_compiler_test':'NOT_RUN','release_validated':False}

        def audit_nomount(old:Path,new:Path,root:Path):
            validate_provider(old,NOMOUNT_OLD);validate_provider(new,NOMOUNT_V22)
            paths=('kernel/src/nomount.c','kernel/src/nomount.h','kernel/src/Kconfig','kernel/src/Makefile')
            for p in paths:
                need((old/p).is_file() and (new/p).is_file(), 'NOMOUNT_MISSING_SOURCE_'+p)
            # Export the unmodified, genuine upstream kernel-source delta for review.
            fetched=g(new,'fetch','--quiet','--no-tags','origin',NOMOUNT_OLD,ok=False)
            need(fetched.returncode==0,'NOMOUNT_OLD_UPSTREAM_NOT_FETCHABLE')
            need(out(g(new,'rev-parse','FETCH_HEAD'))==NOMOUNT_OLD,'NOMOUNT_OLD_FETCH_CHANGED')
            nm_patch=g(new,'diff','--binary',NOMOUNT_OLD,NOMOUNT_V22,'--','kernel/src').stdout
            need(len(nm_patch)>100,'NOMOUNT_V22_SOURCE_DELTA_EMPTY')
            (root/'NOMOUNT_V22_OFFICIAL_UPDATE.patch').write_bytes(nm_patch)
            result={'status':'PINNED_NOMOUNT_V22_SOURCE_REVIEWED_NOT_YET_COMPILED',
                    'old_commit':NOMOUNT_OLD,'new_commit':NOMOUNT_V22,'kernel_sources':{}}
            for path in paths:
                result['kernel_sources'][path]={'old_sha256':sha_file(old/path),'new_sha256':sha_file(new/path),
                                                'changed':sha_file(old/path)!=sha_file(new/path)}
            need(result['kernel_sources']['kernel/src/nomount.c']['changed'], 'NOMOUNT_V22_NOT_ACTUAL_UPDATE')
            (root/'NOMOUNT_V22_SOURCE_SCOPE.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
            return result

        def main():
            ap=argparse.ArgumentParser()
            ap.add_argument('--kernel',type=Path,required=True)
            ap.add_argument('--bakasu',type=Path,required=True)
            ap.add_argument('--nomount-old',type=Path,required=True)
            ap.add_argument('--nomount-new',type=Path,required=True)
            ap.add_argument('--out',type=Path,required=True)
            args=ap.parse_args()
            d=args.out;d.mkdir(parents=True,exist_ok=True)
            (d/'SOURCE_PINS.json').write_text(json.dumps(PINS,indent=2,sort_keys=True)+'\n')
            report={'schema':1,'stage':'R55H17_R2_CASS_GENUINE_UPDATE_SOURCE_PORT',
                    'status':'BLOCKED','flash_allowed':False,'device_test':False,
                    'compiler_test':False,'kernel_image_generated':False,
                    'source_updates_staged':False,'all_device_source_files_unchanged':False}
            try:
                kernel=args.kernel.resolve(strict=True)
                before=audit_kernel(kernel);report['protected_baseline']=before
                validate_provider(args.bakasu,BAKASU35252)
                nm=audit_nomount(args.nomount_old,args.nomount_new,d)
                report['nomount']=nm
                br=port_bakasu(kernel/'KernelSU',args.bakasu,d/'bakasu35252-veux-candidate',d)
                report['bakasu']=br
                after=audit_kernel(kernel)
                need(after==before,'ORIGINAL_R5S2_KERNEL_CHANGED_DURING_SOURCE_PORT')
                report['status']='SOURCE_PORT_STAGED_PENDING_FULL_COMPILER_ABI_RECHECK'
                report['source_updates_staged']=True
                report['all_device_source_files_unchanged']=True
            except (PortBlocked, OSError, subprocess.TimeoutExpired) as e:
                report['status']='BLOCKED_NO_IMAGE_EXPORTED'
                report['blocker']=str(e)[:1600]
            finally:
                (d/'R55H17_R2_RESULT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
                print('R55H17_R2_STATUS='+report['status'],flush=True)
                if 'blocker' in report:print('BLOCKER='+report['blocker'],flush=True)
            return 0 if report['status']=='SOURCE_PORT_STAGED_PENDING_FULL_COMPILER_ABI_RECHECK' else 23

        if __name__=='__main__':sys.exit(main())
        PY_R55H17_PORT
        printf '%s  %s\n' 'cf0ab5199ca2b2054c4e93ac532ced576409f241aea991ce9dca4d6fc01600b6' "$RUNNER_TEMP/veux-r55h17-r2-port.py" | sha256sum -c -
        python3 -B "$RUNNER_TEMP/veux-r55h17-r2-port.py" \
          --kernel "$RUNNER_TEMP/veux-r5s2-work/builds/5.4.274/source-work/kernel" \
          --bakasu "$RUNNER_TEMP/BakaSU35252" \
          --nomount-old "$RUNNER_TEMP/NoMountR5S2" \
          --nomount-new "$RUNNER_TEMP/NoMount22" \
          --out "$RUNNER_TEMP/veux-r55h17-r2-evidence"
