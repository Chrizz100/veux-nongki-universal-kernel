        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test -z "$(git status --porcelain --untracked-files=all)"
        echo 'R5S2_GENUINE_GIT_VERSION_CANDIDATE_REPOSITORY_UNMODIFIED=PASS'
        echo 'R5S2_SUSFS_5_10_HOST_PATCH_NOT_FORCED=YES'
        echo 'R5S2_MANAGER_KSUD_USERLAND_522_NOT_CLAIMED=YES'
        echo 'R5S2_VERSION_35234_PURE_GIT_COMMIT_ONLY=YES'
